<fz-sales-routing-shell>
  <div class="sales-routing-gateway">
    @switch (gateway()) {
      @case ('retailSetupError') {
        <ignt-alert
          class="sales-routing-gateway__alert"
          data-testid="sales-routing-gateway-error"
          sentiment="danger"
          [description]="'salesRouting.salesRoutingError' | translate"
        />
      }
      @case ('emptyRetailSetup') {
        <fz-empty-state
          class="sales-routing-gateway__empty-state"
          title="salesRouting.emptyRetailState.title"
          description="salesRouting.emptyRetailState.description"
          label="salesRouting.emptyRetailState.label"
          testId="sales-routing-state"
          showLeadingIcon
          (emptyStateClick)="navigateToCatalogIntegrations()"
        />
      }
    }
  </div>
</fz-sales-routing-shell>
