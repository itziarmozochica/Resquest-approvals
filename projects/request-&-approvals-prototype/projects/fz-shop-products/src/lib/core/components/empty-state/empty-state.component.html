<ignt-wrapper-card class="empty-state" [type]="'unwrapped'">
  <div class="empty-state__content">
    <p class="empty-state__title">{{ title() | translate }}</p>
    <p class="empty-state__description">{{ description() | translate }}</p>
    <button
      type="button"
      igntButton
      [attr.data-testid]="actionTestId()"
      [leadingIcon]="showLeadingIcon() ? leadingIcon() : null"
      (click)="emptyStateClick.emit()"
    >
      {{ label() | translate }}
    </button>
  </div>
</ignt-wrapper-card>
