<section class="retail" [attr.aria-label]="'menu.catalogIntegration' | translate">
  @if (isLoading()) {
    <!-- The routed page is destroyed while the store loads, so the shell keeps the title on screen. -->
    <fz-retail-page-title />
    <div class="retail__loading" data-testid="retail-loading" role="status" [attr.aria-label]="'common.loading' | translate">
      <ignt-icon aria-hidden="true" name="spinner" size="h1" variant="solid" [spin]="true" />
    </div>
  } @else {
    <router-outlet />
  }
</section>
