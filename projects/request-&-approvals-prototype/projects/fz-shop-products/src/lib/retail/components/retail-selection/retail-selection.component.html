<ignt-dialog-header>
  {{ 'retailSetup.createRetailModal.header.title' | translate }}
</ignt-dialog-header>
<ignt-dialog-content>
  <form data-testid="retail-selection-form" class="retail-selection__platform-form" [formGroup]="selectRetailForm">
    @for (option of retailSelectOptions(); track option.type) {
      <fz-retail-select-option
        [optionControl]="selectRetailForm.controls.retailType"
        [selectedValue]="option.type"
        [isOptionActive]="selectRetailForm.get('retailType')?.value === option.type"
        [iconSrc]="option.iconSrc"
        [title]="option.title | translate"
        [description]="option.description | translate"
      />
    }
  </form>
</ignt-dialog-content>
<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="secondary" (click)="closeSelectRetailSheet(null)">{{ 'common.cancel' | translate }}</button>
  <button type="button" igntButton [disabled]="retailTypeControl.value === null" (click)="closeSelectRetailSheet(retailTypeControl.value)">
    {{ 'common.continue' | translate }}
  </button>
</ignt-dialog-footer>
