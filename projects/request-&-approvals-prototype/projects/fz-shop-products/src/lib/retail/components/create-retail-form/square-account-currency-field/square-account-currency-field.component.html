@if (visible()) {
  <div class="square-account-currency-field">
    <ignt-typeahead
      data-testid="create-form-square-account-currency-select"
      [editable]="false"
      [emptyLabel]="`${translationBase}.placeholder` | translate"
      [fieldLabel]="`${translationBase}.label` | translate"
      [options]="options()"
      [selectedOption]="selectedOption()"
      (selected)="selected.emit($event)"
    />
    <p class="square-account-currency-field__helper" data-testid="create-form-square-account-currency-helper">
      {{ `${translationBase}.helperText` | translate }}
    </p>
  </div>
}
