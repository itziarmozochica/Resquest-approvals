<label class="retail-select-option__item" [class.retail-select-option__item--active]="isOptionActive()">
  <img alt="" class="retail-select-option__icon" aria-hidden="true" height="32" width="32" [ngSrc]="iconSrc()" />
  <span class="retail-select-option__label">
    <span class="retail-select-option__label--title">{{ title() }}</span>
    <span class="retail-select-option__label--description">{{ description() }}</span>
  </span>
  <input
    type="radio"
    class="retail-select-option__input"
    [attr.data-testid]="'retail-select-option-input-' + selectedValue()"
    [formControl]="optionControl()"
    [value]="selectedValue()"
  />
</label>
