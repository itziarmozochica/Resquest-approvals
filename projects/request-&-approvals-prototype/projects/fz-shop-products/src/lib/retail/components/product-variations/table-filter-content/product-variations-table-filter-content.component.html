<ignt-dialog-header>
  {{ 'retailSetup.productVariations.filters.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="product-variations-filter-panel" data-testid="product-variations-filter-panel">
    @for (field of multiSelectFields(); track field.filterName) {
      <app-multi-select
        [attr.data-testid]="field.testId"
        [displayInPlaceMaximum]="2"
        [options]="field.options"
        [placeholder]="field.label | translate"
        [searchPlaceholder]="field.searchPlaceholder | translate"
        [selectedOptions]="field.selected"
        (selected)="onMultiSelectSelection(field.filterName, $event)"
      />
    }

    <fz-retail-column-visibility
      [checkboxControl]="filterForm.controls.showExternalId"
      [label]="'retailSetup.productVariations.columnVisibility.showExternalId'"
      [title]="'retailSetup.productVariations.columnVisibility.sectionTitle'"
    />
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="primary" (click)="applyFilter()">
    {{ 'retailSetup.productVariations.filters.apply' | translate }}
  </button>
  <button type="button" igntButton sentiment="secondary" (click)="clearFilters()">
    {{ 'retailSetup.productVariations.filters.clear' | translate }}
  </button>
</ignt-dialog-footer>
