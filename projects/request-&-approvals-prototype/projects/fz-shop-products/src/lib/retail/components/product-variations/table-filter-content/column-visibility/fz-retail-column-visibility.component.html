<div class="column-visibility" data-testid="fz-retail-column-visibility">
  <p class="column-visibility__title">
    {{ title() | translate }}
  </p>
  <label class="column-visibility__row">
    <input
      class="column-visibility__checkbox"
      type="checkbox"
      data-testid="fz-retail-column-visibility-checkbox"
      [formControl]="checkboxControl()"
    />
    <span class="column-visibility__label">
      {{ label() | translate }}
    </span>
  </label>
</div>
