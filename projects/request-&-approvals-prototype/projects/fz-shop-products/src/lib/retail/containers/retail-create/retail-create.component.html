<div class="retail-create">
  @if (selectedRetailOptionType(); as type) {
    @if (type === 'odoo' && isLoadingAccounts()) {
      <div
        class="retail-create__loading"
        data-testid="retail-create-loading"
        role="status"
        [attr.aria-label]="'common.loading' | translate"
      >
        <ignt-icon aria-hidden="true" name="spinner" size="h1" variant="solid" [spin]="true" />
      </div>
    } @else {
      <fz-create-retail-form
        [error]="error()"
        [isLoading]="isLoading()"
        [retailSetupAccounts]="retailSetupAccounts()"
        [selectedRetailOptionType]="type"
        (cancelCreation)="cancelCreation()"
        (createRetail)="createRetail($event)"
      />
    }
  } @else {
    @if (accountsError() !== null) {
      <ignt-alert
        class="retail-create__accounts-error-alert"
        data-testid="retail-create-accounts-error"
        sentiment="danger"
        [description]="'retailSetup.createRetailForm.accountsError' | translate"
      />
    }
    <fz-empty-state
      class="retail-create__empty-state"
      testId="catalog-integration-empty-state"
      showLeadingIcon
      description="retailSetup.retailEmptyState.description"
      label="retailSetup.retailEmptyState.label"
      title="retailSetup.retailEmptyState.title"
      (emptyStateClick)="emptyStateClick()"
    />
  }
</div>
