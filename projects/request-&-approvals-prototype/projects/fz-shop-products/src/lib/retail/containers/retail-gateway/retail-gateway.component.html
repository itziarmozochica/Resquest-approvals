<div class="retail-gateway">
  <fz-retail-page-title />
  @switch (gateway()) {
    @case ('retailsError') {
      <ignt-alert
        class="retail-gateway__alert"
        data-testid="retail-gateway-error"
        sentiment="danger"
        [description]="'retailSetup.retailError' | translate"
      />
    }
    @case ('createRetail') {
      <fz-retail-create />
    }
  }
</div>
