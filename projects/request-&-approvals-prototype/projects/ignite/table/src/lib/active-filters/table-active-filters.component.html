@if (hasSelectedPills()) {
  <div class="ignt-table-active-filters" data-testid="ignt-table-active-filters">
    <div class="ignt-table-active-filters__pills">
      @for (pill of selectedPills(); track pill.id) {
        <ignt-pill type="secondary" [disabled]="pill.disabled ?? false" [label]="pill.label" (clicked)="onPillClick(pill)" />
      }
    </div>
    <button type="button" class="ignt-table-active-filters__clear" data-testid="ignt-table-active-filters-clear" (click)="clearAll.emit()">
      {{ clearAllLabel() }}
    </button>
  </div>
}
