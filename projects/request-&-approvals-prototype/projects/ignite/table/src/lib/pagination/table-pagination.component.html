<div class="ignt-table-pagination">
  <span class="ignt-table-pagination__range">{{ paginationRangeLabel() }}</span>
  <div class="ignt-table-pagination__arrows">
    <button
      type="button"
      ignt-icon-button
      class="ignt-table-pagination__arrow"
      size="small"
      variant="sharp"
      sentiment="tertiary"
      aria-label="Previous page"
      [icon]="['fas', 'chevron-left']"
      [disabled]="!canPreviousPage() || disabled()"
      (click)="onPrevious()"
    ></button>
    <button
      type="button"
      ignt-icon-button
      class="ignt-table-pagination__arrow"
      size="small"
      variant="sharp"
      sentiment="tertiary"
      aria-label="Next page"
      [icon]="['fas', 'chevron-right']"
      [disabled]="!canNextPage() || disabled()"
      (click)="onNext()"
    ></button>
  </div>
</div>
