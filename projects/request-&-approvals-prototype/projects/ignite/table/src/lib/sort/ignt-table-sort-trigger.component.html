<button
  type="button"
  class="ignt-table__header-sort-trigger"
  [attr.aria-label]="headerView().sortAriaLabel"
  [attr.data-testid]="'ignt-table-header-sort-' + headerView().columnId"
  [attr.disabled]="isLoading() ? '' : null"
  [class.ignt-table__header-sort-trigger--active]="headerView().isSortActive"
  [class.ignt-table__header-sort-trigger--align-left]="headerView().align === 'left'"
  [class.ignt-table__header-sort-trigger--align-center]="headerView().align === 'center'"
  [class.ignt-table__header-sort-trigger--align-right]="headerView().align === 'right'"
  (click)="onClick($event)"
>
  <span class="ignt-table__header-cell-text">{{ headerView().label }}</span>
  <ignt-icon
    aria-hidden="true"
    class="ignt-table__header-sort-icon"
    size="sm"
    variant="regular"
    [class.ignt-table__header-sort-icon--active]="headerView().isSortActive"
    [name]="headerView().sortIcon"
  />
</button>
