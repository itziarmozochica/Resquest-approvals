@if (isExpandable() ?? subRowCount() > 0) {
  <ignt-icon class="ignt-table__parent-label-chevron" variant="light" [name]="isExpanded() ? 'chevron-down' : 'chevron-right'" />
}
<span class="ignt-table__parent-label-text">{{ label() }}</span>
<span class="ignt-table__parent-label-count">{{ subRowCount() }}</span>
