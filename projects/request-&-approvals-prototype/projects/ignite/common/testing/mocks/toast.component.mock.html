<p
  class="mock-ignt-toast__description"
  data-testid="ignt-toast-description"
  [attr.data-close-button-aria-label]="closeButtonAriaLabel()"
  [attr.data-duration]="duration()"
  [attr.data-sentiment]="sentiment()"
  [attr.data-show-close-button]="showCloseButton()"
>
  {{ description() }}
</p>

@if (title(); as title) {
<p data-testid="ignt-toast-title">{{ title }}</p>
} @if (content(); as content) {
<ng-container *ngTemplateOutlet="content" />
} @if (actions(); as actions) {
<ng-container *ngTemplateOutlet="actions" />
} @else if (actionLabel(); as actionLabel) {
<button type="button" data-testid="ignt-toast-action-button" (click)="actionClicked.emit()">{{ actionLabel }}</button>
} @if (showCloseButton()) {
<button type="button" data-testid="ignt-toast-close-button" (click)="dismissed.emit()">Close</button>
}
