@if (title()) {
<p data-testid="ignt-alert-title">{{ title() }}</p>
} @if (contentTemplate(); as contentTemplate) {
<ng-container *ngTemplateOutlet="contentTemplate" />
} @else if (description()) {
<p data-testid="ignt-alert-description" [attr.data-sentiment]="sentiment()">{{ description() }}</p>
} @if (actionsTemplate(); as actionsTemplate) {
<ng-container *ngTemplateOutlet="actionsTemplate" />
} @else if (actionLabel() !== undefined) {
<button type="button" data-testid="ignt-alert-action-button" (click)="actionClicked.emit()">{{ actionLabel() }}</button>
} @if (showCloseButton()) {
<button type="button" data-testid="ignt-alert-close-button" [attr.aria-label]="closeButtonAriaLabel()" (click)="closeAlert.emit()"></button>
}
