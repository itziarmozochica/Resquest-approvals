<ignt-dialog-header hideCloseButton data-testid="modal-title"> {{ title }} </ignt-dialog-header>
<ignt-dialog-content data-testid="modal-message"> {{ message }} </ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <ignt-button fill variant="primary" data-testid="modal-accept-button" [label]="translations().okButton" [igntDialogClose]="true" />
</ignt-dialog-footer>
