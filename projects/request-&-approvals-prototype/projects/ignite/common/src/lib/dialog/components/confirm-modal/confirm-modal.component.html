<ignt-dialog-header data-testid="confirm-modal-title" hideCloseButton>{{ title }}</ignt-dialog-header>
<ignt-dialog-content data-testid="confirm-modal-message">{{ message }}</ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <ignt-button
    fill
    variant="tertiary"
    data-testid="confirm-modal-cancel-button"
    [label]="translations().cancelButton"
    [igntDialogClose]="false"
  />
  <ignt-button
    fill
    variant="primary"
    data-testid="confirm-modal-accept-button"
    [label]="translations().okButton"
    [sentiment]="acceptSentiment"
    [igntDialogClose]="true"
  />
</ignt-dialog-footer>
