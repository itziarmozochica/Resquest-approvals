@if (auxiliaryContent()) {
  <div class="ignt-dialog-header__auxiliary-content">
    <ng-container *ngTemplateOutlet="auxiliaryContentResolved()" />
  </div>
}

<h5 class="ignt-dialog-header__title" [class.ignt-dialog-header__title--no-close-button]="hideCloseButton()">
  <ng-content />
</h5>

@if (!hideCloseButton()) {
  <button
    type="button"
    igntDialogClose
    ignt-icon-button
    variant="sharp"
    sentiment="tertiary"
    [attr.aria-label]="translations().closeAriaLabel"
    [attr.cdkFocusInitial]="focusCloseButton() ? '' : null"
    [icon]="['fas', 'times']"
  ></button>
}
