<div class="ignt-progress-stepper-track-dot" [class.ignt-progress-stepper-track-dot--disabled]="disabled()">
  <span class="ignt-progress-stepper-track-dot__slot">
    @if (isInteractive()) {
      <button
        class="ignt-progress-stepper-track-dot__hit"
        data-testid="ignt-progress-stepper-track-dot"
        type="button"
        [attr.aria-current]="isCurrent() ? 'step' : null"
        [attr.aria-disabled]="disabled() ? 'true' : null"
        [attr.aria-label]="ariaLabel()"
        (click)="onActivate()"
      >
        <span
          class="ignt-progress-stepper-track-dot__marker"
          [class.ignt-progress-stepper-track-dot__marker--active]="state() === 'active'"
          [class.ignt-progress-stepper-track-dot__marker--completed]="state() === 'completed'"
          [class.ignt-progress-stepper-track-dot__marker--current]="isCurrent()"
          [class.ignt-progress-stepper-track-dot__marker--error]="state() === 'error'"
        ></span>
      </button>
    } @else {
      <span class="ignt-progress-stepper-track-dot__hit ignt-progress-stepper-track-dot__hit--static">
        <span
          class="ignt-progress-stepper-track-dot__marker ignt-progress-stepper-track-dot__marker--upcoming"
          data-testid="ignt-progress-stepper-track-dot"
          [class.ignt-progress-stepper-track-dot__marker--current]="isCurrent()"
        ></span>
      </span>
    }
  </span>
  @if (showConnector()) {
    <span
      class="ignt-progress-stepper-track-dot__connector"
      aria-hidden="true"
      [class.ignt-progress-stepper-track-dot__connector--reached]="connectorReached()"
    ></span>
  }
</div>
