<div class="ignt-progress-stepper-header__row">
  <ignt-progress-stepper-step-number-badge [state]="current().state" [stepNumber]="current().stepNumber" />
  <div class="ignt-progress-stepper-header__copy">
    @if (showStepCount()) {
      <p class="ignt-progress-stepper-header__step-count" data-testid="ignt-progress-stepper-step-count">
        {{ stepCountText() }}
      </p>
    }
    <h2 class="ignt-progress-stepper-header__title" data-testid="ignt-progress-stepper-title">
      {{ current().item.label }}
    </h2>
    <!--
      The description sits beside the badge on desktop and below it on mobile. The badge is
      taller than the title, so a single element cannot occupy both slots without opening a
      gap in one of them: each breakpoint renders its own copy and hides the other.
    -->
    @if (current().hasDescription) {
      <p
        class="ignt-progress-stepper-header__description ignt-progress-stepper-header__description--desktop"
        data-testid="ignt-progress-stepper-description-desktop"
      >
        {{ current().item.description }}
      </p>
    }
  </div>
</div>
@if (current().hasDescription) {
  <p
    class="ignt-progress-stepper-header__description ignt-progress-stepper-header__description--mobile"
    data-testid="ignt-progress-stepper-description-mobile"
  >
    {{ current().item.description }}
  </p>
}
