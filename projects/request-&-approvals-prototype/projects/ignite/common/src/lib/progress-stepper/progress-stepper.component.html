<div
  class="ignt-progress-stepper"
  data-testid="ignt-progress-stepper"
  role="group"
  [attr.aria-label]="ariaLabel()"
  [class.ignt-progress-stepper--disabled]="disabled()"
>
  <div class="ignt-progress-stepper__header">
    @if (showStepTrack()) {
      <div class="ignt-progress-stepper__track" data-testid="ignt-progress-stepper-track">
        @for (viewItem of viewItems(); track viewItem.item.id) {
          <ignt-progress-stepper-track-dot
            [ariaLabel]="viewItem.ariaLabel"
            [connectorReached]="viewItem.isConnectorReached"
            [disabled]="disabled() || allowItemActivate() === false"
            [isCurrent]="viewItem.index === resolvedCurrentIndex()"
            [showConnector]="viewItem.showConnector"
            [state]="viewItem.state"
            (clicked)="onItemActivate(viewItem)"
          />
        }
      </div>
    }
    @if (currentViewItem(); as current) {
      <ignt-progress-stepper-header [current]="current" [showStepCount]="showStepTrack()" [stepCountText]="stepCountText()" />
    }
  </div>
  <div class="ignt-progress-stepper__body" data-testid="ignt-progress-stepper-body">
    <ng-content />
  </div>
  @if (showNavigation()) {
    <div class="ignt-progress-stepper__nav">
      <ignt-button
        data-testid="ignt-progress-stepper-back"
        sentiment="neutral"
        size="large"
        variant="tertiary"
        [disabled]="isBackDisabled()"
        [label]="backLabel()"
        [leadingIcon]="backIcon"
        (click)="onBack()"
      />
      <ignt-button
        data-testid="ignt-progress-stepper-next"
        sentiment="brand"
        size="large"
        variant="primary"
        [disabled]="isNextDisabled()"
        [label]="nextLabel()"
        [trailingIcon]="nextIcon"
        (click)="onNext()"
      />
    </div>
  }
</div>
