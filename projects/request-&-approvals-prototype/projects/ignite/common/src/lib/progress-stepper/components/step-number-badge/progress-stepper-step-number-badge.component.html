<div
  class="ignt-progress-stepper-step-number-badge"
  data-testid="ignt-progress-stepper-step-number-badge"
  [class.ignt-progress-stepper-step-number-badge--upcoming]="state() === 'upcoming'"
  [class.ignt-progress-stepper-step-number-badge--active]="state() === 'active'"
  [class.ignt-progress-stepper-step-number-badge--completed]="state() === 'completed'"
  [class.ignt-progress-stepper-step-number-badge--error]="state() === 'error'"
>
  <span class="ignt-progress-stepper-step-number-badge__number">{{ stepNumber() }}</span>
  @if (state() === 'completed') {
    <span
      class="ignt-progress-stepper-step-number-badge__accent ignt-progress-stepper-step-number-badge__accent--completed"
      aria-hidden="true"
    >
      <ignt-icon aria-hidden="true" name="check" size="caption" variant="solid" />
    </span>
  }
  @if (state() === 'error') {
    <span class="ignt-progress-stepper-step-number-badge__accent ignt-progress-stepper-step-number-badge__accent--error" aria-hidden="true">
      !
    </span>
  }
</div>
