<button
  class="button"
  data-testid="ignt-button"
  igntRipple
  [attr.aria-busy]="loading() || null"
  [attr.aria-disabled]="blocked() || null"
  [attr.aria-expanded]="ariaExpanded() ?? null"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.type]="htmlType()"
  [class.button--contrast]="contrast()"
  [class.button--disabled]="blocked()"
  [class.button--fab]="fab()"
  [class.button--icon-only-leading]="onlyLeadingIcon()"
  [class.button--icon-only-trailing]="onlyTrailingIcon()"
  [class.button--loading]="loading()"
  [class.button--large]="size() === 'large'"
  [class.button--small]="size() === 'small'"
  [class.button--primary]="variant() === 'primary'"
  [class.button--secondary]="variant() === 'secondary'"
  [class.button--tertiary]="variant() === 'tertiary'"
  [class.button--brand]="sentiment() === 'brand'"
  [class.button--danger]="sentiment() === 'danger'"
  [class.button--positive]="sentiment() === 'positive'"
  [class.button--neutral]="sentiment() === 'neutral'"
  [rippleDisabled]="blocked()"
  (click)="onClick($event)"
>
  @if (leadingIcon(); as icon) {
    <ignt-icon aria-hidden="true" class="button__icon" [name]="icon.name" [variant]="icon.variant" [size]="iconSize()" />
  }
  <span class="button__label">{{ label() }}</span>
  @if (trailingIcon(); as icon) {
    <ignt-icon aria-hidden="true" class="button__icon" [name]="icon.name" [variant]="icon.variant" [size]="iconSize()" />
  }
  @if (loading()) {
    <span class="button__spinner">
      <ignt-icon
        aria-hidden="true"
        class="button__icon button__icon--loading"
        variant="duotone"
        name="spinner-third"
        [size]="iconSize()"
        [spin]="true"
      />
    </span>
  }
</button>
