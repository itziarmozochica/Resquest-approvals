<div
  class="ignt-toast"
  data-testid="ignt-toast"
  [class.ignt-toast--with-close]="showCloseButton()"
  [class.ignt-toast--with-title]="title()"
  [class.ignt-toast--info]="sentiment() === 'info'"
  [class.ignt-toast--accent]="sentiment() === 'accent'"
  [class.ignt-toast--positive]="sentiment() === 'positive'"
  [class.ignt-toast--warning]="sentiment() === 'warning'"
  [class.ignt-toast--danger]="sentiment() === 'danger'"
  [class.ignt-toast--neutral]="sentiment() === 'neutral'"
>
  @if (icon(); as iconName) {
    <div class="ignt-toast__icon-wrapper">
      <ignt-icon aria-hidden="true" class="ignt-toast__icon" size="sm" variant="solid" [name]="iconName" />
    </div>
  }
  <div class="ignt-toast__container">
    <div class="ignt-toast__content">
      @if (title(); as title) {
        <p class="ignt-toast__title" data-testid="ignt-toast-title">{{ title }}</p>
      }
      @if (content(); as content) {
        <ng-container *ngTemplateOutlet="content" />
      } @else {
        <p class="ignt-toast__description" data-testid="ignt-toast-description">{{ description() }}</p>
      }
    </div>
    @if (actions(); as actions) {
      <div class="ignt-toast__actions">
        <ng-container *ngTemplateOutlet="actions" />
      </div>
    } @else if (actionLabel(); as actionLabel) {
      <div class="ignt-toast__actions">
        <ignt-button contrast sentiment="neutral" size="small" variant="secondary" [label]="actionLabel" (click)="actionClicked.emit()" />
      </div>
    }
  </div>
  @if (showCloseButton()) {
    <button
      type="button"
      class="ignt-toast__close-button"
      data-testid="ignt-toast-close-button"
      [attr.aria-label]="closeButtonAriaLabel()"
      (click)="onClose()"
    >
      <span class="ignt-toast__close-icon-wrapper">
        <ignt-icon aria-hidden="true" class="ignt-toast__close-icon" name="times" size="sm" variant="solid" />
      </span>
    </button>
  }
  <div
    class="ignt-toast__progress"
    aria-hidden="true"
    data-testid="ignt-toast-progress"
    [class.ignt-toast__progress--paused]="isPaused()"
    [hidden]="isPersistent()"
  ></div>
</div>
