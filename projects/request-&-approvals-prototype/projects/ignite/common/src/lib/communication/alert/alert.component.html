<div
  class="ignt-alert"
  [class.ignt-alert--with-close]="showCloseButton()"
  [class.ignt-alert--with-title]="title()"
  [class.ignt-alert--info]="sentiment() === 'info'"
  [class.ignt-alert--accent]="sentiment() === 'accent'"
  [class.ignt-alert--positive]="sentiment() === 'positive'"
  [class.ignt-alert--warning]="sentiment() === 'warning'"
  [class.ignt-alert--danger]="sentiment() === 'danger'"
  [class.ignt-alert--neutral]="sentiment() === 'neutral'"
>
  @if (displayedIcon(); as iconName) {
    <div class="ignt-alert__icon-wrapper">
      <ignt-icon aria-hidden="true" class="ignt-alert__icon" size="sm" variant="solid" [name]="iconName" />
    </div>
  }
  <div class="ignt-alert__container">
    <div class="ignt-alert__content">
      @if (title()) {
        <p class="ignt-alert__title" data-testid="ignt-alert-title">{{ title() }}</p>
      }
      @if (contentTemplate(); as contentTemplate) {
        <ng-container *ngTemplateOutlet="contentTemplate" />
      } @else {
        @if (description()) {
          <p class="ignt-alert__description" data-testid="ignt-alert-description">{{ description() }}</p>
        }
      }
    </div>
    @if (hasAction()) {
      <div class="ignt-alert__actions">
        @if (actionsTemplate(); as actionsTemplate) {
          <ng-container *ngTemplateOutlet="actionsTemplate" />
        } @else {
          <ignt-button sentiment="brand" size="small" variant="secondary" [label]="actionLabel()!" (click)="actionClicked.emit()" />
        }
      </div>
    }
  </div>
  @if (showCloseButton()) {
    <button
      ignt-icon-button
      type="button"
      class="ignt-alert__close-button"
      data-testid="ignt-alert-close-button"
      sentiment="tertiary"
      size="small"
      variant="sharp"
      [attr.aria-label]="closeButtonAriaLabel()"
      [icon]="['fas', 'times']"
      (click)="onClose()"
    ></button>
  }
</div>
