<div
  class="ignt-accordion-item"
  data-testid="ignt-accordion-item"
  [class.ignt-accordion-item--band]="variant() === 'band'"
  [class.ignt-accordion-item--card]="variant() === 'card'"
  [class.ignt-accordion-item--expanded]="expanded()"
  [class.ignt-accordion-item--list]="variant() === 'list'"
  [class.ignt-accordion-item--panel]="variant() === 'panel'"
  [class.ignt-accordion-item--plain]="variant() === 'plain'"
>
  <button
    class="ignt-accordion-item__header"
    type="button"
    data-testid="ignt-accordion-item-header"
    [attr.aria-controls]="expanded() ? bodyId : null"
    [attr.aria-expanded]="expanded()"
    [id]="headerId"
    (click)="toggle()"
  >
    <ignt-icon
      aria-hidden="true"
      class="ignt-accordion-item__chevron"
      [class.ignt-accordion-item__chevron--expanded]="expanded()"
      [name]="chevronName()"
      [size]="chevron().size"
      [variant]="chevron().variant"
    />
    <ng-content select="[igntAccordionLeading]" />
    <span class="ignt-accordion-item__title">{{ label() }}<ng-content select="[igntAccordionTitle]" /></span>
    <span class="ignt-accordion-item__trailing">
      <ng-content select="[igntAccordionTrailing]" />
    </span>
  </button>

  @if (expanded()) {
    <div
      class="ignt-accordion-item__body"
      role="region"
      data-testid="ignt-accordion-item-body"
      [attr.aria-labelledby]="headerId"
      [id]="bodyId"
    >
      <ng-content />
      @if (bodyTemplate(); as body) {
        <ng-container [ngTemplateOutlet]="body.templateRef" />
      }
    </div>
  }
</div>
