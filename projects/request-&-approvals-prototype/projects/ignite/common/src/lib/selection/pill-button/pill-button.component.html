<div class="ignt-pill-button" [class.ignt-pill-button--checked]="checked()" [class.ignt-pill-button--disabled]="disabled()">
  <button
    type="button"
    class="ignt-pill-button__toggle"
    data-testid="ignt-pill-button"
    igntRipple
    [attr.aria-pressed]="checked()"
    [disabled]="disabled()"
    [name]="value()"
    [rippleDisabled]="disabled()"
    [value]="value()"
    (click)="onToggle()"
  >
    @if (icon(); as pillIcon) {
      <ignt-icon class="ignt-pill-button__icon" size="sm" [name]="pillIcon.name" [variant]="pillIcon.variant" />
    }
    <span class="ignt-pill-button__label">
      {{ label() }}
    </span>
    <ng-content select="ignt-tag" />
  </button>
  @if (showCloseButton()) {
    <button
      ignt-icon-button
      type="button"
      class="ignt-pill-button__close"
      data-testid="ignt-pill-button-close"
      sentiment="tertiary"
      size="small"
      variant="sharp"
      [disabled]="disabled()"
      [icon]="['fas', 'times']"
      (click)="onClose()"
    ></button>
  }
</div>
