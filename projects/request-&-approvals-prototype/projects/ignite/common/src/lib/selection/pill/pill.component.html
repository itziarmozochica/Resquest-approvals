<button
  type="button"
  class="ignt-pill"
  data-testid="ignt-pill"
  [class.ignt-pill--primary]="type() === 'primary'"
  [class.ignt-pill--secondary]="type() === 'secondary'"
  [disabled]="disabled()"
  (click)="onClick($event)"
>
  <span class="ignt-pill__label">
    {{ label() }}
  </span>
  <ignt-icon class="ignt-pill__icon" size="sm" [name]="defaultIcon.name" [variant]="defaultIcon.variant" />
</button>
