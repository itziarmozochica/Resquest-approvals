<button
  type="button"
  class="ignt-option-tile"
  [class.ignt-option-tile--selected]="selected()"
  [class.ignt-option-tile--disabled]="disabled()"
  [class.ignt-option-tile--title-hidden]="hideTitle()"
  [attr.aria-label]="hideTitle() ? title() : null"
  [attr.aria-pressed]="selected()"
  [disabled]="disabled()"
  (click)="tileClick.emit()"
>
  @if (imageUrl(); as url) {
    <span class="ignt-option-tile__image">
      <img class="ignt-option-tile__image-content" alt="" fill [ngSrc]="url" />
    </span>
  } @else if (iconName(); as name) {
    <ignt-icon variant="light" size="h2" aria-hidden="true" class="ignt-option-tile__icon" [name]="name" />
  }
  @if (!hideTitle()) {
    <span class="ignt-option-tile__title">{{ title() }}</span>
  }
  @if (description()) {
    <span class="ignt-option-tile__description">{{ description() }}</span>
  }
</button>
