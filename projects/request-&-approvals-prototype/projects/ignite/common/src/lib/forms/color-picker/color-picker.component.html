<div class="ignt-color-picker">
  <div class="ignt-color-picker__row">
    <input
      #hexInput
      class="ignt-color-picker__hex"
      type="text"
      data-testid="ignt-color-picker-hex"
      spellcheck="false"
      [value]="value()"
      [placeholder]="defaultHex()"
      [attr.aria-label]="ariaLabel()"
      [disabled]="disabled()"
      (input)="onHexInput(hexInput.value)"
      (blur)="onHexBlur(hexInput.value)"
    />
    <input
      #colorInput
      class="ignt-color-picker__picker"
      type="color"
      data-testid="ignt-color-picker-picker"
      [value]="pickerValue()"
      [attr.aria-label]="ariaLabel()"
      [disabled]="disabled()"
      (change)="onPickerChange(colorInput.value)"
    />
  </div>

  @if (presets().length > 0) {
    <div class="ignt-color-picker__presets" role="group" [attr.aria-label]="ariaLabel()">
      @for (hex of presets(); track hex) {
        <button
          class="ignt-color-picker__swatch"
          type="button"
          data-testid="ignt-color-picker-swatch"
          [class.ignt-color-picker__swatch--active]="isPresetActive(hex)"
          [igntColorSwatch]="hex"
          [title]="hex"
          [disabled]="disabled()"
          (click)="onPresetClick(hex)"
        ></button>
      }
    </div>
  }
</div>
