<ng-template #control>
  <button
    class="ignt-switch__control"
    data-testid="ignt-switch"
    role="switch"
    type="button"
    [id]="controlId"
    [attr.aria-checked]="checked()"
    [attr.aria-describedby]="hasDescription() ? descriptionId : (ariaDescribedby() ?? null)"
    [attr.aria-label]="hasLabel() ? null : (ariaLabel() ?? null)"
    [attr.aria-labelledby]="hasLabel() ? labelId : null"
    [class.ignt-switch__control--checked]="checked()"
    [class.ignt-switch__control--disabled]="isDisabled()"
    [disabled]="isDisabled()"
    (blur)="onBlur()"
    (click)="toggle()"
  >
    <span class="ignt-switch__thumb" aria-hidden="true">
      @if (checked() && !isDisabled()) {
        <ignt-icon class="ignt-switch__icon" data-testid="ignt-switch-icon" name="check" size="base" variant="solid" />
      }
    </span>
  </button>
</ng-template>

@if (hasLabel()) {
  <label class="ignt-switch" data-testid="ignt-switch-row" [class.ignt-switch--disabled]="isDisabled()" [for]="controlId">
    <span class="ignt-switch__text">
      <span class="ignt-switch__label" data-testid="ignt-switch-label" [id]="labelId">{{ label() }}</span>
      @if (hasDescription()) {
        <span class="ignt-switch__description" [id]="descriptionId">{{ description() }}</span>
      }
    </span>
    <ng-container [ngTemplateOutlet]="control" />
  </label>
} @else {
  <ng-container [ngTemplateOutlet]="control" />
}
