<div
  class="ignt-file-upload"
  [class.ignt-file-upload--drag-over]="isDragOver()"
  [class.ignt-file-upload--disabled]="disabled()"
  (dragenter)="onDragEnter($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)"
>
  <ignt-icon aria-hidden="true" class="ignt-file-upload__icon" name="arrow-up-from-bracket" size="h2" variant="solid" />

  @if (label()) {
    <p class="ignt-file-upload__label">{{ label() }}</p>
  }

  <ignt-button
    class="ignt-file-upload__action"
    sentiment="brand"
    variant="secondary"
    [disabled]="disabled()"
    [label]="actionLabel()"
    (click)="onBrowseClick()"
  />

  @if (hint()) {
    <p class="ignt-file-upload__hint">{{ hint() }}</p>
  }

  <input
    #fileInput
    class="ignt-file-upload__input"
    hidden
    type="file"
    [accept]="accept().join(',')"
    [disabled]="disabled()"
    [multiple]="multiple()"
    (change)="onFileChange($event)"
  />
</div>

@if (filePills().length > 0) {
  <ul class="ignt-file-upload__files">
    @for (pill of filePills(); track pill.file) {
      <li class="ignt-file-upload__file">
        <ignt-pill-button
          showCloseButton
          [disabled]="disabled()"
          [label]="pill.label"
          [value]="$index"
          (closed)="onFileRemoved(pill.file)"
        />
      </li>
    }
  </ul>
}
