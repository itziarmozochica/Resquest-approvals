<div class="ignt-dropdown" [class.ignt-dropdown--fill]="fill">
  <button
    igntButton
    [disabled]="disabled"
    [fill]="fill"
    [leadingIcon]="leadingIcon"
    [loading]="loading"
    [sentiment]="sentiment"
    [size]="size"
    [variant]="variant"
    [trailingIcon]="opened() ? trailingIconOpened : trailingIconClosed"
    (click)="toggleDropdown($event)"
  >
    <ng-content></ng-content>
  </button>
  @if (opened()) {
    <ignt-wrapper-card
      [elevation]="2"
      [type]="borderless ? 'borderless' : 'default'"
      class="ignt-dropdown-content"
      [class.ignt-dropdown-content--align-right]="align === 'right'"
      [class.ignt-dropdown-content--auto-width]="autoWidth"
    >
      <div class="ignt-dropdown-content__container">
        @for (option of options; track $index) {
          @if (option.divider) {
            <div class="ignt-dropdown-content__divider" role="separator"></div>
          } @else {
            <button
              class="ignt-dropdown-option"
              [class.ignt-dropdown-option--danger]="option.variant === 'danger'"
              [class.ignt-dropdown-option--hover-effect]="hoverEffect"
              [class.ignt-dropdown-option--selected]="option.selected"
              [class.ignt-dropdown-option--disabled]="option.disabled"
              [disabled]="option.disabled"
              [attr.aria-disabled]="option.disabled || null"
              (click)="optionClicked(option)"
            >
              @if (option.leadingIcon) {
                <fa-icon
                  [class]="'ignt-dropdown-option__icon' + ' ignt-dropdown-option__icon--' + (option.variant ?? defaultOptionVariant)"
                  size="sm"
                  [icon]="option.leadingIcon"
                ></fa-icon>
              }
              <span class="ignt-dropdown-option__label">
                {{ option.label }}
              </span>
              @if (option.trailingIcon) {
                <fa-icon
                  [class]="'ignt-dropdown-option__icon' + ' ignt-dropdown-option__icon--' + (option.variant ?? defaultOptionVariant)"
                  size="sm"
                  [icon]="option.trailingIcon"
                ></fa-icon>
              }
            </button>
          }
        }
      </div>
    </ignt-wrapper-card>
  }
</div>
