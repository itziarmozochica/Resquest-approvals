<ignt-wrapper-card [type]="wrapperType">
  <div class="ignt-content-card">
    <div>
      <div class="font-base-bold">
        {{ title }}
        <ng-container *ngIf="title.length === 0">
          <ng-content select="[toggleCardTitle]"></ng-content>
        </ng-container>
      </div>
      <div class="font-small-regular content-card__description">{{ description }}</div>
    </div>
    <ignt-toggle [checked]="checked" [disabled]="disabled" [id]="id" />
  </div>
</ignt-wrapper-card>
