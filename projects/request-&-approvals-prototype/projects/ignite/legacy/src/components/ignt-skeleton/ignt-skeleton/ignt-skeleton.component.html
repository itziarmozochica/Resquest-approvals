<div class="skeleton" [class.skeleton--animation]="animation" [class.skeleton--bordered]="isBordered" [class.skeleton--contrast]="contrast">
  <ng-container *ngIf="type === 'list'">
    <div [style.height.px]="height !== null ? height : ''" class="skeleton__list">
      <ignt-skeleton-base [height]="40" [width]="'50%'" [contrast]="contrast"></ignt-skeleton-base>
      <ignt-skeleton-base [height]="30" [contrast]="contrast"></ignt-skeleton-base>
      <ignt-skeleton-base [height]="10" [contrast]="contrast" *ngFor="let _ of [].constructor(numElements)"></ignt-skeleton-base>
    </div>
  </ng-container>

  <ng-container *ngIf="type === 'card'">
    <div>
      <div class="skeleton__card" *ngIf="!cardImageOnTop; else skeletonCardImageOnTop">
        <div class="image" [class.image--contrast]="contrast"></div>

        <div class="content">
          <ignt-skeleton-base *ngIf="isCardTitleVisible" [height]="40" [width]="'50%'" [contrast]="contrast"></ignt-skeleton-base>
          <ignt-skeleton-base *ngIf="isCardSubtitleVisible" [height]="30" [contrast]="contrast"></ignt-skeleton-base>
          <ignt-skeleton-base [height]="10" [contrast]="contrast" *ngFor="let _ of [].constructor(numElements)"></ignt-skeleton-base>
        </div>
      </div>

      <ng-template #skeletonCardImageOnTop>
        <div class="skeleton__card-image-on-top">
          <ignt-skeleton-base [height]="height" [width]="'100%'" [contrast]="contrast"></ignt-skeleton-base>
          <ignt-skeleton-base
            [alignment]="alignment"
            *ngIf="isCardTitleVisible"
            [height]="40"
            [width]="'50%'"
            [contrast]="contrast"
          ></ignt-skeleton-base>
          <ignt-skeleton-base
            [alignment]="alignment"
            *ngIf="isCardSubtitleVisible"
            [height]="30"
            [contrast]="contrast"
          ></ignt-skeleton-base>
          <ignt-skeleton-base [height]="10" [contrast]="contrast" *ngFor="let _ of [].constructor(numElements)"></ignt-skeleton-base>
        </div>
      </ng-template>
    </div>
  </ng-container>

  <ng-container *ngIf="type === 'paragraph'">
    <div class="skeleton__paragraph">
      <ignt-skeleton-base [alignment]="alignment" [height]="40" [width]="'50%'" [contrast]="contrast"></ignt-skeleton-base>
      <ignt-skeleton-base [alignment]="alignment" [height]="30" [contrast]="contrast"></ignt-skeleton-base>
      <ignt-skeleton-base [height]="height" [contrast]="contrast" *ngFor="let _ of [].constructor(numElements)"></ignt-skeleton-base>
    </div>
  </ng-container>

  <ng-container *ngIf="type === 'header'">
    <div [style.height.px]="height ? height : ''" class="skeleton__header">
      <ignt-skeleton-base [alignment]="alignment" [height]="40" [width]="'50%'" [contrast]="contrast"></ignt-skeleton-base>
      <ignt-skeleton-base [alignment]="alignment" [height]="30" [contrast]="contrast"></ignt-skeleton-base>
    </div>
  </ng-container>

  <ng-container *ngIf="type === 'image'">
    <div class="skeleton__image">
      <ignt-skeleton-base [height]="height" [contrast]="contrast" *ngFor="let _ of [].constructor(numElements)"></ignt-skeleton-base>
    </div>
  </ng-container>

  <ng-container *ngIf="type === 'item'">
    <div *ngIf="type === 'item'" [style.height.px]="height ? height : ''" class="skeleton__item">
      <ignt-skeleton-base
        [height]="10"
        [width]="'100%'"
        [contrast]="contrast"
        *ngFor="let _ of [].constructor(numElements)"
      ></ignt-skeleton-base>
    </div>
  </ng-container>

  <ng-container *ngIf="type === 'kiosk-ticket'">
    <div>
      <div class="skeleton__kiosk-ticket" [class.contrast]="contrast" [style.height.px]="height ? height : ''">
        <div class="skeleton__kiosk-ticket__item">
          <ignt-skeleton-base [height]="10" [width]="'40%'" [contrast]="contrast" *ngFor="let _ of [].constructor(2)"></ignt-skeleton-base>
        </div>
        <div class="skeleton__kiosk-ticket__buttons">
          <div class="button" [class.button--contrast]="contrast"></div>
          <ignt-skeleton-base [height]="10" [contrast]="contrast"></ignt-skeleton-base>
          <div class="button" [class.button--contrast]="contrast"></div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
