<div>
  <label [ngClass]="'field ' + class" [attr.data-testid]="'datepicker-input-container'">
    <input
      #datepicker="ngbDatepicker"
      [attr.data-testid]="'datepicker-input'"
      (click)="onFieldClick()"
      [attr.aria-expanded]="inline() ? isOpen : null"
      [attr.aria-controls]="inline() ? collapsibleId : null"
      [(ngModel)]="selectedDate"
      (input)="checkEmptyValue()"
      [readonly]="isTouchDevice"
      [attr.autocomplete]="'off'"
      [attr.autocapitalize]="'off'"
      [attr.autocorrect]="'off'"
      [placeholder]="'yyyy-mm-dd'"
      [placement]="'top'"
      [class.has-error]="hasError()"
      class="field__input"
      ngbDatepicker
    />
    <span class="field__label">{{ label }}</span>
    <ignt-icon class="field__icon field__icon--trail" name="calendar-day" variant="light" [fixedWidth]="true" />
  </label>
  <ng-template #calendar>
    <ngb-datepicker
      #datepicker
      (dateSelect)="onDateSelect()"
      [(ngModel)]="selectedDate"
      [startDate]="selectedDate"
      [minDate]="minDateNgb"
      class="date-range-picker"
      [class.oss-custom-styles]="isOneStopShop"
      [class.date-range-picker--inline]="inline()"
    >
    </ngb-datepicker>
  </ng-template>
  @if (inline()) {
    <div
      class="date-range-picker-collapsible"
      data-testid="datepicker-collapsible"
      [id]="collapsibleId"
      [class.date-range-picker-collapsible--open]="isOpen"
      [attr.inert]="isOpen ? null : ''"
      (transitionend)="onCollapsibleTransitionEnd($event)"
    >
      <div class="date-range-picker-collapsible__body">
        <ng-container *ngTemplateOutlet="calendar" />
      </div>
    </div>
  } @else if (isOpen) {
    <ng-container *ngTemplateOutlet="calendar" />
  }
</div>
