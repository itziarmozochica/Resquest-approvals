<input
  [id]="inputId"
  [type]="type"
  class="ignt-native-date-input"
  [class.has-error]="hasError"
  [value]="value"
  [min]="min"
  [disabled]="disabled()"
  (change)="onInputChange($event)"
  (blur)="onInputBlur()"
  [attr.data-testid]="testId || null"
/>
<ignt-field-error *ngIf="hasError && errorMessage" [showError]="hasError">
  {{ errorMessage }}
</ignt-field-error>
