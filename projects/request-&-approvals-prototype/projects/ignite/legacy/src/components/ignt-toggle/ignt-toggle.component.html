<label class="toggle">
  <input
    class="toggle__input"
    type="checkbox"
    data-testid="ignt-toggle-input"
    [id]="id"
    [checked]="checked"
    [disabled]="disabled"
    (change)="onChangeToggle($event)"
  />
  <div class="toggle__container">
    <div class="toggle__switch">
      <fa-icon class="toggle__icon" [fixedWidth]="true" [icon]="['fas', 'check']"></fa-icon>
    </div>
  </div>
</label>
