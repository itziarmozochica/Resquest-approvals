<div class="points-card">
  <div class="points-card__main">
    <div class="points-card__title">
      {{ title }}
    </div>
    <div
      class="points-card__bottom-content"
      [ngClass]="{
        'availability--available': status === 'available',
        'availability--soldout': status === 'soldout',
        'availability--unavailable': status === 'unavailable',
      }"
    >
      <div *ngIf="status === 'available'" class="availability-container">
        <div>
          <span *ngIf="availableCount" class="points-card__availability-value">{{ availableCount }}</span>
          <span class="points-card__availability-label">{{ availableText }}</span>
        </div>
        <div *ngIf="validUntil !== null && validUntil.length > 0" class="points-card__valid-until">
          {{ validUntilText }}: {{ validUntil }}
        </div>
      </div>
      <div *ngIf="status === 'soldout'">
        <span class="points-card__status-badge points-card__status-badge--soldout">{{ soldoutText }}</span>
      </div>
      <div *ngIf="status === 'unavailable'">
        <span class="points-card__status-badge points-card__status-badge--unavailable">{{ unavailableText }}</span>
      </div>
    </div>
  </div>
  <div class="points-card__points">
    <span class="points-card__points-value">{{ points }}</span>
    <span class="points-card__points-label">{{ pointsText }}</span>
  </div>
</div>
