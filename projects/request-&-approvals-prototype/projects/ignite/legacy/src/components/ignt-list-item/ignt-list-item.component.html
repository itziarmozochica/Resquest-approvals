<ignt-wrapper-card [type]="itemType" [class.ignt-list-item--clickable]="clickable" [backgroundColor]="backgroundColor" [fullHeight]="true">
  <div class="ignt-list-item__header">
    <ng-content select="[leading-modifier]"></ng-content>
    <ng-template [ngTemplateOutlet]="leadingIconTemplate"></ng-template>
    <fa-icon *ngIf="leadingIcon" [icon]="leadingIcon"></fa-icon>
    <div class="ignt-list-item__text">
      <div class="ignt-list-item__title" [title]="title">{{ title }}</div>
      <div class="ignt-list-item__description" [title]="description">{{ description }}</div>
    </div>
    <ng-content select="[trailing-modifier]"></ng-content>
  </div>

  <ignt-divider *ngIf="divider"></ignt-divider>
  <ng-content></ng-content>
</ignt-wrapper-card>
