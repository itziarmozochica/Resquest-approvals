<label [ngClass]="'field ' + class">
  <textarea
    #textarea
    class="field__textarea"
    [class.has-error]="(igntErrors().length > 0 || hasErrors) && !readonly"
    attr.data-testid="textarea-field__{{ id }}"
    [attr.data-placeholder-as-empty-value]="placeholderAsEmptyValue"
    [readonly]="readonly"
    [disabled]="disabled"
    [id]="id"
    [placeholder]="placeholder || ''"
    [rows]="rows"
    [attr.cols]="cols"
    [attr.maxlength]="maxlength"
    [attr.minlength]="minlength"
    [style.resize]="readonly ? 'none' : resize"
    [(ngModel)]="inputValue"
    (blur)="onBlur()"
  ></textarea>
  @if (label.length > 0) {
    <span class="field__label" [class.field__label--readonly]="readonly">{{ label }}</span>
  }
  @if (igntErrors().length > 0 && !readonly) {
    @for (error of igntErrors(); track error.type) {
      <ignt-field-error [formControlValue]="formControl" [errorName]="error.type">
        {{ error.message }}
      </ignt-field-error>
    }
  }
  @if (helperText.length > 0 && (!hasErrors || readonly)) {
    <span class="field__helper">{{ helperText }}</span>
  }
</label>
