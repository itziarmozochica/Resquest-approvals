<div class="info-card">
  <div class="info-card__header">
    <div *ngIf="icon" class="info-card__icon">
      <fa-icon [icon]="icon"></fa-icon>
    </div>
    <div class="info-card__body">
      <h3 class="info-card__title">{{ title }}</h3>
      <p class="info-card__description">{{ description }}</p>
    </div>
  </div>
  <div class="info-card__footer">
    <ng-container [ngSwitch]="variant">
      <div *ngSwitchCase="'copy-clip'" class="info-card-redemption-code">
        <span class="info-card-redemption-code__code">{{ copyText }}</span>
        <button class="info-card-redemption-code__copy-button" ngxClipboard [cbContent]="copyText" (cbOnSuccess)="onCopySuccess()">
          {{ internalCopyButtonText }}
          <fa-icon [icon]="faClone"></fa-icon>
        </button>
      </div>
      <a *ngSwitchCase="'link'" [href]="linkUrl" class="info-card-link">
        {{ linkText }}
        <fa-icon [icon]="faChevronRight"></fa-icon>
      </a>
      <a *ngSwitchCase="'router-link'" [routerLink]="linkUrl" class="info-card-link">
        {{ linkText }}
        <fa-icon [icon]="faChevronRight"></fa-icon>
      </a>
    </ng-container>
  </div>
</div>
