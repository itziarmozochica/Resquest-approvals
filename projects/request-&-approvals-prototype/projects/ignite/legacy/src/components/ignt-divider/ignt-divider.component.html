<div
  class="ignt-divider__container"
  [class.ignt-divider__container--vertical]="orientation() === 'vertical'"
  [class.ignt-divider__container--margin]="margin()"
>
  <div class="ignt-divider__line" [class]="'ignt-divider__line--' + variant()"></div>
  @if (label(); as label) {
    <span class="ignt-divider__text">{{ label }}</span>
  }
  <div class="ignt-divider__line" [class]="'ignt-divider__line--' + variant()"></div>
</div>
