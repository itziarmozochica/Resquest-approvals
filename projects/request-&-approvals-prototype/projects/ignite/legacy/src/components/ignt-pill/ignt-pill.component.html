<button
  [name]="value"
  [ngClass]="{
    pill: true,
    'pill--disabled': disabled,
    'pill--active': isActive,
    'pill--fluid': fluid,
    'pill--small': size === 'small',
  }"
  (click)="onStatusChange($event)"
  [disabled]="disabled"
>
  <fa-icon *ngIf="leadingIcon" [icon]="leadingIcon" [size]="'sm'" class="pill__icon" />
  <span class="pill__label"> {{ label }} <ng-content></ng-content></span>
  <fa-icon *ngIf="trailingIcon" [icon]="trailingIcon" [size]="'sm'" class="pill__icon" />
</button>
