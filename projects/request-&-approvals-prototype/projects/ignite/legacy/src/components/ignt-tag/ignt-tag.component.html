<span
  [class]="
    baseClass + ' ' + baseClass + '--' + effectiveSentiment() + '-' + variant + (heightAuto ? ' ' + baseClass + '--height-auto' : '')
  "
>
  <fa-icon *ngIf="startIcon" [fixedWidth]="true" [icon]="startIcon"></fa-icon>
  <fa-icon *ngIf="bullet" [class.bullet-icon]="bullet" [fixedWidth]="true" [icon]="bullet"></fa-icon>
  <span [class]="baseClass + '__content'">
    <ng-content></ng-content>
  </span>
  <fa-icon *ngIf="endIcon" [fixedWidth]="true" [icon]="endIcon"></fa-icon>
</span>
