<div class="tabs__header" role="tablist">
  <div
    class="tabs__label"
    role="tab"
    *ngFor="let tab of tabs; let i = index"
    [class.active]="tab.isSelectable && selectedIndex === i"
    [ngClass]="variant"
    [igntTourAnchor]="selectedIndex === i ? tourAnchorId! : ''"
    (click)="onTabClick(tab, i)"
  >
    <fa-icon *ngIf="tab.icon" [icon]="tab.icon"></fa-icon>
    <span [innerHTML]="tab.label()"></span>
  </div>
  <div *ngIf="hasExtraLine" class="extra-line"></div>
</div>
<div class="tabs_content" role="tabpanel">
  @for (tab of tabs; track tab; let i = $index) {
    @if (keepAlive) {
      <ignt-tabs-content [hidden]="selectedIndex !== i" [content]="tab.content" />
    } @else {
      @if (selectedIndex === i) {
        <ignt-tabs-content [content]="tab.content" />
      }
    }
  }
</div>
