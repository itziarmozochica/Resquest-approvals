<div class="rating rating--{{ variant }} rating--{{ size }}">
  <ng-container *ngIf="variant === 'full'; else shortTemplate">
    <span class="rating__score rating__score--contrast-{{ contrast }}" *ngIf="realValuation">({{ score }})</span>
    <ng-container *ngFor="let _ of fullStars; trackBy: trackByIndex">
      <fa-icon class="rating__icon rating__icon--filled" [size]="iconSize" [icon]="['fas', 'star']"></fa-icon>
    </ng-container>
    <ng-container *ngIf="halfStar">
      <fa-icon class="rating__icon rating__icon--half" [size]="iconSize" [icon]="['fas', 'star-half-alt']"></fa-icon>
    </ng-container>
    <ng-container *ngFor="let _ of emptyStars; trackBy: trackByIndex">
      <fa-icon class="rating__icon rating__icon--empty" [size]="iconSize" [icon]="['far', 'star']"></fa-icon>
    </ng-container>
    <span class="rating__count rating__count--contrast-{{ contrast }}" *ngIf="reviewsAmount">({{ ratingsCount }})</span>
  </ng-container>
  <ng-template #shortTemplate>
    <fa-icon class="rating__icon rating__icon--filled" [size]="iconSize" [icon]="['fas', 'star']"></fa-icon>
    <span class="rating__score">
      {{ score }} <span class="rating__max-score" *ngIf="showFive">/{{ maxRating }}</span>
    </span>
  </ng-template>
</div>
