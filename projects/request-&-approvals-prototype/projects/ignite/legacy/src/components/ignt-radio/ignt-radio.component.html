<label [for]="'radio-input' + id" class="radio" [class.disabled]="disabled">
  <div class="radio__container">
    <input
      [id]="'radio-input' + id"
      class="radio__input"
      type="radio"
      (change)="onClick($event)"
      (click)="onClick($event)"
      [value]="value"
      [name]="name"
      [checked]="checked"
      [disabled]="disabled"
      [attr.data-testid]="dataTestId"
    />
    <span class="radio__icon" [class.radio__icon--unchecked]="!checked"></span>
    <div class="radio__text-wrapper" *ngIf="!!label">
      <span *ngIf="!!label" class="radio__label" [class.radio__label--small]="size === 'small'">
        {{ label }}
        <fa-icon *ngIf="!!tooltip" [icon]="['far', 'info-circle']" class="tag-icon" igntTooltip [tooltipLabel]="tooltip" />
      </span>
      <span *ngIf="!!description" class="radio__description" [class.radio__description--small]="size === 'small'">{{ description }}</span>
    </div>
  </div>
</label>
