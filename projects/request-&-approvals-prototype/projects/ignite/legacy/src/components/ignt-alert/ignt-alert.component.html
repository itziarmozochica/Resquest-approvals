<div *ngIf="isVisible" class="alert" [class.alert--small]="size === 'small'" [attr.data-testid]="testId" [ngClass]="alertClasses">
  <fa-icon [fixedWidth]="true" [icon]="iconBySentiment" class="alert__icon" />
  <div class="alert__container">
    <div class="alert__content">
      <p *ngIf="title" class="alert__title">{{ title }}</p>
      @if (description) {
        <div class="alert__description">
          <span>{{ description }}</span>
        </div>
      }
      <ng-content></ng-content>
    </div>
  </div>
  <button *ngIf="showCloseButton" type="button" class="alert__close-button" data-testid="ignt-alert-close-button" (click)="onClose()">
    <fa-icon [fixedWidth]="true" [icon]="['fas', 'times']" class="alert__icon"></fa-icon>
  </button>
</div>
