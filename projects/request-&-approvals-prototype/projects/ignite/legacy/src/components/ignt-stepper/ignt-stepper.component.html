<div class="stepper">
  <div class="stepper__steps">
    <div
      class="stepper__step"
      role="button"
      *ngFor="let step of steps; let i = index; trackBy: trackByFn"
      (click)="onClickStep(i)"
      [class.stepper__step--disabled]="isDisabled || step.status === 'disabled'"
      [attr.aria-disabled]="isDisabled || step.status === 'disabled'"
    >
      <div
        class="step"
        [class.step--active]="step.status === 'active'"
        [class.step--inactive]="step.status === 'inactive'"
        [class.step--disabled]="isDisabled || step.status === 'disabled'"
        [class.step--completed]="step.status === 'completed'"
        [class.step--started]="step.status === 'started'"
        [class.step--no-selection]="!allowStepSelection"
      >
        <span class="step__inner-line"></span>
        <span class="step__icon">
          <ng-container *ngIf="step.status !== 'inactive'">
            <fa-icon [icon]="iconNameByStep[step.status]" size="xs"></fa-icon>
          </ng-container>
        </span>
        <span class="step__inner-line"></span>
        <p class="step__label">
          <ng-container *ngIf="!hideStepNumber">{{ i + 1 }}.</ng-container> {{ step.label }}
        </p>
      </div>
      <ng-container *ngIf="i !== steps.length - 1">
        <span
          class="stepper__outer-line stepper__outer-line--full"
          [class.stepper__outer-line--completed]="steps?.[i]?.status === 'completed'"
          [class.stepper__outer-line--disabled]="isDisabled || steps?.[i]?.status === 'disabled'"
        ></span>
      </ng-container>
    </div>
  </div>
  <div class="stepper__content" *ngIf="!hideContent">
    <ng-container *ngIf="steps.length > 0">
      <h3 class="stepper__title">{{ steps[currentStep].title }}</h3>
      <p class="stepper__description">{{ steps[currentStep].description }}</p>
    </ng-container>
    <ng-content></ng-content>
  </div>
</div>
