<div [ngClass]="{ 'wrapper-card-set': !!title, 'wrapper-card-set--full-height': fullHeight }">
  <div *ngIf="title" class="wrapper-card-set__title">{{ title }}</div>
  <div
    class="wrapper-card"
    [style.--bg-color]="backgroundColor"
    [classList]="!!elevation ? 'wrapper-card--elevation-' + elevation * 100 : ''"
    [ngClass]="{
      'wrapper-card--primary': type === 'primary',
      'wrapper-card--borderless': type === 'borderless',
      'wrapper-card--custom-mobile': mobileBorderless,
      'wrapper-card--unwrapped': type === 'unwrapped',
    }"
  >
    <ng-content></ng-content>
  </div>
</div>
