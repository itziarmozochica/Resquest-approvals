<div class="ignt-rich-text-editor">
  <ignt-rich-text-editor-toolbar
    [activeActions]="toolbarActiveActions"
    [emojiPanelId]="emojiPanelId"
    [features]="toolbarFeatures()"
    [unavailableActions]="toolbarUnavailableActions"
    (action)="executeToolbarAction($event)"
  />

  @if (showEmojiPanel()) {
    <div
      #emojiPanel
      class="ignt-rich-text-editor__emoji-panel"
      data-testid="emoji-panel"
      tabindex="-1"
      [id]="emojiPanelId"
      (focusout)="onEmojiPanelFocusOut()"
      (keydown.escape)="closeEmojiPanel()"
    >
      <ignt-emoji-picker (emojiSelected)="insertEmoji($event)" />
    </div>
  }

  @if (!showSourceView()) {
    <div #editorHost class="ignt-rich-text-editor__editor" translate="no"></div>
  } @else {
    <div class="ignt-rich-text-editor__source-container">
      <textarea
        class="ignt-rich-text-editor__source-textarea"
        [placeholder]="placeholder()"
        [readonly]="isInteractionLocked()"
        [value]="sourceContent()"
        (input)="onSourceHtmlChange($event)"
      ></textarea>
    </div>
  }
</div>
