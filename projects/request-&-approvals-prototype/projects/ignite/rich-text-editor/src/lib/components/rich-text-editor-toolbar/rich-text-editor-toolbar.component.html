<div class="ignt-rich-text-editor-toolbar">
  <div class="ignt-rich-text-editor-toolbar__toolbar" role="toolbar" [attr.aria-label]="toolbarLabel()">
    @for (item of visibleItems(); track $index) {
      @if (item.kind === 'separator') {
        <span class="ignt-rich-text-editor-toolbar__separator" aria-hidden="true"></span>
      } @else {
        @let view = buttonViews().get(item.action)!;
        <button
          type="button"
          class="ignt-rich-text-editor-toolbar__toolbar-btn"
          [class.ignt-rich-text-editor-toolbar__toolbar-btn--active]="view.isActive"
          [attr.aria-controls]="view.ariaControls"
          [attr.aria-expanded]="view.ariaExpanded"
          [attr.aria-label]="view.ariaLabel"
          [attr.aria-pressed]="view.ariaPressed"
          [disabled]="view.disabled"
          (mousedown)="onToolbarButtonMouseDown($event)"
          (click)="onActionClick(item.action)"
        >
          <ignt-icon size="sm" variant="solid" [name]="view.icon" />
        </button>
      }
    }
  </div>
</div>
