<ignt-dialog-header hideCloseButton data-testid="link-modal-title">{{ translations.dialogLabel }}</ignt-dialog-header>
<ignt-dialog-content>
  <div class="rich-text-editor-link-modal">
    <ignt-input-field
      type="url"
      [customFormErrors]="customFormErrors"
      [formControl]="urlControl"
      [id]="urlInputId"
      [label]="translations.urlPlaceholder"
      [placeholder]="translations.urlPlaceholder"
    />
    @if (showOpenLink()) {
      <a
        class="rich-text-editor-link-modal__open-link"
        data-testid="link-modal-open-link"
        rel="noopener noreferrer"
        target="_blank"
        [href]="urlValue()"
      >
        {{ translations.openLink }}
      </a>
    }
  </div>
</ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <ignt-button
    data-testid="link-modal-cancel-button"
    sentiment="brand"
    variant="tertiary"
    [label]="translations.cancelButton"
    (click)="cancel()"
  />
  <div class="rich-text-editor-link-modal__actions">
    @if (hasExistingLink) {
      <ignt-button
        data-testid="link-modal-remove-button"
        sentiment="danger"
        variant="secondary"
        [label]="translations.removeButton"
        (click)="remove()"
      />
    }
    <ignt-button
      data-testid="link-modal-apply-button"
      sentiment="brand"
      variant="primary"
      [label]="translations.applyButton"
      (click)="apply()"
    />
  </div>
</ignt-dialog-footer>
