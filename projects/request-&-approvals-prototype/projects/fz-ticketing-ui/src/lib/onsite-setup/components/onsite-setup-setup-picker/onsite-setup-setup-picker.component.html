<div #section class="onsite-setup__section">
  <span class="onsite-setup__label">{{ label() }}</span>
  <div class="tile-wrapper tile-wrapper--row">
    @for (setup of setups(); track setup.id) {
      <fzt-onsite-setup-tile
        class="onsite-setup-tile"
        data-testid="onsite-setup-option"
        [disabled]="disabled()"
        [selected]="selectedSetupId() === setup.id"
        (tileClick)="setupSelected.emit(setup)"
      >
        <span class="onsite-setup-tile__label" [title]="setup.title">{{ setup.title }}</span>
      </fzt-onsite-setup-tile>
    }
  </div>
</div>
