<div class="onsite-setup__recent" data-testid="recent-onsite-setups">
  <div class="onsite-setup__recent-header">
    <span class="onsite-setup__recent-label">{{ recentLabel() }}</span>
    <ignt-button
      data-testid="recent-venue-search-button"
      size="small"
      variant="tertiary"
      [label]="searchLabel()"
      [leadingIcon]="{ name: 'search', variant: 'regular' }"
      (click)="searchActivated.emit()"
    />
  </div>
  <div class="onsite-setup__recent-chips">
    @for (recent of recents(); track recent.id) {
      <ignt-pill-button
        data-testid="recent-onsite-setup"
        [icon]="{ name: 'cash-register', variant: 'light' }"
        [label]="recent.name"
        [value]="recent.id"
        (checkedChange)="recentSelected.emit(recent)"
      />
    }
  </div>
</div>
