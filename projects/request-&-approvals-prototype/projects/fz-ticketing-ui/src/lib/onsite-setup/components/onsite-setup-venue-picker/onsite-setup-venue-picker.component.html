<div class="onsite-setup__section">
  <span class="onsite-setup__label">{{ label() }}</span>
  @if (isSearchFieldVisible()) {
    <div class="venue-search">
      <div class="venue-search__row">
        <div class="field venue-search__field">
          <ignt-input-field
            data-testid="venue-search-input"
            type="search"
            [formControl]="searchControl()"
            [label]="searchLabel()"
            [placeholder]="searchPlaceholder()"
            (keydown.enter)="searchEnterPressed.emit()"
          />
          <ignt-icon class="field__icon field__icon--lead" aria-hidden="true" name="search" variant="light" />
        </div>
        @if (showCloseSearchButton()) {
          <button
            ignt-icon-button
            data-testid="venue-search-close-button"
            sentiment="secondary"
            type="button"
            [attr.aria-label]="closeSearchLabel()"
            [icon]="['far', 'times']"
            (click)="searchClosed.emit()"
          ></button>
        }
      </div>
    </div>
  }
  <div class="tile-wrapper tile-wrapper--row" [class.tile-wrapper--row--compact]="isCompact()">
    @for (venue of venues(); track venue.id) {
      <fzt-onsite-setup-tile
        class="onsite-setup-tile"
        data-testid="venue-option"
        [attr.data-venue-id]="venue.id"
        [selected]="selectedVenueId() === venue.id"
        (tileClick)="venueSelected.emit(venue)"
      >
        <span class="onsite-setup-tile__label" [title]="venue.name">{{ venue.name }}</span>
      </fzt-onsite-setup-tile>
    }
  </div>
</div>
