<div class="tile-wrapper" data-testid="party-hours-container" [class.tile-wrapper--grid]="isGrid()" [class.tile-wrapper--row]="!isGrid()">
  @if (vm().showNow) {
    <button
      class="tile-wrapper__item tile"
      data-testid="party-hour-now"
      type="button"
      [attr.aria-pressed]="vm().isNowSelected"
      [class.tile--selected]="vm().isNowSelected"
      (click)="onPillPressed(vm().isNowSelected, null)"
    >
      {{ nowLabel() }}
    </button>
  }
  @for (pill of vm().startTimes; track pill.datetimeKey) {
    <button
      class="tile-wrapper__item tile"
      data-testid="party-hour-item"
      type="button"
      [attr.aria-pressed]="pill.isSelected"
      [class.tile--selected]="pill.isSelected"
      (click)="onPillPressed(pill.isSelected, pill.datetimeKey)"
    >
      {{ pill.timeLabel }}
    </button>
  }
</div>
