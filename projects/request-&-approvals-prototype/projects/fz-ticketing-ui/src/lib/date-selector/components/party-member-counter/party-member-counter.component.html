<div class="party-member-counter" data-testid="party-member-counter" role="group" [attr.aria-label]="member().name">
  <span class="party-member-counter__name" data-testid="party-member-name">{{ member().name }}</span>
  <div class="party-member-counter__control">
    <button
      ignt-icon-button
      data-testid="party-member-decrease"
      sentiment="primary"
      type="button"
      [attr.aria-label]="decreaseLabel()"
      [disabled]="!member().canDecrease"
      [icon]="['fal', 'minus']"
      (click)="onDecrease()"
    ></button>
    <input
      #quantityInput
      autocomplete="off"
      class="party-member-counter__quantity"
      data-testid="party-member-quantity"
      enterkeyhint="done"
      inputmode="numeric"
      placeholder="0"
      type="text"
      [attr.aria-label]="member().name"
      [maxLength]="quantityMaxDigits"
      [value]="member().quantity"
      (beforeinput)="onBeforeInput($event)"
      (change)="onQuantityTyped(quantityInput)"
      (focus)="quantityInput.select()"
      (keydown.enter)="$event.preventDefault(); quantityInput.blur()"
    />
    <button
      ignt-icon-button
      data-testid="party-member-increase"
      sentiment="primary"
      type="button"
      [attr.aria-label]="increaseLabel()"
      [icon]="['fal', 'plus']"
      (click)="onIncrease()"
    ></button>
  </div>
</div>
