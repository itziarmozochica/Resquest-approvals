<section class="party-handheld-date" data-testid="party-handheld-date-section">
  @if (vm().skeleton.dates) {
    <div class="party-handheld-date__skeleton-row" data-testid="party-handheld-dates-skeleton">
      @for (tile of skeletonTiles; track tile) {
        <ignt-skeleton-base [animation]="true" [height]="48" />
      }
    </div>
  } @else {
    <fzt-category-chips
      class="party-handheld-date__chips"
      data-testid="party-handheld-date-chips"
      [vm]="chips()"
      (categorySelected)="onChipSelected($event)"
    />

    @if (showPicker()) {
      <ignt-date-picker-input
        class="party-handheld-date__date-picker"
        data-testid="date-selector-invitation"
        [inline]="true"
        [isOneStopShop]="true"
        [label]="translations().showAvailabilityFromLabel"
        [minDate]="vm().datePicker.minDate"
        [startDate]="vm().datePicker.startDate"
        [timezone]="vm().datePicker.timezone"
        (changeDate)="fromDateChanged.emit($event)"
      />
    }

    <p class="party-handheld-date__selling-for" data-testid="party-handheld-selling-for">
      <span class="party-handheld-date__selling-for-label">{{ translations().sellingTicketsFor }}</span
      >&ngsp;
      <strong class="party-handheld-date__selling-for-value" data-testid="party-handheld-selling-for-value">{{ sellingForLabel() }}</strong>
    </p>
  }

  @if (vm().skeleton.sessions) {
    <div class="party-handheld-date__skeleton-grid" data-testid="party-handheld-hours-skeleton">
      @for (tile of skeletonTiles; track tile) {
        <ignt-skeleton-base [animation]="true" [height]="40" />
      }
    </div>
  } @else {
    <fzt-time-pills-row layout="grid" [nowLabel]="translations().now" [vm]="vm().hourTiles" (hourSelected)="hourSelected.emit($event)" />
  }
</section>
