<div class="tile-wrapper tile-wrapper--row" data-testid="dates-selector-container" [hidden]="!vm().showDatesRow">
  @for (pill of vm().datePills; track pill.dateKey) {
    <button
      class="tile-wrapper__item tile"
      data-testid="date-item"
      type="button"
      [attr.aria-disabled]="pill.isDisabled"
      [attr.aria-pressed]="pill.isSelected"
      [class.selected]="pill.isSelected"
      [class.tile--disabled]="pill.isDisabled"
      [class.tile--selected]="pill.isSelected"
      (click)="onPillClick(pill)"
    >
      <span class="tile__label">{{ pill.weekdayLabel }} </span>
      <span class="tile__label">{{ pill.dayLabel }}</span>
    </button>
  }
  @if (vm().loadMore.isVisible) {
    <button
      class="tile-wrapper__item tile tile--icon-action"
      type="button"
      [attr.aria-label]="translations().loadMoreAriaLabel"
      (click)="loadMoreClicked.emit()"
    >
      @if (vm().loadMore.isLoading) {
        <div class="ignt-loader"></div>
      } @else {
        <ignt-icon name="calendar-plus" size="h3" variant="light" [fixedWidth]="true" />
      }
    </button>
  }
</div>
