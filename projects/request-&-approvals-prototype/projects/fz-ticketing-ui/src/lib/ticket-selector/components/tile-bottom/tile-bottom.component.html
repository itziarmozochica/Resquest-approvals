@let tile = vm();

<div class="tile__bottom-content">
  <div class="tile__bottom-lead-content">
    @if (showPrice()) {
      <fzt-tile-price [translations]="translations()" [vm]="tile" />
    }
    @if (unitsAvailableLabel(); as unitsAvailable) {
      <div class="tile__units-available" data-testid="item-tile-units-available">{{ unitsAvailable }}</div>
    }
  </div>
  <div class="tile__bottom-trail-content">
    @if (showTileIcon()) {
      <div class="tile__category-icon">
        <ignt-icon size="base" aria-hidden="true" [name]="categoryIconName()" [variant]="categoryIconVariant()" />
      </div>
    }
    @if (tile.isOngoing) {
      <span class="tile__ongoing-dot" aria-hidden="true" data-testid="item-tile-ongoing-dot"></span>
    }
  </div>
</div>
