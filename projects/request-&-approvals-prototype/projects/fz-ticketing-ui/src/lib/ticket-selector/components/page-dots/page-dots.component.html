<div class="page-indicator" data-testid="page-dots">
  @for (page of pages(); track page) {
    <button
      type="button"
      class="page-dot-wrapper"
      data-testid="page-dot"
      [attr.aria-current]="page === selectedIndex() ? 'true' : null"
      [attr.aria-label]="ariaLabelFor(page)"
      (click)="onDotClick(page)"
    >
      <span class="page-dot" [class.page-dot--active]="page === selectedIndex()"></span>
    </button>
  }
</div>
