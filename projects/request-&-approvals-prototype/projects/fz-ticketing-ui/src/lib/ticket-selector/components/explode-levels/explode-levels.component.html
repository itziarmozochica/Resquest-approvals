@for (row of rows(); track row.key) {
  <div class="tile-wrapper tile-wrapper--row" data-testid="level-row">
    @for (item of row.items; track item.key) {
      <button
        type="button"
        class="tile-wrapper__item tile tile--wider"
        data-testid="level-item"
        fztTooltipGestures
        igntTooltip
        tooltipTrigger="manual"
        [class.tile--selected]="item.isSelected"
        [class.tile--disabled]="item.isDisabled"
        [tooltipDisabled]="!label.isTruncated()"
        [tooltipLabel]="item.name"
        (click)="selectLevel(item)"
      >
        <span #label="fztTruncation" class="level-item__label" data-testid="level-item-label" fztTruncation>{{ item.name }}</span>
      </button>
    }
  </div>
}
