@let selector = vm();

<ignt-tabs
  class="main-content__tabs"
  data-testid="oss-tabs-container"
  [class.main-content__tabs--hide-header]="selector.hideTabHeader"
  [hasExtraLine]="false"
  [keepAlive]="selector.keepAlive"
  [selectedIndex]="selector.selectedTabIndex"
  [tourAnchorId]="selector.tabsTourAnchorId"
  (selectedIndexChange)="tabSelected.emit($event)"
>
  @for (tab of selector.tabs; track tab.key) {
    <ignt-tabs-item [attr.data-testid]="tab.testId" [icon]="tab.icon" [label]="labelFor(tab)">
      <fzt-tickets-section
        [dateSelectorTemplate]="dateSelectorTemplate()"
        [isMobile]="isMobile()"
        [isTablet]="isTablet()"
        [placeholderTemplate]="placeholderTemplate()"
        [seatingTemplate]="seatingTemplate()"
        [translations]="translations()"
        [vm]="sectionFor(tab)"
        (breadcrumbNavigated)="onBreadcrumbNavigated(tab, $event)"
        (levelSelected)="levelSelected.emit($event)"
        (partyCategorySelected)="partyCategorySelected.emit($event)"
        (partySelectMembersRequested)="partySelectMembersRequested.emit()"
        (partyStartTimeTapped)="partyStartTimeTapped.emit($event)"
        (tileAdd)="onTileAdd(tab, $event)"
        (tileTapped)="onTileTapped(tab, $event)"
      />
    </ignt-tabs-item>
  }
</ignt-tabs>
