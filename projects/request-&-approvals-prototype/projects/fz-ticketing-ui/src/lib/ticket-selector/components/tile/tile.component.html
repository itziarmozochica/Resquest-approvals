@let tile = vm();

<button
  #wave="fztTapWave"
  type="button"
  data-testid="item-tile"
  class="tile"
  [disabled]="isDisabled()"
  [class.tile--disabled]="isDisabled()"
  [class.tile--large]="tile.variant === 'large'"
  [class.tile--parent]="tile.kind === 'parent'"
  [class.tile--session]="tile.category === 'session'"
  [class.tile--addon]="tile.category === 'addon'"
  [class.tile--product]="tile.category === 'product'"
  [class.tile--food_and_beverage]="tile.category === 'food_and_beverage'"
  [class.tile--membership]="tile.category === 'membership'"
  [class.tile--multiday]="tile.isMultiDay"
  [class.tile--ongoing]="tile.isOngoing"
  [fztTapWave]="tile.renderKey"
  [fztTapWaveClickIndicator]="tile.kind === 'parent'"
  (click)="addUnit()"
>
  <span
    class="tile__ripple"
    [class.tile__ripple--active]="wave.isActive()"
    [class.tile__ripple--click-indicator]="wave.isClickIndicatorActive()"
  ></span>
  <div class="tile__main">
    <div class="tile__top-content">
      <div class="tile__name" data-testid="item-tile-name" [title]="displayName()">
        {{ displayName() }}
        @if (tile.showWarning) {
          <ignt-icon
            class="tile__override-warning-icon"
            aria-hidden="true"
            name="exclamation-triangle"
            variant="solid"
            data-testid="override-warning-icon"
          />
        }
      </div>
      <div class="tile__top-content-second-row">
        @for (tag of statusTags(); track tag.testId) {
          <ignt-tag sentiment="disable" [attr.data-testid]="tag.testId">{{ tag.label }}</ignt-tag>
        }
      </div>
      @if (tile.multiDayRange | fztMultiDayRange: translations(); as multiDayRangeLabel) {
        <div class="tile__multi-day-range" data-testid="item-tile-multi-day-range">{{ multiDayRangeLabel }}</div>
      }
    </div>
    @if (!isDisabled()) {
      <fzt-tile-bottom [isMobile]="isMobile()" [translations]="translations()" [vm]="tile" />
    }
  </div>
</button>
