@if (visible()) {
  <div class="oss-hierarchy-tiles__breadcrumb" data-testid="oss-breadcrumb">
    @if (isMobile()) {
      @if (showTrail()) {
        <button
          ignt-icon-button
          type="button"
          size="small"
          sentiment="secondary"
          data-testid="oss-breadcrumb-back"
          [attr.aria-label]="translations().breadcrumbBackAriaLabel"
          [icon]="backIcon"
          (click)="navigateBack()"
        ></button>
      }
      <span class="breadcrumb-item breadcrumb-item--disabled" data-testid="oss-breadcrumb-item">{{ currentBreadcrumb()?.name }}</span>
    } @else {
      <button
        type="button"
        class="breadcrumb-item breadcrumb-item__home"
        data-testid="oss-breadcrumb-home"
        [class.breadcrumb-item__home--disabled]="isHomeDisabled()"
        [attr.aria-label]="translations().breadcrumbHomeAriaLabel"
        (click)="navigateToHome()"
      >
        <ignt-icon name="house" variant="solid" size="base" aria-hidden="true" />
      </button>

      @if (showTrail()) {
        <div class="breadcrumb-items-wrapper">
          @for (breadcrumb of trailItems(); track breadcrumb.depth) {
            <span class="breadcrumb-separator"><ignt-icon name="chevron-right" variant="light" size="sm" aria-hidden="true" /></span>
            <button
              type="button"
              class="breadcrumb-item"
              data-testid="oss-breadcrumb-item"
              [class.breadcrumb-item--disabled]="breadcrumb.isCurrentLevel"
              [disabled]="breadcrumb.isCurrentLevel"
              (click)="navigateToBreadcrumb(breadcrumb)"
            >
              {{ breadcrumb.name }}
            </button>
          }
        </div>
      }
    }
  </div>
}
