<div class="tile-wrapper tile-wrapper--row" data-testid="party-category-chips">
  @for (chip of vm(); track chip.key) {
    <button
      type="button"
      class="tile-wrapper__item tile tile--wider"
      data-testid="party-category-chip"
      fztTooltipGestures
      igntTooltip
      tooltipTrigger="manual"
      [attr.aria-disabled]="chip.isDisabled || null"
      [attr.aria-pressed]="chip.isSelected"
      [class.tile--disabled]="chip.isDisabled"
      [class.tile--selected]="chip.isSelected"
      [tooltipDisabled]="!label.isTruncated()"
      [tooltipLabel]="chip.category"
      (click)="onChipPressed(chip)"
    >
      <span #label="fztTruncation" class="category-chips__label" data-testid="party-category-chip-label" fztTruncation>{{
        chip.category
      }}</span>
    </button>
  }
</div>
