@for (skeletonTile of skeletonTiles; track skeletonTile) {
  <div class="skeleton-tile">
    <div class="skeleton-tile__content">
      <ignt-skeleton-base width="60%" [animation]="true" [height]="8" />
      <div class="skeleton-tile__content-bottom">
        <div class="skeleton-tile__content-bottom-left">
          <ignt-skeleton-base width="60%" [animation]="true" [height]="8" />
          <ignt-skeleton-base [animation]="true" [height]="8" />
        </div>
        <div class="skeleton-tile__content-bottom-right">
          <ignt-skeleton-base width="25%" [animation]="true" [height]="8" />
        </div>
      </div>
    </div>
  </div>
}
