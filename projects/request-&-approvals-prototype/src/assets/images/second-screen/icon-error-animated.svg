<svg width="165" height="165" viewBox="0 0 165 165" fill="none" xmlns="http://www.w3.org/2000/svg">
 <defs>
    <style>
      .circle {
        transform-origin: center;
        animation: zoomIn 500ms linear;
      }

      .exclamation {
        transform-origin: center;
        animation: zoomInBounce 500ms linear;
      }

      .circle-shadow {
        transform-origin: center;
        opacity: 0;
        animation: shadow 500ms linear 300ms forwards;
      }

      @keyframes zoomIn {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        70% {
          transform: scale(1.1);
        }
        80% {
          transform: scale(0.9);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes zoomInBounce {
        0% {
          opacity: 0;
          transform: scale(0.5) rotate(0);
        }
        20% {
          transform: scale(2) rotate(45deg);
        }
        40% {
          transform:  scale(2) rotate(-45deg);
        }
        60% {
          transform: scale(2) rotate(45deg);
        }
        80% {
          transform: scale(2) rotate(-45deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0);
        }
      }

      @keyframes shadow {
        0% {
          opacity: 0.5;
          transform: scale(0.5);
        }
        50% {
          opacity: 1;
          transform: scale(0.9);
        }
        90% {
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes sparkles {
        0% {
          opacity: 0.5;
          transform: scale(0.5) rotate(0deg);
        }
        50% {
          opacity: 1;
          transform: scale(0.9) rotate(-15deg);
        }
        90%,
        100% {
          opacity: 0;
          transform: scale(1) rotate(-25deg);
        }
      }
    </style>
  </defs>
  <circle class="circle-shadow" cx="82.5" cy="82.5" r="50" fill="#FB78A1"/>
  <path class="circle" d="M82 122C92.6087 122 102.783 117.786 110.284 110.284C117.786 102.783 122 92.6087 122 82C122 71.3913 117.786 61.2172 110.284 53.7157C102.783 46.2143 92.6087 42 82 42C71.3913 42 61.2172 46.2143 53.7157 53.7157C46.2143 61.2172 42 71.3913 42 82C42 92.6087 46.2143 102.783 53.7157 110.284C61.2172 117.786 71.3913 122 82 122Z" fill="#EB0052"/>
  <path class="exclamation" d="M82 62C84.0781 62 85.75 63.6719 85.75 65.75V83.25C85.75 85.3281 84.0781 87 82 87C79.9219 87 78.25 85.3281 78.25 83.25V65.75C78.25 63.6719 79.9219 62 82 62ZM77 97C77 95.6739 77.5268 94.4021 78.4645 93.4645C79.4021 92.5268 80.6739 92 82 92C83.3261 92 84.5979 92.5268 85.5355 93.4645C86.4732 94.4021 87 95.6739 87 97C87 98.3261 86.4732 99.5979 85.5355 100.536C84.5979 101.473 83.3261 102 82 102C80.6739 102 79.4021 101.473 78.4645 100.536C77.5268 99.5979 77 98.3261 77 97Z" fill="white"/>
</svg>
