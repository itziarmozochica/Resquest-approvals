<svg width="185" height="210" viewBox="0 0 185 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card {
        transform-origin: 0 30%;
        animation: card 1.2s ease-in-out infinite alternate;
      }

      .check-stripes {
        animation: stripes 2.4s ease-in-out infinite;
      }

      .check-symbol {
        animation: ckeck 2.4s ease-in-out infinite;
      }

      @keyframes card {
        0% {
          transform: rotate(-5deg);
        }
        50%,
        100% {
          transform: rotate(10deg);
        }
      }

      @keyframes stripes {
        0%,
        20% {
          opacity: 0;
          transform: translateX(0px);
        }
        40%,
        70% {
          opacity: 1;
        }
        80%,
        100% {
          opacity: 0;
        }
        70%,
        100% {
          transform: translateX(10px);
        }
      }
      @keyframes ckeck {
        0%,
        20%,
        100% {
          opacity: 0;
          transform: translateY(6px);
        }
        50%,
        90% {
          opacity: 1;
          transform: translateY(0px);
        }
        100% {
          transform: translateY(-6px);
        }
      }
    </style>
  </defs>

