<div class="entitlements-page">
  <div class="entitlements-page__body">
    <div class="header">
      <div class="header__title">
        <span class="header__section">{{ 'entitlements.list.section' | translate }}</span>
        <h1 class="header__heading" data-testid="page-title">{{ 'entitlements.list.title' | translate }}</h1>
      </div>
      <ignt-button
        data-testid="entitlements-create-button"
        [label]="'entitlements.list.createButton' | translate"
        [routerLink]="['/entitlements', 'create']"
        [size]="isMobile() ? 'small' : 'large'"
      />
    </div>

    <div class="entitlements-list__table-wrapper">
      <ignt-table
        class="entitlements-list__table"
        data-testid="entitlements-table-data"
        [data]="entitlements()"
        [getRowId]="getRowId"
        [isLoading]="isInitialLoading()"
      >
        <ignt-table-column key="name" columnType="primary" [header]="'entitlements.list.table.name' | translate">
          <ng-template [igntTableColumnTemplateType]="rowSample()" let-item="item">
            <strong class="entitlements-list__name" data-testid="entitlements-table-name">
              <span data-testid="entitlements-table-id">#{{ item.id }}</span> - {{ item.name }}
            </strong>
          </ng-template>
        </ignt-table-column>

        <ignt-table-column key="type" columnType="secondary" [header]="'entitlements.list.table.type' | translate" [width]="240">
          <ng-template [igntTableColumnTemplateType]="rowSample()" let-item="item">
            <span data-testid="entitlements-table-type">{{ item.type }}</span>
          </ng-template>
        </ignt-table-column>

        <ignt-table-column columnType="action" align="right" [header]="'entitlements.list.table.actions' | translate" [width]="112">
          <ng-template [igntTableColumnTemplateType]="rowSample()" let-item="item">
            <div class="entitlements-list__actions" data-testid="entitlements-table-actions">
              <a
                ignt-icon-button
                size="small"
                sentiment="tertiary"
                data-testid="entitlements-row-update"
                [attr.aria-label]="'entitlements.list.updateAria' | translate"
                [icon]="['fal', 'pen-square']"
                [routerLink]="['/entitlements', 'update', item.id]"
              ></a>
              <button
                ignt-icon-button
                type="button"
                size="small"
                sentiment="tertiary"
                variant="danger"
                data-testid="entitlements-row-delete"
                [attr.aria-label]="'entitlements.list.deleteAria' | translate"
                [icon]="['fal', 'ban']"
                (click)="deleteEntitlement(item.id)"
              ></button>
            </div>
          </ng-template>
        </ignt-table-column>
      </ignt-table>

      @if (isLoadingMore()) {
        <div class="entitlements-list__load-more" data-testid="entitlements-list-loading-more">
          <ignt-icon aria-hidden="true" name="spinner" size="h2" variant="solid" [spin]="true" />
        </div>
      }
      @if (hasMorePages() && !isInitialLoading() && !isLoadingMore()) {
        <div #loadMoreSentinel aria-hidden="true" data-testid="entitlements-list-sentinel"></div>
      }
    </div>
  </div>
</div>

<app-confirmation-dialog></app-confirmation-dialog>
