<app-spinner *ngIf="!isKiosk(); else brightSpinner"></app-spinner>
<!-- For the moment the bright spinner option will -->
<!-- only be available for kiosk -->
<ng-template #brightSpinner>
  <div class="bright-spinner-wrapper" *ngIf="isGlobalSpinnerLoading$ | async">
    <!-- spinner needs the loader class to spin -->
    <!-- src/theme/general/_general.scss -->
    <ignt-skeleton [height]="1484" [animation]="true" [type]="'image'"></ignt-skeleton>
    <ignt-skeleton [height]="326" [isBordered]="true" [animation]="true" [type]="'header'"></ignt-skeleton>
  </div>
</ng-template>
<router-outlet></router-outlet>
