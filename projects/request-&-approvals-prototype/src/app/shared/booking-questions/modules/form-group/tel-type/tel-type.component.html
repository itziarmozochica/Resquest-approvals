<div class="fv-booking-question-tel-control">
  <div class="fv-booking-question-tel-country" [class.fv-booking-question-tel-country--error]="error === 'country'">
    <ng-select
      class="form__ng-select"
      data-testid="booking-question-telephone-country"
      [items]="countryCodes"
      bindLabel="countryName"
      placeholder="Country"
      [(ngModel)]="countryCode"
      (change)="onSelectedCountry(countryCode)"
      type="country"
    >
    </ng-select>
  </div>
  <div class="form__input fv-booking-question-tel-input">
    <input
      class="fv-booking-question-tel-input__prefix"
      data-testid="booking-question-telephone-prefix"
      [id]="id + '.prefix'"
      type="tel"
      autocomplete="none"
      [(ngModel)]="prefix"
      (input)="onInput()"
      (blur)="onTouched()"
      placeholder="+00"
      [readonly]="true"
      disabled
    />
    <input
      class="fv-booking-question-tel-input__phone"
      [class.fv-booking-question-tel-input__phone--error]="error && error !== 'country'"
      data-testid="booking-question-telephone-input"
      [id]="id + '.phone'"
      type="tel"
      [ngModel]="phoneInNationalFormat"
      (ngModelChange)="onTelInput($event)"
      (input)="onInput()"
      (blur)="onTouched()"
      (keypress)="onKeyPress($event)"
      [placeholder]="phonePlaceholder"
    />
  </div>
</div>
