<div>
  <app-multi-select
    [options]="choicesOptions"
    [placeholder]="question.message"
    [defaultOrdering]="false"
    [selectedOptions]="choiceSelected"
    (selected)="onSelectChange($event)"
    [maxSelectedOptions]="1"
    [displayInPlaceMaximum]="10"
    [errorMessage]="errorMessage | translate"
  >
  </app-multi-select>
</div>
