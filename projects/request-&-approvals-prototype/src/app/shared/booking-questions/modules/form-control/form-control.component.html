<ng-container *ngIf="question.label && !['checkbox_with_terms'].includes(question.type)">
  <label class="form__label" [for]="question | buildBookingQuestionId" [innerHTML]="question.label"> </label>
</ng-container>

<ng-container *ngIf="question.message && !['checkbox_with_terms', 'single_choice'].includes(question.type)">
  <p class="form__helper" [innerHTML]="question.message"></p>
</ng-container>

<ng-content></ng-content>
