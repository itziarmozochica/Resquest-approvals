<div class="address-lookup-composite-question" *ngIf="questions && questions.length === 2">
  <fieldset class="form__fieldset" *ngIf="addressInputQuestion">
    <app-booking-question-form-control
      [question]="addressInputQuestion"
      data-testid="address-input-booking-question-form-control"
      [error]="
        formGroup.get(addressInputQuestion | buildBookingQuestionId)?.touched &&
        !formGroup.get(addressInputQuestion | buildBookingQuestionId)?.valid
      "
    >
      <div class="address-input-container">
        <fv-question-item
          [formGroup]="formGroup"
          [question]="addressInputQuestion"
          [controlId]="addressInputQuestion | buildBookingQuestionId"
          [error]="error"
          [class]="{ 'address-input': true, 'address-input--suggestions-open': showSuggestions }"
          (input)="onAddressInput($event)"
          (focus)="onAddressFocus()"
          (blur)="onAddressBlur()"
        >
        </fv-question-item>
        <ng-container *ngIf="showSuggestions && addressSuggestions.length > 0">
          <div class="address-suggestions-dropdown" data-testid="address-suggestions-dropdown">
            <ul class="address-suggestions-dropdown__list" data-testid="address-suggestions-dropdown__list">
              <li
                class="suggestion-item"
                [class.active]="i === activeSuggestionIndex"
                *ngFor="let suggestion of addressSuggestions; let i = index; trackBy: trackBySuggestion"
                (click)="selectSuggestion(suggestion, i)"
              >
                <div class="suggestion-content">{{ suggestion.address }}</div>
              </li>
            </ul>
          </div>
        </ng-container>
      </div>
    </app-booking-question-form-control>
  </fieldset>

  <fieldset class="form__fieldset" *ngIf="zipCodeInputQuestion">
    <app-booking-question-form-control
      [question]="zipCodeInputQuestion"
      data-testid="location-selection-booking-question-form-control"
      [error]="
        formGroup.get(zipCodeInputQuestion | buildBookingQuestionId)?.touched &&
        !formGroup.get(zipCodeInputQuestion | buildBookingQuestionId)?.valid
      "
    >
      <fv-question-item
        [formGroup]="formGroup"
        [question]="zipCodeInputQuestion"
        [controlId]="zipCodeInputQuestion | buildBookingQuestionId"
        [error]="error"
      >
      </fv-question-item>
    </app-booking-question-form-control>
  </fieldset>
</div>
