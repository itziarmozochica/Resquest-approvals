<div class="fv-booking-question-multiple-choice">
  <div *ngFor="let choice of question.choices; let i = index; trackBy: trackByQuestionId">
    <label class="form__label" data-testid="booking-question-choice">
      <input
        #checkbox
        class="form__checkbox"
        [attr.data-testid]="'booking-question-multiple-choice-input' + i"
        type="checkbox"
        [value]="choice.value"
        (change)="onCheckChange($event)"
      />
      {{ choice.label }}
    </label>

    <ng-container *ngIf="choice.additionalQuestion && checkbox.checked">
      <input
        class="form__input"
        data-testid="booking-question-associated-text-input"
        type="text"
        [placeholder]="choice.additionalQuestion.message"
        (change)="onInputChange($event, choice.value)"
      />
    </ng-container>
  </div>

  <span
    class="field__helper field__helper--danger"
    data-testid="booking-question-choice-error"
    *ngIf="(control?.statusChanges | async) === 'INVALID' && !control.hasError('server')"
  >
    <fa-icon class="unselect-chip-button" [icon]="['fas', 'exclamation-circle']" aria-label="Close"></fa-icon>
    {{ 'bookingQuestionsForm.validations.required' | translate }}</span
  >
  @if (formGroup.get(controlId || (question | buildBookingQuestionId))?.hasError('server')) {
    <span class="field__helper field__helper--danger" data-testid="booking-question-choice-server-error">
      <fa-icon [icon]="['fas', 'exclamation-circle']" aria-hidden="true"></fa-icon>
      {{ 'bookingQuestionsForm.error.rejectedByServer' | translate }}
    </span>
  }
</div>
