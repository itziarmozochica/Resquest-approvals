<div class="fv-booking-question-checkbox" [formGroup]="formGroup">
  <label class="bold form__label">
    <input
      #checkbox
      class="form__checkbox"
      [attr.data-testid]="'booking-question-checkbox-input'"
      type="checkbox"
      [value]="formGroup.get(controlId || (question | buildBookingQuestionId)).value === 'true'"
      (change)="onToggleCheckbox($event)"
    />
    {{ question.label }}
  </label>

  <div [innerHTML]="question.message | sanitize"></div>

  @if (formGroup.get(controlId || (question | buildBookingQuestionId))?.hasError('server')) {
    <span class="field__helper field__helper--danger" data-testid="booking-question-checkbox-server-error">
      <fa-icon [icon]="['fas', 'exclamation-circle']" aria-hidden="true"></fa-icon>
      {{ 'bookingQuestionsForm.error.rejectedByServer' | translate }}
    </span>
  }

  <ng-template #errorMessage let-controlName="controlName" let-errorName="errorName" let-errorMessage="errorMessage">
    <ng-container *ngIf="formGroup.get(controlName).touched">
      <ignt-field-error [formControlValue]="formGroup.get(controlName)" [errorName]="errorName">
        {{ errorMessage | translate }}
      </ignt-field-error>
    </ng-container>
  </ng-template>
</div>
