<div class="fv-booking-question-date" [formGroup]="formGroup">
  <ignt-date-picker-input
    class="availability-from-date"
    [id]="controlId || (question | buildBookingQuestionId)"
    [startDate]="formGroup.get(controlId || (question | buildBookingQuestionId))?.value ?? null"
    (changeDate)="onDateSelected($event)"
    [label]="question.label"
    [timezone]="timezone"
  ></ignt-date-picker-input>

  <ng-container *ngFor="let error of DATE_ERRORS">
    <ng-container
      *ngTemplateOutlet="
        errorMessage;
        context: {
          controlName: controlId || (question | buildBookingQuestionId),
          errorName: error.name,
          errorMessage: error.message,
        }
      "
    >
    </ng-container>
  </ng-container>
</div>

<ng-template #errorMessage let-controlName="controlName" let-errorName="errorName" let-errorMessage="errorMessage">
  <ng-container *ngIf="formGroup.get(controlName).touched">
    <ignt-field-error [formControlValue]="formGroup.get(controlName)" [errorName]="errorName">
      {{ errorMessage | translate }}
    </ignt-field-error>
  </ng-container>
</ng-template>
