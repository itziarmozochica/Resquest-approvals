<div class="fv-booking-question-single-choice" [formGroup]="formGroup">
  <ng-container>
    <fv-booking-question-single-choice
      [id]="controlId || (question | buildBookingQuestionId)"
      [question]="question"
      [formControlName]="controlId || (question | buildBookingQuestionId)"
      data-testid="booking-question-single-choice"
      [error]="getControlError(formGroup.get(controlId || (question | buildBookingQuestionId)))"
    >
    </fv-booking-question-single-choice>
  </ng-container>
</div>
