<ng-container *ngIf="isAddressLookupQuestion; else defaultQuestions">
  <fzo-address-lookup-composite-question-item
    [questions]="questions"
    [formGroup]="formGroup"
    [error]="error"
  ></fzo-address-lookup-composite-question-item>
</ng-container>

<ng-template #defaultQuestions>
  <ng-container *ngFor="let question of questions; trackBy: trackByQuestionId">
    <fieldset class="form__fieldset">
      <app-booking-question-form-control
        [question]="question"
        data-testid="booking-question-form-control"
        [error]="formGroup.get(question.id)?.touched && !formGroup.get(question.id)?.valid"
      >
        <fv-question-item [formGroup]="formGroup" [question]="question" [controlId]="question.id" [error]="error"></fv-question-item>
      </app-booking-question-form-control>
    </fieldset>
  </ng-container>
</ng-template>
