<div class="fv-booking-question-text" [formGroup]="formGroup">
  <div class="form-group">
    <div class="form-group__fields">
      <ignt-input-field
        [id]="controlId || (question | buildBookingQuestionId)"
        data-testid="booking-question-text-input"
        [type]="'email'"
        [formControlName]="controlId || (question | buildBookingQuestionId)"
        class="cell cell--fill-md"
        [customFormErrors]="[
          {
            type: 'required',
            message: 'form.error.mandatoryField' | translate,
          },
          {
            type: 'email',
            message: 'form.error.invalidEmail' | translate,
          },
          {
            type: 'server',
            message: 'bookingQuestionsForm.error.rejectedByServer' | translate,
          },
        ]"
        [label]="question.label + '*'"
      ></ignt-input-field>
    </div>
  </div>
</div>
