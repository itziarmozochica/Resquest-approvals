<div class="fv-booking-question-tel" [formGroup]="formGroup">
  <app-booking-question-tel
    [id]="controlId || (question | buildBookingQuestionId)"
    data-testid="booking-question-telephone-input"
    [formControlName]="controlId || (question | buildBookingQuestionId)"
    [countryCodes]="countryCodes"
    [error]="getControlError(formGroup.get(controlId || (question | buildBookingQuestionId)))"
  ></app-booking-question-tel>
  <ng-container *ngFor="let error of PHONE_ERRORS">
    <ng-container
      *ngTemplateOutlet="
        errorMessage;
        context: {
          controlName: controlId || (question | buildBookingQuestionId),
          errorName: error.name,
          errorMessage: error.message,
        }
      "
    >
    </ng-container>
  </ng-container>
</div>
<ng-template #errorMessage let-controlName="controlName" let-errorName="errorName" let-errorMessage="errorMessage">
  <ng-container *ngIf="formGroup.get(controlName).touched">
    <ignt-field-error [formControlValue]="formGroup.get(controlName)" [errorName]="errorName">
      {{ errorMessage | translate }}
    </ignt-field-error>
  </ng-container>
</ng-template>
