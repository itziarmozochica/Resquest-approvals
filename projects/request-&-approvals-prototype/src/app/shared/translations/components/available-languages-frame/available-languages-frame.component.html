<div class="available-languages-frame">
  <div class="available-languages-frame__header">
    <h3 class="available-languages-frame__title" translate>shared.translations.availableLanguages</h3>
    @if (editable()) {
      <ignt-button
        data-testid="languages-edit"
        size="small"
        variant="primary"
        [label]="'common.edit' | translate"
        [disabled]="editDisabled()"
        (click)="openEdit()"
      ></ignt-button>
    }
  </div>

  <div class="available-languages-frame__languages">
    @for (language of availableLanguages(); track language.code) {
      <app-language-button
        [flagUrl]="'assets/images/flags/' + language.code + '.png'"
        [hasTranslation]="language.hasTranslation"
        [isDefault]="language.isDefault"
        [isSelected]="language.isSelected"
        [languageCode]="language.code"
        [languageName]="language.name"
        (languageSelected)="selectLanguage($event)"
      ></app-language-button>
    }
  </div>

  @if (hasMissingTranslations()) {
    <div class="available-languages-frame__warning">
      <ignt-icon class="available-languages-frame__warning-icon" name="exclamation-triangle" variant="solid" size="sm"></ignt-icon>
      <span translate>shared.translations.missingTranslationsWarning</span>
    </div>
  }
</div>
