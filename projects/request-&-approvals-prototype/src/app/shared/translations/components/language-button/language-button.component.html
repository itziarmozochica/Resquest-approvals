<button
  type="button"
  class="language-button"
  [attr.data-testid]="'language-button-' + languageCode()"
  [class.language-button--full-width]="fullWidth()"
  [class.language-button--sidebar]="variant() === 'sidebar'"
  [class.language-button--checked]="isSelected()"
  [attr.aria-pressed]="isSelected()"
  [disabled]="disabled()"
  (click)="handleClick()"
>
  @if (flagUrl()) {
    <img class="language-button__flag" alt="" [src]="currentFlagUrl()" (error)="onFlagImageError()" />
  }
  <span class="language-button__name">{{ languageName() }}</span>
  @if (isDefault()) {
    <span class="language-button__default-tag">{{ 'shared.translations.defaultBadge' | translate }}</span>
  }
  @if (variant() === 'sidebar') {
    <ignt-icon
      class="language-button__status language-button__status--complete"
      name="check-circle"
      variant="solid"
      size="sm"
      aria-hidden="true"
      [style.visibility]="hasTranslation() ? 'visible' : 'hidden'"
    ></ignt-icon>
  } @else {
    <ignt-icon
      class="language-button__status"
      variant="solid"
      size="sm"
      [attr.aria-label]="(hasTranslation() ? 'shared.translations.translated' : 'shared.translations.notTranslated') | translate"
      [class.language-button__status--complete]="hasTranslation()"
      [class.language-button__status--missing]="!hasTranslation()"
      [name]="statusIconName()"
    ></ignt-icon>
  }
</button>
