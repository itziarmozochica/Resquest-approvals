<ignt-dialog-header [hideCloseButton]="true">{{ 'shared.translations.languagesForm.sliderTitle' | translate }} </ignt-dialog-header>

<ignt-dialog-content>
  <div class="edit-languages-sidebar">
    <ignt-input-field
      id="language-search"
      [label]="'common.search' | translate"
      [leadIcon]="['fal', 'search']"
      [ngModel]="searchQuery()"
      (ngModelChange)="searchQuery.set($event)"
    ></ignt-input-field>
    <div class="edit-languages-sidebar__list">
      @for (language of filteredLanguages(); track language.code) {
        <app-language-button
          variant="sidebar"
          [flagUrl]="'assets/images/flags/' + language.code + '.png'"
          [hasTranslation]="language.hasTranslation"
          [isDefault]="language.isDefault"
          [disabled]="language.isDefault"
          [isSelected]="language.isSelected"
          [languageCode]="language.code"
          [languageName]="language.name"
          (languageSelected)="toggleLanguage($event)"
        ></app-language-button>
      }
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer>
  <ignt-button
    data-testid="languages-submit"
    variant="primary"
    [disabled]="!canSave()"
    [label]="'common.save' | translate"
    [igntDialogClose]="selectedCodesArray()"
  ></ignt-button>
</ignt-dialog-footer>
