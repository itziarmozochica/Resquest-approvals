<div class="audit-change-log-filters" data-testid="audit-change-log-filters">
  <div class="audit-change-log-filters__field" data-testid="audit-change-log-filters-type">
    <ignt-typeahead
      container="body"
      [isInDialog]="true"
      [editable]="false"
      [fieldLabel]="'audit.changeLog.filters.type' | translate"
      [options]="typeOptions()"
      [selectedOption]="selectedTypeOption()"
      (selected)="onTypeSelected($event)"
    ></ignt-typeahead>
  </div>

  <div class="audit-change-log-filters__field" data-testid="audit-change-log-filters-user">
    <ignt-typeahead
      container="body"
      [isInDialog]="true"
      [editable]="true"
      [openOnClick]="false"
      [minSearchLength]="1"
      [fieldLabel]="'audit.changeLog.filters.user' | translate"
      [emptyLabel]="'audit.changeLog.filters.userPlaceholder' | translate"
      [options]="actorOptions()"
      [refreshTrigger]="actorsRefresh"
      [selectedOption]="selectedActorOption()"
      (selected)="onActorSelected($event)"
      (inputInteraction)="onActorSearch($event)"
    ></ignt-typeahead>
  </div>

  <div class="audit-change-log-filters__field">
    <label class="audit-change-log-filters__label" [for]="fromInputId">{{ 'audit.changeLog.filters.from' | translate }}</label>
    <ignt-native-date-input
      type="datetime-local"
      testId="audit-change-log-filters-from"
      [inputId]="fromInputId"
      [value]="value().from"
      (valueChange)="onFromChange($event)"
    ></ignt-native-date-input>
  </div>

  <div class="audit-change-log-filters__field">
    <label class="audit-change-log-filters__label" [for]="toInputId">{{ 'audit.changeLog.filters.to' | translate }}</label>
    <ignt-native-date-input
      type="datetime-local"
      testId="audit-change-log-filters-to"
      [inputId]="toInputId"
      [value]="value().to"
      (valueChange)="onToChange($event)"
    ></ignt-native-date-input>
  </div>
</div>
