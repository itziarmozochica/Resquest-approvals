<div class="multi-step-modal-step-host">
  @if (loadError()) {
    <div class="multi-step-modal-step-host__error" data-testid="multi-step-modal-step-error" role="alert">
      <p class="multi-step-modal-step-host__error-title">{{ 'common.errorTitle' | translate }}</p>
      <button class="multi-step-modal-step-host__retry" data-testid="multi-step-modal-step-retry" type="button" (click)="retry()">
        {{ 'common.retry' | translate }}
      </button>
    </div>
  } @else {
    @for (step of activeStep(); track step.id) {
      <div class="multi-step-modal-step-host__step">
        <ng-container *ngComponentOutlet="step.component"></ng-container>
      </div>
    }
  }
</div>
