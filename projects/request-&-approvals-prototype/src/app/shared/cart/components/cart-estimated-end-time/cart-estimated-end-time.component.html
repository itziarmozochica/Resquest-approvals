@if (estimatedEndTime(); as endTime) {
  <div class="estimated-end-time">
    <div class="estimated-end-time__gutter"></div>
    <div
      class="estimated-end-time__text"
      data-testid="cart-ticket-estimated-end-time"
      [innerHTML]="endTime.translationKey | translate: endTime.params"
    ></div>
  </div>
}
