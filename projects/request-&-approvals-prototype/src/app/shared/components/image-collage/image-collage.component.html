@if (visibleImages().length > 0) {
  <div class="image-collage" data-testid="image-collage" [class]="layoutClass()">
    @for (image of visibleImages(); track image.url + $index) {
      <img class="image-collage__item" [attr.data-index]="$index" [src]="image.url" [alt]="image.alt" (error)="onImageError(image.url)" />
    }
  </div>
}
