<div class="actions-bar">
  @if (showSaveDraftButton) {
    <button
      igntButton
      type="button"
      sentiment="secondary"
      variant="sharp"
      [disabled]="saveDraftDisabled"
      [loading]="saveDraftLoading"
      (click)="saveDraft.emit()"
      [attr.data-testid]="saveDraftTestId || 'actions-bar-save-draft'"
    >
      {{ saveDraftTranslationKey | translate }}
    </button>
  }
  <div class="actions-bar__right">
    @if (showBackButton) {
      <button
        type="button"
        igntButton
        sentiment="secondary"
        (click)="back.emit()"
        [attr.data-testid]="backButtonTestId || 'actions-bar-back'"
      >
        {{ backTranslationKey | translate }}
      </button>
    }
    <button
      type="button"
      igntButton
      sentiment="primary"
      variant="sharp"
      [disabled]="continueButtonDisabled"
      [loading]="continueButtonLoading"
      (click)="continue.emit()"
      [attr.data-testid]="continueButtonTestId || 'actions-bar-continue'"
    >
      @if (continueButtonLoading && useConfirmButton) {
        {{ savingTranslationKey | translate }}
      } @else if (continueButtonTranslationKey) {
        {{ continueButtonTranslationKey | translate }}
      } @else if (continueButtonLabel) {
        {{ continueButtonLabel }}
      } @else if (useConfirmButton) {
        {{ confirmTranslationKey | translate }}
      } @else {
        {{ continueTranslationKey | translate }}
      }
    </button>
  </div>
</div>
