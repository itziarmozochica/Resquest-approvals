<ignt-alert sentiment="neutral">
  <ng-template #igntAlertContent>
    <span class="loading-notice">
      <ignt-icon class="loading-notice__spinner" name="spinner-third" variant="duotone" size="h3" [spin]="true" aria-hidden="true" />
      <span data-testid="loading-notice-label">{{ label() }}</span>
    </span>
  </ng-template>
</ignt-alert>
