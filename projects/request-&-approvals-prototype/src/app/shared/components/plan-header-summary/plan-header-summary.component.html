<div class="header__content">
  <div
    class="header__image"
    [style.background-image]="imageUrl() ? 'url(' + imageUrl() + ')' : 'none'"
    data-testid="plan-header-summary-image"
  ></div>
  <div class="header__details">
    <div class="header__properties">
      <div class="header__plan-name" data-testid="plan-header-summary-title">
        {{ name() }}
      </div>
      @if (venue(); as venueName) {
        <div class="header__location" data-testid="plan-header-summary-subtitle">
          <ignt-icon class="header__location-icon" name="map-marker-alt" variant="light" aria-hidden="true"></ignt-icon>
          <div class="header__venue">
            {{ venueName }}
          </div>
        </div>
      }
    </div>
  </div>
</div>

@if (shouldShowPreviewLinks()) {
  <app-plan-preview-links
    class="header__preview-links"
    data-testid="plan-header-summary-preview-links"
    [planId]="planId()!"
    [partnerId]="partnerId()!"
    [hasUnsavedChanges]="hasUnsavedChanges()"
  ></app-plan-preview-links>
}
