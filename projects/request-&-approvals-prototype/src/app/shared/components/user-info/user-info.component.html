<div class="user-info">
  <div class="user-info__user">
    <fa-icon class="user-info__icon" [icon]="['fal', 'user-circle']"></fa-icon>
    <p class="user-info__user-name" data-testid="menu-user-name">{{ userName() }}</p>
  </div>
  @if (partner(); as partner) {
    <div class="user-info__organization">
      <p class="user-info__partner-info" data-testid="menu-partner-info">
        <fa-icon class="user-info__partner-icon" [icon]="['fal', 'city']"></fa-icon>
        {{ partner.name }} - {{ partner.countryCode }}
      </p>
      @if (favoriteOrganization(); as organization) {
        <app-organization-favorite-star class="user-info__favorite" [organization]="organization" (mousedown)="$event.preventDefault()" />
      }
    </div>
  }
</div>
