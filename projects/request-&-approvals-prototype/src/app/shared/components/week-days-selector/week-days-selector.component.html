<div class="week-days-selector">
  <div [class.week-days-selector__buttons--disabled]="isDisabled" class="week-days-selector__buttons" data-testid="week-days-selector">
    <div
      *ngFor="let weekday of weekDays"
      data-testid="week-days-selector-button"
      class="week-day-button"
      [class.week-day-button--active]="selectedWeekDaysMap[weekday]"
      [class.week-day-button--error]="nonValidSelectedWeekDays[weekday]"
      (click)="!isDisabled && toggleWeekDaySelection(weekday)"
    >
      <span>{{ 'common.weekDaysLabels.' + weekday | translate }}</span>
    </div>
  </div>
</div>
