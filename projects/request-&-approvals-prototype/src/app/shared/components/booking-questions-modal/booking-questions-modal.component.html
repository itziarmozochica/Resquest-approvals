<main class="main-wrapper">
  <div class="booking-questions-header__title" data-testid="modal-title">
    {{ titleKey | translate }}
  </div>
  @if (formGroup(); as formGroup) {
    <form class="booking-questions__wrapper form" [formGroup]="formGroup">
      <fv-booking-questions-form-group
        [formData]="formData()"
        [formGroup]="formGroup"
        [showTicketCounter]="true"
        [showTicketLabel]="true"
        [customer]="customer"
      ></fv-booking-questions-form-group>
    </form>
  }
  @if (serverError(); as serverError) {
    <div class="server-error" role="alert" data-testid="booking-questions-server-error">
      <ignt-alert sentiment="danger" [description]="serverError.translate ? (serverError.message | translate) : serverError.message" />
    </div>
  }
  <div class="action-footer">
    <ignt-button
      data-testid="booking-questions-cancel"
      sentiment="danger"
      variant="secondary"
      [label]="'common.cancel' | translate"
      (click)="onCancel()"
    />
    <ignt-button
      data-testid="booking-questions-continue"
      [disabled]="!formGroup()?.valid"
      [loading]="saving()"
      igntTooltip
      [tooltipLabel]="'bookingQuestionsForm.continueDisabled' | translate"
      [tooltipDisabled]="!!formGroup()?.valid"
      [label]="'common.continue' | translate"
      (click)="onSubmit()"
    />
  </div>
</main>
