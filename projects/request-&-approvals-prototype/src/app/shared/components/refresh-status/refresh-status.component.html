<div class="refresh-status" [class.refresh-status--adaptive]="allowTimeOnly()" data-testid="refresh-status">
  @if (!isOffline() && updatedAtTime(); as time) {
    <span class="refresh-status__full" data-testid="refresh-status-updated">
      {{ 'refreshStatus.updatedAt' | translate: { time } }}
    </span>
    @if (allowTimeOnly()) {
      <span class="refresh-status__time" data-testid="refresh-status-time" [attr.title]="'refreshStatus.updatedAt' | translate: { time }">
        {{ time }}
      </span>
    }
  }
  <span role="status" data-testid="refresh-status-offline">
    @if (isOffline()) {
      {{ 'refreshStatus.offline' | translate }}
    }
  </span>
</div>
