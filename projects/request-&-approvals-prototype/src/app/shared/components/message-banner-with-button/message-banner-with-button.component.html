@if (isVisible) {
  <ignt-alert [description]="message" data-testid="banner-alert" showCloseButton (closeAlert)="handleClose()">
    <ng-template #igntAlertActions>
      <button
        igntButton
        size="small"
        sentiment="secondary"
        data-testid="banner-button"
        [attr.data-link]="buttonLink"
        (click)="goToLink()"
        target="_blank"
      >
        {{ buttonText }}
      </button>
    </ng-template>
  </ignt-alert>
}
