<ul class="percentage-color-legend">
  <li class="percentage-color-legend__item" *ngFor="let item of legendItems; trackBy: trackByLegendItem">
    <span class="percentage-color-legend__icon">
      <span class="percentage-color-legend__circle" [ngClass]="item.cssClass"></span>
    </span>
    <span class="percentage-color-legend__text">
      <strong>{{ item.description | translate }}</strong> {{ item.range }}
    </span>
  </li>
</ul>
