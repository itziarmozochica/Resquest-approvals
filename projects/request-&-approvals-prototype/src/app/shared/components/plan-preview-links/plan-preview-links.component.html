<div class="plan-preview-links">
  @if (isSingleLink()) {
    @if (firstLinkSafeUrl(); as safeUrl) {
      <a igntLink size="small" [href]="safeUrl" target="_blank" rel="noopener noreferrer" (click)="onSingleLinkClick($event)">
        {{ 'planSetup.previewLinks.viewPreview' | translate }}
      </a>
    }
  }

  @if (isMultipleLinks()) {
    <ignt-button-dropdown
      class="plan-preview-links__dropdown"
      [autoWidth]="true"
      [options]="linkOptions()"
      align="right"
      sentiment="tertiary"
      size="small"
      [hoverEffect]="true"
      (optionClick)="onLinkOptionClick($event)"
    >
      {{ 'planSetup.previewLinks.viewPreviewIn' | translate }}
    </ignt-button-dropdown>
  }
</div>
