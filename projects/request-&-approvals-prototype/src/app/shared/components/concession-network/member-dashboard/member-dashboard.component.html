<ng-container *ngIf="!channelId">
  <fa-icon *ngIf="loading" [icon]="['fas', 'spinner']" [size]="'4x'" class="loader"></fa-icon>
  <div *ngIf="error">
    <p class="error-message">{{ 'resellers.errorLoadingSubReseller' | translate }}</p>
  </div>
</ng-container>

<app-organization-dashboard
  *ngIf="channelId"
  [groupName]="GraphGroup.affiliatesOverview"
  [channelId]="channelId"
></app-organization-dashboard>
<app-organization-dashboard
  *ngIf="channelId"
  [channelId]="channelId"
  [groupName]="GraphGroup.affiliatesNetwork"
></app-organization-dashboard>
