<div class="item-card item-card wrapper wrapper--align-center">
  <div class="item-card__content cell cell--fill">
    <div class="item-card__label">{{ 'boxOffice.priceViewer.cardTitle' | translate }}</div>
    <div class="item-card__supporting-text">
      <div class="item-card__icon">
        <fa-icon [fixedWidth]="true" [icon]="['fas', 'tag']"></fa-icon>
      </div>
      {{ 'boxOffice.priceViewer.status.' + priceViewerStatus | translate }}
    </div>
    <div
      class="item-card__supporting-text"
      *ngIf="priceViewerStatus != 'connected' && priceViewerStatus != 'connecting' && priceViewerStatus != 'writing'"
    >
      <a (click)="force()" href="javascript:;">{{ 'boxOffice.priceViewer.forceReconnection' | translate }}</a>
    </div>
  </div>
</div>
