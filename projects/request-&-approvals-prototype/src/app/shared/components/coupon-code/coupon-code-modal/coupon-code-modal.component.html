<ignt-dialog-header data-testid="coupon-code-modal">
  {{ title }}
  <ng-template>
    @if (hasNavigation) {
      <button
        type="button"
        ignt-icon-button
        variant="sharp"
        sentiment="tertiary"
        aria-label="Back"
        data-testid="coupon-code-modal-back"
        [icon]="['fas', 'chevron-left']"
        [igntDialogClose]="'Back click'"
      ></button>
    }
  </ng-template>
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="coupon-code-modal-body">
    <div class="coupon-code-modal-body__subtitle">{{ subtitleKey | translate }}</div>
    <app-coupon-code
      [delegateScannerOpen]="true"
      [error]="error"
      [inputCode]="inputCode"
      [prefilledCode]="scannedCode"
      (couponCode)="emitCouponCode($event)"
      (scannerOpen)="onScannerOpen()"
      [wrapButton]="true"
    ></app-coupon-code>
  </div>
</ignt-dialog-content>
