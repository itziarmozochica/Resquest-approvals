<div class="coupon">
  <form class="coupon__form" [class.coupon__form--column]="wrapButton" [formGroup]="couponForm">
    <div class="coupon__form-field">
      <div>
        <div class="form-group-wrapper">
          <div [class.form-group--error]="getControlError(couponForm.get('couponInput'))" class="form-group form-group--white">
            <input
              data-testid="coupon-code-input"
              class="form-input coupon__form__code-input"
              type="text"
              id="couponInput"
              formControlName="couponInput"
              [placeholder]="'boxOffice.coupon.codePlaceholder' | translate"
            />
          </div>
          <div
            class="coupon__form__action-input"
            [class.coupon__form__action-input--error]="getControlError(couponForm.get('couponInput'))"
            (click)="openScanner()"
          >
            <fa-icon [icon]="['fas', 'qrcode']"></fa-icon>
          </div>
        </div>
        <ng-container *ngTemplateOutlet="validationErrors"></ng-container>
      </div>
    </div>
    <div>
      <button
        data-testid="coupon-apply-button"
        igntButton
        [sentiment]="wrapButton ? 'primary' : 'secondary'"
        [fill]="wrapButton"
        [loading]="isLoading"
        [disabled]="!getCouponInput()?.value?.trim() || isLoading"
        (click)="applyCoupon()"
      >
        <span>
          {{ 'boxOffice.coupon.applyButton' | translate }}
        </span>
      </button>
    </div>
  </form>
</div>

<ng-template #validationErrors>
  <ng-container *ngIf="getControlError(couponForm.get('couponInput'))">
    <div class="form-error">
      <fa-icon [icon]="['fas', 'exclamation-circle']" class="form-error--icon"></fa-icon>
      <span class="form-error--message" data-testid="error-min-value-field">
        {{ errorMessage$() | translate: { lazyCouponType: errorMessageLazyCouponType } }}
      </span>
    </div>
  </ng-container>
</ng-template>
