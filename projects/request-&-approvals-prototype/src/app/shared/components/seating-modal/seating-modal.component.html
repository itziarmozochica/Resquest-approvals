<app-modal-content class="seating-modal" data-testid="seating-modal">
  <div class="seating-modal__title" data-testid="seating-modal-title">
    <span>{{ 'invitations.seatingInformation' | translate }}</span>
  </div>

  <div data-testid="seating-modal-sessions" class="seating-modal__sessions">
    <div *ngFor="let session of sessionsSeats; let i = index; trackBy: trackBySession" data-testid="seating-modal-session">
      <button
        type="button"
        class="seating-modal__header"
        (click)="toggleSession(i)"
        data-testid="seating-modal-session-header"
        [attr.aria-controls]="'seating-modal-session-content-' + i"
        [attr.aria-expanded]="!collapsedSessions().has(i)"
      >
        <span class="count" data-testid="seating-modal-number-of-tickets"> {{ session.units }}x </span>
        <span class="session">
          <span class="session-name" data-testid="seating-modal-session-name">
            {{ session.sessionName }}
          </span>
        </span>
        <fa-icon
          class="seating-modal__toggle"
          [icon]="['fal', collapsedSessions().has(i) ? 'chevron-right' : 'chevron-down']"
          data-testid="seating-modal-toggle-icon"
        ></fa-icon>
      </button>

      <div class="seating-modal__content" *ngIf="!collapsedSessions().has(i)" [attr.id]="'seating-modal-session-content-' + i">
        <div class="seating-list" data-testid="seating-modal-seating-list">
          <div *ngFor="let seat of session?.seats" class="seating-list__seat">
            <fa-icon class="icon" [icon]="['fal', 'loveseat']"></fa-icon>
            <span class="seat" data-testid="seating-modal-seat">
              {{ seat }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="mapConfig" class="seating-modal__map" data-testid="seating-modal-map">
    <div id="seating-modal-chart" class="seating-modal__map-container"></div>
  </div>

  <div class="seating-modal__button">
    <button (click)="close()" class="box-office-content__button box-office-content__button--outline" data-testid="seating-modal-button">
      <span>{{ 'invitations.closeSeating' | translate }}</span>
    </button>
  </div>
</app-modal-content>
