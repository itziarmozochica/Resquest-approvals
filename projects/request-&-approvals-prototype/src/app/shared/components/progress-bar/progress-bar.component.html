<div class="progress-bar__percentage" data-testid="progress-bar-percentage" [ngClass]="'progress-bar__percentage--' + percentagePosition">
  {{ percentage }}%
</div>
<div class="progress-bar__track">
  <div
    class="progress-bar__fill"
    [style.width.%]="percentage"
    [attr.data-percentage]="percentage"
    [class]="'progress-bar__fill--' + sentiment"
    data-testid="progress-bar__fill"
  ></div>
</div>
