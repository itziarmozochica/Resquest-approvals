<span
  class="tooltip-icon"
  data-testid="tooltip-icon"
  igntTooltip
  tabindex="0"
  [tooltipMaxWidth]="tooltipMaxWidth()"
  [tooltipPlacement]="placement()"
  [tooltipTemplate]="tooltipTemplate"
>
  <ignt-icon [name]="name()" [size]="size()" [variant]="variant()" aria-hidden="true"></ignt-icon>
</span>

<ng-template #tooltipTemplate>
  <div class="tooltip-icon__content" data-testid="tooltip-icon-content" [innerHTML]="tooltip()"></div>
</ng-template>
