<div class="digit-input">
  <div class="digit-input__container">
    <div class="digit-input__fields">
      @for (i of getInputArray(); track i; let index = $index) {
        <input
          #digitInput
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="1"
          class="digit-input__field"
          [class.digit-input__field--focused]="focusedIndex() === index"
          (input)="onDigitInput($event, index)"
          (keydown)="onKeyDown($event, index)"
          (paste)="onPaste($event, index)"
          (focus)="onFocus(index)"
          autocomplete="off"
          [attr.data-testid]="'digit-input-field-' + index"
        />
      }
    </div>
    @if (showToggleVisibility()) {
      <button
        type="button"
        class="digit-input__toggle"
        (click)="toggleVisibility()"
        [attr.aria-label]="(isVisible() ? 'common.hide' : 'common.show') | translate"
        data-testid="toggle-digit-visibility-button"
      >
        <fa-icon [icon]="isVisible() ? ['fal', 'eye-slash'] : ['fal', 'eye']"></fa-icon>
      </button>
    }
  </div>
</div>
