<!-- For the CSS animation to work, the list items need to be repeated. -->
<ul class="mosaic-slider" [class.mosaic-slider--paused]="isMainScreenBusy()">
  <ng-container *ngFor="let images of imagesList">
    <li class="mosaic-slider__column">
      <ng-container *ngFor="let image of images">
        <img [src]="image" width="400" height="500" decoding="async" alt="" />
      </ng-container>
    </li>
  </ng-container>
</ul>
