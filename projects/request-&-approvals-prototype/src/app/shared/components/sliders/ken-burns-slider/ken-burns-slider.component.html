<div class="kb-slider">
  <ul class="kb-slider-list">
    @for (slide of slides(); track slide.step) {
      <li
        class="kb-slider-list__item"
        data-testid="ken-burns-slide"
        [class.kb-slider-list__item--is-active]="slide.role === slideRole.Active"
        [class.kb-slider-list__item--is-leaving]="slide.role === slideRole.Leaving"
        [style.--kb-pan-x]="slide.panX"
        [style.--kb-pan-y]="slide.panY"
      >
        <img [src]="slide.item.image" [alt]="slide.item.alt" decoding="async" (click)="imageClicked.emit(currentIndex())" />
        <div class="kb-slider-list-item__caption">
          <div class="kb-slider-list-item__event-name">
            {{ slide.item.alt }}
          </div>
        </div>
      </li>
    }
  </ul>
</div>
