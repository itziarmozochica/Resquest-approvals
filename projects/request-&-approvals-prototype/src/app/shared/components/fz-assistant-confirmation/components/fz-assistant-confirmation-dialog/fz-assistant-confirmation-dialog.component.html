<h2 id="fz-assistant-confirmation-title" class="fz-assistant-confirmation-dialog__title" data-testid="fz-assistant-confirmation-title">
  {{ 'chatbot.confirmation.title' | translate }}
</h2>

<p class="fz-assistant-confirmation-dialog__action" data-testid="fz-assistant-confirmation-action">
  {{ actionSummary().key | translate: actionSummary().params }}
</p>

<!-- Interpolated, never bound as HTML: this string is the agent's, and §5.15 treats agent and captured
     content as data rather than as anything the page should render as markup. -->
<p id="fz-assistant-confirmation-message" class="fz-assistant-confirmation-dialog__message" data-testid="fz-assistant-confirmation-message">
  {{ data.confirmationMessage }}
</p>

<div class="fz-assistant-confirmation-dialog__actions">
  <!-- Decline first in the DOM as well as in focus order: it is the safe answer, and a Partner tabbing
       forward should reach it before the one that commits. -->
  <ignt-button
    #declineButton
    [label]="'chatbot.confirmation.decline' | translate"
    variant="secondary"
    sentiment="neutral"
    data-testid="fz-assistant-confirmation-decline"
    (click)="decline()"
  ></ignt-button>
  <ignt-button
    [label]="'chatbot.confirmation.approve' | translate"
    variant="primary"
    data-testid="fz-assistant-confirmation-approve"
    (click)="approve()"
  ></ignt-button>
</div>
