<div class="card-stripe-input">
  <div class="card-stripe-input__form" [id]="cardElementId" data-testid="card-stripe-input"></div>
  <div class="card-stripe-input__card-logos">
    <img *ngFor="let cardLogo of cardLogos" [src]="cardLogo" data-testid="card-logo" />
  </div>
  <div class="payment-secure-message">
    <fa-icon [icon]="['fal', 'lock-alt']"></fa-icon>
    <span>{{ 'reservation.checkout.paymentSecureMessage' | translate }}</span>
  </div>
  <div class="payment-terms">
    <a target="_blank" [href]="termsLink">{{ 'reservation.checkout.terms' | translate }}</a>
    <a target="_blank" [href]="privacyPolicyLink">{{ 'reservation.checkout.privacy' | translate }}</a>
  </div>
</div>
