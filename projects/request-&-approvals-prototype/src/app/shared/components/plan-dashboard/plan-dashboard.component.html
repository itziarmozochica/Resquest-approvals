<app-page-title [title]="'planDetail.dashboard' | translate"></app-page-title>
@if (showSearchBar) {
  <app-search-bar
    [mandatoryFilters]="[searchBarFilter.plan]"
    [showVenue]="true"
    [screen]="screen.dashboard"
    [preselectActiveCity]="false"
    [preselectActivePlan]="false"
    (searchEmitter)="loadNewSearch($event)"
  >
  </app-search-bar>
}
@if (plan && isDraftPlan && plan.id) {
  <app-plan-creation [planId]="plan.id"></app-plan-creation>
} @else if (plan && !isDraftPlan && showReadyPanel) {
  <div class="plan-dashboard__ready-panel">
    <app-plan-review-success-panel
      variant="ready"
      (backToList)="onBackToEventList()"
      (takeMeToChannels)="onTakeMeToChannels()"
    ></app-plan-review-success-panel>
  </div>
} @else if (plan && !isDraftPlan) {
  <app-plan-metrics [plan]="plan" [channelId]="channelId"></app-plan-metrics>
} @else if (showSelectPlan) {
  <div class="select-plan" data-testid="select-plan-view">
    <div class="select-plan__content">
      <h4 class="select-plan__title" data-testid="select-plan-title">{{ 'selectEvent.title' | translate }}</h4>
      <p class="select-plan__description" data-testid="select-plan-description">{{ 'selectEvent.description' | translate }}</p>
      <div class="select-plan__image">
        <img
          src="assets/images/shared/shiny-happy-stats-and-graphs.svg"
          alt="{{ 'selectEvent.title' | translate }}"
          class="select-plan__illustration"
        />
      </div>
    </div>
  </div>
}
