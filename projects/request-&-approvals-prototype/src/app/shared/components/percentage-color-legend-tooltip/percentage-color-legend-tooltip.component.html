<ng-template #colorLegendTemplate>
  <div class="percentage-color-legend-tooltip">
    <app-percentage-color-legend [colorScheme]="colorScheme"></app-percentage-color-legend>

    <ng-container *ngIf="displayHiddenAndSoldOut">
      <hr class="percentage-color-legend__separator" />
      <ul class="percentage-color-legend">
        <li class="percentage-color-legend__item">
          <span class="percentage-color-legend__icon">
            <fa-icon class="hidden-icon" [icon]="['fal', 'eye-slash']"></fa-icon>
          </span>
          <span class="percentage-color-legend__text">
            <strong>{{ 'sessions.calendar.hidden' | translate }}</strong>
          </span>
        </li>
        <li class="percentage-color-legend__item">
          <span class="percentage-color-legend__icon">
            <app-on-off-badge [isOn]="false"> </app-on-off-badge>
          </span>
          <span class="percentage-color-legend__text">
            <strong>{{ 'sessions.calendar.forcedClosureOfSales' | translate }}</strong>
          </span>
        </li>
      </ul>
    </ng-container>
  </div>
</ng-template>

<span [appTemplatedTooltip]="colorLegendTemplate">
  <fa-icon [icon]="['fas', 'tint']"></fa-icon> {{ 'sessions.calendar.colorsLegendTooltip' | translate }}
</span>
