<ul class="chatbot-suggestions" data-testid="chatbot-suggestions-list">
  @for (suggestion of suggestions(); track $index) {
    <li class="chatbot-suggestions__item" data-testid="chatbot-suggestion-item" (click)="onSuggestionClick(suggestion)">
      <div class="chatbot-suggestions__item-content">
        <ignt-icon class="chatbot-suggestions__icon" [name]="suggestion.iconName" [variant]="suggestion.iconVariant" aria-hidden="true" />
        <span class="chatbot-suggestions__text">{{ suggestion.text }}</span>
      </div>
      @if (suggestion.tags?.length) {
        <div class="chatbot-suggestions__tags">
          @for (tag of suggestion.tags; track $index) {
            <span class="chatbot-suggestions__tag">{{ tag }}</span>
          }
        </div>
      }
    </li>
  }
</ul>
