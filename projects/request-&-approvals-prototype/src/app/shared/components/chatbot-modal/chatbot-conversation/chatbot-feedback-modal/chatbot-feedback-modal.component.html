<ignt-dialog-header>{{ 'chatbot.submitFeedback.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="feedback-options">
    @for (option of feedbackOptions; track option.value) {
      <label class="feedback-option" [class.feedback-option--other]="option.value === 'other'" (click)="selectReason(option.value)">
        <input
          type="radio"
          name="feedbackReason"
          [value]="option.value"
          [checked]="selectedReason() === option.value"
          (change)="selectReason(option.value)"
        />
        <span>{{ option.translationKey | translate }}</span>
      </label>
    }
    <textarea
      class="feedback-details"
      rows="4"
      [placeholder]="'chatbot.submitFeedback.detailsPlaceholder' | translate"
      [ngModel]="details()"
      (ngModelChange)="details.set($event)"
      data-testid="chatbot-feedback-details"
    ></textarea>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="tertiary" (click)="cancel()">
    {{ 'chatbot.submitFeedback.cancel' | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    [disabled]="isSubmitDisabled()"
    (click)="submit()"
    data-testid="chatbot-feedback-submit"
  >
    {{ 'chatbot.submitFeedback.submit' | translate }}
  </button>
</ignt-dialog-footer>
