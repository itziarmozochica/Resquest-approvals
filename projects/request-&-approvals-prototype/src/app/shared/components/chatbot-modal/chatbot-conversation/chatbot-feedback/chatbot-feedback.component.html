<div class="chatbot-feedback">
  <button
    class="chatbot-feedback__button chatbot-feedback__button--positive"
    [class.chatbot-feedback__button--selected]="selectedFeedback() === 'positive'"
    data-testid="chatbot-feedback-thumbs-up"
    type="button"
    (click)="onFeedbackClick('positive')"
  >
    <fa-icon [icon]="['far', 'thumbs-up']" />
  </button>
  <button
    class="chatbot-feedback__button chatbot-feedback__button--negative"
    [class.chatbot-feedback__button--selected]="selectedFeedback() === 'negative'"
    data-testid="chatbot-feedback-thumbs-down"
    type="button"
    (click)="onFeedbackClick('negative')"
  >
    <fa-icon [icon]="['far', 'thumbs-down']" flip="horizontal" />
  </button>
</div>
