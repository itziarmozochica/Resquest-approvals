<div class="chatbot-dataset">
  <div class="chatbot-dataset__header">
    @if (preview()) {
      <button type="button" class="chatbot-dataset__toggle" data-testid="chatbot-dataset-toggle" (click)="toggleExpanded()">
        <span class="chatbot-dataset__title" data-testid="chatbot-dataset-title">{{ datasetName() }}</span>
        <ignt-icon [name]="isExpanded() ? 'chevron-up' : 'chevron-down'" variant="solid" />
      </button>
    } @else {
      <span class="chatbot-dataset__title" data-testid="chatbot-dataset-title">{{ datasetName() }}</span>
    }
    <button type="button" class="chatbot-dataset__link" [disabled]="loading()" (click)="onDownloadClick()">
      {{ 'chatbot.dataset.downloadCsv' | translate }}
    </button>
  </div>
  @if (preview() && isExpanded()) {
    <div class="chatbot-dataset__body">
      <div class="chatbot-dataset__table-wrapper" data-testid="chatbot-dataset-table">
        <app-generic-table [columns]="tableColumns()" [data]="tableData()" tableClass="chatbot-dataset__table" />
      </div>
      @if (tableData().length < preview()!.row_count) {
        <span class="chatbot-dataset__row-count" data-testid="chatbot-dataset-row-count"
          >{{ tableData().length }} of {{ preview()!.row_count }} rows</span
        >
      }
    </div>
  }
</div>
