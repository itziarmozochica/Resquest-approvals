<div class="chatbot-message-wrapper" [class.chatbot-message-wrapper--ai]="!isHuman()" [class.chatbot-message-wrapper--human]="isHuman()">
  <div class="chatbot-message-inner">
    @if (isUiMessage()) {
      <div class="chatbot-content chatbot-content--ui" data-testid="chatbot-content-ui">
        @if (uiComponent(); as component) {
          <ng-container [ngComponentOutlet]="component" [ngComponentOutletInputs]="uiInputs()" />
        }
      </div>
    } @else if (isHuman()) {
      <p class="chatbot-content chatbot-content--human" data-testid="chatbot-content-text" [textContent]="textContent()"></p>
    } @else {
      <p class="chatbot-content chatbot-content--ai" data-testid="chatbot-content-text">
        <markdown class="markdown" ngPreserveWhitespaces [data]="textContent()"></markdown>
      </p>
    }
    <ng-content />
  </div>
</div>
