<div class="chatbot-chart">
  @if (isLoading()) {
    <div class="chatbot-chart__loading">
      <span class="chatbot-chart__spinner"></span>
    </div>
  } @else if (chartComponent()) {
    <div class="chatbot-chart__canvas">
      <ng-container [ngComponentOutlet]="chartComponent()" [ngComponentOutletInputs]="chartComponentInputs()" />
    </div>
  } @else {
    <div class="chatbot-chart__error">
      <span>{{ 'chatbot.chart.error' | translate }}</span>
    </div>
  }
</div>
