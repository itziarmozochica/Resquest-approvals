<div
  class="chatbot-conversation"
  [class.chatbot-conversation--human]="isHuman()"
  [class.chatbot-conversation--ai]="isAi()"
  data-testid="chatbot-conversation"
>
  <div
    class="chatbot-conversation__message"
    [class.chatbot-conversation--human]="isHuman()"
    [class.chatbot-conversation--ai]="isAi()"
    data-testid="chatbot-conversation-message"
  >
    @for (message of conversationItem().messages; track message.id; let isLast = $last) {
      <app-chatbot-message [message]="message">
        @if (isAi() && isLast) {
          <app-chatbot-feedback [selectedFeedback]="confirmedFeedback()" (feedbackSubmitted)="onFeedbackClick($event)" />
        }
      </app-chatbot-message>
    }
  </div>
</div>
