<div class="color-input">
  <div class="color-input__picker-wrapper">
    <input type="color" [value]="value" (input)="onColorChange($event)" class="color-input__picker" />
    <div class="color-input__hex-overlay color-hex-text" [style.background-color]="value" [style.color]="getTextColorForBackground(value)">
      {{ value.toUpperCase() }}
    </div>
  </div>
</div>
