<div class="media-guidelines-card-list">
  <div class="media-guidelines-card-list__header">
    <div class="media-guidelines-card-list__title">
      {{ title }}
    </div>
    <div class="media-guidelines-card-list__link">
      <ng-container *ngTemplateOutlet="linkTemplate"></ng-container>
    </div>
  </div>
  <div class="media-guidelines-card-list__requeriment-list">
    <div
      data-testid="media-guidelines-card-list-requeriment"
      *ngFor="let requeriment of requeriments; trackBy: trackBy"
      class="media-guidelines-card-list__requeriment"
    >
      <div data-testid="media-guidelines-card-list-icon" class="media-guidelines-card-list__icon">
        <ng-container
          *ngTemplateOutlet="
            layeredIcon;
            context: {
              iconDefinitions: getIconAsLayered(requeriment.icon),
            }
          "
        >
        </ng-container>
      </div>
      <div [innerHTML]="requeriment.text"></div>
    </div>
  </div>
</div>

<ng-template #layeredIcon let-iconDefinitions="iconDefinitions">
  <fa-layers [fixedWidth]="true">
    <fa-icon *ngFor="let icon of iconDefinitions; trackBy: trackBy" [icon]="icon"></fa-icon>
  </fa-layers>
</ng-template>
