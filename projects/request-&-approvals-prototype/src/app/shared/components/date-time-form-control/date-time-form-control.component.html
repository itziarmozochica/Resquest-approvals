<div class="date-time-form-control">
  <div class="double-field-wrapper" [formGroup]="dateTimeForm">
    <label class="field">
      <input
        class="field__input"
        [class.has-error]="dateHasError()"
        type="date"
        formControlName="date"
        [min]="getDateForInput(minDate ?? null)"
        [max]="getDateForInput(maxDate ?? null)"
        #dateInput
        (blur)="dateTouched.set(true)"
      />
      <span *ngIf="humanizedInput && humanizedDate" class="field__humanized">{{ humanizedDate }}</span>
      <span class="field__label">{{ dateLabel }}</span>
      <fa-icon
        class="field__icon field__icon--trail"
        (click)="openDatePicker()"
        [fixedWidth]="true"
        [icon]="['fal', 'calendar-day']"
      ></fa-icon>
    </label>
    <label class="field">
      <input
        class="field__input"
        [class.has-error]="timeHasError()"
        type="time"
        formControlName="time"
        (focus)="openPicker($event.target)"
        (blur)="timeTouched.set(true)"
      />
      <span class="field__label">{{ timeLabel }}</span>
      <fa-icon class="field__icon field__icon--trail" [fixedWidth]="true" [icon]="['fal', 'clock']"></fa-icon>
    </label>
  </div>
  @if (dateHasError() || timeHasError()) {
    <div class="date-time-form-control__errors">
      <span class="date-time-form-control__error">
        @if (dateHasError()) {
          <span class="field__helper field__helper--danger">
            <fa-icon [icon]="['fas', 'exclamation-circle']"></fa-icon>
            {{ dateError() }}
          </span>
        }
      </span>
      <span class="date-time-form-control__error">
        @if (timeHasError()) {
          <span class="field__helper field__helper--danger">
            <fa-icon [icon]="['fas', 'exclamation-circle']"></fa-icon>
            {{ timeError() }}
          </span>
        }
      </span>
    </div>
  }
</div>
