<div class="modal-body modal__content">
  <div class="modal__title" data-testid="modal-title">
    {{ 'orders.download.title' | translate }}
  </div>
  <div class="messages">
    <p data-testid="modal-message" class="messages__text">
      {{ 'orders.download.downloadOptionsDescription' | translate }}
    </p>
    <div class="messages__options">
      <label>
        <input
          [checked]="shouldIncludeBookingAnswers"
          data-testid="orders-download-answers-options"
          (change)="updateIncludeBookingAnswers($event.target.checked)"
          type="checkbox"
        />
        {{ 'orders.download.includeBookingAnswers' | translate }}
      </label>
      <label>
        <input
          [checked]="shouldIncludeStaffNotes"
          data-testid="orders-download-notes-option"
          (change)="updateIncludeStaffNotes($event.target.checked)"
          type="checkbox"
        />
        {{ 'orders.download.includeStaffNotes' | translate }}
      </label>
    </div>
  </div>
  <div class="modal__actions">
    <button igntButton sentiment="secondary" [fill]="true" data-testid="modal-cancel-button" (click)="close(false)">
      {{ 'common.cancel' | translate }}
    </button>
    <button igntButton [fill]="true" data-testid="modal-accept-button" (click)="close(true)">
      {{ 'common.accept' | translate }}
    </button>
  </div>
</div>
