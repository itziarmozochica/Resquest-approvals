<iframe
  *ngIf="graph && !errorGraph && !loadingGraph"
  data-testid="reseller-overview-iframe"
  class="reseller-overview-dashboard wrapper-card--elevation-100"
  border="0"
  frameborder="0"
  height="100%"
  width="95%"
  allowtransparency
  [src]="graph.url | safeUrl"
  appIframeResizer
  title="Thread Content"
>
</iframe>

<div *ngIf="errorGraph || loadingGraph" class="reseller-overview-dashboard wrapper-card--elevation-100">
  <div *ngIf="loadingGraph" class="reseller-overview-dashboard__loading">
    <fa-icon class="loader" [icon]="['fas', 'spinner']" [size]="'4x'"></fa-icon>
    {{ 'common.loading' | translate }}
  </div>
  <div *ngIf="errorGraph" class="text-danger">{{ 'common.errorDashboards' | translate }}</div>
</div>
