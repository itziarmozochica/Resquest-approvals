<div *ngIf="exportOptionsList?.length > 1" class="export-list-button__container">
  <button
    type="button"
    class="export-list-button__button"
    [class]="'export-list-button__button--' + type"
    [igntMenuTriggerFor]="exportOptionsMenu"
    [disabled]="exportOptionsDisabled"
  >
    <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
  </button>
  <ng-template #exportOptionsMenu>
    <ignt-menu>
      @for (option of exportOptionsList; track option.extension) {
        <ignt-menu-item
          [value]="option.extension"
          [attr.data-testid]="'export-list-button-' + option.extension"
          [label]="option.label | translate"
          [disabled]="exportOptionsDisabled"
          (triggered)="clickOnOption(option)"
        >
          <ignt-icon [name]="option.menuIcon.name" [variant]="option.menuIcon.variant" />
        </ignt-menu-item>
      }
    </ignt-menu>
  </ng-template>
</div>

<div *ngIf="exportOptionsList?.length === 1" class="export-list-button__container">
  <button
    (click)="clickOnOption(exportOptionsList[0], $event)"
    [attr.data-testid]="'export-list-button--{{exportOptionsList[0].extension}}'"
    class="export-list-button__button"
    [class]="'export-list-button__button--' + type"
    [disabled]="exportOptionsDisabled"
  >
    <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
  </button>
</div>

<ng-template #contentTemplate>
  <ng-content></ng-content>
</ng-template>
