<app-modal-content *ngIf="useWrapper; else content">
  <ng-container *ngTemplateOutlet="content"></ng-container>
</app-modal-content>

<ng-template #content>
  <div class="modal-body modal__content">
    <div class="modal__title" *ngIf="title" data-testid="modal-title">
      <h5>{{ title }}</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="close(false)"></button>
    </div>
    <div class="messages">
      <div class="messages__row" *ngIf="question !== ''">
        <p data-testid="modal-message" class="messages__row__question" [innerHTML]="question"></p>
      </div>
      <div class="messages__row" *ngIf="explanation !== ''">
        <p data-testid="modal-message" class="messages__row__explanation" [innerHTML]="explanation"></p>
      </div>
    </div>
    <div class="modal__actions">
      <ng-container *ngIf="acceptFirst">
        <ng-container *ngTemplateOutlet="acceptButton"></ng-container>
      </ng-container>
      <button
        igntButton
        class="modal__button"
        sentiment="secondary"
        (click)="close(false)"
        data-testid="modal-cancel-button"
        *ngIf="cancelButtonLabel"
      >
        {{ cancelButtonLabel }}
      </button>
      <ng-container *ngIf="!acceptFirst">
        <ng-container *ngTemplateOutlet="acceptButton"></ng-container>
      </ng-container>
      <div class="messages__row" *ngIf="note !== ''">
        <p data-testid="modal-message" class="messages__row__note" [innerHTML]="note"></p>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #acceptButton>
  <button igntButton class="modal__button" (click)="close(true)" data-testid="modal-accept-button">
    {{ acceptButtonLabel }}
  </button>
</ng-template>
