<ignt-dialog-header>{{ 'planReview.rejectModal.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="reject-plan-review-modal">
    <p class="reject-plan-review-modal__description">
      {{ 'planReview.rejectModal.description' | translate }}
    </p>

    <label class="reject-plan-review-modal__field">
      <textarea class="reject-plan-review-modal__textarea" [(ngModel)]="comment" rows="4" data-testid="reject-comment"></textarea>
    </label>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="tertiary" (click)="cancel()" [disabled]="loading" data-testid="reject-modal-cancel">
    {{ 'planReview.rejectModal.cancel' | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    [disabled]="!isValid || loading"
    [loading]="loading"
    (click)="confirm()"
    data-testid="reject-modal-confirm"
  >
    {{ 'planReview.rejectModal.confirm' | translate }}
  </button>
</ignt-dialog-footer>
