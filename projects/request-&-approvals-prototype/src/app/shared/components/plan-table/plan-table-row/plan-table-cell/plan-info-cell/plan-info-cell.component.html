<div class="plan-info-cell" *ngIf="plan !== null">
  <img class="plan-info-cell__image" alt="plan image" data-testid="plan-card-image" src="{{ plan.pictureURL }}" />
  <div class="plan-info-cell__content">
    <div class="plan-info-cell__name" data-testid="plan-card-name">
      {{ plan.name }}
    </div>
    <div class="plan-info-cell__place" *ngIf="plan.firstPlace">
      <fa-icon [fixedWidth]="true" [icon]="['far', 'map-marker-alt']"></fa-icon>
      {{ plan.firstPlace.cityName | cityTranslate }}
      - {{ plan.hasMultiplePlaces ? ('listPlan.multipleVenues' | translate) : plan.firstPlace.addressName }}
    </div>
  </div>
</div>
