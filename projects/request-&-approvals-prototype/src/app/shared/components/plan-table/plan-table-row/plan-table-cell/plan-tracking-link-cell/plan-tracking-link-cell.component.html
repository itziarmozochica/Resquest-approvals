<div class="plan-tracking-link-cell">
  <button igntButton size="small" [trailingIcon]="['fas', 'share']" (click)="onClickShareTrackingLink($event)">
    {{ 'listPlan.trackingLink.button' | translate }}
  </button>
  <a igntLink (click)="onClickCopyTrackingLink($event)" class="plan-tracking-link-cell__copy" data-testid="copy-tracking-link">
    {{ isTrackingLinkCopied ? ('listPlan.trackingLink.copiedLink' | translate) : ('listPlan.trackingLink.copyLink' | translate) }}
  </a>
</div>
