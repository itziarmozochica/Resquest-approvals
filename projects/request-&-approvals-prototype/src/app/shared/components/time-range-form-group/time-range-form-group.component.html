<div class="form-group form-group--white form-group--fix-height form-group--flex">
  <ng-container
    *ngTemplateOutlet="
      timePicker;
      context: {
        control: formGroup.controls.start,
        testid: 'time-range-control-start',
        label: startTimeLabel,
      }
    "
  >
  </ng-container>
</div>
<div class="form-group form-group--white form-group--fix-height form-group--flex">
  <ng-container
    *ngTemplateOutlet="
      timePicker;
      context: {
        control: formGroup.controls.end,
        testid: 'time-range-control-end',
        label: endTimeLabel,
      }
    "
  >
  </ng-container>
</div>

<ng-template #timePicker let-control="control" let-testid="testid" let-label="label">
  <label class="field date-input">
    <input #timePickerInput class="field__input" type="time" [attr.data-testid]="testid" [formControl]="control" />
    <span class="field__label">{{ label }}</span>
    <fa-icon
      class="field__icon field__icon--trail"
      [icon]="['fal', 'clock']"
      (click)="!control.disabled && timePickerInput?.showPicker?.()"
    >
    </fa-icon>
  </label>
</ng-template>
