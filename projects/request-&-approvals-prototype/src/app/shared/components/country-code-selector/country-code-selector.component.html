<label class="cell field cell--fill-lg">
  <ng-container *ngIf="readonly">
    <span class="form-label field__label--readonly">{{ 'common.country' | translate }}</span>
    <div class="field__input--readonly">
      {{ (countryCodes | findByKey: 'value' : selectedOption)?.label ?? '-' }}
    </div>
  </ng-container>
  <ng-container *ngIf="!readonly">
    <select id="country" class="field__select" (change)="selected.emit($event)" [(ngModel)]="selectedOption">
      <ng-container *ngFor="let option of countryCodes">
        <option [value]="option.value">{{ option.label }}</option>
      </ng-container>
    </select>
    <span class="field__label">{{ 'common.country' | translate }} {{ required ? '*' : '' }}</span>
    <div class="field__helper field__helper--danger" *ngIf="hasErrors">
      <fa-icon [icon]="['fas', 'exclamation-circle']"></fa-icon>
      <span class="form-error__message">
        {{ 'form.error.mandatoryField' | translate }}
      </span>
    </div>
  </ng-container>
</label>
