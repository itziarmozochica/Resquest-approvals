<ignt-dialog-header data-testid="coupon-code-selector-modal">
  {{ 'boxOffice.couponSelector.typeModalTitle' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="coupon-selector-modal-body">
    @if (isLoadingPresets()) {
      <div class="coupon-selector-modal-body__loading" data-testid="coupon-selector-presets-loading">
        <ignt-icon class="loader" name="spinner" variant="solid" size="display" [spin]="true" aria-hidden="true"></ignt-icon>
      </div>
    } @else {
      <div
        class="coupon-selector-modal-body__cards"
        [class.coupon-selector-modal-body__cards--disabled]="isApplyingPreset()"
        [attr.aria-busy]="isApplyingPreset()"
      >
        @for (lazyCoupon of lazyCoupons(); track lazyCoupon.code) {
          <app-coupon-card
            [code]="lazyCoupon.code"
            [title]="lazyCoupon.title"
            (cardClick)="onCardClicked($event)"
            [isLazy]="true"
          ></app-coupon-card>
        }
        <app-coupon-card [title]="'boxOffice.couponSelector.custom' | translate" (cardClick)="onCardClicked($event)"></app-coupon-card>
      </div>
      @if (presetCoupons().length > 0) {
        <app-preset-coupon-codes
          [error]="error"
          [presetCoupons]="presetCoupons()"
          (couponCode)="onPresetCouponCode($event)"
          (searchInteraction)="onPresetSearchInteraction()"
        ></app-preset-coupon-codes>
      }
    }
  </div>
</ignt-dialog-content>
