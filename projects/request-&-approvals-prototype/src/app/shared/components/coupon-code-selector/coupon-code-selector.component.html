<div class="coupon-selector" [class]="'coupon-selector--' + buttonSize">
  <ignt-button
    data-testid="coupon-selector-button"
    [label]="'boxOffice.couponSelector.button' | translate"
    [leadingIcon]="hasLeadingIcon ? { name: 'badge-percent', variant: 'solid' } : undefined"
    [size]="buttonSize"
    [variant]="buttonSentiment"
    (click)="openModalCoupons()"
  ></ignt-button>
</div>
