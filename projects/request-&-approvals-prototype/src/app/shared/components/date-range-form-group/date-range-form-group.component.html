<div class="form-group form-group--white form-group--fix-height form-group--flex">
  <ng-container
    *ngTemplateOutlet="
      datePicker;
      context: {
        max: restrictDateRangeOverlap && formGroup.controls.end.value,
        control: formGroup.controls.start,
        label: startDateLabel,
        dataTestId: 'date-range-control-start',
      }
    "
  ></ng-container>
</div>

<div class="form-group form-group--white form-group--fix-height form-group--flex">
  <ng-container
    *ngTemplateOutlet="
      datePicker;
      context: {
        min: restrictDateRangeOverlap && formGroup.controls.start.value,
        control: formGroup.controls.end,
        label: endDateLabel,
        dataTestId: 'date-range-control-end',
      }
    "
  ></ng-container>
</div>

<ng-template #datePicker let-min="min" let-max="max" let-label="label" let-dataTestId="dataTestId" let-control="control">
  <label class="field date-input">
    <input
      #datePickerInput
      class="field__input"
      [min]="min"
      [max]="max"
      [attr.data-testid]="dataTestId"
      [type]="displayTimePicker ? 'datetime-local' : 'date'"
      [formControl]="control"
    />
    <span class="field__label">{{ label }}</span>
    <fa-icon
      class="field__icon field__icon--trail"
      [icon]="['fal', 'calendar']"
      (click)="!control.disabled && datePickerInput?.showPicker?.()"
    >
    </fa-icon>
  </label>
</ng-template>
