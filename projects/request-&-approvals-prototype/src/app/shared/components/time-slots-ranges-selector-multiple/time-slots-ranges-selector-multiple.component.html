<div
  *ngFor="let range of ranges.controls; let i = index; trackBy: trackByControl"
  data-testid="time-slots-ranges-selector-multiple-selector"
  class="time-slots-ranges-selector-multiple-range"
>
  <fa-icon
    *ngIf="!ranges.disabled && ranges.controls.length > 1"
    data-testid="time-slots-ranges-selector-multiple-selector-remove"
    class="trash-icon"
    [icon]="['fal', 'trash-alt']"
    role="button"
    (click)="removeTimeSlotRange(i)"
  ></fa-icon>
  <app-time-slots-ranges-selector [formControl]="range"> </app-time-slots-ranges-selector>
  <app-form-field-error
    class="required-field-form-error"
    data-testid="time-slots-ranges-selector-multiple-error"
    *ngIf="range.dirty && range?.errors?.requiredAllFields as error"
  >
    {{ 'sessions.sessionsPerTimeslot.bulkEdit.rangeSelector.allFieldsAreRequiredError' | translate }}
  </app-form-field-error>
</div>
<p
  *ngIf="!ranges.disabled"
  class="add-times-slot-range"
  data-testid="time-slots-ranges-selector-multiple-selector-add"
  (click)="addTimeSlotsRange()"
>
  {{ 'sessions.sessionsPerTimeslot.bulkEdit.rangeSelector.addRange' | translate }}
  <fa-icon [icon]="['fas', 'plus-circle']"></fa-icon>
</p>
