<!-- Keypad keys are bespoke round tiles (like the PIN pad), not design-system buttons: the
     fz-template/no-native-button hits are grandfathered in eslint-suppressions.json until the
     design system offers a keypad key. -->
<div class="numeric-keypad">
  @if (showDisplay()) {
    <output class="numeric-keypad__display" data-testid="keypad-display" aria-live="polite">
      {{ displayAmount() | currency: currency() : 'symbol-narrow' : undefined : locale() }}
    </output>
  }

  @if (errorMessage(); as message) {
    <p class="numeric-keypad__error" data-testid="keypad-error" role="alert">{{ message }}</p>
  }

  <div class="numeric-keypad__grid">
    @for (digit of digits; track digit) {
      <button
        type="button"
        class="numeric-keypad__key"
        [attr.data-testid]="'keypad-digit-' + digit"
        [disabled]="disabled()"
        (mousedown)="$event.preventDefault()"
        (click)="pressDigit(digit)"
      >
        {{ digit }}
      </button>
    }
    <span class="numeric-keypad__spacer" aria-hidden="true"></span>
    <button
      type="button"
      class="numeric-keypad__key"
      data-testid="keypad-digit-0"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="pressDigit(0)"
    >
      0
    </button>
    <button
      type="button"
      class="numeric-keypad__key numeric-keypad__key--backspace"
      data-testid="keypad-backspace"
      [attr.aria-label]="'common.delete' | translate"
      [disabled]="disabled()"
      (mousedown)="$event.preventDefault()"
      (click)="pressBackspace()"
    >
      <ignt-icon name="backspace" variant="light" [size]="appearance() === 'calculator' ? 'h1' : 'base'" aria-hidden="true" />
    </button>
  </div>
</div>
