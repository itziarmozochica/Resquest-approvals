<span
  data-testid="list-sortable-item"
  [attr.data-order]="index"
  class="sortable-item"
  [class.sortable-item--touch]="usingTouch"
  [class.sortable-item--drop]="dropIndex === index"
  draggable="true"
  (dragstart)="onDragStart(index)"
  (touchstart)="usingTouch = true; onDragStart(index)"
  (dragenter)="onDragEnter(index)"
  (touchmove)="onTouchMove($event)"
  (dragend)="onDragEnd()"
  (touchend)="usingTouch = false; onDragEnd()"
  *ngFor="let element of displayedElements; let index = index; trackBy: trackByFn"
>
  @if (template) {
    <ng-container *ngTemplateOutlet="template; context: { element, index }"></ng-container>
  }
</span>
<ng-container *ngIf="addElementControlTemplate" [ngTemplateOutlet]="addElementControlTemplate"></ng-container>
