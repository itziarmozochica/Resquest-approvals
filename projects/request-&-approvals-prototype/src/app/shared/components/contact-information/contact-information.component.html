<div class="content">
  <div class="content__title" data-testid="box-office-step-title">
    {{ titleKey() | translate }}
  </div>
  <form [formGroup]="contactInformationForm">
    <div class="form-fields">
      <div>
        <ignt-input-field
          formControlName="email"
          id="email"
          type="email"
          data-testid="contact-information-email"
          [label]="('form.field.email' | translate) + (mandatoryFields.includes('email') ? ' *' : '')"
          [placeholder]="'contact@example.com'"
          [helperText]="emailHelperTextKey ? (emailHelperTextKey | translate) : ''"
          [customFormErrors]="[
            {
              type: 'required',
              message: 'form.error.mandatoryField' | translate,
            },
            {
              type: 'emailValidator',
              message: 'form.error.invalidEmail' | translate,
            },
          ]"
        ></ignt-input-field>
      </div>
      <div>
        <ignt-input-field
          formControlName="firstName"
          id="firstName"
          data-testid="contact-information-first-name"
          [label]="('form.field.firstName' | translate) + (mandatoryFields.includes('firstName') ? ' *' : '')"
          [maxlength]="NAME_FIELD_MAX_LENGTH"
          [placeholder]="'Gabriel'"
          [customFormErrors]="[
            {
              type: 'required',
              message: 'form.error.mandatoryField' | translate,
            },
          ]"
        ></ignt-input-field>
      </div>
      <div>
        <ignt-input-field
          formControlName="lastName"
          id="lastName"
          data-testid="contact-information-last-name"
          [label]="('form.field.lastName' | translate) + (mandatoryFields.includes('lastName') ? ' *' : '')"
          [maxlength]="NAME_FIELD_MAX_LENGTH"
          [placeholder]="'Williams'"
          [customFormErrors]="[
            {
              type: 'required',
              message: 'form.error.mandatoryField' | translate,
            },
          ]"
          (keydown)="onKeyDown($event)"
        ></ignt-input-field>
      </div>
      <div class="checkbox-group">
        @if (showDeliveryNoteCheck) {
          <label for="includeDeliveryNoteAttachment" class="checkbox">
            <input
              id="includeDeliveryNoteAttachment"
              #includeDeliveryNoteAttachment
              class="checkbox__input"
              type="checkbox"
              formControlName="includeDeliveryNoteAttachment"
              (change)="updateIncludeDeliveryNoteAttachment($event)"
            />
            <span
              class="checkbox__icon"
              [class.checkbox__icon--unchecked]="!contactInformationForm.controls['includeDeliveryNoteAttachment'].value"
            >
              <fa-icon [icon]="['fas', 'check']"></fa-icon>
            </span>
            <span class="checkbox__label">{{ 'boxOffice.includeDeliveryNoteAttachmentDescription' | translate }}</span>
          </label>
        }
        @if (showPrivacyDisclaimer() && isPrivacyDisclaimerAllowed()) {
          <label for="termsAndConditions" class="checkbox checkbox__disabled">
            <input id="termsAndConditions" class="checkbox__input" type="checkbox" formControlName="termsAndConditions" />
            <span class="checkbox__icon" [class.checkbox__icon--unchecked]="!contactInformationForm.controls['termsAndConditions'].value">
              <fa-icon [icon]="['fas', 'check']"></fa-icon>
            </span>
            <span class="checkbox__label">{{ 'boxOffice.termsAndConditionsDescription' | translate }}</span>
          </label>
        }
      </div>
    </div>
  </form>
</div>
