<ng-container *ngFor="let row of levelRows">
  <div class="tile-wrapper tile-wrapper--row" data-testid="level-row">
    <ng-container *ngFor="let level of row">
      <ng-container *ngTemplateOutlet="levelTemplate; context: { level: level, levels: row }"></ng-container>
    </ng-container>
  </div>
</ng-container>

<ng-template #levelTemplate let-level="level" let-levels="levels">
  <button
    class="tile-wrapper__item tile tile--wider"
    data-testid="level-item"
    [ngClass]="{ 'tile--selected': level.selected, 'tile--disabled': level.isDisabled() }"
    (click)="selectLevel(level, levels)"
  >
    {{ level.displayName }}
  </button>
</ng-template>
