<div class="field" #dropdown="ngbDropdown" ngbDropdown [autoClose]="'outside'" [container]="container" data-testid="multiselect">
  <div
    class="field__select"
    ngbDropdownToggle
    data-testid="multiselect-by-button"
    [class.field__select--disabled]="disabled"
    [attr.aria-label]="ariaLabelledby ? null : 'multiselect-search'"
    [attr.aria-labelledby]="ariaLabelledby"
    [attr.aria-required]="required ? 'true' : null"
    [attr.aria-disabled]="disabled ? 'true' : null"
    [attr.tabindex]="disabled ? -1 : null"
  >
    <ng-content select="[dropdownButton]"></ng-content>
  </div>
  <fa-icon class="field__icon field__icon--trail" [icon]="['fal', 'chevron-down']"></fa-icon>
  <div data-testid="templated-dropdown-field-dropdown" *ngIf="!disabled" class="field-dropdown" ngbDropdownMenu>
    <div class="field-dropdown__scroll-wrapper">
      <ng-content select="[dropdownOptions]"></ng-content>
    </div>
  </div>
</div>
