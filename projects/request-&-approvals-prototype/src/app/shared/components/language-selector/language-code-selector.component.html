<label class="cell field cell--fill-lg">
  <ng-container *ngIf="readonly">
    <span class="form-label field__label--readonly">{{ 'common.language' | translate }}</span>
    <div class="field__input--readonly">
      {{ (languageCodeOptions | findByKey: 'id' : selectedOption)?.title ?? '-' }}
    </div>
  </ng-container>
  <ng-container *ngIf="!readonly">
    <select id="country" class="field__select" (change)="selectLanguage($event)" [(ngModel)]="selectedOption">
      <ng-container *ngFor="let option of languageCodeOptions">
        <option [value]="option.id">{{ option.title }}</option>
      </ng-container>
    </select>
    <span class="field__label">{{ 'common.language' | translate }} {{ required ? '*' : '' }}</span>

    <div class="form-error" *ngIf="hasErrors">
      <fa-icon class="form-error--icon" [icon]="['fas', 'exclamation-circle']"></fa-icon>
      <span class="form-error--message" data-testid="guest-details-error-mandatory-field">
        {{ 'form.error.mandatoryField' | translate }}
      </span>
    </div>
  </ng-container>
</label>
