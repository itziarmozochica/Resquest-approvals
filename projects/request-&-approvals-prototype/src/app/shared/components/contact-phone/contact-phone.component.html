<div class="contact-phone">
  <div class="contact-phone__container">
    <div class="contact-phone__country">
      <ignt-typeahead
        [options]="countryOptions()"
        [selectedOption]="selectedCountryOption()"
        [disabled]="isDisabled"
        [error]="(error ?? false) && showCountryRequiredError"
        [fieldLabel]="('common.country' | translate) + (isMandatory ? ' *' : '')"
        emptyLabel="{{ 'filters.selectCountry' | translate }}"
        (selected)="onCountrySelected($event)"
        (userInteraction)="onUserInteraction($event)"
      >
      </ignt-typeahead>

      <ignt-field-error [showError]="(error ?? false) && showCountryRequiredError">
        {{ 'boxOffice.contactInformationModal.validations.required' | translate }}
      </ignt-field-error>
    </div>

    <div class="contact-phone__phone-row">
      <div class="contact-phone__prefix">
        <ignt-input-field
          [type]="'text'"
          class="contact-phone__prefix-input"
          [formControl]="prefixFormControl"
          [disabled]="true"
          [label]="'Prefix'"
        ></ignt-input-field>
      </div>

      <div class="contact-phone__edit-control">
        <div class="contact-phone__input">
          <ignt-input-field
            appInputMobileBehavior
            [value]="phoneInNationalFormat"
            [type]="'tel'"
            [id]="id"
            data-testid="contact-phone-input"
            class="contact-phone__phone-input"
            autocomplete="off"
            [label]="((isOptional() ? 'form.field.phoneNumberOptional' : 'form.field.phoneNumber') | translate) + (isMandatory ? ' *' : '')"
            [placeholder]="phonePlaceholder"
            [disabled]="isDisabled"
            [customFormErrors]="phoneErrors"
            (input)="onPhoneInputChange($event)"
            (keypress)="onKeyPress($event)"
            (blur)="onTouched()"
          ></ignt-input-field>
        </div>
        <ng-content select="[edit-control]"></ng-content>
      </div>
    </div>
  </div>
</div>
