<div class="coupon-cart-card wrapper-card" *ngIf="!useMultiCartDesign">
  <div class="coupon-cart-card__block">
    <div class="coupon-cart-card__label">
      <div class="coupon-cart-card__name">
        <ng-container>{{ 'boxOffice.cart.coupon' | translate }}</ng-container>
      </div>
      <div class="coupon-cart-card__ticket-price">
        <ng-container
          *ngTemplateOutlet="
            cartMoney;
            context: { money: { currency: coupon.discount.currency || fallbackCurrency, amount: -coupon.discount.amount }, locale: locale }
          "
        ></ng-container>
      </div>
    </div>
    <div class="coupon-cart-card__supporting-text">
      <div class="coupon-cart-card__code">
        <ng-container>{{ coupon.code }}</ng-container>
        <button class="coupon-cart-card__code__remove" (click)="removeCouponClick()" data-testid="coupon-remove-coupon">
          <fa-icon [icon]="['fas', 'times']"></fa-icon>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="coupon-cart-card--multi-cart" *ngIf="useMultiCartDesign">
  <div class="coupon-cart-card--multi-cart__title">
    {{ coupon.title || coupon.code }}
  </div>
  <button class="coupon-cart-card--multi-cart__remove" (click)="removeCouponClick()" data-testid="coupon-remove-coupon">
    <fa-icon [icon]="['fas', 'times-circle']" [fixedWidth]="true" [size]="'1x'"></fa-icon>
  </button>
  <div class="coupon-cart-card--multi-cart__discount">
    <ng-container
      *ngTemplateOutlet="
        cartMoney;
        context: { money: { currency: coupon.discount.currency || fallbackCurrency, amount: -coupon.discount.amount }, locale: locale }
      "
    ></ng-container>
  </div>
</div>

<ng-template #cartMoney let-locale="locale" let-money="money">
  {{ money ? (money.amount | currency: money.currency : 'symbol-narrow' : null : locale) : '-' }}
</ng-template>
