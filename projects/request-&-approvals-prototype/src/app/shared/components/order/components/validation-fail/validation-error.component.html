<div class="validation-error__modal-body" data-testid="modal-validation-error-code">
  <div class="validation-error__modal-title" *ngIf="title">
    {{ title }}
  </div>
  <ignt-alert
    [sentiment]="ignorable ? 'warning' : 'danger'"
    [description]="message | translate"
    data-testid="modal-validation-error-code-message"
  />
  <div [class]="'code ' + (ignorable ? 'code__warning' : 'code__invalid')" data-testid="modal-validation-error-code-value">
    {{ code }}
  </div>
  <div class="validation-error__buttons">
    <button
      (click)="force()"
      *ngIf="ignorable"
      class="button button--large button--primary"
      data-testid="modal-validation-error-code-button-force"
      translate
    >
      validateTicketsNew.codeErrorModal.force
    </button>
    <button
      (click)="dismiss()"
      class="button button--large button--secondary"
      data-testid="modal-validation-error-code-button-continue"
      translate
    >
      validateTicketsNew.codeErrorModal.continue
    </button>
  </div>
</div>
