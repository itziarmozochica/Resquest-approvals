<ignt-dialog-header>
  {{ 'validateTicketsNew.modifyOrderStrategyModal.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="modify-order-strategy-modal">
    @if (selectedStrategy() === 'fixed') {
      <ignt-alert sentiment="warning" [description]="'validateTicketsNew.modifyOrderStrategyModal.fixedPriceWarning' | translate" />
    }

    <p class="modify-order-strategy-modal__instruction">
      {{ 'validateTicketsNew.modifyOrderStrategyModal.instruction' | translate }}
    </p>

    <div class="modify-order-strategy-modal__list">
      <button
        type="button"
        class="list-item"
        (click)="selectDynamic()"
        data-testid="modify-order-strategy-option-dynamic"
        [attr.aria-pressed]="selectedStrategy() === 'dynamic'"
      >
        <span class="leading-icon leading-icon--outline" aria-hidden="true">
          <fa-icon [icon]="['fal', 'bolt']"></fa-icon>
        </span>
        <div class="text-wrapper">
          <span class="headline">{{ 'validateTicketsNew.modifyOrderStrategyModal.dynamicPrices' | translate }}</span>
          <span class="supporting-text">
            {{ 'validateTicketsNew.modifyOrderStrategyModal.dynamicPricesDescription' | translate }}
          </span>
        </div>
        <span
          class="radiobutton"
          [class.radiobutton--selected]="selectedStrategy() === 'dynamic'"
          role="radio"
          [attr.aria-checked]="selectedStrategy() === 'dynamic'"
        >
          <span class="input"></span>
        </span>
      </button>

      <button
        type="button"
        class="list-item"
        (click)="selectFixed()"
        data-testid="modify-order-strategy-option-fixed"
        [attr.aria-pressed]="selectedStrategy() === 'fixed'"
      >
        <span class="leading-icon leading-icon--outline" aria-hidden="true">
          <fa-icon [icon]="['fal', 'lock-alt']"></fa-icon>
        </span>
        <div class="text-wrapper">
          <span class="headline">{{ 'validateTicketsNew.modifyOrderStrategyModal.fixedPrices' | translate }}</span>
          <span class="supporting-text">
            {{ 'validateTicketsNew.modifyOrderStrategyModal.fixedPricesDescription' | translate }}
          </span>
        </div>
        <span
          class="radiobutton"
          [class.radiobutton--selected]="selectedStrategy() === 'fixed'"
          role="radio"
          [attr.aria-checked]="selectedStrategy() === 'fixed'"
        >
          <span class="input"></span>
        </span>
      </button>
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer>
  <button type="button" igntButton sentiment="primary" data-testid="modify-order-strategy-continue" (click)="continue()">
    {{ primaryActionText() }}
  </button>
</ignt-dialog-footer>
