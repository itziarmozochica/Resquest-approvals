<cart-detail
  [cart]="fusedSessionsCart"
  [showClearAll]="false"
  [showSessionDate]="true"
  [showSeatingInModal]="true"
  [showPaymentDetails]="true"
  [collapsable]="true"
  [showDiscount]="true"
  [isCollapsed]="false"
  [title]="'validateTicketsNew.orderDetail.title'"
  [showInvoiceButton]="shouldShowInvoiceButton()"
  [showShadow]="!purchaseInformationLayout()"
  [orderId]="orderId"
  [loyaltyPoints]="order()?.loyaltyPoints ?? null"
  [orderCancellationRecords]="order()?.userCancellationRecords ?? null"
  [orderRefundedAmount]="orderRefundedAmount()"
  [orderDepositRefundedAmount]="depositRefundedAmount()"
  [paymentCardNumberLast4Digits]="paymentCardNumberLast4Digits()"
  [paymentNotes]="paymentNotes"
  [paymentLegs]="paymentLegs()"
  [paymentTransactions]="paymentTransactions()"
  [isRescheduleFlow]="hasReschedule"
  [planNamesByPlanId]="planNamesByPlanId()"
  [showPlanNames]="showPlanNames()"
  [showServingTime]="servingTimeEnabled"
  [canEditServingTime]="canEditServingTime()"
  [servingTimeActionDisabled]="servingTimeSaving()"
  [servingTimesBySessionId]="servingTimesBySessionId()"
  [servingTimeAnchorDate]="servingTimeAnchorDate()"
  (serviceTimeRequested)="onServiceTimeRequested()"
  scope="order-detail"
></cart-detail>
<app-order-transaction-history [timezone]="fusedSessionsCart?.timezone ?? null" [transactions]="paymentTransactions()" />
