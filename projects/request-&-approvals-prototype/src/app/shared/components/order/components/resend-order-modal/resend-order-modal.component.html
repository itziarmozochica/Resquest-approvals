<div class="resend-order-modal">
  <div class="resend-order-modal__header">
    <h5 class="resend-order-modal__title">
      {{ 'validateTicketsNew.resendOrderModal.title' | translate }}
    </h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
  </div>

  <hr class="resend-order-modal__divider" />

  <div class="resend-order-modal__body">
    <p class="resend-order-modal__question">
      {{ 'validateTicketsNew.resendOrderModal.emailQuestion' | translate }}
    </p>
    <div class="resend-order-modal__field">
      <label class="resend-order-modal__email-label" for="resend-order-modal-email">
        {{ 'validateTicketsNew.resendOrderModal.emailLabel' | translate }}
      </label>
      <input
        id="resend-order-modal-email"
        type="email"
        class="form-control resend-order-modal__email-input"
        data-testid="resend-order-modal-email-input"
        [disabled]="!canEditEmail()"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </div>

    @if (hasTransferredTickets()) {
      <ignt-alert
        class="resend-order-modal__transferred-warning"
        sentiment="warning"
        data-testid="resend-order-modal-transferred-warning"
        [title]="'validateTicketsNew.resendOrderModal.transferredWarning.title' | translate"
        [description]="'validateTicketsNew.resendOrderModal.transferredWarning.body' | translate"
      />
    }
  </div>

  <div class="resend-order-modal__footer">
    <button igntButton [fill]="true" [disabled]="isConfirmDisabled()" (click)="confirm()" data-testid="resend-order-modal-confirm-button">
      {{ 'validateTicketsNew.resendOrderModal.confirm' | translate }}
    </button>
  </div>
</div>
