<ignt-expansion-panel [isCollapsed]="false" [title]="'journey.title' | translate" data-testid="order-journey">
  <section class="order-journey">
    <div class="order-journey__summary" data-testid="order-journey-summary">
      <span data-testid="order-journey-span">{{ 'journey.span' | translate: spanParams() }}</span>
      @if (journey().endsAtIsEstimated) {
        <span class="order-journey__estimated" data-testid="order-journey-estimated">{{ 'journey.estimatedEnd' | translate }}</span>
      }
      @if (journey().attendees !== null) {
        <span class="order-journey__attendees" data-testid="order-journey-attendees">{{
          'bookedSlots.paxCount' | translate: { count: journey().attendees }
        }}</span>
      }
    </div>
    @for (segment of segments(); track segment.key) {
      <app-activity-segment [segment]="segment"></app-activity-segment>
    }
  </section>
</ignt-expansion-panel>
