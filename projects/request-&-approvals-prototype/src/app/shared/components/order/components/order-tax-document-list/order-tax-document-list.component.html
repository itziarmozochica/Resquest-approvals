@if (isSectionVisible(taxDocuments())) {
  @if (tileLayout()) {
    <app-order-section-tile
      [title]="'validateTicketsNew.orderTaxDocumentList.title' | translate"
      [count]="taxDocuments()?.length || null"
      [collapsed]="!hasError && requestStatus !== NominativeRequestStatus.Failed"
      data-testid="order-tax-document-list"
    >
      <app-order-tax-document-entries
        class="order-tax-document-list--tile"
        [fullInvoiceRequestAllowed]="(hasOrderId || hasPurchaseUrn) && requestStatus !== NominativeRequestStatus.Blocked"
        [hasError]="hasError"
        [requestButtonLabelKey]="buttonLabelKey"
        [requestStatus]="requestStatus"
        [showComponentLabels]="isSplitOrder"
        [taxDocuments]="taxDocuments()"
        (download)="downloadTaxDocument($event)"
        (requestFullInvoice)="requestFullInvoice()"
      />
    </app-order-section-tile>
  } @else {
    <div [class.order-tax-document-list--collapsed]="isCollapsed" class="order-tax-document-list" data-testid="order-tax-document-list">
      <div class="header">
        <div class="header__title" translate>
          validateTicketsNew.orderTaxDocumentList.title
          <fa-icon (click)="isCollapsed = !isCollapsed" [icon]="['fas', 'chevron-down']" class="header__title--collapse"> </fa-icon>
        </div>
      </div>
      <div class="body">
        <app-order-tax-document-entries
          [fullInvoiceRequestAllowed]="(hasOrderId || hasPurchaseUrn) && requestStatus !== NominativeRequestStatus.Blocked"
          [hasError]="hasError"
          [requestButtonLabelKey]="buttonLabelKey"
          [requestStatus]="requestStatus"
          [showComponentLabels]="isSplitOrder"
          [taxDocuments]="taxDocuments()"
          (download)="downloadTaxDocument($event)"
          (requestFullInvoice)="requestFullInvoice()"
        />
      </div>
    </div>
  }
}
