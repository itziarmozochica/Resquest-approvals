<ignt-dialog-header data-testid="ticket-code-qr-modal-title">{{
  'validateTicketsNew.tickets.qrModalTitle' | translate
}}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="ticket-code-qr">
    <div class="ticket-code-qr__image" [style.min-height.px]="imageSize">
      @if (imageSrc(); as src) {
        <img data-testid="ticket-code-qr-modal-image" [src]="src" [alt]="code" [style.max-height.px]="imageSize" (error)="onImageError()" />
      }
    </div>
    <span class="ticket-code-qr__code" data-testid="ticket-code-qr-modal-code">{{ code }}</span>
  </div>
</ignt-dialog-content>
