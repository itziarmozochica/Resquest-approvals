<ignt-dialog-header data-testid="validation-profile-selection-title">
  {{ 'validateTicketsNew.profileSelectionModal.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="validation-profile-selection-modal">
    <p class="validation-profile-selection-modal__instruction">
      {{ 'validateTicketsNew.profileSelectionModal.instruction' | translate }}
    </p>

    <div class="validation-profile-selection-modal__list" role="radiogroup">
      @for (profile of profiles; track profile.id) {
        <ignt-list-item
          clickable
          [title]="profile.name"
          [selected]="selectedProfileId() === profile.id"
          [attr.data-testid]="'validation-profile-option-' + profile.id"
          (click)="selectProfile(profile.id)"
        >
          <ng-container trailing-modifier>
            <ignt-radio [value]="profile.id" [checked]="selectedProfileId() === profile.id"></ignt-radio>
          </ng-container>
        </ignt-list-item>
      }
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer>
  <button
    type="button"
    igntButton
    sentiment="primary"
    data-testid="validation-profile-selection-confirm"
    [disabled]="selectedProfileId() === null"
    (click)="confirm()"
  >
    {{ 'validateTicketsNew.profileSelectionModal.confirm' | translate }}
  </button>
</ignt-dialog-footer>
