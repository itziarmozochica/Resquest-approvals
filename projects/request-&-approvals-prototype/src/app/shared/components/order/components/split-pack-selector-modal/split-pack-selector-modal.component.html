<div class="modal-header">
  <h4 class="modal-title">{{ 'cancellation.splitPack.selectorModalTitle' | translate }}</h4>
</div>
<div class="modal-body modal__content split-pack-selector-modal__body">
  <p
    id="split-pack-selector-description"
    class="split-pack-selector-modal__description"
    [innerHTML]="'cancellation.splitPack.selectorDescription' | translate"
  ></p>
  <div class="split-pack-selector-modal__card">
    <div class="split-pack-selector-modal__card-info">
      <span class="split-pack-selector-modal__card-name">{{ packName }}</span>
    </div>
    <div class="split-pack-selector-modal__counter">
      <button
        igntButton
        class="split-pack-selector-modal__counter-btn"
        sentiment="primary"
        [disabled]="count() === 1"
        (click)="decrement()"
        type="button"
        data-testid="split-pack-decrement"
        [attr.aria-label]="'cancellation.splitPack.counterDecreaseAriaLabel' | translate"
      >
        -
      </button>
      <div
        class="split-pack-selector-modal__counter-value"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        [attr.aria-label]="('cancellation.splitPack.counterInputAriaLabel' | translate) + ': ' + count()"
        data-testid="split-pack-count"
      >
        {{ count() }}
      </div>
      <button
        igntButton
        class="split-pack-selector-modal__counter-btn"
        sentiment="primary"
        [disabled]="count() === maxCount"
        (click)="increment()"
        type="button"
        data-testid="split-pack-increment"
        [attr.aria-label]="'cancellation.splitPack.counterIncreaseAriaLabel' | translate"
      >
        +
      </button>
    </div>
  </div>
  <div class="split-pack-selector-modal__actions">
    <button igntButton sentiment="secondary" (click)="close(false)" data-testid="split-pack-modal-cancel">
      {{ 'common.cancel' | translate }}
    </button>
    <button igntButton (click)="close(true)" data-testid="split-pack-modal-confirm">
      {{ 'cancellation.splitPack.label' | translate }}
    </button>
  </div>
</div>
