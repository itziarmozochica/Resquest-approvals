<ul class="ticket__history">
  @for (item of history(); track item.key) {
    <li class="ticket__history-item">
      <app-ticket-history-item
        [historyItem]="item"
        [sessionTimezone]="sessionTimezone()"
        [showConnectorBelow]="!$last"
        [transferIntent]="transferIntent()"
        (ticketUpdated)="ticketUpdated.emit()"
      />
    </li>
  }
</ul>
