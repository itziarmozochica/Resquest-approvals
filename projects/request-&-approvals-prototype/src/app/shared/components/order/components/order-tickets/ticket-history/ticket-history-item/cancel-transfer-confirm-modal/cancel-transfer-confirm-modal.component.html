<ignt-dialog-header hideCloseButton data-testid="cancel-transfer-confirm-modal-title">
  {{ dialogData.title }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p class="cancel-transfer-confirm-modal__message" data-testid="cancel-transfer-confirm-modal-message">
    {{ dialogData.message }}
  </p>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button
    type="button"
    igntButton
    sentiment="tertiary"
    data-testid="cancel-transfer-confirm-modal-cancel-button"
    [disabled]="isLoading()"
    (click)="onCancel()"
  >
    {{ dialogData.cancelLabel }}
  </button>
  <button
    type="button"
    igntButton
    variant="danger"
    data-testid="cancel-transfer-confirm-modal-accept-button"
    [loading]="isLoading()"
    (click)="onAccept()"
  >
    {{ dialogData.acceptLabel }}
  </button>
</ignt-dialog-footer>
