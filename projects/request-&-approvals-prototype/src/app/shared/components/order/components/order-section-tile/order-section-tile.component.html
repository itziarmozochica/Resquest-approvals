<div class="order-section-tile" [class.order-section-tile--collapsed]="isCollapsed()">
  <div class="order-section-tile__header">
    <span class="order-section-tile__title" data-testid="order-section-tile-title">
      {{ title() }}
      @if (count(); as count) {
        <ignt-tag sentiment="sharp" data-testid="order-section-tile-count">{{ count }}</ignt-tag>
      }
    </span>
    <button
      class="order-section-tile__toggle"
      data-testid="order-section-tile-toggle"
      ignt-icon-button
      sentiment="tertiary"
      size="small"
      variant="sharp"
      [attr.aria-expanded]="!isCollapsed()"
      [attr.aria-label]="title()"
      [icon]="chevronIcon()"
      (click)="toggle()"
    ></button>
  </div>
  @if (!isCollapsed()) {
    <div class="order-section-tile__body" data-testid="order-section-tile-body">
      <ng-content />
    </div>
  }
</div>
