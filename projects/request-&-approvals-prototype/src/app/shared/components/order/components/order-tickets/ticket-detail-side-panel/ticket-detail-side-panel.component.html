<ignt-dialog-header data-testid="ticket-detail-side-panel-title">{{
  'validateTicketsNew.ticketDetail.ticketInformation' | translate
}}</ignt-dialog-header>

<ignt-dialog-content data-testid="ticket-detail-side-panel-content">
  <app-ticket-detail
    [isEntryPass]="isEntryPass"
    [orderId]="orderId"
    [sessionTimezone]="sessionTimezone"
    [ticket]="ticket"
    [ticketIndex]="ticketIndex"
    [transferIntent]="transferIntent"
    (ticketUpdated)="onTicketUpdated()"
  />
</ignt-dialog-content>
