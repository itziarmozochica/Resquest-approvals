<ignt-alert
  sentiment="accent"
  showCloseButton
  data-testid="fz-assistant-wip-banner"
  [description]="'listPlan.fzAssistantWipBanner.description' | translate"
  [closeButtonAriaLabel]="'common.close' | translate"
  (closeAlert)="dismiss()"
>
  <ng-template #igntAlertActions>
    <ignt-button
      size="small"
      [label]="'listPlan.fzAssistantWipBanner.buttonLabel' | translate"
      [leadingIcon]="{ name: 'sparkle', variant: 'solid' }"
      [variant]="buttonSentiment()"
      (click)="navigateToChatbot()"
    />
  </ng-template>
</ignt-alert>
