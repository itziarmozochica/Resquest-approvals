<span class="ai-sparkle-icon" [style.--ai-sparkle-icon-fill]="iconFillStyle()">
  @if (showGradientDefs()) {
    <svg class="ai-sparkle-icon__defs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient [id]="gradientId" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="var(--app-ai-sparkle-icon-gradient-stop-start)" />
          <stop offset="100%" stop-color="var(--app-ai-sparkle-icon-gradient-stop-end)" />
        </linearGradient>
      </defs>
    </svg>
  }
  <ignt-icon class="ai-sparkle-icon__icon" name="sparkle" variant="solid" [fixedWidth]="true" aria-hidden="true" />
</span>
