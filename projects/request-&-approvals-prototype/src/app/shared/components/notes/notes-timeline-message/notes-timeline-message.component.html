<div class="notes-timeline-message">
  <div
    #body
    class="notes-timeline-message__body"
    data-testid="notes-timeline-message-body"
    [class.notes-timeline-message__body--collapsed]="!isExpanded()"
  >
    {{ message() }}
  </div>
  @if (showToggle()) {
    <button
      type="button"
      class="notes-timeline-message__toggle"
      data-testid="notes-timeline-message-toggle"
      [attr.aria-expanded]="isExpanded()"
      (click)="toggle()"
    >
      {{ (isExpanded() ? 'boxOffice.order.notes.collapseMessage' : 'boxOffice.order.notes.expandMessage') | translate }}
    </button>
  }
</div>
