<ignt-dialog-header data-testid="unsaved-changes-dialog-title">{{ data.title }}</ignt-dialog-header>
<ignt-dialog-content data-testid="unsaved-changes-dialog-message"><span [innerHTML]="data.message"></span></ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <button type="button" igntButton sentiment="tertiary" data-testid="unsaved-changes-dialog-cancel-button" [igntDialogClose]="false">
    {{ data.cancelLabel }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    data-testid="unsaved-changes-dialog-accept-button"
    [variant]="data.isDestructive ? 'danger' : 'default'"
    [igntDialogClose]="true"
  >
    {{ data.acceptLabel }}
  </button>
</ignt-dialog-footer>
