<button
  ignt-icon-button
  type="button"
  sentiment="tertiary"
  size="small"
  [icon]="isFavorite() ? favoriteIcon : notFavoriteIcon"
  [disabled]="isPending()"
  [attr.aria-pressed]="isFavorite()"
  [attr.aria-label]="isFavorite() ? removeLabel : addLabel"
  data-testid="organization-favorite"
></button>
