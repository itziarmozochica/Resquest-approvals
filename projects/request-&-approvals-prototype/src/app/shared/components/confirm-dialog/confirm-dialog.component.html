<ignt-dialog-header hideCloseButton data-testid="confirm-dialog-title">
  {{ data.titleKey | translate: data.titleParams }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p class="confirm-dialog__message" data-testid="confirm-dialog-message" [class.confirm-dialog__message--centered]="data.isCentered">
    {{ data.messageKey | translate }}
  </p>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button
    type="button"
    igntButton
    sentiment="tertiary"
    [class.confirm-dialog__cancel--pushed]="data.isDestructive"
    (click)="onCancel()"
    data-testid="confirm-dialog-cancel"
  >
    {{ cancelKey | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    [variant]="data.isDestructive ? 'danger' : 'default'"
    (click)="onConfirm()"
    data-testid="confirm-dialog-confirm"
  >
    {{ confirmKey | translate }}
  </button>
</ignt-dialog-footer>
