<div class="recent-searches__header">
  <span class="recent-searches__title" [id]="titleId">{{ 'common.recentSearches.title' | translate }}</span>
  @if (items().length > 1) {
    <ignt-button
      data-testid="recent-searches-clear"
      variant="tertiary"
      sentiment="neutral"
      size="small"
      [label]="'common.recentSearches.clearAll' | translate"
      (click)="cleared.emit()"
    />
  }
</div>
<ul class="recent-searches__list" role="listbox" [attr.aria-labelledby]="titleId">
  @for (item of items(); track item.value) {
    <li
      class="recent-searches__option"
      role="option"
      tabindex="-1"
      aria-selected="false"
      aria-keyshortcuts="Delete"
      data-testid="recent-search-option"
      (click)="selected.emit(item.value)"
    >
      <ignt-icon class="recent-searches__icon" name="history" variant="regular" aria-hidden="true" />
      <span class="recent-searches__text">
        <span class="recent-searches__value" [title]="item.value"
          ><span [textContent]="item.before"></span><strong class="recent-searches__match" [textContent]="item.match"></strong
          ><span [textContent]="item.after"></span
        ></span>
        @if (item.time; as time) {
          <span class="recent-searches__time">{{ time.key ? (time.key | translate: { count: time.count }) : time.text }}</span>
        }
      </span>
      <span
        class="recent-searches__remove"
        data-testid="recent-search-remove"
        aria-hidden="true"
        [title]="'common.recentSearches.remove' | translate: { value: item.value }"
        (click)="remove($event, item.value)"
      >
        <ignt-icon name="times" variant="regular" />
      </span>
    </li>
  }
</ul>
