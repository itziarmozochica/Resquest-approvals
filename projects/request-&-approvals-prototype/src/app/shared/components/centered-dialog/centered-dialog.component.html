@if (isVisible()) {
  <dialog [open]="isVisible()" class="centered-dialog" data-testid="centered-dialog" (click)="closeOnBackdropClick() && dismiss()">
    <div class="centered-dialog__container" (click)="$event.stopPropagation()">
      <div class="centered-dialog__header">
        <h5 class="centered-dialog__header__title">{{ title() }}</h5>
        <button class="centered-dialog__header__close" (click)="dismiss()" data-testid="centered-dialog-close-button">
          <fa-icon [icon]="['fas', 'times']"></fa-icon>
        </button>
      </div>

      <div class="centered-dialog__content">
        <ng-content />
      </div>

      @if (footer(); as f) {
        <div class="centered-dialog__footer">
          @if (f.cancelLabel) {
            <button igntButton [sentiment]="cancelButtonSentiment()" (click)="dismiss()" data-testid="centered-dialog-cancel-button">
              {{ f.cancelLabel }}
            </button>
          }
          @if (f.submitLabel) {
            <button
              igntButton
              sentiment="primary"
              (click)="submit()"
              [disabled]="isSubmitDisabled()"
              data-testid="centered-dialog-submit-button"
            >
              {{ f.submitLabel }}
            </button>
          }
        </div>
      }
    </div>
  </dialog>
}
