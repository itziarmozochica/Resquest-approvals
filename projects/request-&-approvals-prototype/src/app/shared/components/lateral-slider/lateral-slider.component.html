<div
  class="scrim"
  [attr.data-testid]="showDetails ? 'lateral-slider-scrim-visible' : ''"
  [class.scrim--on]="showDetails"
  [class.scrim--inline-off]="inLineOnXl"
  (click)="closeOnBackdropClick ? clickOnClose() : null"
></div>
<div class="lateral-slider" [class.lateral-slider--inline]="inLineOnXl" [class.lateral-slider--expanded]="showDetails">
  <header class="lateral-slider-header">
    <div class="lateral-slider-header__label">
      <ng-container *ngIf="titleTemplate" [ngTemplateOutlet]="titleTemplate"> </ng-container>
      <ng-container *ngIf="!titleTemplate">
        {{ title | translate }}
      </ng-container>
    </div>
    <ng-container *ngIf="!hideCloseButton">
      <button
        class="lateral-slider-header__action-close icon-button icon-button--small icon-button--sharp-tertiary"
        [class.icon-button--disabled]="disableCloseButton"
        [attr.disabled]="disableCloseButton ? '' : null"
        aria-label="Close"
        data-testid="close-button"
        (click)="clickOnClose()"
      >
        <fa-icon [icon]="['fas', 'times']" [fixedWidth]="true"></fa-icon>
      </button>
    </ng-container>
  </header>
  <div class="lateral-slider-body">
    <ng-container *ngIf="contentTemplate" [ngTemplateOutlet]="contentTemplate"></ng-container>
    <ng-content *ngIf="!contentTemplate"></ng-content>
  </div>
</div>
