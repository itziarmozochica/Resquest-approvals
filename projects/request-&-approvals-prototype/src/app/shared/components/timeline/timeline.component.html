<div class="timeline">
  @for (item of items(); track item.id; let i = $index; let last = $last) {
    <app-shared-timeline-item
      [a11yLabels]="a11yLabels()"
      [contentHtml]="item.contentHtml ?? ''"
      [dateFormat]="dateFormat()"
      [dateLocale]="dateLocale()"
      [datetime]="item.datetime"
      [description]="item.description ?? ''"
      [icon]="item.icon"
      [iconAnimation]="item.iconAnimation ?? 'none'"
      [iconFramed]="iconFramed()"
      [iconSentiment]="item.iconSentiment ?? 'default'"
      [iconSize]="iconSize()"
      [id]="item.id"
      [initialExpanded]="item.initialExpanded ?? getInitialExpanded($first, last)"
      [showConnectorBelow]="!last"
      [tagSentiment]="item.tagSentiment ?? 'positive'"
      [tagText]="item.tagText ?? ''"
      [tagVariant]="item.tagVariant ?? 'solid'"
      [title]="item.title"
      (expanded)="onItemExpanded($event, item, i)"
    >
      @if (getItemTemplate(item.contentTemplateKey); as tpl) {
        <ng-template #expandedContent>
          <ng-container [ngTemplateOutlet]="tpl" [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
        </ng-template>
      }
    </app-shared-timeline-item>
  }
</div>
