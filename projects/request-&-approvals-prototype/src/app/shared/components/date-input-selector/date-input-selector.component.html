<app-datepicker-dialog
  [maxDateRange]="maxDateRange"
  [allowClearDate]="true"
  [queryDateRange]="selectedDateRange"
  (dateChange)="selectDateRangeDialog($event)"
  [isVisible]="isCalendarVisible()"
  (toggleCalendarVisibility)="toggleCalendarVisibility()"
/>
<div>
  <ignt-pill
    [label]="selectedDateRange | reservationsDatePillText"
    [leadingIcon]="['fal', 'calendar']"
    [trailingIcon]="['fal', 'angle-down']"
    [isActive]="(selectedDateRange | reservationsDatePillText) !== ('reservations.filterLabels.allDates' | translate)"
    value="date-selector-pill"
    (statusChange)="toggleCalendarVisibility()"
  />
</div>
