<div class="calendar-item__content">
  <div class="calendar-item__value">
    @if (!templateRef()) {
      <ng-content></ng-content>
    } @else {
      <ng-container *ngTemplateOutlet="templateRef()!"></ng-container>
    }
  </div>
  @if (isSoldOut()) {
    <span data-testid="calendar-view-item-is-sold-badge" class="off-badge">
      {{ 'sessions.calendar.offBadge' | translate }}
    </span>
  }
  @if (isHidden()) {
    <fa-icon data-testid="calendar-view-item-is-hidden-icon" class="calendar-item__hidden-icon" [icon]="['fal', 'eye-slash']"> </fa-icon>
  }
</div>
