<div
  data-testid="times-slots-calendar-filters"
  class="times-slots-calendar-filters"
  [class.times-slots-calendar-filters--ready]="!isDisabled"
>
  <div class="times-slots-calendar-filters__controls">
    <button
      (click)="previous()"
      [disabled]="isDisabled"
      class="times-slots-calendar-filters__previous-week icon-button icon-button--medium"
      data-testid="times-slots-calendar-filters-previous-week"
    >
      <fa-icon class="external-container__back-icon flip-rtl" [icon]="['fal', 'angle-left']"></fa-icon>
    </button>

    <div class="calendar-input" (click)="openDatePicker(datepickerInput)">
      <div class="calendar-input__date" *ngIf="!isDisabled">{{ datePickerText }}</div>
      <fa-icon
        data-testid="times-slots-calendar-filters-show-picker"
        class="calendar-input__open-date-picker"
        [icon]="['fal', 'angle-down']"
      >
      </fa-icon>
      <input
        #datepickerInput
        class="calendar-input__date-picker"
        type="date"
        [formControl]="datePicker"
        data-testid="times-slots-calendar-filters-date-picker"
      />
    </div>

    <button
      (click)="next()"
      [disabled]="isDisabled"
      class="times-slots-calendar-filters__next-week icon-button icon-button--medium"
      data-testid="times-slots-calendar-filters-next-week"
    >
      <fa-icon class="external-container__back-icon flip-rtl" [icon]="['fal', 'angle-right']"></fa-icon>
    </button>
  </div>

  <div class="times-slots-calendar-filters__button">
    <button
      (click)="selectToday()"
      [disabled]="isDisabled"
      igntButton
      [fill]="isMobile()"
      sentiment="secondary"
      variant="sharp"
      size="small"
      data-testid="times-slots-calendar-filters-today"
    >
      {{ 'sessions.calendar.filters.today' | translate }}
    </button>
  </div>
</div>
<div class="times-slots-calendar-filters__projected-content">
  <ng-content> </ng-content>
</div>
