<div class="calendar-container">
  <app-search-results
    (searchResults)="onSearchResults($event)"
    [areResultsEmpty]="areResultsEmpty"
    [checkHasMandatoryFilters]="checkHasMandatoryFilters"
    [filters]="filters"
    [errorMessage]="'sessions.calendar.error' | translate"
    [noFiltersIcon]="['far', 'sort-alt']"
    [noFiltersMessage]="'sessions.calendar.noFiltersSelected' | translate"
    [noResultIcon]="['far', 'receipt']"
    [noResultMessage]="'sessions.calendar.noResults' | translate"
    [request]="request"
    [displayContentWithNoResults]="true"
    class="calendar-container__results"
  >
    <app-weekly-calendar
      class="calendar-container__calendar"
      *ngIf="calendarEvents"
      [calendarEvents]="calendarEvents"
      [selectedDate]="selectedDate"
      [selectedDateRange]="selectedDateRange"
      [timezone]="timezone"
      [slotTemplate]="slotTemplate"
      [scrollToSlot]="firstSlotElementStartsAt"
      [headerTemplate]="headerTemplate"
      [timeHeaderTemplate]="timeHeaderTemplate"
      [hourHintTemplate]="hourHintTemplate"
      [dayHeaderPrependTemplate]="dayHeaderPrependTemplate"
      [minEventHeightInPixels]="minEventHeightInPixels()"
      [minRowHeightInPixels]="minRowHeightInPixels()"
    >
    </app-weekly-calendar>
  </app-search-results>
</div>
