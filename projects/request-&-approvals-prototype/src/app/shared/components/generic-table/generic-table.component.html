<div class="generic-table" [ngClass]="tableClass">
  <table>
    <thead class="generic-table__header">
      <tr>
        <th *ngFor="let column of columns" class="generic-table__header-cell" [ngClass]="column.class">
          {{ column.header | translate }}
        </th>
        <th *ngIf="actions.length > 0" class="generic-table__header-cell generic-table__header-cell--actions">
          {{ 'common.actions' | translate }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="isLoading">
        <td [attr.colspan]="columns.length + (actions.length > 0 ? 1 : 0)">
          <div class="generic-table__loading">
            <fa-icon [icon]="['fas', 'spinner']" animation="spin"></fa-icon>
          </div>
        </td>
      </tr>
      <tr *ngIf="!isLoading && data.length === 0">
        <td [attr.colspan]="columns.length + (actions.length > 0 ? 1 : 0)">
          <div class="generic-table__empty">
            {{ emptyMessage | translate }}
          </div>
        </td>
      </tr>
      <tr *ngFor="let item of data">
        <td *ngFor="let column of columns" [ngClass]="column.class">
          {{ getCellValue(item, column) }}
        </td>
        <td *ngIf="actions.length > 0" class="generic-table__actions-cell">
          <ng-container *ngFor="let action of actions">
            <button
              *ngIf="isActionVisible(item, action)"
              [class]="action.class ?? 'generic-table__action-btn'"
              (click)="onActionClick(item, action)"
              [disabled]="isActionDisabled(item, action)"
              [title]="action.title | translate"
              [attr.aria-label]="action.title | translate"
            >
              <fa-icon [icon]="action.icon"></fa-icon>
            </button>
          </ng-container>
        </td>
      </tr>
    </tbody>
  </table>
</div>
