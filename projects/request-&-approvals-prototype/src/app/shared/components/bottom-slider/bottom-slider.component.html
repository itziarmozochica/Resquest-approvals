<div class="overlay" [ngClass]="{ 'overlay--fade': showDetails }"></div>
<div class="footer-container" [ngClass]="{ 'footer-container--expanded': showDetails }">
  <div class="footer-container__tab" *ngIf="detailsTemplate && showTab" (click)="clickOnShowDetails()">
    <div class="content">
      <span class="content__icon" [ngClass]="{ 'content__icon--expanded': showDetails }">
        <fa-icon [icon]="['fal', 'angle-up']"></fa-icon>
      </span>
      <span class="content__label" data-testid="bottom-slider-content-label">
        {{ showDetails ? hideDetailsLabel : showDetailsLabel }}
      </span>
    </div>
  </div>
  <div class="footer-container__details" [ngClass]="{ 'footer-container__details--expanded': showDetails }">
    <ng-container *ngTemplateOutlet="detailsTemplate"> </ng-container>
  </div>
  <div class="footer-container__buttons" [ngClass]="{ 'footer-container__buttons--expanded': showDetails }">
    <ng-container *ngTemplateOutlet="buttonsTemplate"> </ng-container>
  </div>
</div>
