<span
  class="fever-only-marker"
  data-testid="fever-only-marker"
  [attr.aria-label]="'common.feverOnlyMarker.tooltip' | translate"
  [appTemplatedTooltip]="feverOnlyTooltip"
>
  <ignt-icon name="user-lock" variant="solid" size="sm" aria-hidden="true" />
</span>

<ng-template #feverOnlyTooltip>
  <span class="fever-only-marker__tooltip">
    {{ 'common.feverOnlyMarker.tooltip' | translate }}
  </span>
</ng-template>
