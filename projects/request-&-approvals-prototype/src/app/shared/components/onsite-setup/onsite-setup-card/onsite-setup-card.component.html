<div class="onsite-setup-card" data-testid="onsite-setup-card">
  <div class="onsite-setup-card__name" data-testid="onsite-setup-card-name">
    {{ setupName() }}
    @if (isActive()) {
      <ignt-tag data-testid="onsite-setup-card-active-tag" sentiment="positive" variant="outline">
        {{ 'boxOffice.settings.setupCard.activeTag' | translate }}
      </ignt-tag>
    }
    @if (isHidden()) {
      <ignt-tag
        data-testid="onsite-setup-card-hidden-tag"
        igntTooltip
        sentiment="warning"
        variant="outline"
        [tooltipLabel]="'boxOffice.settings.setupCard.hiddenSetupTooltip' | translate"
      >
        {{ 'boxOffice.settings.setupCard.hiddenTag' | translate }}
      </ignt-tag>
    }
  </div>
  <div class="onsite-setup-card__actions" data-testid="onsite-setup-card-actions">
    @if (showTabsButtons()) {
      @if (hasCustomTabsConfigs()) {
        <ignt-button
          data-testid="onsite-setup-card-edit-custom-tabs"
          size="small"
          variant="tertiary"
          [label]="'boxOffice.settings.setupCard.editCustomTabsButton' | translate"
          [leadingIcon]="editCustomTabsIcon"
          (click)="editCustomTabs.emit(setup())"
        />
      } @else {
        <ignt-button
          data-testid="onsite-setup-card-add-custom-tabs"
          size="small"
          variant="tertiary"
          [label]="'boxOffice.settings.setupCard.addCustomTabsButton' | translate"
          [leadingIcon]="addCustomTabsIcon"
          (click)="addCustomTabs.emit(setup())"
        />
      }
      <div class="onsite-setup-card__actions__divider"></div>
    }
    @if (isOneStopShopOboFlow()) {
      <button
        class="onsite-setup-card__icon-button"
        data-testid="onsite-setup-card-open-in-box-office"
        ignt-icon-button
        size="small"
        [icon]="['fas', 'external-link-alt']"
        sentiment="tertiary"
        (click)="openInBoxOffice.emit(setup())"
      ></button>
    }
    <button
      class="onsite-setup-card__icon-button"
      data-testid="onsite-setup-card-duplicate"
      ignt-icon-button
      size="small"
      [icon]="['fas', 'copy']"
      sentiment="tertiary"
      [disabled]="areActionsDisabled()"
      (click)="duplicate.emit(setup())"
    ></button>
    <button
      class="onsite-setup-card__icon-button"
      data-testid="onsite-setup-card-edit"
      ignt-icon-button
      size="small"
      [icon]="['fas', 'edit']"
      sentiment="tertiary"
      [disabled]="areActionsDisabled()"
      (click)="edit.emit(setup())"
    ></button>
    <button
      class="onsite-setup-card__icon-button"
      data-testid="onsite-setup-card-delete"
      ignt-icon-button
      size="small"
      [icon]="['fas', 'trash']"
      sentiment="tertiary"
      variant="danger"
      [disabled]="areActionsDisabled()"
      (click)="delete.emit(setup())"
    ></button>
  </div>
</div>
