<div class="contacts__chip-container" [class.contacts__chip-container--disabled]="isDisabled">
  <div
    *ngFor="let contact of contacts; let i = index; trackBy: trackByIndex"
    class="chip"
    data-testid="contacts-chip"
    (click)="editContact(i)"
  >
    <span class="chip__label">{{ contact }}</span>
    <fa-icon (click)="removeContactByIndex(i)" data-testid="contacts-chip-remove" class="chip__close" [icon]="['fas', 'times']"></fa-icon>
  </div>
  <span class="input-wrapper">
    <span class="input-wrapper__expander">{{ newValueControl.value }}</span>
    <input
      #contactsInput
      [attr.data-testid]="inputName"
      [placeholder]="'notificationSetting.addAContactPlaceholderV2' | translate"
      (keydown)="onSpaceOrEnterKeydown($event)"
      (keydown.escape)="cancelEdit()"
      (blur)="onBlur($event)"
      type="email"
      class="new-contact-input"
      [formControl]="newValueControl"
    />
  </span>
</div>
