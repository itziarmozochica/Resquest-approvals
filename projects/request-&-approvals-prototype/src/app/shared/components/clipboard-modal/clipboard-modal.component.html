<app-modal-content *ngIf="useWrapper; else content">
  <ng-container *ngTemplateOutlet="content"></ng-container>
</app-modal-content>

<ng-template #content>
  <div class="modal-body">
    <div class="modal__title" *ngIf="title">{{ title }}</div>
    <div>
      <span *ngIf="showSuccessMessage" class="el-success-message" translate>copiedToClipboard</span>
      <div class="co-input-copy-clipboard">
        <input class="el-input-copy-clipboard" type="text" [value]="toCopy" readonly />
        <button type="button" class="el-button-copy-clipboard" ngxClipboard [cbContent]="toCopy" (cbOnSuccess)="displaySuccessMessage()">
          <ignt-icon name="clipboard" variant="regular" [fixedWidth]="true"></ignt-icon>
        </button>
      </div>
    </div>
    <div class="modal__actions">
      <button class="button button--large button--primary modal__button" (click)="close(true)">
        {{ acceptButtonLabel }}
      </button>
    </div>
  </div>
</ng-template>
