<div class="seating-selector">
  <div class="seating-selector__header" *ngIf="showTopBar">
    <div class="seats-assigned">
      <div>{{ 'seatingSelector.seatsAssigned' | translate }}</div>
      <div data-testid="seating-selector-count">
        <ng-container *ngIf="!manageAsFreeSeatingMap; else freeMapMode">
          <span class="seats-assigned__count">{{ seatsCounter | number: numberFormat }}</span>
          /{{ state?.places || 0 | number: numberFormat }}
        </ng-container>
        <ng-template #freeMapMode>
          <span class="seats-assigned__count">{{ seatsCounter | number: numberFormat }}</span>
        </ng-template>
      </div>
    </div>
    <div class="clear-selection" *ngIf="!seatingMapUrl?.endsWith('onebox/')" [class.clear-selection--disabled]="seatsCounter === 0">
      <a data-testid="clear-selection-link" class="clear-selection__link" (click)="onUserClearSelection()">
        {{ 'seatingSelector.clearSelection' | translate }}
      </a>
    </div>
  </div>
  <ng-container *ngIf="seatingMapUrl">
    <app-seating-selector-wrapper
      class="seating-selector-wrapper"
      #seatingSelectorWrapper
      [url]="seatingMapUrl"
      [state]="state"
      [locale]="locale"
      [clearSelection]="clearSelectionSubject"
      (update)="seatingSelectorChange($event)"
      (iframeInteraction)="onIframeInteraction()"
    >
    </app-seating-selector-wrapper>
  </ng-container>
</div>
