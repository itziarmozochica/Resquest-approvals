<div class="mfa-setup-required-banner" data-testid="mfa-setup-required-banner">
  <ignt-alert
    [actionLabel]="'layout.mfaSetupRequiredBanner.setup' | translate"
    [sentiment]="alertSentiment()"
    [title]="titleKey() | translate: titleParams()"
    (actionClicked)="onSetupClicked()"
  >
    <ng-template #igntAlertContent>
      <p class="mfa-setup-required-banner__description">
        {{ 'layout.mfaSetupRequiredBanner.description' | translate }}
        <ignt-button
          class="mfa-setup-required-banner__learn-more"
          variant="tertiary"
          sentiment="brand"
          size="small"
          [label]="'layout.mfaSetupRequiredBanner.learnMore' | translate"
          data-testid="mfa-setup-required-banner-learn-more"
          (click)="onLearnMoreClicked()"
        />
      </p>
    </ng-template>
  </ignt-alert>
</div>
