<div class="modal-header" [class.modal-no-title]="!title">
  <ng-container *ngIf="hasNavigation">
    <button type="button" class="btn-back" aria-label="Back" (click)="activeModal.dismiss('Back click')">
      <fa-icon [fixedWidth]="true" [icon]="['fas', 'chevron-left']" size="xs"></fa-icon>
    </button>
  </ng-container>
  <p class="modal-title" *ngIf="title">
    <span class="modal-title-icon" *ngIf="iconId"><fa-icon [fixedWidth]="true" [icon]="['fal', iconId]"></fa-icon></span>{{ title }}
  </p>
  <ng-container *ngIf="hasCloseButton">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
  </ng-container>
</div>
<ng-content></ng-content>
