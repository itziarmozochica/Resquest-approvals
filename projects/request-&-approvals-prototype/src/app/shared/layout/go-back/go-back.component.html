<div class="bl-go-back">
  <div class="bl-go-back-content">
    <div class="bl-go-back-row">
      <div class="bl-go-back-link-and-icon">
        <a
          data-testid="go-back-link"
          class="el-go-back_link"
          [routerLink]="navigate && urlGoBack.length > 0 ? urlGoBack : null"
          [queryParams]="navigate && urlGoBack.length > 0 ? queryParams : {}"
          (click)="onGoBack()"
        >
          <fa-icon class="el-go-back_link-icon" [icon]="['fal', 'angle-left']"></fa-icon>
          <span class="el-go-back_link-text">{{ goBackTitle || ('goBack.title' | translate) }}</span>
        </a>
      </div>
    </div>
  </div>
</div>
