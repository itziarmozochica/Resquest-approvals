<li class="sidebar-menu-section__item" *permissionBased="permissions.CAN_VIEW_AFFILIATE_DASHBOARD">
  <app-menu-item
    data-testid="sidebar-plans"
    [icon]="['fal', 'list-alt']"
    [section]="'myEvents'"
    [link]="'/my-plans/list'"
    [queryParams]="queryParamsMap.get('/my-plans/list') | async"
    (click)="handleMyEventsClick()"
  >
  </app-menu-item>
</li>

<li class="sidebar-menu-section__item" *permissionBased="permissions.CAN_VIEW_MY_AMBASSADOR_PROGRAMS">
  <app-menu-item
    id="ambassador-programs"
    [icon]="['fal', 'list-alt']"
    [section]="'ambassadors'"
    [link]="'/ambassador-programs/programs'"
    (click)="handleMyAmbassadorProgramsClick()"
    data-testid="sidebar-ambassador-programs"
  >
  </app-menu-item>
</li>

<li class="sidebar-menu-section__item" *permissionBased="permissions.CAN_VIEW_MY_NETWORK">
  <app-menu-item
    id="network"
    [icon]="['far', 'users']"
    [section]="'network'"
    [pathOption]="'subset'"
    (click)="handleNetworkClick()"
    [link]="'/network'"
    data-testid="sidebar-network"
  >
  </app-menu-item>
</li>
