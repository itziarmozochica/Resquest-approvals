@if (isExternalLink()) {
  <a
    class="menu-item"
    [class.menu-item--is-open]="isOpen"
    [class.menu-item--is-active]="active"
    [href]="link()"
    [attr.target]="openInNewTab() ? '_blank' : '_self'"
    [attr.rel]="openInNewTab() ? 'noopener noreferrer' : null"
  >
    <ng-container *ngTemplateOutlet="menuItemTemplate"></ng-container>
  </a>
} @else if (link()) {
  <a
    class="menu-item"
    [class.menu-item--is-open]="isOpen"
    [routerLinkActive]="useRouterLinkActive() ? 'menu-item--is-active' : ''"
    [routerLink]="link()"
    [class.menu-item--is-active]="active"
    [queryParams]="queryParams"
    [routerLinkActiveOptions]="{ paths: pathOption, queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
  >
    <ng-container *ngTemplateOutlet="menuItemTemplate"></ng-container>
  </a>
} @else {
  <a class="menu-item" [class.menu-item--is-open]="isOpen" [class.menu-item--is-active]="active">
    <ng-container *ngTemplateOutlet="menuItemTemplate"></ng-container>
  </a>
}

<ng-template #menuItemTemplate>
  <div class="menu-item__content">
    <fa-icon *ngIf="showIcon && icon" class="menu-item__icon" [fixedWidth]="true" [icon]="icon" />
    <ng-container *ngIf="!onlyIcon">
      @if (text) {
        <span class="menu-item__label">{{ text }}</span>
      } @else {
        <span class="menu-item__label" translate>menu.{{ section }}</span>
      }
      <span *ngIf="showTag" class="menu-item__tag" translate>menu.new</span>
      @if (showAiBadge()) {
        <app-ai-badge />
      }
    </ng-container>
  </div>
  <fa-icon *ngIf="accordion" class="menu-item__accordion-icon" [fixedWidth]="true" [icon]="['fal', 'angle-down']" />
</ng-template>
