<div class="impersonation-banner" aria-live="polite" role="status">
  <p class="impersonation-banner__message">
    {{ 'layout.impersonationBanner.messagePrefix' | translate }}
    <strong class="impersonation-banner__user">{{ displayUser() }}</strong>
    {{ 'layout.impersonationBanner.messageSuffix' | translate }}
    <button
      class="impersonation-banner__action"
      type="button"
      [attr.aria-busy]="isStopping()"
      [disabled]="isStopping()"
      (click)="stopImpersonation()"
    >
      {{ 'layout.impersonationBanner.goBack' | translate }}
    </button>
  </p>
</div>
