<div class="date-time-search-bar">
  <ng-container *ngIf="!isMobile && showTimePicker">
    <div class="date-time-search-bar__combined">
      <div class="double-field-wrapper">
        <label class="field">
          <input
            #desktopDateInput
            type="date"
            class="field__input"
            placeholder=" "
            data-testid="desktop-date-selector"
            [disabled]="disabled"
            [ngClass]="{ 'field__input--hidden-date': !initialDateShown }"
            (ngModelChange)="onNativeFromDateSelection($event)"
            [ngModel]="dateSelected | date: 'yyyy-MM-dd' : 'utc'"
          />
          <span class="field__label">{{ 'common.date' | translate }}</span>
          <fa-icon
            class="field__icon field__icon--trail"
            [fixedWidth]="true"
            [icon]="['fal', 'calendar-day']"
            (click)="onDesktopCalendarIconClick($event)"
          />
        </label>
        <label class="field">
          <select
            class="field__select"
            data-testid="desktop-time-selector"
            [disabled]="disabled || dateTimeOptions.length === 0"
            [ngModel]="timeSelectValue"
            (ngModelChange)="onTimeSelectChange($event)"
          >
            <option *ngIf="dateTimeOptions.length === 0" [ngValue]="''" disabled>{{ initialDateTimeOption.title }}</option>
            <option *ngFor="let opt of dateTimeOptions" [ngValue]="opt.id">{{ opt.title }}</option>
          </select>
          <span class="field__label">{{ 'orders.bulkReschedule.dateSelector.timeSlotLabel' | translate }}</span>
          <fa-icon class="field__icon field__icon--trail" [fixedWidth]="true" [icon]="['fal', 'clock']" />
        </label>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="!isMobile && !showTimePicker">
    <div class="date-time-search-bar__date-only">
      <label class="field">
        <input
          #desktopDateInput
          type="date"
          class="field__input"
          placeholder=" "
          data-testid="desktop-date-selector"
          [disabled]="disabled"
          [ngClass]="{ 'field__input--hidden-date': !initialDateShown }"
          (ngModelChange)="onNativeFromDateSelection($event)"
          [ngModel]="dateSelected | date: 'yyyy-MM-dd' : 'utc'"
        />
        <span class="field__label">{{ 'common.date' | translate }}</span>
        <fa-icon
          class="field__icon field__icon--trail"
          [fixedWidth]="true"
          [icon]="['fal', 'calendar-day']"
          (click)="onDesktopCalendarIconClick($event)"
        />
      </label>
    </div>
  </ng-container>

  <ng-container *ngIf="isMobile">
    <div class="date-time-search-bar__mobile">
      <label class="field date-time-search-bar__mobile-date">
        <input
          #mobileDateInput
          type="date"
          data-testid="mobile-date-selector"
          class="field__input"
          placeholder=" "
          [ngClass]="{ 'field__input--hidden-date': !initialDateShown }"
          [disabled]="disabled"
          (ngModelChange)="onNativeFromDateSelection($event)"
          [ngModel]="dateSelected | date: 'yyyy-MM-dd' : 'utc'"
        />
        <span class="field__label">{{ 'common.date' | translate }}</span>
        <fa-icon
          class="field__icon field__icon--trail"
          [fixedWidth]="true"
          [icon]="['fal', 'calendar-day']"
          (click)="onMobileCalendarIconClick($event)"
        />
      </label>
      <label *ngIf="showTimePicker" class="field date-time-search-bar__mobile-time">
        <select
          class="field__select"
          data-testid="mobile-time-selector"
          [disabled]="disabled || dateTimeOptions.length === 0"
          [ngModel]="timeSelectValue"
          (ngModelChange)="onTimeSelectChange($event)"
        >
          <option *ngIf="dateTimeOptions.length === 0" [ngValue]="''" disabled>{{ initialDateTimeOption.title }}</option>
          <option *ngFor="let opt of dateTimeOptions" [ngValue]="opt.id">{{ opt.title }}</option>
        </select>
        <span class="field__label">{{ 'orders.bulkReschedule.dateSelector.timeSlotLabel' | translate }}</span>
        <fa-icon class="field__icon field__icon--trail" [fixedWidth]="true" [icon]="['fal', 'clock']" />
      </label>
    </div>
  </ng-container>
</div>
