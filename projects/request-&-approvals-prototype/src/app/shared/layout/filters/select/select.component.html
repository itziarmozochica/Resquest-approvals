<div *ngIf="isMobile" class="select--mobile" data-testid="mobile-filter-select">
  <select (change)="selectMobileOption($event)">
    <option value="" [disabled]="!allowAll" [hidden]="!allowAll || options.length < 2" [selected]="!selectedOption">
      {{ emptyLabel }}
    </option>
    <option *ngFor="let option of options" [value]="option.id" [selected]="selectedOption?.id === option.id">{{ option.title }}</option>
  </select>
</div>

<div ngbDropdown class="select" *ngIf="!isMobile">
  <app-filter-button [disabled]="disabled" ngbDropdownToggle>
    {{ selectedOption?.title || emptyLabel }}
    <fa-icon class="select-button__icon" [icon]="['fas', 'chevron-down']"></fa-icon>
  </app-filter-button>
  <div class="select-options" ngbDropdownMenu>
    <button ngbDropdownItem *ngIf="allowAll" (click)="selectOption()">
      <app-filter-select-option *ngIf="options.length > 1" [title]="emptyLabel" [selected]="!selectedOption"></app-filter-select-option>
    </button>
    <button ngbDropdownItem (click)="selectOption(option)" *ngFor="let option of options">
      <app-filter-select-option
        [title]="option.title"
        [description]="option.description"
        [selected]="selectedOption?.id === option.id"
      ></app-filter-select-option>
    </button>
  </div>
</div>
