<div class="btn-group filters-group">
  <button
    *ngFor="let selector of selectors"
    class="btn"
    [class.active]="selector.type === dateButtonSelected"
    (click)="onSelector(selector)"
  >
    {{ selector.name }}
  </button>
  <app-date-range
    class="embed"
    [resetDate]="resetDate"
    (selected)="getDateRange($event)"
    [queryDateRange]="parseInitialDateRange()"
  ></app-date-range>
</div>
