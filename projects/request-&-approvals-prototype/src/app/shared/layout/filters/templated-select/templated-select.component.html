<div ngbDropdown class="templated-select">
  <div
    class="templated-select__selector"
    [class.templated-select__selector--disabled]="disabled"
    [attr.disabled]="disabled ? true : null"
    ngbDropdownToggle
    role="button"
    tabindex="0"
  >
    <div>
      <ng-container
        *ngIf="selectedOption; else emptyTemplate"
        [ngTemplateOutlet]="selectedOptionTemplate"
        [ngTemplateOutletContext]="{ $implicit: selectedOption, isDisabled: disabled }"
      ></ng-container>
    </div>

    <div class="templated-select__icons">
      <fa-icon
        *ngIf="allowClear && selectedOption && !disabled"
        class="templated-select__icon templated-select__icon--clear"
        [icon]="['fas', 'times']"
        (click)="clearSelection($event)"
      ></fa-icon>
      <fa-icon class="templated-select__icon" [icon]="['fas', 'chevron-down']"></fa-icon>
    </div>
  </div>

  <div class="templated-select__options" ngbDropdownMenu>
    <button type="button" ngbDropdownItem *ngIf="selectAllTemplate" (click)="selectOption()">
      <ng-container [ngTemplateOutlet]="selectAllTemplate"></ng-container>
    </button>

    <button
      type="button"
      data-testid="template-select-option-button"
      ngbDropdownItem
      (click)="selectOption(option)"
      *ngFor="let option of allOptions"
    >
      <ng-container
        [ngTemplateOutlet]="optionTemplate"
        [ngTemplateOutletContext]="{
          $implicit: option,
          isSelected: option.id === selectedOption?.id,
        }"
      ></ng-container>
    </button>
  </div>
</div>
