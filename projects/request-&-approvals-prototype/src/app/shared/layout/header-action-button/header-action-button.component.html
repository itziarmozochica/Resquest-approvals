<span class="header-action-button">
  <button
    ignt-icon-button
    sentiment="tertiary"
    type="button"
    [attr.aria-label]="
      action().badge ? ('header.actionWithCount' | translate: { count: action().badge, label: action().label }) : action().label
    "
    [attr.data-testid]="action().id"
    (click)="pressed.emit(action().id)"
    [icon]="action().icon"
  ></button>
  @if (action().badge; as badge) {
    <span class="header-action-button__badge" aria-hidden="true" [attr.data-testid]="action().id + '-badge'">{{ badge }}</span>
  }
</span>
