<ng-template #contentTemplate>
  <div class="menu-bottom-sheet__content">
    <ng-content></ng-content>

    <div class="menu-bottom-sheet__actions">
      @for (action of actions(); track action.id) {
        <app-mobile-menu-item
          [attr.data-dd-action-name]="action.label"
          [attr.data-testid]="action.id"
          [label]="action.label"
          [leadingIcon]="action.icon"
          (action)="onActionClick(action)"
        >
          @if (action.tag; as tag) {
            <ignt-tag [attr.data-testid]="action.id + '-tag'" variant="outline" [sentiment]="action.tagSentiment ?? 'info'">{{
              tag
            }}</ignt-tag>
          }
        </app-mobile-menu-item>
      }
    </div>
  </div>
</ng-template>

<ng-template #titleTemplate>
  <app-user-info [partner]="partner" [userName]="userName()"></app-user-info>
</ng-template>

<app-lateral-slider
  [closeOnBackdropClick]="true"
  [contentTemplate]="contentTemplate"
  [showDetails]="isOpen()"
  [titleTemplate]="titleTemplate"
  (closeSlider)="close()"
  data-testid="menu-bottom-sheet"
></app-lateral-slider>
