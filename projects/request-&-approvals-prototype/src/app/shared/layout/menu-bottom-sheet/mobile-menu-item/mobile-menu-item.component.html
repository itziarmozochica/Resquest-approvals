<button
  igntButton
  class="menu-item"
  sentiment="tertiary"
  size="large"
  [disabled]="disabled()"
  [fill]="true"
  [leadingIcon]="leadingIcon()"
  [queryParams]="linkParams()"
  [routerLink]="link()"
  [variant]="variant()"
  type="button"
  (click)="onClick()"
>
  <span class="menu-item__label">{{ label() }}</span>
  <ng-content select="ignt-tag"></ng-content>
</button>
