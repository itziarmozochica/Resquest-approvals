<div ngbDropdown class="sort-by" data-testid="sort-by">
  <button class="sort-by__button" data-testid="sort-by-button" ngbDropdownToggle>
    {{ emptyLabel() }}
    @if (selectedOption(); as option) {
      <span class="sort-by__button-selected">{{ option.title }}</span>
    }
    <fa-icon class="sort-by__button-icon" [icon]="['fas', 'chevron-down']"></fa-icon>
  </button>
  <div class="sort-by__options" ngbDropdownMenu>
    @for (option of options(); track option.id) {
      <button ngbDropdownItem (click)="selectOption(option)">
        <app-sort-by-select-option
          [title]="option.title"
          [description]="option.description"
          [selected]="selectedOption()?.id === option.id"
        ></app-sort-by-select-option>
      </button>
    }
  </div>
</div>
