<div class="contact-container" *ngIf="isActive()" [class.contact-container--hide-in-mobile]="hideInMobile">
  <div class="contact-container__button">
    <ng-container *ngTemplateOutlet="whatsappTemplate"> </ng-container>
  </div>
</div>

<ng-template #whatsappTemplate>
  <div class="whatsapp-contact-popup">
    <div class="whatsapp-contact-popup__button">
      <a target="_blank" class="whatsapp-contact-popup__button-link" (click)="handleClickOnIcon()" [href]="getContactUrl()">
        <fa-icon [fixedWidth]="true" [icon]="['fab', 'whatsapp']" [size]="'2x'"> </fa-icon>
      </a>
    </div>
  </div>
</ng-template>
