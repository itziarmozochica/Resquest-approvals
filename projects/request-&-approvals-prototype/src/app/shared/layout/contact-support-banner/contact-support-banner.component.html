@if (facade.isVisible()) {
  <ignt-alert
    data-testid="contact-support-banner"
    sentiment="info"
    showCloseButton
    [closeButtonAriaLabel]="'header.contactSupportBanner.close' | translate"
    [description]="'header.contactSupportBanner.description' | translate"
    (closeAlert)="facade.dismiss()"
  />
}
