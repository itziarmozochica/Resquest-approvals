<div class="pagination">
  <button
    [disabled]="!previousPage"
    (click)="onNumPageSelected(previousPage)"
    class="pagination__prev-button"
    data-testid="pagination-prev-button"
  >
    <fa-icon [icon]="['far', 'chevron-left']"></fa-icon>
    {{ 'common.previous' | translate }}
  </button>
  <div class="pagination__pages-container">
    <button
      *ngFor="let page of pagesToShow"
      (click)="onNumPageSelected(page)"
      class="pagination__page-number"
      [attr.data-testid]="'pagination__page-number__' + page"
      [disabled]="page === ELLIPSIS"
      [ngClass]="{
        'pagination__page-number--selected': page === selectedPageStr,
      }"
    >
      {{ page }}
    </button>
  </div>
  <button [disabled]="!nextPage" (click)="onNumPageSelected(nextPage)" class="pagination__next-button" data-testid="pagination-next-button">
    {{ 'common.next' | translate }}
    <fa-icon [icon]="['far', 'chevron-right']"></fa-icon>
  </button>
</div>
