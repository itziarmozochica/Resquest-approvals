<ignt-dialog-header>{{ data.title }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="question-answer-file-preview">
    @switch (kind()) {
      @case (kinds.IMAGE) {
        <img class="question-answer-file-preview__media" fill [ngSrc]="data.file.url" [alt]="data.title" />
      }
    }
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <ignt-button
    htmlType="button"
    variant="primary"
    data-testid="download-file"
    [loading]="downloading()"
    [label]="'common.download' | translate"
    (click)="onDownload()"
  />
</ignt-dialog-footer>
