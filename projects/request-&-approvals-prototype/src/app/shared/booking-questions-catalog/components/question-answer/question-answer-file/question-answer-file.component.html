<div class="question-answer-file">
  @if (file(); as file) {
    @switch (kind()) {
      @case (kinds.IMAGE) {
        <div class="question-answer-file__frame" data-testid="answer-file">
          <img class="question-answer-file__image" [ngSrc]="file.url" [alt]="title()" fill />
          <button
            ignt-icon-button
            type="button"
            class="question-answer-file__preview"
            data-testid="answer-file-preview"
            sentiment="tertiary"
            size="small"
            [fab]="true"
            [icon]="['fal', 'expand']"
            [attr.aria-label]="'questionAnswer.openFile' | translate"
            (click)="onPreview(file)"
          ></button>
        </div>
      }
    }
  }
</div>
