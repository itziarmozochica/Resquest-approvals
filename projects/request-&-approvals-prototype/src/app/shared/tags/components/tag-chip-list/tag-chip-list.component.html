<ul class="tag-chip-list">
  @for (tag of visibleTags(); track tag.id) {
    <li class="tag-chip-list__item">
      <app-tag-chip data-testid="tag-chip" [tag]="tag" />
    </li>
  }

  @if (hiddenTags().length > 0) {
    <li class="tag-chip-list__item">
      <ignt-tag
        data-testid="tag-chip-overflow"
        igntTooltip
        role="img"
        sentiment="info"
        tabindex="0"
        variant="solid"
        [attr.aria-label]="hiddenNames()"
        [tooltipLabel]="hiddenNames()"
        >+{{ hiddenTags().length }}</ignt-tag
      >
    </li>
  }
</ul>
