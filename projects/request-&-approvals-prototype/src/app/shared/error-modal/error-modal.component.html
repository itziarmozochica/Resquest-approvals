<ignt-dialog-header data-testid="error-modal-title" hideCloseButton>{{ title }}</ignt-dialog-header>
<ignt-dialog-content data-testid="error-modal-messages">
  @for (message of messages; track $index) {
    <p [innerHTML]="message"></p>
  }
</ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <ignt-button fill variant="primary" data-testid="error-modal-accept-button" [label]="okLabel()" [igntDialogClose]="true" />
</ignt-dialog-footer>
