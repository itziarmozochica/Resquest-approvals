<div class="dashboard-row-result">
  @if (isLoading()) {
    <div class="dashboard-row-result__loading" [attr.data-testid]="dataTestIdPrefix() + '-iframe-loading'" aria-busy="true">
      <ignt-icon name="spinner" variant="solid" [spin]="true" size="display" aria-hidden="true"></ignt-icon>
    </div>
  }
  <iframe
    #realTimeEmbeddedIframe
    [attr.data-testid]="dataTestIdPrefix() + '-iframe'"
    class="dashboard-row-result__graph"
    frameborder="0"
    width="100%"
    allowtransparency
    [class.dashboard-row-result__graph--loading]="isLoading()"
    [src]="safeUrl()"
    appIframeResizer
    allow="fullscreen"
    allowfullscreen
    heightCalculationMethod="taggedElement"
    [title]="frameTitle()"
  >
  </iframe>
</div>
