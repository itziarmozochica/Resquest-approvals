<div class="nothing-selected" [attr.data-testid]="dataTestIdPrefix() + '-nothing-selected'">
  <h2 class="font-h3" [attr.data-testid]="dataTestIdPrefix() + '-nothing-selected-title'">
    {{ title() }}
  </h2>
  <p [attr.data-testid]="dataTestIdPrefix() + '-nothing-selected-detail'">
    {{ detail() }}
  </p>
  @if (hint(); as hintText) {
    <!-- The `-same-currency` suffix is kept because QA already automates it on big launches. -->
    <p [attr.data-testid]="dataTestIdPrefix() + '-nothing-selected-same-currency'">
      {{ hintText }}
    </p>
  }
  <img [src]="imageSrc()" alt="" aria-hidden="true" [attr.data-testid]="dataTestIdPrefix() + '-inspiration-image'" />
</div>
