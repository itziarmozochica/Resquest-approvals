<ignt-dialog-header>{{ 'planEdition.immersiveContentPlan.autoTranslateDialogTitle' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  {{
    'planEdition.immersiveContentPlan.autoTranslateDialogMessage'
      | translate: { filledCount: data.filledCount, totalCount: data.totalCount }
  }}
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <ignt-button
    data-testid="immersive-auto-translate-dialog-cancel"
    sentiment="neutral"
    variant="tertiary"
    [igntDialogClose]="false"
    [label]="'common.cancel' | translate"
  />
  <ignt-button
    data-testid="immersive-auto-translate-dialog-missing"
    sentiment="neutral"
    variant="secondary"
    [disabled]="data.filledCount === data.totalCount"
    [igntDialogClose]="'missing'"
    [label]="'planEdition.immersiveContentPlan.autoTranslateDialogMissing' | translate"
  />
  <ignt-button
    data-testid="immersive-auto-translate-dialog-all"
    sentiment="danger"
    variant="primary"
    [igntDialogClose]="'all'"
    [label]="'planEdition.immersiveContentPlan.autoTranslateDialogAll' | translate"
  />
</ignt-dialog-footer>
