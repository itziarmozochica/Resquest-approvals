<div
  class="immersive-markdown-editor__toolbar"
  role="group"
  [attr.aria-label]="'planEdition.immersiveContentPlan.markdownEditor.toolbar' | translate"
>
  @for (item of toolbarItems; track item.format) {
    <button
      class="immersive-markdown-editor__format"
      igntTooltip
      tooltipPlacement="top"
      type="button"
      [attr.aria-label]="item.labelKey | translate"
      [attr.aria-pressed]="activeFormats().has(item.format)"
      [attr.data-testid]="'immersive-markdown-format-' + item.format"
      [disabled]="isDisabled()"
      [tooltipLabel]="item.labelKey | translate"
      (click)="toggle(item.format)"
      (mousedown)="$event.preventDefault()"
    >
      <ignt-icon aria-hidden="true" size="sm" variant="solid" [name]="item.icon" />
    </button>
  }
</div>
<div #editorHost class="immersive-markdown-editor__content" data-testid="immersive-markdown-editor-content"></div>
