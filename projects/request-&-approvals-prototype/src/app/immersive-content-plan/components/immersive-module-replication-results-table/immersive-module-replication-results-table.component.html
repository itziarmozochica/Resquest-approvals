@for (group of groups(); track group.group) {
  <div class="immersive-module-replication-results-table__group" data-testid="immersive-module-replication-results-group">
    <h4 class="immersive-module-replication-results-table__group-title">{{ groupLabelKey(group.group) | translate }}</h4>
    <div class="immersive-module-replication-results-table__scroll" data-testid="immersive-module-replication-results-table">
      <ignt-table [data]="group.items">
        <ignt-table-column
          columnType="secondary"
          key="plan_id"
          [header]="'planEdition.immersiveContentPlan.replication.tableColumnPlanId' | translate"
        >
          <ng-template [igntTableColumnTemplateType]="group.items[0]" let-item="item">
            <span data-testid="immersive-module-replication-results-row">{{ item.plan_id }}</span>
          </ng-template>
        </ignt-table-column>
        <ignt-table-column
          columnType="secondary"
          key="outcome"
          [header]="'planEdition.immersiveContentPlan.replication.tableColumnOutcome' | translate"
        >
          <ng-template [igntTableColumnTemplateType]="group.items[0]" let-item="item">
            {{ 'planEdition.immersiveContentPlan.replication.outcome.' + item.outcome | translate }}
          </ng-template>
        </ignt-table-column>
        <ignt-table-column
          columnType="primary"
          key="detail"
          [header]="'planEdition.immersiveContentPlan.replication.tableColumnDetail' | translate"
        >
          <ng-template [igntTableColumnTemplateType]="group.items[0]" let-item="item">
            {{ detailOf(item) }}
          </ng-template>
        </ignt-table-column>
      </ignt-table>
    </div>
  </div>
}
