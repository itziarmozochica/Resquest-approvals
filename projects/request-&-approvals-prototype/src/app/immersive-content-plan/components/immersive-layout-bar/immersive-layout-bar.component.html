<ignt-wrapper-card class="immersive-layout-bar" data-testid="immersive-layout-bar">
  <div class="immersive-layout-bar__content">
    <span class="immersive-layout-bar__label">{{ 'common.language' | translate }}</span>

    <ignt-button-dropdown
      #dropdown
      align="right"
      class="immersive-layout-bar__dropdown"
      [autoWidth]="true"
      data-testid="immersive-locale-dropdown"
      [fill]="true"
      [options]="localeOptions()"
      sentiment="secondary"
      size="small"
      (optionClick)="onLocaleSelected($event); dropdown.close()"
    >
      <span class="immersive-layout-bar__trigger">
        <span class="immersive-layout-bar__trigger-label">{{ selectedLocaleLabel() }}</span>
        @if (isBaseLocale()) {
          <ignt-tag class="immersive-layout-bar__base-tag" data-testid="immersive-locale-base-tag" sentiment="sharp" variant="solid">
            {{ 'planEdition.immersiveContentPlan.baseBadge' | translate }}
          </ignt-tag>
        }
        @if (selectedLocaleMissingCount() > 0) {
          <ignt-tag
            class="immersive-layout-bar__warning-tag"
            data-testid="immersive-locale-warning-tag"
            sentiment="warning"
            variant="solid"
          >
            {{ selectedLocaleMissingCount() }}
          </ignt-tag>
        }
      </span>
    </ignt-button-dropdown>
  </div>
</ignt-wrapper-card>
