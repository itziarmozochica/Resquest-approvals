<div class="immersive-module-preview">
  <!-- Kept in the DOM after the capture arrives instead of being dropped: the two layers share one
       grid cell, so the picture cross-fades over the placeholder. Removing the skeleton on load is
       what made the swap read as a hard cut. Its pulse stops once there is nothing left to wait for. -->
  <ignt-skeleton
    class="immersive-module-preview__placeholder"
    [class.immersive-module-preview__placeholder--faded]="loaded()"
    [animation]="!failed() && !loaded()"
    [height]="previewHeight"
    type="image"
  />

  <img
    class="immersive-module-preview__image"
    [class.immersive-module-preview__image--loaded]="loaded()"
    [alt]="alt()"
    [src]="src()"
    (error)="onError()"
    (load)="onLoad()"
  />
</div>
