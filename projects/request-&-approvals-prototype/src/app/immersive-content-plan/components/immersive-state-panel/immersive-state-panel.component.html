<ignt-wrapper-card class="immersive-state-panel" data-testid="immersive-state-panel">
  <div class="immersive-state-panel__content">
    <ignt-icon class="immersive-state-panel__icon" [name]="icon()" size="display" variant="solid" [spin]="iconSpin()" aria-hidden="true" />

    <h2 class="immersive-state-panel__title">{{ title() }}</h2>

    @if (body(); as bodyText) {
      <p class="immersive-state-panel__body" data-testid="immersive-state-panel-body">{{ bodyText }}</p>
    }

    @if (secondaryBody(); as secondary) {
      <p class="immersive-state-panel__body" data-testid="immersive-state-panel-secondary-body">{{ secondary }}</p>
    }

    @if (actionLabel(); as label) {
      <div class="immersive-state-panel__actions">
        <ignt-button
          data-testid="immersive-state-panel-action"
          [disabled]="actionDisabled()"
          [label]="label"
          [loading]="actionLoading()"
          sentiment="brand"
          [variant]="actionVariant()"
          (click)="actionClick.emit()"
        />
      </div>
    }
  </div>
</ignt-wrapper-card>
