<ignt-dialog-header>Edit agreement</ignt-dialog-header>

<ignt-dialog-content>
  <form class="edit-agreement-panel__form" data-testid="edit-agreement-form" [formGroup]="form" (ngSubmit)="save()">
    <p class="edit-agreement-panel__lead">Edit metadata only. Changing the text means creating a new version.</p>

    <div class="edit-agreement-panel__field">
      <ignt-input-field
        data-testid="agreement-name-field"
        label="Name"
        [maxlength]="nameMaxLength"
        [customFormErrors]="nameErrors"
        [formControl]="form.controls.name"
      ></ignt-input-field>
    </div>

    <div class="edit-agreement-panel__field">
      <ignt-typeahead
        fieldLabel="Type"
        [editable]="false"
        container="body"
        [isInDialog]="true"
        [options]="typeOptions"
        [selectedOption]="selectedTypeOption()"
        (selected)="selectType($event)"
      ></ignt-typeahead>
    </div>

    <div class="edit-agreement-panel__note">The immutable version text and content hashes are never changed by editing metadata.</div>
  </form>
</ignt-dialog-content>

<ignt-dialog-footer class="edit-agreement-panel__footer" hideCancelButton>
  <ignt-button
    variant="tertiary"
    sentiment="neutral"
    label="Cancel"
    [disabled]="isSubmitting()"
    data-testid="edit-agreement-cancel"
    (click)="cancel()"
  />
  <ignt-button
    class="edit-agreement-panel__save"
    label="Save changes"
    [loading]="isSubmitting()"
    [disabled]="isSubmitting()"
    data-testid="edit-agreement-submit"
    (click)="save()"
  />
</ignt-dialog-footer>
