<ignt-dialog-header>New agreement</ignt-dialog-header>

<ignt-dialog-content>
  <form class="create-agreement-panel__form" data-testid="create-agreement-form" [formGroup]="form" (ngSubmit)="create()">
    <p class="create-agreement-panel__lead">Create the stable agreement concept. You will add versions and a policy next.</p>

    <div class="create-agreement-panel__field">
      <ignt-input-field
        data-testid="agreement-name-field"
        label="Name"
        placeholder="e.g. Karting Liability Waiver"
        helperText="The stable name of the agreement, not the text of any single version."
        [maxlength]="nameMaxLength"
        [customFormErrors]="nameErrors"
        [formControl]="form.controls.name"
      ></ignt-input-field>
    </div>

    <div class="create-agreement-panel__field">
      <ignt-typeahead
        fieldLabel="Type"
        [editable]="false"
        container="body"
        [isInDialog]="true"
        [options]="typeOptions"
        [selectedOption]="selectedTypeOption()"
        (selected)="selectType($event)"
      ></ignt-typeahead>
    </div>

    <div class="create-agreement-panel__field">
      <ignt-input-field
        data-testid="agreement-partner-field"
        label="Partner"
        [readonly]="true"
        [formControl]="partnerControl"
      ></ignt-input-field>
      <p class="create-agreement-panel__hint">Locked to your partner — you can only create agreements you own.</p>
    </div>

    <p class="create-agreement-panel__hint">New agreements start as a <b>Draft</b>. Publish a version to make it usable.</p>
  </form>
</ignt-dialog-content>

<ignt-dialog-footer class="create-agreement-panel__footer" hideCancelButton>
  <ignt-button
    variant="tertiary"
    sentiment="neutral"
    label="Cancel"
    [disabled]="isSubmitting()"
    data-testid="create-agreement-cancel"
    (click)="cancel()"
  />
  <ignt-button
    class="create-agreement-panel__create"
    label="Create agreement"
    [loading]="isSubmitting()"
    [disabled]="isSubmitting()"
    data-testid="create-agreement-submit"
    (click)="create()"
  />
</ignt-dialog-footer>
