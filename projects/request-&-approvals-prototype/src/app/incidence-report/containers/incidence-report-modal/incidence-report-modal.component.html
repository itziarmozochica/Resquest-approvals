<ignt-dialog-header>
  {{ 'incidenceReport.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content class="incidence-modal">
  <p class="incidence-modal__subtitle">{{ 'incidenceReport.subtitle' | translate }}</p>
  <p class="incidence-modal__required-hint">
    {{ 'incidenceReport.requiredHint' | translate }}
  </p>

  <form id="incidence-report-form" [formGroup]="form" (ngSubmit)="submit()" class="incidence-modal__form">
    <label class="incidence-modal__field">
      <span class="incidence-modal__label">
        {{ 'incidenceReport.fields.title' | translate }}
        <span class="incidence-modal__required" aria-hidden="true">*</span>
      </span>
      <input
        type="text"
        formControlName="title"
        data-testid="incidence-title"
        [maxlength]="titleMaxLength"
        [placeholder]="'incidenceReport.placeholders.title' | translate"
      />
      @if (showError('title', 'required') || showError('title', 'pattern')) {
        <span class="incidence-modal__error" data-testid="incidence-title-error">
          {{ 'incidenceReport.errors.required' | translate }}
        </span>
      }
    </label>

    <label class="incidence-modal__field">
      <span class="incidence-modal__label">
        {{ 'incidenceReport.fields.description' | translate }}
        <span class="incidence-modal__required" aria-hidden="true">*</span>
      </span>
      <textarea
        formControlName="description"
        data-testid="incidence-description"
        rows="6"
        [maxlength]="descriptionMaxLength"
        [placeholder]="'incidenceReport.placeholders.description' | translate"
      ></textarea>
      <span class="incidence-modal__counter" data-testid="incidence-description-counter">
        {{ descriptionLength() }} / {{ descriptionMaxLength }}
      </span>
      @if (showError('description', 'required') || showError('description', 'pattern')) {
        <span class="incidence-modal__error" data-testid="incidence-description-error">
          {{ 'incidenceReport.errors.required' | translate }}
        </span>
      } @else if (showError('description', 'minlength')) {
        <span class="incidence-modal__error" data-testid="incidence-description-minlength-error">
          {{ 'incidenceReport.errors.descriptionMinLength' | translate: { min: descriptionMinLength } }}
        </span>
      }
    </label>

    <label class="incidence-modal__field">
      <span class="incidence-modal__label">
        {{ 'incidenceReport.fields.category' | translate }}
        <span class="incidence-modal__required" aria-hidden="true">*</span>
      </span>
      <select formControlName="category" data-testid="incidence-category">
        <option value="" disabled>{{ 'incidenceReport.placeholders.category' | translate }}</option>
        @for (category of categories; track category) {
          <option [value]="category">{{ 'incidenceReport.categories.' + category | translate }}</option>
        }
      </select>
      @if (showError('category', 'required')) {
        <span class="incidence-modal__error" data-testid="incidence-category-error">
          {{ 'incidenceReport.errors.required' | translate }}
        </span>
      }
    </label>

    <label class="incidence-modal__field">
      <span class="incidence-modal__label">
        {{ 'incidenceReport.fields.severity' | translate }}
        <span class="incidence-modal__required" aria-hidden="true">*</span>
      </span>
      <select formControlName="severity" data-testid="incidence-severity">
        <option value="" disabled>{{ 'incidenceReport.placeholders.severity' | translate }}</option>
        @for (severity of severities; track severity) {
          <option [value]="severity">{{ 'incidenceReport.severities.' + severity | translate }}</option>
        }
      </select>
      @if (showError('severity', 'required')) {
        <span class="incidence-modal__error" data-testid="incidence-severity-error">
          {{ 'incidenceReport.errors.required' | translate }}
        </span>
      }
    </label>
  </form>
</ignt-dialog-content>

<ignt-dialog-footer>
  <button type="button" igntButton sentiment="secondary" (click)="cancel()" data-testid="incidence-cancel">
    {{ 'incidenceReport.cancel' | translate }}
  </button>
  <button
    type="submit"
    form="incidence-report-form"
    igntButton
    sentiment="primary"
    [disabled]="isSubmitting()"
    data-testid="incidence-submit"
  >
    @if (isSubmitting()) {
      {{ 'incidenceReport.submitting' | translate }}
    } @else {
      {{ 'incidenceReport.submit' | translate }}
    }
  </button>
</ignt-dialog-footer>
