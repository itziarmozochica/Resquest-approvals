<div class="programmes-wizard">
  <ignt-divider></ignt-divider>
  <div class="programmes-wizard__buttons">
    <button igntButton sentiment="secondary" type="button" class="programmes-wizard__form-actions-button" (click)="onExitClick()">
      {{ secondaryButtonText | translate }}
    </button>
    <button
      igntButton
      sentiment="primary"
      type="submit"
      class="programmes-wizard__form-actions-button"
      (click)="onContinueClick()"
      [disabled]="primaryButtonDisabled || isLoading"
      [loading]="isLoading"
    >
      {{ primaryButtonText | translate }}
    </button>
  </div>
</div>
