<div class="tabs">
  <div class="tabs__toolbar">
    <ng-container *ngIf="tabs">
      <ul class="tabs__header">
        <ng-container *ngTemplateOutlet="tabHeaderListItems || defaultTabHeaders; context: { tabs: tabs, selectTab: selectTabFn }">
        </ng-container>
        <ng-container *ngIf="showAddTabButton">
          <app-tab-header-item
            [leadingIcon]="['fal', 'plus']"
            tabHeaderId="add-tab-button"
            (tabClick)="addTab()"
            [label]="newTabTitle"
            role="button"
            class="tabs__header-item-btn"
          ></app-tab-header-item>
        </ng-container>
      </ul>
    </ng-container>
    <ng-container *ngIf="showOrderTabsButton && tabs.length >= 2">
      <button (click)="sortTabs()" class="tabs__sorting-btn">
        <fa-icon [icon]="['fal', 'list']"></fa-icon>
        {{ 'memberships.tiers.configuration.tiersOrder' | translate }}
      </button>
    </ng-container>
  </div>
  <div class="tabs-content">
    <ng-container *ngFor="let tab of tabs; trackBy: trackByTab">
      <div [class.tabs-content--visible]="tab.active" [class.tabs-content--hidden]="!tab.active">
        <ng-container *ngTemplateOutlet="tab.templateRef"></ng-container>
      </div>
    </ng-container>
  </div>
</div>

<ng-template #defaultTabHeaders>
  <app-tab-header-item
    *ngFor="let tab of tabs; trackBy: trackByTab"
    [tabHeaderId]="tab.tabId"
    [isActive]="tab.active"
    (tabClick)="selectTab(tab)"
    [label]="tab.title"
  ></app-tab-header-item>
</ng-template>
