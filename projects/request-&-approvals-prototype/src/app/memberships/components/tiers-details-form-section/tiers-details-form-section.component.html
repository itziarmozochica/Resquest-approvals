<app-form-group [subtitle]="'memberships.tiers.form.details' | translate">
  <div class="tiers-details-form-section">
    <div class="tiers-details-form-section__form-control">
      <ignt-input-field
        id="tierName"
        data-testid="tier-name-input"
        [label]="'memberships.tiers.form.name' | translate"
        formControlName="tierName"
        (blurred)="onTierNameBlur()"
        [customFormErrors]="[
          {
            type: 'required',
            message: 'form.error.required' | translate,
          },
          {
            type: 'duplicatedName',
            message: 'form.error.duplicatedName' | translate: { value: tierNameValue },
          },
          {
            type: 'minlength',
            message: 'form.error.minLength' | translate: { value: '3' },
          },
          {
            type: 'maxlength',
            message: 'form.error.maxLength' | translate: { value: '150' },
          },
        ]"
      ></ignt-input-field>
      <span class="tiers-details-form-section__form-group-item-caption">{{ 'memberships.tiers.form.nameCaptionText' | translate }}</span>
      <ignt-input-field
        id="tierDescription"
        data-testid="tier-description-input"
        [label]="'memberships.tiers.form.descriptionPlaceholderText' | translate"
        [placeholder]="'memberships.tiers.form.descriptionPlaceholderText' | translate"
        formControlName="tierDescription"
        [customFormErrors]="[
          {
            type: 'minlength',
            message: 'form.error.minLength' | translate: { value: '3' },
          },
          {
            type: 'maxlength',
            message: 'form.error.maxLength' | translate: { value: '2000' },
          },
        ]"
      ></ignt-input-field>
      <span class="tiers-details-form-section__form-group-item-caption">{{
        'memberships.tiers.form.descriptionCaptionText' | translate
      }}</span>
    </div>
  </div>
</app-form-group>
