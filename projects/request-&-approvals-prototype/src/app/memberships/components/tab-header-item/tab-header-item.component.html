<li
  class="tab-header-item"
  [class.tab-header-item--active]="isActive"
  [class.tab-header-item--fixed]="fixedPoistion"
  (click)="onClick()"
  attr.data-tab-label="{{ tabHeaderId }}"
>
  <ng-container *ngIf="leadingIcon">
    <fa-icon class="tab-header-item__leading-icon" [icon]="leadingIcon"></fa-icon>
  </ng-container>
  <span class="tab-header-item__label">{{ label }}</span>
  <ng-container *ngIf="trailingIcon">
    <fa-icon class="tab-header-item__trailing-icon" [icon]="trailingIcon"></fa-icon>
  </ng-container>
</li>
