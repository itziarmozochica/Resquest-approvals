<dialog [open]="open" class="tier-ordering-modal" *ngIf="open">
  <div class="tier-ordering-modal__container" (click)="$event.stopPropagation()">
    <div class="tier-ordering-modal__header">
      <h5 class="tier-ordering-modal__title">{{ 'memberships.tiers.orderingModal.title' | translate }}</h5>
      <button class="tier-ordering-modal__close" (click)="onCancel()">
        <fa-icon [icon]="['fas', 'times']"></fa-icon>
      </button>
    </div>

    <ignt-divider></ignt-divider>

    <div class="tier-ordering-modal__content">
      <div class="tier-ordering-modal__tiers-wrapper">
        <div class="tier-ordering-modal__header-row">
          <div class="tier-ordering-modal__header-cell tier-ordering-modal__header-cell--handle"></div>
          <div class="tier-ordering-modal__header-cell">{{ 'memberships.tiers.orderingModal.header.name' | translate }}</div>
          <div class="tier-ordering-modal__header-cell">{{ 'memberships.tiers.orderingModal.header.order' | translate }}</div>
        </div>
        <div class="tier-ordering-modal__rows" cdkDropList [cdkDropListData]="displayedTabs" (cdkDropListDropped)="onDragEnd($event)">
          <ng-container *ngFor="let tier of displayedTabs; let i = index; trackBy: trackById">
            <div class="tier-ordering-modal__row sortable-row" cdkDrag>
              <div class="tier-ordering-modal__cell tier-ordering-modal__cell--handle" cdkDragHandle>
                <span class="tier-ordering-modal__drag-handle">
                  <fa-icon [icon]="['fas', 'grip-vertical']"></fa-icon>
                </span>
              </div>
              <div class="tier-ordering-modal__cell tier-ordering-modal__label">{{ tier.label }}</div>
              <div class="tier-ordering-modal__cell tier-ordering-modal__order">{{ i + 1 }}</div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>

    <div class="tier-ordering-modal__footer">
      <button igntButton sentiment="tertiary" (click)="onCancel()" [fill]="true">Cancel</button>
      <button igntButton sentiment="primary" (click)="onSave()" [fill]="true">Save changes</button>
    </div>
  </div>
</dialog>
