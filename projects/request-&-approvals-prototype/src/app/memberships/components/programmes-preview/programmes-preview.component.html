<div class="programme-preview">
  <div class="programme-preview__header">
    <h4 class="programme-preview__header-title">{{ programme?.name }}</h4>
    <fa-icon (click)="deleteProgramme(programme.id)" class="danger" [icon]="['fas', 'trash-alt']" size="1x"></fa-icon>
    <fa-icon (click)="close()" [icon]="['fas', 'times']"></fa-icon>
  </div>

  <div class="programme-preview__content">
    <div class="wrapper-card wrapper">
      <div class="list-item__content cell--fill">
        <strong>Status</strong>
      </div>
      <div class="programme-preview__status programme-preview__status--{{ programme.status }}">
        {{ programme.status }}
      </div>
    </div>

    <fieldset class="fieldset">
      <legend>Members</legend>
    </fieldset>

    <div class="wrapper-card wrapper">
      <div class="list-item__content cell--fill">
        <strong>Total members</strong>
      </div>
      <div>
        {{ programme.members }}
      </div>
    </div>

    <div class="wrapper-card programme-preview__tiers">
      <ng-container *ngFor="let tier of programme.tiers">
        <div class="programme-preview__tiers__tier">
          <div class="list-item__content cell--fill">
            <strong>{{ tier.name }}</strong>
          </div>
          <div>{{ tier.members }}</div>
        </div>
      </ng-container>
    </div>
    <button igntButton routerLink="/memberships/programmes/{{ programme?.id }}" sentiment="secondary" disabled>
      {{ 'memberships.programmes.detail.editButton' | translate }}
    </button>
  </div>
</div>
