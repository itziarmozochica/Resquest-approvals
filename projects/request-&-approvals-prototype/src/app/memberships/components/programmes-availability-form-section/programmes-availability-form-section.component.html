<app-form-group [subtitle]="'memberships.programmes.form.availability' | translate">
  <div class="programmes-status-form-section">
    <div class="programmes-status-form-section__form-control">
      <ignt-typeahead
        id="availabilityValidityPeriod"
        data-testid="programme-availability-valitidy-period-dropdown"
        [label]="'memberships.programmes.form.availabilityValidityPeriod' | translate"
        [fieldLabel]="'memberships.programmes.form.availabilityValidityPeriodPlaceholderText' | translate"
        [options]="availabilityOptions"
        [ariaRequired]="true"
        [selectedOption]="currentAvailabilityValidityPeriod"
        (selected)="onAvailabilityValitidyPeriodChange($event)"
        [class.programmes-status-form-section__form-control--error]="errors()?.['availabilityValidityPeriod']"
      ></ignt-typeahead>

      <ng-container *ngIf="!errors()?.['availabilityValidityPeriod']">
        <span class="programmes-status-form-section__form-control-item-caption">{{
          'memberships.programmes.form.availabilityValidityPeriodCaptionText' | translate
        }}</span>
      </ng-container>

      <ng-container *ngIf="errors()?.['availabilityValidityPeriod']">
        <span class="programmes-status-form-section__form-control-item-caption-with-error">
          {{ 'form.error.required' | translate }}
        </span>
      </ng-container>
    </div>
    <div class="programmes-status-form-section__form-control">
      <ignt-typeahead
        id="availabilityStatus"
        data-testid="programme-availability-status-dropdown"
        [label]="'memberships.programmes.form.availabilityStatus' | translate"
        [fieldLabel]="'memberships.programmes.form.availabilityStatusPlaceholderText' | translate"
        [options]="statusOptions"
        [preloadedOption]="currentStatus"
        [ariaRequired]="true"
        [class.programmes-status-form-section__form-control--error]="errors()?.['availabilityStatus']"
        [selectedOption]="currentStatus"
        (selected)="onStatusChange($event)"
      ></ignt-typeahead>
      <ng-container *ngIf="!errors()?.['availabilityStatus']">
        <span class="programmes-status-form-section__form-control-item-caption">{{
          'memberships.programmes.form.availabilityStatusCaptionText' | translate
        }}</span>
      </ng-container>

      <ng-container *ngIf="errors()?.['availabilityStatus']">
        <span class="programmes-status-form-section__form-control-item-caption-with-error">
          {{ 'form.error.required' | translate }}
        </span>
      </ng-container>
    </div>
  </div>
</app-form-group>
