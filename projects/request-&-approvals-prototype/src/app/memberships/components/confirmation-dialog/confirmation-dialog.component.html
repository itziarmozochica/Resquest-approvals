<dialog [open]="isVisible" class="dialog-modal" *ngIf="isVisible" data-testid="confirmation-dialog">
  <div class="dialog-modal__container" (click)="$event.stopPropagation()">
    <div class="dialog-modal__header">
      <h5 class="dialog-modal__title">{{ title }}</h5>
      <button class="dialog-modal__close" [class.custom-style]="customStyle" (click)="dismiss()" data-testid="confirmation-close-button">
        <fa-icon [icon]="['fas', 'times']"></fa-icon>
      </button>
    </div>

    <div class="dialog-modal__content">
      <p class="dialog-modal__message">{{ message }}</p>
    </div>

    <div class="dialog-modal__footer">
      <ng-container *ngIf="cancelLabel">
        <button igntButton sentiment="tertiary" (click)="dismiss()" [fill]="true" data-testid="confirmation-cancel-button">
          {{ cancelLabel }}
        </button>
      </ng-container>
      <button
        igntButton
        [variant]="isDanger ? 'danger' : 'default'"
        sentiment="primary"
        (click)="accept()"
        [fill]="true"
        data-testid="confirmation-accept-button"
      >
        {{ acceptLabel }}
      </button>
    </div>
  </div>
</dialog>
