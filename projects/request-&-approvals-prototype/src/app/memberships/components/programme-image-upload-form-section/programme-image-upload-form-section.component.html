<app-form-group [subtitle]="'memberships.programmes.form.mediaUploadTitle' | translate">
  <app-media-guidelines-card-list
    [title]="'memberships.programmes.form.requerimentsTitle' | translate"
    [linkTemplate]="headerLinkTemplate"
    [requeriments]="[
      {
        text: 'memberships.programmes.form.mediaUpload.squareImages' | translate,
        icon: ['fal', 'draw-square'],
      },
      {
        text: 'memberships.programmes.form.mediaUpload.noCollages' | translate,
        icon: ['far', 'times-circle'],
      },
      {
        text: 'memberships.programmes.form.mediaUpload.useTemplate' | translate,
        icon: ['fal', 'th-large'],
      },
      {
        text: 'memberships.programmes.form.mediaUpload.acceptedFormats' | translate,
        icon: ['fas', 'image'],
      },
      {
        text: 'memberships.programmes.form.mediaUpload.moreImagesLater' | translate,
        icon: ['fas', 'sliders-h'],
      },
    ]"
  />
  <div class="programme-image-upload">
    <app-image-sortable-list [hasError]="hasError()" [uploadFileCallback]="uploadFileCallback" [(photos)]="photos">
    </app-image-sortable-list>
  </div>
</app-form-group>

<ng-template #headerLinkTemplate>
  <a class="plan-content-edition__link" [href]="fileTemplateUrl" target="_blank">
    <fa-icon [icon]="['far', 'file-download']"></fa-icon> {{ 'memberships.programmes.form.mediaUpload.bestPracticesLink' | translate }}
  </a>
</ng-template>
