<app-form-group [subtitle]="'memberships.tiers.form.taxConfiguration' | translate">
  <div class="tiers-tax-form-section">
    <div class="tiers-tax-form-section__form-control">
      <ignt-toggle-card
        [title]="'memberships.tiers.form.membershipTaxableValue' | translate"
        [description]="'memberships.tiers.form.amountNotExempt' | translate"
        [checked]="taxEnabled()"
        (change)="toggleTax()"
      >
      </ignt-toggle-card>
    </div>
    <div class="tiers-tax-form-section__tax-inputs">
      <div class="dropdown">
        <ignt-typeahead
          id="tierProductType"
          data-testid="tier-product-type-dropdown"
          [fieldLabel]="'memberships.tiers.form.productType' | translate"
          [options]="productTypes"
          [selectedOption]="selectedProductType || undefined"
          (selected)="onProductTypeSelected($event)"
          class="dropdown__item"
          [error]="!!productTypeErrors?.required"
        ></ignt-typeahead>
        <ng-container *ngIf="productTypeErrors?.required">
          <div class="dropdown__item-caption dropdown__item-caption--error">
            <fa-icon [icon]="['fas', 'exclamation-circle']" /> {{ 'memberships.tiers.form.productTypeError' | translate }}
          </div>
        </ng-container>
      </div>
      <ignt-input-field
        id="membershipValueAmount"
        #membershipValueInput
        data-testid="tier-membership-value-amount-input"
        type="number"
        [label]="'memberships.tiers.form.membershipValueAmount' | translate"
        formControlName="membershipValueAmount"
        [customFormErrors]="[
          {
            type: 'required',
            message: 'memberships.tiers.form.membershipValueAmountRequired' | translate,
          },
          {
            type: 'invalidAmount',
            message: 'memberships.tiers.form.membershipValueAmountInvalid' | translate,
          },
          {
            type: 'largerThanPricePoint',
            message: 'memberships.tiers.form.membershipValueLargerThanPricePoint' | translate,
          },
        ]"
      />
    </div>
  </div>
</app-form-group>

<ng-template #igntTypeHeadWithCaptionText> </ng-template>
