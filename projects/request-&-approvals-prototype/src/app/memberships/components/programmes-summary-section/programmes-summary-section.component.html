<div class="programmes-summary-section">
  <div class="programmes-summary-section__group">
    <h3 class="programmes-summary-section__group-title">
      <span (click)="toggleCollapsed(1)"
        ><fa-icon [fixedWidth]="true" [icon]="['fal', !sectionOneCollapsed() ? 'angle-down' : 'angle-right']"></fa-icon
      ></span>
      1. {{ 'memberships.programmes.form.basicInfo' | translate }}
      <a data-testid="back-basic-information" routerLink="/memberships/programmes/create/basic-information">Edit</a>
    </h3>

    <ng-container *ngIf="!sectionOneCollapsed()">
      <ignt-divider></ignt-divider>

      <div class="programmes-summary-section__item">
        <label class="field">
          <input class="field__input" type="text" [disabled]="true" [value]="programmeName" />
          <span class="field__label">{{ 'memberships.programmes.form.name' | translate }}</span>
        </label>
      </div>

      <div class="programmes-summary-section__item">
        <p class="programmes-summary-section__item-label">{{ 'memberships.programmes.form.descriptionLabel' | translate }}</p>
        <div class="programmes-summary-section__html_wrapper field__input" disabled [innerHTML]="description"></div>
      </div>

      <div class="programmes-summary-section__item">
        <label class="field">
          <input class="field__input" type="text" [disabled]="true" [value]="availabilityValidityPeriod" />
          <span class="field__label">{{ 'memberships.programmes.form.availabilityValidityPeriod' | translate }}</span>
        </label>
      </div>

      <div class="programmes-summary-section__item">
        <label class="field">
          <input class="field__input" type="text" [disabled]="true" [value]="availabilityStatus" />
          <span class="field__label">{{ 'memberships.programmes.form.availabilityStatus' | translate }}</span>
        </label>
      </div>
    </ng-container>
  </div>
  <div class="programmes-summary-section__group">
    <h3 class="programmes-summary-section__group-title">
      <span (click)="toggleCollapsed(2)"
        ><fa-icon [fixedWidth]="true" [icon]="['fal', !sectionTwoCollapsed() ? 'angle-down' : 'angle-right']"></fa-icon
      ></span>
      2. {{ 'memberships.tiers.form.tiersCreation' | translate }}
      <a data-testid="back-tier-configuration" routerLink="/memberships/programmes/create/tier-configuration">Edit</a>
    </h3>

    <ng-container *ngIf="!sectionTwoCollapsed()">
      <ignt-divider></ignt-divider>

      <app-tabs [showAddTabButton]="false" [showOrderTabsButton]="false">
        <app-tab-item *ngFor="let tier of programme.tiers; let first = first" [tabId]="tier.name" [title]="tier.name" [active]="first">
          <div class="programmes-summary-section__item">
            <label class="field">
              <input class="field__input" type="text" [disabled]="true" [value]="tier.name" />
              <span class="field__label">{{ 'memberships.tiers.form.name' | translate }}</span>
            </label>
          </div>

          <div class="programmes-summary-section__item">
            <p class="programmes-summary-section__item-label">{{ 'memberships.programmes.form.descriptionLabel' | translate }}</p>
            <div class="programmes-summary-section__html_wrapper field__input" disabled [innerHTML]="tier.description"></div>
          </div>

          <div class="programmes-summary-section__item">
            <label class="field">
              <input class="field__input" type="text" [disabled]="true" [value]="getTierStatus(tier)" />
              <span class="field__label">{{ 'memberships.programmes.form.availabilityStatus' | translate }}</span>
            </label>
          </div>

          <div class="programmes-summary-section__item">
            <p class="programmes-summary-section__item-label">Benefits</p>
            <p class="programmes-summary-section__item-text" *ngFor="let tierBenefit of getTierBenefits(tier)">{{ tierBenefit }}</p>
          </div>
        </app-tab-item>
      </app-tabs>
    </ng-container>
  </div>
  <app-programmes-wizard-form-actions
    (exitClick)="goBackToTiersCreation()"
    (continueClick)="createProgramme()"
    secondaryButtonText="memberships.programmes.form.summary.backToTiersCreation"
    primaryButtonText="memberships.programmes.form.summary.createMembership"
    [isLoading]="isLoading()"
  ></app-programmes-wizard-form-actions>
</div>
