<app-form-group [subtitle]="'memberships.tiers.form.availability' | translate">
  <div class="tiers-status-form-section">
    <div class="tiers-status-form-section__form-control">
      <ignt-typeahead
        id="availabilityStatus"
        data-testid="tier-availability-status-dropdown"
        [emptyLabel]="'memberships.tiers.form.availabilityStatus' | translate"
        [fieldLabel]="'memberships.tiers.form.availabilityStatusPlaceholderText' | translate"
        [options]="statusOptions"
        [preloadedOption]="currentStatus"
        (selected)="onStatusChange($event)"
        [disabled]="disabled"
      ></ignt-typeahead>
    </div>
  </div>
</app-form-group>
