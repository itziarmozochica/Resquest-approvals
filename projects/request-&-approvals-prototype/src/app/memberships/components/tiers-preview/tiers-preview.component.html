<div class="tier-detail">
  <div class="tier-detail__header">
    <h4 class="tier-detail__header-title">{{ tier?.name }}</h4>
    <fa-icon (click)="deleteTier()" class="danger" [icon]="['fas', 'trash-alt']" [size]="'1x'"></fa-icon>
    <fa-icon (click)="closePreview()" [icon]="['fas', 'times']"></fa-icon>
  </div>
  <div class="tier-detail__content">
    <fieldset class="fieldset">
      <div class="wrapper-card wrapper">
        <ul class="group-list">
          <li class="group-list__item list-item">
            <div class="list-item__content cell--fill">
              <div class="list-item__label">
                <strong>Status</strong>
              </div>
              <div class="list-item__supporting-text">Inactive / Active</div>
            </div>
            <div class="cell--hug cell--hug--align-center">
              <div class="tier-detail__status-container">
                <span class="status status--{{ tier.status }}">{{ tier.status }}</span>
                <ignt-toggle [checked]="tier.status === TierStatusEnum.ACTIVE" (change)="toggleStatus($event)"></ignt-toggle>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset__legend">Associated Membership</legend>
      <div class="wrapper-card wrapper">
        <ul class="group-list">
          <li class="group-list__item list-item">
            <div class="list-item__content cell--fill">
              <div class="list-item__label">
                <strong>{{ tier.programme.name }}</strong>
              </div>
            </div>
            <div class="cell--hug">
              {{ tier.members }}
            </div>
          </li>
        </ul>
      </div>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset__legend">Price points</legend>
      <div class="wrapper-card wrapper">
        <ul class="group-list">
          <ng-container *ngFor="let pricePoint of tier.pricePoints">
            <li class="group-list__item list-item">
              <div class="list-item__content cell--fill">
                <div class="list-item__label">
                  <strong>{{ pricePoint.name }}</strong>
                </div>
              </div>
              <div class="cell--hug">${{ pricePoint.amount }}</div>
            </li>
          </ng-container>
        </ul>
      </div>
    </fieldset>
    <button igntButton routerLink="/memberships/tiers/{{ tier?.id }}" sentiment="secondary" disabled>
      {{ 'memberships.tiers.detail.editButton' | translate }}
    </button>
  </div>
</div>
