<div class="programmes-details-form-section__form-group">
  <h2 class="programmes-details-form-section__form-group-title">{{ 'memberships.programmes.form.basicInfo' | translate }}</h2>

  <h3 class="programmes-details-form-section__form-group-item-title">
    {{ 'memberships.programmes.form.basicInfoDetails' | translate }}
  </h3>
  <div class="programmes-details-form-section__form-group-item">
    <ignt-input-field
      id="programmeName"
      data-testid="programme-name-input"
      [ariaRequired]="true"
      [label]="'memberships.programmes.form.name' | translate"
      formControlName="programmeName"
      [customFormErrors]="[
        {
          type: 'required',
          message: 'form.error.required' | translate,
        },
        {
          type: 'minlength',
          message: 'form.error.minLength' | translate: { value: '3' },
        },
        {
          type: 'maxlength',
          message: 'form.error.maxLength' | translate: { value: '150' },
        },
      ]"
    ></ignt-input-field>
    <span class="programmes-details-form-section__form-group-item-caption">{{
      'memberships.programmes.form.nameCaptionText' | translate
    }}</span>
    <ignt-rich-text-editor
      formControlName="description"
      class="rich-text-editor"
      data-testid="programme-description-editor"
      [features]="INLINE_LINK_LISTS_ALIGN_FEATURES"
      [blockElement]="'p'"
      [placeholder]="'memberships.programmes.form.descriptionPlaceholderText' | translate"
    ></ignt-rich-text-editor>
    <span class="programmes-details-form-section__form-group-item-caption">{{
      'memberships.programmes.form.descriptionCaptionText' | translate
    }}</span>
  </div>
</div>
