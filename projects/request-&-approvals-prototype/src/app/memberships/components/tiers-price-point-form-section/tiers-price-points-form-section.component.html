<app-form-group subtitle="{{ 'memberships.tiers.form.pricePoints' | translate }}">
  <div class="fz-widget-pane-content" content>
    <div class="form">
      <div class="form__input-row">
        <ignt-input-field
          data-testid="name-input"
          helperText="{{ 'memberships.tiers.form.pricePointsNameCaptionText' | translate }}"
          label="{{ 'memberships.tiers.form.pricePointsNameLabelText' | translate }}"
          formControlName="pricePointName"
          type="text"
          placeholder="{{ 'memberships.tiers.form.pricePointsNamePlaceholderText' | translate }}"
          [customFormErrors]="[
            {
              type: 'invalidValue',
              message: 'memberships.tiers.form.pricePointsNameErrorMessage' | translate,
            },
          ]"
        />
        <ignt-input-field
          data-testid="price-input"
          helperText="{{ 'memberships.tiers.form.pricePointsAmountCaptionText' | translate }}"
          label="{{ 'memberships.tiers.form.pricePointsAmountLabelText' | translate }}"
          formControlName="pricePointAmount"
          type="number"
          placeholder="{{ 'memberships.tiers.form.pricePointsAmountPlaceholderText' | translate }}"
          [customFormErrors]="[
            {
              type: 'invalidValue',
              message: 'memberships.tiers.form.pricePointsAmountErrorMessage' | translate,
            },
          ]"
        >
        </ignt-input-field>
      </div>
      <div class="form__link">
        <a igntLink (click)="addPricePoint()">{{ 'memberships.tiers.form.pricePointsAdd' | translate }}</a>
      </div>
    </div>

    @if (pricePointsError) {
      <ignt-alert
        sentiment="danger"
        [title]="'memberships.tiers.form.pricePointErrorTitle' | translate"
        [description]="'memberships.tiers.form.pricePointErrorDescription' | translate"
      />
    }

    <ul class="list">
      <li *ngFor="let point of pricePoints(); trackBy: trackById" class="list__item">
        <div class="list__item-content">
          <span class="list__item-content_name">{{ point.name }}</span>
          <span class="list__item-content-price">{{ point.amount | currency: currency() : 'symbol' : null : locale }}</span>
        </div>
        <fa-icon (click)="deletePricePoint(point.id)" class="list__item-delete-icon" [icon]="['fas', 'trash-alt']" size="1x"> </fa-icon>
      </li>
    </ul>
  </div>
</app-form-group>
