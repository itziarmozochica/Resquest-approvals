<app-form-group [subtitle]="'memberships.tiers.form.benefits' | translate">
  <div class="tiers-benefits-form-section">
    <div class="tiers-benefits-form-section__form-control">
      <app-multi-select
        data-testid="tier-benefit-dropdown"
        [showItemsDescriptions]="true"
        [displayInPlaceMaximum]="2"
        [placeholder]="'memberships.tiers.form.benefitsPlaceholderText' | translate"
        [options]="benefitsOptions"
        [selectedOptions]="selectedBenefits"
        (selected)="onBenefitsChange($event)"
        [class.tiers-benefits-form-section__form-control--error]="benefitsError()"
        [errorMessage]="benefitsError() ? ('memberships.tiers.form.benefitsCaptionText' | translate) : null"
      ></app-multi-select>
    </div>

    <ul class="list">
      <li *ngFor="let benefit of selectedBenefits" class="list__item">
        <div class="list__item-content">
          <span class="list__item-content_name">{{ benefit.title }}</span>
        </div>
        <fa-icon (click)="deleteBenefit(benefit)" class="list__item-delete-icon" [icon]="['fas', 'trash-alt']" size="1x"> </fa-icon>
      </li>
    </ul>
  </div>
</app-form-group>
