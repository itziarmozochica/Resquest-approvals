<div class="tiers-form">
  <form [formGroup]="formGroup" (ngSubmit)="onSubmitForm()">
    <app-tiers-details-form-section (tierNameBlur)="onTierNameBlur()"></app-tiers-details-form-section>
    <app-tiers-benefits-form-section [benefitsOptions]="benefitsOptions()"></app-tiers-benefits-form-section>
    <app-tiers-availability-form-section [disabled]="availabilityDisabled()"></app-tiers-availability-form-section>
    <app-tiers-price-points-form-section></app-tiers-price-points-form-section>
    <app-tiers-tax-form-section [productTypes]="productTypes()"></app-tiers-tax-form-section>
    <app-programmes-wizard-form-actions
      [primaryButtonText]="'memberships.tiers.form.continueToSummary' | translate"
      [secondaryButtonText]="'memberships.tiers.form.backToBasicInformation' | translate"
      (exitClick)="goBackToBasicInformation()"
    >
    </app-programmes-wizard-form-actions>
  </form>
</div>
