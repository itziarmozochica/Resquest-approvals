<div class="programmes-form">
  <form [formGroup]="formGroup" (ngSubmit)="onSubmitForm()">
    <app-programmes-details-form-section></app-programmes-details-form-section>
    <app-programme-image-upload-form-section></app-programme-image-upload-form-section>
    <app-programmes-availability-form-section

      [statusOptions]="statusOptions"

  </form>
</div>
