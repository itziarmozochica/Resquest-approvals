<div class="membership-connect-copy-value">
  <span class="membership-connect-copy-value__label" data-testid="membership-connect-copy-value-label">{{ label() }}</span>
  <div class="membership-connect-copy-value__row">
    <code class="membership-connect-copy-value__value" data-testid="membership-connect-copy-value-value">{{ value() }}</code>
    <ignt-button
      data-testid="membership-connect-copy-value-button"
      sentiment="neutral"
      size="small"
      variant="secondary"
      [ariaLabel]="copy.redirectUri.copyAriaLabel(label())"
      [label]="copy.redirectUri.copy"
      (click)="onCopy()"
    />
  </div>
  <p aria-live="polite" class="membership-connect-copy-value__status" data-testid="membership-connect-copy-value-status">
    @switch (status()) {
      @case (copyStatus.COPIED) {
        {{ copy.redirectUri.copied }}
      }
      @case (copyStatus.FAILED) {
        {{ copy.redirectUri.copyFailed }}
      }
    }
  </p>
</div>
