<fieldset class="membership-connection-provider-picker" data-testid="membership-connection-provider-picker">
  <legend class="membership-connection-provider-picker__legend">
    {{ copy.providerLegend }}
  </legend>

  <div class="membership-connection-provider-picker__options">
    @for (provider of providers(); track provider.key) {
      <!--
        `dataTestId` lands on the `<input>`, which the design system renders `display: none`, so it can
        be asserted but never clicked. The host carries its own id for the click.
      -->
      <ignt-radio
        class="membership-connection-provider-picker__option"
        name="membership-connection-provider"
        [attr.data-testid]="'membership-connection-provider-option-' + provider.key"
        [checked]="provider.key === selectedKey()"
        [dataTestId]="'membership-connection-provider-' + provider.key"
        [disabled]="isDisabled()"
        [label]="providerName(provider.key)"
        [value]="provider.key"
        (change)="onSelect(provider.key)"
      />
    }
  </div>
</fieldset>
