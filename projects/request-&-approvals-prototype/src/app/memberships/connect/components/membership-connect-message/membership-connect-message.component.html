<ignt-alert class="membership-connect-message" data-testid="membership-connect-message" [sentiment]="alertSentiment()">
  <ng-template #igntAlertContent>
    <h2 #messageTitle class="membership-connect-message__title" data-testid="membership-connect-message-title" tabindex="-1">
      {{ title() }}
    </h2>
    <div class="membership-connect-message__text" data-testid="membership-connect-message-text" [attr.role]="role()">
      <p class="membership-connect-message__body" data-testid="membership-connect-message-body">{{ body() }}</p>
      @if (hint(); as hint) {
        <p class="membership-connect-message__hint" data-testid="membership-connect-message-hint">{{ hint }}</p>
      }
    </div>
  </ng-template>
</ignt-alert>
