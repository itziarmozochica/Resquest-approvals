<div class="bundle-setup-step">
  <section class="bundle-setup-step__card">
    <h2 class="bundle-setup-step__card-title" data-testid="card-title">
      {{ 'onsiteAppearance.bundleDetail.bundleSetup.cardTitle' | translate }}
    </h2>

    <ignt-input-field
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      [label]="'onsiteAppearance.bundleDetail.bundleSetup.nameLabel' | translate"
      data-testid="bundle-name-input"
    ></ignt-input-field>

    <ignt-accordion variant="plain">
      <ignt-accordion-item
        [expanded]="true"
        [label]="'onsiteAppearance.bundleDetail.bundleSetup.componentsTitle' | translate"
        data-testid="components-accordion"
      >
        <p class="bundle-setup-step__components-subtitle">
          {{ 'onsiteAppearance.bundleDetail.bundleSetup.componentsSubtitle' | translate }}
        </p>
        <ul class="bundle-setup-step__components">
          <li class="bundle-setup-step__component-item" data-testid="component-printed-tickets">
            <ignt-checkbox
              [ngModel]="printedTickets()"
              (ngModelChange)="printedTickets.set($event)"
              [label]="'onsiteAppearance.bundleDetail.bundleSetup.oboTicketsComponent' | translate"
            ></ignt-checkbox>
          </li>
        </ul>
      </ignt-accordion-item>
    </ignt-accordion>
  </section>
</div>
