<footer class="step-action-bar">
  <ignt-button
    variant="secondary"
    sentiment="danger"
    [label]="'common.cancel' | translate"
    (click)="cancelled.emit()"
    data-testid="step-cancel-btn"
  ></ignt-button>

  <div class="step-action-bar__forward">
    @if (showBack()) {
      <ignt-button
        variant="secondary"
        sentiment="neutral"
        [label]="'onsiteAppearance.bundleDetail.back' | translate"
        (click)="back.emit()"
        data-testid="step-back-btn"
      ></ignt-button>
    }
    <ignt-button
      variant="primary"
      sentiment="brand"
      [disabled]="primaryDisabled()"
      [label]="primaryLabel()"
      (click)="confirmed.emit()"
      data-testid="step-primary-btn"
    ></ignt-button>
  </div>
</footer>
