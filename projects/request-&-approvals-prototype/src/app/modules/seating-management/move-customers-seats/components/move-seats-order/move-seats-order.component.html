<div class="move-seats-order">
  <app-move-seats-accordion class="move-seats-accordion--nested">
    @for (ticket of order().tickets; track ticket.ticketId) {
      <app-move-seats-accordion-item
        [itemId]="'ticket-' + ticket.ticketId"
        [labelHeader]="('common.ticket' | translate) + ' #' + ticket.ticketId"
        [isOpened]="true"
      >
        <app-move-seats-ticket
          (displayStaffNoteToastAfterSeatChange)="displayStaffNoteToastAfterSeatChange.emit()"
          [eventKey]="eventKey()"
          [secretKey]="secretKey()"
          [ticket]="ticket"
        />
      </app-move-seats-accordion-item>
    }
  </app-move-seats-accordion>
</div>
