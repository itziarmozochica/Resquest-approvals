<cdk-accordion class="move-seats-accordion" [multi]="true" data-testid="move-seats-accordion">
  @for (accordionItem of accordionItems(); track accordionItem) {
    <cdk-accordion-item
      #item="cdkAccordionItem"
      [attr.id]="accordionItem.itemId() || null"
      [expanded]="accordionItem.isOpened()"
      class="move-seats-accordion__item"
      data-testid="move-seats-accordion-item"
    >
      <div
        class="move-seats-accordion__header"
        role="button"
        tabindex="0"
        data-testid="move-seats-accordion-header"
        [attr.aria-expanded]="item.expanded"
        [attr.aria-controls]="'accordion-body-' + $index"
        (click)="item.toggle()"
        (keydown.enter)="item.toggle()"
        (keydown.space)="item.toggle(); $event.preventDefault()"
      >
        <fa-icon [icon]="['fal', item.expanded ? 'angle-down' : 'angle-right']" class="move-seats-accordion__icon"></fa-icon>
        <span class="move-seats-accordion__label" data-testid="move-seats-accordion-label">{{ accordionItem.labelHeader() }}</span>
        @if (accordionItem.headerActionLabel().length > 0) {
          <a
            class="move-seats-accordion__header-action"
            data-testid="move-seats-accordion-header-action"
            role="link"
            tabindex="0"
            (click)="accordionItem.headerAction.emit($event); $event.stopPropagation()"
            (keydown.enter)="accordionItem.headerAction.emit($event); $event.stopPropagation()"
          >
            {{ accordionItem.headerActionLabel() }}
          </a>
        }
      </div>
      <div
        class="move-seats-accordion__body"
        role="region"
        data-testid="move-seats-accordion-body"
        [attr.id]="'accordion-body-' + $index"
        [style.display]="item.expanded ? '' : 'none'"
      >
        <ng-container [ngTemplateOutlet]="accordionItem.template()"></ng-container>
      </div>
    </cdk-accordion-item>
  }
</cdk-accordion>
