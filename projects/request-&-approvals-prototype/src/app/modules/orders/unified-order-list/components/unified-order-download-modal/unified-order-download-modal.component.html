<ignt-dialog-header>{{ 'orders.download.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <p class="unified-order-download-modal__description">{{ 'orders.download.downloadOptionsDescription' | translate }}</p>

  <div class="unified-order-download-modal__options">
    <ignt-checkbox
      data-testid="unified-order-download-booking-answers"
      [label]="'orders.download.includeBookingAnswers' | translate"
      [checked]="includeBookingAnswers()"
      (change)="includeBookingAnswers.set($event)"
    />
    <ignt-checkbox
      data-testid="unified-order-download-staff-notes"
      [label]="'orders.download.includeStaffNotes' | translate"
      [checked]="includeStaffNotes()"
      (change)="includeStaffNotes.set($event)"
    />
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button variant="tertiary" data-testid="unified-order-download-cancel" [label]="'common.cancel' | translate" (click)="cancel()" />
  <ignt-button data-testid="unified-order-download-accept" [label]="'common.accept' | translate" (click)="accept()" />
</ignt-dialog-footer>
