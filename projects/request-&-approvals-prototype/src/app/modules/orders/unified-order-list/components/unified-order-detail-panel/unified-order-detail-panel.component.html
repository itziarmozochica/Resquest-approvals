<ignt-dialog-header>{{ titleKey | translate: { orderId: data.order.orderId } }}</ignt-dialog-header>

<ignt-dialog-content>
  @if (data.kind === 'seats') {
    <app-order-seat-list-panel [seats]="data.order.seats" (closePanel)="close()" />
  } @else {
    <app-order-ticket-breakdown-panel [loadState]="loadState()" [tickets]="tickets()" (retryLoad)="loadTickets()" (closePanel)="close()" />
  }
</ignt-dialog-content>
