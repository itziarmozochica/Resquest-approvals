<div class="unified-order-search">
  <ignt-typeahead
    class="unified-order-search__category"
    data-testid="unified-order-search-category"
    [fieldLabel]="'orders.search.category' | translate"
    [options]="categoryOptions()"
    [selectedOption]="selectedOption()"
    [editable]="false"
    [disabled]="disabled()"
    (selected)="changeCategory($event)"
  />

  <div
    class="unified-order-search__field"
    (focusin)="showRecentSearches()"
    (focusout)="hideRecentSearchesOnBlur($event)"
    (keydown)="handleFieldKeydown($event)"
  >
    <ignt-input-field
      class="unified-order-search__input"
      data-testid="unified-order-search-input"
      [id]="'unified-order-search'"
      type="text"
      [label]="placeholderKey() | translate"
      [placeholder]="placeholderKey() | translate"
      [leadIcon]="['far', 'search']"
      [maxlength]="maxLength()"
      [helperText]="invalid() ? ('orders.search.invalidValue' | translate) : ''"
      [disabled]="disabled()"
      [ngModel]="value()"
      (input)="correctInput($event)"
      (ngModelChange)="changeValue($event)"
      (keyup.enter)="submit()"
    />

    @if (recentSearchesVisible() && visibleRecentSearches().length > 0) {
      <app-recent-searches-dropdown
        data-testid="unified-order-search-recent"
        [searches]="visibleRecentSearches()"
        [query]="value()"
        (selected)="selectRecentSearch($event)"
        (removed)="removeRecentSearch($event)"
        (cleared)="clearRecentSearches()"
      />
    }
  </div>

  @if (isCodeCategory()) {
    <button
      type="button"
      ignt-icon-button
      variant="sharp"
      sentiment="tertiary"
      size="small"
      data-testid="unified-order-search-scan"
      [icon]="['fas', 'qrcode']"
      [attr.aria-label]="'orders.search.scanQr' | translate"
      [disabled]="disabled()"
      (click)="openScanner()"
    ></button>
  }

  @if (value().length > 0) {
    <button
      type="button"
      ignt-icon-button
      variant="sharp"
      sentiment="tertiary"
      size="small"
      data-testid="unified-order-search-clear"
      [icon]="['fas', 'times']"
      [attr.aria-label]="'orders.search.clear' | translate"
      (click)="clear()"
    ></button>
  }
</div>
