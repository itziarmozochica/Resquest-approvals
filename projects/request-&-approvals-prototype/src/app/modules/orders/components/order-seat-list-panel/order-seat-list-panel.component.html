<div class="order-seat-list-panel">
  <div class="order-seat-list-panel__search">
    <ignt-icon aria-hidden="true" class="order-seat-list-panel__search-icon" name="search" variant="regular"></ignt-icon>
    <input
      class="order-seat-list-panel__search-input"
      type="text"
      [attr.aria-label]="'orders.seatListPanel.searchPlaceholder' | translate"
      [placeholder]="'orders.seatListPanel.searchPlaceholder' | translate"
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
    />
  </div>

  <div class="order-seat-list-panel__table-header">
    <span>{{ 'orders.seatListPanel.seatsColumn' | translate }}</span>
  </div>

  <ul class="order-seat-list-panel__seat-list">
    @for (seat of filteredSeats(); track $index) {
      <li class="order-seat-list-panel__seat-item">
        <span class="order-seat-list-panel__seat-name">{{ seat }}</span>
      </li>
    }
  </ul>

  <div class="order-seat-list-panel__footer">
    <button
      igntButton
      type="button"
      sentiment="primary"
      data-testid="order-seat-list-panel-close"
      [fill]="true"
      (click)="closePanel.emit()"
    >
      {{ 'orders.seatListPanel.close' | translate }}
    </button>
  </div>
</div>
