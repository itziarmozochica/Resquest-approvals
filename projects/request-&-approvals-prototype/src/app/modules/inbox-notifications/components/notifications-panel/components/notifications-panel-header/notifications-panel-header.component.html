<div class="notifications-panel-header__brand">
  <app-ai-sparkle-icon class="notifications-panel-header__icon" size="medium" aria-hidden="true" />
  <span class="notifications-panel-header__title">{{ 'notifications.title' | translate }}</span>
</div>

<button
  type="button"
  ignt-icon-button
  variant="sharp"
  sentiment="tertiary"
  [icon]="['fas', 'times']"
  [attr.aria-label]="'notifications.close' | translate"
  (click)="close.emit()"
></button>
