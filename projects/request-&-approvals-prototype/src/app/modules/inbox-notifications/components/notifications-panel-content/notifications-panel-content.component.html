<app-notifications-panel-header (close)="onClose()" />

<div class="notifications-panel-content__middle">
  <div class="notifications-panel-content__count" [class.notifications-panel-content__count--raised]="!scrollEdges().atTop">
    {{ 'notifications.newCount' | translate: { count: unreadCount() } }}
  </div>

  <app-notifications-list
    [notifications]="notifications()"
    [isLoading]="isLoading()"
    [isLoadingMore]="isLoadingMore()"
    [error]="error()"
    [hasMore]="hasMore()"
    [edgeHints]="true"
    (loadMore)="onLoadMore()"
    (retry)="onRetry()"
    (openAssistant)="onOpenAssistant($event.notification, $event.position)"
    (scrollEdges)="onScrollEdges($event)"
  />

  @if (scrollEdges().moreBelow) {
    <div class="notifications-panel-content__more-below" aria-hidden="true">↓ {{ 'notifications.moreBelow' | translate }}</div>
  }
</div>

<app-notifications-panel-footer (viewAll)="onViewAll()" />
