<span class="notifications-button">
  @if (hasUnread()) {
    <span class="notifications-button__count" aria-hidden="true" data-testid="notifications-badge">
      {{ unreadCountDisplay() }}
    </span>
  }

    type="button"

    [attr.aria-label]="'notifications.openNotifications' | translate"
    data-testid="notifications-button"

      />
      <defs>
        <linearGradient
          id="notifications-button-sparkle-gradient"
          x1="20.75"
          y1="3.75"
          x2="28.3462"
          y2="11.3462"
          gradientUnits="userSpaceOnUse"
        >
          <stop stop-color="#73BFF6" />
          <stop offset="0.5" stop-color="#0079CA" />

  <span class="visually-hidden" aria-live="polite" aria-atomic="true">
    {{ 'notifications.unreadCount' | translate: { count: unreadCount() } }}
  </span>
</span>
