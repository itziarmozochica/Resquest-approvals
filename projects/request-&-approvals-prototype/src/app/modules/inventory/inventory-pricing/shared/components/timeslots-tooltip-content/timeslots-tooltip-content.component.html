<div class="timeslots-tooltip-content">
  <ng-container *ngFor="let timeslot of timeslots">
    <p
      [innerHTML]="
        ('sessions.pricing.priceListsOverview.timeslotValueTooltip.dates'
          | translate
            : {
                dateFrom: timeslot.startDate,
                dateTo: timeslot.endDate,
              }) +
        '<br>' +
        ('sessions.pricing.priceListsOverview.timeslotValueTooltip.weekDays'
          | translate
            : {
                daysList: timeslot.weekdays | weekDays,
              }) +
        '<br>' +
        ('sessions.pricing.priceListsOverview.timeslotValueTooltip.time'
          | translate
            : {
                timeFrom: timeslot.startTime,
                timeTo: timeslot.endTime,
              })
      "
    ></p>
  </ng-container>
</div>
