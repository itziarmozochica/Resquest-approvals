<div class="preview-breakdown-box" data-testid="preview-breakdown-box">
  <div class="preview-breakdown-box__header">
    @if (showInfoIcon()) {
      <fa-icon class="preview-breakdown-box__icon" [icon]="['fas', 'info-circle']" [attr.aria-hidden]="true"></fa-icon>
    }
    <span class="preview-breakdown-box__title">{{ title() }}</span>
  </div>
  <div class="preview-breakdown-box__body">
    @for (row of rows(); track $index) {
      <div class="preview-breakdown-box__row" data-testid="preview-breakdown-box-row">
        <span class="preview-breakdown-box__label">{{ row.label }}</span>
        <span class="preview-breakdown-box__value">{{ row.amount | currency: currency() }}</span>
      </div>
    }
    @if (footer(); as footerRow) {
      <div class="preview-breakdown-box__divider"></div>
      <div class="preview-breakdown-box__row preview-breakdown-box__row--footer" data-testid="preview-breakdown-box-footer">
        <span class="preview-breakdown-box__label">{{ footerRow.label }}</span>
        <span class="preview-breakdown-box__value">{{ footerRow.amount | currency: currency() }}</span>
      </div>
    }
  </div>
</div>
