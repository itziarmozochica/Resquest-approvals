<ignt-alert data-testid="dependents-impact-notice" sentiment="warning">
  <ng-template #igntAlertContent>
    <p class="dependents-impact-notice__title" data-testid="dependents-impact-notice-title">
      {{ titleKey() | translate: { count: dependents().length } }}
    </p>
    <ul class="dependents-impact-notice__list">
      @for (dependent of dependents(); track dependent.id) {
        <li class="dependents-impact-notice__item" data-testid="dependents-impact-notice-item">
          <span>{{ dependent.label }}</span>
        </li>
      }
    </ul>
  </ng-template>
</ignt-alert>
