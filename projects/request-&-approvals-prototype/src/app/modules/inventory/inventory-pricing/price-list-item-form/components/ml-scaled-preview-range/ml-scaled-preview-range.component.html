<div class="ml-scaled-preview-range" data-testid="ml-scaled-preview-range">
  <p class="ml-scaled-preview-range__title">
    {{ 'sessions.pricing.priceList.priceEditForm.mlScaledPreview.title' | translate }}
  </p>
  <p
    class="ml-scaled-preview-range__text"
    data-testid="ml-scaled-preview-range-text"
    [innerHTML]="
      rangeKey()
        | translate
          : {
              basePrice: range().basePrice | currency: currency(),
              maxPrice: range().maxPrice | currency: currency(),
              minPrice: range().minPrice | currency: currency(),
            }
    "
  ></p>
  <p class="ml-scaled-preview-range__hint">
    {{ taxKey() | translate }}
    {{ 'sessions.pricing.priceList.priceEditForm.mlScaledPreview.baseFallback' | translate }}
  </p>
</div>
