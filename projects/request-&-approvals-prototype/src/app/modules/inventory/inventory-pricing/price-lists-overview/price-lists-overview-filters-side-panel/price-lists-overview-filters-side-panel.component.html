<ignt-dialog-header focusCloseButton>{{ 'common.filter.label' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="price-lists-overview-filters-side-panel">
    <app-multi-select
      [disabled]="nameOptions().length === 0"
      [options]="nameOptions()"
      [selectedOptions]="selectedNameOptions()"
      [placeholder]="'sessions.pricing.priceListsOverview.priceListNameFilter' | translate"
      [displayInPlaceMaximum]="2"
      (selected)="onFilterOptionsChange($event, 'names', 'title')"
      data-testid="session-pricing-multi-select-price-list-names"
    ></app-multi-select>
    <app-multi-select
      [disabled]="channelOptions().length === 0"
      [options]="channelOptions()"
      [selectedOptions]="selectedChannelOptions()"
      [placeholder]="'sessions.pricing.newListForm.channels.multiSelectPlaceholder' | translate"
      [displayInPlaceMaximum]="2"
      (selected)="onFilterOptionsChange($event, 'channels', 'title')"
      data-testid="session-pricing-multi-select-channels"
    ></app-multi-select>
    <app-multi-select
      [options]="statusOptions"
      [selectedOptions]="selectedStatusOptions()"
      [placeholder]="'sessions.pricing.priceListsOverview.status' | translate"
      [displayInPlaceMaximum]="2"
      (selected)="onFilterOptionsChange($event, 'status')"
      data-testid="session-pricing-multi-select-status"
    ></app-multi-select>
    @if (data.showSessionTypeCategory) {
      <app-multi-select
        [defaultOrdering]="false"
        [maxSelectedOptions]="1"
        [options]="sessionTypeCategoryOptions"
        [selectedOptions]="selectedSessionTypeCategoryOptions()"
        [placeholder]="'sessions.pricing.priceListsOverview.sessionTypeCategoryFilter' | translate"
        [displayInPlaceMaximum]="2"
        (selected)="onFilterOptionsChange($event, 'sessionTypeCategories')"
        data-testid="session-pricing-multi-select-session-type-category"
      ></app-multi-select>
      <ignt-checkbox
        dataTestId="price-lists-overview-include-archived-ticket-types"
        [checked]="draft().filters.includeArchivedTicketTypes"
        [label]="'sessions.pricing.priceListsOverview.showArchivedTicketTypes' | translate"
        size="small"
        (change)="onIncludeArchivedTicketTypesChange($event)"
      ></ignt-checkbox>
    }
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    variant="secondary"
    data-testid="price-lists-overview-filters-clear"
    [label]="'common.filter.clear' | translate"
    (click)="clearFilters()"
  />
  <ignt-button data-testid="price-lists-overview-filters-apply" [label]="'common.filter.apply' | translate" (click)="apply()" />
</ignt-dialog-footer>
