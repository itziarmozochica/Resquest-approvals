<app-search-result-view
  data-testid="price-list-overview-list-results"
  [noResultMessage]="'sessions.pricing.priceListsOverview.noResults' | translate"
  [noResultIcon]="['far', 'receipt']"
  [noFiltersMessage]="'sessions.pricing.priceListsOverview.noFilterSelected' | translate"
  [noFiltersIcon]="['far', 'sort-alt']"
  [errorMessage]="'sessions.pricing.priceListsOverview.errorMessage' | translate"
  [currentState]="searchResultStatus()"
>
  <ng-container *ngIf="isReSortPriorityActive() && canModifyPriceLists()">
    <app-price-list-sorting-banner
      data-testid="price-list-overview-sorting-banner"
      [isSavePriorityButtonDisabled]="!hasPriceListSortingChanged() || isReSortPrioritySaving()"
      [isCancelPriorityButtonDisabled]="isReSortPrioritySaving()"
      (cancelPriorityChanges)="resetPriceListSorting()"
      (savePriority)="onOrderPriceListSave()"
    ></app-price-list-sorting-banner>
  </ng-container>

  <app-price-lists-overview-table
    data-testid="price-list-overview-list-table"
    (priceListIdSelected)="selectPriceList($event)"
    [priceLists]="filteredResults()"
    [priceListFamilyIndex]="priceListFamilyIndex()"
    [planId]="requestFilters().planId ?? null"
    [timezone]="timezone()"
    [isReSortPriorityActive]="isReSortPriorityActive() && !isReSortPrioritySaving()"
    [basePriceListHasPricesToBeSet]="basePriceListHasPricesNotSetted()"
    [isShowingArchived]="isShowingArchived()"
    (priceListsPriorityChanged)="onOrderPriceListChanged($event)"
    (priceListArchiveRequested)="onArchivePriceList($event)"
    (priceListUnarchiveRequested)="onUnarchivePriceList($event)"
  >
  </app-price-lists-overview-table>
</app-search-result-view>
