<ignt-dialog-header data-testid="modal-title">
  {{ data.title }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p data-testid="modal-message" [innerHTML]="data.message"></p>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="secondary" [fill]="true" data-testid="modal-cancel-button" [igntDialogClose]="false">
    {{ data.cancelLabel }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    variant="danger"
    [fill]="true"
    data-testid="modal-accept-button"
    [igntDialogClose]="true"
  >
    {{ data.acceptLabel }}
  </button>
</ignt-dialog-footer>
