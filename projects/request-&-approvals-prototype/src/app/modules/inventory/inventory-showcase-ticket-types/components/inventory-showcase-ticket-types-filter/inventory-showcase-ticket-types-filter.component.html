<div class="showcase-ticket-types-filter">
  <div class="showcase-ticket-types-filter__fields">
    <div class="showcase-ticket-types-filter__field">
      <label class="showcase-ticket-types-filter__field-label" for="showcase-group-filter">
        {{ 'inventory.ticketTypes.showcase.filter.group' | translate }}
      </label>
      <select
        class="showcase-ticket-types-filter__field-control"
        data-testid="showcase-group-filter"
        id="showcase-group-filter"
        [disabled]="disabled()"
        [value]="selectedGroupIdModel()"
        (change)="onGroupChange($event)"
      >
        <option value="">{{ 'inventory.ticketTypes.showcase.filter.allGroups' | translate }}</option>
        @for (group of groupOptions(); track group.id) {
          <option [value]="group.id">{{ group.name }}</option>
        }
      </select>
    </div>

    <div class="showcase-ticket-types-filter__search">
      <ignt-icon aria-hidden="true" class="showcase-ticket-types-filter__search-icon" name="search" size="h3" variant="regular" />
      <input
        class="showcase-ticket-types-filter__search-input"
        data-testid="showcase-ticket-type-search"
        type="search"
        [disabled]="disabled()"
        [placeholder]="'inventory.ticketTypes.showcase.filter.searchPlaceholder' | translate"
        [value]="searchTerm()"
        (input)="onSearchInput($event)"
      />
    </div>
  </div>

  <div class="showcase-ticket-types-filter__bulk-controls">
    <ignt-checkbox
      dataTestId="showcase-select-all"
      [checked]="isSelectAllChecked()"
      [disabled]="disabled() || filteredCount() === 0"
      [label]="'inventory.ticketTypes.showcase.filter.selectAll' | translate"
      size="small"
      (change)="onSelectAllToggle()"
    />
  </div>
</div>
