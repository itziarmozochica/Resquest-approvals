<app-lateral-slider
  [closeOnBackdropClick]="!isSaveInProgress()"
  [contentTemplate]="panelContentTemplateRef()"
  [disableCloseButton]="isSaveInProgress()"
  [showDetails]="isOpen()"
  [title]="'inventory.ticketTypes.showcase.catalog.title' | translate"
  (closeSlider)="onClosePanel()"
/>

<ng-template #panelContent>
  <div class="showcase-catalog-panel">
    <p class="showcase-catalog-panel__description">
      {{ 'inventory.ticketTypes.showcase.catalog.description' | translate }}
    </p>

    <app-inventory-showcase-ticket-types-filter
      [disabled]="disabled() || isSaveInProgress()"
      [filteredCount]="filteredSessionTypes().length"
      [groupOptions]="groupOptions()"
      [isSelectAllChecked]="isSelectAllChecked()"
      [selectedGroupId]="selectedGroupId()"
      (groupChange)="onGroupChange($event)"
      (searchTermChange)="onSearchTermChange($event)"
      (selectAllChange)="onSelectAllChange($event)"
    />

    <div class="showcase-catalog-panel__list">
      <app-inventory-showcase-ticket-types-list
        [disabled]="disabled() || isSaveInProgress()"
        [filteredSessionTypes]="filteredSessionTypes()"
        [selectedIds]="effectiveSelectedIds()"
        [selectedGroupId]="selectedGroupId()"
        [sessionTypeGroups]="groupOptions()"
        (selectionChange)="onSelectionChange($event)"
      />
    </div>

    <footer class="showcase-catalog-panel__footer">
      <button
        data-testid="showcase-save-selection-button"
        igntButton
        sentiment="primary"
        type="button"
        [disabled]="disabled() || !hasPendingChanges() || isSaveInProgress()"
        [fill]="true"
        (click)="onSave()"
      >
        {{ 'inventory.ticketTypes.showcase.actions.save' | translate }}
      </button>
      <button
        class="showcase-catalog-panel__cancel"
        data-testid="showcase-catalog-cancel-button"
        type="button"
        [disabled]="isSaveInProgress()"
        (click)="onCancel()"
      >
        {{ 'inventory.ticketTypes.showcase.actions.cancel' | translate }}
      </button>
    </footer>
  </div>
</ng-template>
