<th class="capacity-templates-table__cell capacity-templates-table__cell--label">
  <span class="capacity-templates-table__timeslot-capacity-label">
    {{ 'inventory.capacity.templates.columns.timeslotCapacity' | translate }}
    <ignt-icon
      class="capacity-templates-table__timeslot-capacity-info"
      name="info-circle"
      variant="light"
      [title]="'inventory.capacity.templates.toolTips.timeSlotCapacity' | translate"
    ></ignt-icon>
  </span>
</th>
@for (value of timeSlotCapacities(); track value.templateId) {
  <th class="capacity-templates-table__cell capacity-templates-table__cell--max-capacity">
    <div class="capacity-templates-table__max-capacity-input">
      <app-capacity-templates-table-capacity-cell
        [belowQuotaSumErrorI18nKey]="timeslotBelowQuotaSumErrorI18nKey"
        [templateId]="value.templateId"
        [controlKey]="timeslotControlKey"
        [displayValue]="value.capacity"
      />
    </div>
  </th>
}
