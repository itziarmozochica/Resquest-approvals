<div class="capacity-templates-table__header-cell" [class.capacity-templates-table__header-cell--editing]="isEditing()">
  @if (isEditing()) {
    @if (nameControl(); as activeNameControl) {
      <ignt-input-field
        type="text"
        label=""
        [hideErrorLabels]="true"
        [formControl]="activeNameControl"
        data-testid="capacity-templates-header-name-input"
      ></ignt-input-field>
    }
    <p class="capacity-templates-table__header-editing-status" data-testid="capacity-templates-editing-status">
      <ignt-icon class="capacity-templates-table__header-editing-status-icon" name="edit" variant="light"></ignt-icon>
      <span>{{ 'inventory.capacity.templates.actions.editingTemplate' | translate }}</span>
    </p>
    <div class="capacity-templates-table__header-edit-actions">
      <ignt-button
        data-testid="capacity-templates-discard-column-btn"
        sentiment="danger"
        size="small"
        variant="tertiary"
        [disabled]="disabled() || isSaving()"
        [label]="'common.cancel' | translate"
        (click)="onDiscardColumn()"
      ></ignt-button>
      <ignt-button
        data-testid="capacity-templates-save-column-btn"
        sentiment="brand"
        size="small"
        variant="secondary"
        [disabled]="isSaveDisabled()"
        [label]="'common.save' | translate"
        (click)="onSaveColumn()"
      ></ignt-button>
    </div>
  } @else {
    <span class="capacity-templates-table__header-name" data-testid="capacity-templates-header-name">{{ capacityTemplate().name }}</span>
    <div class="capacity-templates-table__header-view-actions" [class.capacity-templates-table__header-view-actions--narrow]="narrow()">
      @if (canViewQuotas()) {
        <ignt-button
          data-testid="capacity-templates-view-quotas-btn"
          sentiment="brand"
          size="small"
          variant="tertiary"
          [label]="'inventory.capacity.templates.actions.quotas' | translate"
          [leadingIcon]="{ name: 'chart-pie', variant: 'solid' }"
          (click)="onViewQuotas()"
        ></ignt-button>
      }
      <ignt-button
        data-testid="capacity-templates-edit-btn"
        sentiment="brand"
        size="small"
        variant="tertiary"
        [disabled]="disabled()"
        [label]="'inventory.capacity.templates.actions.editTemplate' | translate"
        [leadingIcon]="{ name: 'edit', variant: 'solid' }"
        (click)="onEditColumn()"
      ></ignt-button>
      @if (!disabled()) {
        <ignt-button
          data-testid="capacity-templates-delete-btn"
          igntTooltip
          sentiment="danger"
          size="small"
          variant="tertiary"
          [disabled]="deleteDisabledReasonKey() !== null"
          [label]="'inventory.capacity.templates.actions.deleteTemplate' | translate"
          [leadingIcon]="{ name: 'trash-alt', variant: 'solid' }"
          [tooltipDisabled]="deleteDisabledReasonKey() === null"
          [tooltipLabel]="deleteDisabledReasonKey() ?? '' | translate"
          (click)="onDelete()"
        ></ignt-button>
      }
    </div>
  }
</div>
