<th class="capacity-templates-table__cell">
  <span class="collapse-group-icon" (click)="toggleCollapse.emit()">
    <ignt-icon class="pointer" [name]="isCollapsed() ? 'chevron-up' : 'chevron-down'" variant="light"></ignt-icon>
    {{ group().groupName || ('inventory.capacity.templates.columns.ungroupedTickets' | translate) }}
  </span>
</th>
@if (groupControlKey(); as controlKey) {
  @for (value of group().capacityTemplateValues; track value.templateId) {
    <th class="capacity-templates-table__cell capacity-templates-table__cell--group-input">
      <div class="capacity-templates-table__group-input-wrapper">
        <app-capacity-templates-table-capacity-cell
          [templateId]="value.templateId"
          [controlKey]="controlKey"
          [displayValue]="value.capacity"
        />
      </div>
    </th>
  }
} @else {
  @for (value of group().capacityTemplateValues; track value.templateId) {
    <th class="capacity-templates-table__cell"></th>
  }
}
