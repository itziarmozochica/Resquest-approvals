<div class="common-session-edit lateral-slider-body__wrapper">
  <form [formGroup]="formGroup" class="common-session-edit__form capacity-template-form">
    <fieldset class="wrapper">
      <div class="cell">
        <ignt-input-field
          formControlName="name"
          id="name"
          type="text"
          [label]="('inventory.capacity.templates.form.fields.name.title' | translate) + '*'"
          data-testid="capacity-template-name-input"
          [customFormErrors]="[
            {
              type: 'required',
              message: 'form.error.required' | translate,
            },
          ]"
        ></ignt-input-field>
      </div>

      <div class="cell">
        <ignt-input-field
          formControlName="timeslotCapacity"
          id="timeslotCapacity"
          type="number"
          [label]="'inventory.capacity.templates.form.fields.timeslotCapacity.title' | translate"
          data-testid="capacity-template-timeslot-capacity-input"
          [customFormErrors]="[
            {
              type: 'max',
              message: 'form.error.maxValue' | translate: { value: MAX_CAPACITY },
            },
          ]"
        ></ignt-input-field>
        @if (timeslotBelowQuotaSumError(); as err) {
          <div class="capacity-template-form__validation-error" data-testid="capacity-template-timeslot-below-quota-sum-error">
            {{ 'inventory.capacity.templates.form.fields.timeslotCapacity.errorBelowQuotaSum' | translate: { minimum: err.minimum } }}
          </div>
        }
        <div class="capacity-template-form__note">
          {{ 'inventory.capacity.templates.form.fields.timeslotCapacity.note' | translate }}
        </div>
      </div>
    </fieldset>
  </form>
</div>
<div class="lateral-slider-body__footer">
  <ignt-button
    data-testid="capacity-template-cancel-button"
    sentiment="danger"
    variant="tertiary"
    [label]="'common.cancel' | translate"
    (click)="cancel()"
  />
  <ignt-button
    data-testid="capacity-template-submit-button"
    [disabled]="isSaveButtonDisabled()"
    [label]="'common.save' | translate"
    (click)="save()"
  />
</div>
