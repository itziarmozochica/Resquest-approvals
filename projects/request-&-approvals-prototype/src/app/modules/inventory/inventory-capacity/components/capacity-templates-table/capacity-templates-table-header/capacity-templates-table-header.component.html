@if (!narrow()) {
  <th class="capacity-templates-table__cell capacity-templates-table__cell--label"></th>
}
@for (capacityTemplate of capacityTemplates(); track capacityTemplate.id) {
  <th
    class="capacity-templates-table__cell capacity-templates-table__cell--template-header"
    data-testid="capacity-templates-header-cell"
    [attr.colspan]="narrow() ? 2 : null"
  >
    <app-capacity-templates-table-header-cell
      [capacityTemplate]="capacityTemplate"
      [canViewQuotas]="canViewQuotas()"
      [disabled]="disabled()"
      [narrow]="narrow()"
      (viewQuotas)="viewQuotas.emit($event)"
    />
  </th>
}
