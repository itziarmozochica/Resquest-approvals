<th class="capacity-templates-table__cell">
  <ignt-icon [name]="'ticket-alt'" variant="light"></ignt-icon>
  {{ sessionType().sessionTypeLabel }}
  @if (sessionType().isNew) {
    <span class="tag tag--warning-outline-contrast">{{ 'tags.new' | translate }}</span>
  }
</th>
@for (value of sessionType().capacityTemplateValues; track value.templateId) {
  <th class="capacity-templates-table__cell">
    <div class="capacity-templates-table__session-type-input-wrapper">
      @if (sessionTypeControlKey(); as controlKey) {
        <app-capacity-templates-table-capacity-cell
          [templateId]="value.templateId"
          [controlKey]="controlKey"
          [displayValue]="value.capacity"
        />
      } @else if (value.capacity !== null) {
        <span class="capacity-templates-table__display-value" data-testid="capacity-templates-table-display-value">{{
          value.capacity
        }}</span>
      }
    </div>
  </th>
}
