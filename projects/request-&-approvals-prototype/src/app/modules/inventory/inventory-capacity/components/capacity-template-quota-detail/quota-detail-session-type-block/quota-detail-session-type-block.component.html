<div class="quota-detail__session-type-block" data-testid="quota-detail-session-type-block">
  <div class="quota-detail__session-type-row">
    <div class="quota-detail__session-type-info">
      <div class="quota-detail__session-type-name-col">
        <ignt-icon name="ticket-alt" variant="light"></ignt-icon>
        <span data-testid="quota-detail-session-type-name">{{ sessionType().name }}</span>
      </div>
      @if (!isEditing()) {
        <ignt-button
          data-testid="quota-detail-add-quota-btn"
          sentiment="brand"
          size="small"
          variant="tertiary"
          [disabled]="isEditingDisabled() || isSaving()"
          [label]="'inventory.capacity.quotaDetail.addQuota' | translate"
          [leadingIcon]="{ name: 'plus', variant: 'light' }"
          (click)="onAddQuota()"
        ></ignt-button>
      }
    </div>
    <app-quota-detail-capacity-cell [controlName]="capacityControlName()" [displayValue]="sessionType().capacity" />
  </div>

  @if (quotas().length > 0 && sessionType().capacity !== null) {
    <app-quota-detail-free-capacity-row
      level="sessionType"
      [poolCapacity]="sessionType().capacity"
      [poolControlName]="capacityControlName()"
      [quotaControlNames]="quotaControlNames()"
      [quotas]="quotas()"
    />
  }

  @for (quota of quotas(); track $index; let quotaIndex = $index) {
    <app-quota-detail-quota-row
      level="sessionType"
      [controlName]="quotaControlNames()[quotaIndex]"
      [groupId]="groupId()"
      [menuId]="getQuotaMenuId(quotaIndex)"
      [openMenuId]="openMenuId()"
      [quota]="quota"
      [quotaIndex]="quotaIndex"
      [sessionTypeId]="sessionType().sessionTypeId"
      [template]="template()"
      (menuToggle)="menuToggle.emit($event)"
      (quotaAction)="quotaAction.emit($event)"
    />
  }
</div>
