<div
  class="quota-detail__quota-row quota-detail__quota-row--free"
  data-testid="quota-detail-free-capacity-row"
  [class.quota-detail__quota-row--session-type]="level() === 'sessionType'"
>
  <div class="quota-detail__quota-name-col">
    <ignt-icon name="chart-pie" variant="solid"></ignt-icon>
    <span>{{ 'inventory.capacity.quotaDetail.freeCapacity' | translate }}</span>
  </div>
  <span class="quota-detail__quota-type-col"></span>
  <span class="quota-detail__quota-assignment-col"></span>
  <span class="quota-detail__capacity-value quota-detail__capacity-value--text" data-testid="quota-detail-free-capacity-value">
    {{ freeCapacity() }}
  </span>
</div>
