@if (control(); as capacityControl) {
  <div class="quota-detail__capacity-input" data-testid="quota-detail-capacity-input">
    <ignt-input-field
      type="number"
      label=""
      [formControl]="capacityControl"
      [customFormErrors]="[
        { type: 'required', message: 'form.error.mandatoryField' | translate },
        { type: 'min', message: 'form.error.minValue' | translate: { value: capacityControl.errors?.['min']?.min ?? 0 } },
      ]"
    ></ignt-input-field>
    @if (poolBelowQuotaSumMinimum(); as minimum) {
      <div class="quota-detail__validation-error" data-testid="quota-detail-pool-below-quota-sum-error">
        {{ 'inventory.capacity.templates.table.errorBelowQuotaSum' | translate: { minimum } }}
      </div>
    }
  </div>
} @else if (displayValue() !== null) {
  <span class="quota-detail__capacity-value quota-detail__capacity-value--text" data-testid="quota-detail-capacity-display">
    {{ displayValue() }}
  </span>
}
