<div class="schedule-calendar-column-time-labels__cell schedule-calendar-column-time-labels__cell--header"></div>
@for (timeLabel of timeLabels(); track timeLabel.label) {
  <div
    class="schedule-calendar-column-time-labels__cell"
    [class.schedule-calendar-column-time-labels__cell--left-out]="timeLabel.isLeftOut"
    [attr.data-testid]="timeLabel.isLeftOut ? 'time-label-left-out' : null"
  >
    {{ timeLabel.label }}
    @if (timeLabel.isLeftOut && timeSlotLeftOutReason()) {
      <span class="schedule-calendar-column-time-labels__reason">{{ timeSlotLeftOutReason() }}</span>
    }
  </div>
}
