<ignt-dialog-header data-testid="delete-calendar-dialog-title">
  {{ 'inventory.schedule.deleteModal.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p data-testid="delete-calendar-dialog-message">
    {{
      (data.canKeepSessions ? 'inventory.schedule.deleteModal.staffMessage' : 'inventory.schedule.deleteModal.message')
        | translate: { calendarName: data.calendarName }
    }}
  </p>
  @if (data.canKeepSessions) {
    <div class="delete-calendar-dialog__sessions" data-testid="delete-calendar-dialog-sessions">
      <ignt-checkbox
        dataTestId="delete-calendar-dialog-delete-sessions"
        [checked]="deleteSessions()"
        [description]="'inventory.schedule.deleteModal.deleteSessionsHint' | translate"
        [label]="'inventory.schedule.deleteModal.deleteSessions' | translate"
        (change)="onDeleteSessionsChange($event)"
      />
      <app-fever-only-marker />
    </div>
  }
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    fill
    variant="secondary"
    [label]="'common.cancel' | translate"
    data-testid="delete-calendar-dialog-cancel-button"
    [igntDialogClose]="false"
  />
  <ignt-button
    fill
    sentiment="danger"
    variant="primary"
    [label]="'inventory.schedule.deleteModal.acceptButton' | translate"
    data-testid="delete-calendar-dialog-accept-button"
    [igntDialogClose]="confirmResult()"
  />
</ignt-dialog-footer>
