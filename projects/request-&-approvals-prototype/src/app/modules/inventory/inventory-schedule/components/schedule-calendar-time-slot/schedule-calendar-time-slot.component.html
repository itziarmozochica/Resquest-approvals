<app-tier-typeahead
  [disabled]="disabled"
  [options]="tierSelectOptions()"
  [selectedOption]="tierOption()"
  (selected)="onTierSelected($event)"
  (mousedown)="onTierMouseDown($event)"
  (touchstart)="onTierTouchStart()"
></app-tier-typeahead>
<ignt-typeahead
  *ngIf="shouldShowCapacitySelect()"
  [disabled]="disabled"
  [options]="capacityTemplateSelectOptions()"
  [selectedOption]="capacityTemplateOption()"
  (selected)="onCapacityTemplateSelected($event)"
></ignt-typeahead>
