<div class="schedule-calendar-column-day__cell schedule-calendar-column-day__cell--header">
  {{ headerText() }}
</div>
@for (slot of slots(); track slot.time; let idx = $index) {
  <div
    class="schedule-calendar-column-day__cell-wrapper"
    [class.schedule-calendar-column-day__cell-wrapper--disabled]="slot.disabled"
    [class.schedule-calendar-column-day__cell-wrapper--dragging]="isDragging()"
    [class.schedule-calendar-column-day__cell-wrapper--highlight-top]="hasTopBorder(idx)"
    [class.schedule-calendar-column-day__cell-wrapper--highlight-bottom]="hasBottomBorder(idx)"
    [class.schedule-calendar-column-day__cell-wrapper--highlight-left]="hasLeftBorder(idx)"
    [class.schedule-calendar-column-day__cell-wrapper--highlight-right]="hasRightBorder(idx)"
    [style.--tier-preview-color]="isSlotHighlighted(idx) ? dragTierColor() : null"
    [attr.data-col]="columnIndex()"
    [attr.data-row]="idx"
  >
    <app-schedule-calendar-time-slot
      class="schedule-calendar-column-day__cell"
      [capacityOptions]="capacityOptions()"
      [defaultCapacityTemplateId]="defaultCapacityTemplateId()"
      [hideCapacityTemplate]="hideCapacityTemplate()"
      [tierOptions]="tierOptions()"
      [time]="slot.time"
      [timeSlot]="slot.scheduleTimeSlot"
      [disabled]="slot.disabled"
      (timeSlotChange)="onTimeSlotChange(slot, $event)"
      (tierDragStart)="onTierDragStart(idx, $event)"
    ></app-schedule-calendar-time-slot>
    @if (isSlotHighlighted(idx) && dragTierColor() && dragOriginRow() !== idx) {
      <div class="schedule-calendar-column-day__tier-preview"></div>
    }
  </div>
}
