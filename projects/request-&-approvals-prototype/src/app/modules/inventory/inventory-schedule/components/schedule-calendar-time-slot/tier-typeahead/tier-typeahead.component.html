<div class="field">
  <input
    id="typeahead-input"
    data-testid="typeahead-input"
    type="text"
    class="field__select field__select--typeahead"
    [disabled]="disabled"
    (keyup.arrowDown)="onPressArrow($any($event))"
    (keyup.arrowUp)="onPressArrow($any($event))"
    (keyup.enter)="onEnter($any($event))"
    (focusout)="onFocusOutEvent($any($event))"
    (click)="onClickInput()"
    [(ngModel)]="model"
    [ngModelOptions]="{ standalone: true }"
    [focusFirst]="false"
    [showHint]="false"
    [ngbTypeahead]="search"
    (selectItem)="onSelectItem($event)"
    [inputFormatter]="formatter"
    [resultTemplate]="tierResultTemplate"
    [readonly]="!isEditable"
    [popupClass]="'field-dropdown tier-dropdown'"
    [attr.data-test-options-length]="options.length || 0"
    #instance="ngbTypeahead"
    #inputTypeahead
  />
  <span *ngIf="selectedTierColor" class="field__selected-tag" [style.--background-color]="selectedTierColor" (click)="onClickInput()">
    {{ formatter($any(model)) }}
  </span>
  <fa-icon
    *ngIf="icon"
    class="field__icon field__icon--trail"
    [icon]="['fal', 'chevron-down']"
    (click)="onClickIcon($any($event))"
  ></fa-icon>
</div>

<ng-template #tierResultTemplate let-r="result" let-t="term">
  <div
    class="tier-dropdown-item"
    data-testid="dropdown-item"
    [class]="getOptionClass(r)"
    [class.tier-dropdown-item--selected]="isOptionSelected(r)"
    (click)="onClickSelectOption()"
  >
    <fa-icon class="tier-dropdown-item__radio" [icon]="isOptionSelected(r) ? ['fas', 'dot-circle'] : ['fal', 'circle']"></fa-icon>
    <div [style.--background-color]="r.color" class="tier-dropdown-item__label-container">
      <ngb-highlight class="tier-dropdown-item__label" [result]="formatter(r) || r.title" [term]="t.trim()"></ngb-highlight>
    </div>
  </div>
</ng-template>
