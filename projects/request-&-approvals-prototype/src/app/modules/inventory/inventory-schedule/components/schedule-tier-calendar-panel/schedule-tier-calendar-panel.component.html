<div class="schedule-tier-calendar-panel">
  @if (showDragHint() || showCapacityTemplateToggle()) {
    <div class="schedule-tier-calendar-panel__toolbar" data-testid="schedule-tier-calendar-toolbar">
      @if (showDragHint()) {
        <app-schedule-tier-calendar-drag-hint />
      }
      @if (showCapacityTemplateToggle()) {
        <app-schedule-capacity-template-visibility-toggle
          class="schedule-tier-calendar-panel__capacity-toggle"
          [disabled]="capacityTemplateToolbarDisabled()"
          [hideCapacityTemplate]="hideCapacityTemplate()"
          (hideCapacityTemplateChange)="onHideCapacityTemplateChange($event)"
        />
      }
    </div>
  }
  <app-schedule-tier-calendar
    [capacityOptions]="capacityOptions()"
    [days]="days()"
    [defaultCapacityTemplateId]="defaultCapacityTemplateId()"
    [duration]="duration()"
    [endTime]="endTime()"
    [fixedTimeSlots]="fixedTimeSlots()"
    [hideCapacityTemplate]="hideCapacityTemplate()"
    [interactionDisabled]="interactionDisabled()"
    [isDayDisabled]="isDayDisabled()"
    [scrollableColumnThreshold]="scrollableColumnThreshold()"
    [showOpenTimeSlotError]="showOpenTimeSlotError()"
    [startTime]="startTime()"
    [tableTestId]="tableTestId()"
    [tierOptions]="tierOptions()"
    [timeLabels]="timeLabels()"
    [timeSlotLeftOutReason]="timeSlotLeftOutReason()"
    [timeSlotsLeftOut]="timeSlotsLeftOut()"
    [timezone]="timezone()"
    (dayChange)="dayChange.emit($event)"
    (dragPaint)="dragPaint.emit($event)"
  />
</div>
