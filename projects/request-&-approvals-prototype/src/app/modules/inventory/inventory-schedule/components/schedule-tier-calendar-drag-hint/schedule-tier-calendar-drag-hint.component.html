<div class="schedule-tier-calendar-drag-hint" data-testid="drag-hint">
  <ignt-icon class="schedule-tier-calendar-drag-hint__icon" name="lightbulb" variant="light" size="caption" aria-hidden="true" />
  <p class="schedule-tier-calendar-drag-hint__text">
    <span class="schedule-tier-calendar-drag-hint__label">
      {{ 'inventory.schedule.scheduleForm.dragHint.label' | translate }}
    </span>
    <span
      class="schedule-tier-calendar-drag-hint__message schedule-tier-calendar-drag-hint__message--interactive"
      [appTemplatedTooltip]="dragHintGifTooltip"
      panelClass="app-tooltip-panel"
      data-testid="drag-hint-tooltip-trigger"
    >
      {{ 'inventory.schedule.scheduleForm.dragHint.message' | translate }}
    </span>
  </p>
</div>

<ng-template #dragHintGifTooltip>
  <div class="schedule-tier-calendar-drag-hint__tooltip" data-testid="drag-hint-gif-tooltip">
    <img
      class="schedule-tier-calendar-drag-hint__tooltip-gif"
      src="assets/images/inventory/schedule/inventory-schedule-drag-drop-hint.gif"
      [alt]="'inventory.schedule.scheduleForm.dragHint.gifAlt' | translate"
      width="160"
      height="108"
    />
  </div>
</ng-template>
