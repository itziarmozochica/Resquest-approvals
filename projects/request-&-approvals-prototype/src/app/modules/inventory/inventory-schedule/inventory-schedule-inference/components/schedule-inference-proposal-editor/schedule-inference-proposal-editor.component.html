<section class="schedule-inference-proposal-editor wrapper-card" data-testid="inference-proposal-editor">
  <p class="schedule-inference-proposal-editor__description">{{ 'inventory.schedule.inference.proposal.description' | translate }}</p>
  <ignt-textarea-field
    class="schedule-inference-proposal-editor__field"
    id="inference-proposal-json"
    resize="vertical"
    [label]="'inventory.schedule.inference.proposal.editorLabel' | translate"
    [rows]="rows"
    [formControl]="control"
  />
  @if (errors().length > 0) {
    <ignt-alert
      sentiment="danger"
      [title]="'inventory.schedule.inference.proposal.rejected' | translate"
      data-testid="inference-proposal-errors"
    >
      <ng-template #igntAlertContent>
        <ul class="schedule-inference-proposal-editor__errors">
          @for (error of errors(); track $index) {
            <li data-testid="inference-proposal-error">{{ error }}</li>
          }
        </ul>
      </ng-template>
    </ignt-alert>
  }
  <div class="schedule-inference-proposal-editor__actions">
    <ignt-button
      size="small"
      variant="secondary"
      [label]="'inventory.schedule.inference.proposal.validate' | translate"
      [loading]="validating()"
      [disabled]="!canValidate()"
      data-testid="inference-validate-button"
      (click)="validateRequested.emit()"
    />
    <ignt-button
      size="small"
      variant="tertiary"
      [label]="'inventory.schedule.inference.proposal.reset' | translate"
      [disabled]="!canReset()"
      data-testid="inference-reset-button"
      (click)="resetRequested.emit()"
    />
    <ignt-button
      class="schedule-inference-proposal-editor__create"
      size="small"
      [label]="'inventory.schedule.inference.proposal.create' | translate"
      [loading]="isCreating()"
      [disabled]="!canCreate()"
      data-testid="inference-create-button"
      (click)="createRequested.emit()"
    />
  </div>
</section>
