<div class="schedule-inference-blockers">
  <ignt-alert sentiment="danger" [title]="title()" data-testid="inference-blockers">
    <ng-template #igntAlertContent>
      <ul class="schedule-inference-blockers__list">
        @for (blocker of blockers(); track $index) {
          <li data-testid="inference-blocker">{{ blocker.message }}</li>
        }
      </ul>
    </ng-template>
  </ignt-alert>
</div>
