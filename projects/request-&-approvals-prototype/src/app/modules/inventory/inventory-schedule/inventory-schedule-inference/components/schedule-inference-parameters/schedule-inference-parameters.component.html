<div class="schedule-inference-parameters">
  <form class="schedule-inference-parameters__form" [formGroup]="formGroup" (ngSubmit)="submit()" data-testid="inference-parameters-form">
    <ignt-input-field
      class="schedule-inference-parameters__field"
      type="date"
      id="inference-from-date"
      [label]="'inventory.schedule.inference.parameters.fromDate' | translate"
      [formControl]="fromDateControl"
    />
    <ignt-input-field
      class="schedule-inference-parameters__field"
      type="date"
      id="inference-to-date"
      [label]="'inventory.schedule.inference.parameters.toDate' | translate"
      [formControl]="toDateControl"
      [customFormErrors]="[
        {
          type: 'toDateBeforeFromDate',
          message: 'inventory.schedule.inference.parameters.toDateBeforeFromDate' | translate,
        },
      ]"
    />
    <ignt-button
      htmlType="submit"
      size="small"
      [label]="'inventory.schedule.inference.parameters.run' | translate"
      [loading]="loading()"
      [disabled]="formGroup.invalid"
      data-testid="inference-run-button"
    />
  </form>
  @if (singlePlaceError()) {
    <ignt-alert
      sentiment="danger"
      [description]="'inventory.schedule.inference.parameters.singlePlaceError' | translate"
      data-testid="inference-single-place-error"
    />
  }
</div>
