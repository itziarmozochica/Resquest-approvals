<ignt-typeahead
  (selected)="selectOption($event)"
  (userInteraction)="markAsTouched($event)"
  [attr.data-testid]="testId()"
  [customPopupClass]="customPopupClass()"
  [disabled]="isDisabled()"
  [editable]="false"
  [emptyLabel]="settingLabel()"
  [error]="error()"
  [errorMessage]="errorMessage()"
  [fieldLabel]="settingLabel()"
  [options]="dropdownOptions()"
  [selectedOption]="selectedOption()"
></ignt-typeahead>
