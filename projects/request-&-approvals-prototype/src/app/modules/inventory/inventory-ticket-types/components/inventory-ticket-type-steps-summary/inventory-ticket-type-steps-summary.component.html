@if (isNoSessionsVisible() || isNotInStepsVisible() || isJoinedNamesVisible()) {
  <section class="steps-summary" data-testid="itt-steps-summary">
    @if (isNoSessionsVisible()) {
      @let count = withoutSessions().length;
      <ignt-alert
        data-testid="itt-steps-no-sessions-alert"
        sentiment="warning"
        [title]="
          (count === 1 ? 'inventory.ticketTypes.steps.noSessionsTitle.one' : 'inventory.ticketTypes.steps.noSessionsTitle.other')
            | translate: { count }
        "
        [description]="
          (count === 1
            ? 'inventory.ticketTypes.steps.noSessionsDescription.one'
            : 'inventory.ticketTypes.steps.noSessionsDescription.other'
          ) | translate
        "
        [actionLabel]="
          (isShowingWithoutSessions()
            ? 'inventory.ticketTypes.steps.noSessionsShowAll'
            : count === 1
              ? 'inventory.ticketTypes.steps.notInStepsAction.one'
              : 'inventory.ticketTypes.steps.notInStepsAction.other'
          ) | translate: { count }
        "
        [showCloseButton]="planId() !== null"
        (actionClicked)="toggleWithoutSessions.emit()"
        (closeAlert)="dismiss('noSessions')"
      />
    }
    @if (isNotInStepsVisible()) {
      <ignt-alert
        data-testid="itt-steps-not-in-steps-alert"
        sentiment="info"
        [title]="
          (tree().notInSteps.length === 1
            ? 'inventory.ticketTypes.steps.notInStepsTitle.one'
            : 'inventory.ticketTypes.steps.notInStepsTitle.other'
          ) | translate: { count: tree().notInSteps.length }
        "
        [description]="
          (areNamesLocked()
            ? 'inventory.ticketTypes.steps.notInStepsDescriptionLocked'
            : 'inventory.ticketTypes.steps.notInStepsDescription'
          ) | translate
        "
        [actionLabel]="
          (tree().notInSteps.length === 1
            ? 'inventory.ticketTypes.steps.notInStepsAction.one'
            : 'inventory.ticketTypes.steps.notInStepsAction.other'
          ) | translate: { count: tree().notInSteps.length }
        "
        [showCloseButton]="planId() !== null"
        (actionClicked)="showNotInSteps.emit()"
        (closeAlert)="dismiss('notInSteps')"
      />
    }
    @if (isJoinedNamesVisible()) {
      <ignt-alert
        data-testid="itt-steps-joined-names-alert"
        sentiment="info"
        [title]="
          (tree().joinedNames.length === 1
            ? 'inventory.ticketTypes.steps.joinedNamesTitle.one'
            : 'inventory.ticketTypes.steps.joinedNamesTitle.other'
          ) | translate: { count: tree().joinedNames.length, steps: tree().stepCount }
        "
        [description]="
          'inventory.ticketTypes.steps.joinedNamesDescription' | translate: { steps: tree().stepCount, example: joinedExample() }
        "
        [showCloseButton]="planId() !== null"
        (closeAlert)="dismiss('joinedNames')"
      />
    }
  </section>
}
