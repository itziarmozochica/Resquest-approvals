<div class="itt-bulk-edit-form__content" data-testid="itt-bulk-edit-form-content" [attr.inert]="isSaving() ? '' : null">
  @switch (currentStep()) {
    @case (step.ticketTypes) {
      <app-bulk-edit-ticket-types-step
        [selectedSessionTypeIds]="selectedSessionTypeIds()"
        [sessionTypeGroups]="sessionTypeGroups()"
        [sessionTypes]="selectableSessionTypes()"
        (selectionChange)="onSessionTypeIdsChange($event)"
      />
    }
    @case (step.properties) {
      <app-bulk-edit-properties-step
        [hiddenProperties]="hiddenProperties()"
        [isSuperuser]="isSuperuser()"
        [restrictedProperties]="restrictedProperties()"
        [selectedProperties]="selectedProperties()"
        (selectionChange)="onPropertiesChange($event)"
      />
    }
    @case (step.values) {
      <app-bulk-edit-values-step />
    }
  }
</div>
