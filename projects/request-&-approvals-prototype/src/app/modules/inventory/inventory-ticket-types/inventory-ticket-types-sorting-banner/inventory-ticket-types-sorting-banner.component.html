<ignt-alert data-testid="itt-sorting-banner" class="itt-sorting-banner" sentiment="accent" [description]="message() | translate">
  <ng-template #igntAlertActions>
    <button
      class="button button--small button--secondary"
      data-testid="itt-cancel-sorting-button"
      [disabled]="isCancelButtonDisabled()"
      (click)="onCancel()"
    >
      {{ 'inventory.ticketTypes.orderTicketTypesBanner.cancelButton' | translate }}
    </button>
    <button
      class="button button--small button--primary"
      data-testid="itt-save-sorting-button"
      [disabled]="isSaveButtonDisabled()"
      (click)="onSave()"
    >
      @if (isSaveButtonLoading()) {
        <ignt-icon class="itt-sorting-banner__save-icon" name="spinner" variant="solid" [spin]="true" aria-hidden="true" />
      }
      {{ 'inventory.ticketTypes.orderTicketTypesBanner.saveButton' | translate }}
    </button>
  </ng-template>
</ignt-alert>
