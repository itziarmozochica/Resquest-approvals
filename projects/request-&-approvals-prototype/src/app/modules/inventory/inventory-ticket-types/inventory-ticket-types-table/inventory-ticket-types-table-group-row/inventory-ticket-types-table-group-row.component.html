<td data-testid="itt-table-group-row-name" class="itt-table__group-row__cell" [attr.colspan]="colspan()">
  <span (click)="toggleCollapse()" data-testId="itt-table-group-row-collapse-button">
    <ignt-icon
      data-testid="itt-table-group-row-collapse-icon"
      class="itt-table__group-row__collapse-icon"
      [name]="isCollapsed ? 'chevron-up' : 'chevron-down'"
      variant="light"
      size="sm"
    ></ignt-icon>
    <span class="itt-table__group-row__label">{{ sessionTypeGroup().name }}</span>
  </span>
  @if (canModifyTicketTypes() && !isShowingArchived() && sessionTypeGroup().id !== 0) {
    <ignt-icon
      class="itt-table__group-row__edit-icon"
      (click)="edit()"
      name="edit"
      variant="regular"
      size="sm"
      data-testId="itt-table-edit-group-button"
    ></ignt-icon>
  }
</td>
