<table data-testid="itt-sorting-table" class="itt-table itt-table--sort-mode">
  <thead>
    <tr appInventoryTicketTypesTableHeader data-testid="itt-sorting-table-header" class="itt-table__header" [isSortModeActive]="true"></tr>
  </thead>

  <tbody cdkDropList (cdkDropListDropped)="onSortableDrop($event)" data-testid="itt-sorting-table-body">
    @if (!isLoading()) {
      @for (sessionType of sortableSessionTypes(); track trackById($index, sessionType); let index = $index) {
        <tr
          appInventoryTicketTypesTableRow
          cdkDrag
          cdkDragLockAxis="y"
          [cdkDragDisabled]="isSortSaving() || isLoading()"
          [attr.data-testid]="'itt-sorting-table-row-' + sessionType.id"
          class="itt-table__row itt-table__row--sortable"
          [sessionType]="sessionType"
          [productTaxRates]="productTaxRates()"
          [isSortModeActive]="true"
          [sortDisplayIndex]="index + 1"
        ></tr>
      }
    }
  </tbody>
</table>

@if (isLoading()) {
  <div class="loader itt-table__loader" data-testid="itt-sorting-table-loader">
    <ignt-icon class="loader__icon" name="spinner" variant="solid" size="h2" [spin]="true"></ignt-icon>
  </div>
}
