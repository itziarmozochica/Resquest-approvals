<ng-container *ngIf="planId$ | async as planId; else noFilters">
  <header class="table-header">
    <h3 class="table-header__message">
      {{ 'sessions.dynamicPricingSimulator.description' | translate }}
    </h3>
    <button
      class="button button--primary button--small"
      data-testid="new-action-rule-button"
      [disabled]="executionStatuses.includes(status()) || status() === null"
      (click)="requestSimulation$.next()"
      igntTooltip
      [tooltipLabel]="executionStatuses.includes(status()) ? ('sessions.dynamicPricingSimulator.messages.alreadyRunning' | translate) : ''"
      [tooltipOpenDelay]="100"
      tooltipPlacement="bottom"
    >
      {{ 'sessions.dynamicPricingSimulator.executeButton' | translate }}
    </button>
  </header>
  <ng-container *ngFor="let graph of graphs(); trackBy: trackById">
    <iframe
      data-testid="dynamic-pricing-simulator-iframe"
      class="bl-sessions-result__graph"
      border="0"
      frameborder="0"
      width="100%"
      height="800px"
      allowtransparency
      [src]="graph.url + '?key=' + iframeKey() | safeUrl"
      appIframeResizer
    >
    </iframe>
  </ng-container>
</ng-container>

<ng-template #noFilters>
  <div class="empty-filters" data-testid="no-filters">
    <fa-icon class="empty-filters__icon" [icon]="['far', 'sort-alt']"></fa-icon>
    <div>
      {{ 'sessions.dynamicPricing.noFilters' | translate }}
    </div>
  </div>
</ng-template>
