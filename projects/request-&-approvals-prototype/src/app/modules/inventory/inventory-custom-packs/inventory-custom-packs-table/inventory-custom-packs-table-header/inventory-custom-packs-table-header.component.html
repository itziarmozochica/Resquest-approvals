<th class="icp-table__header-cell">
  <ng-container
    *ngTemplateOutlet="
      dataCellTemplate;
      context: {
        titleKey: 'inventory.customPacks.columnNames.name.name',
        tooltipKey: 'inventory.customPacks.columnNames.name.tooltip',
        icon: ['far', 'info-circle'],
      }
    "
  ></ng-container>
</th>
<th class="icp-table__header-cell">
  <ng-container
    *ngTemplateOutlet="
      dataCellTemplate;
      context: {
        titleKey: 'inventory.customPacks.columnNames.items.name',
        tooltipKey: 'inventory.customPacks.columnNames.items.tooltip',
        icon: ['far', 'info-circle'],
      }
    "
  ></ng-container>
</th>

<ng-template #dataCellTemplate let-titleKey="titleKey" let-tooltipKey="tooltipKey" let-icon="icon">
  <span>
    {{ titleKey | translate }}
    <span igntTooltip [tooltipLabel]="tooltipKey | translate">
      <fa-icon [fixedWidth]="true" [icon]="icon"></fa-icon>
    </span>
  </span>
</ng-template>
