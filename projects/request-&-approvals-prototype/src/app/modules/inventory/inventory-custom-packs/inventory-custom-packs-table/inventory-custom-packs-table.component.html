<table data-testid="icp-table" class="icp-table">
  <thead>
    <tr appInventoryCustomPacksTableHeader data-testid="icp-table-header" class="icp-table__header"></tr>
  </thead>

  <tbody>
    @for (customPack of customPacks(); track customPack.packSessionId) {
      <tr
        appInventoryCustomPacksTableRow
        [attr.data-testid]="'icp-table-row-' + customPack.packSessionId"
        class="icp-table__row"
        [class.icp-table__row--first]="$first"
        [customPack]="customPack"
        [timezone]="timezone()"
      ></tr>
    }
  </tbody>
</table>
