<td data-testid="icp-table-row-label" class="icp-table__row-cell">
  <span class="icp-table__row-label">
    <fa-icon data-testid="icp-table-row-label-icon" class="ticket-icon" [icon]="packIcon"></fa-icon>
    {{ customPack().packSessionLabel }}
  </span>
</td>
<td data-testid="icp-table-row-packed-sessions" class="icp-table__row-cell">
  @for (session of packedSessions; track session.id) {
    <p class="icp-table__row-packed-session">{{ formatPackedSession(session) }}</p>
  }
</td>
