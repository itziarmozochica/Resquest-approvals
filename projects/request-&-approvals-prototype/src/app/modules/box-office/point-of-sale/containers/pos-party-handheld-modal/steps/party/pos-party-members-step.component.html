<div class="pos-party-members-step" data-testid="pos-party-members-step">
  @if (members().length > 0) {
    <div class="pos-party-members-step__actions">
      <ignt-button
        data-testid="party-members-clear-button"
        size="small"
        variant="tertiary"
        [disabled]="!hasDraftSelection()"
        [label]="translations().clearPartyMembersLabel"
        (click)="onClear()"
      />
    </div>
  }
  @for (member of members(); track member.key) {
    <fzt-party-member-counter
      [decreaseAriaLabel]="translations().decreasePartyMemberAriaLabel"
      [increaseAriaLabel]="translations().increasePartyMemberAriaLabel"
      [member]="member"
      (quantityChanged)="onQuantityChanged($event)"
    />
  }
</div>
