@if (showPlanSelectorSkeleton()) {
  <ignt-skeleton-base class="plan-selector-skeleton" data-testid="pos-plan-selector-skeleton" [animation]="true" [height]="40" />
}
@if (isFlexibleBundle()) {
  <pos-secondary-attraction-selector />
}
<fzt-ticket-selector
  [class.ticket-selector--disabled]="isFlexibleBundle() && !hasSecondarySelection()"
  [dateSelectorTemplate]="dateSelectorTemplate()"
  [isMobile]="isMobile()"
  [isTablet]="isTablet()"
  [placeholderTemplate]="isCatalogLockedForMember() ? memberLockedCatalogTemplate : placeholderTemplate()"
  [seatingTemplate]="seatingTemplate()"
  [vm]="vm()"
  (breadcrumbNavigated)="onBreadcrumbNavigated($event)"
  (levelSelected)="onLevelSelected($event)"
  (partyCategorySelected)="onPartyCategorySelected($event)"
  (partySelectMembersRequested)="onPartySelectMembersRequested()"
  (partyStartTimeTapped)="onPartyStartTimeTapped($event)"
  (tabSelected)="onTabSelected($event)"
  (tileAdd)="onTileAdd($event)"
  (tileTapped)="onTileTapped($event)"
/>
<ng-template #memberLockedCatalogTemplate>
  <ignt-alert data-testid="pos-member-locked-catalog-alert" sentiment="info" [description]="lockedCatalogMessage()" />
</ng-template>
