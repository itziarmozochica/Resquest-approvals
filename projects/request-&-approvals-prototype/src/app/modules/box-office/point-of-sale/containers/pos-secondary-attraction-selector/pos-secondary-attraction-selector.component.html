<div class="pos-secondary-attraction-selector" data-testid="pos-secondary-attraction-selector">
  <div class="tile-wrapper pos-secondary-attraction-selector__list">
    <div
      class="tile-wrapper__item tile tile--wider tile--selected tile--disabled pos-secondary-attraction-selector__main-plan"
      data-testid="pos-secondary-main-plan-item"
    >
      <span class="pos-secondary-attraction-item">
        <ignt-checkbox [ariaLabel]="mainPlanName()" [checked]="true" [disabled]="true"></ignt-checkbox>
        <span class="pos-secondary-attraction-item__label">{{ mainPlanName() }}</span>
      </span>
    </div>

    @for (row of secondaryPlanRows(); track row.id) {
      <div
        role="button"
        tabindex="0"
        class="tile-wrapper__item tile tile--wider"
        [class.tile--selected]="row.isSelected"
        [class.tile--disabled]="row.isDisabled"
        [attr.data-testid]="'pos-secondary-plan-item-' + row.id"
        (click)="togglePlan(row.id)"
        (keydown.enter)="togglePlan(row.id)"
        (keydown.space)="togglePlan(row.id); $event.preventDefault()"
      >
        <span class="pos-secondary-attraction-item">
          <ignt-checkbox
            [checked]="row.isSelected"
            [disabled]="row.isDisabled"
            (click)="$event.stopPropagation()"
            (change)="togglePlan(row.id)"
          ></ignt-checkbox>
          <span class="pos-secondary-attraction-item__label">{{ row.name }}</span>
        </span>
      </div>
    }
  </div>
</div>

<div class="pos-secondary-attraction-status" data-testid="pos-secondary-attraction-status">
  @if (meetsMinimum()) {
    <span class="pos-secondary-attraction-status__count" data-testid="pos-secondary-attraction-count">
      {{ 'boxOffice.secondaryAttractionSelector.attractionsCount' | translate: { count: selectedCount() } }}
    </span>
    <ignt-button
      data-testid="pos-secondary-attraction-clear"
      htmlType="button"
      size="small"
      variant="tertiary"
      [label]="'boxOffice.secondaryAttractionSelector.clear' | translate"
      [trailingIcon]="{ name: 'trash-alt', variant: 'solid' }"
      (click)="clearSelection()"
    />
  } @else {
    <ignt-alert
      sentiment="info"
      [showCloseButton]="false"
      [description]="'boxOffice.secondaryAttractionSelector.addAttractionAlert' | translate"
      data-testid="pos-secondary-attraction-alert"
    />
  }
</div>
