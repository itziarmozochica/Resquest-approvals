@if (showPartyPanel()) {
  <fzt-party-date-panel
    [showClearMembers]="!isMobile() && !isTablet()"
    [vm]="partyVm()"
    (clearRequested)="onClearPartyMembers()"
    (dateSelected)="onDateSelected($event)"
    (fromDateChanged)="onFromDateChange($event)"
    (hourSelected)="onPartyHourSelected($event)"
    (loadMoreClicked)="onLoadMoreClicked()"
    (memberQuantityChanged)="onPartyMemberQuantityChanged($event)"
  />
} @else {
  <fzt-date-selector
    [isMobile]="isMobile()"
    [isTablet]="isTablet()"
    [vm]="vm()"
    (calendarOpenChanged)="onCalendarOpenChanged($event)"
    (dateSelected)="onDateSelected($event)"
    (fromDateChanged)="onFromDateChange($event)"
    (loadMoreClicked)="onLoadMoreClicked()"
    (sectionToggled)="onSectionToggled($event)"
    (timeslotConfirmed)="onTimeslotConfirmed()"
    (timeslotSelected)="onTimeslotSelected($event)"
  />
}
