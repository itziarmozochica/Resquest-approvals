<ignt-dialog-header data-testid="hardware-mismatch-modal-title">{{ translationPrefix + '.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content data-testid="hardware-mismatch-modal-message">
  @if (overrideDeadline !== null) {
    {{ translationPrefix + '.overrideMessage' | translate: { deadline: overrideDeadline } }}
  } @else {
    {{ translationPrefix + '.message' | translate }}
  }
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <ignt-button
    fill
    variant="secondary"
    data-testid="hardware-mismatch-modal-cancel-button"
    [label]="translationPrefix + '.leftButton' | translate"
    [igntDialogClose]="resolution.cancelled"
  />
  @if (overrideDeadline !== null) {
    <ignt-button
      fill
      variant="secondary"
      data-testid="hardware-mismatch-modal-override-button"
      [label]="translationPrefix + '.overrideButton' | translate"
      [igntDialogClose]="resolution.override"
    />
  }
  <ignt-button
    fill
    variant="primary"
    data-testid="hardware-mismatch-modal-select-onsite-setup-button"
    [label]="translationPrefix + '.rightButton' | translate"
    [igntDialogClose]="resolution.selectOnsiteSetup"
  />
</ignt-dialog-footer>
