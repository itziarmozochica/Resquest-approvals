<app-settings-list-section testIdPrefix="payment-configurations-list" [state]="state()">
  <ignt-table
    class="payment-configurations-list__table"
    data-testid="payment-configurations-list-table"
    [data]="rows()"
    [hasPagination]="hasPagination()"
    [interactiveRows]="true"
    [isLoading]="loading()"
    [pageSize]="pageSize"
    [searchConfig]="searchConfig()"
    (rowInteraction)="onRowInteraction($event)"
    (searchChanged)="onSearch($event)"
  >
    <ignt-table-column key="name" columnType="primary" [header]="'paymentConfig.list.columns.name' | translate">
      <ng-template [igntTableColumnTemplateType]="tableColumnTypeSample()" let-item="item">
        <span data-testid="payment-configurations-list-name">{{ item.name }}</span>
      </ng-template>
    </ignt-table-column>

    <ignt-table-column
      key="integratedGatewayProvider"
      columnType="secondary"
      [header]="'paymentConfig.list.columns.gatewayProvider' | translate"
    >
      <ng-template [igntTableColumnTemplateType]="tableColumnTypeSample()" let-item="item">
        <span data-testid="payment-configurations-list-provider">
          {{ 'paymentConfig.editor.gateway.provider.' + (item.integratedGatewayProvider ?? 'none') | translate }}
        </span>
      </ng-template>
    </ignt-table-column>

    <ignt-table-column key="methodCount" columnType="secondary" [header]="'paymentConfig.list.columns.paymentMethods' | translate">
      <ng-template [igntTableColumnTemplateType]="tableColumnTypeSample()" let-item="item">
        <span data-testid="payment-configurations-list-methods">{{ item.methodCount }}</span>
      </ng-template>
    </ignt-table-column>

    <ignt-table-column key="terminalCount" columnType="secondary" [header]="'paymentConfig.list.columns.terminals' | translate">
      <ng-template [igntTableColumnTemplateType]="tableColumnTypeSample()" let-item="item">
        <span data-testid="payment-configurations-list-terminals">{{ item.terminalCount }}</span>
      </ng-template>
    </ignt-table-column>

    <ignt-table-column columnType="action" header="" [width]="56">
      <ng-template [igntTableColumnTemplateType]="tableColumnTypeSample()" let-item="item">
        <div class="payment-configurations-list__row-actions" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
          <button
            ignt-icon-button
            size="small"
            sentiment="tertiary"
            data-testid="payment-configurations-list-actions"
            [icon]="['fas', 'ellipsis-v']"
            [attr.aria-label]="'paymentConfig.list.columns.actions' | translate"
            [igntMenuTriggerFor]="rowActionsMenu"
          ></button>
          <ng-template #rowActionsMenu>
            <ignt-menu>
              @if (isDuplicateAllowed(item)) {
                <ignt-menu-item
                  value="duplicate"
                  data-testid="payment-configurations-list-duplicate"
                  [label]="'paymentConfig.actions.menu.duplicate' | translate"
                  (triggered)="duplicateConfiguration(item)"
                />
              }
              <ignt-menu-item
                value="delete"
                sentiment="danger"
                data-testid="payment-configurations-list-delete"
                [label]="'paymentConfig.list.columns.remove' | translate"
                (triggered)="deleteConfiguration(item)"
              />
            </ignt-menu>
          </ng-template>
        </div>
      </ng-template>
    </ignt-table-column>
  </ignt-table>
</app-settings-list-section>
