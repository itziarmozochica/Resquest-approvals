@let currentPlaceId = placeId();
@if (currentPlaceId !== undefined) {
  <app-payment-configuration-editor
    [placeId]="currentPlaceId"
    [configurationId]="configurationId()"
    (saved)="backToList()"
    (cancelled)="backToList()"
    (deleted)="backToList()"
    (duplicated)="backToList()"
  ></app-payment-configuration-editor>
}
