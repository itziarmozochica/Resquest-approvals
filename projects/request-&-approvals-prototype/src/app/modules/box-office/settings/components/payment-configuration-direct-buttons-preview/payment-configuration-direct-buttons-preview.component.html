<section class="direct-buttons-preview" data-testid="payment-configuration-direct-buttons-preview">
  <div class="direct-buttons-preview__heading">
    @if (showTitle()) {
      <h3 class="direct-buttons-preview__title">{{ 'paymentConfig.editor.split.preview.title' | translate }}</h3>
    }
    <p class="direct-buttons-preview__description" data-testid="payment-configuration-direct-buttons-preview-description">
      {{ 'paymentConfig.editor.directButtons.preview.description' | translate }}
    </p>
  </div>

  <div class="direct-buttons-preview__stage" aria-hidden="true" inert>
    <div class="direct-buttons-preview__skeleton">
      <span class="direct-buttons-preview__bar direct-buttons-preview__bar--wide"></span>
      <span class="direct-buttons-preview__bar"></span>
      <span class="direct-buttons-preview__block"></span>
      <span class="direct-buttons-preview__block"></span>
      <span class="direct-buttons-preview__bar direct-buttons-preview__bar--short"></span>
    </div>

    <div class="direct-buttons-preview__actions">
      @for (button of buttons(); track button.slot) {
        <ignt-button
          fill
          class="direct-buttons-preview__button"
          [class.direct-buttons-preview__button--secondary]="button.slot === 'secondary'"
          [class.direct-buttons-preview__button--tertiary]="button.slot === 'tertiary'"
          [variant]="button.slot === 'tertiary' ? 'secondary' : 'primary'"
          [label]="button.label"
          [leadingIcon]="button.icon"
          [attr.data-testid]="'payment-configuration-direct-buttons-preview-' + button.slot"
        />
      }
    </div>
  </div>
</section>
