@if (title() || ctaLabel()) {
  <div class="settings-list-section__header">
    <div class="settings-list-section__label">{{ title() }}</div>
    @if (ctaLabel(); as label) {
      <div class="settings-list-section__actions">
        <ignt-button [attr.data-testid]="testIdPrefix() + '-create'" [label]="label" (click)="ctaCallback.emit()" />
      </div>
    }
  </div>
}

@let s = state();
@if (s.kind === 'error') {
  <div [attr.data-testid]="testIdPrefix() + '-error'" class="settings-list-section__error">
    <ignt-alert sentiment="danger" [description]="s.message" />
  </div>
} @else if (s.kind === 'loading') {
  <div [attr.data-testid]="testIdPrefix() + '-loading'" class="settings-list-section__spinner">
    <ignt-icon name="spinner" variant="solid" size="h1" [spin]="true" aria-hidden="true"></ignt-icon>
  </div>
} @else if (s.kind === 'empty') {
  <div [attr.data-testid]="testIdPrefix() + '-empty'" class="settings-list-section__empty">
    <ignt-icon name="receipt" variant="regular" size="h1"></ignt-icon>
    <span>{{ s.message }}</span>
  </div>
} @else {
  <div [attr.data-testid]="testIdPrefix() + '-results'" class="settings-list-section__results">
    <ng-content></ng-content>
  </div>
}
