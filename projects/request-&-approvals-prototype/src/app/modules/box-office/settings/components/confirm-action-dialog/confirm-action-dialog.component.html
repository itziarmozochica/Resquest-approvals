<div class="confirm-action-dialog">
  <ignt-dialog-header hideCloseButton data-testid="confirm-action-title">{{ data.actionLabel }}</ignt-dialog-header>
  <ignt-dialog-content>
    <div class="confirm-action-dialog__body">
      <ignt-icon class="confirm-action-dialog__icon" [name]="icon" variant="light" size="display" aria-hidden="true" />
      <p class="confirm-action-dialog__description" data-testid="confirm-action-description">{{ data.description }}</p>
      <p class="confirm-action-dialog__question" data-testid="confirm-action-question">{{ data.question }}</p>
    </div>
  </ignt-dialog-content>
  <ignt-dialog-footer hideCancelButton>
    <ignt-button variant="secondary" fill [label]="data.dismissLabel" [igntDialogClose]="false" data-testid="confirm-action-dismiss" />
    <ignt-button
      variant="primary"
      fill
      [sentiment]="sentiment"
      [label]="data.actionLabel"
      [igntDialogClose]="true"
      data-testid="confirm-action-confirm"
    />
  </ignt-dialog-footer>
</div>
