<div class="container">
  <div class="filters-container" cdkDropList (cdkDropListDropped)="dropChangePlan($event)">
    <ng-container *ngFor="let planOption of selectedPlans(); let i = index">
      <div
        class="filter-container"
        cdkDrag
        cdkDragLockAxis="y"
        cdkDragBoundary=".filters-container"
        [cdkDragDisabled]="selectedPlans().length < 2"
      >
        <div class="filter__card-placeholder" *cdkDragPlaceholder></div>
        <div class="filter__card">
          <div class="filter__icon-drag-container" cdkDragHandle>
            <ignt-icon class="filter__icon-drag" name="grip-vertical" variant="solid" aria-hidden="true"></ignt-icon>
          </div>
          <div class="filter__description" [title]="planOption.title">
            {{ planOption.title }}
          </div>
        </div>
        <div class="filter__icon-remove-container">
          <ignt-icon
            class="filter__icon-remove"
            name="times"
            variant="solid"
            aria-hidden="true"
            [fixedWidth]="true"
            (click)="deletePlan(i)"
          ></ignt-icon>
        </div>
      </div>
    </ng-container>
  </div>
  <div class="select-container">
    <app-multi-select
      [options]="planOptions()"
      [selectedOptions]="selectedPlans()"
      (selected)="updatePlanSelection($event)"
      [maxSelectedOptions]="planOptions().length"
      [displayInPlaceMaximum]="3"
      [defaultOrdering]="false"
      [defaultOpening]="false"
      [placeholder]="'boxOffice.settings.actions.onsiteSetup.prioritizedMainPlans.addButton' | translate"
    />
  </div>
</div>
