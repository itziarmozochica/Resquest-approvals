<ignt-dialog-header>{{ 'paymentConfig.editor.split.preview.title' | translate }}</ignt-dialog-header>
<ignt-dialog-content>
  @if (data.checkoutFlows; as flows) {
    <app-payment-configuration-checkout-preview [flows]="flows" [showTitle]="false" />
  }
  @if (data.directButtons; as buttons) {
    <app-payment-configuration-direct-buttons-preview [buttons]="buttons" [showTitle]="false" />
  }
  @if (data.methods; as methods) {
    <app-payment-configuration-methods-preview [methods]="methods" [showTitle]="false" />
  }
</ignt-dialog-content>
