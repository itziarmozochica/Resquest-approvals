<div class="filters-container" cdkDropList data-testid="contact-information-fields-order-list" (cdkDropListDropped)="dropField($event)">
  @for (field of orderedFields(); track field) {
    <div
      class="filter-container"
      cdkDrag
      cdkDragLockAxis="y"
      cdkDragBoundary=".filters-container"
      [attr.data-testid]="'contact-information-fields-order-card-' + field"
    >
      <div class="filter__card-placeholder" *cdkDragPlaceholder></div>
      <div class="filter__card">
        <div class="filter__icon-drag-container" cdkDragHandle>
          <ignt-icon class="filter__icon-drag" name="grip-vertical" variant="solid" aria-hidden="true"></ignt-icon>
        </div>
        <div class="filter__description">
          {{ fieldLabels[field] | translate }}
        </div>
      </div>
    </div>
  }
</div>
