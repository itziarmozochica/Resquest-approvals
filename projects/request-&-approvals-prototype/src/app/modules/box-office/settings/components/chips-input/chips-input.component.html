<div class="chips-container">
  @for (chip of chips; track chip; let i = $index) {
    <div class="chip" [class.selected]="lastChipSelected && i === chips.length - 1">
      <span class="chip__remove" role="button" (click)="removeChip(i)" [attr.aria-label]="'chips.removeChip' | translate">×</span>
      <span class="chip__label">{{ chip }}</span>
    </div>
  }
  <input
    type="text"
    [ngModel]="inputValue"
    (ngModelChange)="onModelChange($event)"
    (keydown)="onKeyDown($event)"
    (keyup)="onKeyUp($event)"
    [placeholder]="chips.length ? '' : placeholder || ('chips.hint' | translate)"
  />

  @if (errorMessage) {
    <div class="form-error bg-transparent">
      <ignt-icon class="form-error--icon" name="exclamation-circle" variant="solid"></ignt-icon>
      <span class="form-error--message"> {{ errorMessage }}</span>
    </div>
  }
</div>
