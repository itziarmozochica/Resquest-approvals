<div class="checkout-flows" data-testid="payment-configuration-checkout-flows">
  <div class="checkout-flows__list" data-testid="payment-configuration-checkout-flows-list">
    <app-vertical-draggable-list
      [boundarySelector]="'.checkout-flows__list'"
      [disabled]="disabled()"
      [items]="flows()"
      [itemTemplate]="flowTemplate"
      [placeholderHeight]="'48px'"
      (itemsReordered)="onReorder($event)"
    ></app-vertical-draggable-list>
  </div>
</div>

<ng-template #flowTemplate let-setting>
  <div class="checkout-flows__item" [attr.data-testid]="'payment-configuration-checkout-flow-' + setting.flow">
    <div class="checkout-flows__item-info">
      <span class="checkout-flows__item-name">{{ meta[setting.flow].labelKey | translate }}</span>
      <span class="checkout-flows__item-description">{{ meta[setting.flow].descriptionKey | translate }}</span>
    </div>
    @if (setting.flow === defaultFlow()) {
      <ignt-tag sentiment="sharp" variant="outline" [attr.data-testid]="'payment-configuration-checkout-flow-default-' + setting.flow">{{
        'paymentConfig.editor.split.checkoutFlows.default' | translate
      }}</ignt-tag>
    }
    <ignt-toggle
      [attr.data-testid]="'payment-configuration-checkout-flow-toggle-' + setting.flow"
      [checked]="setting.enabled"
      [disabled]="disabled() || (setting.enabled && enabledCount() === 1)"
      (change)="onFlowToggle(setting.flow)"
    ></ignt-toggle>
  </div>
</ng-template>
