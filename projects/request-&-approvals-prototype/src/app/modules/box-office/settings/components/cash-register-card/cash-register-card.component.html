<div class="onsite-setup-card" data-testid="onsite-setup-card">
  <div class="onsite-setup-card__name" data-testid="onsite-setup-card-name">
    {{ cashRegister.name }}
  </div>
  <div class="onsite-setup-card__actions" data-testid="onsite-setup-card-actions">
    <button
      class="onsite-setup-card__icon-button"
      data-testid="cash-register-card-edit"
      ignt-icon-button
      size="small"
      [icon]="['fas', 'edit']"
      sentiment="tertiary"
      (click)="edit.emit(cashRegister)"
    ></button>
    <button
      class="onsite-setup-card__icon-button"
      data-testid="cash-register-card-delete"
      ignt-icon-button
      size="small"
      [icon]="['fas', 'trash']"
      sentiment="tertiary"
      variant="danger"
      (click)="delete.emit(cashRegister)"
    ></button>
  </div>
</div>
