@if (showChannelSelector()) {
  <div class="common-session-edit__form">
    <div class="input-inline">
      <div class="form-group form-switch-group">
        <label class="form-label" translate>{{ 'boxOffice.settings.actions.onsiteSetup.channelId.label' }}</label>
        <div class="form-value">
          <span class="description" translate>{{ 'boxOffice.settings.actions.onsiteSetup.channelId.description' }}</span>
        </div>
        <app-filter-select
          [options]="channelSelectOptions()"
          [preloadedOption]="selectedChannelOption()"
          (selected)="selectChannel($event)"
          data-testid="onsite-setup-channel"
        >
        </app-filter-select>
      </div>
    </div>
  </div>
}
