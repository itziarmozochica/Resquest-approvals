<section
  class="payment-configuration-delegated-editor"
  [class.payment-configuration-delegated-editor--redesign]="redesign()"
  data-testid="payment-configuration-delegated-editor"
>
  <header class="payment-configuration-delegated-editor__section-header">
    <h3 class="payment-configuration-delegated-editor__title" data-testid="payment-configuration-delegated-editor-title">
      {{ 'paymentConfig.editor.delegated.title' | translate }}
    </h3>
    <p class="payment-configuration-delegated-editor__helper" data-testid="payment-configuration-delegated-editor-helper">
      {{ 'paymentConfig.editor.delegated.helper' | translate }}
    </p>
  </header>

  <div
    [class.payment-configuration-delegated-editor__panel]="!redesign()"
    [class.payment-configuration-delegated-editor__panel--error]="!redesign() && requiredError()"
    [class.payment-configuration-delegated-editor__methods]="redesign()"
  >
    @if (redesign()) {
      <app-method-switch-list
        scope="delegated"
        [methods]="delegatedMethods()"
        [selectedMethodCodes]="selectedMethodCodes()"
        [showError]="requiredError()"
        (selectionChange)="selectionChange.emit($event)"
      />
    } @else {
      <span class="payment-configuration-delegated-editor__list-label" data-testid="payment-configuration-delegated-editor-list-label">
        {{ 'paymentConfig.editor.delegated.listLabel' | translate }}
      </span>
      <app-method-checklist
        scope="delegated"
        [methods]="delegatedMethods()"
        [selectedMethodCodes]="selectedMethodCodes()"
        [showError]="requiredError()"
        (selectionChange)="selectionChange.emit($event)"
      />
    }
  </div>
</section>
