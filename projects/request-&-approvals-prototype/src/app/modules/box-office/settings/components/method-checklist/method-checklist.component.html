@if (methods().length > 0) {
  <ignt-input-field
    class="method-checklist__search"
    type="text"
    [leadIcon]="['fal', 'search']"
    [attr.data-testid]="testIdPrefix() + '-search'"
    [label]="i18nPrefix() + '.searchLabel' | translate"
    [placeholder]="i18nPrefix() + '.searchPlaceholder' | translate"
    [ngModel]="searchTerm()"
    (ngModelChange)="searchTerm.set($event)"
  />
}

<ul class="method-checklist__list" [style.--method-rows]="methodRows()" [attr.data-testid]="testIdPrefix() + '-list'">
  @for (method of filteredMethods(); track method.code) {
    <li class="method-checklist__item">
      <ignt-checkbox
        [label]="method.name"
        [checked]="isSelected(method.code)"
        [disabled]="disabled()"
        [dataTestId]="testIdPrefix() + '-method-' + method.code"
        (change)="onToggle(method.code, $event)"
      ></ignt-checkbox>
    </li>
  } @empty {
    @if (!showError()) {
      <li class="method-checklist__empty" [attr.data-testid]="testIdPrefix() + '-empty'">
        {{ i18nPrefix() + '.empty' | translate }}
      </li>
    }
  }
</ul>

<ignt-field-error [showError]="showError()" [attr.data-testid]="testIdPrefix() + '-error'">
  {{ i18nPrefix() + '.requiredError' | translate }}
</ignt-field-error>
