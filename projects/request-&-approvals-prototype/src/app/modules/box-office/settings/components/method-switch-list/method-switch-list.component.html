<ul class="method-switch-list__list" [attr.data-testid]="testIdPrefix() + '-list'">
  @for (method of methods(); track method.code) {
    <li class="method-switch-list__item">
      <span class="method-switch-list__name">{{ method.name }}</span>
      <ignt-switch
        [attr.data-testid]="testIdPrefix() + '-method-' + method.code"
        [ariaLabel]="method.name"
        [checked]="isSelected(method.code)"
        [disabled]="disabled()"
        (checkedChange)="onToggle(method.code, $event)"
      />
    </li>
  } @empty {
    @if (!showError()) {
      <li class="method-switch-list__empty" [attr.data-testid]="testIdPrefix() + '-empty'">
        {{ i18nPrefix() + '.empty' | translate }}
      </li>
    }
  }
</ul>

<ignt-field-error [showError]="showError()" [attr.data-testid]="testIdPrefix() + '-error'">
  {{ i18nPrefix() + '.requiredError' | translate }}
</ignt-field-error>
