<section class="shift-notes">
  @if (isEditing()) {
    <ignt-textarea-field
      class="shift-notes__field"
      data-testid="shift-notes-input"
      [formControl]="notesControl"
      [label]="'boxOffice.shiftDetail.notes.title' | translate"
      [maxlength]="maxLength"
      [placeholder]="'boxOffice.shiftDetail.notes.placeholder' | translate"
    ></ignt-textarea-field>
    <div class="shift-notes__actions">
      <ignt-button
        data-testid="shift-notes-cancel"
        size="small"
        variant="tertiary"
        [disabled]="isSaving()"
        [label]="'common.cancel' | translate"
        (click)="cancelEditing()"
      />
      <ignt-button
        data-testid="shift-notes-save"
        size="small"
        variant="secondary"
        [disabled]="notesControl.invalid"
        [label]="(savedNotes() ? 'common.save' : 'boxOffice.shiftDetail.notes.addButton') | translate"
        [loading]="isSaving()"
        (click)="save()"
      />
    </div>
  } @else {
    <div class="shift-notes__content">
      <h2 class="shift-notes__title">{{ 'boxOffice.shiftDetail.notes.title' | translate }}</h2>
      <p class="shift-notes__text" data-testid="shift-notes-text">
        {{ savedNotes() || ('boxOffice.shiftDetail.notes.empty' | translate) }}
      </p>
    </div>
    <ignt-button
      data-testid="shift-notes-edit"
      size="small"
      variant="secondary"
      [label]="'boxOffice.shiftDetail.notes.editButton' | translate"
      (click)="startEditing()"
    />
  }
</section>
