<section class="shift-sales-stats">
  <h2 class="shift-sales-stats__title">{{ 'boxOffice.shiftDetail.paymentSummary.salesSummary' | translate }}</h2>
  <dl class="shift-sales-stats__stats">
    <div class="shift-sales-stats__stat">
      <dt class="shift-sales-stats__label">{{ 'boxOffice.shiftDetail.paymentSummary.ticketsSold' | translate }}</dt>
      <dd class="shift-sales-stats__value" data-testid="shift-sales-stats-sold">{{ totals().ticketsSoldCount }}</dd>
    </div>
    <div class="shift-sales-stats__stat">
      <dt class="shift-sales-stats__label">{{ 'boxOffice.shiftDetail.paymentSummary.ticketsRefunded' | translate }}</dt>
      <dd class="shift-sales-stats__value" data-testid="shift-sales-stats-refunded">{{ totals().ticketsCancelledCount }}</dd>
    </div>
  </dl>
</section>
