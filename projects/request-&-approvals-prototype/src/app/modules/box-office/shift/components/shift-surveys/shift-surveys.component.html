<div class="shift-surveys" *ngIf="shiftSurveys">
  <div class="shift-surveys__header">
    <div class="shift-surveys__header__title" translate>boxOffice.shiftDetail.survey.title</div>
    <div class="shift-surveys__header__subtitle">
      {{ 'boxOffice.shiftDetail.survey.totalAnswered' | translate: { value: shiftSurveys.totalCount } }}
    </div>
  </div>

  <div class="shift-surveys__body">
    <div class="shift-surveys__body__overall-reaction">
      <img [src]="shiftSurveys.overallReactionFaceFilePath" alt="overall reaction icon" />
      <p translate>boxOffice.shiftDetail.survey.overallReaction</p>
    </div>

    <table class="shift-surveys__body__results">
      <tr class="shift-surveys__body__results__row" *ngFor="let result of shiftSurveys.results">
        <td class="shift-surveys__body__results__row__result">
          <img [src]="result.faceFilePath" alt="face icon" />
          <div>{{ result.name }}</div>
        </td>
        <td class="shift-surveys__body__results__row__progress-bar">
          <progress
            class="progress shift-surveys__body__results__row__progress-bar__progress"
            value="{{ result.value }}"
            max="{{ result.maxCount }}"
          ></progress>
        </td>
        <td class="shift-surveys__body__results__row__percentage">{{ result.value }} ({{ result.percentage }}%)</td>
      </tr>
    </table>
  </div>
</div>
