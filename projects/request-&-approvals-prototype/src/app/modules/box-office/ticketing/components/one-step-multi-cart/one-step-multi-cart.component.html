<div class="one-step-multi-cart">
  <div class="one-step-multi-cart__content">
    <div class="one-step-multi-cart__cart">
      <div class="one-step-multi-cart__cart__header">
        <div class="one-step-multi-cart__cart__header__title">
          <span class="font-h4" translate>{{ 'boxOffice.cart.title' }}</span>
          <ng-container *ngIf="canClear">
            <a class="font-small-bold" igntLink (click)="clearAll()" translate>
              {{ 'boxOffice.cart.clearAll' }}
            </a>
          </ng-container>
        </div>
      </div>
      <div class="one-step-multi-cart__cart__details">
        <ng-container *ngIf="!isEmptyCart()">
          <app-one-step-multi-cart-detail
            [cartSessionsByMainPlanAndDatetime]="getCartSessionsByMainPlanAndDatetime()"
            [currentPlanId]="currentPlanId"
            (goToMainPlanClicked)="goToMainPlan($event)"
          />
          <ng-container *ngIf="couponDiscount && showPrice">
            <app-coupon-cart-card
              [coupon]="couponDiscount"
              [useMultiCartDesign]="true"
              (removeCoupon)="removeCoupon()"
            ></app-coupon-cart-card>
          </ng-container>
        </ng-container>
        <ng-container *ngIf="isEmptyCart() && isLoadingCart">
          <div class="loading">
            <span class="loading__icon">
              <ignt-icon class="loader" name="spinner" variant="solid" size="display" [spin]="true" aria-hidden="true" />
            </span>
          </div>
        </ng-container>
        <ng-container *ngIf="isEmptyCart() && !isLoadingCart">
          <div class="one-step-multi-cart__cart__details__empty-cart" data-testid="empty-cart-placeholder">
            <ignt-icon
              name="receipt"
              variant="light"
              size="display"
              class="one-step-multi-cart__cart__details__empty-cart__icon"
              aria-hidden="true"
            />
            <p class="one-step-multi-cart__cart__details__empty-cart__label" translate>boxOffice.cart.empty</p>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
  <app-one-step-cart-footer
    *ngIf="!isEmptyCart() || isLoadingCart"
    class="one-step-multi-cart__footer"
    [currentCart]="currentCart"
    [cartTotalMoney]="cartTotalMoney"
    [showCoupon]="showCoupon"
    [showCommonPaymentButton]="showCommonPaymentButton"
    [addSessionsToCartIsDisabled]="addSessionsToCartIsDisabled"
    [couponCodeApplied$]="couponCodeApplied$"
    [couponError]="couponError"
    [paymentConfiguration]="paymentConfiguration"
    [onsiteSetupSelected]="onsiteSetupSelected"
    [paymentTypes]="paymentTypes"
    [isSplitPaymentEnabled]="isSplitPaymentEnabled()"
    [fullPaymentCashAvailable]="fullPaymentCashAvailable()"
    [fullPaymentIntegratedAvailable]="fullPaymentIntegratedAvailable()"
    (couponCode)="applyCouponDiscount($event.code, $event.lazyCouponType)"
    (simplePayClicked)="simplePayClick()"
    (payClicked)="clickOnPay($event)"
    (paymentOptionsRequested)="onPaymentOptionsRequested()"
    (fullPaymentCashRequested)="onFullPaymentCashRequested()"
    (fullPaymentIntegratedRequested)="onFullPaymentIntegratedRequested()"
  />
</div>
