<div class="one-step-multi-cart-detail-main-plan">
  <div class="one-step-multi-cart-detail-main-plan__block">
    <ng-container *ngIf="!loadingMainPlan">
      <ng-container *ngIf="!hideMainPlan && mainPlan">
        <div class="main-plan-detail-header">
          <img
            class="main-plan-detail-header__img"
            alt="{{ mainPlan.name }} - Cover image"
            src="{{ mainPlan.pictureURL }}"
            width="48"
            height="48"
          />
          <div class="main-plan-detail-header__details">
            <div class="main-plan-detail-header__info">
              <div class="main-plan-detail-header__name">{{ mainPlan.name }}</div>
              <div class="main-plan-detail-header__supporting-text" *ngIf="mainPlan.firstPlace">
                <fa-icon [fixedWidth]="true" [icon]="['far', 'map-marker-alt']"></fa-icon>
                <span>
                  <ng-container *ngIf="venue()">
                    <ng-container
                      *ngTemplateOutlet="venueName; context: { city: venue()?.city?.name, address: venue()?.address }"
                    ></ng-container>
                  </ng-container>
                  <ng-container *ngIf="!venue()">
                    <ng-container
                      *ngTemplateOutlet="
                        venueName;
                        context: {
                          city: mainPlan.firstPlace.cityName,
                          address: mainPlan?.hasMultiplePlaces ? ('listPlan.multipleVenues' | translate) : mainPlan.firstPlace.addressName,
                        }
                      "
                    ></ng-container>
                  </ng-container>
                  <ng-template #venueName let-city="city" let-address="address">
                    {{ city | cityTranslate }} -
                    {{ address }}
                  </ng-template>
                </span>
              </div>
              <div class="main-plan-detail-header__supporting-text" *ngIf="mainPlan.isTimeless()">
                <fa-icon [fixedWidth]="true" [icon]="['far', 'history']"></fa-icon>
                <span>{{ 'listPlan.timeless' | translate }}</span>
              </div>
              <div class="main-plan-detail-header__supporting-text" *ngIf="mainPlan.isWaitlist()">
                <fa-icon [fixedWidth]="true" [icon]="['far', 'clipboard-list']"></fa-icon>
                <span>{{ 'listPlan.waitlist' | translate }}</span>
              </div>
            </div>
            <div class="main-plan-detail-header__link d-none" (click)="goToMainPlan()">
              <fa-icon
                class="main-plan-detail-header__link__icon"
                [fixedWidth]="true"
                [size]="'sm'"
                [icon]="['fal', 'external-link']"
              ></fa-icon>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-container *ngFor="let mainPlanDatetimeCartSessions of mainPlanCartSessionsByDatetime | keyvalue; trackBy: trackByIndex">
        <ng-container *ngIf="mainPlanDatetimeCartSessions">
          <app-one-step-multi-cart-detail-sessions
            [label]="getLabelForDatetimeSessions(mainPlanDatetimeCartSessions)"
            [cartSessions]="mainPlanDatetimeCartSessions.value"
          />
        </ng-container>
      </ng-container>
    </ng-container>
  </div>
</div>
