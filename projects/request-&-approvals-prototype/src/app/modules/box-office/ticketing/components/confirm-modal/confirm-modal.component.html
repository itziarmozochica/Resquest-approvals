<div class="confirm-modal">
  <div data-testid="confirm-modal-title" class="confirm-modal__title">
    {{ config.title }}
  </div>

  <div class="confirm-modal__separator"></div>

  <div data-testid="confirm-modal-message" class="confirm-modal__message">
    {{ config.message }}
  </div>

  <div class="confirm-modal__footer">
    <button igntButton sentiment="secondary" variant="danger" data-testid="confirm-modal-left-button" (click)="response.emit(false)">
      {{ config.leftButtonText }}
    </button>
    <button igntButton data-testid="confirm-modal-right-button" (click)="response.emit(true)">
      {{ config.rightButtonText }}
    </button>
  </div>
</div>
