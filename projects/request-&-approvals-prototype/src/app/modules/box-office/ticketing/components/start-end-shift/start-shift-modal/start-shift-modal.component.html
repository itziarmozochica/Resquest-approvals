<div class="start-shift" data-testid="start-shift-modal" (keydown.enter)="handleEnterKey($event)">
  <div class="start-shift__title">
    {{ 'boxOffice.shifts.startModal.title' | translate }}
  </div>

  <div class="start-shift__separator"></div>

  <div class="start-shift__register">
    <div class="start-shift__register-heading">
      {{ 'boxOffice.shifts.startModal.cashRegisterInputTag' | translate }}
    </div>
    <label class="start-shift__register-label">
      {{ 'boxOffice.shifts.startModal.cashRegisterInputPlaceholder' | translate }}<span class="start-shift__required">*</span>
    </label>
    <div data-testid="start-shift-cash-register-input" class="start-shift__register-input">
      <app-typeahead
        [emptyLabel]="'common.selectsPlaceholder' | translate"
        [options]="cashRegisterOptions"
        [editable]="false"
        [selectedOption]="selectedCashRegister"
        (selected)="selectedCashRegister = $event"
      >
      </app-typeahead>
    </div>
  </div>

  @if (shouldShowCashManagement) {
    <div class="start-shift__amount">
      <div class="start-shift__amount-heading">
        {{ 'boxOffice.shifts.startModal.initialCashInputTag' | translate }}
      </div>
      <div class="start-shift__amount-input">
        <input
          data-testid="start-shift-cash-amount-input"
          appAutoformatNumericInput
          [currency]="inputCurrency"
          [placeHolderValue]="'boxOffice.shifts.startModal.initialCashInputPlaceholder' | translate"
          min="0"
          [max]="maxCashAmount"
          (rawValue)="initialAmount = $event"
        />
      </div>
    </div>
  }

  <div class="start-shift__footer">
    <button igntButton sentiment="secondary" variant="danger" data-testid="start-shift-cancel-button" (click)="cancel()">
      {{ 'common.cancel' | translate | uppercase }}
    </button>
    <button igntButton data-testid="start-shift-accept-button" (click)="start()" [disabled]="isStartDisabled">
      {{ 'boxOffice.shifts.startModal.startButton' | translate | uppercase }}
    </button>
  </div>
</div>
