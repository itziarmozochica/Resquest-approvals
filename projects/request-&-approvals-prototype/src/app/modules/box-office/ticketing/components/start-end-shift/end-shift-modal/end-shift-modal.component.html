<div data-testid="end-shift-modal" class="end-shift" (keydown.enter)="handleEnterKey($event)">
  <div class="end-shift__title">
    {{ 'boxOffice.shifts.endModal.title' | translate }}
  </div>

  @if (shouldShowCashManagement) {
    <div class="end-shift__amount">
      <div class="end-shift__amount-label">
        {{ 'boxOffice.shifts.endModal.finalCashInputTag' | translate }}
      </div>
      <div class="end-shift__amount-input">
        <input
          data-testid="end-shift-cash-amount-input"
          [currency]="inputCurrency"
          [placeHolderValue]="0"
          appAutoformatNumericInput
          min="0"
          [max]="maxCashAmount"
          (rawValue)="finalAmount = $event"
        />
      </div>
    </div>
  }

  @if (showCloseFiscalDayOption) {
    <label class="end-shift__close-day" data-testid="end-shift-close-fiscal-day">
      <input type="checkbox" [(ngModel)]="closeFiscalDay" data-testid="end-shift-close-fiscal-day-checkbox" />
      {{ 'boxOffice.shifts.endModal.closeFiscalDay' | translate }}
    </label>
  }

  <div class="end-shift__footer">
    <button igntButton sentiment="secondary" data-testid="end-shift-cancel-button" (click)="cancel()">
      {{ 'common.cancel' | translate | uppercase }}
    </button>
    <button igntButton data-testid="end-shift-accept-button" (click)="end()">
      {{ 'boxOffice.shifts.endModal.endButton' | translate | uppercase }}
    </button>
  </div>
</div>
