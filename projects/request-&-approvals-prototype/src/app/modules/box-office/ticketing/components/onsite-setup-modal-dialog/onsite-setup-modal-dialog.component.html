<div class="onsite-setup" data-testid="onsite-setup-modal-dialog">
  @if (!loadingPlaces()) {
    <div class="onsite-setup__title">
      {{ title() | translate }}
    </div>
    <div class="onsite-setup__setup">
      @if (showVenuePicker()) {
        <div class="form-group">
          <label class="form-label">{{ 'common.venue' | translate }}</label>
          <div data-testid="onsite-setup-setup-input" class="onsite-setup__setup-input">
            <app-typeahead
              [emptyLabel]="'common.venue' | translate"
              [options]="placeOptions()"
              [editable]="true"
              [preloadedOption]="selectedPlace()"
              (selected)="selectPlace($event)"
              class="form-input"
            >
            </app-typeahead>
          </div>
        </div>
        @if (!loadingOnsiteSetups()) {
          @if (onsiteSetupOptions()?.length > 0) {
            <div class="form-group">
              <label class="form-label">{{ 'boxOffice.setup.modal.placeholder' | translate }}</label>
              <div data-testid="onsite-setup-setup-input" class="onsite-setup__setup-input">
                <app-typeahead
                  [emptyLabel]="'boxOffice.setup.modal.placeholder' | translate"
                  [options]="onsiteSetupOptions()"
                  [editable]="true"
                  [disabled]="!selectedPlace()"
                  [preloadedOption]="selectedOnsiteSetupOption()"
                  (selected)="selectedOnsiteSetupOption.set($event)"
                >
                </app-typeahead>
              </div>
            </div>
          }
        } @else {
          <div data-testid="obo-onsite-setup-modal-loading" class="spinner">
            <ignt-icon class="loader" name="spinner" variant="solid" size="display" />
          </div>
        }
      }
      @if (warningBody(); as warning) {
        <div data-testid="onsite-setup-warning">
          <p>{{ warning | translate }}</p>
        </div>
      }
    </div>
    <div class="onsite-setup__footer">
      <ignt-button
        data-testid="onsite-setup-accept-button"
        [label]="'common.accept' | translate"
        [disabled]="isAcceptDisabled()"
        (click)="accept()"
      />
    </div>
  } @else {
    <div data-testid="obo-onsite-setup-modal-loading" class="spinner">
      <ignt-icon class="loader" name="spinner" variant="solid" size="display" />
    </div>
  }
</div>
