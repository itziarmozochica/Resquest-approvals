<div class="modal-body modal__content" [trackView]="trackViewEvent ?? undefined">
  <div class="modal__title" data-testid="modal-title">
    {{ 'boxOffice.cashCalculator.title' | translate }}
  </div>
  <div class="modal__subtitle" data-testid="modal-subtitle" *ngIf="cashModalMandatory">
    {{ 'boxOffice.cashCalculator.mandatoryInstructions' | translate }}
  </div>
  <app-cash-change-calculator
    [showCartTotalAmount]="true"
    [cashReceivedRequired]="cashModalMandatoryInternal()"
    [cart]="cart"
    (cashReceived)="onCashReceived($event)"
    data-testid="checkout-cash-calculator"
    class="modal__cash-calculator"
  ></app-cash-change-calculator>
  <div class="modal__actions">
    <button igntButton variant="danger" sentiment="secondary" data-testid="modal-cancel-button" (click)="cancel()">
      {{ 'common.cancel' | translate }}
    </button>
    <button
      *ngIf="showConfirmPaymentButton(); else skipButtonTemplate"
      data-testid="modal-accept-button"
      igntButton
      [disabled]="isConfirmPaymentButtonDisabled()"
      (click)="close()"
    >
      {{ 'boxOffice.cashCalculator.confirmPayment' | translate }}
    </button>

    <ng-template #skipButtonTemplate>
      <button igntButton data-testid="modal-skip-button" (click)="close()">
        {{ 'common.skip' | translate }}
      </button>
    </ng-template>
  </div>
</div>
