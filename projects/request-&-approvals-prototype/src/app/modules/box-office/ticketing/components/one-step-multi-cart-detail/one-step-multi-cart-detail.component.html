<div class="one-step-multi-cart-detail">
  <div class="one-step-multi-cart-detail__block">
    <ng-container *ngIf="cartSessionsByMainPlanAndDatetime">
      <ng-container *ngFor="let mainPlanCartSessionsByDatetime of cartSessionsByMainPlanAndDatetime | keyvalue; trackBy: trackByMainPlanId">
        <app-one-step-multi-cart-detail-main-plan
          [mainPlanId]="mainPlanCartSessionsByDatetime.key"
          [mainPlanCartSessionsByDatetime]="mainPlanCartSessionsByDatetime.value"
          [hideMainPlan]="shouldHideMainPlan(mainPlanCartSessionsByDatetime.key)"
          (goToMainPlanClicked)="goToMainPlan($event)"
        />
      </ng-container>
    </ng-container>
  </div>
</div>
