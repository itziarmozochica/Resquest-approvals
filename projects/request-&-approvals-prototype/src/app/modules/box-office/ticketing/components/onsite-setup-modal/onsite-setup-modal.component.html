<div class="onsite-setup">
  <ng-container *ngIf="!loadingPlaces; else loading">
    <div class="onsite-setup__title">
      {{ title | translate }}
    </div>
    <div class="onsite-setup__setup">
      <ng-container *ngIf="!this.currentActiveShift; else warningMessage">
        <div class="form-group">
          <label class="form-label">{{ 'common.venue' | translate }}</label>
          <div data-testid="onsite-setup-setup-input" class="onsite-setup__setup-input">
            <app-typeahead
              [emptyLabel]="'common.venue' | translate"
              [options]="placeOptions"
              [editable]="true"
              [preloadedOption]="selectedPlace"
              (selected)="selectPlace($event)"
              class="form-input"
            >
            </app-typeahead>
          </div>
        </div>
        <ng-container *ngIf="!loadingOnsiteSetups; else loading">
          <ng-container *ngIf="onsiteSetupOptions?.length > 0; else warningMessage">
            <div class="form-group">
              <label class="form-label">{{ 'boxOffice.setup.modal.placeholder' | translate }}</label>
              <div data-testid="onsite-setup-setup-input" class="onsite-setup__setup-input">
                <app-typeahead
                  [emptyLabel]="'boxOffice.setup.modal.placeholder' | translate"
                  [options]="onsiteSetupOptions"
                  [editable]="true"
                  [disabled]="!selectedPlace"
                  [preloadedOption]="selectedOnsiteSetupOption"
                  (selected)="selectedOnsiteSetupOption = $event"
                >
                </app-typeahead>
              </div>
            </div>
          </ng-container>
        </ng-container>
      </ng-container>
    </div>
    <div class="onsite-setup__footer">
      <button
        igntButton
        data-testid="onsite-setup-accept-button"
        (click)="accept()"
        [disabled]="
          ((hasHiddenSetupsOnly || loadingOnsiteSetups) && !currentActiveShift) ||
          (!selectedPlace && onsiteSetupList?.length === 0) ||
          (!selectedOnsiteSetupOption && onsiteSetupList?.length > 0 && !currentActiveShift)
        "
      >
        {{ 'common.accept' | translate }}
      </button>
    </div>
  </ng-container>
</div>

<ng-template #warningMessage>
  <div>
    <p>{{ warningBody | translate }}</p>
  </div>
</ng-template>

<ng-template #loading>
  <div data-testid="obo-onsite-setup-modal-loading" class="spinner">
    <fa-icon class="loader" [icon]="['fas', 'spinner']" [size]="'3x'"></fa-icon>
  </div>
</ng-template>
