<article class="approval-legal-consent">
  <header class="approval-legal-consent__header">{{ 'boxOffice.cashRegisterReports.approvalConsentTitle' | translate }}</header>

  <div class="approval-legal-consent__icon">
    <fa-icon [icon]="['fas', 'exclamation-triangle']" />
  </div>

  <h2 class="approval-legal-consent__subtitle">{{ 'boxOffice.cashRegisterReports.approvalConsentSubtitle' | translate }}</h2>

  <p class="approval-legal-consent__description">{{ 'boxOffice.cashRegisterReports.approvalConsentDescription' | translate }}</p>

  <footer class="approval-legal-consent__actions">
    <button class="approval-legal-consent__action" igntButton sentiment="tertiary" [fill]="true" (click)="cancel()">
      {{ 'common.cancel' | translate }}
    </button>
    <button class="approval-legal-consent__action" igntButton sentiment="primary" [fill]="true" (click)="approve()">
      {{ 'boxOffice.cashRegisterReports.approvalConsentApproveButton' | translate }}
    </button>
  </footer>
</article>
