<div class="lateral-slider-body__wrapper">
  <form [formGroup]="flagForm" class="flag-report-form">
    <ignt-input-field
      data-testid="flag-report-title"
      formControlName="title"
      [label]="'boxOffice.cashRegisterReports.flagForm.titleLabel' | translate"
      [placeholder]="'boxOffice.cashRegisterReports.flagForm.titlePlaceholder' | translate"
      [customFormErrors]="[
        {
          type: 'required',
          message: ('boxOffice.cashRegisterReports.flagForm.titleRequired' | translate),
        },
        {
          type: 'maxlength',
          message: ('form.error.maxLength' | translate: { value: 200 }),
        },
      ]"
    />

    <ignt-textarea-field
      id="flag-description"
      data-testid="flag-report-description"
      formControlName="description"
      [label]="'boxOffice.cashRegisterReports.flagForm.descriptionLabel' | translate"
      [placeholder]="'boxOffice.cashRegisterReports.flagForm.descriptionPlaceholder' | translate"
      [rows]="6"
      [maxlength]="1000"
      [customFormErrors]="[
        {
          type: 'required',
          message: ('boxOffice.cashRegisterReports.flagForm.descriptionRequired' | translate),
        },
        {
          type: 'maxlength',
          message: ('form.error.maxLength' | translate: { value: 1000 }),
        },
      ]"
    />
  </form>
</div>

<div class="lateral-slider-body__footer">
  <button
    igntButton
    sentiment="primary"
    [fill]="true"
    data-testid="flag-report-submit-button"
    [disabled]="flagForm.invalid"
    (click)="submit()"
  >
    {{ 'boxOffice.cashRegisterReports.flagForm.submit' | translate }}
  </button>
</div>
