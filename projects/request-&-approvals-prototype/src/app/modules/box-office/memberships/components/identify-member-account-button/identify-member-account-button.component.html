<div class="identify-member-account">
  @if (badge(); as badge) {
    <ignt-button
      class="identify-member-account__button identify-member-account__button--badge"
      variant="secondary"
      sentiment="neutral"
      data-testid="identify-member-account-badge"
      data-dd-action-name="Identified member account badge"
      [class.identify-member-account__button--with-holder]="hasHolderName()"
      [label]="badge.key | translate: badge.params"
      [ariaLabel]="badge.key | translate: badge.params"
      [attr.title]="badge.key | translate: badge.params"
      [leadingIcon]="addressCardIcon()"
      (click)="identifyMemberAccount.emit()"
    ></ignt-button>
    <ignt-button
      class="identify-member-account__button identify-member-account__button--icon-only"
      variant="secondary"
      sentiment="neutral"
      data-testid="identify-member-account-remove-button"
      label=""
      [ariaLabel]="'boxOffice.memberAccount.removeConfirmation.button' | translate"
      [attr.title]="'boxOffice.memberAccount.removeConfirmation.button' | translate"
      [leadingIcon]="timesIcon"
      (click)="removeMemberAccount.emit()"
    ></ignt-button>
  } @else {
    <ignt-button
      class="identify-member-account__button identify-member-account__button--icon-only"
      variant="secondary"
      data-testid="identify-member-account-button"
      label=""
      [ariaLabel]="'boxOffice.memberAccount.identify.button' | translate"
      [attr.title]="'boxOffice.memberAccount.identify.button' | translate"
      [trailingIcon]="addressCardIcon()"
      (click)="identifyMemberAccount.emit()"
    ></ignt-button>
  }
</div>
