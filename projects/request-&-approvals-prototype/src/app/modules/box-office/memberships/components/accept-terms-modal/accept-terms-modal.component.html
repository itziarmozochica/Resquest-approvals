<ignt-dialog-header data-testid="memberships-accept-terms-modal-title">
  {{ 'boxOffice.contactInformation' | translate }}
</ignt-dialog-header>

<ignt-dialog-content data-testid="memberships-accept-terms-modal-content">
  <div class="memberships-accept-terms-modal__prompt">
    <div class="memberships-accept-terms-modal__content-info">
      <p class="memberships-accept-terms-modal__subtitle">{{ 'boxOffice.memberships.contactInformation.subtitle' | translate }}</p>
      <p class="memberships-accept-terms-modal__message">{{ 'boxOffice.memberships.contactInformation.label' | translate }}</p>
    </div>
    <form class="memberships-accept-terms-modal__form" [formGroup]="formGroup">
      @if (email) {
        <ignt-input-field id="email" type="text" formControlName="email" [label]="'boxOffice.email' | translate" />
      }
      <ignt-input-field id="fullName" type="text" formControlName="fullName" [label]="'memberships.programmes.form.name' | translate" />
    </form>
    <div class="memberships-accept-terms-modal__checkbox">
      <span class="memberships-accept-terms-modal__checkbox-icon">
        <ignt-icon name="check" variant="solid" size="caption" [fixedWidth]="true" aria-hidden="true" />
      </span>
      <p class="memberships-accept-terms-modal__checkbox-label">{{ 'boxOffice.termsAndConditionsDescription' | translate }}</p>
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    data-testid="memberships-accept-terms-modal-accept-terms-button"
    variant="primary"
    [label]="'boxOffice.goToCheckout' | translate"
    (click)="acceptTerms()"
  />
</ignt-dialog-footer>
