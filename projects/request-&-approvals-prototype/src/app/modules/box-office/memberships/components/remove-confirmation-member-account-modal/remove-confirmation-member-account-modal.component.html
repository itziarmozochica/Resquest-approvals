<ignt-dialog-header data-testid="remove-confirmation-member-account-modal-title">
  {{ 'boxOffice.memberAccount.removeConfirmation.modal.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content data-testid="remove-confirmation-member-account-modal-message">
  {{ 'boxOffice.memberAccount.removeConfirmation.modal.message' | translate }}
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    fill
    variant="tertiary"
    data-testid="remove-confirmation-member-account-modal-cancel-button"
    [label]="'boxOffice.memberAccount.removeConfirmation.modal.cancel' | translate"
    (click)="closeModal()"
  />
  <ignt-button
    fill
    variant="primary"
    sentiment="danger"
    data-testid="remove-confirmation-member-account-modal-confirm-button"
    [label]="'boxOffice.memberAccount.removeConfirmation.modal.confirm' | translate"
    (click)="removeMemberAccount()"
  />
</ignt-dialog-footer>
