<div class="remove-confirmation-member-modal">
  <div class="remove-confirmation-member-modal__header">
    <div data-testid="remove-confirmation-member-modal-title" class="remove-confirmation-member-modal__title">
      {{ 'boxOffice.memberships.removeConfirmationMember.modal.title' | translate }}
    </div>
    <button
      type="button"
      data-testid="remove-confirmation-member-modal-close-button"
      [attr.aria-label]="'common.close' | translate"
      (click)="closeModal()"
    >
      <ignt-icon name="times" variant="solid" aria-hidden="true" />
    </button>
  </div>

  <div class="remove-confirmation-member-modal__message">
    {{ 'boxOffice.memberships.removeConfirmationMember.modal.message' | translate }}
  </div>

  <div class="remove-confirmation-member-modal__footer">
    <button igntButton sentiment="tertiary" data-testid="remove-confirmation-member-modal-cancel-button" (click)="closeModal()">
      {{ 'boxOffice.memberships.removeConfirmationMember.modal.cancel' | translate }}
    </button>
    <button
      igntButton
      sentiment="primary"
      variant="danger"
      data-testid="remove-confirmation-member-modal-remove-member-button"
      (click)="removeMember()"
    >
      {{ 'boxOffice.memberships.removeConfirmationMember.modal.confirm' | translate }}
    </button>
  </div>
</div>
