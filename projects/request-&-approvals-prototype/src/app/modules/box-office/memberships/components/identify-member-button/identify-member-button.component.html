<div class="identify-member" [class.identify-member--inline]="compact">
  @if (!compact) {
    <div class="identify-member__title" data-testid="memberships-identify-member-title">
      {{ 'boxOffice.memberships.identifyMember.title' | translate }}
    </div>
  }
  @if (membershipsMember(); as membershipsMember) {
    <ignt-button
      class="identify-member__button identify-member__button--remove-member"
      variant="secondary"
      sentiment="neutral"
      [label]="membershipsMember.holder.name"
      [ariaLabel]="('boxOffice.memberships.removeConfirmationMember.modal.confirm' | translate) + ': ' + membershipsMember.holder.name"
      [leadingIcon]="addressCardIcon()"
      [trailingIcon]="timesIcon"
      (click)="removeMember.emit()"
      data-testid="memberships-identify-member-button"
    ></ignt-button>
  } @else {
    <ignt-button
      class="identify-member__button"
      [class.identify-member__button--icon-only]="iconOnly"
      variant="secondary"
      [label]="iconOnly ? '' : ('boxOffice.memberships.identifyMember.button' | translate)"
      [ariaLabel]="iconOnly ? ('boxOffice.memberships.identifyMember.button' | translate) : undefined"
      [trailingIcon]="addressCardIcon()"
      [attr.title]="iconOnly ? ('boxOffice.memberships.identifyMember.button' | translate) : null"
      (click)="identifyMember.emit()"
      data-testid="memberships-identify-member-button"
    ></ignt-button>
  }
</div>
