<div class="gift-aid-modal">
  <div class="gift-aid-modal__container">
    <div class="gift-aid-modal__header">
      <div class="gift-aid-modal__title" data-testid="modal-title">{{ data.title }}</div>
    </div>
    <div class="gift-aid-modal__content">
      <p class="gift-aid-modal__message" data-testid="modal-message">{{ data.message }}</p>
    </div>
    <div class="gift-aid-modal__footer">
      <button *ngIf="data.cancelButtonLabel" igntButton sentiment="tertiary" (click)="onCancel()" data-testid="modal-cancel-button">
        {{ data.cancelButtonLabel }}
      </button>
      <button igntButton (click)="onConfirm()" data-testid="modal-accept-button">{{ data.acceptButtonLabel }}</button>
    </div>
  </div>
</div>
