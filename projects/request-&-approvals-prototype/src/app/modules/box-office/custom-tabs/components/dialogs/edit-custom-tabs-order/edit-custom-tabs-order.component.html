<app-centered-dialog
  class="dialog-edit-custom-tabs-order"
  [isVisible]="isVisible()"
  [title]="'boxOffice.customTabs.dialogs.editCustomTabsOrder.title' | translate"
  [footer]="{
    cancelLabel: 'common.cancel' | translate,
    submitLabel: 'common.save' | translate,
    submitDisabled: isActionButtonDisabled(),
  }"
  (closed)="dismiss()"
  (submitted)="submit()"
  [cancelButtonSentiment]="'secondary'"
>
  <div class="edit-tabs-order-content">
    <div class="edit-tabs-order-content__header">
      <div class="edit-tabs-order-content__header__title">
        {{ 'boxOffice.customTabs.dialogs.editCustomTabsOrder.headerTitle' | translate }}
      </div>
      <div class="edit-tabs-order-content__header__description">
        {{ 'boxOffice.customTabs.dialogs.editCustomTabsOrder.description' | translate }}
      </div>
    </div>
    <div class="edit-tabs-order-content__draggable-list-container">
      <app-vertical-draggable-list
        [boundarySelector]="'.edit-tabs-order-content'"
        [itemTemplate]="tabItemContentTemplate"
        [items]="orderedTabs()"
        [isItemDisabled]="isTabDisabled"
        [placeholderHeight]="'50px'"
        (itemsReordered)="onItemsReordered($event)"
        [wholeItemDraggable]="true"
      ></app-vertical-draggable-list>
    </div>
  </div>

  <ng-template #tabItemContentTemplate let-element let-index="index">
    <div class="edit-tabs-order-item-content">
      <fa-icon class="edit-tabs-order-item-content__icon" [icon]="getIconProp(element.icon)"></fa-icon>
      <div class="edit-tabs-order-item-content__name">{{ element.name }}</div>
    </div>
  </ng-template>
</app-centered-dialog>
