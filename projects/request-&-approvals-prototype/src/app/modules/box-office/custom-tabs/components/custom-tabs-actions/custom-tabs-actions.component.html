<div class="custom-tabs-actions">
  <div class="custom-tabs-actions__header">
    <div class="custom-tabs-actions__header__title">
      <fa-icon [icon]="header().icon"></fa-icon>
      {{ header().title | translate }}
    </div>
    <div class="custom-tabs-actions__header__description">{{ header().description | translate }}</div>
  </div>
  <div class="custom-tabs-actions__options">
    @for (button of buttons(); track button.actionType) {
      <button
        igntButton
        sentiment="tertiary"
        [variant]="button.variant"
        [leadingIcon]="button.icon"
        (click)="onButtonClick(button.actionType)"
        class="custom-tabs-actions__options__button"
        size="large"
      >
        {{ button.label | translate }}
      </button>
      <div class="custom-tabs-actions__options__button-divider"></div>
    }
  </div>
  <div class="custom-tabs-actions__footer">
    <button igntButton sentiment="primary" (click)="onPublishClick()">
      {{ 'boxOffice.customTabs.actions.publishButton' | translate }}
    </button>
  </div>
</div>
