<div class="custom-tabs-tiles-grid">
  <div class="custom-tabs-tiles-grid__container">
    @if (tiles().length) {
      <div class="custom-tabs-tiles-grid__slides-wrapper" [style.transform]="slideTransform()" [class.is-animating]="isAnimating()">
        @for (page of allPages(); track $index) {
          <div class="custom-tabs-tiles-grid__slide custom-tabs-tiles-grid__grid">
            @for (tileData of page; track tileData.id) {
              <div class="tile-wrapper">
                @if (tabType() === OssCustomTabType.specific_items) {
                  <div class="tile-actions">
                    <div class="tile-action-button-container">
                      <button
                        type="button"
                        class="tile-action-button"
                        (click)="onEditAppearanceClick($event, tileData.originalTileIndex)"
                        [attr.data-testid]="'tile-edit-button-' + tileData.id"
                      >
                        <fa-icon [icon]="['fal', 'edit']"></fa-icon>
                      </button>
                    </div>
                    <div class="tile-action-button-container">
                      <button
                        type="button"
                        class="tile-action-button"
                        (click)="onDeleteTileClick($event, tileData.originalTileIndex)"
                        [attr.data-testid]="'tile-delete-btn-' + tileData.id"
                      >
                        <fa-icon [icon]="['fal', 'trash-alt']"></fa-icon>
                      </button>
                    </div>
                  </div>
                }
                <app-oss-tile
                  [id]="tileData.id"
                  [name]="tileData.name"
                  [type]="tileData.type"
                  [category]="tileData.category"
                  [customColor]="tileData.customColor"
                  [price]="null"
                  [locale]="locale()"
                  [unitsAvailable]="null"
                  [isOutOfStock]="false"
                  [isUnavailable]="false"
                  [variant]="variant()"
                  [attr.data-tile-id]="tileData.tileId"
                  [attr.data-tile-type]="tileData.type"
                  (add)="onTileClick($event)"
                />
              </div>
            }
          </div>
        }
      </div>
    } @else {
      <div class="custom-tabs-tiles-grid__slide custom-tabs-tiles-grid__grid">
        <div class="custom-tabs-tiles-grid__empty" (click)="emptyTabAction.emit()">
          {{ emptyTileMessage() }}
        </div>
      </div>
    }
  </div>

  <div
    class="custom-tabs-tiles-grid__pagination"
    [class.custom-tabs-tiles-grid__pagination--placeholder]="totalPages() <= 1"
    [attr.aria-hidden]="totalPages() > 1 ? null : true"
  >
    <app-page-dot-indicator
      [totalPages]="totalPages()"
      [currentPageIndex]="currentPageIndex()"
      (pageSelected)="onPageSelected($event)"
    ></app-page-dot-indicator>
  </div>
</div>
