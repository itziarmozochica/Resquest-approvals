<div class="code128-barcode">
  <svg
    class="code128-barcode__svg"
    role="img"
    preserveAspectRatio="none"
    shape-rendering="crispEdges"
    xmlns="http://www.w3.org/2000/svg"
    [attr.aria-label]="ariaLabel()"
    [attr.viewBox]="viewBox()"
  >
    <rect class="code128-barcode__background" x="0" y="0" width="100%" height="100%" />
    @for (bar of symbol().bars; track bar.x) {
      <rect
        class="code128-barcode__bar"
        data-testid="code128-bar"
        y="0"
        [attr.x]="bar.x"
        [attr.width]="bar.width"
        [attr.height]="barHeight"
      />
    }
  </svg>
</div>
