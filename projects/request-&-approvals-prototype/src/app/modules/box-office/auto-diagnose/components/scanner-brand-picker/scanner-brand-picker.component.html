<div
  class="scanner-brand-picker"
  role="radiogroup"
  data-testid="scanner-brand-picker"
  [attr.aria-label]="'boxOffice.autoDiagnose.scanner.brand.label' | translate"
>
  <span class="scanner-brand-picker__label">{{ 'boxOffice.autoDiagnose.scanner.brand.label' | translate }}</span>
  @for (option of brands; track option) {
    <ignt-pill-button
      [attr.data-testid]="'scanner-brand-' + option"
      [value]="option"
      [checked]="brand() === option"
      [label]="'boxOffice.autoDiagnose.scanner.brand.options.' + option | translate"
      (checkedChange)="brandChange.emit(option)"
    />
  }
</div>
