<ul class="scanner-check-list" [class.scanner-check-list--compact]="compact()" data-testid="scanner-check-list">
  @for (row of rows(); track row.id) {
    <li class="scanner-check-list__row" [attr.data-outcome]="row.outcome" [attr.data-testid]="'scanner-check-' + row.id">
      <span class="scanner-check-list__icon" aria-hidden="true">
        @switch (row.outcome) {
          @case (outcome.ok) {
            <ignt-icon name="check-circle" variant="solid" size="sm" />
          }
          @case (outcome.failed) {
            <ignt-icon name="times-circle" variant="solid" size="sm" />
          }
          @default {
            <ignt-icon name="info-circle" variant="regular" size="sm" />
          }
        }
      </span>
      <span class="scanner-check-list__text">
        <span class="scanner-check-list__label">{{ row.labelKey | translate }}</span>
        @if (row.detailKey !== null && !compact()) {
          <span class="scanner-check-list__detail">{{ row.detailKey | translate: row.detailParams }}</span>
        }
      </span>
    </li>
  }
</ul>
