<div class="efr-health-check-pending-modal" data-testid="efr-health-check-pending-modal">
  <h5 class="efr-health-check-pending-modal__title" data-testid="efr-health-check-pending-title">
    {{ titleKey | translate }}
  </h5>

  <div class="efr-health-check-pending-modal__spinner">
    <ignt-icon name="spinner" variant="solid" size="display" [spin]="true" aria-hidden="true" />
  </div>

  <p class="efr-health-check-pending-modal__description" data-testid="efr-health-check-pending-description">
    {{ descriptionKey | translate }}
  </p>
</div>
