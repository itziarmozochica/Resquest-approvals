<ignt-dialog-header [hideCloseButton]="true">
  {{ 'boxOffice.order.fiscal.frDuplicate.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p class="france-fiscal-duplicate-reason-popup__description">
    {{ 'boxOffice.order.fiscal.frDuplicate.description' | translate }}
  </p>

  <form [formGroup]="form" class="france-fiscal-duplicate-reason-popup__form">
    <ignt-input-field
      class="france-fiscal-duplicate-reason-popup__input-field"
      formControlName="reason"
      type="text"
      id="frDuplicateReason"
      [label]="'boxOffice.order.fiscal.frDuplicate.reasonLabel' | translate"
      [placeholder]="'boxOffice.order.fiscal.frDuplicate.reasonPlaceholder' | translate"
      data-testid="fr-duplicate-reason-input"
    />
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="tertiary" data-testid="fr-duplicate-cancel-btn" (click)="cancel()">
    {{ 'common.cancel' | translate }}
  </button>
  <button type="button" igntButton sentiment="primary" data-testid="fr-duplicate-confirm-btn" [disabled]="form.invalid" (click)="confirm()">
    {{ 'boxOffice.order.fiscal.frDuplicate.confirm' | translate }}
  </button>
</ignt-dialog-footer>
