<ignt-dialog-header [hideCloseButton]="true">
  {{ (isVoid ? 'boxOffice.fiscal.huRefund.titleVoid' : 'boxOffice.fiscal.huRefund.titleReturn') | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p class="hu-fiscal-refund-popup__description">
    {{ 'boxOffice.fiscal.huRefund.description' | translate }}
  </p>

  <form [formGroup]="form" class="hu-fiscal-refund-popup__form">
    <div class="hu-fiscal-refund-popup__field">
      <span class="hu-fiscal-refund-popup__field-label">
        {{ 'boxOffice.fiscal.huRefund.reasonCode' | translate }}
      </span>
      <ignt-button-dropdown
        class="hu-fiscal-refund-popup__reason-dropdown"
        sentiment="secondary"
        variant="default"
        [fill]="true"
        [autoWidth]="false"
        [options]="reasonCodeOptions"
        (optionClick)="onReasonCodeSelected($event)"
        data-testid="hu-refund-reason-code"
      >
        {{ selectedReasonLabel() }}
      </ignt-button-dropdown>
    </div>

    <ignt-input-field
      class="hu-fiscal-refund-popup__input-field"
      formControlName="customerName"
      type="text"
      [id]="'customerName'"
      [label]="'boxOffice.fiscal.huRefund.customerName' | translate"
    />

    <ignt-input-field
      class="hu-fiscal-refund-popup__input-field"
      formControlName="customerTaxId"
      type="text"
      [id]="'customerTaxId'"
      [label]="'boxOffice.fiscal.huRefund.customerTaxId' | translate"
    />

    <ignt-input-field
      class="hu-fiscal-refund-popup__input-field"
      formControlName="customerAddress"
      type="text"
      [id]="'customerAddress'"
      [label]="'boxOffice.fiscal.huRefund.customerAddress' | translate"
    />

    <div class="hu-fiscal-refund-popup__row">
      <ignt-input-field
        class="hu-fiscal-refund-popup__input-field hu-fiscal-refund-popup__input-field--half"
        formControlName="customerZip"
        type="text"
        [id]="'customerZip'"
        [label]="'boxOffice.fiscal.huRefund.customerZip' | translate"
      />

      <ignt-input-field
        class="hu-fiscal-refund-popup__input-field hu-fiscal-refund-popup__input-field--half"
        formControlName="customerCity"
        type="text"
        [id]="'customerCity'"
        [label]="'boxOffice.fiscal.huRefund.customerCity' | translate"
      />
    </div>
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="tertiary" data-testid="hu-refund-cancel-btn" (click)="cancel()">
    {{ 'common.cancel' | translate }}
  </button>
  <button type="button" igntButton sentiment="primary" data-testid="hu-refund-confirm-btn" [disabled]="form.invalid" (click)="confirm()">
    {{ 'boxOffice.fiscal.huRefund.confirm' | translate }}
  </button>
</ignt-dialog-footer>
