<div (click)="applyGestureFocus($event)" (pointerdown)="applyGestureFocus($event)">
  <ignt-dialog-header [hideCloseButton]="true">
    {{ title }}
  </ignt-dialog-header>

  <ignt-dialog-content>
    <div class="edit-control-sync-modal">
      <ignt-input-field
        #fieldInput
        class="edit-control-sync-modal__field"
        [customFormErrors]="formErrors"
        [formControl]="syncedFieldControl"
        [id]="'edit-control-sync-modal-field'"
        [label]="label"
        [type]="inputType"
        autocomplete="off"
      />
    </div>
  </ignt-dialog-content>

  <ignt-dialog-footer [hideCancelButton]="true">
    <button data-testid="edit-control-sync-modal-confirm" igntButton type="button" [disabled]="isDisabled()" (click)="confirm()">
      {{ 'common.confirm' | translate }}
    </button>
  </ignt-dialog-footer>
</div>
