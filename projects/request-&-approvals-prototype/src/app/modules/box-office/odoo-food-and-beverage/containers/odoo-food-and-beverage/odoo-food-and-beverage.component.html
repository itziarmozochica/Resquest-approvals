<div class="odoo-fnb-skeleton" data-testid="odoo-fnb-skeleton" inert aria-hidden="true">
  <div class="odoo-fnb-skeleton__main wrapper-card wrapper-card--elevation-100">
    <ignt-tabs class="odoo-fnb-skeleton__tabs" [hasExtraLine]="false">
      <ignt-tabs-item [label]="'oneStopShop.tabs.ticketsAndAddOns' | translate" [icon]="['fal', 'ticket-alt']">
        <div class="odoo-fnb-skeleton__tiles">
          <div class="odoo-fnb-skeleton__tile" data-testid="odoo-fnb-tile">
            <div class="odoo-fnb-skeleton__tile-main">
              <ignt-skeleton-base [height]="10" width="60%" [animation]="true" />
              <div class="odoo-fnb-skeleton__tile-bottom">
                <ignt-skeleton-base [height]="14" width="20px" [animation]="true" />
              </div>
            </div>
          </div>
          <div class="odoo-fnb-skeleton__tile" data-testid="odoo-fnb-tile">
            <div class="odoo-fnb-skeleton__tile-main">
              <ignt-skeleton-base [height]="10" width="48%" [animation]="true" />
              <div class="odoo-fnb-skeleton__tile-bottom">
                <ignt-skeleton-base [height]="14" width="20px" [animation]="true" />
              </div>
            </div>
          </div>
          <div class="odoo-fnb-skeleton__tile" data-testid="odoo-fnb-tile">
            <div class="odoo-fnb-skeleton__tile-main">
              <ignt-skeleton-base [height]="10" width="36%" [animation]="true" />
              <div class="odoo-fnb-skeleton__tile-bottom">
                <ignt-skeleton-base [height]="14" width="20px" [animation]="true" />
              </div>
            </div>
          </div>
          <div class="odoo-fnb-skeleton__tile" data-testid="odoo-fnb-tile">
            <div class="odoo-fnb-skeleton__tile-main">
              <ignt-skeleton-base [height]="10" width="52%" [animation]="true" />
              <div class="odoo-fnb-skeleton__tile-bottom">
                <ignt-skeleton-base [height]="14" width="20px" [animation]="true" />
              </div>
            </div>
          </div>
        </div>
      </ignt-tabs-item>
    </ignt-tabs>
  </div>

  <div class="odoo-fnb-skeleton__aside">
    <div class="odoo-fnb-skeleton__empty-cart" data-testid="odoo-fnb-empty-cart">
      <ignt-icon name="receipt" variant="light" size="base" class="odoo-fnb-skeleton__empty-cart-icon" aria-hidden="true" />
      <p class="odoo-fnb-skeleton__empty-cart-label" translate>oneStopShop.cart.empty</p>
    </div>
  </div>
</div>
