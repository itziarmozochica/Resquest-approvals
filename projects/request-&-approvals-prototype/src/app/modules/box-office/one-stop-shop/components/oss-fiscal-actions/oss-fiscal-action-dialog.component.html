<div class="oss-fiscal-action-dialog">
  <h3 class="oss-fiscal-action-dialog__title">{{ actionLabel }}</h3>

  @switch (phase()) {
    @case ('input') {
      <div class="oss-fiscal-action-dialog__input">
        <label class="oss-fiscal-action-dialog__input-label" for="fiscal-input">{{ inputConfig?.label }}</label>
        <input
          id="fiscal-input"
          class="oss-fiscal-action-dialog__input-field"
          type="text"
          [placeholder]="inputConfig?.placeholder ?? ''"
          [ngModel]="inputValue()"
          (ngModelChange)="inputValue.set($event)"
          (keydown.enter)="inputValue() ? executeWithInput() : null"
          data-testid="fiscal-action-input"
        />
      </div>
      <div class="oss-fiscal-action-dialog__actions">
        <button igntButton sentiment="secondary" (click)="close()">
          {{ 'common.cancel' | translate }}
        </button>
        <button igntButton [disabled]="!inputValue()" (click)="executeWithInput()" data-testid="fiscal-action-confirm">
          {{ 'common.confirm' | translate }}
        </button>
      </div>
    }
    @case ('loading') {
      <div class="oss-fiscal-action-dialog__loading">
        <fa-icon class="loader" [icon]="['fas', 'spinner']" [size]="'2x'"></fa-icon>
        <span>{{ 'oneStopShop.fiscalActions.processing' | translate }}</span>
      </div>
    }
    @case ('result') {
      <div class="oss-fiscal-action-dialog__result" [class.oss-fiscal-action-dialog__result--error]="isError()">
        <fa-icon [icon]="isError() ? ['fas', 'exclamation-circle'] : ['fas', 'check-circle']" [size]="'2x'"></fa-icon>
        <pre class="oss-fiscal-action-dialog__message">{{ resultMessage() }}</pre>
      </div>
      <div class="oss-fiscal-action-dialog__actions">
        <button igntButton sentiment="secondary" (click)="close()">
          {{ 'common.close' | translate }}
        </button>
      </div>
    }
  }
</div>
