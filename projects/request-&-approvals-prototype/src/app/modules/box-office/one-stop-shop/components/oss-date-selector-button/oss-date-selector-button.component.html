<button class="selector-container" data-testid="oss-date-selector-button" [@fadeAnimation]="isLoading()" (click)="changeDate.emit()">
  <div class="selector-detail">
    <div class="selector-detail__label">{{ 'oneStopShop.dateSelectionButton.label' | translate }}</div>
    <div class="selector-detail__name">
      <fa-icon class="selector-detail__icon-name" [icon]="['fas', 'calendar']"></fa-icon>
      <span>{{ displayDateTime() | ossMomentDate: 'EEEE, MMM d, yyyy HH:mma' : timezone : locale }}</span>
    </div>
  </div>
  <div class="selector__button">
    <fa-icon [icon]="['fal', 'cog']"></fa-icon>
  </div>
</button>
