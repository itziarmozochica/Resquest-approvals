<button class="selector-container" data-testid="oss-plan-place-selector-button" [@fadeAnimation]="isLoading()" (click)="selectPlan.emit()">
  <div class="selector-detail">
    <div class="selector-detail__label">{{ 'oneStopShop.planSelectionButton.label' | translate }}</div>
    <div class="selector-detail__name">{{ plan() }}</div>
  </div>
  <div class="selector__button">
    <fa-icon [icon]="['fal', 'cog']"></fa-icon>
  </div>
</button>
