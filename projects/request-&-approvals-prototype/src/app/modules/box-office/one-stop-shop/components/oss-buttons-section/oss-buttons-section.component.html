<div class="buttons">
  @if (showPlanPlaceSelector && selectedTab && (selectedTab === OssTab.SEATING || selectedTab === OssTab.TICKETS_AND_ADDONS)) {
    <app-oss-plan-place-selector-button
      [planName]="planName"
      (selectPlan)="openModalPlan.emit()"
      [igntTourAnchor]="'selectPlanPlace'"
    ></app-oss-plan-place-selector-button>
  }
  @if (selectedTab && selectedTab === OssTab.CUSTOM_TABS && datetime?.length) {
    <app-oss-date-selector-button
      [datetime]="datetime"
      [locale]="locale"
      [timezone]="timezone"
      (changeDate)="openDateSelectorModal.emit()"
    ></app-oss-date-selector-button>
  }
  @if (hasProductCatalog) {
    <button
      #searchButton
      class="button button-search button--secondary"
      (click)="search()"
      [disabled]="!isProductCatalogLoaded"
      [igntTourAnchor]="'search'"
      data-testid="oss-search-button"
    >
      @if (!isLoadingProductCatalog) {
        <ignt-icon name="search" variant="solid" aria-hidden="true" />
      } @else {
        <ignt-icon name="spinner" variant="solid" [spin]="true" aria-hidden="true" />
      }
    </button>
  }
  @if (canIdentifyMember) {
    <app-memberships-identify-member-button
      [compact]="true"
      [iconOnly]="true"
      [membershipsMember]="membershipsMember"
      (identifyMember)="identifyMember.emit()"
      (removeMember)="removeMember.emit()"
    ></app-memberships-identify-member-button>
  }
  @if (canIdentifyMemberAccount) {
    <app-identify-member-account-button
      [memberships]="memberAccountMemberships"
      (identifyMemberAccount)="identifyMemberAccount.emit()"
      (removeMemberAccount)="removeMemberAccount.emit()"
    ></app-identify-member-account-button>
  }
</div>
