<div class="oss-fiscal-actions">
  <button
    ignt-icon-button
    class="oss-fiscal-actions__trigger"
    [icon]="['fas', 'print']"
    sentiment="secondary"
    data-testid="oss-fiscal-actions-button"
    (click)="toggleMenu($event)"
  ></button>

  @if (menuOpen()) {
    <div class="oss-fiscal-actions__menu" data-testid="oss-fiscal-actions-menu">
      <button class="oss-fiscal-actions__item" (click)="onEnableUsbMode()" data-testid="fiscal-action-enable-usb">
        <ignt-icon name="lock-alt" variant="light" aria-hidden="true"></ignt-icon>
        {{ 'oneStopShop.fiscalActions.enableUsb' | translate }}
      </button>
      <button class="oss-fiscal-actions__item" (click)="onDisableUsbMode()" data-testid="fiscal-action-disable-usb">
        <ignt-icon name="unlock-alt" variant="light" aria-hidden="true"></ignt-icon>
        {{ 'oneStopShop.fiscalActions.disableUsb' | translate }}
      </button>
      <button class="oss-fiscal-actions__item" (click)="onPrintReceiptSummary()" data-testid="fiscal-action-print-receipt">
        <ignt-icon name="receipt" variant="light" aria-hidden="true"></ignt-icon>
        {{ 'oneStopShop.fiscalActions.printReceiptSummary' | translate }}
      </button>
      <button class="oss-fiscal-actions__item" (click)="onPingNavServer()" data-testid="fiscal-action-ping-nav">
        <ignt-icon name="globe" variant="light" aria-hidden="true"></ignt-icon>
        {{ 'oneStopShop.fiscalActions.pingNav' | translate }}
      </button>
    </div>
  }
</div>
