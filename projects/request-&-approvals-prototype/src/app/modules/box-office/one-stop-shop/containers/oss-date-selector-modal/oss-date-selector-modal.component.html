<app-modal-content [title]="'oneStopShop.quickPicksDateSelectorModal.title' | translate" [hasCloseButton]="hasCloseButton">
  <div class="modal__container">
    <ng-container *ngIf="datesAvailability?.length > 0; else loadingSection">
      <app-date-selector-obo
        class="modal__selector"
        [@fadeAnimation]
        [datesAvailability]="datesAvailability"
        [selectedDateAvailability]="selectedDateAvailability"
        [locale]="locale"
        [loading]="isLoadingDates"
        [loadingSessions]="isLoadingSessions"
        [timezone]="timezone"
        [ticketTypes]="ticketTypes"
        [displayedSessionType]="displayedSessionType"
        [regularSessionAvailabilitySummaryByDate]="regularSessionAvailabilitySummaryByDate"
        [selectedSession]="selectedSession"
        [sessionSelectorType]="sessionSelectorType"
        [showCapacity]="showCapacity"
        [showLoadMoreButton]="showLoadMoreButton"
        [isOneStepFlow]="true"
        [isOneStopShop]="true"
        [selectedAvailabilityFromDate]="selectedAvailabilityFromDate"
        [shouldShowDateSelector]="shouldShowDateSelector"
        [allowMultiTimeSlot]="allowMultiTimeSlot"
        (handleShowAvailabilityFromDateChange)="handleShowAvailabilityFromDateChange($event)"
        (loadMore)="loadMore()"
        (selectedDateChange)="selectedDateChange($event)"
        (selectedSessionChange)="changeSelectedSession($event)"
        (displayedSessionTypeChange)="displayedSessionTypeChange($event)"
      ></app-date-selector-obo>
    </ng-container>
    <div class="modal__footer">
      <button igntButton sentiment="secondary" (click)="closeModal(false)" [disabled]="!hasCloseButton">
        {{ 'oneStopShop.quickPicksDateSelectorModal.cancelButton' | translate }}
      </button>
      <button igntButton sentiment="primary" (click)="closeModal(true)" [disabled]="!isTimeslotSelected">
        {{ 'oneStopShop.quickPicksDateSelectorModal.selectButton' | translate }}
      </button>
    </div>
  </div>
</app-modal-content>

<ng-template #loadingSection>
  <div class="spinner-container">
    <div class="spinner">
      <ignt-icon aria-hidden="true" class="loader" name="spinner" size="display" variant="solid" [spin]="true" />
    </div>
  </div>
</ng-template>
