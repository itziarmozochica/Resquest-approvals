<div class="oss-modify-order-validation-modal" data-testid="oss-modify-order-validation-modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <p class="modal-title" data-testid="oss-modify-order-validation-modal-title">{{ data.title }}</p>
        <button type="button" class="btn-close" aria-label="Close" (click)="onClose()"></button>
      </div>
      <div class="modal-body">
        <ignt-alert sentiment="warning" [title]="data.alertTitle ?? data.title" [description]="data.message" />

        <div class="oss-modify-order-validation-modal__actions" [class.oss-modify-order-validation-modal__actions--confirm]="isConfirmMode">
          @if (isConfirmMode) {
            <button
              igntButton
              sentiment="secondary"
              class="oss-modify-order-validation-modal__cancel-btn"
              data-testid="oss-modify-order-validation-modal-cancel"
              type="button"
              (click)="onCancel()"
            >
              {{ 'common.cancel' | translate }}
            </button>
            <button
              igntButton
              cdkFocusInitial
              class="oss-modify-order-validation-modal__confirm-btn"
              data-testid="oss-modify-order-validation-modal-confirm"
              type="button"
              (click)="onConfirm()"
            >
              {{ 'common.continue' | translate }}
            </button>
          } @else {
            <button
              igntButton
              cdkFocusInitial
              class="oss-modify-order-validation-modal__close-btn"
              data-testid="oss-modify-order-validation-modal-close"
              type="button"
              (click)="onClose()"
            >
              {{ 'common.close' | translate }}
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</div>
