<app-modal-content data-testid="linked-device-modal" [title]="'oneStopShop.linkedDevice.modal.title' | translate" [hasCloseButton]="true">
  <div class="modal-content">
    <div class="linked-device-setup">
      <div class="linked-device-setup__section">
        <label class="linked-device-setup__label">{{ 'oneStopShop.linkedDevice.modal.selectDevice' | translate }}</label>

        <div class="linked-device-selector">
          <label class="field">
            <select
              class="field__select"
              data-testid="linked-device-select"
              [(ngModel)]="selectedDeviceId"
              (ngModelChange)="onDeviceSelect($event)"
            >
              <option [value]="" [selected]="!selectedDeviceId">
                {{ 'boxOffice.paymentDevice.emptyOption' | translate }}
              </option>
              <option *ngFor="let id of availableDevices" [value]="id" [selected]="selectedDeviceId === id">
                {{ id }}
              </option>
            </select>
            <span class="field__label">{{ 'boxOffice.paymentDevice.configuration' | translate }}</span>
            <ignt-icon class="field__icon field__icon--trail" name="chevron-down" variant="light" [fixedWidth]="true" aria-hidden="true" />
          </label>
        </div>
      </div>
    </div>
    <div class="modal-content__footer">
      <ignt-button fill variant="secondary" [label]="'buttons.cancel' | translate" (click)="onCancel()" />
      <ignt-button
        fill
        data-testid="linked-device-save-button"
        [label]="'buttons.select' | translate"
        [disabled]="!selectedDeviceId"
        (click)="onSave()"
      />
    </div>
  </div>
</app-modal-content>
