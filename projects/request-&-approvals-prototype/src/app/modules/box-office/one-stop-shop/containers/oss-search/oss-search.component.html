<div
  #searchContainer
  class="oss-search"
  [ngClass]="isMobile ? '' : animationState()"
  [ngStyle]="isMobile ? {} : getAnimationStyles()"
  data-testid="oss-search-modal"
>
  <div class="oss-search__header">
    <div class="oss-search__search-container">
      <label class="field">
        <ignt-input-field
          #searchInput
          [formControl]="searchFormControl"
          [label]="'oneStopShop.search.label' | translate"
          [placeholder]="'oneStopShop.search.placeholder' | translate"
          type="search"
          data-testid="oss-search-input"
        ></ignt-input-field>
        <ignt-icon class="field__icon field__icon--lead" name="search" variant="light" size="base" aria-hidden="true" />
      </label>
    </div>
    <button
      ignt-icon-button
      (click)="onClose()"
      sentiment="secondary"
      [attr.aria-label]="'oneStopShop.search.close' | translate"
      data-testid="oss-search-close-btn"
      [icon]="['far', 'times']"
    ></button>
  </div>
  <div class="oss-search__results">
    @if (isSearching()) {
      <div class="oss-search__loading">
        <span class="oss-search__loading-icon">
          <ignt-icon class="loader" name="spinner" variant="solid" size="display" [spin]="true" aria-hidden="true" />
        </span>
      </div>
    } @else {
      <div class="oss-search__table-wrapper">
        <app-oss-search-table
          [locale]="locale"
          [sessions]="searchResults()"
          (sessionSelected)="onSessionSelect($event)"
        ></app-oss-search-table>
      </div>
    }
  </div>
</div>
