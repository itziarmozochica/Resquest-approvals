<div class="oss-timeslot-warning-modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <p class="modal-title">{{ data.title }}</p>
        <button type="button" class="btn-close" aria-label="Close" (click)="onReviewCart()"></button>
      </div>
      <div class="modal-body">
        <p class="oss-timeslot-warning-modal__message">
          {{ 'oneStopShop.timeslotWarningModal.message' | translate: { newDatetime: data.newlySelectedDatetime } }}
        </p>

        <ignt-alert [description]="'oneStopShop.timeslotWarningModal.infoBox' | translate" />

        <div class="oss-timeslot-warning-modal__actions">
          <button igntButton sentiment="tertiary" (click)="onReviewCart()">
            {{ 'oneStopShop.timeslotWarningModal.reviewCartButton' | translate }}
          </button>
          <button igntButton cdkFocusInitial (click)="onContinue()">
            {{ 'oneStopShop.timeslotWarningModal.continueButton' | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
