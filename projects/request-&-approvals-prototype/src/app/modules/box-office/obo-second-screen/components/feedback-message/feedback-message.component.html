<div class="message-card">
  <figure class="message-figure">
    <!-- Success case -->
    <ng-container *ngIf="">
      <img class="message-figure__img" src="/assets/images/second-screen/icon-succes-animated.svg" alt="Success Icon" />
      <figcaption class="message-figure__caption">
        <h1 class="message-figure__title">Thanks for your payment</h1>
        <h2 class="message-figure__supporting-text">Your order was completed successfully</h2>
      </figcaption>
    </ng-container>
    <!-- Error case -->
    <ng-container *ngIf="">
      <img class="message-figure__img" src="/assets/images/second-screen/icon-error-animated.svg" alt="Error Icon" />
      <figcaption class="message-figure__caption">
        <h1 class="message-figure__title">Thanks for your payment</h1>
        <h2 class="message-figure__supporting-text">Your order was completed successfully</h2>
      </figcaption>
    </ng-container>
  </figure>
</div>
