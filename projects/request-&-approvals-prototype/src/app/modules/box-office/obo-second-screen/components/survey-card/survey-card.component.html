<div class="survey-card">
  <div class="survey-card__wrapper">
    <header class="survey-card__header survey-header">
      <h1 class="survey-header__title" translate>oboSecondScreen.survey.title</h1>
    </header>
    <ul class="survey-card__faces face-list">
      <li class="face-list__item" (click)="onNegativeClick()">
        <img src="assets/images/survey/frowning-face.svg" alt="frowning face" />
      </li>
      <li class="face-list__item" (click)="onNeutralClick()">
        <img src="assets/images/survey/neutral-face.svg" alt="neutral face" />
      </li>
      <li class="face-list__item" (click)="onPositiveClick()">
        <img src="assets/images/survey/smiling-face.svg" alt="smiling face" />
      </li>
    </ul>
    <footer class="survey-card__footer" [innerHtml]="'oboSecondScreen.survey.description' | translate"></footer>
  </div>
</div>
