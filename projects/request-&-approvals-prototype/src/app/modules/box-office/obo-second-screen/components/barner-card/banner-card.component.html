<div class="banner-card" [class.banner-card--absolute]="state() === bannerCardState.Farewell">
  <div class="banner-card__wrapper">
    <img class="banner-card__logo" data-testid="banner-card-logo" [src]="bannerLogo()" alt="Logo" />
    <div class="banner-card__content">
      <h1 class="banner-card__text" data-testid="banner-card-title">{{ configurationTitle() ?? (titleKey() | translate) }}</h1>
      @if (showFarewellDescription()) {
        <p
          class="banner-card__supporting-text"
          data-testid="banner-card-farewell-description"
          [innerHtml]="'oboSecondScreen.farewell.description' | translate: { url: farewellUrl() }"
        ></p>
      }
    </div>
  </div>
  @if (showQr()) {
    <figure class="banner-card__qr" data-testid="banner-card-qr">
      <img [src]="code()" width="86" height="86" alt="" />
      <figcaption>{{ displayedUrl() }}</figcaption>
    </figure>
  }
</div>
