<div class="sales-summary">
  <div class="sales-summary__title">
    <div class="sales-summary__title-content">
      <span class="sales-summary__section">{{ 'menu.boxOffice' | translate }}</span>
      <h1 class="sales-summary__heading" data-testid="page-title">{{ 'menu.stats' | translate }}</h1>
    </div>
    @if (!outage) {
      <span class="sales-summary__updated" data-testid="sales-summary-updated">{{
        'boxOffice.salesSummary.metabaseUpdatedMessage' | translate
      }}</span>
    }
  </div>
  <div class="sales-summary__content">
    <ignt-alert
      *ngIf="outage && !loadingGraphs && !errorGraphs"
      class="my-4 d-block"
      sentiment="warning"
      [description]="'outage.message' | translate"
      data-testid="outage-banner"
    ></ignt-alert>
    <div class="sales-summary__spinner" *ngIf="loadingGraphs">
      <fa-icon class="loader" [icon]="['fas', 'spinner']" [size]="'4x'"></fa-icon>
    </div>
    <div class="sales-summary__alert-error" *ngIf="errorGraphs">
      <ignt-alert
        sentiment="danger"
        [description]="'boxOffice.salesSummary.error' | translate"
        showCloseButton
        [closeButtonAriaLabel]="'common.close' | translate"
        (closeAlert)="errorGraphs = false"
      />
    </div>
    <div class="session-summary-content" *ngIf="graphs && !loadingGraphs">
      <ng-container *ngFor="let graph of graphs">
        <iframe
          data-testid="session-summary-iframe"
          *ngIf="graph.url"
          [src]="graph.url | safeUrl"
          border="0"
          frameBorder="0"
          width="100%"
          allowtransparency
          appIframeResizer
        ></iframe>
      </ng-container>
    </div>

    <div class="session-summary-content__help-topic" appHideWrapperOnHelpTopicClose>
      <app-help-topic-banner
        [message]="'helpTopics.stats.message' | translate"
        [ctaLabel]="'helpTopics.generic.cta.label' | translate"
        [ctaLink]="'helpTopics.stats.cta.href' | translate"
      ></app-help-topic-banner>
    </div>
  </div>
</div>
