<ignt-dialog-header>{{ 'common.filter.label' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="attendees-table-filter-content" data-testid="attendees-table-filter-content">
    <ignt-switch
      data-testid="attendees-filter-addons"
      [checked]="selection().shouldIncludeAddons"
      [label]="'attendees.includeAddOns' | translate"
      (checkedChange)="onShouldIncludeAddonsChange($event)"
    />
    <ignt-switch
      data-testid="attendees-filter-empty-time-slots"
      [checked]="selection().showTimeSlotsWithNoSales"
      [label]="'attendees.showTimeSlotsWithNoSales' | translate"
      (checkedChange)="onShowTimeSlotsWithNoSalesChange($event)"
    />
    @if (offersAttendancePercentage) {
      <ignt-switch
        data-testid="attendees-filter-attendance-percentage"
        [checked]="showAttendancePercentage()"
        [label]="'attendees.viewDataInPercentages' | translate"
        (checkedChange)="onShowAttendancePercentageChange($event)"
      />
    }
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <ignt-button
    fill
    variant="tertiary"
    data-testid="attendees-table-filter-clear"
    [label]="'common.filter.clear' | translate"
    (click)="onClear()"
  />
  <ignt-button
    fill
    variant="primary"
    data-testid="attendees-table-filter-apply"
    [label]="'common.filter.apply' | translate"
    (click)="onApply()"
  />
</ignt-dialog-footer>
