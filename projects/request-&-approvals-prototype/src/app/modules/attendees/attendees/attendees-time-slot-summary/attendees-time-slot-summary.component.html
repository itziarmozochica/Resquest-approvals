<ng-container *ngIf="timeSlot()">
  <fa-icon
    *ngIf="displayClose()"
    (click)="close.emit()"
    class="attendees-time-slot-summary-close icon-button icon-button--medium"
    [icon]="['fas', 'times']"
  >
  </fa-icon>
  <app-attendees-time-slot-summary-header
    data-testid="attendees-time-slot-group-header"
    [timezone]="timezone()"
    [planId]="planId()"
    [placeId]="placeId()"
    [timeSlot]="timeSlotWithAddons()"
    [displayAddons]="displayAddons()"
  >
  </app-attendees-time-slot-summary-header>

  <div class="attendees-time-slot-summary__search">
    <fa-icon class="attendees-time-slot-summary__search-icon" [icon]="['far', 'search']"></fa-icon>
    <input
      class="attendees-time-slot-summary__search-input"
      type="text"
      [placeholder]="'attendees.timeSlotSummary.searchSessionsPlaceholder' | translate"
      [value]="sessionSearchText()"
      (input)="onSessionSearchChange($any($event.target).value)"
      data-testid="attendees-time-slot-summary-session-search"
    />
  </div>

  <div class="scroll-wrapper">
    <table class="table-groupable">
      <thead class="table-groupable__header">
        <tr class="table-groupable__header-row title-row">
          <th colspan="2" class="table-groupable__header-cell">{{ 'attendees.timeSlotSummary.ticketTypeCol' | translate }}</th>
          <th *ngIf="canViewOrders" class="table-groupable__header-cell order-cell"></th>
          <th class="table-groupable__header-cell">{{ 'attendees.ticketsCount.validatedSort' | translate }}</th>
          <th class="table-groupable__header-cell">{{ 'attendees.ticketsCount.sold' | translate }}</th>
          <th class="table-groupable__header-cell"></th>
        </tr>
      </thead>
      <tbody
        data-testid="attendees-time-slot-group-body"
        appAttendeesTimeSlotSession
        [timezone]="timezone()"
        [planId]="planId()"
        [placeId]="placeId()"
        [canViewOrders]="canViewOrders"
        class="table-groupable__body-group"
        *ngFor="let sessionSummary of filteredSessions(); trackBy: trackByIdFn"
        [sessionSummary]="sessionSummary"
      ></tbody>
    </table>
  </div>
</ng-container>
