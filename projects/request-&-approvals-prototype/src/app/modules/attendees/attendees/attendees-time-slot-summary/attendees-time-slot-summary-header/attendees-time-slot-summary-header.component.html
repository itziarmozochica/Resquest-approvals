<div class="time-slot-header">
  <div class="time-slot-header__header">
    <div class="time-slot-header__title">{{ 'attendees.timeSlotSummary.title' | translate }}</div>
    <div *ngIf="timeSlotDate && timezone" data-testid="attendees-timeslot-header-date" class="time-slot-header__date">
      {{ timeSlotDate | momentDate: 'EEE, d MMM ’yy - h:mm a' : timezone }}
    </div>
  </div>
  <div class="time-slot-header__actions">
    <app-attendees-ticket-count
      [tickets]="timeSlot?.regularValidated"
      [addons]="displayAddons ? timeSlot?.addonsValidated : null"
      [collapseAttendanceOnMobile]="true"
    >
    </app-attendees-ticket-count>
    <div class="time-slot-header__total-attendance" data-testid="attendees-timeslot-header-total-attendance">
      <span class="time-slot-header__total-attendance-label">{{ 'attendees.ticketsCount.attendance' | translate }}</span>
      <span class="time-slot-header__total-attendance-value">{{ attendanceRatio | percent: '1.1-1' }}</span>
    </div>
    <div class="time-slot-header__action-icons">
      <app-attendees-seating-map
        *ngIf="timeSlot?.hasSeating"
        [mainPlanId]="planId"
        [sessionIds]="timeSlotSessionIds"
        data-testid="attendees-time-slot-summary-seating-map"
      >
      </app-attendees-seating-map>
      <app-attendees-download-document-dropdown
        data-testid="attendees-time-slot-summary-header-document-dropdown"
        *ngIf="attendeesCount > 0"
        [selectedDateRange]="selectedDateRange"
        [attendeesCount]="attendeesCount"
        [downloadType]="downloadType"
        [zIndex]="1060"
      >
      </app-attendees-download-document-dropdown>
    </div>
  </div>
</div>
