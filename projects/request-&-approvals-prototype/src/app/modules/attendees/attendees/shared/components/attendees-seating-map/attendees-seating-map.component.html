<button
  [class.seating-map-button--loading]="isLoadingSeating"
  data-testid="attendees-seating-map-button"
  class="icon-button icon-button--medium seating-map-button"
  (click)="!isLoadingSeating && showSeatingMapModal()"
>
  <fa-icon *ngIf="!isLoadingSeating; else spinner" class="icon" [icon]="['fas', 'loveseat']"></fa-icon>
</button>

<ng-template #spinner>
  <div data-testid="attendees-seating-map-loading" class="loader">
    <fa-icon [icon]="['fas', 'spinner']"></fa-icon>
  </div>
</ng-template>
