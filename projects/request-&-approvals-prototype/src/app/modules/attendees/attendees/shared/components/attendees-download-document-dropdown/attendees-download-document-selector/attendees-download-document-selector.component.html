<div class="document-section">
  <span class="document-section__title">
    {{ 'attendees.timeSlotSummary.documentDownloadAttendees' | translate }}
  </span>
  <ul class="document-section__doctype-list">
    <li
      (click)="downloadFile(AttendeesExport.attendees, option.fileType)"
      *ngFor="let option of exportAttendeesOptions; trackBy: trackExportOption"
      [attr.data-testid]="'attendees-download-attendees-' + option.label"
      class="document-section__doctype-list-item"
    >
      <fa-icon [fixedWidth]="true" [icon]="option.icon" class="el-billing-overview-pdf_icon"> </fa-icon>
      {{ option.label }}
    </li>
  </ul>
</div>
<div *ngIf="!sessionId" class="document-section">
  <span class="document-section__title">
    {{ 'attendees.timeSlotSummary.documentDownloadCodes' | translate }}
  </span>
  <ul class="document-section__doctype-list">
    <li
      (click)="downloadFile(AttendeesExport.codes, option.fileType)"
      *ngFor="let option of exportCodesOptions; trackBy: trackExportOption"
      [attr.data-testid]="'attendees-download-codes-' + option.label"
      class="document-section__doctype-list-item"
    >
      <fa-icon [fixedWidth]="true" [icon]="option.icon" class="el-billing-overview-pdf_icon"> </fa-icon>
      {{ option.label }}
    </li>
  </ul>
</div>
