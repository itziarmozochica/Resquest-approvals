<div class="documents-drop-down-date-range">
  <div
    data-testid="attendees-download-date-range-range"
    class="date-range-field"
    [class.date-range-field--error]="dateRangeFormGroup.dirty && dateRangeFormGroup.errors?.maxRangeExceeded"
  >
    <div class="double_wrap">
      <ignt-button
        [label]="'sessions.calendar.filters.today' | translate"
        [disabled]="isDisabled"
        (click)="selectToday()"
        [fill]="isMobile()"
        variant="secondary"
        sentiment="neutral"
        size="small"
        [class.date-range-field__today--ready]="!isDisabled"
        igntTooltip
        [tooltipLabel]="'attendees.dateRange.todayDisabledReason' | translate"
        [tooltipDisabled]="!isDisabled"
        data-testid="date-range-field-today"
      />
      <div class="double-field-wrapper">
        <ng-container
          *ngTemplateOutlet="
            dateInput;
            context: {
              label: 'attendees.timeSlotSummary.rangeStartDate' | translate,
              control: dateRangeFormGroup.get('startsAtFrom'),
              max: dateRangeFormGroup.get('startsAtTo').value,
              testid: 'attendees-download-date-range-range-start',
            }
          "
        >
        </ng-container>
        <ng-container
          *ngTemplateOutlet="
            dateInput;
            context: {
              label: 'attendees.timeSlotSummary.rangeEndDate' | translate,
              control: dateRangeFormGroup.get('startsAtTo'),
              min: dateRangeFormGroup.get('startsAtFrom').value,
              testid: 'attendees-download-date-range-range-end',
            }
          "
        >
        </ng-container>
      </div>
    </div>
    <span data-testid="attendees-date-range-error" class="form-error">
      <ignt-icon name="exclamation-circle" variant="solid" class="form-error--icon" aria-hidden="true" />
      {{ 'attendees.timeSlotSummary.dateRangeError' | translate: { maxRangeInDays: maxRangeInDays } }}
    </span>
  </div>
</div>

<ng-template #dateInput let-label="label" let-control="control" let-max="max" let-min="min" let-testid="testid">
  <label class="field">
    <input #datePickerInput [attr.data-testid]="testid" [formControl]="control" [min]="min" [max]="max" type="date" class="field__input" />
    <span class="field__label"> {{ label }} </span>
    <ignt-icon
      (click)="!control.disabled && datePickerInput?.showPicker?.()"
      class="field__icon field__icon--trail"
      name="calendar"
      variant="light"
      aria-hidden="true"
    />
  </label>
</ng-template>
