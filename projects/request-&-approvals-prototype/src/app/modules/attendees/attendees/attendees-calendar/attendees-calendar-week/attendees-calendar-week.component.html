<div class="calendar-container">
  <app-request-result
    (searchResults)="calendarEvents = $event"
    [areResultsEmpty]="areResultsEmpty"
    [errorMessage]="'sessions.calendar.error' | translate"
    [noFiltersIcon]="['far', 'sort-alt']"
    [noFiltersMessage]="'sessions.calendar.noFiltersSelected' | translate"
    [noResultIcon]="['far', 'receipt']"
    [noResultMessage]="'sessions.calendar.noResults' | translate"
    [request]="request"
    [displayContentWithNoResults]="true"
    [loadingTemplate]="calendarSkeleton"
    data-testid="attendees-calendar-week-request-result"
    class="calendar-container__results"
  >
    @if (selectedDateRange && headerTemplate && slotTemplate && timezone) {
      <app-weekly-calendar
        class="calendar-container__calendar"
        [calendarEvents]="calendarEvents"
        [selectedDateRange]="selectedDateRange"
        [timezone]="timezone"
        [slotTemplate]="slotTemplate"
        [scrollToSlot]="scrollToSlot"
        data-testid="attendees-calendar-week-calendar"
        [headerTemplate]="headerTemplate"
      >
      </app-weekly-calendar>
    }
  </app-request-result>
</div>

<ng-template #calendarSkeleton>
  <div class="calendar-skeleton" data-testid="attendees-calendar-skeleton">
    <div class="calendar-skeleton__hours">
      @for (slot of skeletonSlots; track slot) {
        <ignt-skeleton-base [animation]="true" [height]="16" width="40px" />
      }
    </div>
    @for (day of skeletonDays; track day) {
      <div class="calendar-skeleton__day">
        <ignt-skeleton-base [animation]="true" [height]="56" />
        @for (slot of skeletonSlots; track slot) {
          <ignt-skeleton-base [animation]="true" [height]="72" [white]="true" />
        }
      </div>
    }
    <span class="visually-hidden">{{ 'common.loading' | translate }}</span>
  </div>
</ng-template>
