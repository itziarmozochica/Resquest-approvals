<div class="split-success-step">
  <app-split-summary-panel
    class="split-success-step__summary"
    [toPay]="store.remainingAmount()"
    [paid]="store.paidAmount()"
    [locale]="store.context().locale"
    [toPayLabelKey]="store.summaryToPayLabelKey()"
  />

  <div class="split-success-step__vertical-divider"></div>

  <div class="split-success-step__center">
    <ignt-icon name="check-circle" variant="solid" size="display" class="split-success-step__icon" aria-hidden="true" />
    <h3 class="split-success-step__title">{{ 'checkout.split.success.title' | translate }}</h3>
    @if (cancelCameTooLate()) {
      <p class="split-success-step__notice" data-testid="checkout-tap-to-pay-already-paid" role="status">
        {{ 'checkout.tapToPay.customerAlreadyPaid' | translate }}
      </p>
      <ignt-button
        data-testid="checkout-tap-to-pay-already-paid-continue"
        [label]="'checkout.tapToPay.customerAlreadyPaidContinue' | translate"
        (click)="onContinue()"
      />
    }
  </div>

  <div class="split-success-step__vertical-divider"></div>

  <app-payment-summary-panel
    class="split-success-step__payment-summary"
    [amountToPay]="store.currentSplitAmount()"
    [currentSplitNumber]="store.currentSplitNumber()"
    [splitCount]="store.context().splitCount"
    [total]="store.context().cartTotal ?? store.remainingAmount()"
    [paymentMethodLabel]="paymentMethodLabel()"
    [paymentMethodLabelSuffixKey]="paymentMethodLabelSuffixKey()"
    [locale]="store.context().locale"
  />
</div>
