<div class="cancelling-step" role="status">
  <ignt-icon name="spinner" variant="solid" size="display" class="cancelling-step__spinner" [spin]="true" aria-hidden="true" />
  <h3 class="cancelling-step__title" data-testid="cancelling-title">{{ 'checkout.cancelling.title' | translate }}</h3>
  <p class="cancelling-step__message">{{ 'checkout.cancelling.message' | translate }}</p>
</div>
