<div class="confirm-cancel-step">
  <ignt-icon name="exclamation-triangle" variant="solid" size="display" class="confirm-cancel-step__icon" aria-hidden="true" />

  <div class="confirm-cancel-step__text">
    <h3 class="confirm-cancel-step__title" data-testid="confirm-cancel-title">
      {{ 'checkout.confirmCancel.title' | translate }}
    </h3>
    <p class="confirm-cancel-step__message" data-testid="confirm-cancel-message">
      {{ 'checkout.confirmCancel.message' | translate }}
    </p>
  </div>
</div>
