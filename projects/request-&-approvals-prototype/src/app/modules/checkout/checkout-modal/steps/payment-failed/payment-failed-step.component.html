<div class="payment-failed-step">
  <ignt-icon name="times-circle" variant="solid" size="display" class="payment-failed-step__icon" aria-hidden="true" />

  <div class="payment-failed-step__text">
    <h3 class="payment-failed-step__title" data-testid="payment-failed-title">{{ titleKey() | translate }}</h3>
    <p class="payment-failed-step__message" data-testid="payment-failed-reason">
      {{ messageKey() | translate: { amount: collectedAmount() } }}
    </p>
  </div>

  @if (canRetry()) {
    <ignt-button
      [label]="'checkout.paymentFailed.retry' | translate"
      [leadingIcon]="retryIcon"
      variant="secondary"
      data-testid="checkout-retry-payment"
      (click)="retry()"
    ></ignt-button>
  }
</div>
