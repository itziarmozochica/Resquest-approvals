<div class="flow-selection-step">
  <p class="flow-selection-step__subtitle">{{ 'checkout.options.subtitle' | translate }}</p>
  <div class="flow-selection-step__tiles">
    @for (tile of tiles(); track tile.type) {
      <ignt-option-tile
        [iconName]="tile.iconName"
        [title]="tile.titleKey | translate"
        [description]="tile.descriptionKey | translate"
        [selected]="selected() === tile.type"
        [attr.data-testid]="tile.testId"
        (tileClick)="select(tile.type)"
      />
    }
  </div>
</div>
