<div class="cancel-failed-step">
  <ignt-icon name="times-circle" variant="solid" size="display" class="cancel-failed-step__icon" aria-hidden="true" />

  <div class="cancel-failed-step__text">
    <h3 class="cancel-failed-step__title">{{ 'checkout.cancelFailed.title' | translate }}</h3>
    <p class="cancel-failed-step__message" data-testid="cancel-failed-message">{{ messageKey() | translate }}</p>
  </div>

  <ignt-button
    [label]="'checkout.cancelFailed.retry' | translate"
    [leadingIcon]="retryIcon"
    variant="secondary"
    data-testid="checkout-retry-cancellation"
    (click)="retry()"
  ></ignt-button>
</div>
