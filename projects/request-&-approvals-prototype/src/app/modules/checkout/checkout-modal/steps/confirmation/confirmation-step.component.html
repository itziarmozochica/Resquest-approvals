<div class="confirmation-step">
  <ignt-icon name="check-circle" variant="solid" size="display" class="confirmation-step__icon" aria-hidden="true" />
  <h3 class="confirmation-step__title">{{ 'checkout.confirmation.title' | translate }}</h3>
  @if (cancelCameTooLate()) {
    <p class="confirmation-step__notice" data-testid="checkout-tap-to-pay-already-paid" role="status">
      {{ 'checkout.tapToPay.customerAlreadyPaid' | translate }}
    </p>
    <ignt-button
      data-testid="checkout-tap-to-pay-already-paid-continue"
      [label]="'checkout.tapToPay.customerAlreadyPaidContinue' | translate"
      (click)="onContinue()"
    />
  }
</div>
