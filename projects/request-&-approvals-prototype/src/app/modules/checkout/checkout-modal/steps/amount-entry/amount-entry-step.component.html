<div class="amount-entry-step">
  <app-split-summary-panel
    class="amount-entry-step__summary"
    [toPay]="store.remainingAmount()"
    [paid]="store.paidAmount()"
    [locale]="store.context().locale"
    [activeRow]="'toPay'"
    [toPayLabelKey]="store.summaryToPayLabelKey()"
    (paidClick)="onViewHistory()"
  />

  <div class="amount-entry-step__content">
    <div class="amount-entry-step__header">
      <h3 class="amount-entry-step__title">{{ 'checkout.amountEntry.title' | translate }}</h3>
      <p class="amount-entry-step__description">{{ 'checkout.amountEntry.description' | translate }}</p>
    </div>

    <app-numeric-keypad
      class="numeric-keypad--compact"
      data-testid="checkout-amount-keypad"
      [value]="store.currentSplitAmount().amount"
      [maxAmount]="store.remainingAmount().amount"
      [currency]="store.currentSplitAmount().currency"
      [locale]="store.context().locale"
      [errorMessage]="maxAmountExceeded() ? ('checkout.amountEntry.maxAmountError' | translate: { max: formattedRemaining() }) : null"
      (valueChange)="onAmountChange($event)"
      (limitExceeded)="onLimitExceeded()"
    />
  </div>

  <div class="amount-entry-step__payment-summary">
    <app-payment-summary-panel
      class="payment-summary-panel--compact"
      [amountToPay]="store.currentSplitAmount()"
      [currentSplitNumber]="store.currentSplitNumber()"
      [splitCount]="store.context().splitCount"
      [total]="store.context().cartTotal ?? store.remainingAmount()"
      [showPaymentMethod]="false"
      [locale]="store.context().locale"
    />

    <ignt-checkbox
      class="amount-entry-step__pay-remaining"
      dataTestId="checkout-amount-pay-remaining"
      [label]="'checkout.split.paymentSummary.payRemaining' | translate"
      [checked]="store.context().payRemaining"
      (change)="onPayRemainingChange($event)"
    />
  </div>
</div>
