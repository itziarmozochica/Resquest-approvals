<div class="cancel-confirmation-step">
  <ignt-icon name="check-circle" variant="solid" size="display" class="cancel-confirmation-step__icon" aria-hidden="true" />

  <div class="cancel-confirmation-step__text">
    <h3 class="cancel-confirmation-step__title" data-testid="cancel-confirmation-title">
      {{ 'checkout.cancelConfirmation.title' | translate }}
    </h3>
    <p class="cancel-confirmation-step__message" data-testid="cancel-confirmation-message">
      {{ messageKey() | translate: { amount: collectedAmount() } }}
    </p>
  </div>
</div>
