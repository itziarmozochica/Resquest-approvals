<ignt-dialog-header>
  {{ 'common.filter.label' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <form [formGroup]="filterForm">
    <ignt-checkbox formControlName="onlyOwned" [label]="onlyOwnedLabel" />
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="secondary" (click)="clearFilters()">
    {{ 'common.filter.clear' | translate }}
  </button>
  <button type="button" igntButton sentiment="primary" (click)="applyFilters()">
    {{ 'common.filter.apply' | translate }}
  </button>
</ignt-dialog-footer>
