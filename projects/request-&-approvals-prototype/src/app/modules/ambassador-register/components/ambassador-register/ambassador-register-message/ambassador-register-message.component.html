<div class="ambassadors-register-message">
  <ignt-wrapper-card>
    <fa-icon *ngIf="isError" [icon]="['fal', 'exclamation-circle']" class="ambassadors-register-message__icon--error"></fa-icon>
    <fa-icon *ngIf="isSuccess" [icon]="['fas', 'envelope-open-text']" class="ambassadors-register-message__icon--success"></fa-icon>
    <ng-content></ng-content>
    <h3 class="ambassadors-register-message__title"><ng-content select="[app-ambassador-register-message-title]"></ng-content></h3>
    <p class="ambassadors-register-message__content"><ng-content select="[app-ambassador-register-message-content]"></ng-content></p>
    <button igntButton sentiment="secondary" *ngIf="isError" (click)="close()" class="ambassadors-register-message__button">
      {{ 'ambassadors.register.errorMessageTryAgain' | translate }}
    </button>
  </ignt-wrapper-card>
</div>
