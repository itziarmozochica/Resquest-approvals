<app-page-title
  [title]="'menu.promoCodes' | translate"
  [section]="'menu.marketing' | translate"
  [backInHistory]="true"
  class="new-design"
></app-page-title>

<div class="main-wrapper">
  <div class="wrapper-card wrapper-card--elevation-100">
    <h2 class="font-h2">{{ 'coupons.form.titles.create' | translate }}</h2>
    <app-template-coupon-form
      [templateCouponDetail]="templateCouponDetail"
      [serverError]="serverError$ | async"
      (templateCouponSubmit)="onTemplateCouponSubmit($event)"
      (formDirtyStateChange)="onFormDirtyStateChange($event)"
    ></app-template-coupon-form>
  </div>

  <div class="coupon-form__help-topic" appHideWrapperOnHelpTopicClose>
    <app-help-topic-banner
      [message]="'helpTopics.createANewPromoCode.message' | translate"
      [ctaLabel]="'helpTopics.generic.cta.label' | translate"
      [ctaLink]="'helpTopics.createANewPromoCode.cta.href' | translate"
    ></app-help-topic-banner>
  </div>
</div>
