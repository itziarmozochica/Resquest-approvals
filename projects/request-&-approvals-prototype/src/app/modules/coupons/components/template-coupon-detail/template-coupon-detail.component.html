<app-page-title
  [title]="'menu.promoCodes' | translate"
  [section]="'menu.marketing' | translate"
  [backInHistory]="true"
  class="new-design"
></app-page-title>

<div class="main-wrapper">
  <div class="wrapper-card wrapper-card--elevation-300">
    <h2 class="font-h2">{{ 'coupons.form.titles.detail' | translate }}</h2>
    <ng-container *ngIf="templateCouponDetail$ | async as templateCouponDetail">
      <app-template-coupon-form
        [templateCouponDetail]="templateCouponDetail"
        (templateCouponSubmit)="onTemplateCouponSubmit(templateCouponDetail, $event)"
        (formDirtyStateChange)="onFormDirtyStateChange($event)"
      />
    </ng-container>
  </div>
</div>
