<fieldset class="time-slot-filters" [formGroupName]="controlKey">
  <fieldset class="time-slot-filters__type">
    <ignt-radio-group formControlName="filterType">
      <div class="time-slot-filters__type-item">
        <ignt-radio
          [value]="'ALL'"
          [name]="'filterType'"
          [label]="'coupons.form.assignments.fields.timeslots.all' | translate"
          [dataTestId]="'all-time-slots'"
        ></ignt-radio>
      </div>
      <div class="time-slot-filters__type-item">
        <ignt-radio
          [value]="'SPECIFIC'"
          [name]="'filterType'"
          [label]="'coupons.form.assignments.fields.timeslots.specific' | translate"
          [dataTestId]="'specific-time-slots'"
        ></ignt-radio>
      </div>
    </ignt-radio-group>
  </fieldset>

  <ng-container *ngIf="filterType.value === 'SPECIFIC'">
    <fieldset class="time-slot-filters__data" formArrayName="filters">
      <ng-container *ngFor="let filter of filters.controls; let index = index" [formGroupName]="index">
        <fieldset class="time-slot-filters__data-item" data-testid="time-slot-filters">
          <div class="time-slot-filters__delete-container">
            <button
              class="time-slot-filters__delete-btn btn-icon"
              (click)="removeTimeSlotFilter(index)"
              data-testid="delete-time-slot-filters-btn"
            >
              <fa-icon
                class="trash-icon"
                [icon]="['fas', 'trash-alt']"
                role="button"
                [attr.aria-label]="'coupons.form.assignments.fields.timeslots.delete' | translate"
              ></fa-icon>
            </button>
          </div>
          <div class="time-slot-filters__data-values">
            <div>
              <label class="time-slot-filters__data-item-label">{{
                'coupons.form.assignments.fields.timeslots.datesLabel' | translate
              }}</label>
              <app-date-range-form-group (formGroupCreated)="onDateRangeFormGroupCreated($event, index)" />
            </div>

            <div>
              <label class="time-slot-filters__data-item-label" for="days-of-week">{{
                'coupons.form.assignments.fields.timeslots.weekDaysLabel' | translate
              }}</label>
              <app-week-days-selector id="days-of-week" class="time-slot-filters__week-days" formControlName="weekDays" />
            </div>

            <div>
              <label class="time-slot-filters__data-item-label">{{
                'coupons.form.assignments.fields.timeslots.timesLabel' | translate
              }}</label>
              <app-time-range-form-group (formGroupCreated)="onTimeRangeFormGroupCreated($event, index)" />
            </div>
          </div>
        </fieldset>
      </ng-container>
    </fieldset>

    <button class="time-slot-filters__add-btn btn-icon" (click)="addTimeSlotFilter($event)" data-testid="add-time-slot-filters-btn">
      <fa-icon [icon]="['fas', 'plus-circle']"></fa-icon><span>{{ 'coupons.form.assignments.fields.timeslots.add' | translate }}</span>
    </button>

    <ignt-alert class="time-slot-filters__timezone-banner" sentiment="accent" data-testid="time-slot-filters-timezone-banner">
      <ng-template #igntAlertContent>
        <span [innerHTML]="'coupons.form.infoBanners.timeslotsTimezoneUsed' | translate"></span>
      </ng-template>
    </ignt-alert>
  </ng-container>
</fieldset>
