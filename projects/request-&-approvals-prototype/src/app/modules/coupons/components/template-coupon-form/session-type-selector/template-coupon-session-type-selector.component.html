<div class="template-coupon-session-type-selector">
  <form (submit)="$event.preventDefault()" class="wrapper-card wrapper">
    <app-multi-select
      class="cell"
      [options]="categoryOptions"
      [selectedOptions]="selectedCategoryOptions()"
      [placeholder]="'coupons.form.assignments.fields.ticketTypeCategories.label' | translate"
      [displayInPlaceMaximum]="3"
      [defaultOrdering]="false"
      (selected)="onSelectCategoryOptions($event)"
      [disabled]="sessionTypeOptions().length < 1"
      data-testid="template-coupon-assignments__session-type-categories"
    >
    </app-multi-select>
    <app-multi-select
      class="cell"
      [options]="visibleSessionTypeOptions()"
      [selectedOptions]="selectedSessionTypeOptions()"
      [placeholder]="'coupons.form.assignments.fields.ticketTypes.label' | translate"
      [displayInPlaceMaximum]="1"
      [helpText]="'coupons.form.assignments.fields.ticketTypes.helpText' | translate"
      (selected)="onSelectSessionTypeOptions($event)"
      [disabled]="visibleSessionTypeOptions().length < 1"
      data-testid="template-coupon-assignments__session-type-ids"
    >
    </app-multi-select>
  </form>
</div>
