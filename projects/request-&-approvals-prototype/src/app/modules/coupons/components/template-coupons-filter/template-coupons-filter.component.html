<div class="coupons-filter">
  <ng-container *ngIf="selectedFilters$ | async as selectedFilters">
    <div class="coupons-filter__selectors">
      <app-multi-select
        data-testid="coupons-filters-status"
        class="cell cell--fill-lg"
        [options]="couponsStatusFilters"
        [selectedOptions]="couponsStatusFiltersSelected"
        [displayInPlaceMaximum]="2"
        (selected)="selectCouponStatusFilter($event)"
        [placeholder]="'coupons.list.filters.status.label' | translate"
      >
      </app-multi-select>
      <app-multi-select
        data-testid="coupons-filters-validity"
        class="cell cell--fill-lg"
        [options]="couponsValidFilters"
        [selectedOptions]="couponsValidFiltersSelected"
        [displayInPlaceMaximum]="2"
        (selected)="selectCouponValidityFilter($event)"
        [placeholder]="'coupons.list.filters.validity.label' | translate"
      >
      </app-multi-select>
    </div>
    <label class="cell field coupons-filter__search">
      <input
        class="field__input"
        type="text"
        [placeholder]="'coupons.list.searchByNameOrCode' | translate"
        [disabled]="disabled"
        [ngModel]="selectedFilters.search"
        (ngModelChange)="changeTemplateCouponsSearchFilter($event)"
        data-testid="template-coupons-filter"
      />
      <fa-icon class="field__icon field__icon--lead" [icon]="['far', 'search']"></fa-icon>
    </label>
  </ng-container>
</div>
