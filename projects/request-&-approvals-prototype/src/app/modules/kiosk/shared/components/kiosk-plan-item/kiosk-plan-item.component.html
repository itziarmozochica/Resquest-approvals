<div class="plan-item">
  <figure class="plan-item__fig">
    <img class="plan-item__img" [class.plan-item__img--two-plans]="isTwoPlans" [appKioskImage]="planImage" alt="" />
    <figcaption class="plan-item-figcaption">
      <div appFitText [minFontSizePx]="16" class="plan-item-figcaption__event-name">
        {{ planName }}
      </div>
      <div class="plan-item-figcaption__rating" *ngIf="showRating && planRating !== null">
        <ignt-rating [score]="planRating" [ratingsCount]="planNumRatings" size="small"></ignt-rating>
      </div>
      <div class="plan-item-figcaption__price" *ngIf="planPrice.length > 0">
        <span *ngIf="planPriceStrikethrough.length > 0" class="plan-item-figcaption__price-strikethrough">{{
          planPriceStrikethrough
        }}</span>
        <div class="plan-item-figcaption__current-price">
          <small>{{ 'common.from' | translate }}</small>
          {{ planPrice }}
        </div>
      </div>
    </figcaption>
    <!-- Overlays positioned outside the flex flow -->
    <div class="plan-item__sold-out-overlay" *ngIf="isSoldOut"></div>
    <div class="plan-item__sold-out-badge" *ngIf="isSoldOut">
      {{ 'kiosk.soldOutBadge' | translate }}
    </div>
  </figure>
</div>
