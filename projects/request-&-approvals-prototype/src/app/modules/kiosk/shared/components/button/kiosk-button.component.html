<button
  data-testid="kiosk-button"
  [ngClass]="{
    'button--secondary': secondary,
    'button--primary': !secondary,
    'button--fill': fill,
    'button--disabled': disabled,
    'button--compact': compact,
    'button--slim': slim,
  }"
  class="button"
  [disabled]="disabled"
>
  @if (icon) {
    <ignt-icon class="button__ignt" [class.button__ignt--trailing]="iconTrailing" [name]="icon" variant="light" size="h1"></ignt-icon>
  }
  @if (iconSrc) {
    <span class="button__icon" [class.button__icon--trailing]="iconTrailing" [style.mask-image]="'url(' + iconSrc + ')'"></span>
  }
  <span>{{ label }}</span>
</button>
