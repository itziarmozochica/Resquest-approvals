<div class="modal-content discard-cart" [ngStyle]="isKioskEmulatedInFZ() ? { zoom: 0.5 } : {}">
  <app-icon-button class="modal-content__close" icon="close" (click)="close()"></app-icon-button>
  <img class="discard-cart__icon" src="assets/images/icons/icon-error-animated.svg" alt="Error" width="128" height="128" />
  <h2 class="modal-content__title">{{ 'kiosk.modal.discardCart.title' | translate }}</h2>
  <div class="discard-cart__description">{{ 'kiosk.modal.discardCart.message' | translate }}</div>
  <kiosk-button (click)="close()" [fill]="true" [label]="'kiosk.modal.discardCart.cancel' | translate"></kiosk-button>
  <kiosk-button (click)="confirm()" [fill]="true" [secondary]="true" [label]="'kiosk.modal.discardCart.confirm' | translate"></kiosk-button>
</div>
