<div class="hero" [class.hero--sticky]="isSticky" [class.hero--minimal]="hideContent()">
  <div class="hero__wrapper" data-fzk="plan-splash">
    <div class="hero__header hero-header">
      <img class="hero-header__logo" [src]="defaultLogoImage" height="64" alt="Fever logo" />
      <div class="hero-header__actions">
        @if (!hideHomeButton) {
          <app-toolbar-button [onClicked]="onHomeClicked.bind(this)" [isDisabled]="isHomeDisabled()"></app-toolbar-button>
        }
        @if (showManageBooking()) {
          <kiosk-button
            class="hero-header__manage-booking"
            data-testid="manage-booking-button"
            [secondary]="true"
            [compact]="true"
            [icon]="'calendar-pen'"
            [label]="manageBookingLabel()"
            (click)="onManageBookingClicked()?.()"
          ></kiosk-button>
        }
        @if (!hideLanguageSelector) {
          <app-language-toggle></app-language-toggle>
        }
      </div>
    </div>
    @if (!hideContent()) {
      <div class="hero__content">
        <h1 appFitText [minFontSizePx]="24" class="hero__title">{{ title() }}</h1>
        @if (supportingText) {
          <h2 class="hero__supporting-text">{{ supportingText }}</h2>
        }
        @if (badgeText) {
          <div class="hero__badge">{{ badgeText }}</div>
        }
        <ng-content></ng-content>
      </div>
    }
  </div>
</div>
