<section class="kiosk-category-section">
  @if (hasTitle()) {
    <header class="kiosk-category-section__header">
      <h2 class="kiosk-category-section__title">{{ category().name }}</h2>
      @if (category().has_more_plans) {
        <kiosk-button
          class="kiosk-category-section__show-all"
          data-testid="show-all-tickets"
          [secondary]="true"
          [compact]="true"
          [label]="'kiosk.categorySection.showAll' | translate"
          (click)="onShowAll()"
        ></kiosk-button>
      }
    </header>
  }
  <app-kiosk-plan-square-carousel-row [plans]="plans()" [onItemClicked]="onItemClicked()"></app-kiosk-plan-square-carousel-row>
</section>
