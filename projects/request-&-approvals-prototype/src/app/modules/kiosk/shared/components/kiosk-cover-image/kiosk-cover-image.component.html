<div class="kiosk-cover-image-wrapper">
  <app-cover-image [image]="image" [animated]="animated"> </app-cover-image>

  <ng-container *ngIf="isPlanSoldOut()">
    <div class="sold-out-overlay" aria-hidden="true"></div>
    <div class="sold-out-badge" role="status">
      {{ 'kiosk.soldOutBadge' | translate }}
    </div>
  </ng-container>
</div>
