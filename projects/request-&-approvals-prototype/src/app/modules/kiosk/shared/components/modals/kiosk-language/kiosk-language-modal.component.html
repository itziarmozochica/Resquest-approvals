<div class="modal-content language-selecto" [ngStyle]="isKioskEmulatedInFZ() ? { zoom: 0.5 } : {}">
  <app-icon-button
    class="modal-content__close"
    customClass="icon-button--secondary"
    icon="close"
    (click)="onLanguageSelected(undefined)"
  ></app-icon-button>
  <h2 class="modal-content__title">{{ 'kiosk.modal.language.title' | translate }}</h2>
  <div class="language-selector__list">
    <ng-container *ngFor="let language of data.languages">
      <li class="language-selector__list--item">
        <button
          class="language-toggle"
          [attr.data-fzk]="'kiosk-language-option-' + language.id"
          (click)="onLanguageSelected(language)"
          [ngClass]="{
            'language-toggle__selected': language.id === data.selected.id,
          }"
        >
          <span class="language-toggle__label">{{ language.label | translate }}</span>
        </button>
      </li>
    </ng-container>
  </div>
</div>
