<div class="modal-content upgrade">
  <div class="upgrade__header">
    <h3 class="upgrade__header-title">{{ 'kiosk.cartUpgrade.bannerTitle' | translate }}</h3>
    <app-icon-button class="upgrade__header-close" icon="close" (click)="close()"></app-icon-button>
  </div>

  @if (upgrade.imageUrl) {
    <img class="upgrade__image" [src]="upgrade.imageUrl" [alt]="upgrade.title" />
  }

  <div class="upgrade__body">
    <h2 class="upgrade__title">{{ upgrade.title }}</h2>

    <p class="upgrade__description">{{ upgrade.description }}</p>

    <div class="upgrade__info">
      <div class="upgrade__info-row">
        <ignt-icon name="calendar-plus" variant="light" class="upgrade__info-icon"></ignt-icon>
        <span>{{ 'kiosk.cartUpgrade.scheduleInfo' | translate: { days: upgrade.upgradeSchedulingDays } }}</span>
      </div>
      <div class="upgrade__info-row">
        <ignt-icon name="ticket-alt" variant="light" class="upgrade__info-icon"></ignt-icon>
        <span>{{ 'kiosk.cartUpgrade.personInfo' | translate: { count: totalUnits } }}</span>
      </div>
    </div>

    <div class="upgrade__actions">
      <kiosk-button
        [label]="'kiosk.cartUpgrade.addButton' | translate: { amount: formattedAmount }"
        [secondary]="true"
        [fill]="true"
        (click)="add()"
      ></kiosk-button>
      <kiosk-button [label]="'kiosk.cartUpgrade.skipButton' | translate" [fill]="true" (click)="skip()"></kiosk-button>
    </div>
  </div>
</div>
