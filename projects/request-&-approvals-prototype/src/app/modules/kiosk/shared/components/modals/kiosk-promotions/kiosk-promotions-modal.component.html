<div class="modal-content promotions">
  <app-icon-button class="modal-content__close" icon="close" (click)="modalClose()" customClass="icon-button--secondary"></app-icon-button>
  <div class="modal-content__header">
    <h2 class="modal-content__title">{{ 'kiosk.promotions.modal.title' | translate }}</h2>
    <h4 class="modal-content__subtitle">{{ 'kiosk.promotions.modal.subtitle' | translate }}</h4>
  </div>

  <form class="promotions__form" [formGroup]="form" (ngSubmit)="applyPromotions()">
    <div class="promotions__list">
      <ng-container *ngFor="let promotion of promotionsItems">
        <ng-container [ngSwitch]="promotion.validation_method.type">
          <ng-container *ngSwitchCase="'user_password'">
            <app-input-promotion
              [promotion]="promotion"
              [formArray]="form.controls.promotions"
              [isApplied]="promotion.isApplied ?? false"
              [isInvalid]="promotion.isInvalid ?? false"
              [isOpen]="promotion.isOpen ?? false"
            />
          </ng-container>
          <ng-container *ngSwitchCase="'promotional_code'">
            <app-code-promotion
              [promotion]="promotion"
              [formArray]="form.controls.promotions"
              [isApplied]="promotion.isApplied ?? false"
              [isInvalid]="promotion.isInvalid ?? false"
              [isOpen]="promotion.isOpen ?? false"
            />
          </ng-container>
          <ng-container *ngSwitchDefault>
            <app-generic-promotion
              [promotion]="promotion"
              [formArray]="form.controls.promotions"
              [isApplied]="promotion.isApplied ?? false"
              [isInvalid]="promotion.isInvalid ?? false"
              [isOpen]="promotion.isOpen ?? false"
              [codeMaxLength]="genericCodeMaxLength"
            />
          </ng-container>
        </ng-container>
      </ng-container>
    </div>

    <kiosk-button
      (click)="applyPromotions()"
      [fill]="true"
      [label]="'kiosk.promotions.modal.apply' | translate"
      [disabled]="!canApply"
    ></kiosk-button>
  </form>
</div>
