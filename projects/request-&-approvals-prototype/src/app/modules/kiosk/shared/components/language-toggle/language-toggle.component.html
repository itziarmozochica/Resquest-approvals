<button
  class="language-toggle"
  data-fzk="kiosk-language-toggle"
  *ngIf="selectedLanguageOption !== null"
  (touchend)="languageToggleClick($event)"
  (click)="languageToggleClick($event)"
>
  <ignt-icon class="language-toggle__language-icon" name="globe" variant="light" size="h2" [fixedWidth]="true"></ignt-icon>
  <span class="language-toggle__label">{{ selectedLanguageOption?.label | translate }}</span>
  <ignt-icon class="language-toggle__icon" name="chevron-down" variant="solid" size="h2"></ignt-icon>
</button>
