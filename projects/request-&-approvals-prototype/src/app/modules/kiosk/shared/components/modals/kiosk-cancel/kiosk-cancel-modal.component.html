<div class="modal-content cancel-order" [ngStyle]="isKioskEmulatedInFZ() ? { zoom: 0.5 } : {}">
  <app-icon-button class="modal-content__close" icon="close" (click)="close()"></app-icon-button>
  <img class="cancel-order__icon" src="assets/images/icons/icon-error-animated.svg" alt="Error" width="128" height="128" />
  <h2 class="modal-content__title">{{ 'kiosk.modal.cancel.title' | translate }}</h2>
  <div class="cancel-order__description">{{ 'kiosk.modal.cancel.message' | translate }}</div>
  <kiosk-button (click)="close()" [fill]="true" [label]="'kiosk.modal.cancel.cancel' | translate"></kiosk-button>
  <kiosk-button (click)="confirm()" [fill]="true" [secondary]="true" [label]="'kiosk.modal.cancel.confirm' | translate"></kiosk-button>
</div>
