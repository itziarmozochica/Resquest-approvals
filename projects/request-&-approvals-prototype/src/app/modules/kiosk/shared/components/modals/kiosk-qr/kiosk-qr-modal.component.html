<div class="modal-content" role="dialog">
  <app-icon-button class="modal-content__close" icon="close" (click)="closeTicketModal()"></app-icon-button>

  <h2 class="modal-content__title">{{ 'kiosk.ticketModal.qr.title' | translate }}</h2>
  <p>{{ 'kiosk.ticketModal.qr.paragraph' | translate }}</p>
  <div class="qr-wrapper">
    <img [src]="code()" alt="QR Code" />
  </div>
  <p>{{ countDownMessage() }}</p>
  <kiosk-button (click)="qrNeedsMoreTime()" [label]="'kiosk.ticketModal.qr.button' | translate"></kiosk-button>
</div>
