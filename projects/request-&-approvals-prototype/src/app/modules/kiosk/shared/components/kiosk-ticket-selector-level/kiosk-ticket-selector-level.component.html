<ng-container *ngFor="let row of levelRows; let first = first">
  <div [class]="first ? 'levels' : 'levels__grid'" data-testid="level-row" data-fzk="level-row">
    <ng-container *ngFor="let level of getVisibleLevels(row)">
      <ng-container *ngTemplateOutlet="levelTemplate; context: { level, levels: row }"></ng-container>
    </ng-container>
  </div>
</ng-container>

<ng-template #levelTemplate let-level="level" let-levels="levels">
  <button
    class="level"
    data-testid="level-item"
    data-fzk="level-item"
    [ngClass]="{
      'level--selected': level.selected,
      'level--disabled': level.isDisabled(),
    }"
    (click)="selectLevel(level, levels)"
  >
    <div class="level__check">
      <ignt-icon class="level__check-icon" name="check" variant="light"></ignt-icon>
    </div>
    {{ level.displayName }}
  </button>
</ng-template>
