<app-modal-content>
  <div class="modal-body modal__content">
    <div class="modal__title" data-testid="modal-title">
      {{ 'kiosk.cart.details.title' | translate }}
    </div>
    <div class="modal__cart-details">
      <cart-detail [cart]="cart" [title]="planVenue" [showClearAll]="false"></cart-detail>
    </div>
    <div class="modal__actions">
      <button class="modal__button" data-testid="modal-accept-button" (click)="close()">
        {{ 'common.close' | translate }}
      </button>
    </div>
  </div>
</app-modal-content>
