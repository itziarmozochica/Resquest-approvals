<div class="modal-content are-you-there" [ngStyle]="isKioskEmulatedInFZ() ? { zoom: 0.5 } : {}" (click)="close(true)">
  <h2 class="modal_content__title">{{ 'kiosk.modal.idle.title' | translate }}</h2>
  <img class="are-you-there__icon" src="assets/images/icons/fa-hourglass-end.svg" alt="Are you there?" width="84" height="112" />
  <div class="are-you-there__text">{{ 'kiosk.modal.idle.subtitle' | translate }}</div>
  <div class="are-you-there__description">
    {{ 'kiosk.modal.idle.message' | translate }}
  </div>
  <div class="are-you-there__timer">{{ acceptButtonLabel$ | async }}</div>
  <kiosk-button (click)="close(true)" [fill]="true" [label]="'kiosk.modal.idle.button' | translate"></kiosk-button>
</div>
