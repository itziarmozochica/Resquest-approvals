<div class="modal-content serial-qr" role="dialog">
  <app-icon-button class="modal-content__close" icon="close" (click)="close()"></app-icon-button>

  <h2 class="modal-content__title">Device serial</h2>
  <p class="serial-qr__caption">Scan this code to read the device serial number</p>

  <div class="serial-qr__code">
    @if (qrDataUrl(); as qrDataUrl) {
      <img [src]="qrDataUrl" alt="QR code with the device serial number" />
    }
  </div>

  <p class="serial-qr__value">{{ serial }}</p>
</div>
