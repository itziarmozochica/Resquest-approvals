<div class="square-item" (click)="onItemClicked()(plan())">
  <figure class="square-item__fig">
    <img class="square-item__img" [appKioskImage]="planImage" alt="" />
    <figcaption class="square-item__figcaption">
      <div appFitText [minFontSizePx]="16" class="square-item__name">{{ plan().name }}</div>
      @if (showRating && plan().rating.average !== null) {
        <div class="square-item__rating">
          <ignt-rating [score]="plan().rating.average" [ratingsCount]="plan().rating.num_ratings" size="small"></ignt-rating>
        </div>
      }
      @if (showPrice) {
        <div class="square-item__price">
          @if (formattedStrikethroughPrice.length > 0) {
            <span class="square-item__price-strikethrough">{{ formattedStrikethroughPrice }}</span>
          }
          <div class="square-item__current-price">
            <small>{{ 'common.from' | translate }}</small>
            {{ formattedPrice }}
          </div>
        </div>
      }
    </figcaption>
    @if (isSoldOut) {
      <div class="square-item__sold-out-overlay"></div>
      <div class="square-item__sold-out-badge">{{ 'kiosk.soldOutBadge' | translate }}</div>
    }
  </figure>
</div>
