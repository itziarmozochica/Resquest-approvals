<div class="modal-content cancel-payment" [ngStyle]="isKioskEmulatedInFZ() ? { zoom: 0.5 } : {}">
  <app-icon-button class="modal-content__close" icon="close" (click)="close()"></app-icon-button>
  <img class="cancel-payment__icon" src="assets/images/icons/icon-error-animated.svg" alt="Error" width="128" height="128" />
  <h2 class="modal-content__title">{{ 'kiosk.modal.cancelPayment.title' | translate }}</h2>
  <div class="cancel-payment__description">{{ 'kiosk.modal.cancelPayment.message' | translate }}</div>
  <kiosk-button (click)="close()" [fill]="true" [label]="'kiosk.modal.cancelPayment.cancel' | translate"></kiosk-button>
  <kiosk-button
    (click)="confirm()"
    [fill]="true"
    [secondary]="true"
    [label]="'kiosk.modal.cancelPayment.confirm' | translate"
  ></kiosk-button>
</div>
