<div class="kiosk-slider-wrapper" #sliderWrapper>
  <app-ken-burns-slider
    [items]="sliderItems()"
    (imageClicked)="onImageClicked($event)"
    (currentIndexChanged)="onCurrentIndexChanged($event)"
  >
  </app-ken-burns-slider>

  <div class="sold-out-overlay" [class.visible]="isCurrentPlanSoldOut()" aria-hidden="true"></div>
  <div class="sold-out-badge" [class.visible]="isCurrentPlanSoldOut()" role="status">
    {{ 'kiosk.soldOutBadge' | translate }}
  </div>
</div>
