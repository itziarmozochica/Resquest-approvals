<div class="modal-content terms">
  <app-icon-button
    class="modal-content__close terms__close"
    icon="close"
    customClass="icon-button--secondary"
    (click)="close()"
  ></app-icon-button>
  <h2 class="modal-content__title">{{ data.titleKey | translate }}</h2>
  <div class="terms__body" [innerHTML]="bodyHtml()"></div>
  <div class="terms__footer">
    <kiosk-button (click)="accept()" [fill]="true" [label]="'common.accept' | translate"></kiosk-button>
    <kiosk-button (click)="close()" [fill]="true" [secondary]="true" [label]="'common.cancel' | translate"></kiosk-button>
  </div>
</div>
