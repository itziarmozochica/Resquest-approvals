<div class="plans-grid-content" [class.plans-grid-content__two-plans]="isTwoPlans">
  @for (plan of plans; track plan.id) {
    <app-kiosk-plan-item
      class="plans-grid-content__item"
      (click)="onItemClicked(plan)"
      [planImage]="getPlanCoverImage(plan)"
      [planName]="plan.name"
      [isTwoPlans]="isTwoPlans"
      [planRating]="plan.rating.average"
      [planNumRatings]="plan.rating.num_ratings"
      [showRating]="showRating(plan)"
      [planPrice]="formatPrice(plan)"
      [planPriceStrikethrough]="formatStrikethroughPrice(plan)"
      [isSoldOut]="isPlanSoldOut(plan)"
    ></app-kiosk-plan-item>
  }
</div>
