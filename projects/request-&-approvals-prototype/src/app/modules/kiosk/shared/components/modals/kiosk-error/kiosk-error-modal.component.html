<div class="modal-content error">
  <app-icon-button class="modal-content__close" icon="close" (click)="close()"></app-icon-button>
  <img class="error__icon" src="assets/images/icons/icon-error-animated.svg" alt="Error" width="128" height="128" />
  <h2 class="modal-content__title">{{ data.title }}</h2>
  <div class="error__description">{{ data.messages.join(' ') }}</div>
  <kiosk-button (click)="confirm()" [fill]="true" [label]="data.buttonLabel"></kiosk-button>
</div>
