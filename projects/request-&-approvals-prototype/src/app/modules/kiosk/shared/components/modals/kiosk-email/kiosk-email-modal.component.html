<div class="modal-content email">
  @if (!isSending()) {
    <app-icon-button class="modal-content__close" icon="close" (click)="close()"></app-icon-button>
  }
  <h2 class="modal-content__title">{{ 'kiosk.ticketModal.email.title' | translate }}</h2>
  <p>
    {{ 'kiosk.ticketModal.email.paragraph' | translate }}
  </p>
  <form class="email-form" autocomplete="off">
    <fieldset class="fieldset">
      <label class="field">
        <input
          class="field__input"
          type="email"
          autocomplete="off"
          name="textinput"
          [placeholder]="'kiosk.ticketModal.email.placeholder' | translate"
          #emailRef
          [ngClass]="{ 'is-invalid': emailInvalid }"
          value="{{ data.email ?? '' }}"
        />
        <span class="field__label">{{ 'kiosk.ticketModal.email.placeholder' | translate }}</span>
      </label>
      <div *ngIf="emailInvalid" class="email__error">
        {{ 'kiosk.ticketModal.email.invalid' | translate }}
      </div>
      @if (sendFailed()) {
        <div class="email__error">
          {{ 'kiosk.ticketModal.email.error' | translate }}
        </div>
      }
    </fieldset>
  </form>
  <kiosk-button
    (click)="sendEmail(emailRef.value)"
    [disabled]="isSending()"
    [label]="(isSending() ? 'kiosk.ticketModal.email.sending' : 'kiosk.ticketModal.email.button') | translate"
  ></kiosk-button>
</div>
