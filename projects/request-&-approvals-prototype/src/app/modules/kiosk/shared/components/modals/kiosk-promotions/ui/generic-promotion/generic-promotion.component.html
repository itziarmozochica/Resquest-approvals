<div class="promotions__item">
  <details [open]="promotion.required || isOpen">
    <summary class="promotions__item--header" [class.promotions-required]="promotion.required">
      <div>
        <p class="title">{{ promotion.name }}</p>
        <ignt-icon class="icon icon--close" name="minus" variant="regular"></ignt-icon>
        <ignt-icon class="icon icon--open" name="plus" variant="regular"></ignt-icon>
      </div>
      <div>
        <p class="description">
          {{ promotion.description }}
        </p>
      </div>
    </summary>
    <div class="promotions__item--validator" *ngIf="promoFormGroup">
      <form novalidate [formGroup]="promoFormGroup">
        <div class="promotions__input--wrapper">
          <ignt-input-field
            class="promotions__input--item"
            formControlName="code"
            type="text"
            [label]="'kiosk.promotions.modal.genericCodePlaceholder' | translate"
            [placeholder]="'kiosk.promotions.modal.genericCodePlaceholder' | translate"
            [helperText]="promotion.required ? ('kiosk.promotions.modal.required' | translate) : ''"
            [maxlength]="codeMaxLength"
          >
          </ignt-input-field>
        </div>
      </form>
    </div>
  </details>
</div>
