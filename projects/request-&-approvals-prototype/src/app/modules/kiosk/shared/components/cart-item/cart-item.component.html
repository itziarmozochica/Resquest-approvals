<div class="cart-item">
  <div class="cart-item__amount">{{ amount }}x</div>
  <div class="cart-item__details">
    <div class="ticket-details">
      <div class="ticket-details__label">{{ ticketTypeName }}</div>
      <div class="ticket-details__price">
        <span *ngIf="ticketTypePriceStrikethrough !== null" class="ticket-details__price-strikethrough">
          <ng-container *ngTemplateOutlet="cartMoney; context: { money: ticketTypePriceStrikethrough, locale: locale() }"></ng-container>
        </span>
        <div class="ticket-details__current-price">
          <ng-container *ngTemplateOutlet="cartMoney; context: { money: ticketTypePrice, locale: locale() }"></ng-container>
        </div>
      </div>
    </div>
    <div *ngIf="feePricePerTicket.amount > 0" class="ticket-fee">
      <div class="ticket-fee__label">
        {{ 'kiosk.checkout.purchaseDetails.cartItem.fee' | translate }}
        <ng-container *ngTemplateOutlet="cartMoney; context: { money: feePricePerTicket, locale: locale() }"></ng-container>
      </div>
      <div class="ticket-fee__price">
        <ng-container *ngTemplateOutlet="cartMoney; context: { money: totalSurchagePrice, locale: locale() }"></ng-container>
      </div>
    </div>
  </div>
</div>

<ng-template #cartMoney let-locale="locale" let-money="money">
  {{ money ? (money.amount | kioskCurrency: money.currency : locale) : '-' }}
</ng-template>
