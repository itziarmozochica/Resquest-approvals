<main class="main-wrapper">
  <app-kiosk-hero [title]="plan?.name" [isSticky]="true" [hideHomeButton]="true"></app-kiosk-hero>

  <form class="booking-questions__wrapper form" [formGroup]="formGroup">
    <fv-booking-questions-form-group
      [formData]="formData"
      [formGroup]="formGroup"
      [showTicketCounter]="true"
      [showTicketLabel]="true"
      [dateQuestionTemplate]="kioskDateQuestionTemplate"
    ></fv-booking-questions-form-group>
  </form>

  <ng-template #kioskDateQuestionTemplate let-controlId="controlId" let-question="question">
    <app-kiosk-date-question-item [controlId]="controlId" [formGroup]="formGroup" [question]="question"></app-kiosk-date-question-item>
  </ng-template>

  <app-action-footer
    primaryButtonText="{{ 'kiosk.booking-questions.footer.primary_button' | translate }}"
    secondaryButtonText="{{ 'kiosk.booking-questions.footer.secondary_button' | translate }}"
    [primaryFill]="true"
    [disablePrimary]="!formGroup.valid"
    (primaryButtonClick)="onContinueClicked()"
    (secondaryButtonClick)="onBackClicked()"
  ></app-action-footer>
</main>
