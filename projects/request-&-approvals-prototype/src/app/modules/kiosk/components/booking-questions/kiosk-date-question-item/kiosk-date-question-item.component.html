<div class="kiosk-date-question-item" [formGroup]="formGroup()">
  <app-kiosk-date-picker
    class="kiosk-date-question-item__picker"
    [applyLabel]="'bookingQuestionsForm.applyButton' | translate"
    [hasError]="hasError()"
    [label]="question().label"
    [maxDate]="maxDate()"
    [minDate]="minDate()"
    [modalTitle]="question().label"
    [startDate]="startDate()"
    [timezone]="timezone"
    (changeDate)="onDateSelected($event)"
  ></app-kiosk-date-picker>

  @for (error of dateErrors; track error.name) {
    @if (controlTouched()) {
      <ignt-field-error [errorName]="error.name" [formControlValue]="control()">
        {{ error.message | translate }}
      </ignt-field-error>
    }
  }
</div>
