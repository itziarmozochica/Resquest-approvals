<main class="main-wrapper">
  <app-kiosk-hero
    [title]="plan.name"
    [supportingText]="uiRefreshEnabled ? undefined : ('kiosk.payment.hero.supportingText' | translate)"
    [hideLanguageSelector]="true"
    [hideHomeButton]="true"
  ></app-kiosk-hero>

  <div class="main-wrapper--content flex-box-wrapper block" [ngSwitch]="currentTemplate">
    <ng-container *ngIf="!isLoading(); else loadingSkeleton">
      <ng-template ngSwitchCase="paymentMethod">
        <div class="payment-method-wrapper">
          <header class="payment-method-wrapper__header payment-method-header">
            <h1 class="payment-method-header__title">{{ 'kiosk.payment.title' | translate }}</h1>
          </header>
          <ul class="payment-method-list">
            <li *ngFor="let method of paymentMethods" class="payment-method-list__item">
              <button class="payment-method-list__button" (click)="clickOnPaymentMethod(method)">
                <img [src]="method.src" [alt]="method.alt" height="48" />
                <span>{{ method.label }}</span>
              </button>
            </li>
          </ul>
        </div>
      </ng-template>
      <ng-template ngSwitchCase="paymentInProgress">
        <div class="payment-wrapper">
          <img class="payment-wrapper__img" src="assets/images/icons/pinpad-animated.svg" width="232" alt="Pinpad" />
          <h1 class="payment-wrapper__text">{{ 'kiosk.payment.padInstructions' | translate }}</h1>
          <!-- <footer class="payment-wrapper__footer payment-footer">
            <p class="payment-footer__text">{{ 'kiosk.payment.acceptedMethods' | translate }}</p>
            <ul class="payment-footer__list">
              <li class="item">
                <img src="assets/images/kiosk/payment-logos/visa.svg" alt="Visa" />
              </li>
              <li class="item">
                <img src="assets/images/kiosk/payment-logos/amex.svg" alt="Amex" />
              </li>
              <li class="item">
                <img src="assets/images/kiosk/payment-logos/mastercard.svg" alt="Mastercard" />
              </li>
              <li class="item">
                <img src="assets/images/kiosk/payment-logos/google-pay.svg" alt="Google Pay" />
              </li>
              <li class="item">
                <img src="assets/images/kiosk/payment-logos/apple-pay.svg" alt="Apple Pay" />
              </li>
            </ul>
          </footer> -->
        </div>
      </ng-template>
    </ng-container>
  </div>

  <app-action-footer
    *ngIf="isSecondaryButtonVisible()"
    secondaryButtonText="{{ 'kiosk.payment.footer.secondaryButton' | translate }}"
    [secondaryFill]="true"
    [disableSecondary]="isSecondaryButtonDisabled()"
    (secondaryButtonClick)="onCancelButton()"
  ></app-action-footer>
</main>

<ng-template #loadingSkeleton>
  <div class="loading-skeleton">
    <ignt-skeleton-base [alignment]="'center'" [animation]="true" [height]="200" [width]="'20%'"> </ignt-skeleton-base>
    <ignt-skeleton [type]="'item'" [animation]="true" [numElements]="3"> </ignt-skeleton>
  </div>
</ng-template>
