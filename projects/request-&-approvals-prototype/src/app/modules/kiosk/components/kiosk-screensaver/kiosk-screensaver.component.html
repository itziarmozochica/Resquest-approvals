@if (videoUrl(); as url) {
  <div
    class="kiosk-screensaver"
    role="button"
    tabindex="0"
    data-fzk="kiosk-screensaver"
    [class.kiosk-screensaver--visible]="isVideoPlaying()"
    (click)="dismiss()"
    (keydown.enter)="dismiss()"
    (touchend)="dismiss($event)"
    (animationend)="resetScroll()"
  >
    <video
      #screensaverVideo
      class="kiosk-screensaver__video"
      loop
      muted
      playsinline
      [muted]="true"
      [src]="url"
      (loadedmetadata)="onVideoReady(screensaverVideo)"
      (playing)="onVideoPlaying()"
      (error)="onVideoError(screensaverVideo)"
    ></video>
    <img
      class="kiosk-screensaver__logo"
      data-fzk="screensaver-logo"
      [src]="logoUrl()"
      [style.width.px]="logoWidthPx()"
      (error)="onLogoError()"
      alt=""
    />
