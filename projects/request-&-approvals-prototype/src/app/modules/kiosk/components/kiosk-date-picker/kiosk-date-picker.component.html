<div class="kiosk-date-picker-field" data-testid="kiosk-date-picker">
  <button
    type="button"
    class="kiosk-date-picker-field__trigger"
    [class.kiosk-date-picker-field__trigger--error]="hasError()"
    [class.kiosk-date-picker-field__trigger--filled]="selectedDateDisplay().length > 0"
    data-testid="kiosk-date-picker-input"
    aria-haspopup="dialog"
    (click)="openModal()"
  >
    <span class="kiosk-date-picker-field__value">
      {{ selectedDateDisplay().length > 0 ? selectedDateDisplay() : label() }}
    </span>
    <ignt-icon class="kiosk-date-picker-field__icon" name="calendar-day" variant="light" [fixedWidth]="true"></ignt-icon>
  </button>
</div>
