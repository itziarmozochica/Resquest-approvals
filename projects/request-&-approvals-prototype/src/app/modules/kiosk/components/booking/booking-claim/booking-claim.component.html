<div class="booking-claim">
  <app-kiosk-hero [title]="'kiosk.booking.claim.pageTitle' | translate"></app-kiosk-hero>

  <section class="booking-claim__card">
    <div class="booking-claim__intro">
      <h2 class="booking-claim__title">{{ 'kiosk.booking.claim.title' | translate }}</h2>
      <p class="booking-claim__instructions" [innerHTML]="'kiosk.booking.claim.instructions' | translate"></p>
    </div>

    <img class="booking-claim__sheet" src="assets/images/kiosk/booking-claim-sheet.png" alt="" />

    <form class="booking-claim__form" (submit)="$event.preventDefault(); submitReference()">
      <ignt-input-field
        [formControl]="referenceControl"
        [label]="'kiosk.booking.claim.codeLabel' | translate"
        [pipe]="uppercasePipe"
      ></ignt-input-field>

      @if (hasError()) {
        <p class="booking-claim__error" data-testid="booking-claim-error">{{ 'kiosk.booking.claim.error' | translate }}</p>
      }
    </form>
  </section>

  <div class="booking-claim__actions">
    <kiosk-button
      data-testid="booking-claim-back"
      [secondary]="true"
      (click)="goHome()"
      [label]="'kiosk.booking.back' | translate"
    ></kiosk-button>
    <kiosk-button
      data-testid="booking-claim-continue"
      [fill]="true"
      [disabled]="!canContinue()"
      (click)="submitReference()"
      [label]="'kiosk.booking.claim.continue' | translate"
    ></kiosk-button>
  </div>
</div>
