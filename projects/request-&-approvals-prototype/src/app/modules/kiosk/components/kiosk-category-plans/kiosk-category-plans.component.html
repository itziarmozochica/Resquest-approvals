<div class="main-wrapper main-wrapper--content" [style.height]="isKioskEmulatedInFZ() ? '1920px' : null">
  <app-kiosk-hero [hideContent]="true" [hideHomeButton]="true" [isSticky]="true"></app-kiosk-hero>

  <div class="kiosk-category-plans__content">
    <header class="kiosk-category-plans__header">
      <h1 class="kiosk-category-plans__title">{{ categoryName }}</h1>
      @if (categoryDescription) {
        <p class="kiosk-category-plans__subtitle">{{ categoryDescription }}</p>
      }
    </header>
    <div class="kiosk-category-plans__grid">
      @for (plan of plans; track plan.id) {
        <app-kiosk-plan-square-item [plan]="plan" [onItemClicked]="onPlanClicked.bind(this)"></app-kiosk-plan-square-item>
      }
    </div>
  </div>

  @if (uiRefreshEnabled) {
    <app-action-footer
      [secondaryButtonText]="'kiosk.categoryPlans.back' | translate"
      [secondaryFill]="true"
      (secondaryButtonClick)="onBackClicked()"
    ></app-action-footer>
  } @else {
    <div class="kiosk-category-plans__footer">
      <kiosk-button
        [label]="'kiosk.categoryPlans.back' | translate"
        [secondary]="true"
        [fill]="true"
        (click)="onBackClicked()"
      ></kiosk-button>
    </div>
  }
</div>
