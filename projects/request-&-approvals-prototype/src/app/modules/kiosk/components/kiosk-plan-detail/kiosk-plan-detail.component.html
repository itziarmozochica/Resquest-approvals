<main class="main-wrapper">
  <app-kiosk-hero [title]="title" [badgeText]="badgeText" [isSticky]="true"></app-kiosk-hero>
  <div class="main-wrapper--content plan-content-wrapper">
    <div class="plan-gallery" [class.has-image]="kioskPlanDetail !== null" [ngClass]="galleryClass" [@fadeAnimation]="kioskPlanDetail">
      <ng-container *ngIf="kioskPlanDetail !== null">
        <img *ngFor="let image of galleryImages" [appKioskImage]="image" alt="photo" />
      </ng-container>
    </div>
    <div class="plan-description" data-testid="reservation-plan-description-container">
      <div [@fadeAnimation]="isLoading()">
        <ng-container *ngIf="!isLoading(); else isLoadingSkeleton">
          <div *ngIf="kioskPlanDetail !== null" [innerHTML]="kioskPlanDetail.description"></div>
        </ng-container>
      </div>
      <ng-template #spinner>
        <div class="plan-description__loading">
          <ignt-icon class="loader" name="spinner" variant="solid" size="display" [spin]="true"></ignt-icon>
        </div>
      </ng-template>
    </div>
  </div>
  <app-action-footer
    [primaryButtonText]="isSoldOut ? undefined : ('kiosk.plan_detail.footer.primary_button' | translate)"
    [secondaryButtonText]="'kiosk.plan_detail.footer.secondary_button' | translate"
    [primaryFill]="true"
    [secondaryFill]="isSoldOut"
    (primaryButtonClick)="onContinueClicked(kioskPlanDetail)"
    (secondaryButtonClick)="onBackClicked()"
  ></app-action-footer>
</main>

<ng-template #isLoadingSkeleton>
  <ignt-skeleton [type]="'paragraph'" [animation]="true" [animation]="true" [numElements]="3" [height]="200"></ignt-skeleton>
</ng-template>
