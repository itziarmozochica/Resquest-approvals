<div class="wrapper">
  <app-multi-select
    [options]="statusOptions"
    [selectedOptions]="selectedStatusOptions"
    [placeholder]="'analytics.realTime.filters.selectStatus' | translate"
    [displayInPlaceMaximum]="1"
    (selected)="selectStatusOptions($event)"
    [isSelectAllVisible]="true"
    [attr.id]="dataTestIdPrefix() + '-select-statuses'"
    [attr.data-testid]="dataTestIdPrefix() + '-select-statuses'"
    class="cell cell--hug-md cell-statuses"
  >
  </app-multi-select>
  <app-multi-select
    [options]="cityOptions"
    [selectedOptions]="selectedCityOptions"
    [placeholder]="'analytics.realTime.filters.selectCities' | translate"
    [displayInPlaceMaximum]="2"
    (selected)="selectCityOptions($event)"
    [isSelectAllVisible]="true"
    [isSelectAllFixHeight]="false"
    [disabled]="selectedStatusOptions.length === 0"
    [attr.data-testid]="dataTestIdPrefix() + '-select-cities'"
    [attr.id]="dataTestIdPrefix() + '-select-cities'"
    class="cell cell--hug-md cell-cities"
  >
  </app-multi-select>
  <app-multi-select
    [options]="placeOptions"
    [selectedOptions]="selectedPlaceOptions"
    [placeholder]="'analytics.realTime.filters.selectPlaces' | translate"
    [displayInPlaceMaximum]="1"
    [isSelectAllVisible]="true"
    (selected)="selectPlaceOptions($event)"
    [disabled]="selectedStatusOptions.length === 0 || selectedCityOptions.length === 0"
    [showItemsDescriptions]="true"
    [attr.id]="dataTestIdPrefix() + '-select-places'"
    [attr.data-testid]="dataTestIdPrefix() + '-select-places'"
    class="cell cell--hug-md cell-places"
  >
  </app-multi-select>
  <app-multi-select
    [options]="planOptions"
    [selectedOptions]="selectedPlanOptions"
    [placeholder]="'analytics.realTime.filters.selectEvents' | translate"
    [displayInPlaceMaximum]="1"
    [maxSelectedOptions]="maxSelectedPlans()"
    [blockAtMax]="maxSelectedPlans() > 1"
    [helpText]="maxSelectedPlans() > 1 ? ('analytics.realTime.filters.maxEventsHint' | translate: { max: maxSelectedPlans() }) : null"
    [selectedSummaryText]="selectedPlansSummary()"
    (selected)="selectPlanOptions($event)"
    [disabled]="selectedStatusOptions.length === 0 || selectedCityOptions.length === 0"
    [attr.id]="dataTestIdPrefix() + '-select-plans'"
    [attr.data-testid]="dataTestIdPrefix() + '-select-plans'"
    class="cell cell--fill-md"
  >
  </app-multi-select>
  @if (hasCurrencySelector()) {
    <app-multi-select
      [options]="currencyOptions"
      [selectedOptions]="selectedCurrencyOptions"
      [placeholder]="'analytics.analytics360.currency.helpText' | translate"
      [displayInPlaceMaximum]="1"
      [maxSelectedOptions]="1"
      (selected)="selectCurrency($event)"
      [attr.id]="dataTestIdPrefix() + '-select-currency'"
      [attr.data-testid]="dataTestIdPrefix() + '-select-currency'"
      class="cell cell--hug-md cell-currency"
    >
    </app-multi-select>
  }
</div>
