<app-page-title
  [section]="'analyticsHome.pageTitle' | translate"
  [sectionLink]="analyticsHomeLink"
  [title]="'analytics.realTimeBigLaunches.title' | translate"
  class="new-design"
  backRoute="reports"
></app-page-title>
<div class="main-wrapper">
  <div class="real-time-panel">
    <div class="reports-filters">
      <form (submit)="$event.preventDefault()">
        <fieldset class="fieldset">
          <app-real-time-filters
            dataTestIdPrefix="real-time-big-launches"
            data-testid="real-time-big-launches-filters"
            [maxSelectedPlans]="facade.maxSelectedPlans"
            [hasCurrencySelector]="true"
            (filtersSelected)="facade.selectFilters($event)"
          ></app-real-time-filters>
        </fieldset>
      </form>
    </div>
    <div class="dashboard-data">
      @if (facade.embedDashboardId(); as dashboardId) {
        <app-real-time-embedded-frame
          [dashboardId]="dashboardId"
          [frameTitle]="'analytics.realTimeBigLaunches.iframeTitle' | translate"
          [selection]="facade.embeddedSelection()"
          dataTestIdPrefix="real-time-big-launches"
        ></app-real-time-embedded-frame>
      } @else {
        <app-real-time-empty-selection
          [detail]="'analytics.realTime.nothingSelected.detail' | translate"
          [hint]="'analytics.analytics360.nothingSelected.sameCurrency' | translate"
          [title]="'analytics.analytics360.nothingSelected.title' | translate"
          dataTestIdPrefix="real-time-big-launches"
          imageSrc="assets/images/reports/360-inspiration.svg"
        ></app-real-time-empty-selection>
      }
    </div>
  </div>
</div>
