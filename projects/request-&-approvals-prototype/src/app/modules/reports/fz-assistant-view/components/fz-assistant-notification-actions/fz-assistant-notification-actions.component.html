@if (actions().length) {
  <p class="fz-assistant-notification-actions__question">{{ questionKey() | translate }}</p>
  <ul class="fz-assistant-notification-actions__list" role="list">
    @for (action of actions(); track $index) {
      <li>
        <span
          class="fz-assistant-notification-actions__chip"
          role="button"
          tabindex="0"
          data-testid="fz-assistant-suggested-question"
          [style.--i]="$index"
          (click)="actionSelected.emit(action)"
          (keydown.enter)="actionSelected.emit(action)"
          (keydown.space)="$event.preventDefault(); $event.repeat || actionSelected.emit(action)"
        >
          {{ action.label }}
        </span>
      </li>
    }
  </ul>
}
