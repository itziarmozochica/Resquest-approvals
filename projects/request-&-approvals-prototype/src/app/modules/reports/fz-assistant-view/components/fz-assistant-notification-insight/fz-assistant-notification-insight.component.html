@if (safeUrl(); as src) {
  @if (hasError()) {
    <p class="fz-assistant-notification-insight__error">
      {{ 'chatbot.notificationsDialog.insightError' | translate }}
    </p>
  } @else {
    @if (isLoading()) {
      <div class="fz-assistant-notification-insight__loading" role="status" [attr.aria-label]="'common.loading' | translate">
        <span class="fz-assistant-notification-insight__spinner" aria-hidden="true"></span>
      </div>
    }
    <iframe
      class="fz-assistant-notification-insight__frame"
      [src]="src"
      sandbox="allow-scripts"
      referrerpolicy="no-referrer"
      [title]="'chatbot.notificationsDialog.insightFrameTitle' | translate"
      (load)="onLoad()"
      (error)="onError()"
    ></iframe>
  }
} @else {
  <p class="fz-assistant-notification-insight__error">
    {{ 'chatbot.notificationsDialog.insightError' | translate }}
  </p>
}
