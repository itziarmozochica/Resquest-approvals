<ignt-dialog-header [hideCloseButton]="true">
  <div class="fz-assistant-dialog__header-row">
    @let chat = chatSurface();
    <span class="fz-assistant-dialog__title">
      @if (chat?.isConversationHistoryEnabled) {
        <button
          type="button"
          ignt-icon-button
          sentiment="tertiary"
          size="small"
          data-testid="fz-assistant-dialog-history-toggle"
          [icon]="['far', chat?.isHistoryOpen() ? 'arrow-left' : 'bars']"
          [attr.aria-expanded]="chat?.isHistoryOpen()"
          [attr.aria-label]="(chat?.isHistoryOpen() ? 'chatbot.threads.back' : 'chatbot.threads.open') | translate"
          (click)="chat?.toggleHistory()"
        ></button>
      }
      <app-ai-sparkle-icon fill="gradient" size="medium" />
      {{ 'chatbot.header.assistantName' | translate }}
    </span>
    <div class="fz-assistant-dialog__header-actions">
      @if (chat?.isHistoryOpen()) {
        <button
          type="button"
          ignt-icon-button
          sentiment="tertiary"
          size="small"
          data-testid="fz-assistant-dialog-new-chat"
          [icon]="['far', 'pen-to-square']"
          [attr.aria-label]="'chatbot.threads.newChat' | translate"
          (click)="chat?.onHistoryNewChat()"
        ></button>
      }
      <button
        type="button"
        ignt-icon-button
        sentiment="tertiary"
        size="small"
        [icon]="['far', 'arrow-up-right-from-square']"
        (click)="onExpandClick()"
        [attr.aria-label]="'chatbot.topBar.expand' | translate"
      ></button>
      @if (showOpenInSidebarButton()) {
        <button
          type="button"
          ignt-icon-button
          sentiment="tertiary"
          size="small"
          [icon]="['far', 'sidebar']"
          (click)="onOpenAsDockClick()"
          [attr.aria-label]="'chatbot.topBar.openInSidebar' | translate"
        ></button>
      }
      <button
        type="button"
        ignt-icon-button
        sentiment="tertiary"
        size="small"
        [icon]="['far', 'xmark']"
        igntDialogClose
        [attr.aria-label]="'chatbot.topBar.close' | translate"
      ></button>
    </div>
  </div>
</ignt-dialog-header>

<ignt-dialog-content>
  <app-fz-assistant-chat-surface
    #surface
    appearance="dialog"
    [initialQuery]="dialogData.initialQuery"
    [showHeader]="false"
    (customerServiceRequested)="onCustomerServiceRequested()"
  />
</ignt-dialog-content>
