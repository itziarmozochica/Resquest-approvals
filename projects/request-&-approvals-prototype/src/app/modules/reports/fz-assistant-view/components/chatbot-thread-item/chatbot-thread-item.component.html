<button
  type="button"
  class="chatbot-thread-item__button"
  data-testid="chatbot-thread-item-select"
  [attr.title]="thread().title"
  (click)="onSelect()"
>
  <span class="chatbot-thread-item__title">{{ thread().title }}</span>
  @if (isUnread()) {
    <span
      class="chatbot-thread-item__unread-dot"
      data-testid="chatbot-thread-item-unread-dot"
      [attr.aria-label]="'chatbot.threads.unread' | translate"
      role="status"
    ></span>
  }
</button>

@if (false && !isMenuDisabled()) {
  <div class="chatbot-thread-item__menu">
    <button
      #menuTrigger
      type="button"
      class="chatbot-thread-item__menu-trigger"
      cdkOverlayOrigin
      #trigger="cdkOverlayOrigin"
      data-testid="chatbot-thread-item-menu-trigger"
      aria-haspopup="menu"
      [attr.aria-label]="'chatbot.threads.menuLabel' | translate"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="onMenuToggle($event)"
    >
      <ignt-icon name="ellipsis-v" variant="light" [fixedWidth]="true" />
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="isMenuOpen()"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="isMenuOpen.set(false)"
      (detach)="isMenuOpen.set(false)"
      [cdkConnectedOverlayPositions]="[
        {
          originX: 'end',
          originY: 'bottom',
          overlayX: 'end',
          overlayY: 'top',
          offsetY: 4,
        },
        {
          originX: 'end',
          originY: 'top',
          overlayX: 'end',
          overlayY: 'bottom',
          offsetY: -4,
        },
      ]"
    >
      <ul class="chatbot-thread-item__menu-list" data-testid="chatbot-thread-item-menu-list" role="menu">
        @for (action of menuActions(); track action.id) {
          <li class="chatbot-thread-item__menu-item" role="none">
            <button
              type="button"
              class="chatbot-thread-item__menu-option"
              role="menuitem"
              [attr.data-testid]="'chatbot-thread-item-menu-action-' + action.id"
              (click)="onMenuActionClick($event, action.id)"
            >
              <ignt-icon [name]="action.iconName" variant="light" [fixedWidth]="true" />
              <span class="chatbot-thread-item__menu-option-label">{{ action.labelKey | translate }}</span>
            </button>
          </li>
        }
      </ul>
    </ng-template>
  </div>
}
