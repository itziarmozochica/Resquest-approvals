@switch (state()) {
  @case ('loading') {
    <div class="fz-assistant-notification-markdown__loading" role="status" [attr.aria-label]="'common.loading' | translate">
      <span class="fz-assistant-notification-markdown__spinner" aria-hidden="true"></span>
    </div>
  }
  @case ('error') {
    <p class="fz-assistant-notification-markdown__error">
      {{ 'chatbot.notificationsDialog.insightError' | translate }}
    </p>
  }
  @default {
    <markdown class="fz-assistant-notification-markdown__body" [data]="resolvedData()" (ready)="onReady()" />
  }
}
