<div class="fz-assistant-layout-dock">
  <div
    class="fz-assistant-layout-dock__resizer"
    data-testid="fz-assistant-dock-resizer"
    role="separator"
    tabindex="0"
    aria-orientation="vertical"
    [attr.aria-label]="'chatbot.dock.resizeHandle' | translate"
    [attr.aria-valuenow]="dockWidth()"
    [attr.aria-valuemin]="dockMinWidth"
    [attr.aria-valuemax]="dockMaxWidth()"
    (dblclick)="onResizeDoubleClick()"
    (keydown)="onResizeKeydown($event)"
    (pointercancel)="onResizePointerUp($event)"
    (pointerdown)="onResizePointerDown($event)"
    (pointermove)="onResizePointerMove($event)"
    (pointerup)="onResizePointerUp($event)"
  ></div>
  <app-fz-assistant-chat-surface
    appearance="dock"
    (closeRequested)="onCloseRequested()"
    (customerServiceRequested)="onCustomerServiceRequested()"
    (expandRequested)="onExpandRequested()"
    (openAsPopupRequested)="onOpenAsPopupRequested()"
  />
</div>
