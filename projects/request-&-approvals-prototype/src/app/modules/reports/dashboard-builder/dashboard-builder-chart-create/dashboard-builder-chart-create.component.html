<app-page-title
  [title]="'analytics.dashboardBuilder.createChartPageTitle' | translate"
  class="new-design"
  [backRoute]="'/analytics/dashboard-builder'"
></app-page-title>

<div class="wrapper">
  <div class="dashboard-builder-chart-create__container">
    @if (iframeUrl()) {
      <iframe
        [src]="iframeUrl() | safeUrl"
        class="dashboard-builder-chart-create__iframe"
        width="100%"
        height="100%"
        allowtransparency
        appIframeResizer
        [title]="'analytics.dashboardBuilder.createChartPageTitle' | translate"
        data-testid="dashboard-builder-chart-create-iframe"
      ></iframe>
    }
  </div>
</div>
