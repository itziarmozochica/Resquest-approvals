<ignt-dialog-content class="video-dialog">
  <button
    type="button"
    class="video-dialog__close"
    data-testid="video-dialog-dismiss"
    ignt-icon-button
    igntDialogClose
    sentiment="tertiary"
    size="small"
    variant="sharp"
    [attr.aria-label]="'common.close' | translate"
    [icon]="['fas', 'times']"
  ></button>
  @if (hasLoadError()) {
    <p class="video-dialog__error" data-testid="video-dialog-error" role="alert">
      {{ 'layout.modalVideo.loadError' | translate }}
    </p>
  } @else {
    <video class="video-dialog__video" controls [src]="data.srcVideo" data-testid="video-dialog" (error)="onVideoError()">
      {{ 'layout.modalVideo.notSupported' | translate }}
    </video>
  }
</ignt-dialog-content>
