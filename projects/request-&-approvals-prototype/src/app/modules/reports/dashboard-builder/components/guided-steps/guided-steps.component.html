<section class="guided-steps" [attr.data-testid]="dataTestIdPrefix()">
  <header class="guided-steps__header">
    <div class="guided-steps__header-row">
      <div class="guided-steps__headings">
        @if (badgeLabel()) {
          <span class="guided-steps__badge" [attr.data-testid]="dataTestIdPrefix() + '-badge'">
            {{ badgeLabel() }}
          </span>
        }
        @if (title()) {
          <h2 class="guided-steps__title" [attr.data-testid]="dataTestIdPrefix() + '-title'">
            {{ title() }}
          </h2>
        }
        @if (subtitle()) {
          <p class="guided-steps__subtitle" [attr.data-testid]="dataTestIdPrefix() + '-subtitle'">
            {{ subtitle() }}
          </p>
        }
      </div>
      @if (showDismiss()) {
        <button
          type="button"
          class="guided-steps__dismiss"
          ignt-icon-button
          sentiment="tertiary"
          size="small"
          variant="sharp"
          [icon]="['fas', 'times']"
          [attr.aria-label]="dismissAriaLabel()"
          [attr.data-testid]="dataTestIdPrefix() + '-dismiss'"
          (click)="onDismissClick()"
        ></button>
      }
    </div>
    @if (videoDemoLabel()) {
      <div class="guided-steps__video-demo" [attr.data-testid]="dataTestIdPrefix() + '-video-demo'">
        <button
          type="button"
          class="guided-steps__video-demo-link"
          igntButton
          sentiment="tertiary"
          size="small"
          [attr.data-testid]="dataTestIdPrefix() + '-video-demo-link'"
          (click)="onVideoDemoClick()"
        >
          {{ videoDemoLabel() }}
        </button>
      </div>
    }
  </header>
  <div class="guided-steps__list">
    @for (step of steps(); track step.id; let index = $index) {
      <app-guided-step
        [actionDisabled]="step.actionDisabled ?? false"
        [actionDisabledTooltip]="step.actionDisabledTooltip ?? ''"
        [actionLabel]="step.actionLabel"
        [dataTestIdPrefix]="dataTestIdPrefix() + '-step-' + step.id"
        [description]="step.description"
        [note]="step.note ?? ''"
        [stepNumber]="index + 1"
        [title]="step.title"
        (actionClick)="onStepActionClick(step.id)"
      />
    }
  </div>
</section>
