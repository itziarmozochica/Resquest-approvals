<article class="guided-step" [class.guided-step--with-note]="note() !== ''" [attr.data-testid]="dataTestIdPrefix()">
  <div class="guided-step__badge" aria-hidden="true" [attr.data-testid]="dataTestIdPrefix() + '-badge'">
    {{ stepNumber() }}
  </div>
  <h3 class="guided-step__title" [attr.data-testid]="dataTestIdPrefix() + '-title'">
    {{ title() }}
  </h3>
  <p class="guided-step__description" [attr.data-testid]="dataTestIdPrefix() + '-description'">
    {{ description() }}
  </p>
  @if (note()) {
    <p class="guided-step__note" [attr.data-testid]="dataTestIdPrefix() + '-note'">
      {{ note() }}
    </p>
  }
  <!-- Disabled through aria-disabled, so it still takes hover and focus to show why. -->
  <ignt-button
    class="guided-step__action"
    igntTooltip
    size="small"
    tooltipPlacement="top"
    variant="tertiary"
    [attr.data-testid]="dataTestIdPrefix() + '-action'"
    [disabled]="actionDisabled()"
    [label]="actionLabel()"
    [tooltipDisabled]="!showsActionDisabledTooltip()"
    [tooltipLabel]="actionDisabledTooltip()"
    [trailingIcon]="actionIcon"
    (click)="onActionClick()"
  />
</article>
