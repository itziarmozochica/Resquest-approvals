<div class="create-dashboard-modal">
  <div class="create-dashboard-modal__dialog modal-dialog">
    <div class="create-dashboard-modal__content modal-content">
      <div class="modal-header">
        <h2 class="modal-title">
          {{ 'analytics.dashboardBuilder.createDashboardModal.title' | translate }}
        </h2>
        <button type="button" class="btn-close" aria-label="Close" (click)="dismiss()"></button>
      </div>
      <div class="modal-body">
        <form id="create-dashboard-form" [formGroup]="form" (ngSubmit)="submit()">
          <ignt-input-field
            id="dashboardName"
            formControlName="dashboardName"
            [label]="'analytics.dashboardBuilder.createDashboardModal.nameLabel' | translate"
            [placeholder]="'analytics.dashboardBuilder.createDashboardModal.namePlaceholder' | translate"
            [customFormErrors]="[
              { type: 'required', message: 'form.error.required' | translate },
              { type: 'minlength', message: 'form.error.minLength' | translate: { value: '3' } },
            ]"
          />
        </form>
      </div>
      <div class="modal-footer">
        <button igntButton sentiment="secondary" type="button" (click)="dismiss()" data-testid="create-dashboard-cancel-button">
          {{ 'analytics.dashboardBuilder.createDashboardModal.cancelButton' | translate }}
        </button>
        <button
          igntButton
          sentiment="primary"
          type="submit"
          form="create-dashboard-form"
          [attr.disabled]="!form.controls.dashboardName.value || null"
          data-testid="create-dashboard-create-button"
        >
          {{ 'analytics.dashboardBuilder.createDashboardModal.createButton' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
