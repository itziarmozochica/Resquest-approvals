<app-page-title [title]="pageTitleI18nKey() | translate" class="new-design" [backRoute]="'/analytics/dashboard-builder'"></app-page-title>

<div class="wrapper">
  <div class="dashboard-builder-detail-container">
    @if (iframeUrl()) {
      <iframe
        [src]="iframeUrl() | safeUrl"
        class="dashboard-builder-detail__iframe"
        width="100%"
        height="100%"
        allowtransparency
        [attr.data-testid]="iframeTestId()"
      ></iframe>
    }
  </div>
</div>
