<div class="scheduled-report-export">
  @if (showsActiveFilter()) {
    <div class="scheduled-report-export__toolbar">
      <ignt-checkbox
        class="scheduled-report-export__active-filter"
        [checked]="activeOnly()"
        [label]="'analytics.sftpExports.activeFilter' | translate"
        dataTestId="scheduled-report-export-active-filter"
        (change)="onActiveOnlyChange($event)"
      />
      @if (hiddenExportsCount() > 0) {
        <span class="scheduled-report-export__hidden-count" data-testid="scheduled-report-export-hidden-count">{{
          'analytics.sftpExports.activeFilterHiddenCount' | translate: { count: hiddenExportsCount() }
        }}</span>
      }
    </div>
  }
  <app-request-result
    data-testid="scheduled-report-export-results"
    [request]="request$"
    [areResultsEmpty]="areResultsEmpty"
    [displayContentWithNoResults]="true"
    [noResultMessage]="'analytics.sftpExports.table.noResults' | translate"
    [noResultIcon]="['far', 'receipt']"
    [noFiltersIcon]="['far', 'sort-alt']"
    [errorMessage]="'analytics.sftpExports.table.error' | translate"
    (searchResults)="updateExportList($event)"
  >
    <app-scheduled-report-export-table [chartOwnerEmailsByChartId]="chartOwnerEmailsByChartId()" [exportList]="visibleExports()" />
  </app-request-result>
</div>
