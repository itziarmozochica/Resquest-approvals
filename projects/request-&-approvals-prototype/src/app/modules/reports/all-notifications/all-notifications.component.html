<app-page-title [title]="'chatbot.header.backToAnalytics' | translate" class="new-design" [backRoute]="'/analytics'"></app-page-title>

<section class="all-notifications">
  <div class="all-notifications__heading">
    <app-ai-sparkle-icon size="medium" aria-hidden="true" />
    <h1 class="all-notifications__title">{{ 'notifications.title' | translate }}</h1>
  </div>

  <p class="all-notifications__count">
    @if (!isLoading() && !error()) {
      {{ 'notifications.newCount' | translate: { count: unreadCount() } }}
    }
  </p>

  <app-notifications-list
    appearance="flat"
    [notifications]="notifications()"
    [isLoading]="isLoading()"
    [isLoadingMore]="isLoadingMore()"
    [error]="error()"
    [hasMore]="hasMore()"
    (loadMore)="onLoadMore()"
    (retry)="onRetry()"
    (openAssistant)="onOpenAssistant($event)"
  />
</section>
