<div class="email-recipients-input" [class.email-recipients-input--invalid]="invalid()">
  <label class="email-recipients-input__label" [for]="inputId()">{{ label() }}</label>
  <ng-select
    class="email-recipients-input__select"
    data-testid="email-recipient-input"
    [clearable]="false"
    [disabled]="saving()"
    [isOpen]="false"
    [items]="[]"
    [keyDownFn]="onKeyDown"
    [labelForId]="inputId()"
    [multiple]="true"
    [ngModel]="recipients()"
    (blur)="onTouched()"
    (paste)="onPaste($event)"
    (search)="onSearch($event.term)"
  >
    <ng-template let-item="item" ng-label-tmp>
      <span
        class="email-recipients-input__chip"
        data-testid="email-recipient-chip"
        [class.email-recipients-input__chip--invalid]="!isRecipientEmail(item)"
      >
        <span class="email-recipients-input__chip-email" [title]="item">{{ item }}</span>
        <button
          class="email-recipients-input__chip-remove"
          data-testid="email-recipient-chip-remove"
          ignt-icon-button
          sentiment="tertiary"
          size="small"
          type="button"
          [attr.aria-label]="'analytics.dashboardBuilder.deliveryMethods.drawer.removeRecipientAriaLabel' | translate: { email: item }"
          [disabled]="saving()"
          [icon]="removeIcon"
          (click)="remove(item)"
          (keydown)="$event.stopPropagation()"
        ></button>
      </span>
    </ng-template>
  </ng-select>
</div>
