<div class="dialog-container" role="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
  <header class="dialog-header">
    <h5 id="dialog-title" class="dialog-title">{{ title | translate }}</h5>
    <button type="button" class="btn-close" [attr.aria-label]="'common.close' | translate" (click)="onCancel()"></button>
  </header>

  <div class="dialog-body">
    <p id="dialog-description" class="dialog-description">{{ description | translate }}</p>
  </div>

  <footer class="dialog-footer">
    <button igntButton type="button" sentiment="tertiary" (click)="onCancel()">
      {{ cancelButtonText | translate }}
    </button>
    <button igntButton type="button" sentiment="primary" [variant]="confirmButtonVariant" (click)="onConfirm()" cdkFocusInitial>
      {{ confirmButtonText | translate }}
    </button>
  </footer>
</div>
