<div class="delivery-channel-picker" [attr.data-testid]="type() + '-delivery-channels'">
  @if (isLoading()) {
    <p class="delivery-channel-picker__loading">
      {{ 'analytics.dashboardBuilder.exportsForm.loadingChannels' | translate }}
    </p>
  } @else {
    @for (channel of channels(); track channel.id) {
      <label class="delivery-channel-picker__item" [attr.data-testid]="type() + '-channel-' + channel.id">
        <input type="radio" [formControl]="channelIdControl()" [value]="channel.id" />
        <span class="delivery-channel-picker__text">
          <span class="delivery-channel-picker__title">{{ primaryLabel(channel) }}</span>
          @if (channel.type === 'email') {
            @let secondary = secondaryEmails(channel);
            @if (secondary.length > 0) {
              <span class="delivery-channel-picker__subtitle">
                {{ secondary | truncateEmailList }}
              </span>
            }
          } @else {
            @let host = secondaryHost(channel);
            @if (host.length > 0) {
              <span class="delivery-channel-picker__subtitle">
                {{ host }}
              </span>
            }
          }
        </span>
      </label>
    }
    <label class="delivery-channel-picker__item" [attr.data-testid]="type() + '-channel-new'">
      <input type="radio" [formControl]="channelIdControl()" [value]="newChannel" />
      <span class="delivery-channel-picker__title">
        {{ newChannelLabelKey() | translate }}
      </span>
    </label>
    <ng-content />
  }
</div>
