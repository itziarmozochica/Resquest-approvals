<ul class="tab-list">
  @for (graph of graphs(); track graph.id) {
    <li
      class="tab-list__item"
      [attr.data-testid]="dataTestId() + '-' + graph.id"
      [class.tab-list__item--selected]="graph.id === selectedGraph()?.id"
      (click)="onTabClick(graph)"
    >
      {{ graph.name.trim() | translate }}
    </li>
  }
</ul>
