<ignt-dialog-header class="publication-confirm__header" data-testid="publication-confirm-title">{{
  copyKey + '.title' | translate
}}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="publication-confirm">
    <p class="publication-confirm__text" data-testid="publication-confirm-message" [innerHTML]="message"></p>
    @if (isUnpublish) {
      <p class="publication-confirm__text" data-testid="publication-confirm-kept">{{ copyKey + '.kept' | translate }}</p>
    }
  </div>
</ignt-dialog-content>

<ignt-dialog-footer class="publication-confirm__footer" [hideCancelButton]="true">
  @if (!isFirstPublish) {
    <ignt-button
      data-testid="publication-confirm-cancel"
      variant="secondary"
      [fill]="isMobile()"
      [label]="copyKey + '.cancel' | translate"
      (click)="answer(false)"
    />
  }
  <ignt-button
    data-testid="publication-confirm-accept"
    variant="primary"
    [fill]="isMobile()"
    [label]="copyKey + '.confirm' | translate"
    [sentiment]="isUnpublish ? 'danger' : 'brand'"
    (click)="answer(true)"
  />
</ignt-dialog-footer>
