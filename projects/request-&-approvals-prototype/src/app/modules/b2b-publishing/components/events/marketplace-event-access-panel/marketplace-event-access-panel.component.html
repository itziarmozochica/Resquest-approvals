<ignt-dialog-header>{{ event.name }}</ignt-dialog-header>

<ignt-dialog-content>
  <p class="marketplace-event-access-panel__subtitle">{{ 'marketplaceEvents.access.panelSubtitle' | translate }}</p>

  <div class="marketplace-event-access-panel__field">
    <!-- `container="body"` + `isInDialog`: an inline popup is clipped by the panel's scroll. -->
    <ignt-typeahead
      container="body"
      [disabled]="isSaving()"
      [isInDialog]="true"
      [editable]="false"
      [fieldLabel]="'marketplaceEvents.access.fieldLabel' | translate"
      [fieldLabelTooltip]="'marketplaceEvents.access.fieldTooltip' | translate"
      [options]="accessModeOptions"
      [selectedOption]="selectedAccessModeOption()"
      (selected)="selectAccessMode($event)"
    ></ignt-typeahead>
  </div>

  @if (hasError()) {
    <p class="marketplace-event-access-panel__error" data-testid="marketplace-event-access-panel-error">
      {{ 'marketplaceEvents.access.updateError' | translate }}
    </p>
  }
</ignt-dialog-content>

<ignt-dialog-footer class="marketplace-event-access-panel__footer" [hideCancelButton]="true">
  <ignt-button
    [label]="'marketplaceEvents.access.done' | translate"
    variant="primary"
    [loading]="isSaving()"
    data-testid="marketplace-event-access-panel-done"
    (click)="close()"
  />
</ignt-dialog-footer>
