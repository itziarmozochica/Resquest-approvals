<ignt-dialog-header>
  {{ 'marketplaceEvents.filters.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p class="marketplace-event-filters__subtitle">{{ 'marketplaceEvents.filters.subtitle' | translate }}</p>

  @if (isStatusShown) {
    <div class="marketplace-event-filters__field" data-testid="marketplace-events-filters-status">
      <ignt-typeahead
        container="body"
        [isInDialog]="true"
        [editable]="false"
        [fieldLabel]="'marketplaceEvents.filters.status' | translate"
        [options]="statusOptions"
        [selectedOption]="selectedStatus"
        (selected)="selectStatus($event)"
      ></ignt-typeahead>
    </div>
  }

  <div class="marketplace-event-filters__field marketplace-event-filters__switch">
    <label class="marketplace-event-filters__switch-label" [for]="onlyPublishedGroupsId">
      <span>{{ onlyPublishedLabelKey | translate }}</span>
      <span class="marketplace-event-filters__hint" data-testid="marketplace-events-filters-only-published-hint">{{
        onlyPublishedHintKey | translate
      }}</span>
    </label>
    <ignt-toggle
      data-testid="marketplace-events-filters-only-published-groups"
      [checked]="selection.onlyPublishedGroups"
      [id]="onlyPublishedGroupsId"
      (change)="toggleOnlyPublishedGroups($event)"
    ></ignt-toggle>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer class="marketplace-event-filters__footer" [hideCancelButton]="true">
  <ignt-button
    class="marketplace-event-filters__clear"
    [label]="'marketplaceEvents.filters.clear' | translate"
    variant="tertiary"
    data-testid="marketplace-events-filters-clear"
    (click)="clearFilters()"
  />
  <ignt-button
    [label]="'marketplaceEvents.filters.apply' | translate"
    variant="primary"
    data-testid="marketplace-events-filters-apply"
    (click)="applyFilters()"
  />
</ignt-dialog-footer>
