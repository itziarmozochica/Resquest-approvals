<ignt-dialog-header data-testid="catalog-request-decision-header">{{ title }}</ignt-dialog-header>

<ignt-dialog-content>
  <p class="catalog-request-decision__summary" data-testid="catalog-request-decision-summary">{{ summary }}</p>

  <ignt-textarea-field
    class="catalog-request-decision__note"
    data-testid="catalog-request-decision-note"
    [customFormErrors]="noteErrors"
    [formControl]="noteControl"
    [helperText]="'catalogRequests.decision.noteHelper' | translate"
    [label]="noteLabelKey | translate"
    [maxlength]="noteMaxLength"
    [rows]="3"
  ></ignt-textarea-field>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <ignt-button data-testid="catalog-request-decision-cancel" variant="secondary" [label]="'common.cancel' | translate" (click)="cancel()" />
  <ignt-button data-testid="catalog-request-decision-confirm" variant="primary" [label]="confirmLabel" (click)="confirm()" />
</ignt-dialog-footer>
