<ignt-dialog-header>
  {{ 'catalogRequests.filters.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="catalog-request-filters__field">
    <!-- `container="body"` + `isInDialog` is what keeps the popup above the dialog overlay
         and sized to the field; an inline popup would be clipped by the dialog's scroll. -->
    <ignt-typeahead
      container="body"
      data-testid="catalog-requests-filter-distributor-type"
      [isInDialog]="true"
      [editable]="false"
      [fieldLabel]="'catalogRequests.columns.type' | translate"
      [options]="distributorTypeOptions"
      [selectedOption]="selectedDistributorType"
      (selected)="selectDistributorType($event)"
    ></ignt-typeahead>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer class="catalog-request-filters__footer" [hideCancelButton]="true">
  <ignt-button
    class="catalog-request-filters__clear"
    [label]="'catalogRequests.filters.clear' | translate"
    variant="tertiary"
    data-testid="catalog-requests-filters-clear"
    (click)="clearFilters()"
  />
  <ignt-button
    [label]="'catalogRequests.filters.apply' | translate"
    variant="primary"
    data-testid="catalog-requests-filters-apply"
    (click)="applyFilters()"
  />
</ignt-dialog-footer>
