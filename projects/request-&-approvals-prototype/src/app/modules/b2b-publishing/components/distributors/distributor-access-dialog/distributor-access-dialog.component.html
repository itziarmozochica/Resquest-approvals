<ignt-dialog-header data-testid="distributor-access-header">{{ title }}</ignt-dialog-header>

<ignt-dialog-content>
  @if (pendingRequestId) {
    <p class="distributor-access__pending" data-testid="distributor-access-pending">
      <a
        class="distributor-access__request-link"
        data-testid="distributor-access-request-link"
        rel="noopener noreferrer"
        target="_blank"
        [attr.aria-label]="'distributors.access.pendingRequestLinkAria' | translate"
        [queryParams]="requestQueryParams"
        [routerLink]="requestLink"
      >
        {{ 'distributors.access.pendingRequestLink' | translate }}
      </a>
      @if (pendingRequestRequestedAt) {
        <span>{{ 'distributors.access.pendingRequestSentOn' | translate: { date: pendingRequestRequestedAt | date: 'd MMM y' } }}</span>
      }
    </p>
  }

  <p
    class="distributor-access__summary"
    data-testid="distributor-access-summary"
    [innerHTML]="pendingRequestId ? pendingSummary : summary"
  ></p>

  <ignt-textarea-field
    class="distributor-access__note"
    data-testid="distributor-access-note"
    [customFormErrors]="noteErrors"
    [formControl]="noteControl"
    [helperText]="'distributors.access.noteHelper' | translate"
    [label]="noteLabelKey | translate"
    [maxlength]="noteMaxLength"
    [rows]="3"
  ></ignt-textarea-field>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <ignt-button data-testid="distributor-access-cancel" variant="secondary" [label]="'common.cancel' | translate" (click)="cancel()" />
  <ignt-button data-testid="distributor-access-confirm" variant="primary" [label]="confirmLabel" (click)="confirm()" />
</ignt-dialog-footer>
