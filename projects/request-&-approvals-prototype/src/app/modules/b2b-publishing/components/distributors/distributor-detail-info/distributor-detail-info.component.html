<section class="distributor-detail-info" data-testid="distributor-detail-info">
  <header class="distributor-detail-info__header">
    <h2 class="distributor-detail-info__title">{{ 'distributors.detail.general.title' | translate }}</h2>
  </header>

  <div class="distributor-detail-info__fields">
    @for (group of groups(); track group.anchorId) {
      <section class="distributor-detail-info__group" [attr.id]="group.anchorId">
        <h3 class="distributor-detail-info__group-title">{{ group.titleKey | translate }}</h3>
        <dl class="distributor-detail-info__group-fields">
          @for (field of group.fields; track field.labelKey) {
            <div class="distributor-detail-info__row">
              <dt class="distributor-detail-info__label">{{ field.labelKey | translate }}</dt>
              @if (field.value) {
                <dd class="distributor-detail-info__value">{{ field.value }}</dd>
              } @else {
                <dd class="distributor-detail-info__value distributor-detail-info__value--empty">—</dd>
              }
            </div>
          }
        </dl>
      </section>
    }
  </div>
</section>
