<section class="distributor-relationship-card" data-testid="distributor-relationship-card" [attr.id]="anchorId">
  <header class="distributor-relationship-card__header">
    <div class="distributor-relationship-card__heading">
      <h2 class="distributor-relationship-card__title">{{ 'distributors.detail.relationship.title' | translate }}</h2>
      <p class="distributor-relationship-card__lead">{{ 'distributors.detail.relationship.lead' | translate }}</p>
    </div>

    <ignt-button
      data-testid="distributor-relationship-action"
      size="small"
      variant="secondary"
      [disabled]="!canManage()"
      [label]="actionLabelKey() | translate"
      [loading]="isDeciding()"
      (click)="takeAction()"
    />
  </header>

  <span igntTooltip [tooltipLabel]="accessTooltipKey() | translate">
    <ignt-tag data-testid="distributor-relationship-access" variant="outline" [bullet]="accessBullet" [sentiment]="accessSentiment()">
      {{ accessLabelKey() | translate }}
    </ignt-tag>
  </span>
</section>
