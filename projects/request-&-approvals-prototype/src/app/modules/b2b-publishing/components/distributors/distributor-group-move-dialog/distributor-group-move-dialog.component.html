<ignt-dialog-header data-testid="group-move-dialog-header">{{ title }}</ignt-dialog-header>

<ignt-dialog-content>
  <p class="group-move__summary" data-testid="group-move-dialog-summary" [innerHTML]="summary"></p>
  <p class="group-move__detail" data-testid="group-move-dialog-detail" [innerHTML]="detail"></p>
  <p class="group-move__note" data-testid="group-move-dialog-note">{{ note }}</p>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <ignt-button data-testid="group-move-dialog-cancel" variant="secondary" [label]="'common.cancel' | translate" (click)="cancel()" />
  <ignt-button data-testid="group-move-dialog-confirm" variant="primary" [label]="confirmLabel" (click)="confirm()" />
</ignt-dialog-footer>
