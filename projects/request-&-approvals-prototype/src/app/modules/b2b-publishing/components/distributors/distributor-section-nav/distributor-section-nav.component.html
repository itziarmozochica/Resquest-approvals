<div
  class="distributor-section-nav"
  role="navigation"
  data-testid="distributor-section-nav"
  [attr.aria-label]="'distributors.detail.sections.label' | translate"
>
  <ul class="distributor-section-nav__list">
    @for (section of sections(); track section.id) {
      <li>
        <a
          class="distributor-section-nav__item"
          [attr.aria-current]="section.id === activeId() ? 'location' : null"
          [attr.data-testid]="`distributor-section-nav-${section.id}`"
          [attr.href]="`${pageUrl()}#${section.id}`"
          [class.distributor-section-nav__item--active]="section.id === activeId()"
          (click)="select($event, section.id)"
        >
          {{ section.labelKey | translate }}
        </a>
      </li>
    }
  </ul>
</div>
