@if (isBannerShown()) {
  <ignt-alert
    class="onboarding-entry__banner"
    data-testid="onboarding-entry-banner"
    sentiment="info"
    [actionLabel]="canPublish ? ('marketplaceEvents.onboarding.banner.action' | translate) : undefined"
    [description]="'marketplaceEvents.onboarding.banner.description' | translate"
    [title]="'marketplaceEvents.onboarding.banner.title' | translate"
    (actionClicked)="openWizard()"
  />
}
