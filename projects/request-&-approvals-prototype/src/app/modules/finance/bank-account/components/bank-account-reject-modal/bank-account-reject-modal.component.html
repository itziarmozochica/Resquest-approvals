<ignt-dialog-header>{{ 'finance.bankAccount.rejectModal.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <form class="bank-account-reject-modal" [formGroup]="form">
    <p class="bank-account-reject-modal__description">
      {{ 'finance.bankAccount.rejectModal.description' | translate }}
    </p>

    <div class="bank-account-reject-modal__field field">
      <label class="bank-account-reject-modal__label" for="rejectionCategory"
        >{{ 'finance.bankAccount.rejectModal.category' | translate }} *</label
      >
      <ng-select
        labelForId="rejectionCategory"
        formControlName="category"
        data-testid="reject-category-select"
        [clearable]="false"
        [searchable]="false"
        [placeholder]="'finance.bankAccount.rejectModal.categoryPlaceholder' | translate"
      >
        @for (option of categories; track option) {
          <ng-option [value]="option">{{ 'finance.bankAccount.rejectionCategories.' + (option | lowercase) | translate }}</ng-option>
        }
      </ng-select>
    </div>

    <ignt-textarea-field
      class="bank-account-reject-modal__field"
      data-testid="reject-comment"
      id="rejectionComment"
      rows="4"
      formControlName="comment"
      [maxlength]="commentMaxLength"
      [label]="'finance.bankAccount.rejectModal.comment' | translate"
      [placeholder]="'finance.bankAccount.rejectModal.commentPlaceholder' | translate"
    ></ignt-textarea-field>
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    data-testid="reject-modal-cancel"
    variant="tertiary"
    [label]="'finance.bankAccount.rejectModal.cancel' | translate"
    (click)="cancel()"
  />
  <ignt-button
    data-testid="reject-modal-confirm"
    sentiment="danger"
    variant="primary"
    [disabled]="form.invalid"
    [label]="'finance.bankAccount.rejectModal.confirm' | translate"
    (click)="confirm()"
  />
</ignt-dialog-footer>
