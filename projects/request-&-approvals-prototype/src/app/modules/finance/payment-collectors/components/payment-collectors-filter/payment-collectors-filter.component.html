<div class="payment-collectors-filter">
  <div class="payment-collectors-filter__body">
    <ignt-checkbox
      class="payment-collectors-filter__checkbox"
      [(ngModel)]="hideDefaults"
      [label]="'finance.paymentCollectors.filters.hideDefaultsTitle' | translate"
      [description]="'finance.paymentCollectors.filters.hideDefaultsSubtitle' | translate"
      data-testid="filter-hide-defaults"
    ></ignt-checkbox>

    <div class="payment-collectors-filter__field">
      <label class="payment-collectors-filter__label">{{ 'finance.paymentCollectors.filters.paymentGateway' | translate }}</label>
      <app-multi-select
        class="payment-collectors-filter__select"
        [options]="paymentGatewayOptions"
        [selectedOptions]="selectedPaymentGateway"
        [displayInPlaceMaximum]="2"
        [placeholder]="'finance.paymentCollectors.filters.selectPlaceholder' | translate"
        data-testid="filter-payment-gateway"
      ></app-multi-select>
    </div>

    <div class="payment-collectors-filter__field">
      <label class="payment-collectors-filter__label">{{ 'finance.paymentCollectors.filters.paymentMethod' | translate }}</label>
      <app-multi-select
        class="payment-collectors-filter__select"
        [options]="paymentMethodOptions"
        [selectedOptions]="selectedPaymentMethod"
        [displayInPlaceMaximum]="2"
        [placeholder]="'finance.paymentCollectors.filters.selectPlaceholder' | translate"
        data-testid="filter-payment-method"
      ></app-multi-select>
    </div>

    <div class="payment-collectors-filter__field">
      <label class="payment-collectors-filter__label">{{ 'finance.paymentCollectors.filters.channelType' | translate }}</label>
      <app-multi-select
        class="payment-collectors-filter__select"
        [options]="channelTypeOptions"
        [selectedOptions]="selectedChannelType"
        [displayInPlaceMaximum]="2"
        [placeholder]="'finance.paymentCollectors.filters.selectPlaceholder' | translate"
        data-testid="filter-channel-type"
      ></app-multi-select>
    </div>

    <div class="payment-collectors-filter__field">
      <label class="payment-collectors-filter__label">{{ 'finance.paymentCollectors.filters.channelName' | translate }}</label>
      <app-multi-select
        class="payment-collectors-filter__select"
        [options]="channelNameOptions"
        [selectedOptions]="selectedChannelName"
        [displayInPlaceMaximum]="2"
        [placeholder]="'finance.paymentCollectors.filters.selectPlaceholder' | translate"
        data-testid="filter-channel-name"
      ></app-multi-select>
    </div>

    <div class="payment-collectors-filter__field">
      <label class="payment-collectors-filter__label">{{ 'finance.paymentCollectors.filters.eventName' | translate }}</label>
      <app-multi-select
        class="payment-collectors-filter__select"
        [options]="eventNameOptions"
        [selectedOptions]="selectedEventName"
        [displayInPlaceMaximum]="2"
        [placeholder]="'finance.paymentCollectors.filters.selectPlaceholder' | translate"
        data-testid="filter-event-name"
      ></app-multi-select>
    </div>

    <div class="payment-collectors-filter__field">
      <label class="payment-collectors-filter__label">{{ 'finance.paymentCollectors.filters.collector' | translate }}</label>
      <app-multi-select
        class="payment-collectors-filter__select"
        [options]="collectorOptions"
        [selectedOptions]="selectedCollector"
        [displayInPlaceMaximum]="1"
        [maxSelectedOptions]="1"
        [placeholder]="'finance.paymentCollectors.filters.selectPlaceholder' | translate"
        data-testid="filter-collector"
      ></app-multi-select>
    </div>
  </div>

  <div class="payment-collectors-filter__footer">
    <button
      igntButton
      type="button"
      size="large"
      sentiment="primary"
      (click)="onApply()"
      data-testid="filter-apply-button"
      class="payment-collectors-filter__button"
    >
      {{ 'finance.paymentCollectors.filters.applyFilters' | translate: { count: previewCount } }}
    </button>
    <button
      igntButton
      type="button"
      size="large"
      sentiment="tertiary"
      (click)="onClear()"
      data-testid="filter-clear-button"
      class="payment-collectors-filter__button"
    >
      {{ 'finance.paymentCollectors.filters.clearFilters' | translate }}
    </button>
  </div>
</div>
