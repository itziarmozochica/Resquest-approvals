<main class="finance-settings-page">
  <header class="finance-settings-page__header">
    <ignt-breadcrumb [items]="breadcrumbItems()" data-testid="finance-settings-breadcrumb" />
    <h1 class="finance-settings-page__title">{{ 'finance.settings.title' | translate }}</h1>
    <p class="finance-settings-page__description">{{ 'finance.settings.description' | translate }}</p>
  </header>

  <!-- Hidden while financeSettingsTabs has one entry. A second entry shows the bar again. -->
  <ignt-tabs
    #settingsTabs
    class="finance-settings-page__tabs"
    [class.finance-settings-page__tabs--single]="tabs.length === 1"
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="onTabIndexChange($event)"
    data-testid="finance-settings-tabs"
  >
    @for (tab of tabs; track tab.id) {
      <ignt-tabs-item [label]="tab.labelKey | translate" [attr.data-testid]="'finance-settings-tab-' + tab.id">
        @if (tab.id === tabId.Invoices) {
          <app-invoices-settings-tab />
        }
      </ignt-tabs-item>
    }
  </ignt-tabs>
</main>
