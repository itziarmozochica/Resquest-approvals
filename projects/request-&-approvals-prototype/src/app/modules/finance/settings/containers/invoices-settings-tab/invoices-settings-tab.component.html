<section class="invoices-settings-tab" aria-labelledby="invoice-notification-email-title">
  @if (isLoading()) {
    <p data-testid="invoicing-settings-loading">{{ 'common.loading' | translate }}</p>
  } @else if (hasLoadError()) {
    <ignt-alert
      [description]="'finance.settings.invoices.loadError' | translate"
      [title]="'finance.settings.invoices.loadErrorTitle' | translate"
      data-testid="invoicing-settings-load-error"
      sentiment="danger"
    />
  } @else {
    <div class="invoices-settings-tab__setting" data-testid="invoice-notification-email-setting">
      <div class="invoices-settings-tab__copy">
        <p class="invoices-settings-tab__title" id="invoice-notification-email-title">
          {{ 'finance.settings.invoices.notificationEmailLabel' | translate }}
        </p>
        <p class="invoices-settings-tab__description" id="invoice-notification-email-description">
          {{ 'finance.settings.invoices.notificationEmailDescription' | translate }}
        </p>
      </div>
      <ignt-switch
        [ariaDescribedby]="'invoice-notification-email-description'"
        [ariaLabel]="'finance.settings.invoices.notificationEmailLabel' | translate"
        [checked]="isEnabled()"
        [disabled]="isSaving()"
        (checkedChange)="onIsInvoiceNotificationEmailEnabledChanged($event)"
        data-testid="invoice-notification-email-toggle"
      />
    </div>

    <div class="invoices-settings-tab__actions">
      <ignt-button
        [disabled]="!isDirty() || isSaving()"
        [label]="'common.cancel' | translate"
        (click)="cancel()"
        data-testid="invoicing-settings-cancel"
        variant="secondary"
      />
      <ignt-button
        [disabled]="!isDirty() || isSaving()"
        [label]="'common.save' | translate"
        [loading]="isSaving()"
        (click)="save()"
        data-testid="invoicing-settings-save"
      />
    </div>
  }
</section>
