<div class="bundled-main-plans-list-view">
  <div class="bundled-main-plans-list-view__block">
    <h3>{{ 'bundle.configuration.plans.title' | translate }}</h3>
  </div>

  <div *ngIf="bundledMainPlans.length > 0; else noBundledMainPlans">
    <div *ngFor="let bundledMainPlan of bundledMainPlans; let i = index" data-testid="bundled-main-plans-list-view-main-plan-information">
      <h4>{{ 'bundle.configuration.plans.indexed' | translate: { index: i + 1 } }}</h4>
      <app-bundled-main-plan-view [bundledMainPlan]="bundledMainPlan"></app-bundled-main-plan-view>
    </div>
  </div>

  <ng-template #noBundledMainPlans>
    <p data-testid="bundled-main-plans-list-view-no-bundled-main-plans-message">{{ 'bundle.configuration.plans.empty' | translate }}</p>
  </ng-template>
</div>
