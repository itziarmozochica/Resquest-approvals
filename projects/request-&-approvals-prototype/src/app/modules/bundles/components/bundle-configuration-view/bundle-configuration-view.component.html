<div *ngIf="bundleConfiguration !== null; else noBundleConfigurationForMainPlan" data-testid="bundle-configuration-view-details">
  <p data-testid="bundle-configuration-view-is-upsell">
    <span translate>bundle.configuration.isUpsell</span>: {{ bundleConfiguration.type === BundleType.UPSELL }}
  </p>
  <p data-testid="bundle-configuration-view-is-same-day-bundle">
    <span translate>bundle.configuration.isSameDayBundle</span>: {{ bundleConfiguration.maxDateSelectionSpanInDays === 0 }}
  </p>

  <app-bundled-main-plans-list-view [bundledMainPlans]="bundleConfiguration.relatedMainPlans"></app-bundled-main-plans-list-view>
  <button (click)="editBundleConfiguration.emit()" data-testid="bundle-configuration-view-edit-button">
    {{ 'bundle.configuration.edit.button.start' | translate }}
  </button>
  <button (click)="deleteBundleConfiguration.emit()" data-testid="bundle-configuration-view-delete-button">
    {{ 'bundle.configuration.delete.button' | translate }}
  </button>
</div>

<ng-template #noBundleConfigurationForMainPlan>
  <p data-testid="bundle-configuration-view-not-found-message"><span translate>bundle.configuration.notFound</span></p>
  <button (click)="startBundleConfigurationCreation.emit()" data-testid="bundle-configuration-view-start-button">
    {{ 'bundle.configuration.create.button.start' | translate }}
  </button>
</ng-template>
