<div class="bundle-configuration-form">
  <div class="bundle-configuration-form__block">
    <form [formGroup]="bundleConfigurationFormGroup">
      <p>
        <label>
          {{ 'bundle.configuration.isUpsell' | translate }}
          <input type="checkbox" formControlName="isUpsell" data-testid="bundle-configuration-form-is-upsell-checkbox" />
        </label>
      </p>

      <p>
        <label>
          {{ 'bundle.configuration.isSameDayBundle' | translate }}
          <input type="checkbox" formControlName="isSameDayBundle" data-testid="bundle-configuration-form-is-same-day-bundle-checkbox" />
        </label>
      </p>

      <p>
        <label>
          {{ 'bundle.configuration.sessionOffsetMinutes' | translate }}
          <input
            type="number"
            formControlName="sessionOffsetMinutes"
            data-testid="bundle-configuration-form-session-offset-minutes-input"
            min="0"
            placeholder="0"
          />
        </label>
        <small class="form-text text-muted">
          {{ 'bundle.configuration.sessionOffsetMinutesHelper' | translate }}
        </small>
      </p>

      <h4>{{ 'bundle.configuration.plans.title' | translate }}</h4>

      <ng-container formArrayName="bundles">
        <div
          *ngFor="let _ of bundlesFormArray.controls; let i = index"
          [formGroupName]="i"
          [attr.data-testid]="'bundle-configuration-form-bundle-details-container-' + i"
        >
          <label class="bundle-configuration-form__block__bundle-detail-label">
            {{ 'bundle.configuration.plans.details.mainPlanId' | translate }}
            <input type="text" formControlName="mainPlanId" data-testid="bundle-configuration-form-main-plan-id" />
          </label>

          <label class="bundle-configuration-form__block__bundle-detail-label">
            {{ 'bundle.configuration.plans.details.isActive' | translate }}
            <input type="checkbox" formControlName="isActive" data-testid="bundle-configuration-form-is-active-checkbox" />
          </label>

          <button (click)="removeBundleAtIndex(i)" data-testid="bundle-configuration-form-remove-bundle-button">
            {{ 'bundle.configuration.form.button.removeBundle' | translate }}
          </button>
        </div>
      </ng-container>
    </form>

    <button
      ignt-icon-button
      type="button"
      sentiment="tertiary"
      size="large"
      [icon]="['fal', 'plus']"
      [attr.aria-label]="'bundle.configuration.form.button.addBundle' | translate"
      (click)="addNewBundle()"
      data-testid="bundle-configuration-form-add-bundle-button"
    ></button>

    <button data-testid="bundle-configuration-form-confirm-button" (click)="handleConfirmBundleConfigurationForm()">
      {{ 'bundle.configuration.form.button.save' | translate }}
    </button>

    <button data-testid="bundle-configuration-form-cancel-button" (click)="cancelBundleConfigurationForm.emit()">
      {{ 'bundle.configuration.form.button.cancel' | translate }}
    </button>
  </div>
</div>
