@if (showBackButton()) {
  <button
    type="button"
    igntButton
    class="validation__back-to-list"
    sentiment="tertiary"
    variant="default"
    [leadingIcon]="['fal', 'arrow-left']"
    (click)="onBackToListClick()"
    data-testid="validation-back-to-summary-list"
  >
    {{ 'common.back' | translate }}
  </button>
}
@if (loadingDetail()) {
  <app-validation-loading-spinner [spinnerTestId]="'validation-summary-order-detail-loading'" />
} @else {
  <app-order-card
    [showAgreements]="true"
    [showCustomerNotes]="true"
    [showTags]="true"
    [showExternalReservationId]="true"
    [showActivityJourney]="true"
    [separateHeaderCard]="separateHeaderCard()"
    [order]="order()"
    [cartSessions]="cartSessionsForOrder()"
    [groupedOrders]="groupedOrders()"
    [groupedOrdersLoading]="groupedOrdersLoading()"
    [searchedTicketId]="searchedTicketId()"
    [searchedQRCode]="searchedQRCode()"
    [depositCart]="depositCart()"
    [showDepositRefundButton]="showDepositRefundButton()"
    [depositReservationStatus]="depositReservationStatus()"
    [onDepositRefund]="onDepositRefund()"
    (orderAction)="onOrderAction($event)"
    [channelType]="order().channelType!"
    [showReferencePrice]="true"
  />
}
