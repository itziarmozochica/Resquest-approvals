@if (!summaryListSessionActive()) {
  <app-validation-empty-filters-placeholder (openHowToValidate)="onOpenHowToValidate()" />
} @else {
  <div class="order-list__header">
    <app-validation-summary-filters
      [buyerNameFilter]="summaryFilters().buyerName"
      [currentPage]="summaryCurrentPage()"
      [pageSize]="summaryPageSize()"
      [totalCount]="summaryTotalCount()"
      (filtersChange)="onFiltersChange($event)"
      (nextPage)="onNextPage()"
      (previousPage)="onPreviousPage()"
    />
  </div>
  @if (loadingSearch() && filteredOrderSummaries().length === 0) {
    <app-validation-loading-spinner [spinnerTestId]="'validation-summary-search-loading'" />
  } @else if (filteredOrderSummaries().length === 0) {
    <div class="order-list__no-results" data-testid="validation-summary-empty">
      <ignt-icon class="icon-empty" name="ticket" variant="light" size="h1" [fixedWidth]="true" aria-hidden="true" />
      <div>{{ 'validateTickets.noFilteredResults' | translate }}</div>
    </div>
  } @else {
    <app-validation-summary-table
      class="order-list__table"
      [data]="filteredOrderSummaries()"
      [isLoading]="loadingSearch()"
      (rowSelect)="onRowSelect($event)"
    />
  }
}
