<div class="scanner-view">
  <div class="scanner-view__device">
    <span class="scanner-view__device-label">{{ 'validateTickets.device' | translate }}</span>
    <app-multi-select
      data-testid="scanner-view-device-select"
      [displayInPlaceMaximum]="1"
      [maxSelectedOptions]="1"
      [options]="deviceOptions()"
      [placeholder]="'validateTickets.noDevice' | translate"
      [searchPlaceholder]="'common.selectsPlaceholder' | translate"
      [selectedOptions]="selectedDeviceOptions()"
      (selected)="onDeviceSelected($event)"
    ></app-multi-select>
  </div>

  @if (showScanner()) {
    <zxing-scanner
      class="scanner-view__preview"
      data-testid="scanner-view-preview"
      [device]="deviceCurrent() ?? undefined"
      [enable]="enableQRScanner()"
      [formats]="formatsEnabled"
      [tryHarder]="true"
      (camerasFound)="onCamerasFound($event)"
      (deviceChange)="onDeviceChange($event)"
      (scanSuccess)="onScanResult($event)"
    ></zxing-scanner>
  }
</div>
