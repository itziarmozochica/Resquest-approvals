@if (displayedOrders().length === 0) {
  <app-validation-empty-filters-placeholder (openHowToValidate)="onOpenHowToValidate()" />
}
@for (order of displayedOrders(); track order.id) {
  <app-order-card
    [showAgreements]="true"
    [showCustomerNotes]="true"
    [showTags]="true"
    [showExternalReservationId]="true"
    [showActivityJourney]="true"
    [separateHeaderCard]="separateHeaderCard()"
    [order]="order"
    [cartSessions]="cartSessions().get(order.id) ?? []"
    [groupedOrders]="groupedOrdersByOrderId().get(order.id) ?? []"
    [groupedOrdersLoading]="groupedOrdersLoading()"
    [searchedTicketId]="searchedTicketId()"
    [searchedQRCode]="searchedQRCode()"
    [depositCart]="depositCarts().get(order.id) ?? null"
    [showDepositRefundButton]="showDepositRefundButton()"
    [depositReservationStatus]="reservationStatusFor(order)"
    [onDepositRefund]="depositRefundFns().get(order.id) ?? null"
    (orderAction)="onOrderAction($event)"
    [channelType]="order.channelType!"
    [showReferencePrice]="true"
  />
}
