<div class="validation-summary-filters">
  <div
    class="validation-summary-filters__search"
    role="search"
    [attr.aria-label]="'validation.summaryFilters.searchByFullName' | translate"
  >
    <div class="validation-summary-filters__search__input-wrapper">
      <ignt-input-field
        class="validation-summary-filters__search__input"
        [label]="'validation.summaryFilters.searchByFullName' | translate"
        [leadIcon]="['fal', 'search']"
        [ngModel]="buyerNameInput()"
        (ngModelChange)="changeBuyerName($event)"
        [placeholder]="'validation.summaryFilters.searchByFullName' | translate"
        id="validation-filters-buyer-name"
        data-testid="validation-filters-buyer-name"
      ></ignt-input-field>
    </div>
  </div>

  <div class="validation-summary-filters__actions">
    <app-pagination-range
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      [totalCount]="totalCount()"
      (nextPage)="onNextPage()"
      (previousPage)="onPreviousPage()"
    />
    <button
      igntButton
      [sentiment]="'tertiary'"
      [variant]="'default'"
      [size]="'large'"
      [fill]="false"
      [leadingIcon]="['fas', 'sliders-h']"
      [attr.aria-expanded]="showFilters()"
      aria-controls="validation-summary-filters-panel"
      (click)="openFilterModal()"
      data-testid="validation-summary-filters-button"
    >
      {{
        activeFiltersCount() > 0
          ? ('validation.summaryFilters.filterButtonWithFilters' | translate: { count: activeFiltersCount() })
          : ('validation.summaryFilters.filterButton' | translate)
      }}
    </button>
  </div>
</div>

<app-lateral-slider
  class="validation-summary-filters__slider"
  (closeSlider)="closeFilters()"
  [showDetails]="showFilters()"
  [contentTemplate]="filtersTemplate"
  [title]="'validation.summaryFilters.sheetTitle' | translate"
  [closeOnBackdropClick]="true"
></app-lateral-slider>

<ng-template #filtersTemplate>
  <div
    id="validation-summary-filters-panel"
    role="region"
    [attr.aria-label]="'validation.summaryFilters.sheetTitle' | translate"
    data-testid="validation-summary-filters-sheet"
  >
    <div class="validation-summary-filters__sheet-content">
      <div class="validation-summary-filters__sheet-group">
        <div class="validation-summary-filters__date-range">
          <span class="validation-summary-filters__range-label">
            {{ 'orders.filterLabels.purchaseDate' | translate }}
          </span>
          <app-date-range
            data-testid="validation-filters-purchase-date-range"
            [initialDateShown]="false"
            [allowClearDate]="true"
            [queryDateRange]="sliderFilters.purchaseDateRange"
            class="validation-summary-filters__date-range__control"
            (selected)="selectPurchaseDateRange($event)"
          ></app-date-range>
        </div>

        <div class="validation-summary-filters__date-range">
          <span class="validation-summary-filters__range-label">
            {{ 'orders.filterLabels.eventDate' | translate }}
          </span>
          <app-date-range
            data-testid="validation-filters-event-date-range"
            [initialDateShown]="false"
            [allowClearDate]="true"
            [queryDateRange]="sliderFilters.eventDateRange"
            class="validation-summary-filters__date-range__control"
            (selected)="selectEventDateRange($event)"
          ></app-date-range>
        </div>
      </div>

      <div class="validation-summary-filters__footer">
        <button
          igntButton
          [sentiment]="'primary'"
          [variant]="'default'"
          [size]="'large'"
          [fill]="false"
          (click)="applyFilters()"
          data-testid="validation-summary-apply-filters-button"
        >
          {{ 'validation.summaryFilters.applyFilters' | translate }}
        </button>
        <button
          igntButton
          [sentiment]="'tertiary'"
          [variant]="'default'"
          [size]="'large'"
          [fill]="false"
          (click)="clearFilters()"
          data-testid="validation-summary-clear-filters-button"
        >
          {{ 'validation.summaryFilters.clearFilters' | translate }}
        </button>
      </div>
    </div>
  </div>
</ng-template>
