<div class="validation-empty-state" data-testid="validation-no-results">
  <ignt-icon class="validation-empty-state__icon" name="ticket" variant="light" size="h1" [fixedWidth]="true" aria-hidden="true" />
  <p class="validation-empty-state__text" [innerHTML]="'validateTickets.validateTicketsExplanation' | translate"></p>
  <ul class="validation-empty-state__list">
    <li [innerHTML]="'validateTickets.validateTicketsExplanationList1' | translate"></li>
    <li [innerHTML]="'validateTickets.validateTicketsExplanationList2' | translate"></li>
  </ul>
  <ignt-button
    variant="tertiary"
    size="small"
    data-testid="validation-how-to-validate-button"
    [label]="'validateTickets.validateTicketsExplanationLink' | translate"
    (click)="onOpenHowToClick()"
  />
</div>
