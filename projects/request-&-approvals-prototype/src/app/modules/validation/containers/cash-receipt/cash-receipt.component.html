<ignt-dialog-header>{{ 'cashReceipt.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="cash-receipt" data-testid="cash-receipt">
    <ignt-alert
      *ngIf="alertData() !== null"
      data-testid="cash-receipt-alert"
      showCloseButton
      [sentiment]="alertData()!.sentiment"
      [closeButtonAriaLabel]="'common.close' | translate"
      (closeAlert)="closeAlert()"
    >
      <ng-template #igntAlertContent>
        <span data-testid="cash-receipt-alert-description" [innerHTML]="alertData()!.description"></span>
      </ng-template>
    </ignt-alert>
    <div class="cash-receipt__form">
      <div>
        <span>{{ 'cashReceipt.businessNumberLabel' | translate }}</span>
        <input
          class="field__input"
          data-testid="cash-receipt-form-business-number"
          [disabled]="!isInputEnabled()"
          inputmode="numeric"
          maxlength="10"
          type="text"
          (input)="changeBusinessNumber($event)"
          (keypress)="pressBusinessNumberKey($event)"
        />
      </div>
      <div>
        <span>{{ 'cashReceipt.totalAmountLabel' | translate }}</span>
        <input
          appAutoformatNumericInput
          class="field__input"
          [currency]="currency.KRW"
          data-testid="cash-receipt-form-total-amount"
          [disabled]="!isInputEnabled()"
          min="0"
          [placeHolderValue]="0"
          type="text"
          value="0"
          (rawValue)="changeTotalAmount($event)"
        />
      </div>
      <div>
        <span>{{ 'cashReceipt.emailTextLabel' | translate }}</span>
        <input
          class="field__input"
          data-testid="cash-receipt-form-email"
          [disabled]="!isInputEnabled()"
          type="text"
          (input)="changeEmail($event)"
        />
      </div>
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button
    igntButton
    data-testid="cash-receipt-issue-button"
    [disabled]="!isIssueButtonEnabled()"
    [loading]="isLoading()"
    (click)="clickIssue()"
  >
    <span>{{ 'cashReceipt.issueButton' | translate }}</span>
  </button>
</ignt-dialog-footer>
