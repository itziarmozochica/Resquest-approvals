<ignt-dialog-header data-testid="create-record-dialog-header">
  {{ 'projectManagement.detail.createModal.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content class="create-record-modal">
  <button
    type="button"
    class="create-record-modal__option"
    [disabled]="!data.canCreateInformationRequest"
    (click)="choose('request')"
    data-testid="create-record-request"
  >
    <span class="create-record-modal__option-title">{{ 'projectManagement.detail.createModal.request' | translate }}</span>
    <span class="create-record-modal__option-desc">{{ 'projectManagement.detail.createModal.requestDesc' | translate }}</span>
  </button>

  <button
    type="button"
    class="create-record-modal__option"
    [disabled]="!data.canCreateApproval"
    (click)="choose('approval')"
    data-testid="create-record-approval"
  >
    <span class="create-record-modal__option-title">{{ 'projectManagement.detail.createModal.approval' | translate }}</span>
    <span class="create-record-modal__option-desc">{{ 'projectManagement.detail.createModal.approvalDesc' | translate }}</span>
  </button>

  <button
    type="button"
    class="create-record-modal__option create-record-modal__option--disabled"
    disabled
    aria-disabled="true"
    data-testid="create-record-content"
  >
    <span class="create-record-modal__option-title">{{ 'projectManagement.detail.createModal.content' | translate }}</span>
    <span class="create-record-modal__option-badge">{{ 'projectManagement.detail.comingSoon' | translate }}</span>
  </button>
</ignt-dialog-content>
