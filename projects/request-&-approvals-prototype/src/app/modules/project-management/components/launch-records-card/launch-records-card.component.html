<section
  class="launch-records-card"
  [class.launch-records-card--disabled]="disabled()"
  [class.launch-records-card--expanded]="expanded() && !disabled()"
  [attr.data-testid]="testId()"
>
  <button
    type="button"
    class="launch-records-card__header"
    [disabled]="disabled()"
    [attr.aria-expanded]="disabled() ? null : expanded()"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    (click)="onToggle()"
    [attr.data-testid]="testId() + '-toggle'"
  >
    <span class="launch-records-card__title">{{ titleKey() | translate }}</span>
    @if (count() !== null) {
      <span class="launch-records-card__count" [attr.data-testid]="testId() + '-count'">{{ count() }}</span>
    }
    @if (!disabled()) {
      <span class="launch-records-card__chevron" [class.launch-records-card__chevron--open]="expanded()" aria-hidden="true">›</span>
    }
  </button>

  @if (expanded() && !disabled()) {
    <div class="launch-records-card__body" [attr.data-testid]="testId() + '-body'">
      @if (error()) {
        <p class="launch-records-card__state launch-records-card__state--error">
          {{ 'projectManagement.detail.cardError' | translate }}
        </p>
      } @else if (empty()) {
        <p class="launch-records-card__state">{{ 'projectManagement.detail.cardEmpty' | translate }}</p>
      } @else {
        <ng-content />
      }
    </div>
  }
</section>
