@if (visible()) {
  <aside class="launch-migration-banner" role="status" aria-live="polite" data-testid="launch-migration-banner">
    <div class="launch-migration-banner__content">
      <h2 class="launch-migration-banner__title">{{ 'projectManagement.migrationBanner.title' | translate }}</h2>
      <p class="launch-migration-banner__body">{{ 'projectManagement.migrationBanner.body' | translate }}</p>
    </div>
    <button
      type="button"
      class="launch-migration-banner__dismiss btn btn-link"
      (click)="dismiss()"
      data-testid="launch-migration-banner-dismiss"
    >
      {{ 'projectManagement.migrationBanner.dismiss' | translate }}
    </button>
  </aside>
}
