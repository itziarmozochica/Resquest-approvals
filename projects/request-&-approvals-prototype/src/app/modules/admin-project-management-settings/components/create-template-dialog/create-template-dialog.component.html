<div class="ctd-backdrop" (click)="onCancel()"></div>
<div class="ctd-dialog" role="dialog" aria-modal="true">
  <header class="ctd-header">
    <h3>{{ 'adminProjectManagement.createTemplate.title' | translate }}</h3>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" class="ctd-body">
    <label class="ctd-field">
      <span>{{ 'adminProjectManagement.createTemplate.label' | translate }}</span>
      <input type="text" class="form-control" formControlName="label" data-testid="create-template-label" />
    </label>

    <footer class="ctd-footer">
      <button type="button" igntButton sentiment="tertiary" (click)="onCancel()">
        {{ 'adminProjectManagement.createTemplate.cancel' | translate }}
      </button>
      <button type="submit" igntButton sentiment="primary" [disabled]="form.invalid" data-testid="create-template-confirm">
        {{ 'adminProjectManagement.createTemplate.confirm' | translate }}
      </button>
    </footer>
  </form>
</div>
