<ul class="template-list">
  @for (template of templates; track template.key) {
    <li
      class="template-list__item"
      [class.template-list__item--expanded]="template.key === expandedKey"
      [class.template-list__item--touched]="isTouched(template.key)"
      [class.template-list__item--hidden]="isHidden(template.key)"
    >
      <div class="template-list__row">
        <button
          type="button"
          class="template-list__header"
          (click)="onToggle(template.key)"
          [attr.aria-expanded]="template.key === expandedKey"
        >
          <span class="template-list__title">{{ template.label }}</span>
          @if (isHidden(template.key)) {
            <span class="template-list__badge template-list__badge--hidden">{{ 'adminServiceCatalog.hidden' | translate }}</span>
          }
          @if (isTouched(template.key)) {
            <span class="template-list__badge">{{ 'adminServiceCatalog.unsaved' | translate }}</span>
          }
          @if (template.key === loadingKey) {
            <span class="template-list__spinner" aria-hidden="true"></span>
          }
          <span class="template-list__chevron" aria-hidden="true">
            {{ template.key === expandedKey ? '▾' : '▸' }}
          </span>
        </button>
        <button
          type="button"
          class="template-list__hide-toggle"
          (click)="onHideToggle(template.key)"
          [attr.data-testid]="'template-hide-toggle-' + template.key"
          [attr.aria-pressed]="isHidden(template.key)"
        >
          {{ (isHidden(template.key) ? 'adminServiceCatalog.show' : 'adminServiceCatalog.hide') | translate }}
        </button>
        @if (isDynamic(template.key)) {
          @if (confirmingKey() === template.key) {
            <span class="template-list__confirm">
              <span class="template-list__confirm-text">{{ 'adminProjectManagement.deleteTemplate.confirm' | translate }}</span>
              <button
                type="button"
                class="template-list__delete template-list__delete--confirm"
                (click)="confirmDelete(template.key)"
                [attr.data-testid]="'template-delete-confirm-' + template.key"
              >
                {{ 'adminProjectManagement.deleteTemplate.yes' | translate }}
              </button>
              <button type="button" class="template-list__delete-cancel" (click)="cancelDelete()">
                {{ 'adminProjectManagement.deleteTemplate.no' | translate }}
              </button>
            </span>
          } @else {
            <button
              type="button"
              class="template-list__delete"
              (click)="requestDelete(template.key)"
              [attr.data-testid]="'template-delete-' + template.key"
            >
              {{ 'adminProjectManagement.deleteTemplate.action' | translate }}
            </button>
          }
        }
      </div>
    </li>
  }
</ul>
