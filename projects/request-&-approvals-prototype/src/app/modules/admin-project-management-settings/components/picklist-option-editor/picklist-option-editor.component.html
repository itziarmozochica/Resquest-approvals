<div class="picklist-editor">
  <ul class="picklist-editor__rows" cdkDropList (cdkDropListDropped)="drop($event)">
    @for (row of rows(); track trackRow($index); let i = $index) {
      <li class="picklist-editor__row" cdkDrag>
        <button class="picklist-editor__handle" cdkDragHandle type="button" [disabled]="disabled" aria-label="reorder">⋮⋮</button>
        <div class="picklist-editor__fields">
          <input
            type="text"
            class="form-control picklist-editor__label"
            [ngModel]="row.label"
            [disabled]="disabled"
            (ngModelChange)="setLabel(i, $event)"
            [placeholder]="'adminServiceCatalog.editor.picklist.optionLabel' | translate"
            [attr.data-testid]="'picklist-option-label-' + i"
          />
          <input
            type="text"
            class="form-control picklist-editor__helper"
            [ngModel]="row.helper"
            [disabled]="disabled"
            (ngModelChange)="setHelper(i, $event)"
            [placeholder]="'adminServiceCatalog.editor.picklist.helperText' | translate"
            [attr.data-testid]="'picklist-option-helper-' + i"
          />
          @if (supportsAskDetail) {
            <label class="picklist-editor__ask-detail">
              <input
                type="checkbox"
                [checked]="row.askDetail"
                [disabled]="disabled"
                (change)="toggleAskDetail(i, $any($event.target).checked)"
                [attr.data-testid]="'picklist-option-ask-detail-' + i"
              />
              {{ 'adminServiceCatalog.editor.picklist.askDetail' | translate }}
            </label>
          }
        </div>
        <button
          type="button"
          igntButton
          sentiment="tertiary"
          variant="danger"
          size="small"
          class="picklist-editor__remove"
          [disabled]="disabled || !canRemove"
          (click)="removeRow(i)"
          [attr.data-testid]="'picklist-option-remove-' + i"
        >
          {{ 'adminServiceCatalog.editor.picklist.remove' | translate }}
        </button>
      </li>
    }
  </ul>

  <button type="button" igntButton sentiment="secondary" size="small" class="picklist-editor__add" [disabled]="disabled" (click)="addRow()">
    + {{ 'adminServiceCatalog.editor.picklist.addOption' | translate }}
  </button>
</div>
