<cart-detail
  *ngIf="step === CancellationStep.ORDER_DETAIL"
  [cart]="cancellationCart"
  [showClearAll]="false"
  [showSessionDate]="true"
  [showSeatingInModal]="true"
  [showPaymentDetails]="true"
  [collapsable]="true"
  [isCollapsed]="false"
  [showSeatingMap]="true"
  [title]="'validateTicketsNew.orderDetail.title'"
  scope="order-cancellation"
  [orderId]="orderId"
  [loyaltyPoints]="loyaltyPoints()"
  [orderCancellationRecords]="orderCancellationRecords"
  [showReferencePrice]="true"
></cart-detail>

<cart-detail
  *ngIf="step === CancellationStep.REIMBURSEMENT_SUMMARY"
  [cart]="filteredCart || cancellationCart"
  [showClearAll]="false"
  [showSessionDate]="true"
  [showSeatingInModal]="true"
  [showPaymentDetails]="true"
  [collapsable]="true"
  [isCollapsed]="false"
  [showSeatingMap]="true"
  [showPrice]="false"
  [title]="'cancellation.reimbursementTypes.summaryTitle'"
  scope="order-cancellation"
  [orderId]="orderId"
  [orderCancellationRecords]="orderCancellationRecords"
></cart-detail>
