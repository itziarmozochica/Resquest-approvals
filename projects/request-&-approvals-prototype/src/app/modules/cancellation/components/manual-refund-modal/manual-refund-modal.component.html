<app-modal-content>
  <div class="manual-refund-modal" data-testid="manual-refund-modal">
    <h5 class="title">{{ 'cancellation.modals.manualRefund.title' | translate }}</h5>
    <ng-container *ngIf="hasMixedPaymentMethods; else singleMethodRefund">
      <p
        [innerHTML]="
          'cancellation.modals.manualRefund.messageMixedRefund'
            | translate: { totalAmount: refundTotal ? (refundTotal | currency: currency : 'symbol-narrow' : null : locale) : '-' }
        "
      ></p>
    </ng-container>
    <ng-template #singleMethodRefund>
      <ng-container *ngIf="paymentMethod === PaymentType.CASH; else cardRefund">
        <p
          [innerHTML]="
            'cancellation.modals.manualRefund.messageCashRefund'
              | translate: { totalAmount: refundTotal ? (refundTotal | currency: currency : 'symbol-narrow' : null : locale) : '-' }
          "
        ></p>
        <img class="image" src="assets/images/cancellations/cash-refund.png" />
      </ng-container>
    </ng-template>

    <div class="buttons">
      <button class="button button--large button--secondary" (click)="cancel()" data-testid="manual-refund-modal-button-cancel">
        {{ 'cancellation.modals.manualRefund.cancel' | translate }}
      </button>
      <button class="button button--large button--primary" (click)="handleConfirm()" data-testid="manual-refund-modal-button-confirm">
        {{ 'cancellation.modals.manualRefund.confirm' | translate }}
      </button>
    </div>
  </div>
  <ng-template #cardRefund>
    <p
      [innerHTML]="
        'cancellation.modals.manualRefund.messageCardRefund'
          | translate: { totalAmount: refundTotal ? (refundTotal | currency: currency : 'symbol-narrow' : null : locale) : '-' }
      "
    ></p>
    <img class="image" src="assets/images/cancellations/card-refund.png" />
  </ng-template>
</app-modal-content>
