<section class="order__split-pack" data-testid="split-pack-section">
  <div class="order__split-pack__icon">
    <app-pack-session-icon></app-pack-session-icon>
  </div>
  <div class="order__split-pack__content">
    <div class="order__split-pack__title">{{ 'cancellation.splitPack.title' | translate }}</div>
    <div class="order__split-pack__description">
      {{ 'cancellation.splitPack.description' | translate }}
    </div>
  </div>
  <div class="order__split-pack__action">
    <button
      igntButton
      sentiment="secondary"
      variant="sharp"
      size="small"
      fill="false"
      (click)="onConfirmSplitPack()"
      [disabled]="disabled"
      data-testid="split-pack-button"
    >
      {{ 'cancellation.splitPack.button' | translate }}
    </button>
  </div>
</section>
