@if (viewOrder() && viewCartSession() !== undefined) {
  <app-cart-header
    [planName]="planName()"
    [planAddress]="viewCartSession()?.sessionAddress"
    [sessionStartAt]="viewCartSession()?.sessionStartAt"
    [timezone]="viewCartSession()?.sessionTimezone"
    [ownerEmail]="viewCartSession()?.ownerEmail"
    [ownerPhone]="viewCartSession()?.ownerPhone"
    [ownerFullName]="viewCartSession()?.ownerFullName"
    [isGuest]="viewCartSession()?.isGuest ?? false"
    [isMember]="orderHasDiscounts()"
    [showSessionDate]="false"
  >
    <ng-container identifiers>
      <div data-testid="order-header-order-id" class="order-header__order-id">
        <span class="order-header__order-id-tag">
          {{ 'validateTicketsNew.orderHeader.orderId' | translate }}
        </span>
        {{ viewOrder()?.externalId }}
      </div>
    </ng-container>
  </app-cart-header>
}
