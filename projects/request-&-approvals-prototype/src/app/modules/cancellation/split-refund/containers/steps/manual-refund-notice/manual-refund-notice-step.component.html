<div class="manual-refund-notice-step" data-testid="split-refund-manual-refund-notice-step">
  @if (store.context().amountToRefund; as amountToRefund) {
    <!-- The inline step's own string, markup and all, so the two can never drift apart. Angular
         sanitizes a plain `[innerHTML]`, which is what the repo's sanitizer rule asks for. -->
    <p
      class="manual-refund-notice-step__message"
      data-testid="split-refund-manual-refund-message"
      [innerHTML]="
        (isCash() ? 'cancellation.modals.manualRefund.messageCashRefund' : 'cancellation.modals.manualRefund.messageCardRefund')
          | translate: { totalAmount: amountToRefund.amount | currency: amountToRefund.currency : 'symbol-narrow' : undefined : locale() }
      "
    ></p>
  }

  <img
    class="manual-refund-notice-step__image"
    alt=""
    [src]="isCash() ? 'assets/images/cancellations/cash-refund.png' : 'assets/images/cancellations/card-refund.png'"
  />
</div>
