<div class="submit-failed-step" data-testid="split-refund-submit-failed-step">
  <ignt-icon class="submit-failed-step__icon" name="exclamation-circle" variant="light" size="display" aria-hidden="true" />
  <p class="submit-failed-step__message">{{ 'cancellation.splitRefund.submitFailed.message' | translate }}</p>
  @if (reason(); as reason) {
    <p class="submit-failed-step__reason" data-testid="split-refund-submit-failed-reason">{{ reason | translate }}</p>
  }
  <p class="submit-failed-step__hint">{{ 'cancellation.splitRefund.submitFailed.hint' | translate }}</p>
</div>
