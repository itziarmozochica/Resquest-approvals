<div class="edit-amount-step" data-testid="split-refund-edit-amount-step">
  <p class="edit-amount-step__prompt" data-testid="split-refund-amount-prompt">
    {{ 'cancellation.splitRefund.amountDialog.prompt' | translate: { method: methodLabel() } }}
  </p>

  <div #display class="edit-amount-step__display" tabindex="-1">
    <output class="edit-amount-step__value" data-testid="split-refund-amount-value" aria-live="polite">
      {{ store.context().draftAmount | currency: currency() : 'symbol-narrow' : undefined : locale() }}
    </output>
    @if (canClear()) {
      <button
        type="button"
        ignt-icon-button
        variant="sharp"
        sentiment="tertiary"
        data-testid="split-refund-amount-clear"
        [attr.aria-label]="clearLabel"
        [icon]="['fas', 'times']"
        (click)="clear(); display.focus()"
      ></button>
    }
  </div>

  <app-numeric-keypad
    [currency]="currency()"
    [locale]="locale()"
    [maxAmount]="maxAmount()"
    [showDisplay]="false"
    [value]="store.context().draftAmount"
    (valueChange)="onAmountChange($event)"
  />
</div>
