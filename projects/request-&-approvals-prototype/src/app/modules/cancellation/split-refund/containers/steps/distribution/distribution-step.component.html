<div class="distribution-step" data-testid="split-refund-distribution-step">
  <div class="distribution-step__form">
    <h4 class="distribution-step__section-title">{{ 'cancellation.splitRefund.selectMethods.title' | translate }}</h4>
    <p class="distribution-step__section-subtitle">{{ 'cancellation.splitRefund.selectMethods.subtitle' | translate }}</p>

    <div class="distribution-step__methods">
      @for (row of store.distributionRows(); track row.paymentMethod.id) {
        <app-split-refund-method-row
          [amount]="row.amount"
          [currency]="currency()"
          [hasError]="row.hasError"
          [locale]="store.context().locale"
          [maxAmount]="row.maxAmount"
          [paymentMethod]="row.paymentMethod"
          (edit)="editAmount(row)"
        />
      }
    </div>
  </div>

  @if (store.context().amountToRefund; as amountToRefund) {
    <app-split-refund-summary
      [amountToRefund]="amountToRefund"
      [locale]="store.context().locale"
      [methodLabels]="methodLabels()"
      [orderTotal]="store.context().orderTotal ?? amountToRefund"
      [refundSum]="store.refundSum()"
      [ticketsToCancel]="store.context().ticketsToCancel"
      [totalTickets]="store.context().totalTickets"
    />
  }
</div>
