<div class="color-section">
  <div class="color-section__content">
    <div class="color-section__text">
      <label class="color-section__label">{{ label }}</label>
      <p class="color-section__description" *ngIf="description">{{ description }}</p>
    </div>

    <app-color-input [value]="value" (colorChange)="onColorChange($event)"></app-color-input>
  </div>
</div>
