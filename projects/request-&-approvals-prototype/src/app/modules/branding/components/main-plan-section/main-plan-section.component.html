<div class="main-plan-section">
  <div class="main-plan-section__content">
    <div class="main-plan-section__text">
      <label class="main-plan-section__label">{{ title }}</label>
      <p class="main-plan-section__description">{{ description }}</p>
    </div>

    <div class="main-plan-section__picker-container">
      <app-multi-select
        class="main-plan-section-multiselect"
        [options]="mainPlanOptions"
        [selectedOptions]="selectedMainPlanOptions"
        [placeholder]="label"
        [searchPlaceholder]="placeholder"
        [displayInPlaceMaximum]="1"
        (selected)="onMainPlansChange($event)"
      ></app-multi-select>
    </div>
  </div>
</div>
