<ignt-table
  class="phone-otp-configurations-table"
  data-testid="phone-otp-configurations-table"
  [data]="configs()"
  [isLoading]="isLoading()"
>
  <ignt-table-column key="brandName" columnType="primary" [header]="'branding.phoneOtpConfiguration.columns.brand' | translate">
    <ng-template [igntTableColumnTemplateType]="rowSample()" let-item="item">
      <span data-testid="phone-otp-configuration-brand">{{ item.brandName }}</span>
    </ng-template>
  </ignt-table-column>

  <ignt-table-column key="domain" columnType="secondary" [header]="'branding.phoneOtpConfiguration.columns.domain' | translate">
    <ng-template [igntTableColumnTemplateType]="rowSample()" let-item="item">
      <span data-testid="phone-otp-configuration-domain">{{ item.domain }}</span>
    </ng-template>
  </ignt-table-column>

  <ignt-table-column key="updatedAt" columnType="secondary" [header]="'branding.phoneOtpConfiguration.columns.updated' | translate">
    <ng-template [igntTableColumnTemplateType]="rowSample()" let-item="item">
      @if (item.updatedAt === null) {
        <span class="phone-otp-configurations-table__none" data-testid="phone-otp-configuration-updated">—</span>
      } @else {
        <time data-testid="phone-otp-configuration-updated" [attr.datetime]="item.updatedAt">{{ item.updatedAt | date: 'medium' }}</time>
      }
    </ng-template>
  </ignt-table-column>
</ignt-table>
