<div class="content-plan-details" *ngIf="plan">
  <div class="content-plan-details__header">
    @if (showTitle()) {
      <h2 class="title" data-testid="plan-detail-description-title">
        <fa-icon [fixedWidth]="true" [icon]="['fas', 'circle']" class="title__status title__status--{{ plan.status }}"> </fa-icon>
        {{ plan.name }}
      </h2>
    }
    <div class="plan-actions">
      <button class="plan-actions__button" data-testid="plan-action-button" [igntMenuTriggerFor]="planActionsMenu">
        <fa-icon class="icon" [icon]="['fal', 'cog']" [fixedWidth]="true"></fa-icon>
        <span class="label" translate>planDetail.actions</span>
      </button>
      <ng-template #planActionsMenu>
        <ignt-menu>
          @for (option of actionOptions; track option.id) {
            <ignt-menu-item
              data-testid="plan-action-option"
              value="{{ option.id }}"
              [label]="option.label | translate"
              (triggered)="clickOnOption(option.id)"
            >
              @if (option.icon) {
                <ignt-icon [name]="option.icon.name" [variant]="option.icon.variant" />
              }
            </ignt-menu-item>
          }
        </ignt-menu>
      </ng-template>
    </div>
  </div>
  <div class="content-plan-details__body">
    <div class="gallery">
      <div class="gallery__container" *ngFor="let img of plan.gallery; let i = index">
        <img class="plan-img" data-testid="plan-detail-gallery-img" *ngIf="i < 4" attr.src="{{ img }}" attr.alt="{{ plan.name }}" />
      </div>
    </div>
    <div class="description" data-testid="plan-detail-description" [innerHTML]="plan.description | sanitize"></div>
  </div>
</div>
