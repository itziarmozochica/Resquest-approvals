<app-modal-content [title]="title" [iconId]="iconId">
  <div class="pd-email-modal">
    <div class="modal-body">
      <ignt-alert *ngIf="error" sentiment="danger" [description]="'planDetail.errorSendingEmail' | translate" />
      <ng-content></ng-content>
    </div>
    <div class="modal-footer">
      <div class="modal-footer-button">
        <ignt-alert
          *ngIf="success"
          class="success-message"
          sentiment="positive"
          [description]="'planDetail.emailSentSuccessfully' | translate"
        />
      </div>
    </div>
  </div>
</app-modal-content>
