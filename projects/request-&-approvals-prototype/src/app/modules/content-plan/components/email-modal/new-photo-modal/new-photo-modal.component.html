<app-modal-email [title]="'planDetail.suggestNewPicture' | translate" [error]="error" [success]="success">
  <form [formGroup]="newPhotoForm" data-testid="modal-plan-new-picture" (ngSubmit)="submitNewPictureForm()">
    <div class="co-group-form">
      <input class="pd-new-picture-input" type="file" accept="image/png, image/jpeg" (change)="onChange($event.target.files)" />
    </div>
    <div class="co-group-form">
      <button
        class="btn btn-round el-cta-button"
        data-testid="button-plan-new-picture"
        type="submit"
        *ngIf="!success"
        [disabled]="!newPhotoForm.valid"
      >
        <span translate>planDetail.sendNewPicture</span>
      </button>
    </div>
  </form>
</app-modal-email>
