<app-modal-email [title]="'planDetail.suggestNewName' | translate" [error]="error" [success]="success">
  <form class="pd-email-form" data-testid="modal-plan-new-name" [formGroup]="newNameForm" (ngSubmit)="submitNewNameForm()">
    <div class="co-group-form">
      <input class="pd-new-name-input" formControlName="name" name="name" [placeholder]="'planDetail.name' | translate" />
    </div>
    <div class="co-group-form">
      <button
        class="btn btn-round el-cta-button"
        data-testid="button-plan-new-name"
        type="submit"
        *ngIf="!success"
        [disabled]="!newNameForm.valid"
      >
        <span translate>planDetail.sendNewName</span>
      </button>
    </div>
  </form>
</app-modal-email>
