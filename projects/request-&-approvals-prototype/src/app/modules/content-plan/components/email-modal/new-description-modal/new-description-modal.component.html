<app-modal-email [title]="'planDetail.suggestNewDescription' | translate" [error]="error" [success]="success">
  <form [formGroup]="newDescriptionForm" data-testid="modal-plan-new-description" (ngSubmit)="submitDescriptionForm()">
    <div class="co-group-form">
      <textarea
        class="el-textarea pd-new-description-textarea"
        formControlName="description"
        name="description"
        [placeholder]="'planDetail.description' | translate"
      ></textarea>
    </div>
    <div class="co-group-form">
      <button
        class="btn btn-round el-cta-button"
        data-testid="button-plan-new-description"
        type="submit"
        *ngIf="!success"
        [disabled]="!newDescriptionForm.valid"
      >
        <span translate>planDetail.sendNewDescription</span>
      </button>
    </div>
  </form>
</app-modal-email>
