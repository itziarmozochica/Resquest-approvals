<!-- The ng-container (zero DOM) keeps the root close-tag indented: Angular's
     whitespace collapse leaves SINGLE-char runs untouched, so a column-0 close
     tag would ship a literal "\n" into the export instead of the historical " ". -->
<ng-container>
  @let b = block();
  @if (showPlaceholders() && !hasRichText(b.props.text)) {
    <div class="block-paragraph block-text-placeholder">{{ placeholderFor(KEYS.textPlaceholder) }}</div>
  } @else {
    <div class="block-paragraph" [innerHTML]="b.props.text"></div>
  }
</ng-container>
