<div class="description-translation" [class.description-translation--display]="hideOriginal()" data-testid="description-translation">
  @for (section of sections(); track section.blockId) {
    <app-description-translation-section
      [section]="section"
      [expanded]="expandedBlockIds().has(section.blockId)"
      [selectedItemIndex]="selectedItemByBlock()[section.blockId] ?? 0"
      [readOnly]="readOnly()"
      [hideOriginal]="hideOriginal()"
      [showStatus]="showStatus()"
      [uploadFileCallback]="uploadFileCallback()"
      (toggled)="onSectionToggled(section.blockId)"
      (itemSelected)="onItemSelected(section.blockId, $event)"
      (fieldChange)="fieldChange.emit($event)"
      (validate)="validate.emit($event)"
    ></app-description-translation-section>
  }
</div>
