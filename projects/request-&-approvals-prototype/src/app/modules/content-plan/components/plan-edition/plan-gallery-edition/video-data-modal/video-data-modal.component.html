<app-modal-content>
  <div class="modal__content">
    <div class="modal__title">
      <h5>{{ 'planEdition.video.upload.title' | translate }}</h5>

      <button
        ignt-icon-button
        sentiment="tertiary"
        size="small"
        type="button"
        variant="sharp"
        [attr.aria-label]="'common.close' | translate"
        [icon]="['fas', 'times']"
        (click)="dismiss()"
      ></button>
    </div>

    <ignt-divider></ignt-divider>

    <form [formGroup]="videoSettingsForm">
      <div class="body">
        <!--Poster-->
        <div class="video-settings-row">
          <div class="video-settings-row__instructions">
            <label>{{ 'planEdition.video.upload.poster.title' | translate }}</label>
            <span>{{ 'planEdition.video.upload.poster.subtitle' | translate }}</span>
          </div>

          <div class="video-settings-row__input">
            <div class="file-input" [class.file-input--bordered]="!videoSettingsForm.get('posterUrl').value" (click)="requestUploadFile()">
              <fa-icon class="file-input__icon" [icon]="['fas', 'file-upload']"></fa-icon>
              <div class="file-input__title">{{ 'planEdition.galleryEdition.clickToUpload' | translate }}</div>
              <img
                class="file-input__image"
                alt="Poster preview"
                *ngIf="videoSettingsForm.get('posterUrl').value"
                [src]="videoSettingsForm.get('posterUrl').value"
              />
            </div>
          </div>
        </div>

        <!--Playback rate-->
        <div class="video-settings-row">
          <div class="video-settings-row__instructions">
            <label>{{ 'planEdition.video.upload.playbackRate.title' | translate }}</label>
            <span>{{ 'planEdition.video.upload.playbackRate.subtitle' | translate }}</span>
          </div>
          <div class="video-settings-row__input">
            <label class="cell field">
              <input class="field__input" id="rate" type="number" formControlName="playbackRate" min="0" max="1" step="0.1" />
              <span class="field__label">{{ 'planEdition.video.upload.playbackRate.label' | translate }}</span>
            </label>
          </div>
        </div>
      </div>
    </form>

    <div class="modal__actions">
      <ignt-button fill [disabled]="videoSettingsForm.invalid" [label]="'planEdition.video.upload.save' | translate" (click)="close()" />
    </div>
  </div>
</app-modal-content>
