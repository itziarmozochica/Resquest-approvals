<div class="rich-text-expanded-modal">
  <div class="rich-text-expanded-modal__header">
    <h2 class="rich-text-expanded-modal__title">{{ data.titleKey | translate }}</h2>
  </div>
  <div class="rich-text-expanded-modal__body">
    <ignt-rich-text-editor
      class="rich-text-expanded-modal__editor"
      data-testid="rich-text-expanded-modal-editor"
      [formControl]="data.control"
      [features]="blockBodyFeatures"
      [blockElement]="'div'"
      [readonly]="data.readonly"
    ></ignt-rich-text-editor>
  </div>
  <div class="rich-text-expanded-modal__footer">
    <button
      igntButton
      variant="default"
      sentiment="secondary"
      size="small"
      type="button"
      data-testid="rich-text-expanded-modal-back"
      (click)="back()"
    >
      <span class="ms material-symbols-outlined">close_fullscreen</span>
      {{ 'planEdition.contentEdition.builder.expandableRichText.back' | translate }}
    </button>
  </div>
</div>
