@let currentBlock = block();
@switch (currentBlock.type) {
  @case ('title') {
    <app-db-title-canvas [block]="currentBlock" [showPlaceholders]="showPlaceholders()"></app-db-title-canvas>
  }

  @case ('paragraph') {
    <app-db-paragraph-canvas [block]="currentBlock" [showPlaceholders]="showPlaceholders()"></app-db-paragraph-canvas>
  }

  @case ('spacer') {
    <app-db-spacer-canvas [block]="currentBlock" [showPlaceholders]="showPlaceholders()"></app-db-spacer-canvas>
  }

  @case ('fullImage') {
    <app-db-full-image-canvas [block]="currentBlock" [showPlaceholders]="showPlaceholders()"></app-db-full-image-canvas>
  }

  @case ('fullVideo') {
    <app-db-full-video-canvas [block]="currentBlock" [showPlaceholders]="showPlaceholders()"></app-db-full-video-canvas>
  }

  @case ('imageGrid') {
    <app-db-image-grid-canvas [block]="currentBlock" [showPlaceholders]="showPlaceholders()"></app-db-image-grid-canvas>
  }

  @case ('eventDetails') {
    <app-db-event-details-canvas [block]="currentBlock" [showPlaceholders]="showPlaceholders()"></app-db-event-details-canvas>
  }

  @case ('infoCard') {
    <app-db-info-card-canvas [block]="currentBlock" [showPlaceholders]="showPlaceholders()"></app-db-info-card-canvas>
  }

  @case ('tabs') {
    <app-db-tabs-canvas
      [block]="currentBlock"
      [showPlaceholders]="showPlaceholders()"
      (propsChange)="propsChange.emit($event)"
    ></app-db-tabs-canvas>
  }
}
