<!-- The ng-container (zero DOM) keeps the root close-tag indented: Angular's
     whitespace collapse leaves SINGLE-char runs untouched, so a column-0 close
     tag would ship a literal "\n" into the export instead of the historical " ". -->
<ng-container>
  @let b = block();
  <div
    [class]="b.props.level === 'h1' ? 'block-title-h1' : b.props.level === 'h3' ? 'block-title-h3' : 'block-title-h2'"
    [class.block-text-placeholder]="showPlaceholders() && !b.props.text"
  >
    {{ b.props.text || placeholderFor(KEYS.textPlaceholder) }}
  </div>
</ng-container>
