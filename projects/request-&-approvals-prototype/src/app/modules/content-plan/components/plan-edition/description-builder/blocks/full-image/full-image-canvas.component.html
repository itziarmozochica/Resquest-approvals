<!-- The ng-container (zero DOM) keeps the root close-tag indented: Angular's
     whitespace collapse leaves SINGLE-char runs untouched, so a column-0 close
     tag would ship a literal "\n" into the export instead of the historical " ". -->
<ng-container>
  @let b = block();
  <div class="block-image" style="aspect-ratio: 16/9">
    @if (b.props.src) {
      <img [src]="b.props.src" alt="" />
    } @else {
      <div class="placeholder">
        <span class="ms material-symbols-outlined">image</span>
        @if (showPlaceholders()) {
          <span>{{ placeholderFor(LABEL_KEY) }}</span>
        }
      </div>
    }
  </div>
</ng-container>
