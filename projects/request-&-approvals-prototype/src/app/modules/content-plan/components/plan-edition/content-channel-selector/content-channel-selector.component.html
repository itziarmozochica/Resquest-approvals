<div class="content-channel-selector">
  <ignt-pill-button
    class="content-channel-selector__pill"
    [label]="'planEdition.contentEdition.defaultChannelName' | translate"
    value=""
    [checked]="selectedChannelId() === ''"
    data-testid="content-channel-selector-default"
    [attr.data-channel-id]="''"
    (checkedChange)="selectChannel('')"
  >
    <ignt-tag sentiment="sharp" data-testid="content-channel-selector-default-tag">
      {{ 'planEdition.contentEdition.defaultChannelTag' | translate }}
    </ignt-tag>
  </ignt-pill-button>

  @for (id of channelIds(); track id) {
    <ignt-pill-button
      class="content-channel-selector__pill"
      [label]="getChannelName(id)"
      [value]="id"
      [checked]="selectedChannelId() === id"
      [showCloseButton]="canEditPlan()"
      data-testid="content-channel-selector-channel"
      [attr.data-channel-id]="id"
      (checkedChange)="selectChannel(id)"
      (closed)="removeChannel(id)"
    ></ignt-pill-button>
  }

  <ignt-button
    class="content-channel-selector__add"
    variant="tertiary"
    size="small"
    data-testid="content-channel-selector-add"
    [label]="'planEdition.contentEdition.addChannel' | translate"
    [leadingIcon]="{ name: 'plus', variant: 'solid' }"
    [disabled]="!canEditPlan()"
    (click)="addChannelClick.emit()"
  ></ignt-button>
</div>
