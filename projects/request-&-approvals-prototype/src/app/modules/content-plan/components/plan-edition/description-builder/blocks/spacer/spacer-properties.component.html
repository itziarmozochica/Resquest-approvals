<div class="prop">
  <label class="prop-label">{{ 'planEdition.contentEdition.builder.blocks.spacer.height' | translate }}</label>
  <div class="prop-slider">
    <input
      type="range"
      min="8"
      max="120"
      step="4"
      [value]="spacerSize()"
      [disabled]="disabled()"
      (input)="onSpacerChange($any($event.target).value)"
    />
    <span class="val">{{ spacerSize() }}px</span>
  </div>
</div>
