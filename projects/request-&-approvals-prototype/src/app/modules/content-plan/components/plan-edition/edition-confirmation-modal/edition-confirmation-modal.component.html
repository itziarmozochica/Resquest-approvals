<div class="confirm-modal" data-testid="edition-confirmation-modal">
  <div class="confirm-modal__header font-h5">
    {{ 'planEdition.contentEdition.publishChanges' | translate }}
  </div>
  <div class="confirm-modal__body">
    {{ 'planEdition.contentEdition.confirmModalText' | translate }}
  </div>
  <div *ngIf="infoText" class="confirm-modal__message">
    <fa-icon class="confirm-modal__message-icon" [icon]="['far', 'info-circle']"></fa-icon>
    <span [innerHtml]="infoText"></span>
  </div>
  <div *ngIf="confirmCheckboxText" class="confirm-modal__checkbox">
    <input data-testid="plan-edition-confirm-checkbox" type="checkbox" (change)="isConfirmationModalChecked = $event.target.checked" />
    <span [innerHtml]="confirmCheckboxText"></span>
  </div>
  <div class="confirm-modal__footer">
    <ignt-button
      data-testid="plan-edition-confirm-cancel"
      sentiment="danger"
      variant="tertiary"
      [label]="'planEdition.contentEdition.cancel' | translate"
      (click)="response.emit(false)"
    />
    <ignt-button
      data-testid="plan-edition-confirm-accept"
      [disabled]="!!confirmCheckboxText && !isConfirmationModalChecked"
      [label]="'planEdition.contentEdition.publish' | translate"
      (click)="response.emit(true)"
    />
  </div>
</div>
