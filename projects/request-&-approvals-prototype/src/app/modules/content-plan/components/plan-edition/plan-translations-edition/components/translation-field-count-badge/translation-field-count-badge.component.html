<span class="translation-field-count-badge" [attr.data-testid]="testId()">
  <span
    class="translation-field-count-badge__scope"
    [class.translation-field-count-badge__scope--missing]="showScopeStatusIcon() && !isComplete()"
    [attr.data-testid]="testId() + '-scope'"
  >
    {{
      'planEdition.translationsEdition.translatedFieldsStatus'
        | translate: { translatedFieldsCount: translatedCount(), totalFieldsCount: totalCount() }
    }}
    @if (showScopeStatusIcon()) {
      @if (!isComplete()) {
        <ignt-icon
          class="translation-field-count-badge__scope-icon translation-field-count-badge__scope-icon--warning"
          name="exclamation-triangle"
          variant="solid"
          aria-hidden="true"
        ></ignt-icon>
      } @else {
        <ignt-icon
          class="translation-field-count-badge__scope-icon translation-field-count-badge__scope-icon--complete"
          name="check-circle"
          variant="solid"
          aria-hidden="true"
        ></ignt-icon>
      }
    }
  </span>
</span>
