@let b = block();
<div class="prop" [class.prop--missing]="isMissing('heading')">
  <app-db-prop-label [contract]="FIELDS" field="heading" />
  <input
    type="text"
    [placeholder]="'planEdition.contentEdition.builder.blocks.eventDetails.sectionHeadingPlaceholder' | translate"
    [value]="b.props.heading"
    [disabled]="disabled()"
    [attr.aria-invalid]="isMissing('heading') ? true : null"
    (input)="set('heading', $any($event.target).value)"
  />
</div>
