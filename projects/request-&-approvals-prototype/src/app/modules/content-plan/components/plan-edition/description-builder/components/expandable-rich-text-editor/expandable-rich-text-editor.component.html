<div class="expandable-rich-text-editor">
  @if (disabled()) {
    <app-translation-text-field [label]="''" type="html" [htmlContent]="content()" [readonly]="true"></app-translation-text-field>
  } @else {
    @if (!isExpanded()) {
      <ignt-rich-text-editor [formControl]="control" [features]="blockBodyFeatures" [blockElement]="'div'"></ignt-rich-text-editor>
    }
    <div class="expandable-rich-text-editor__footer">
      <button
        type="button"
        class="expandable-rich-text-editor__expand-btn"
        [title]="'planEdition.contentEdition.builder.expandableRichText.expandAria' | translate"
        [attr.aria-label]="'planEdition.contentEdition.builder.expandableRichText.expandAria' | translate"
        data-testid="expandable-rich-text-expand"
        (click)="expand()"
      >
        <span class="ms material-symbols-outlined">open_in_full</span>
      </button>
    </div>
  }
</div>
