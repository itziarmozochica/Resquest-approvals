<div class="plan-edition-header">
  <div class="plan-edition-header__header">
    <div class="plan-edition-header__title">
      {{ title }}
    </div>
    <div class="plan-edition-header__link">
      <ng-container *ngTemplateOutlet="linkTemplate"></ng-container>
    </div>
  </div>
  <div class="plan-edition-header__requeriment-list">
    <div data-testid="plan-edition-header-requeriment" *ngFor="let requeriment of requeriments" class="plan-edition-header__requeriment">
      <div data-testid="plan-edition-header-icon" class="plan-edition-header__icon">
        <ng-container
          *ngTemplateOutlet="
            layeredIcon;
            context: {
              iconDefinitions: getIconAsLayered(requeriment.icon),
            }
          "
        >
        </ng-container>
      </div>
      <div [innerHTML]="requeriment.text"></div>
    </div>
  </div>
</div>

<ng-template #layeredIcon let-iconDefinitions="iconDefinitions">
  <fa-layers [fixedWidth]="true">
    <fa-icon *ngFor="let icon of iconDefinitions" [icon]="icon"></fa-icon>
  </fa-layers>
</ng-template>
