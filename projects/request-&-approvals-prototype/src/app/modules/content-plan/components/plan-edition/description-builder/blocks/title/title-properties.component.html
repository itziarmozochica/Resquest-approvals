@let b = block();
<div class="prop">
  <label class="prop-label">{{ 'planEdition.contentEdition.builder.blocks.title.headingLevel' | translate }}</label>
  <div class="prop-segment">
    @for (level of ['h1', 'h2', 'h3']; track level) {
      <button type="button" [class.active]="b.props.level === level" [disabled]="disabled()" (click)="set('level', level)">
        {{ level.toUpperCase() }}
      </button>
    }
  </div>
</div>
<div class="prop" [class.prop--missing]="isMissing('text')">
  <app-db-prop-label [contract]="FIELDS" field="text" />
  <input
    type="text"
    [placeholder]="'planEdition.contentEdition.builder.blocks.title.textPlaceholder' | translate"
    [value]="b.props.text"
    [disabled]="disabled()"
    [attr.aria-invalid]="isMissing('text') ? true : null"
    (input)="set('text', $any($event.target).value)"
  />
</div>
