<div class="plan-terms-and-conditions-edit">
  @if (state() === 'loading') {
    <p class="plan-terms-and-conditions-edit__loading" data-testid="terms-and-conditions-loading">
      {{ 'common.loading' | translate }}
    </p>
  }

  @if (state() === 'error') {
    <div class="plan-terms-and-conditions-edit__error" data-testid="terms-and-conditions-error">
      <p>{{ 'errors.generic' | translate }}</p>
      <button class="button button--secondary" type="button" (click)="retry()">
        {{ 'common.retry' | translate }}
      </button>
    </div>
  }

  @if (state() === 'ok') {
    <app-plan-terms-and-conditions-edition
      [htmlContent]="htmlContent()"
      [planId]="planId()"
      (htmlContentChange)="onHtmlContentChange($event)"
    ></app-plan-terms-and-conditions-edition>

    <div class="plan-terms-and-conditions-edit__footer">
      <button igntButton type="button" data-testid="plan-terms-and-conditions-edit-publish" [disabled]="!canSave()" (click)="publish()">
        {{ 'planEdition.contentEdition.publishChanges' | translate }}
      </button>
    </div>
  }
</div>
