<!-- The ng-container (zero DOM) keeps the root close-tag indented: Angular's
     whitespace collapse leaves SINGLE-char runs untouched, so a column-0 close
     tag would ship a literal "\n" into the export instead of the historical " ". -->
<ng-container>
  <div class="block-image-grid">
    @for (item of gridItems(); track item.id) {
      <div class="block-image-grid-card">
        <div class="block-image block-image-grid-thumb">
          @if (item.src) {
            <img [src]="item.src" alt="" />
          } @else {
            <div class="placeholder">
              <span class="ms material-symbols-outlined">image</span>
            </div>
          }
        </div>
        <div class="block-image-grid-title" [class.block-text-placeholder]="showPlaceholders() && !item.title">
          {{ item.title || placeholderFor(KEYS.titleFieldPlaceholder) }}
        </div>
        @if (showPlaceholders() && !hasRichText(item.body)) {
          <div class="block-image-grid-body block-text-placeholder">{{ placeholderFor(SHARED_KEYS.bodyPlaceholder) }}</div>
        } @else {
          <div class="block-image-grid-body" [innerHTML]="item.body"></div>
        }
      </div>
    }
  </div>
</ng-container>
