<!-- The ng-container (zero DOM) keeps the root close-tag indented: Angular's
     whitespace collapse leaves SINGLE-char runs untouched, so a column-0 close
     tag would ship a literal "\n" instead of the historical " ". -->
<ng-container>
  @let b = block();
  <div class="spacer-inner" [style.height.px]="b.props.size">
    <div class="spacer-label">
      <span class="ms material-symbols-outlined" style="font-size: 13px !important">height</span>
      {{ b.props.size }}px
    </div>
  </div>
</ng-container>
