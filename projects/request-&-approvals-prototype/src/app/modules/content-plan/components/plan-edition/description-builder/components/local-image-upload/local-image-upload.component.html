<div class="prop-local-image">
  <input #fileInput type="file" [attr.accept]="acceptAttr()" class="prop-local-image-input" tabindex="-1" (change)="onFileChange($event)" />

  @if (uploading()) {
    <div class="prop-local-image-loading" role="status" aria-live="polite">
      <span class="ms material-symbols-outlined" aria-hidden="true">progress_activity</span>
      <span>{{ uploadingKey() | translate }}</span>
    </div>
  } @else if (previewUrl()) {
    <div
      class="prop-local-image-preview-card"
      [class.prop-drop-zone--active]="dragOver()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <div class="prop-local-image-thumb" [class.prop-local-image-thumb--video]="mediaKind() === 'video'">
        @if (mediaKind() === 'video') {
          <video [src]="previewUrl()" autoplay muted loop playsinline controls></video>
        } @else {
          <img [src]="previewUrl()" alt="" />
        }
        <button
          type="button"
          class="prop-local-image-remove"
          [attr.aria-label]="clearKey() | translate"
          [disabled]="disabled()"
          (click)="clearImage($event)"
        >
          <span class="ms material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="prop-local-image-preview-actions">
        <button
          igntButton
          sentiment="tertiary"
          size="small"
          type="button"
          [disabled]="disabled()"
          (click)="triggerInput(fileInput, $event)"
        >
          {{ replaceKey() | translate }}
        </button>
        <span class="prop-local-image-preview-hint">{{ replaceHintKey() | translate }}</span>
      </div>
    </div>
  } @else {
    <button
      type="button"
      class="prop-drop-zone"
      [class.prop-drop-zone--active]="dragOver()"
      [attr.aria-label]="dropAriaKey() | translate"
      [disabled]="disabled()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      (click)="triggerInput(fileInput, $event)"
    >
      <span class="ms material-symbols-outlined prop-drop-zone-icon" aria-hidden="true">cloud_upload</span>
      <span class="prop-drop-zone-text">{{ dropHereKey() | translate }}</span>
    </button>
  }
</div>
