<div class="header plan-header-card">
  <app-plan-header-summary
    [hasUnsavedChanges]="hasUnsavedChanges"
    [imageUrl]="image || null"
    [name]="name"
    [partnerId]="canCreateEvents && partnerId ? partnerId : null"
    [planId]="canCreateEvents && mainPlanId ? mainPlanId : null"
    [showPreviewLinks]="canCreateEvents && !!mainPlanId && !!partnerId"
    [venue]="venue || null"
  ></app-plan-header-summary>

  @if (!canCreateEvents && !isDraft && hasThemedUrl) {
    <div class="preview-dropdown">
      <ignt-button
        data-testid="plan-edition-preview-button"
        size="large"
        variant="secondary"
        [ariaExpanded]="isPreviewDropdownOpen"
        [disabled]="!link"
        [fill]="isMobile()"
        [label]="'planEdition.preview' | translate"
        [leadingIcon]="externalLinkIcon"
        [trailingIcon]="isPreviewDropdownOpen ? chevronUpIcon : chevronDownIcon"
        (click)="togglePreviewDropdown()"
      />

      <ul class="preview-menu" data-testid="preview-dropdown" [class.show]="isPreviewDropdownOpen">
        <li>
          <a href="#" (click)="onPreviewEventOnFever($event)" class="preview-option" data-testid="preview-event-on-fever-option">
            {{ 'planEdition.myEventOnFever' | translate }}
          </a>
        </li>
        <li>
          <a href="#" (click)="onPreviewBrandedEvent($event)" class="preview-option" data-testid="preview-branded-event-option">
            {{ 'planEdition.myBrandedEvent' | translate }}
          </a>
        </li>
        <li>
          <a
            href="#"
            (click)="onPreviewPurchaseConfirmationEmail($event)"
            class="preview-option"
            data-testid="preview-purchase-confirmation-option"
          >
            {{ 'planEdition.purchaseConfirmationEmail' | translate }}
          </a>
        </li>
      </ul>
    </div>
  }

  @if (!canCreateEvents && (isDraft || !hasThemedUrl)) {
    <div class="see-on-fever">
      <ignt-button
        data-testid="plan-edition-see-on-fever"
        size="large"
        variant="secondary"
        [disabled]="!link"
        [fill]="isMobile()"
        [label]="(isDraft ? 'planEdition.seeItOnFeverWithPasswordButton' : 'planEdition.seeItOnFeverButton') | translate"
        [leadingIcon]="externalLinkIcon"
        (click)="seePlanOnFever()"
      />
      @if (isDraft) {
        <ignt-icon
          class="see-on-fever__help"
          name="question-circle"
          tabindex="0"
          variant="light"
          igntTooltip
          [attr.aria-label]="'planEdition.seeItOnFeverWithPasswordTooltip' | translate"
          [tooltipLabel]="'planEdition.seeItOnFeverWithPasswordTooltip' | translate"
        />
      }
    </div>
  }
</div>

<ng-template #loadingTemplate>
  <div data-testid="plan-header-card-spinner" class="spinner">
    <fa-icon class="loader" [icon]="['fas', 'spinner']" [size]="'4x'"></fa-icon>
  </div>
</ng-template>
