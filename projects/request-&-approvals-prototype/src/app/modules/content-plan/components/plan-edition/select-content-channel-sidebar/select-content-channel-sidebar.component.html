<div class="select-content-channel-sidebar">
  <div class="select-content-channel-sidebar__search">
    <ignt-input-field
      class="select-content-channel-sidebar__search-field"
      data-testid="select-content-channel-sidebar-search"
      type="text"
      [label]="''"
      [hideErrorLabels]="true"
      [leadIcon]="['far', 'search']"
      [placeholder]="'planEdition.translationsEdition.filterChannels' | translate"
      [placeholderAsEmptyValue]="true"
      [attr.aria-label]="'planEdition.translationsEdition.filterChannels' | translate"
      [ngModel]="searchTerm()"
      (ngModelChange)="onSearchChange($event)"
    />
  </div>
  <ul class="select-content-channel-sidebar__list">
    @for (channel of filteredChannels(); track channel.id) {
      <li class="select-content-channel-sidebar__item">
        <ignt-list-item
          data-testid="select-content-channel-sidebar-channel"
          [attr.data-channel-id]="channel.id"
          [title]="channel.name"
          [description]="''"
          [clickable]="true"
          [selected]="selectedInMemory().has(channel.id)"
          (click)="toggleChannel(channel.id)"
        >
          @if (channelsWithTranslations().has(channel.id)) {
            <ignt-icon
              trailing-modifier
              class="select-content-channel-sidebar__status--ok"
              name="check-circle"
              variant="solid"
              aria-hidden="true"
            ></ignt-icon>
          } @else {
            <ignt-icon
              trailing-modifier
              class="select-content-channel-sidebar__status--missing"
              name="exclamation-triangle"
              variant="solid"
              aria-hidden="true"
            ></ignt-icon>
          }
        </ignt-list-item>
      </li>
    }
  </ul>
  <div class="select-content-channel-sidebar__actions">
    <ignt-button
      variant="primary"
      htmlType="button"
      class="select-content-channel-sidebar__save"
      data-testid="select-content-channel-sidebar-save"
      [label]="'planEdition.translationsEdition.save' | translate"
      [disabled]="!hasChanges()"
      (click)="onSave()"
    ></ignt-button>
    <ignt-button
      variant="secondary"
      htmlType="button"
      data-testid="select-content-channel-sidebar-cancel"
      [label]="'planEdition.translationsEdition.cancel' | translate"
      (click)="onCancel()"
    ></ignt-button>
  </div>
</div>
