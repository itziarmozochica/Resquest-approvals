@let b = block();
<div class="prop" [class.prop--missing]="isMissing('text')">
  <app-db-prop-label [contract]="FIELDS" field="text" />
  <app-db-expandable-rich-text-editor
    class="prop-rich-text"
    data-testid="paragraph-text"
    [labelKey]="'planEdition.contentEdition.builder.blocks.paragraph.editText'"
    [content]="b.props.text"
    [disabled]="disabled()"
    (contentChange)="setText($event)"
  ></app-db-expandable-rich-text-editor>
</div>
