<div class="bl-support">
  <div class="bl-support-content">
    <div class="bl-support-row">
      <div class="bl-support-form">
        <form class="co-support-form" [formGroup]="supportForm" (ngSubmit)="submitSupportForm()">
          <p class="el-support-text" translate>supportForm.messageInfo</p>
          <div class="el-group-input">
            <ignt-alert *ngIf="error" sentiment="danger" [description]="'supportForm.errorSendingEmail' | translate" />
          </div>
          <div class="el-group-input">
            <input class="el-input" formControlName="email" name="email" [placeholder]="'supportForm.emailInput' | translate" />
          </div>
          <div class="el-group-input">
            <textarea
              class="el-textarea"
              formControlName="comments"
              name="comments"
              [placeholder]="'supportForm.commentsInput' | translate"
            ></textarea>
          </div>
          <div class="el-group-input" *ngIf="!success">
            <button class="el-submit" type="submit" [disabled]="!supportForm.valid" translate>supportForm.sendForm</button>
          </div>
          <div class="el-group-input">
            <ignt-alert *ngIf="success" sentiment="positive" [description]="'supportForm.emailSentSuccessfully' | translate" />
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
