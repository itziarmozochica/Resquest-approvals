<div id="main-content">
  <div class="main-wrapper">
    <ignt-wrapper-card class="content-wrapper-card">
      <form *ngIf="!success" [formGroup]="supportForm" (ngSubmit)="submitSupportForm()">
        <div>
          <h2 class="font-h2" translate>{{ 'businessSupportForm.title' }}</h2>
          <p class="font-small-regular business-contact__subtitle" translate>{{ 'businessSupportForm.subtitle' }}</p>
          <ignt-alert *ngIf="error" sentiment="danger" [description]="'businessSupportForm.errorSendingEmail' | translate" />
          <div class="form_stack">
            <ignt-input-field
              formControlName="email"
              [label]="'businessSupportForm.email' | translate"
              [helperText]="'businessSupportForm.emailHelp' | translate"
              [customFormErrors]="[
                {
                  type: 'required',
                  message: 'businessSupportForm.emailRequired' | translate,
                },
                {
                  type: 'email',
                  message: 'businessSupportForm.emailInvalid' | translate,
                },
              ]"
            ></ignt-input-field>
            <div class="form-group business-contact__textarea">
              <ignt-textarea-field
                formControlName="comments"
                id="comments"
                [label]="'businessSupportForm.message' | translate"
                [placeholder]="'businessSupportForm.message' | translate"
                [helperText]="'businessSupportForm.messageHelp' | translate"
                [customFormErrors]="[
                  {
                    type: 'required',
                    message: 'businessSupportForm.messageRequired' | translate,
                  },
                ]"
              ></ignt-textarea-field>
            </div>
          </div>
        </div>
        <div>
          <h4 class="font-h4" translate>{{ 'businessSupportForm.optionalTitle' }}</h4>
          <p class="font-small-regular business-contact__subtitle" translate>{{ 'businessSupportForm.optionalSubtitle' }}</p>
          <div class="form_stack">
            <ignt-input-field formControlName="planName" [label]="'businessSupportForm.event' | translate"></ignt-input-field>
            <ignt-input-field formControlName="reservationId" [label]="'businessSupportForm.reservationId' | translate"></ignt-input-field>
          </div>
        </div>

        <div class="business-contact__submit">
          <button igntButton type="submit" translate [loading]="sending" [disabled]="sending">businessSupportForm.send</button>
        </div>
      </form>
      <div *ngIf="success" class="business-contact__success">
        <h2 class="font-h2 business-contact__success-title" translate>
          <fa-icon [icon]="['fas', 'check-circle']" class="business-contact__success-icon"></fa-icon>
          {{ 'businessSupportForm.successTitle' }}
        </h2>
        <p class="font-small-regular" translate>{{ 'businessSupportForm.successMessage' }}</p>
      </div>
    </ignt-wrapper-card>
  </div>
</div>
