<div class="order-responses">
  @if (view(); as view) {
    <ignt-breadcrumb [items]="breadcrumbItems()" />

    <h1 class="order-responses__title">{{ 'orderResponses.title' | translate }}</h1>

    @if (summary(); as summary) {
      <app-order-responses-summary [summary]="summary" [answeredCount]="view.answeredCount" [questionCount]="view.questionCount" />
    }

    @for (section of view.sections; track section.when) {
      <app-order-responses-section
        [section]="section"
        [anchorTickets]="section.when === anchorWhen()"
        [editable]="canEdit()"
        [editing]="isEditing(section)"
        [editDisabled]="editingWhen() !== null || saving()"
        [controls]="controls()"
        (edit)="onEdit(section)"
      />
    }

    @if (editingWhen() !== null) {
      <app-actions-bar
        [showSaveDraftButton]="false"
        [showBackButton]="true"
        backTranslationKey="orderResponses.actions.cancel"
        backButtonTestId="order-responses-cancel"
        continueButtonTranslationKey="orderResponses.actions.save"
        continueButtonTestId="order-responses-save"
        [continueButtonDisabled]="!canSave()"
        [continueButtonLoading]="saving()"
        (back)="onCancel()"
        (continue)="onSave()"
      />
    }
  } @else {
    <ignt-skeleton type="paragraph" [numElements]="8" animation />
  }
</div>
