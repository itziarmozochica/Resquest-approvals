<app-modal-content [title]="''" [hasCloseButton]="false">
  <div class="modal-body modal__content third-party-api-key-modal">
    <div class="modal__title" data-testid="modal-title">
      {{ 'userManagement.thirdPartyApiKey.title' | translate }}
    </div>

    <div class="messages messages--custom-style">
      <div class="messages__row">
        <p class="messages__text" data-testid="third-party-api-key-description">
          {{ 'userManagement.thirdPartyApiKey.description' | translate }}
        </p>
      </div>
    </div>

    <div class="third-party-api-key-modal__warning" role="alert" data-testid="third-party-api-key-warning">
      <ignt-icon name="triangle-exclamation" variant="regular" [fixedWidth]="true"></ignt-icon>
      <span>{{ 'userManagement.thirdPartyApiKey.oneTimeWarning' | translate }}</span>
    </div>

    <div class="third-party-api-key-modal__field">
      <label class="third-party-api-key-modal__label" for="third-party-api-key-value">
        {{ 'userManagement.thirdPartyApiKey.apiKeyLabel' | translate }}
      </label>
      <div class="third-party-api-key-modal__input-group">
        <input
          id="third-party-api-key-value"
          class="third-party-api-key-modal__value"
          type="text"
          [value]="apiKey()"
          readonly
          data-testid="third-party-api-key-value"
        />
        <button
          type="button"
          class="third-party-api-key-modal__copy-button"
          ngxClipboard
          [cbContent]="apiKey()"
          (cbOnSuccess)="onCopySuccess()"
          [attr.aria-label]="'userManagement.thirdPartyApiKey.copyAriaLabel' | translate"
          data-testid="third-party-api-key-copy"
        >
          @if (showCopyFeedback) {
            <ignt-icon name="check" variant="regular" [fixedWidth]="true"></ignt-icon>
          } @else {
            <ignt-icon name="clipboard" variant="regular" [fixedWidth]="true"></ignt-icon>
          }
        </button>
      </div>
      @if (showCopyFeedback) {
        <span class="third-party-api-key-modal__feedback" role="status" data-testid="third-party-api-key-copied">
          {{ 'userManagement.thirdPartyApiKey.copiedFeedback' | translate }}
        </span>
      }
    </div>

    <div class="modal__actions third-party-api-key-modal__actions">
      <button igntButton [fill]="true" sentiment="secondary" (click)="onDownloadProperties()" data-testid="third-party-api-key-download">
        {{ 'kioskManagement.add.download' | translate }}
      </button>
      <button igntButton [fill]="true" (click)="confirm()" data-testid="third-party-api-key-confirm">
        {{ 'common.ok' | translate }}
      </button>
    </div>
  </div>
</app-modal-content>
