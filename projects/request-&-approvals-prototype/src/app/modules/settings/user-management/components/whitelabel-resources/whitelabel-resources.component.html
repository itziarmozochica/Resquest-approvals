@if (resources().length > 0) {
  <div class="user-resources">
    <div class="table__row-actions" data-testid="user-management-whitelabel-resources">
      <div class="item__big-columns">
        <strong><span translate>userManagement.whitelabels</span></strong>
        <ul class="item__resources-list">
          @for (resource of resources(); track resource; let i = $index) {
            @if (canShowItem(i)) {
              <li class="item__small-row" data-testid="user-management-resources-whitelabel">{{ resource }}</li>
            }
          }
        </ul>
      </div>
      @if (resources().length > 3) {
        <div class="item__small-columns" (click)="updateShowMore()" data-testid="user-management-resources-show-more-whitelabels">
          <div class="user-resources__overlay">
            <ignt-icon
              [name]="showMore() ? 'minus' : 'plus'"
              variant="light"
              [fixedWidth]="true"
              class="el-icon-my-events-options"
              size="base"
            ></ignt-icon>
          </div>
        </div>
      }
    </div>
  </div>
}
