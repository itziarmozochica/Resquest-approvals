<div class="form-group">
  <div class="form-group__fields form-group__fields--one user-management__nfc-container">
    <div class="user-management__nfc-header user-management__nfc-header--inline">
      <h4 class="user-management__nfc-header-label font-h4">{{ 'userManagement.alternativeLoginMethod' | translate }}</h4>
      <ignt-button
        variant="tertiary"
        [leadingIcon]="{ name: 'plus', variant: 'light' }"
        [label]="'userManagement.addNfcIdentificationCard' | translate"
        (click)="openNfcPinRegistrationModal()"
        data-testid="open-nfc-pin-registration-modal-button"
        class="user-management__add-nfc-button"
      ></ignt-button>
    </div>
    @if (nfcCards().length > 0) {
      <div class="user-management__nfc-cards">
        @for (card of nfcCards(); track card.nfc_uid) {
          <div class="user-management__nfc-card">
            <div class="user-management__nfc-card-info">
              <span class="user-management__nfc-card-name">{{ organizationUser().name }}'s card</span>
              @if (card.status === nfcPinStatus.Pending) {
                <ignt-tag sentiment="warning" variant="outline" data-testid="nfc-card-pending-tag">
                  {{ 'userManagement.nfcPinPending' | translate }}
                </ignt-tag>
              }
            </div>
            <div class="user-management__nfc-card-actions">
              <button
                class="user-management__nfc-card-action"
                data-testid="delete-nfc-card-button"
                (click)="deleteNfcCard(card)"
                [attr.aria-label]="'common.delete' | translate"
              >
                <ignt-icon name="trash" variant="solid" size="base"></ignt-icon>
              </button>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
