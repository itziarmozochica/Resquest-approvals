<div class="delete-nfc-card-confirmation-modal">
  <div class="delete-nfc-card-confirmation-modal__header">
    <h5 class="delete-nfc-card-confirmation-modal__title">
      {{ 'userManagement.removeNfcCard.title' | translate }}
    </h5>
  </div>

  <div class="delete-nfc-card-confirmation-modal__content">
    <div class="delete-nfc-card-confirmation-modal__icon">
      <ignt-icon name="times" variant="solid" class="delete-nfc-card-confirmation-modal__icon-symbol" size="base"></ignt-icon>
    </div>
    <p class="delete-nfc-card-confirmation-modal__message">
      {{ 'userManagement.removeNfcCard.message' | translate }}
    </p>
    <p class="delete-nfc-card-confirmation-modal__sub-message">
      {{ 'userManagement.removeNfcCard.subMessage' | translate }}
    </p>
  </div>

  <div class="delete-nfc-card-confirmation-modal__actions">
    <button igntButton sentiment="secondary" (click)="onCancel()" data-testid="delete-nfc-card-cancel-button">
      {{ 'userManagement.removeNfcCard.cancelButton' | translate }}
    </button>
    <button igntButton variant="danger" sentiment="primary" (click)="onConfirm()" data-testid="delete-nfc-card-confirm-button">
      {{ 'userManagement.removeNfcCard.confirmButton' | translate }}
    </button>
  </div>
</div>
