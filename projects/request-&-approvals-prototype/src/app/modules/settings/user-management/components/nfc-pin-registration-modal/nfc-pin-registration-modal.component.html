<div class="nfc-pin-registration-modal-wrapper">
  <div class="nfc-pin-registration-modal-header">
    <h5 class="nfc-pin-registration-modal-header__title" data-testid="nfc-pin-registration-modal-title">{{ titleKey | translate }}</h5>
  </div>
  <div class="nfc-pin-registration-modal">
    <app-nfc-pin-registration
      [pinSetBy]="pinSetBy"
      [userEmail]="userEmail"
      [userId]="userId"
      (registrationSuccess)="onRegistrationSuccess()"
      (registrationCanceled)="onCancel()"
    ></app-nfc-pin-registration>
  </div>
</div>
