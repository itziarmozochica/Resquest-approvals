<div class="user-resources">
  <div *ngIf="resourceAccessType == 'all-resources'">
    <strong><span data-testid="user-management-resources" translate>userManagement.fullAccess</span></strong>
  </div>
  <div class="table__row-actions" *ngIf="resourceAccessType == 'specific-plan'">
    <div class="item__big-columns" *ngIf="resourcesMap != undefined; else simpleResourcePlan">
      <strong><span data-testid="user-management-resources" translate>userManagement.events</span></strong>
      <div *ngFor="let resourceKey of resourcesMapKeys" class="item__small-row">
        <div *ngIf="resourcesMap.get(resourceKey).length > 0">
          <br />
          <span data-testid="user-management-resources-city">{{ resourceKey.toUpperCase() }}</span>
          <div *ngFor="let resource of resourcesMap.get(resourceKey)">
            <li data-testid="user-management-resources-plan">{{ resource }}</li>
          </div>
        </div>
      </div>
    </div>
    <ng-template #simpleResourcePlan>
      <div class="item__big-columns">
        <strong><span data-testid="user-management-resources" translate>userManagement.events</span></strong>
        <div *ngFor="let resource of resources; let i = index" class="item__small-row">
          <li *ngIf="canShowItem(i)" data-testid="user-management-resources-plan">{{ resource }}</li>
        </div>
      </div>
      <div
        class="item__small-columns"
        *ngIf="resources?.length > 3"
        (click)="updateShowMore()"
        data-testid="user-management-resources-show-more-plans"
      >
        <div class="user-resources__overlay">
          <ignt-icon
            [name]="showMore ? 'minus' : 'plus'"
            variant="light"
            [fixedWidth]="true"
            class="el-icon-my-events-options"
            size="base"
          ></ignt-icon>
        </div>
      </div>
    </ng-template>
  </div>
  <div class="table__row-actions" data-testid="user-management-resources" *ngIf="resourceAccessType == 'specific-venue'">
    <div class="item__big-columns" *ngIf="resourcesMap != undefined; else simpleResourcePlace">
      <strong><span data-testid="user-management-resources" translate>userManagement.venues</span></strong>
      <div *ngFor="let resourceKey of resourcesMapKeys" class="item__small-row">
        <div *ngIf="resourcesMap.get(resourceKey).length > 0">
          <br />
          <span data-testid="user-management-resources-city">{{ resourceKey.toUpperCase() }}</span>
          <div *ngFor="let resource of resourcesMap.get(resourceKey)">
            <li data-testid="user-management-resources-place">{{ resource }}</li>
          </div>
        </div>
      </div>
    </div>
    <ng-template #simpleResourcePlace>
      <div class="item__big-columns">
        <strong><span data-testid="user-management-resources" translate>userManagement.venues</span></strong>
        <div *ngFor="let resource of resources; let i = index" class="item__small-row">
          <li *ngIf="canShowItem(i)" data-testid="user-management-resources-place">{{ resource }}</li>
        </div>
      </div>
      <div
        class="item__small-columns"
        *ngIf="resources?.length > 3"
        (click)="updateShowMore()"
        data-testid="user-management-resources-show-more-places"
      >
        <div class="user-resources__overlay">
          <ignt-icon
            [name]="showMore ? 'minus' : 'plus'"
            variant="light"
            [fixedWidth]="true"
            class="el-icon-my-events-options"
            size="base"
          ></ignt-icon>
        </div>
      </div>
    </ng-template>
  </div>
</div>
