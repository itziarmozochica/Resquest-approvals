<div class="distributor-balances" data-testid="distributor-balances">
  <p class="form-label form-label--no-margin">{{ 'businessManagement.balances.title' | translate }}</p>
  <div class="helper-paragraph helper-paragraph--balance">
    {{ 'businessManagement.balances.description' | translate }}
  </div>

  @if (store.error()) {
    <div class="distributor-balances__error" role="alert" data-testid="distributor-balances-error">
      <span class="distributor-balances__error-text">
        <ignt-icon class="distributor-balances__error-icon" name="exclamation-triangle" variant="light" aria-hidden="true" />
        {{ 'errors.generic' | translate }}
      </span>
      <ignt-button data-testid="distributor-balances-retry" variant="secondary" [label]="'common.retry' | translate" (click)="onRetry()" />
    </div>
  }

  @if (isTableVisible()) {
    <app-distributor-balances-table
      [partners]="store.pagePartners()"
      [count]="store.count()"
      [isLoading]="store.isLoading()"
      [itemsPerPage]="store.itemsPerPage()"
      [pageIndex]="store.pageIndex()"
      (pageChange)="onPageChange($event)"
    />
  } @else if (isEmpty()) {
    <p class="distributor-balances__empty" data-testid="distributor-balances-empty">
      {{ 'businessManagement.balances.empty' | translate }}
    </p>
  }
</div>
