<div class="common-session-edit lateral-slider-body__wrapper">
  <form [formGroup]="formGroup" class="common-session-edit__form organization-transport-providers-link-form">
    <fieldset class="organization-transport-providers-link-form__wrapper">
      <ng-container
        *ngTemplateOutlet="
          transportProviderDropdownTemplate;
          context: {
            fieldOptions: transportProviderOptions,
            selected: transportProvider,
            disabled: transportProviderOptions.length === 0,
            showNoOptionsMessage: transportProviderOptions.length === 0,
          }
        "
      ></ng-container>

      <div class="organization-transport-providers-link-form__cell organization-transport-providers-link-form__cell--external-organizer-id">
        <ignt-input-field
          formControlName="externalOrganizerId"
          id="organization-transport-providers-external-organizer-id"
          type="text"
          [label]="('organizationTransportProviders.form.fields.externalOrganizerId.title' | translate) + '*'"
          [placeholder]="'organizationTransportProviders.form.fields.externalOrganizerId.placeholder' | translate"
        ></ignt-input-field>
      </div>
    </fieldset>

    <ng-template
      #transportProviderDropdownTemplate
      let-disabled="disabled"
      let-fieldOptions="fieldOptions"
      let-selected="selected"
      let-showNoOptionsMessage="showNoOptionsMessage"
    >
      <div class="organization-transport-providers-link-form__cell">
        <ignt-typeahead
          (selected)="formGroup.get('transportProvider')?.setValue($event)"
          [customPopupClass]="'dropdown-menu--on-sidebar'"
          [disabled]="disabled"
          [editable]="false"
          [emptyLabel]="'organizationTransportProviders.form.fields.transportProvider.placeholder' | translate"
          [fieldLabel]="'organizationTransportProviders.form.fields.transportProvider.title' | translate"
          [options]="fieldOptions"
          [selectedOption]="selected"
        ></ignt-typeahead>
        <ng-container>
          <div class="organization-transport-providers-link-form__note">
            {{ 'organizationTransportProviders.form.messages.description' | translate }}
          </div>
          @if (showNoOptionsMessage) {
            <div class="form-error">
              <ignt-icon aria-hidden="true" class="form-error--icon" name="exclamation-circle" variant="solid"></ignt-icon>
              <span class="form-error--message">
                {{ 'organizationTransportProviders.form.messages.noTransportProviders' | translate }}
              </span>
            </div>
          }
        </ng-container>
      </div>
    </ng-template>
  </form>
</div>

<div class="lateral-slider-body__footer">
  <button
    igntButton
    class="organization-transport-providers-link-form__footer-button"
    data-testid="organization-transport-providers-link-form-save"
    [disabled]="isSaveButtonDisabled() || saveInProgress"
    (click)="save()"
  >
    {{ 'common.save' | translate }}
  </button>
  <button
    igntButton
    class="organization-transport-providers-link-form__footer-button"
    data-testid="organization-transport-providers-link-form-cancel"
    sentiment="tertiary"
    (click)="cancel()"
  >
    {{ 'common.cancel' | translate }}
  </button>
</div>
