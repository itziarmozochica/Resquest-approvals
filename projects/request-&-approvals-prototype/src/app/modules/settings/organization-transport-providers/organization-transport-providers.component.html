<app-page-title [title]="'menu.settings' | translate" class="new-design"></app-page-title>

<div class="organization-transport-providers-page">
  <div class="organization-transport-providers-page__container">
    <div class="organization-transport-providers-page__card">
      <div class="organization-transport-providers__view-header">
        <div class="organization-transport-providers__view-header-left-side">
          <h3 class="organization-transport-providers__title" translate>organizationTransportProviders.title</h3>
          <p class="organization-transport-providers__description">
            {{ 'organizationTransportProviders.description' | translate }}
          </p>
        </div>

        <div class="organization-transport-providers__view-header-right-side">
          <div class="organization-transport-providers__action-button-wrapper">
            <button
              igntButton
              [disabled]="isAddButtonDisabled() || isLoadingTransportProviders()"
              [size]="'large'"
              data-testid="organization-transport-providers-add-button"
              sentiment="primary"
              type="button"
              (click)="openLinkTransportProviderToOrganizationForm()"
            >
              {{ 'organizationTransportProviders.actions.addLink' | translate }}
            </button>
          </div>
        </div>
      </div>

      <app-unpaginated-table-container
        data-testid="organization-transport-providers-unpaginated-table"
        (searchResults)="onTransportProviderResults($event)"
        [checkHasMandatoryFilters]="checkHasMandatoryFilters"
        [checkIsEmpty]="checkIsEmpty"
        [errorMessage]="'organizationTransportProviders.errors.loadFailed' | translate"
        [filters]="filtersForTable()"
        [noFiltersIcon]="['far', 'sort-alt']"
        [noFiltersMessage]="'organizationTransportProviders.errors.missingPartner' | translate"
        [noResultIcon]="['far', 'receipt']"
        [noResultMessage]="'organizationTransportProviders.empty' | translate"
        [request]="loadPartnerTransportProviders"
      >
        <div class="organization-transport-providers__table-wrapper">
          <app-organization-transport-providers-table
            data-testid="organization-transport-providers-table-component"
            [organizationTransportProviders]="organizationTransportProviders()"
          />
        </div>
      </app-unpaginated-table-container>
    </div>
  </div>
</div>

<app-lateral-slider
  [contentTemplate]="linkTransportProviderToOrganizationFormTemplate"
  [showDetails]="displayLinkTransportProviderToOrganizationForm()"
  [title]="'organizationTransportProviders.form.sliderTitle' | translate"
  (closeSlider)="closeLinkTransportProviderToOrganizationForm()"
>
</app-lateral-slider>

<ng-template #linkTransportProviderToOrganizationFormTemplate>
  @if (displayLinkTransportProviderToOrganizationForm()) {
    <app-organization-transport-providers-link-form
      [saveInProgress]="isFormSaving()"
      [transportProviderOptions]="transportProviderSelectOptions()"
      (formChanges)="processLinkTransportProviderToOrganizationFormChanges($event)"
    />
  }
</ng-template>
