<th class="organization-transport-providers-table__header-cell">
  <ng-container
    *ngTemplateOutlet="
      dataCellTemplate;
      context: {
        titleKey: 'organizationTransportProviders.columnNames.transportProvider.name',
        tooltipKey: 'organizationTransportProviders.columnNames.transportProvider.tooltip',
      }
    "
  ></ng-container>
</th>
<th class="organization-transport-providers-table__header-cell">
  <ng-container
    *ngTemplateOutlet="
      dataCellTemplate;
      context: {
        titleKey: 'organizationTransportProviders.columnNames.externalOrganizer.name',
        tooltipKey: 'organizationTransportProviders.columnNames.externalOrganizer.tooltip',
      }
    "
  ></ng-container>
</th>

<ng-template #dataCellTemplate let-titleKey="titleKey" let-tooltipKey="tooltipKey">
  <span>
    {{ titleKey | translate }}
    <span igntTooltip [tooltipLabel]="tooltipKey | translate">
      <ignt-icon aria-hidden="true" name="info-circle" variant="regular" />
    </span>
  </span>
</ng-template>
