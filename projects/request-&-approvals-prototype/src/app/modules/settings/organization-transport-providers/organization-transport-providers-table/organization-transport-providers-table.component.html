<table class="organization-transport-providers-table" data-testid="organization-transport-providers-table">
  <thead>
    <tr
      appOrganizationTransportProvidersTableHeader
      class="organization-transport-providers-table__header"
      data-testid="organization-transport-providers-table-header"
    ></tr>
  </thead>

  <tbody>
    @for (organizationTransportProvider of organizationTransportProviders(); track organizationTransportProvider.id) {
      <tr
        appOrganizationTransportProvidersTableRow
        class="organization-transport-providers-table__row"
        [class.organization-transport-providers-table__row--first]="$first"
        [attr.data-testid]="'organization-transport-providers-table-row-' + organizationTransportProvider.id"
        [organizationTransportProvider]="organizationTransportProvider"
      ></tr>
    }
  </tbody>
</table>
