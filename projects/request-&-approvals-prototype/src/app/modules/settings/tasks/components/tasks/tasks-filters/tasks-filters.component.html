<form [formGroup]="formGroup" class="tasks-filters">
  <div class="tasks-filters__inputs">
    <ignt-input-field
      class="tasks-filters__search-term"
      [label]="'tasks.taskFilters.searchTerm' | translate"
      [placeholder]="'tasks.taskFilters.searchTerm' | translate"
      data-testid="tasks-filters-search-term"
      formControlName="search"
      type="text"
    ></ignt-input-field>
    <div class="tasks-filters__date-range-container">
      <app-date-range-form-group
        [startDateLabel]="'tasks.taskFilters.createdAtFrom' | translate"
        [endDateLabel]="'tasks.taskFilters.createdAtTo' | translate"
        (formGroupCreated)="onDateRangeFormCreated($event)"
        [displayTimePicker]="true"
        class="tasks-filters__date-range"
        data-testid="tasks-filters-date-range"
      ></app-date-range-form-group>
    </div>
  </div>
  <button
    *ngIf="formGroup.controls?.filterInProgressTasks as control"
    igntButton
    sentiment="secondary"
    size="small"
    (click)="control.setValue(!control.value)"
    data-testid="tasks-filters-toggle-finished-tasks"
    class="tasks-filters__toggle-finished-tasks"
  >
    {{ control.value ? ('tasks.taskFilters.seeAllTasks' | translate) : ('tasks.taskFilters.notFinishedTasks' | translate) }}
  </button>
</form>
