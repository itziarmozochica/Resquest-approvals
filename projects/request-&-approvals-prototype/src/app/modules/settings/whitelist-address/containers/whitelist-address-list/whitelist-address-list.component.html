<div class="whitelist-address-list">
  <app-page-title
    [section]="'menu.settings' | translate"
    [subsections]="[{ title: 'menu.devPortal' | translate }]"
    [title]="'whitelistAddress.title' | translate"
  ></app-page-title>

  <div class="main-wrapper">
    <ignt-wrapper-card [elevation]="1">
      <div class="whitelist-address-list__content">
        <div class="whitelist-address-list__header">
          <button
            igntButton
            sentiment="primary"
            data-testid="whitelist-address-add-button"
            (click)="openAddWhitelistAddressModal()"
            [disabled]="isLoading()"
            [title]="'whitelistAddress.addWhitelistAddress' | translate"
          >
            {{ 'whitelistAddress.addWhitelistAddress' | translate }}
          </button>
        </div>

        <ignt-table
          data-testid="whitelist-address-table"
          [data]="filteredWhitelistAddresses()"
          [interactiveRows]="true"
          [isLoading]="isLoading()"
          [searchConfig]="searchConfig()"
          (rowInteraction)="onRowInteraction($event)"
          (searchChanged)="onSearchChanged($event)"
        >
          <ignt-table-column key="integrationId" [header]="'whitelistAddress.integrationId' | translate" columnType="primary">
            <ng-template [igntTableColumnTemplateType]="whitelistAddresses()[0]" let-item="item">
              {{ item.integrationId }}
            </ng-template>
          </ignt-table-column>

          <ignt-table-column key="addresses" [header]="'whitelistAddress.addresses' | translate" align="left">
            <ng-template [igntTableColumnTemplateType]="whitelistAddresses()[0]" let-item="item">
              {{ item.addresses.join(', ') }}
            </ng-template>
          </ignt-table-column>

          <ignt-table-column [header]="''" align="right" columnType="action">
            <ng-template [igntTableColumnTemplateType]="whitelistAddresses()[0]" let-item="item">
              <button
                ignt-icon-button
                sentiment="tertiary"
                variant="danger"
                size="small"
                [icon]="['fal', 'trash-can']"
                [attr.aria-label]="'whitelistAddress.delete' | translate"
                [disabled]="isLoading()"
                (click)="$event.stopPropagation(); openDeleteModal(item)"
                (keydown)="$event.stopPropagation()"
              ></button>
            </ng-template>
          </ignt-table-column>
        </ignt-table>
      </div>
    </ignt-wrapper-card>
  </div>
</div>
