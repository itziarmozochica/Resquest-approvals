<ignt-dialog-header>
  {{ (isEditMode ? 'whitelistAddress.editModalTitle' : 'whitelistAddress.addModalTitle') | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <form id="whitelist-address-form" class="whitelist-address-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <ignt-input-field
      [id]="'integrationId'"
      formControlName="integrationId"
      [label]="'whitelistAddress.integrationId' | translate"
      [placeholder]="'whitelistAddress.integrationIdPlaceholder' | translate"
      [helperText]="'whitelistAddress.integrationIdHelp' | translate"
      [customFormErrors]="integrationIdErrors"
      [readonly]="isEditMode"
    />
    <ignt-textarea-field
      [id]="'addresses'"
      formControlName="addresses"
      [label]="'whitelistAddress.addresses' | translate"
      [placeholder]="'whitelistAddress.addressesPlaceholder' | translate"
      [helperText]="'whitelistAddress.addressesHelp' | translate"
      [rows]="3"
      [customFormErrors]="addressesErrors"
    />
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="secondary" [fill]="true" (click)="onCancel()">
    {{ 'whitelistAddress.cancel' | translate }}
  </button>
  <button
    form="whitelist-address-form"
    type="submit"
    igntButton
    sentiment="primary"
    [fill]="true"
    data-testid="modal-accept-button"
    [disabled]="isSubmitDisabled()"
  >
    {{ (isEditMode ? 'whitelistAddress.save' : 'whitelistAddress.create') | translate }}
  </button>
</ignt-dialog-footer>
