<ignt-dialog-header [hideCloseButton]="true">
  {{ 'whitelistAddress.deleteConfirmation' | translate }}
</ignt-dialog-header>
<ignt-dialog-content>
  <div class="whitelist-address-delete-dialog">
    <p class="whitelist-address-delete-dialog__warning">{{ 'whitelistAddress.deleteIrreversible' | translate }}</p>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button
    type="button"
    igntButton
    sentiment="secondary"
    [fill]="true"
    data-testid="whitelist-address-delete-cancel-button"
    (click)="onCancel()"
  >
    {{ 'whitelistAddress.cancel' | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    variant="danger"
    [fill]="true"
    data-testid="whitelist-address-delete-confirm-button"
    (click)="onConfirm()"
  >
    {{ 'whitelistAddress.confirmDelete' | translate }}
  </button>
</ignt-dialog-footer>
