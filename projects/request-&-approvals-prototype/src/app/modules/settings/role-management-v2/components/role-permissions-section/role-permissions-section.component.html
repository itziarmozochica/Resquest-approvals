<section class="role-permissions-section" aria-labelledby="role-permissions-heading">
  <h2 class="role-permissions-section__heading" id="role-permissions-heading">
    {{ 'roleManagement.permissionsHeading' | translate }}
  </h2>

  <div class="role-permissions-section__list">
    @for (category of categories(); track category.id) {
      <app-role-permission-category
        [categoryId]="category.id"
        [categoryTitleKey]="category.titleKey"
        [isExpanded]="isCategoryExpanded(category.id)"
        [permissions]="category.permissions"
        [readOnly]="permissionsReadOnly()"
        (saveModule)="onSavePermissions($event)"
        (toggleExpand)="onCategoryExpandToggle(category.id)"
      />
    }
  </div>
</section>
