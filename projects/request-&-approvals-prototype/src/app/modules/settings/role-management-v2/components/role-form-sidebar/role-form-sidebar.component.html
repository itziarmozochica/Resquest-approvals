<div class="role-form-sidebar">
  <form class="role-form-sidebar__form" (ngSubmit)="submitForm()">
    <ignt-input-field
      [id]="'role-create-name'"
      [formControl]="form.controls.name"
      [customFormErrors]="requiredFieldCustomErrors"
      [label]="(isEditMode() ? 'roleManagement.roleLabel' : 'roleManagement.newName') | translate"
      data-testid="role-form-name-input"
    />

    <ignt-textarea-field
      [id]="'role-create-description'"
      [formControl]="form.controls.description"
      [customFormErrors]="requiredFieldCustomErrors"
      [label]="(isEditMode() ? 'roleManagement.roleDescription' : 'roleManagement.newDescription') | translate"
      [resize]="'none'"
      [rows]="3"
      data-testid="role-form-description-input"
    />

    @if (enableDuplicateFromExistingRoleTypeahead) {
      <div class="role-form-sidebar__typeahead">
        <ignt-typeahead
          [editable]="true"
          [fieldLabel]="'roleManagement.duplicatePermissions' | translate"
          [minSearchLength]="0"
          [options]="baseRoleTypeaheadOptions()"
          [selectedOption]="selectedBaseRoleTypeaheadOption()"
          data-testid="role-form-base-role-typeahead"
          (selected)="onBaseRoleTypeaheadSelected($event)"
        />
      </div>
    }
  </form>
</div>
