<div
  class="role-list-item"
  [class.role-list-item--selected]="isSelected()"
  (click)="onSelect()"
  (keydown.enter)="onSelect()"
  (keydown.space)="onSpaceKeydown($event)"
  tabindex="0"
  role="button"
  [attr.aria-pressed]="isSelected()"
  data-testid="role-list-item"
>
  <div class="role-list-item__content">
    <div class="role-list-item__name-row">
      @if (isAdmin()) {
        <ignt-icon class="role-list-item__admin-icon" name="star" variant="solid" />
      }
      <span class="role-list-item__name">{{ roleLabel() }}</span>
      @if (isCustomRole()) {
        <ignt-tag class="role-list-item__custom-role-tag" data-testid="role-custom-role-tag" sentiment="info" variant="outline">
          {{ 'roleManagement.customRoleTag' | translate }}
        </ignt-tag>
      }
    </div>
    @if (hasActiveUserCount()) {
      <span class="role-list-item__user-count"> {{ activeUserCount() }} {{ userCountText() | translate }} </span>
    }
  </div>
</div>
