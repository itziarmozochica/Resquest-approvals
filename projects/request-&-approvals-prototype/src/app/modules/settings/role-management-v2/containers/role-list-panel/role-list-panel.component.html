<div class="role-list-panel">
  <div class="role-list-panel__header">
    <span class="role-list-panel__title">{{ 'roleManagement.selectRole' | translate }}</span>
  </div>

  <div class="role-list-panel__search">
    <ignt-input-field
      [formControl]="searchControl"
      [label]="'roleManagement.searchRoles' | translate"
      [leadIcon]="['far', 'search']"
      [placeholder]="'roleManagement.searchPlaceholder' | translate"
      data-testid="role-list-search-input"
    />
  </div>

  <div class="role-list-panel__divider"></div>

  <div class="role-list-panel__list" role="listbox" aria-label="Roles">
    @for (role of filteredRoles(); track role.id) {
      <app-role-list-item [role]="role" [isSelected]="selectedRoleId() === role.id" (select)="onRoleSelect($event)" />
    } @empty {
      <div class="role-list-panel__empty">
        <p>{{ 'roleManagement.noRolesFound' | translate }}</p>
      </div>
    }
  </div>
</div>
