<ignt-dialog-header>{{ 'common.unsavedChanges.title' | translate }}</ignt-dialog-header>
<ignt-dialog-content>{{ 'common.unsavedChanges.message' | translate }}</ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <button type="button" igntButton sentiment="tertiary" [igntDialogClose]="'discard'" data-testid="unsaved-exit-discard">
    {{ 'common.unsavedChanges.exitWithoutSaving' | translate }}
  </button>
  <button type="button" igntButton sentiment="primary" [igntDialogClose]="'save'" data-testid="unsaved-exit-save">
    {{ 'common.unsavedChanges.saveAndExit' | translate }}
  </button>
</ignt-dialog-footer>
