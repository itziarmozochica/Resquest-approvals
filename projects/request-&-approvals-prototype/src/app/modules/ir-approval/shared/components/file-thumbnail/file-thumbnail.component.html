<span class="file-thumbnail" [attr.data-kind]="kind()" [attr.data-testid]="testId()" aria-hidden="true">
  @if (imageUrl(); as url) {
    <img
      class="file-thumbnail__image"
      [src]="url"
      [width]="width"
      [height]="height"
      alt=""
      loading="lazy"
      decoding="async"
      referrerpolicy="no-referrer"
      (error)="onImageError(url)"
      (load)="onImageLoad(url)"
    />
  } @else {
    <ignt-icon class="file-thumbnail__icon" [name]="icon()" variant="light" size="sm" />
  }
</span>
