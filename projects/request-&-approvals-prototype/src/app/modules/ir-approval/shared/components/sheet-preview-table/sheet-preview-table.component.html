@if (rows().length > 0) {
  <div class="sheet-preview-table__scroll">
    <table class="sheet-preview-table__table" [attr.data-testid]="testId()">
      <thead>
        <tr>
          @for (cell of headerRow(); track $index) {
            <th scope="col" class="sheet-preview-table__th">{{ cell }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of bodyRows(); track $index) {
          <tr class="sheet-preview-table__row" data-testid="sheet-preview-table-row">
            @for (cell of row; track $index) {
              <td class="sheet-preview-table__cell">{{ cell }}</td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
}
