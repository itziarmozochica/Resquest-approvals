<div class="fz-wizard-stepper" data-testid="fz-wizard-stepper">
  <div class="fz-wizard-stepper__header">
    @if (title) {
      <h3 class="fz-wizard-stepper__title">{{ title | translate }}</h3>
    }
    <span class="fz-wizard-stepper__count" data-testid="fz-wizard-stepper-count">
      {{ 'wizardStepper.stepCount' | translate: { index: currentIndex + 1, total: total } }}
    </span>
  </div>

  @if (showProgress) {
    <div
      class="fz-wizard-stepper__progress"
      role="progressbar"
      [attr.aria-valuenow]="progressPercent"
      aria-valuemin="0"
      aria-valuemax="100"
      data-testid="fz-wizard-stepper-progress"
    >
      <div class="fz-wizard-stepper__progress-fill" [style.width.%]="progressPercent"></div>
    </div>
  }

  <div class="fz-wizard-stepper__cards" role="tablist">
    @for (step of steps; track step.id; let i = $index) {
      <button
        type="button"
        class="fz-wizard-stepper__card"
        [class.fz-wizard-stepper__card--done]="step.state === 'done'"
        [class.fz-wizard-stepper__card--current]="step.state === 'current'"
        [class.fz-wizard-stepper__card--current-error]="step.state === 'current-error'"
        [class.fz-wizard-stepper__card--error]="step.state === 'error'"
        [class.fz-wizard-stepper__card--static]="!allowStepSelect"
        [attr.tabindex]="allowStepSelect ? null : -1"
        [attr.aria-selected]="i === currentIndex"
        [attr.aria-current]="i === currentIndex ? 'step' : null"
        [attr.data-state]="step.state"
        [attr.data-testid]="'fz-wizard-stepper-card-' + step.id"
        role="tab"
        (click)="onSelect(i)"
      >
        <span class="fz-wizard-stepper__card-header">
          @if (step.state === 'done') {
            {{ 'wizardStepper.done' | translate }}
          } @else {
            {{ 'wizardStepper.stepShort' | translate: { index: i + 1 } }}
          }
        </span>
        <span class="fz-wizard-stepper__card-label">{{ step.label | translate }}</span>
        @if (step.hint) {
          <span class="fz-wizard-stepper__card-hint" data-testid="fz-wizard-stepper-card-hint">{{ step.hint | translate }}</span>
        }
        @if (step.state === 'done') {
          <ignt-icon class="fz-wizard-stepper__card-check" name="check-circle" variant="solid"></ignt-icon>
        }
      </button>
    }
  </div>
</div>
