<ignt-dialog-header data-testid="description-prompt-header">
  {{ 'descriptionPrompt.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content class="description-prompt-dialog">
  <p class="description-prompt-dialog__hint">{{ hintKey | translate }}</p>
  <ignt-textarea-field
    [id]="'description-prompt-input'"
    [label]="'descriptionPrompt.placeholder' | translate"
    [formControl]="control"
    [placeholder]="'descriptionPrompt.placeholder' | translate"
    [rows]="4"
    data-testid="description-prompt-input"
  ></ignt-textarea-field>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="secondary" (click)="cancel()" data-testid="description-prompt-cancel">
    {{ 'common.cancel' | translate }}
  </button>
  <button type="button" igntButton sentiment="primary" (click)="confirm()" data-testid="description-prompt-confirm">
    {{ 'descriptionPrompt.send' | translate }}
  </button>
</ignt-dialog-footer>
