<div class="ir-file-tree" [attr.data-testid]="testIdPrefix() + '-tree'">
  <app-ir-file-tree-branch
    [root]="true"
    [folders]="tree().folders"
    [files]="tree().files"
    [disabled]="disabled()"
    [viewingFileKey]="viewingFileKey()"
    [testIdPrefix]="testIdPrefix()"
    (toggleFolder)="toggle($event)"
    (view)="view.emit($event)"
    (remove)="remove.emit($event)"
  />
</div>
