<div class="ir-question-field-actions" [attr.data-testid]="'ir-question-field-actions-' + question().id">
  @if (pendingRemoval()) {
    <span class="ir-question-field-actions__note">
      {{ 'informationRequests.detail.fieldConfig.willBeRemoved' | translate }}
    </span>
    <ignt-button
      variant="secondary"
      sentiment="brand"
      size="small"
      [label]="'common.undo' | translate"
      [ariaLabel]="'informationRequests.detail.fieldConfig.undoRemoveQuestion' | translate: { label: question().label }"
      (click)="undoRemove()"
      [attr.data-testid]="'ir-question-undo-remove-' + question().id"
    />
  } @else {
    @if (requiredLocked()) {
      <span class="ir-question-field-actions__note">
        {{ 'informationRequests.detail.fieldConfig.requiredLocked' | translate }}
      </span>
    } @else {
      <div
        class="ir-question-field-actions__pills"
        role="group"
        [attr.aria-label]="'informationRequests.detail.fieldConfig.required' | translate"
      >
        <ignt-pill-button
          [value]="'required'"
          [label]="'informationRequests.detail.fieldConfig.required' | translate"
          [checked]="required()"
          (checkedChange)="setRequired(true)"
          [attr.data-testid]="'ir-question-required-' + question().id"
        ></ignt-pill-button>
        <ignt-pill-button
          [value]="'optional'"
          [label]="'informationRequests.detail.fieldConfig.optional' | translate"
          [checked]="!required()"
          (checkedChange)="setRequired(false)"
          [attr.data-testid]="'ir-question-optional-' + question().id"
        ></ignt-pill-button>
      </div>
    }

    @if (removable()) {
      <button
        type="button"
        ignt-icon-button
        sentiment="tertiary"
        variant="danger"
        size="small"
        [icon]="removeIcon"
        [attr.aria-label]="'informationRequests.detail.fieldConfig.removeQuestion' | translate: { label: question().label }"
        [attr.title]="'informationRequests.detail.fieldConfig.remove' | translate"
        (click)="remove()"
        [attr.data-testid]="'ir-question-remove-' + question().id"
      ></button>
    } @else {
      <span class="ir-question-field-actions__note" [attr.data-testid]="'ir-question-remove-blocked-' + question().id">
        {{ blockedKey()! | translate }}
      </span>
    }
  }
</div>
