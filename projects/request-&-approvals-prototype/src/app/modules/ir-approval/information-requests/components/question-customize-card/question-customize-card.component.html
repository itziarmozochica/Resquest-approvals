<div
  class="customize-card"
  [class.customize-card--hidden]="activePill() === 'hide'"
  [attr.data-testid]="'question-customize-card-' + question.id"
>
  <div class="customize-card__header">
    <div class="customize-card__pills" role="group" [attr.aria-label]="'informationRequests.new.customize.title' | translate">
      <ignt-pill-button
        [value]="'required'"
        [label]="'informationRequests.new.customize.required' | translate"
        [checked]="activePill() === 'required'"
        [disabled]="requiredLocked() && activePill() !== 'required'"
        (checkedChange)="onRequiredPill()"
        [attr.data-testid]="'question-customize-pill-required-' + question.id"
        [attr.title]="requiredLocked() ? ('informationRequests.new.customize.lockedRequired' | translate) : null"
      ></ignt-pill-button>
      <ignt-pill-button
        [value]="'optional'"
        [label]="'informationRequests.new.customize.optional' | translate"
        [checked]="activePill() === 'optional'"
        [disabled]="requiredLocked()"
        (checkedChange)="onOptionalPill()"
        [attr.data-testid]="'question-customize-pill-optional-' + question.id"
        [attr.title]="requiredLocked() ? ('informationRequests.new.customize.lockedRequired' | translate) : null"
      ></ignt-pill-button>
      <ignt-pill-button
        [value]="'hide'"
        [label]="'informationRequests.new.customize.hide' | translate"
        [checked]="activePill() === 'hide'"
        [disabled]="removalLocked()"
        (checkedChange)="onHidePill()"
        [attr.data-testid]="'question-customize-pill-hide-' + question.id"
        [attr.title]="removalLocked() ? ('informationRequests.new.customize.lockedRemoval' | translate) : null"
      ></ignt-pill-button>
    </div>

    <button
      type="button"
      class="customize-card__hint-trigger"
      (click)="toggleHint()"
      [attr.data-testid]="'question-customize-hint-trigger-' + question.id"
    >
      {{ (hasHint() ? 'informationRequests.new.customize.editHint' : 'informationRequests.new.customize.addHint') | translate }}
    </button>
  </div>

  @if (hintExpanded()) {
    <div class="customize-card__hint-editor" [attr.data-testid]="'question-customize-hint-editor-' + question.id">
      <textarea
        class="form-control customize-card__hint-textarea"
        rows="2"
        [value]="hintDraft()"
        (input)="onHintInput($event)"
        [placeholder]="'informationRequests.new.customize.hintPlaceholder' | translate"
        [attr.data-testid]="'question-customize-hint-textarea-' + question.id"
      ></textarea>
      <div class="customize-card__hint-actions">
        <button
          igntButton
          sentiment="secondary"
          size="small"
          type="button"
          (click)="cancelHint()"
          [attr.data-testid]="'question-customize-hint-cancel-' + question.id"
        >
          {{ 'informationRequests.new.customize.hintCancel' | translate }}
        </button>
        <button
          igntButton
          sentiment="primary"
          size="small"
          type="button"
          (click)="saveHint()"
          [attr.data-testid]="'question-customize-hint-save-' + question.id"
        >
          {{ 'informationRequests.new.customize.hintSave' | translate }}
        </button>
      </div>
    </div>
  }

  <div class="customize-card__preview" aria-hidden="true">
    <app-information-request-question [question]="question" [control]="previewControl()"></app-information-request-question>
  </div>
</div>
