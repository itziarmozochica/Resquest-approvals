<div class="launch-picker" data-testid="launch-picker">
  @if (loading()) {
    <div class="launch-picker__loading" data-testid="launch-picker-loading" role="status" aria-live="polite">
      <span class="launch-picker__spinner" aria-hidden="true"></span>
      <span>{{ 'informationRequests.new.project.loading' | translate }}</span>
    </div>
  } @else {
    <button
      type="button"
      class="launch-picker__option launch-picker__option--no-launch"
      [class.launch-picker__option--selected]="selectedLaunchId() === ''"
      [attr.aria-pressed]="selectedLaunchId() === ''"
      (click)="select('')"
      data-testid="launch-picker-no-launch"
    >
      {{ 'informationRequests.new.project.noLaunch' | translate }}
    </button>

    <input
      type="search"
      class="form-control launch-picker__search"
      [value]="search()"
      (input)="onSearch($any($event.target).value)"
      [attr.placeholder]="'informationRequests.new.project.searchPlaceholder' | translate"
      [attr.aria-label]="'informationRequests.new.project.searchPlaceholder' | translate"
      data-testid="launch-picker-search"
    />

    <ul class="launch-picker__grid" data-testid="launch-picker-list">
      @for (launch of filtered(); track launch.id) {
        <li>
          <button
            type="button"
            class="launch-picker__option"
            [class.launch-picker__option--selected]="selectedLaunchId() === launch.id"
            [attr.aria-pressed]="selectedLaunchId() === launch.id"
            (click)="select(launch.id)"
            [attr.data-testid]="'launch-picker-option-' + launch.id"
          >
            {{ launchLabel(launch) }}
          </button>
        </li>
      }
    </ul>
  }
</div>
