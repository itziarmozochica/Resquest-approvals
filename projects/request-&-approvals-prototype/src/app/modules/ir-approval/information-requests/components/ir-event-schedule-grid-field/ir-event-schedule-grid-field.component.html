<div class="event-schedule-field" data-testid="event-schedule-grid-field">
  <section class="event-schedule-field__card" data-testid="event-schedule-grid-field-editor">
    <div class="event-schedule-field__card-kicker">{{ 'informationRequests.schedule.stepOne' | translate }}</div>

    <app-ir-named-date-ranges-editor
      [composer]="composer()"
      [allProducts]="allProducts()"
      [venueEnabled]="venueEnabled()"
      [venueValue]="venueValue()"
      (composerChange)="onComposerChange($event)"
      (venueChange)="onVenueChange($event)"
    />
  </section>

  <section class="event-schedule-field__card event-schedule-field__overview" data-testid="event-schedule-grid-field-overview">
    <div class="event-schedule-field__card-kicker">{{ 'informationRequests.schedule.stepTwo' | translate }}</div>
    <h4 class="event-schedule-field__card-title">{{ 'informationRequests.schedule.overview' | translate }}</h4>
    <p class="event-schedule-field__card-copy">{{ 'informationRequests.schedule.overviewHint' | translate }}</p>
    <app-ir-schedule-bulk-calendar [composer]="composer()" [globalProducts]="allProducts()" [currency]="currency()" />
  </section>
</div>
