<div class="ir-venue" [attr.data-testid]="testId">
  <label class="ir-venue__search">
    <span class="ir-venue__search-label">
      {{ 'informationRequests.question.venue.search' | translate }}
    </span>
    <input
      #searchInput
      type="text"
      class="form-control"
      autocomplete="off"
      [placeholder]="'informationRequests.question.venue.searchPlaceholder' | translate"
      [disabled]="readOnly"
      [attr.data-testid]="testId + '-search'"
    />
    @if (!scriptReady && !placesUnavailable) {
      <small class="ir-venue__hint" [attr.data-testid]="testId + '-loading'">
        {{ 'informationRequests.question.venue.loadingPlaces' | translate }}
      </small>
    } @else if (placesUnavailable) {
      <small class="ir-venue__hint ir-venue__hint--warning" [attr.data-testid]="testId + '-unavailable'">
        {{ 'informationRequests.question.venue.placesUnavailable' | translate }}
      </small>
    }
  </label>

  <div class="ir-venue__fields">
    <label class="ir-venue__field">
      <span>{{ 'informationRequests.question.venue.name' | translate }}</span>
      <input
        type="text"
        class="form-control"
        autocomplete="off"
        [disabled]="readOnly"
        [value]="model.name ?? ''"
        (input)="onFieldChange('name', $any($event.target).value)"
        [attr.data-testid]="testId + '-name'"
      />
    </label>
    <label class="ir-venue__field ir-venue__field--wide">
      <span>{{ 'informationRequests.question.venue.address' | translate }}</span>
      <input
        type="text"
        class="form-control"
        autocomplete="off"
        [disabled]="readOnly"
        [value]="model.address ?? ''"
        (input)="onFieldChange('address', $any($event.target).value)"
        [attr.data-testid]="testId + '-address'"
      />
    </label>
    <label class="ir-venue__field">
      <span>{{ 'informationRequests.question.venue.city' | translate }}</span>
      <input
        type="text"
        class="form-control"
        autocomplete="off"
        [disabled]="readOnly"
        [value]="model.city ?? ''"
        (input)="onFieldChange('city', $any($event.target).value)"
        [attr.data-testid]="testId + '-city'"
      />
    </label>
    <label class="ir-venue__field">
      <span>{{ 'informationRequests.question.venue.region' | translate }}</span>
      <input
        type="text"
        class="form-control"
        autocomplete="off"
        [disabled]="readOnly"
        [value]="model.region ?? ''"
        (input)="onFieldChange('region', $any($event.target).value)"
        [attr.data-testid]="testId + '-region'"
      />
    </label>
    <label class="ir-venue__field">
      <span>{{ 'informationRequests.question.venue.country' | translate }}</span>
      <input
        type="text"
        class="form-control"
        autocomplete="off"
        [disabled]="readOnly"
        [value]="model.country ?? ''"
        (input)="onFieldChange('country', $any($event.target).value)"
        [attr.data-testid]="testId + '-country'"
      />
    </label>
    <label class="ir-venue__field">
      <span>{{ 'informationRequests.question.venue.zip' | translate }}</span>
      <input
        type="text"
        class="form-control"
        autocomplete="off"
        [disabled]="readOnly"
        [value]="model.zipCode ?? ''"
        (input)="onFieldChange('zipCode', $any($event.target).value)"
        [attr.data-testid]="testId + '-zip'"
      />
    </label>
  </div>
</div>
