@if (canUpload()) {
  <app-fz-upload
    [attr.data-testid]="testId"
    [enableComputer]="true"
    [enableDrive]="true"
    [enablePaste]="true"
    [enableDriveFolders]="true"
    [expandDirectories]="multiple"
    [formatsLabel]="acceptedFormatsLabel()"
    [mutuallyExclusive]="true"
    [acceptedMimeTypes]="acceptedMimeTypes()"
    [multiple]="multiple"
    [accept]="acceptAttr()"
    [disabled]="disabled"
    [fileCommit]="uploadFile"
    [downloadDriveSelections]="true"
    [driveCommit]="attachDrive"
    [urlParser]="parseDriveLink"
    [previewResolver]="previewUploaded"
    [trackedUploads]="trackedUploads()"
    (trackedUploadDismissed)="dismissTrackedUpload($event)"
    [resolvedIds]="answeredImportJobIds()"
  />
  @if (importStalled()) {
    <p class="ir-file-upload__stalled" [attr.data-testid]="testId + '-import-stalled'">
      {{ 'informationRequests.question.file.importStillRunning' | translate }}
    </p>
  }
  <app-ir-drive-import-notices [questionId]="questionId" [testId]="testId" />
} @else {
  <p class="ir-file-upload__needs-launch" [attr.data-testid]="testId + '-needs-launch'">
    {{ 'informationRequests.question.file.uploadNeedsLaunch' | translate }}
  </p>
}
