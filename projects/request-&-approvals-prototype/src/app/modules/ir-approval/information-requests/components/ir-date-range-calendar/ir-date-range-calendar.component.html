<div class="ir-range-cal" [class.ir-range-cal--exclusion]="hasAllowList()" data-testid="ir-date-range-calendar">
  <header class="ir-range-cal__header">
    <button type="button" class="ir-range-cal__nav" (click)="prevMonth()" data-testid="ir-date-range-prev" aria-label="Previous month">
      ‹
    </button>
    <span class="ir-range-cal__month" data-testid="ir-date-range-month">{{ monthLabel() }}</span>
    <button type="button" class="ir-range-cal__nav" (click)="nextMonth()" data-testid="ir-date-range-next" aria-label="Next month">
      ›
    </button>
  </header>

  <div class="ir-range-cal__weekdays" aria-hidden="true">
    @for (label of weekdayLabels; track label) {
      <span class="ir-range-cal__weekday">{{ label }}</span>
    }
  </div>

  <div class="ir-range-cal__grid" role="grid">
    @for (week of weeks(); track $index) {
      <div class="ir-range-cal__week" role="row">
        @for (cell of week; track cell.ymd) {
          <button
            type="button"
            class="ir-range-cal__cell"
            [class.ir-range-cal__cell--out]="!cell.inMonth"
            [class.ir-range-cal__cell--disabled]="cell.disabled"
            [class.ir-range-cal__cell--allowed]="cell.allowed"
            [class.ir-range-cal__cell--selected]="cell.selected"
            [class.ir-range-cal__cell--start]="cell.isStart"
            [disabled]="cell.disabled"
            [attr.aria-pressed]="cell.isStart"
            (click)="pick(cell)"
            [attr.data-testid]="'ir-date-range-cell-' + cell.ymd"
          >
            {{ cell.day }}
          </button>
        }
      </div>
    }
  </div>
</div>
