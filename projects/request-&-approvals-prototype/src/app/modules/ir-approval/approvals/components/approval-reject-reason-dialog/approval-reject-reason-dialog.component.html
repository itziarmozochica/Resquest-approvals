<ignt-dialog-header data-testid="approval-reject-dialog-header">
  {{ 'approvals.detail.rejectDialog.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content class="approval-reject-reason-dialog">
  <p class="approval-reject-reason-dialog__hint">{{ 'approvals.detail.rejectDialog.hint' | translate }}</p>
  <ul class="approval-reject-reason-dialog__list">
    @for (item of data.items; track item.id) {
      <li class="approval-reject-reason-dialog__item" data-testid="approval-reject-dialog-item">
        <span class="approval-reject-reason-dialog__label">{{ item.label }}</span>
        <textarea
          rows="8"
          class="approval-reject-reason-dialog__reason"
          [value]="reasonFor(item.id)"
          [attr.maxlength]="maxLength"
          (input)="setReason(item.id, $any($event.target).value)"
          [attr.placeholder]="'approvals.detail.rejectDialog.reasonPlaceholder' | translate"
          [attr.aria-label]="item.label"
          [attr.data-testid]="'approval-reject-dialog-reason-' + item.id"
        ></textarea>
      </li>
    }
  </ul>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    variant="secondary"
    [label]="'approvals.detail.rejectDialog.cancel' | translate"
    (click)="cancel()"
    data-testid="approval-reject-dialog-cancel"
  />
  <ignt-button
    sentiment="danger"
    variant="primary"
    [label]="'approvals.detail.rejectDialog.confirm' | translate"
    [disabled]="!allReasonsValid()"
    (click)="confirm()"
    data-testid="approval-reject-dialog-confirm"
  />
</ignt-dialog-footer>
