<div class="approval-item-review" [class.approval-item-review--busy]="busy()" [attr.aria-busy]="busy() ? 'true' : null">
  <div class="approval-item-review__row">
    @if (reviewable()) {
      <div class="approval-item-review__actions">
        @if (!isDecided()) {
          @if (inlineToggle()) {
            <!-- Dense marketing-copy grid keeps the compact icon buttons. -->
            <button
              type="button"
              class="approval-item-review__pill approval-item-review__pill--icon approval-item-review__pill--approve"
              [disabled]="disabled()"
              (click)="requestDecision('APPROVE')"
              [attr.aria-label]="'approvals.detail.itemActions.approve' | translate"
              [attr.title]="'approvals.detail.itemActions.approve' | translate"
              data-testid="approval-item-approve"
            >
              <ignt-icon name="check" variant="solid" size="h3"></ignt-icon>
            </button>
            <button
              type="button"
              class="approval-item-review__pill approval-item-review__pill--icon approval-item-review__pill--reject"
              [disabled]="disabled()"
              (click)="requestDecision('REJECT')"
              [attr.aria-label]="'approvals.detail.itemActions.reject' | translate"
              [attr.title]="'approvals.detail.itemActions.reject' | translate"
              data-testid="approval-item-reject"
            >
              <ignt-icon name="times" variant="solid" size="h3"></ignt-icon>
            </button>
          } @else {
            <!-- Non-marketing approvals (assets, URLs): labelled Approve / Reject buttons. -->
            <button
              type="button"
              class="approval-item-review__pill approval-item-review__pill--approve"
              [disabled]="disabled()"
              (click)="requestDecision('APPROVE')"
              data-testid="approval-item-approve"
            >
              {{ 'approvals.detail.itemActions.approve' | translate }}
            </button>
            <button
              type="button"
              class="approval-item-review__pill approval-item-review__pill--reject"
              [disabled]="disabled()"
              (click)="requestDecision('REJECT')"
              data-testid="approval-item-reject"
            >
              {{ 'approvals.detail.itemActions.reject' | translate }}
            </button>
          }
        } @else {
          <div class="approval-item-review__decided">
            <button
              type="button"
              class="approval-item-review__pill"
              [class.approval-item-review__pill--approve]="isApproved()"
              [class.approval-item-review__pill--reject]="isRejected()"
              [disabled]="disabled() || !canToggleDecided()"
              (click)="onDecidedClick()"
              [attr.aria-expanded]="inlineToggle() ? null : menuOpen()"
              [attr.title]="(inlineToggle() && canToggleDecided() ? 'approvals.detail.itemActions.clickToChange' : '') | translate"
              data-testid="approval-item-decided"
            >
              {{ (isApproved() ? 'approvals.status.approved' : 'approvals.status.rejected') | translate }}
            </button>
            @if (!inlineToggle() && menuOpen()) {
              <div class="approval-item-review__menu" data-testid="approval-item-menu">
                @if (isApproved()) {
                  <button
                    type="button"
                    class="approval-item-review__menu-option approval-item-review__menu-option--reject"
                    (click)="selectDecision('REJECT')"
                    data-testid="approval-item-menu-reject"
                  >
                    {{ 'approvals.detail.itemActions.reject' | translate }}
                  </button>
                } @else {
                  <button
                    type="button"
                    class="approval-item-review__menu-option approval-item-review__menu-option--approve"
                    (click)="selectDecision('APPROVE')"
                    data-testid="approval-item-menu-approve"
                  >
                    {{ 'approvals.detail.itemActions.approve' | translate }}
                  </button>
                }
                @if (allowPending()) {
                  <button
                    type="button"
                    class="approval-item-review__menu-option"
                    (click)="selectDecision('PENDING')"
                    data-testid="approval-item-menu-pending"
                  >
                    {{ 'approvals.detail.itemActions.pending' | translate }}
                  </button>
                }
              </div>
            }
          </div>
        }
      </div>
    }
  </div>
</div>
