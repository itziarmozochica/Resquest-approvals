<ignt-dialog-header data-testid="approval-resend-dialog-header">
  {{ 'approvals.detail.resend.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content class="approval-resend-dialog">
  <p class="approval-resend-dialog__hint">{{ 'approvals.detail.resend.hint' | translate }}</p>
  <ul class="approval-resend-dialog__list">
    @for (item of data.items; track item.id) {
      <li class="approval-resend-dialog__item" data-testid="approval-resend-dialog-row">
        <label class="approval-resend-dialog__check">
          <input
            type="checkbox"
            [checked]="isSelected(item.id)"
            (change)="toggle(item.id, $any($event.target).checked)"
            [attr.aria-label]="item.label"
            [attr.data-testid]="'approval-resend-dialog-check-' + item.id"
          />
          <span class="approval-resend-dialog__label">{{ item.label }}</span>
        </label>
      </li>
    }
  </ul>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="secondary" (click)="cancel()" data-testid="approval-resend-dialog-cancel">
    {{ 'approvals.detail.resend.cancel' | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    [disabled]="selectedCount() === 0"
    (click)="confirm()"
    data-testid="approval-resend-dialog-confirm"
  >
    {{ 'approvals.detail.resend.confirm' | translate: { count: selectedCount() } }}
  </button>
</ignt-dialog-footer>
