<ignt-dialog-header>{{ 'fundraising.donations.list.eventsDialog.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="donation-prompts-list-events-panel">
    <p
      class="donation-prompts-list-events-panel__description"
      [innerHTML]="descriptionTranslationKey | translate: { count: events().length }"
    ></p>
    <div class="donation-prompts-list-events-panel__list" [attr.aria-busy]="isLoading()">
      <span class="visually-hidden" role="status">
        @if (isLoading()) {
          {{ 'fundraising.donations.list.eventsDialog.loading' | translate }}
        }
      </span>
      @if (isLoading()) {
        <ignt-skeleton
          class="donation-prompts-list-events-panel__skeleton"
          type="list"
          [animation]="true"
          [numElements]="events().length"
          aria-hidden="true"
          data-testid="donation-prompts-list-events-panel-skeleton"
        />
      } @else {
        @for (event of events(); track event.id) {
          <ignt-list-item
            class="donation-prompts-list-events-panel__item"
            [description]="channelsDescription(event.channels)"
            [leadingIconTemplate]="leadingIconTpl"
            [title]="eventTitle(event)"
            type="unwrapped"
          >
            <ng-template #leadingIconTpl>
              <ignt-icon name="calendar-day" variant="light" size="sm" aria-hidden="true" />
            </ng-template>
          </ignt-list-item>
          @if (!$last) {
            <ignt-divider [margin]="false"></ignt-divider>
          }
        }
      }
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button igntButton type="button" sentiment="tertiary" [fill]="false" (click)="onClose()">
    {{ 'common.close' | translate }}
  </button>
</ignt-dialog-footer>
