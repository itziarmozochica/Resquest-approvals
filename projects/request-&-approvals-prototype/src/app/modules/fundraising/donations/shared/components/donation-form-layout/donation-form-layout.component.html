<section class="main-wrapper" [attr.aria-label]="ariaLabel()">
  <app-fundraising-page-title [section]="section()" [subsections]="subsections()" [title]="title()">
    <ng-content select="[headerActions]"></ng-content>
  </app-fundraising-page-title>

  @if (isAlertVisible()) {
    <ignt-alert [description]="alertDescription()" showCloseButton (closeAlert)="onAlertClose()"></ignt-alert>
  }

  <ng-content select="[formContent]"></ng-content>
</section>

<app-donation-footer-actions
  [isDisabled]="isDisabled()"
  [isEditMode]="isEditMode()"
  [isSubmitting]="isSubmitting()"
  (cancelAction)="cancelAction.emit()"
  (submitAction)="submitAction.emit()"
></app-donation-footer-actions>
