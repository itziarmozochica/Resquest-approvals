<ignt-dialog-header [hideCloseButton]="true">
  {{ 'fundraising.donations.form.previewChannelDialog.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="donation-preview-channel-dialog">
    <app-multi-select
      [options]="data.channels"
      [selectedOptions]="selectedChannel()"
      [placeholder]="'fundraising.donations.form.previewChannelDialog.channelLabel' | translate"
      [searchPlaceholder]="'fundraising.donations.form.previewChannelDialog.channelLabel' | translate"
      [maxSelectedOptions]="1"
      [displayInPlaceMaximum]="1"
      (selected)="onChannelSelected($event)"
      data-testid="donation-preview-channel-select"
    ></app-multi-select>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    variant="tertiary"
    sentiment="neutral"
    [label]="'common.cancel' | translate"
    (click)="onCancel()"
    data-testid="donation-preview-channel-cancel"
  ></ignt-button>
  <ignt-button
    variant="primary"
    sentiment="brand"
    [disabled]="!canPreview()"
    [label]="'fundraising.donations.form.previewChannelDialog.preview' | translate"
    (click)="onPreview()"
    data-testid="donation-preview-channel-confirm"
  ></ignt-button>
</ignt-dialog-footer>
