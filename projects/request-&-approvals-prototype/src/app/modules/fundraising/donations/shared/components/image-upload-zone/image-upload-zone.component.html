<div class="image-upload-zone">
  <div class="image-upload-zone__image-hints">
    <div class="image-upload-zone__image-hint-card-body wrapper-card">
      <ignt-icon class="image-upload-zone__image-hint-card-body__icon" name="draw-square" variant="light" size="h2" aria-hidden="true" />
      <div
        class="image-upload-zone__image-hint-html"
        [innerHTML]="'fundraising.donations.form.generalInfoSection.fields.image.hints.square' | translate | sanitize"
      ></div>
    </div>
    <div class="image-upload-zone__image-hint-card-body wrapper-card">
      <ignt-icon class="image-upload-zone__image-hint-card-body__icon" name="ban" variant="light" size="h2" aria-hidden="true" />
      <div
        class="image-upload-zone__image-hint-html"
        [innerHTML]="'fundraising.donations.form.generalInfoSection.fields.image.hints.quality' | translate | sanitize"
      ></div>
    </div>
    <div class="image-upload-zone__image-hint-card-body wrapper-card">
      <ignt-icon class="image-upload-zone__image-hint-card-body__icon" name="image" variant="light" size="h2" aria-hidden="true" />
      <div
        class="image-upload-zone__image-hint-html"
        [innerHTML]="'fundraising.donations.form.generalInfoSection.fields.image.hints.format' | translate | sanitize"
      ></div>
    </div>
  </div>
  <app-image-sortable-list
    class="image-upload-zone__image-upload"
    [photos]="photos()"
    [uploadFileCallback]="uploadFileCallback()"
    (photosChange)="photosChange.emit($event)"
    data-testid="donation-form-image"
  ></app-image-sortable-list>
</div>
