<div class="expandable-content">
  @if (variant() === 'toggle') {
    <div class="expandable-content__header">
      <div>
        <div>
          <span class="expandable-content__label">{{ label() }}</span>
          @if (isOptional()) {
            ({{ 'common.optional' | translate }})
          }
        </div>
        @if (description(); as expandableDescription) {
          <div class="expandable-content__description">
            {{ expandableDescription }}
          </div>
        }
      </div>
      <ignt-toggle
        [id]="toggleId()"
        [attr.data-testid]="testId() || null"
        [checked]="isChecked()"
        [disabled]="isDisabled()"
        (change)="onToggleChange($event)"
      />
    </div>
  } @else {
    <button
      type="button"
      class="expandable-content__header expandable-content__header--presentation"
      [attr.aria-expanded]="isChecked()"
      [attr.data-testid]="testId() || null"
      [attr.id]="toggleId() || null"
      (click)="togglePresentation()"
    >
      <ignt-icon
        class="expandable-content__chevron flip-rtl"
        [name]="isChecked() ? 'chevron-down' : 'chevron-right'"
        variant="solid"
        aria-hidden="true"
      />
      <span class="expandable-content__label">{{ label() }}</span>
      @if (description(); as expandableDescription) {
        <span class="expandable-content__right-label">{{ expandableDescription }}</span>
      }
    </button>
  }

  @if (isChecked()) {
    <div [class.expandable-content__divider]="!hideDivider()">
      <ng-content />
    </div>
  }
</div>
