<div class="donation-footer-actions">
  <button
    type="button"
    igntButton
    variant="danger"
    sentiment="secondary"
    size="large"
    (click)="cancelAction.emit()"
    data-testid="donation-footer-actions-cancel"
  >
    {{ 'common.cancel' | translate }}
  </button>
  <button
    type="button"
    igntButton
    variant="default"
    sentiment="primary"
    size="large"
    [loading]="isSubmitting()"
    [disabled]="isDisabled()"
    (click)="submitAction.emit()"
    [attr.aria-label]="'fundraising.donations.form.submit' | translate"
    data-testid="donation-footer-actions-submit"
  >
    {{ isEditMode() ? ('common.save' | translate) : ('common.create' | translate) }}
  </button>
</div>
