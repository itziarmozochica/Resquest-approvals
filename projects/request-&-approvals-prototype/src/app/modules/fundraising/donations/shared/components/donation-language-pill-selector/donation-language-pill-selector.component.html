<div class="donation-language-pill-selector">
  <div class="donation-language-pill-selector__header">
    <h4 class="donation-language-pill-selector__title">
      {{ 'fundraising.donationPages.form.contentTranslations.availableLanguages' | translate }}
    </h4>

    <button
      igntButton
      sentiment="primary"
      size="small"
      type="button"
      [attr.data-testid]="testIdPrefix() + '-add-language'"
      (click)="addLanguageClick.emit()"
    >
      {{ 'fundraising.donationPages.form.contentTranslations.addLanguage' | translate }}
    </button>
  </div>

  <div class="donation-language-pill-selector__pills">
    @for (lang of activeLanguages(); track lang) {
      <button
        type="button"
        class="donation-language-pill-selector__pill"
        [class.donation-language-pill-selector__pill--active]="lang === selectedLanguage()"
        [attr.aria-pressed]="lang === selectedLanguage()"
        [attr.aria-invalid]="invalidLanguageSet().has(lang) ? 'true' : null"
        (click)="onPillClick(lang)"
      >
        <span>{{ labels[lang] }}</span>
        @if (lang === defaultLanguage) {
          <ignt-tag sentiment="sharp" variant="solid">
            {{ 'fundraising.donationPages.form.contentTranslations.default' | translate }}
          </ignt-tag>
        }
        @if (invalidLanguageSet().has(lang)) {
          <ignt-icon
            class="donation-language-pill-selector__pill-warning"
            [attr.data-testid]="testIdPrefix() + '-pill-invalid-' + lang"
            name="exclamation-triangle"
            variant="solid"
            size="base"
            aria-hidden="true"
          />
        }
      </button>
    }
  </div>

  @if (hasMissingTranslations()) {
    <ignt-alert
      class="donation-language-pill-selector__missing-warning"
      [attr.data-testid]="testIdPrefix() + '-missing-translations-warning'"
      sentiment="warning"
      [description]="'fundraising.donationPages.form.contentTranslations.missingTranslationsWarning' | translate"
    />
  }
</div>
