<ignt-dialog-header [hideCloseButton]="true">
  {{ 'fundraising.donationPages.form.contentTranslations.manageLanguages' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="donation-language-selection">
    @for (lang of availableLanguages(); track lang) {
      <div class="donation-language-selection__item">
        <ignt-checkbox
          [checked]="selectedLanguages().has(lang)"
          [disabled]="lang === defaultLanguage"
          [label]="languageLabels[lang]"
          [attr.aria-label]="
            lang === defaultLanguage
              ? languageLabels[lang] +
                ' — ' +
                ('fundraising.donationPages.form.contentTranslations.default' | translate) +
                ', cannot be removed'
              : null
          "
          (change)="onToggle(lang, $event)"
        />
        @if (lang === defaultLanguage) {
          <ignt-tag sentiment="sharp" variant="solid">
            {{ 'fundraising.donationPages.form.contentTranslations.default' | translate }}
          </ignt-tag>
        }
      </div>
    }
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button igntButton type="button" sentiment="tertiary" [fill]="false" (click)="onCancel()">
    {{ 'common.cancel' | translate }}
  </button>
  <button igntButton type="button" sentiment="primary" (click)="onSave()">
    {{ 'common.save' | translate }}
  </button>
</ignt-dialog-footer>
