<div class="empty-state-action">
  <div class="empty-state-action__copy">
    <p class="empty-state-action__title">
      {{ title() }}
    </p>
    <p class="empty-state-action__subtitle">
      {{ subtitle() }}
    </p>
  </div>
  <button
    igntButton
    [sentiment]="'primary'"
    [variant]="'default'"
    [size]="'large'"
    [fill]="false"
    [attr.data-testid]="buttonTestId()"
    (click)="actionClick.emit()"
  >
    {{ buttonLabel() }}
  </button>
</div>
