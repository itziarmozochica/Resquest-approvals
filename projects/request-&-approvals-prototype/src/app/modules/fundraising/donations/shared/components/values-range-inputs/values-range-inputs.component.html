<div class="values-range-inputs">
  <div class="values-range-inputs__wrapper" [formGroup]="formGroup()">
    <ignt-input-field
      appThousandsSeparator
      id="donation-form-low-value"
      data-testid="donation-form-low-value"
      formControlName="lowValue"
      [label]="'fundraising.donations.form.attributesSection.fields.lowValue' | translate"
      type="number"
      [customFormErrors]="[
        {
          type: 'required',
          message: ('fundraising.donations.form.validation.presetValueRequired' | translate),
        },
      ]"
      class="values-range-inputs__input-field"
    />
    <ignt-input-field
      appThousandsSeparator
      id="donation-form-mid-value"
      data-testid="donation-form-mid-value"
      formControlName="midValue"
      [label]="'fundraising.donations.form.attributesSection.fields.midValue' | translate"
      type="number"
      [customFormErrors]="[
        {
          type: 'required',
          message: ('fundraising.donations.form.validation.presetValueRequired' | translate),
        },
      ]"
      class="values-range-inputs__input-field"
    />
    <ignt-input-field
      appThousandsSeparator
      id="donation-form-high-value"
      data-testid="donation-form-high-value"
      formControlName="highValue"
      [label]="'fundraising.donations.form.attributesSection.fields.highValue' | translate"
      type="number"
      [customFormErrors]="[
        {
          type: 'required',
          message: ('fundraising.donations.form.validation.presetValueRequired' | translate),
        },
      ]"
      class="values-range-inputs__input-field"
    />
  </div>
  <label class="values-range-inputs__hint">{{ hintLabel() }}</label>
</div>
