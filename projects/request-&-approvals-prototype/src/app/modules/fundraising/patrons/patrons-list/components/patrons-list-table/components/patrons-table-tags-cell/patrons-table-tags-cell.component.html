<div class="patrons-table-tags-cell">
  @if (!visibleTags().length) {
    <span>-</span>
  } @else {
    @if (visibleTags().length >= 1) {
      <div class="patrons-table-tags-cell__tag-line">
        <ignt-tag sentiment="sharp" [variant]="'outline'">{{ visibleTags()[0] }}</ignt-tag>
      </div>
    }
    @if (visibleTags().length >= 2 || overflowCount() > 0) {
      <div class="patrons-table-tags-cell__tag-line patrons-table-tags-cell__tag-line--inline">
        @if (visibleTags().length >= 2) {
          <ignt-tag sentiment="sharp" [variant]="'outline'">{{ visibleTags()[1] }}</ignt-tag>
        }
        @if (overflowCount() > 0) {
          <div igntTooltip [tooltipLabel]="tooltipText()" class="patrons-table-tags-cell__overflow">
            {{ overflowCount() }}
          </div>
        }
      </div>
    }
  }
</div>
