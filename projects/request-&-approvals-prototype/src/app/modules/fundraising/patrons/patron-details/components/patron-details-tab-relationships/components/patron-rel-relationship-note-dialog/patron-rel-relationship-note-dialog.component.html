<ignt-dialog-header>
  {{ 'fundraising.patronDetails.relationships.noteDialog.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div [formGroup]="noteForm" class="patron-rel-relationship-note-dialog">
    @if (relationships.length === 1) {
      <ignt-textarea-field
        [formControl]="noteControl(relationships[0].id)"
        [label]="'fundraising.patronDetails.relationships.noteDialog.notesLabel' | translate"
        [placeholder]="'fundraising.patronDetails.relationships.noteDialog.notesPlaceholder' | translate"
        [placeholderAsEmptyValue]="true"
        [rows]="5"
      ></ignt-textarea-field>
    } @else {
      <ignt-tabs
        [hasExtraLine]="true"
        [keepAlive]="true"
        [selectedIndex]="selectedTabIndex()"
        (selectedIndexChange)="onSelectedTabIndexChange($event)"
        [variant]="'default'"
      >
        @for (rel of relationships; track rel.id) {
          <ignt-tabs-item [label]="rel.roleLabel">
            <ignt-textarea-field
              [formControl]="noteControl(rel.id)"
              [label]="'fundraising.patronDetails.relationships.noteDialog.notesLabel' | translate"
              [placeholder]="'fundraising.patronDetails.relationships.noteDialog.notesPlaceholder' | translate"
              [placeholderAsEmptyValue]="true"
              [rows]="5"
            ></ignt-textarea-field>
          </ignt-tabs-item>
        }
      </ignt-tabs>
    }
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button variant="tertiary" [disabled]="isSubmitting()" [label]="'common.cancel' | translate" (click)="dismiss()" />
  @if (!isReadonly) {
    <ignt-button variant="primary" [disabled]="isSubmitting()" [label]="'common.save' | translate" (click)="onSave()" />
  }
</ignt-dialog-footer>
