<section class="documents-receipts-card wrapper-card wrapper-card--elevation-75" data-testid="documents-receipts-card">
  <header class="documents-receipts-card__header">
    <h3 class="documents-receipts-card__title">
      {{ 'fundraising.patronDetails.documents.receipts.title' | translate }}
    </h3>
  </header>

  <div class="documents-receipts-card__toolbar">
    <div class="documents-receipts-card__search-input-wrapper">
      <ignt-input-field
        class="documents-receipts-card__search-input"
        [label]="'fundraising.patronDetails.documents.receipts.searchPlaceholder' | translate"
        [ngModel]="searchValue()"
        (ngModelChange)="onSearchChange($event)"
        id="documents-receipts-search-input"
        data-testid="documents-receipts-search-input"
      >
      </ignt-input-field>
      <ignt-icon class="documents-receipts-card__search-input-icon" name="search" variant="regular" aria-hidden="true"></ignt-icon>
    </div>
    <ignt-button
      variant="tertiary"
      sentiment="brand"
      size="large"
      [label]="'fundraising.patronDetails.documents.receipts.filters' | translate"
      [leadingIcon]="{ name: 'sliders-h', variant: 'solid' }"
      data-testid="documents-receipts-filters-button"
    ></ignt-button>
  </div>

  <ignt-table [data]="receipts()" [isLoading]="isLoading()" class="documents-receipts-card__table" data-testid="documents-receipts-table">
    <ignt-table-column key="name" [header]="'fundraising.patronDetails.documents.receipts.columns.name' | translate" columnType="primary">
      <ng-template [igntTableColumnTemplateType]="receipts()?.[0]" let-item="item">
        <span class="documents-receipts-card__name">{{ item.name }}</span>
      </ng-template>
    </ignt-table-column>

    <ignt-table-column key="date" [header]="'fundraising.patronDetails.documents.receipts.columns.date' | translate">
      <ng-template [igntTableColumnTemplateType]="receipts()?.[0]" let-item="item">
        <time [attr.datetime]="item.date">{{ item.date | date: 'mediumDate' }}</time>
      </ng-template>
    </ignt-table-column>

    <ignt-table-column key="category" [header]="'fundraising.patronDetails.documents.receipts.columns.category' | translate">
      <ng-template [igntTableColumnTemplateType]="receipts()?.[0]" let-item="item">
        {{ getCategoryLabelKey(item.category) | translate }}
      </ng-template>
    </ignt-table-column>

    <ignt-table-column key="status" [header]="'fundraising.patronDetails.documents.receipts.columns.status' | translate">
      <ng-template [igntTableColumnTemplateType]="receipts()?.[0]" let-item="item">
        <ignt-tag [sentiment]="getStatusSentiment(item.status)" variant="solid">
          {{ getStatusLabelKey(item.status) | translate }}
        </ignt-tag>
      </ng-template>
    </ignt-table-column>

    <ignt-table-column [header]="'fundraising.patronDetails.documents.receipts.columns.actions' | translate" columnType="action">
      <ng-template [igntTableColumnTemplateType]="receipts()?.[0]" let-item="item">
        <ignt-button-dropdown
          [options]="dropdownActionsOptions()"
          [size]="'small'"
          [sentiment]="'tertiary'"
          [align]="'right'"
          [leadingIcon]="['fas', 'ellipsis-h']"
          [trailingIconClosed]="null"
          [trailingIconOpened]="null"
          [attr.aria-label]="('fundraising.patronDetails.documents.receipts.actionsFor' | translate) + ' ' + item.name"
          (optionClick)="onDropdownOptionClick($event, item)"
          data-testid="documents-receipts-row-actions"
        ></ignt-button-dropdown>
      </ng-template>
    </ignt-table-column>
  </ignt-table>
</section>
