<div class="patron-details-tab-documents" data-testid="patron-details-tab-documents">
  @if (isLoadingOverview() && !overview()) {
    <div class="patron-details-tab-documents__loading" data-testid="patron-details-tab-documents-loading">
      <ignt-icon name="spinner" variant="solid" [spin]="true" size="display" aria-hidden="true" />
    </div>
  } @else if (overview()) {
    <div class="patron-details-tab-documents__layout">
      <div class="patron-details-tab-documents__main">
        <app-documents-overview-card [overview]="overview()!"></app-documents-overview-card>
        <app-documents-receipts-card
          [receipts]="receipts()"
          [isLoading]="isLoadingReceipts()"
          (searchChange)="onSearchChange($event)"
          (downloadRequested)="onDownloadReceipt()"
        ></app-documents-receipts-card>
      </div>
      <aside class="patron-details-tab-documents__aside">
        <app-documents-actions-card (actionSelected)="onActionSelected($event)"></app-documents-actions-card>
      </aside>
    </div>
  }
</div>
