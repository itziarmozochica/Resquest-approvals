<ignt-dialog-header>
  {{ 'fundraising.patronDetails.relationships.removeDialog.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <form id="remove-relationship-form" class="patron-rel-remove-relationship-dialog" [formGroup]="removeRelationshipForm">
    @if (isSingleRelationship) {
      <p class="patron-rel-remove-relationship-dialog__description">
        <span [innerHTML]="'fundraising.patronDetails.relationships.removeDialog.confirmMessage' | translate"></span>
      </p>
    } @else {
      <p
        class="patron-rel-remove-relationship-dialog__description"
        [innerHTML]="
          'fundraising.patronDetails.relationships.removeDialog.selectMessage'
            | translate: { count: relationshipOptions.length, name: entityName }
        "
      ></p>

      <app-multi-select
        class="patron-rel-remove-relationship-dialog__select"
        [options]="relationshipOptions"
        [selectedOptions]="selectedRelationshipOptions()"
        [placeholder]="'fundraising.patronDetails.relationships.removeDialog.selectLabel' | translate"
        [searchPlaceholder]="'fundraising.patronDetails.relationships.removeDialog.selectPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onRelationshipChange($event)"
      ></app-multi-select>
    }
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button variant="tertiary" [disabled]="isSubmitting()" [label]="'common.cancel' | translate" (click)="dismiss()" />
  <ignt-button variant="primary" [disabled]="isRemoveDisabled" [label]="'common.remove' | translate" (click)="onRemove()" />
</ignt-dialog-footer>
