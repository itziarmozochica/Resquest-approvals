<section class="profile-contact-info wrapper-card wrapper-card--elevation-75" data-testid="profile-contact-info">
  <header class="profile-contact-info__header">
    <h3 class="profile-contact-info__title">
      {{ 'fundraising.patronDetails.profile.contactInfo.title' | translate }}
    </h3>
    @if (canEdit()) {
      <a igntLink size="small" sentiment="primary" (click)="editContactInfo.emit()" data-testid="profile-contact-info-edit">
        {{ 'fundraising.patronDetails.profile.contactInfo.edit' | translate }}
      </a>
    }
  </header>
  <div>
    @if (contactInfo()?.preferredContactMethod === doNotContactPreferredMethod) {
      <ignt-alert sentiment="warning" [showCloseButton]="false" data-testid="profile-contact-info-do-not-contact-alert">
        <ng-template #igntAlertContent>
          <div [innerHTML]="'fundraising.patronDetails.profile.contactInfo.doNotContactAlert' | translateTerminology"></div>
        </ng-template>
      </ignt-alert>
    }
    <div class="profile-contact-info__fields">
      <ignt-list-item
        class="profile-contact-info__list-item"
        [title]="'fundraising.patronDetails.profile.contactInfo.preferredContactMethod' | translate"
        [description]="translatedPreferredContactMethod()"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-contact-info-preferred-method"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-contact-info__list-item"
        [title]="'fundraising.patronDetails.profile.contactInfo.email' | translate"
        [description]="contactInfo()?.email ?? '-'"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-contact-info-email"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-contact-info__list-item"
        [title]="'fundraising.patronDetails.profile.contactInfo.phone' | translate"
        [description]="contactInfo()?.phone ?? '-'"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-contact-info-phone"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-contact-info__list-item"
        [title]="'fundraising.patronDetails.profile.contactInfo.country' | translate"
        [description]="contactInfo()?.country ?? '-'"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-contact-info-country"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-contact-info__list-item"
        [title]="'fundraising.patronDetails.profile.contactInfo.address' | translate"
        [description]="contactInfo()?.address ?? '-'"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-contact-info-address"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-contact-info__list-item"
        [title]="'fundraising.patronDetails.profile.contactInfo.city' | translate"
        [description]="contactInfo()?.city ?? '-'"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-contact-info-city"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-contact-info__list-item"
        [title]="'fundraising.patronDetails.profile.contactInfo.state' | translate"
        [description]="contactInfo()?.state ?? '-'"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-contact-info-state"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-contact-info__list-item"
        [title]="'fundraising.patronDetails.profile.contactInfo.postcode' | translate"
        [description]="contactInfo()?.postcode ?? '-'"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-contact-info-postcode"
      >
      </ignt-list-item>
    </div>
  </div>
</section>
