<ignt-dialog-header>
  {{ translationPrefix + '.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="patron-rel-remove-household-relationship-dialog">
    <p
      class="patron-rel-remove-household-relationship-dialog__description"
      [innerHTML]="
        translationPrefix + '.confirm' | translate: { householdName: dialogData.householdName, memberName: dialogData.leavingMember.name }
      "
    ></p>

    @if (isTwoMemberHousehold) {
      <ignt-alert sentiment="warning" [showCloseButton]="false">
        <ng-template #igntAlertContent>
          <span
            [innerHTML]="
              'fundraising.patronDetails.relationships.lifecycle.moveOut.alertWarning'
                | translate: { householdName: dialogData.householdName, memberName: dialogData.leavingMember.name }
            "
          ></span>
        </ng-template>
      </ignt-alert>
    }

    <ignt-alert sentiment="info" [showCloseButton]="false">
      <ng-template #igntAlertContent>
        <span
          [innerHTML]="
            translationPrefix + '.alertInfo'
              | translate: { memberName: dialogData.leavingMember.name, householdName: dialogData.householdName }
          "
        ></span>
      </ng-template>
    </ignt-alert>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button variant="tertiary" [label]="'common.cancel' | translate" (click)="dismiss()" />
  <ignt-button variant="primary" sentiment="danger" [label]="'common.remove' | translate" (click)="onSubmit()" />
</ignt-dialog-footer>
