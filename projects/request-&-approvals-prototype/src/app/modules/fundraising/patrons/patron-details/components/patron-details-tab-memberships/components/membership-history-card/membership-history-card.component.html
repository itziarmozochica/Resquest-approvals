<section class="membership-history-card wrapper-card wrapper-card--elevation-75" data-testid="membership-history-card">
  <header class="membership-history-card__header">
    <h3 class="membership-history-card__title">
      {{ 'fundraising.patronDetails.memberships.history.title' | translate }}
    </h3>
    <a
      igntLink
      size="small"
      sentiment="primary"
      role="button"
      tabindex="0"
      (click)="goToTimeline.emit()"
      data-testid="membership-history-card-go-to-timeline"
    >
      {{ 'fundraising.patronDetails.memberships.history.goToTimeline' | translate }}
    </a>
  </header>

  @if (hasItems()) {
    <app-timeline [customItems]="historyEntries()"></app-timeline>
  } @else {
    <p class="membership-history-card__empty" data-testid="membership-history-card-empty">
      {{ 'fundraising.patronDetails.memberships.history.empty' | translate }}
    </p>
  }
</section>
