<section class="profile-system-info wrapper-card wrapper-card--elevation-75" data-testid="profile-system-info">
  <header class="profile-system-info__header">
    <h3 class="profile-system-info__title">
      {{ 'fundraising.patronDetails.profile.systemInfo.title' | translate }}
    </h3>
    @if (canEdit()) {
      <a igntLink size="small" sentiment="primary" (click)="editSystemInfo.emit()" data-testid="profile-system-info-edit">
        {{ 'fundraising.patronDetails.profile.systemInfo.edit' | translate }}
      </a>
    }
  </header>

  <div class="profile-system-info__fields">
    <ignt-list-item
      class="profile-system-info__list-item"
      [title]="'fundraising.patronDetails.profile.systemInfo.status' | translate"
      [description]="translatedStatus()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-system-info-status"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-system-info__list-item"
      [title]="'fundraising.patronDetails.profile.systemInfo.feverAccountId' | translate"
      [description]="patronDetails()?.id ?? '-'"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-system-info-fever-account-id"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-system-info__list-item"
      [title]="'fundraising.patronDetails.profile.systemInfo.patronId' | translateTerminology"
      [description]="patronDetails()?.userAssociationId ?? '-'"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-system-info-patron-id"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-system-info__list-item"
      [title]="'fundraising.patronDetails.profile.systemInfo.source' | translate"
      [description]="translatedSource()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-system-info-source"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-system-info__list-item"
      [title]="'fundraising.patronDetails.profile.systemInfo.dateCreated' | translate"
      [description]="(patronDetails()?.createdAt | date: 'longDate') ?? '-'"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-system-info-date-created"
    >
    </ignt-list-item>
  </div>

  @if (personalInfo()?.notes) {
    <div class="profile-system-info__notes" data-testid="profile-system-info-notes">
      <span class="profile-system-info__notes-label">
        {{ 'fundraising.patronDetails.profile.systemInfo.notes' | translate }}
      </span>
      <p class="profile-system-info__notes-value">{{ personalInfo()?.notes }}</p>
    </div>
  }
</section>
