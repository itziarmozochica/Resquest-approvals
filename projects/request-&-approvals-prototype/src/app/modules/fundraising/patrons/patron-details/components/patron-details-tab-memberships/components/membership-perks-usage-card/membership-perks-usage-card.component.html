<section class="membership-perks-usage-card wrapper-card wrapper-card--elevation-75" data-testid="membership-perks-usage-card">
  <header class="membership-perks-usage-card__header">
    <h3 class="membership-perks-usage-card__title">
      {{ 'fundraising.patronDetails.memberships.perks.title' | translate }}
    </h3>
  </header>

  <ul class="membership-perks-usage-card__list">
    @for (perk of perks(); track perk.id) {
      <li class="membership-perks-usage-card__item" data-testid="membership-perks-usage-card-item">
        <ignt-icon class="membership-perks-usage-card__icon" [name]="perk.icon" variant="light" aria-hidden="true" />
        <span class="membership-perks-usage-card__label">
          <strong>{{ perk.labelStrong }}</strong
          >{{ perk.labelRest }}
        </span>
        @if (perk.usageLabel) {
          <span class="membership-perks-usage-card__pill" data-testid="membership-perks-usage-card-pill">{{ perk.usageLabel }}</span>
        }
      </li>
    }
  </ul>
</section>
