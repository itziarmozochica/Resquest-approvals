<section class="profile-professional-info wrapper-card wrapper-card--elevation-75" data-testid="profile-professional-info">
  <header class="profile-professional-info__header">
    <h3 class="profile-professional-info__title">
      {{ 'fundraising.patronDetails.profile.professionalInfo.title' | translate }}
    </h3>
    <a
      igntLink
      href="#"
      size="small"
      sentiment="primary"
      class="profile-professional-info__relationships-link"
      (click)="navigateToRelationships($event)"
      data-testid="profile-professional-info-go-to-relationships"
    >
      {{ 'fundraising.patronDetails.profile.professionalInfo.goToRelationships' | translate }}
    </a>
  </header>

  <div>
    <ignt-alert sentiment="neutral" [description]="'fundraising.patronDetails.profile.professionalInfo.disclaimer' | translate" />

    <div class="profile-professional-info__fields">
      <ignt-list-item
        class="profile-professional-info__list-item"
        [title]="'fundraising.patronDetails.profile.professionalInfo.profession' | translate"
        [description]="'-'"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-professional-info-profession"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-professional-info__list-item"
        [title]="'fundraising.patronDetails.profile.professionalInfo.companyName' | translate"
        [description]="companyNameDisplay()"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-professional-info-company-name"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-professional-info__list-item"
        [title]="'fundraising.patronDetails.profile.professionalInfo.jobTitle' | translate"
        [description]="jobTitleDisplay()"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-professional-info-job-title"
      >
      </ignt-list-item>
      <ignt-list-item
        class="profile-professional-info__list-item"
        [title]="'fundraising.patronDetails.profile.professionalInfo.employmentStatus' | translate"
        [description]="'-'"
        [divider]="true"
        type="unwrapped"
        data-testid="profile-professional-info-employment-status"
      >
      </ignt-list-item>
    </div>
  </div>
</section>
