<div class="patron-details-tab-memberships" data-testid="patron-details-tab-memberships">
  @if (view(); as view) {
    @if (isMember()) {
      <div class="patron-details-tab-memberships__layout">
        <div class="patron-details-tab-memberships__main">
          <app-membership-overview-card [membershipView]="view"></app-membership-overview-card>
          @if (view.perks.length > 0) {
            <app-membership-perks-usage-card [perks]="view.perks"></app-membership-perks-usage-card>
          }
          <app-membership-history-card
            [historyEntries]="view.historyEntries"
            (goToTimeline)="onGoToTimeline()"
          ></app-membership-history-card>
        </div>
        <aside class="patron-details-tab-memberships__aside">
          @if (view.beneficiaries.length > 0) {
            <app-membership-beneficiaries-card [beneficiaries]="view.beneficiaries"></app-membership-beneficiaries-card>
          }
          <app-membership-actions-card (actionSelected)="onActionSelected($event)"></app-membership-actions-card>
        </aside>
      </div>
    }

    @if (!isMember()) {
      @if (view.programs.length > 0) {
        <app-membership-programs-grid [programs]="view.programs" (sendLink)="onSendLink($event)"></app-membership-programs-grid>
      } @else {
        <app-membership-empty-state></app-membership-empty-state>
      }
    }
  } @else if (isLoading()) {
    <div class="patron-details-tab-memberships__loading" data-testid="patron-details-tab-memberships-loading">
      <ignt-icon name="spinner" variant="solid" [spin]="true" size="display" aria-hidden="true" />
    </div>
  }
</div>
