<section class="documents-overview-card wrapper-card wrapper-card--elevation-75" data-testid="documents-overview-card">
  <header class="documents-overview-card__header">
    <h3 class="documents-overview-card__title">
      {{ 'fundraising.patronDetails.documents.overview.title' | translate }}
    </h3>
  </header>

  <div class="documents-overview-card__grid">
    <app-patron-details-info-section
      data-testid="documents-overview-card-tax-documentation"
      [title]="'fundraising.patronDetails.documents.overview.taxDocumentation' | translate"
      [value]="overview().taxDocumentationLabel"
      [subtitle]="
        overview().taxDocumentationSentAt
          ? ('fundraising.patronDetails.documents.overview.sentOn'
            | translate: { date: (overview().taxDocumentationSentAt | date: 'mediumDate') })
          : undefined
      "
    >
      <ignt-tag
        infoSectionTrailing
        class="documents-overview-card__tag"
        [sentiment]="taxStatusSentiment()"
        variant="solid"
        data-testid="documents-overview-card-tax-status"
      >
        {{ taxStatusLabelKey() | translate }}
      </ignt-tag>
    </app-patron-details-info-section>

    <app-patron-details-info-section
      data-testid="documents-overview-card-documented-giving"
      [title]="'fundraising.patronDetails.documents.overview.documentedGiving' | translate"
      [value]="(overview().documentedGivingAmount | currency: overview().currency) ?? '-'"
      [subtitle]="'fundraising.patronDetails.documents.overview.sinceYear' | translate: { year: overview().documentedGivingSinceYear }"
    ></app-patron-details-info-section>

    <app-patron-details-info-section
      data-testid="documents-overview-card-non-deductible"
      [centered]="true"
      [title]="'fundraising.patronDetails.documents.overview.nonDeductibleValue' | translate"
      [value]="(overview().nonDeductibleAmount | currency: overview().currency) ?? '-'"
      valueSize="h6"
    ></app-patron-details-info-section>
  </div>
</section>
