<div class="patron-details-giving-summary wrapper-card wrapper-card--elevation-75">
  <header class="patron-details-giving-summary__header">
    <h3 class="patron-details-giving-summary__title">{{ 'fundraising.patronDetails.givingSummary.title' | translate }}</h3>
  </header>

  @if (isLoading()) {
    <div class="patron-details-giving-summary__loading" role="status" aria-live="polite">
      <ignt-icon name="spinner" variant="solid" size="display" [spin]="true" aria-hidden="true" />
    </div>
  } @else {
    <div class="patron-details-giving-summary__metrics-container">
      <app-giving-summary-metric
        [label]="'fundraising.patronDetails.givingSummary.totalContribution' | translate"
        [primaryValue]="totalAmountValues().amount"
        [donations]="totalAmountValues().donations"
        [revenue]="totalAmountValues().revenue"
        [labelTooltip]="'fundraising.patronDetails.givingSummary.totalContribution' | translate"
      />
      <app-giving-summary-metric
        [label]="'fundraising.patronDetails.givingSummary.averageContribution' | translate"
        [primaryValue]="averageAmountValues().amount"
        [donations]="averageAmountValues().donations"
        [revenue]="averageAmountValues().revenue"
        [labelTooltip]="'fundraising.patronDetails.givingSummary.averageContribution' | translate"
      />
    </div>

    <div class="patron-details-giving-summary__metrics-container">
      @for (row of transactionRows(); track row.key) {
        <app-giving-summary-metric
          [label]="row.label | translate"
          [labelTooltip]="row.label | translate"
          [primaryValue]="row.primaryValue"
          [secondaryValue]="row.secondaryValue"
          [donations]="row?.donations"
          [revenue]="row?.revenue"
          [showDetails]="row.showDetails"
          [defaultIcon]="row?.defaultIcon"
        />
      }
    </div>

    <div class="patron-details-giving-summary__metrics-container">
      <app-giving-summary-metric
        [label]="'fundraising.patronDetails.givingSummary.funds' | translate"
        [mainValue]="(givingSummary()?.counts?.funds ?? '-').toString()"
        [labelTooltip]="'fundraising.patronDetails.givingSummary.funds' | translate"
      />
      <app-giving-summary-metric
        [label]="'fundraising.patronDetails.givingSummary.campaigns' | translate"
        [mainValue]="(givingSummary()?.counts?.campaigns ?? '-').toString()"
        [labelTooltip]="'fundraising.patronDetails.givingSummary.campaigns' | translate"
      />
      <app-giving-summary-metric
        [label]="'fundraising.patronDetails.givingSummary.appeals' | translate"
        [mainValue]="(givingSummary()?.counts?.appeals ?? '-').toString()"
        [labelTooltip]="'fundraising.patronDetails.givingSummary.appeals' | translate"
      />
    </div>
  }
</div>
