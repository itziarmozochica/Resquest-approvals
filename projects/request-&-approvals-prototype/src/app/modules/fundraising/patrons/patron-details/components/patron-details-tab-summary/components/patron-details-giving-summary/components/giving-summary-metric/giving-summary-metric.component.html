<div class="giving-summary-metric">
  <span class="giving-summary-metric__label">
    {{ label() }}
    @if (tooltip()) {
      <ignt-icon igntTooltip [tooltipLabel]="tooltip()" name="info-circle" variant="solid" class="giving-summary-metric__info-icon" />
    }
  </span>
  <div class="giving-summary-metric__box">
    @if (mainValue()) {
      <span class="giving-summary-metric__value-main">{{ mainValue() }}</span>
    } @else {
      <div class="giving-summary-metric__values">
        <span class="giving-summary-metric__value-primary">{{ primaryValue() }}</span>
        @if (secondaryValue()) {
          <span class="giving-summary-metric__value-secondary">{{ secondaryValue() }}</span>
        }
      </div>
      <div class="giving-summary-metric__tags">
        @if (!showDetails()) {
          <ignt-icon [name]="primaryValue() !== emptyValue() ? defaultIcon() : 'exclamation-triangle'" variant="light" aria-hidden="true" />
        } @else {
          <ignt-tag sentiment="warning" variant="outline">
            <ignt-icon name="hand-holding-usd" variant="light" aria-hidden="true" />
            {{ donations() }}
          </ignt-tag>
          <ignt-tag sentiment="info" variant="outline">
            <ignt-icon name="ticket-alt" variant="light" aria-hidden="true" />
            {{ revenue() }}
          </ignt-tag>
        }
      </div>
    }
  </div>
</div>
