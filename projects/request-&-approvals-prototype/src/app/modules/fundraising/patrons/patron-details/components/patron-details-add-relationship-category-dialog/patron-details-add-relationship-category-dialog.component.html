<ignt-dialog-header>{{ 'fundraising.patronDetails.relationships.addDialog.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="patron-details-add-relationship-category-dialog">
    <div class="patron-details-add-relationship-category-dialog__options">
      @for (option of categoryOptions(); track option.category) {
        <ignt-list-item
          class="patron-details-add-relationship-category-dialog__option"
          [class.patron-details-add-relationship-category-dialog__option--disabled]="option.disabled"
          [class.patron-details-add-relationship-category-dialog__option--selected]="selectedCategory() === option.category"
          [title]="option.titleKey | translate"
          [description]="option.descriptionKey | translate"
          [leadingIconTemplate]="leadingIconTpl"
          [clickable]="!option.disabled"
          type="unwrapped"
          [attr.data-testid]="'patron-details-add-relationship-category-' + option.category"
          (click)="option.disabled ? null : selectCategory(option.category)"
        >
          <ng-template #leadingIconTpl>
            <ignt-icon [name]="option.icon" variant="light" size="base" />
          </ng-template>
          <div trailing-modifier class="patron-details-add-relationship-category-dialog__option-trailing">
            <ignt-radio [checked]="selectedCategory() === option.category" [disabled]="option.disabled" />
          </div>
        </ignt-list-item>
        @if (!$last) {
          <ignt-divider [margin]="false"></ignt-divider>
        }
      }
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="tertiary" (click)="dismiss()">{{ 'common.cancel' | translate }}</button>
  <button type="button" igntButton sentiment="primary" [disabled]="selectedCategory() === null" (click)="onNext()">
    {{ 'common.next' | translate }}
  </button>
</ignt-dialog-footer>
