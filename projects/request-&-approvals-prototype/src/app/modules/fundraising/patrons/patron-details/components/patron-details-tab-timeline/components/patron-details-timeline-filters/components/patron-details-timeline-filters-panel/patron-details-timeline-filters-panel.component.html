<ignt-dialog-header>
  {{ 'fundraising.patrons.form.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="timeline-filters-panel" data-testid="patron-details-timeline-filters__filters-sheet">
    <div class="timeline-filters-panel__group">
      <div>
        <div class="timeline-filters-panel__dates-range-wrapper">
          <ignt-date-picker-input
            id="timeline-filters-date-from"
            class="availability-date-from"
            [label]="'fundraising.patrons.form.lastActivityFrom' | translate"
            [timezone]="data.timezone()"
            [startDate]="data.dateFrom()"
            (changeDate)="data.onDateFromChange($event)"
          ></ignt-date-picker-input>
          <div class="timeline-filters-panel__dates-range-wrapper__divider"></div>
          <ignt-date-picker-input
            id="timeline-filters-date-to"
            class="availability-date-to"
            [label]="'fundraising.patrons.form.lastActivityTo' | translate"
            [timezone]="data.timezone()"
            [startDate]="data.dateTo()"
            (changeDate)="data.onDateToChange($event)"
          ></ignt-date-picker-input>
        </div>
        <span class="timeline-filters-panel__date-range-label">{{
          'fundraising.patronDetails.activityTimeline.filterDatePlaceholder' | translate
        }}</span>
      </div>

      <app-multi-select
        [options]="data.activityTypeOptions()"
        [selectedOptions]="data.selectedTypes()"
        [placeholder]="'fundraising.patronDetails.activityTimeline.typeFilterPlaceholder' | translate"
        [searchPlaceholder]="'fundraising.patrons.form.selectSearchPlaceholderUnique' | translate"
        [displayInPlaceMaximum]="1"
        [maxSelectedOptions]="1"
        (selected)="data.onSelectedTypesChange($event)"
        class="timeline-filters-panel__selectors"
        data-testid="patron-details-timeline-filters-type-filter"
      ></app-multi-select>
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button
    igntButton
    [sentiment]="'tertiary'"
    [variant]="'default'"
    [size]="'large'"
    [fill]="false"
    (click)="onClear()"
    data-testid="patron-details-timeline-filters-reset-button"
  >
    {{ 'fundraising.patrons.form.clearFilters' | translate }}
  </button>
  <button
    igntButton
    [sentiment]="'primary'"
    [variant]="'default'"
    [size]="'large'"
    [fill]="false"
    (click)="onApply()"
    data-testid="patron-details-timeline-filters-apply-button"
  >
    {{ 'fundraising.patrons.form.applyFilters' | translate }}
  </button>
</ignt-dialog-footer>
