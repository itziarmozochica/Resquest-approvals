<div class="patron-details-tab-profile">
  <app-profile-system-info
    [canEdit]="canEdit()"
    [patronDetails]="patronDetails()"
    [personalInfo]="personalInfo()"
    (editSystemInfo)="editSystemInfo.emit()"
  ></app-profile-system-info>

  <app-profile-personal-info
    [canEdit]="canEdit()"
    [personalInfo]="personalInfo()"
    [patronName]="patronDetails()?.name ?? '-'"
    (editPersonalInfo)="editPersonalInfo.emit()"
  ></app-profile-personal-info>

  <app-profile-contact-info
    [canEdit]="canEdit()"
    [contactInfo]="contactInfo()"
    (editContactInfo)="editContactInfo.emit()"
  ></app-profile-contact-info>

  <app-profile-professional-info [groupContext]="groupContext()"></app-profile-professional-info>
</div>
