<section class="patron-details-info-section">
  <header class="patron-details-info-section__header">
    <span class="patron-details-info-section__label">
      {{ title() }}
      @if (titleTooltip(); as tooltip) {
        <ignt-icon class="patron-details-info-section__info" name="info-circle" variant="solid" igntTooltip [tooltipLabel]="tooltip" />
      }
    </span>
    <ng-content select="[infoSectionAlert]"></ng-content>
  </header>

  <div class="patron-details-info-section__body" [class.patron-details-info-section__body--centered]="centered()">
    <div class="patron-details-info-section__text">
      <span class="patron-details-info-section__value" [class.patron-details-info-section__value--h6]="valueSize() === 'h6'">{{
        value()
      }}</span>
      @if (secondaryValue(); as secondary) {
        <span class="patron-details-info-section__secondary-value">{{ secondary }}</span>
      }
      @if (subtitle(); as subtitleText) {
        <span class="patron-details-info-section__subtitle">{{ subtitleText }}</span>
      }
    </div>
    <ng-content select="[infoSectionTrailing]"></ng-content>
  </div>
</section>
