<div class="patron-details-timeline-filters">
  <div class="patron-details-timeline-filters__search">
    <div class="patron-details-timeline-filters__search__input-wrapper">
      <ignt-input-field
        class="patron-details-timeline-filters__search__input"
        [label]="'fundraising.patronDetails.activityTimeline.searchPlaceholder' | translate"
        [ngModel]="searchValue()"
        (ngModelChange)="onSearchChange($event)"
        id="patron-details-timeline-filters-search-ignt"
        data-testid="patron-details-timeline-filters-search-input"
      >
      </ignt-input-field>
      <ignt-icon class="patron-details-timeline-filters__search__input-icon" name="search" variant="regular" />
    </div>
  </div>

  <div class="patron-details-timeline-filters__actions">
    <button
      igntButton
      [sentiment]="'tertiary'"
      [variant]="'default'"
      [fill]="false"
      [leadingIcon]="['fas', 'sliders-h']"
      [attr.aria-expanded]="showFilters()"
      aria-haspopup="dialog"
      (click)="onOpenFilterSlider()"
      data-testid="patron-details-timeline-filters-filter-button"
    >
      @if (activeFiltersCount() > 0) {
        {{ 'fundraising.patrons.filterButtonWithFilters' | translate: { count: activeFiltersCount() } }}
      } @else {
        {{ 'fundraising.patrons.filterButton' | translate }}
      }
    </button>
    @if (canEdit()) {
      <span class="patron-details-timeline-filters__actions__divider" aria-hidden="true"></span>
      <button
        igntButton
        [sentiment]="'primary'"
        [variant]="'default'"
        [size]="'small'"
        [fill]="true"
        (click)="onAddActivity()"
        data-testid="patron-details-timeline-filters-add-activity-button"
      >
        {{ 'fundraising.patronDetails.activityTimeline.openModalText' | translate }}
      </button>
    }
  </div>
</div>
