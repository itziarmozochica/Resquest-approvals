<section class="profile-personal-info wrapper-card wrapper-card--elevation-75" data-testid="profile-personal-info">
  <header class="profile-personal-info__header">
    <h3 class="profile-personal-info__title">
      {{ 'fundraising.patronDetails.profile.personalInfo.title' | translate }}
    </h3>
    @if (canEdit()) {
      <a igntLink size="small" sentiment="primary" (click)="editPersonalInfo.emit()" data-testid="profile-personal-info-edit">
        {{ 'fundraising.patronDetails.profile.personalInfo.edit' | translate }}
      </a>
    }
  </header>

  <div class="profile-personal-info__fields">
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.fullName' | translate"
      [description]="patronName()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-full-name"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.gender' | translate"
      [description]="translatedGender()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-gender"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.educationalDegree' | translate"
      [description]="translatedEducationalDegree()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-educational-degree"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.educationalLevel' | translate"
      [description]="translatedEducationalLevel()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-educational-level"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.suffix' | translate"
      [description]="translatedSuffix()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-suffix"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.prefix' | translate"
      [description]="translatedPrefix()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-prefix"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.birthday' | translate"
      [description]="(personalInfo()?.birthdate | date: 'MM/dd/yyyy') ?? '-'"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-birthday"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.maritalStatus' | translate"
      [description]="translatedMaritalStatus()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-marital-status"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.formalAddressee' | translate"
      [description]="translatedFormalAddressee()"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-formal-addressee"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.informalAddressee' | translate"
      [description]="personalInfo()?.informalAddressee ?? '-'"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-informal-addressee"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.formalSalutation' | translate"
      [description]="personalInfo()?.formalSalutation ?? '-'"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-formal-salutation"
    >
    </ignt-list-item>
    <ignt-list-item
      class="profile-personal-info__list-item"
      [title]="'fundraising.patronDetails.profile.personalInfo.informalSalutation' | translate"
      [description]="personalInfo()?.informalSalutation ?? '-'"
      [divider]="true"
      type="unwrapped"
      data-testid="profile-personal-info-informal-salutation"
    >
    </ignt-list-item>
  </div>
</section>
