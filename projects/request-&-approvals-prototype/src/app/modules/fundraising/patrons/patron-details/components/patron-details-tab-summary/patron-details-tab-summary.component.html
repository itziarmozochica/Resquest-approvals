<div class="patron-details-tab-summary">
  <div class="patron-details-tab-summary__content-left">
    @if (importHistoryAlertEnabled && canImportHistory() && !isImportHistoryAlertDismissed()) {
      <ignt-alert
        class="patron-details-tab-summary__import-history-alert"
        showCloseButton
        [title]="'fundraising.patronDetails.importHistory.alert.title' | translate"
        (closeAlert)="onImportHistoryAlertDismissed()"
        data-testid="patron-details-tab-summary-import-history-alert"
      >
        <ng-template #igntAlertContent>
          <p class="patron-details-tab-summary__import-history-alert__description">
            {{ 'fundraising.patronDetails.importHistory.alert.description' | translateTerminology }}
          </p>
        </ng-template>
        <ng-template #igntAlertActions>
          <ignt-button
            variant="secondary"
            size="small"
            [label]="'fundraising.patronDetails.importHistory.alert.cta' | translate"
            (click)="onImportHistoryAlertClicked()"
            data-testid="patron-details-tab-summary-import-history-alert-cta"
          />
        </ng-template>
      </ignt-alert>
    }
    <!-- <app-patron-details-giving-summary [patronDetails]="patronDetails()"></app-patron-details-giving-summary> -->
    <app-patron-details-activity-timeline
      [canEdit]="canEdit()"
      [giftOfficerName]="patronDetails()?.managedBy?.name ?? ''"
      [patronEmail]="patronDetails()?.contactInfo?.email ?? ''"
      (openDialogActivity)="onOpenDialogActivity()"
    ></app-patron-details-activity-timeline>
  </div>
  <div class="patron-details-tab-summary__content-right">
    @if (canViewGivingEngagement) {
      <app-patron-details-scoring></app-patron-details-scoring>
    }
    <!-- <app-patron-details-ai></app-patron-details-ai> -->
    <app-patron-details-relationships [groupContext]="groupContext()"></app-patron-details-relationships>
  </div>
</div>
