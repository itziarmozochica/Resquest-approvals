<ignt-dialog-header>
  {{ 'fundraising.patronDetails.relationships.lifecycle.dissolve.title' | translate: { householdName: dialogData.householdName } }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="patron-rel-dissolve-household-dialog">
    <p
      class="patron-rel-dissolve-household-dialog__description"
      [innerHTML]="
        'fundraising.patronDetails.relationships.lifecycle.dissolve.subtitle'
          | translate: { householdName: dialogData.householdName, memberCount: dialogData.memberCount }
      "
    ></p>

    <div class="patron-rel-dissolve-household-dialog__options">
      @if (dialogData.canDissolveEverything) {
        <ignt-list-item
          class="patron-rel-dissolve-household-dialog__option"
          data-testid="dissolve-household-option"
          [class.patron-rel-dissolve-household-dialog__option--selected]="isSelectedMode(dissolveHouseholdModes.DISSOLVE_EVERYTHING)"
          [title]="'fundraising.patronDetails.relationships.lifecycle.dissolve.options.dissolveEverything.title' | translate"
          [description]="'fundraising.patronDetails.relationships.lifecycle.dissolve.options.dissolveEverything.description' | translate"
          [clickable]="true"
          type="unwrapped"
          (click)="onModeSelect(dissolveHouseholdModes.DISSOLVE_EVERYTHING)"
        >
          <div trailing-modifier>
            <ignt-radio [checked]="isSelectedMode(dissolveHouseholdModes.DISSOLVE_EVERYTHING)" />
          </div>
        </ignt-list-item>
        <ignt-divider [margin]="false" />
      }
      <ignt-list-item
        class="patron-rel-dissolve-household-dialog__option"
        data-testid="dissolve-household-option"
        [class.patron-rel-dissolve-household-dialog__option--selected]="isSelectedMode(dissolveHouseholdModes.DISSOLVE_HOUSEHOLD_ONLY)"
        [title]="'fundraising.patronDetails.relationships.lifecycle.dissolve.options.dissolveHouseholdOnly.title' | translate"
        [description]="'fundraising.patronDetails.relationships.lifecycle.dissolve.options.dissolveHouseholdOnly.description' | translate"
        [clickable]="true"
        type="unwrapped"
        (click)="onModeSelect(dissolveHouseholdModes.DISSOLVE_HOUSEHOLD_ONLY)"
      >
        <div trailing-modifier>
          <ignt-radio [checked]="isSelectedMode(dissolveHouseholdModes.DISSOLVE_HOUSEHOLD_ONLY)" />
        </div>
      </ignt-list-item>
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="tertiary" (click)="dismiss()">
    {{ 'common.cancel' | translate }}
  </button>
  <button type="button" igntButton [disabled]="selectedMode() === null" sentiment="primary" variant="danger" (click)="onSubmit()">
    {{ 'common.delete' | translate }}
  </button>
</ignt-dialog-footer>
