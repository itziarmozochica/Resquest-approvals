<div class="timeline">
  @if (customItems().length) {
    @for (item of customItems(); track item.id) {
      <app-timeline-item
        [activityId]="item.id"
        [activityMetadata]="item.activityMetadata"
        [customItem]="true"
        [date]="item.date"
        [iconOverride]="item.icon"
        [title]="item.subtitle"
        [titleOverride]="item.title"
      ></app-timeline-item>
    }
  } @else {
    @for (item of timelineItems(); track item.id) {
      <app-timeline-item
        [activityId]="item.id"
        [activityMetadata]="item.activityMetadata"
        [content]="item.content"
        [date]="item.relatedDatetime"
        [giftOfficerName]="giftOfficerName()"
        [orderDetailsTracking]="orderDetailsTracking()"
        [patronEmail]="patronEmail()"
        [subtype]="item.subtype"
        [title]="item.title"
        [type]="item.type"
      ></app-timeline-item>
    }
  }
</div>
