<section class="membership-actions-card wrapper-card wrapper-card--elevation-75" data-testid="membership-actions-card">
  <header class="membership-actions-card__header">
    <h3 class="membership-actions-card__title">
      {{ 'fundraising.patronDetails.memberships.actions.title' | translate }}
    </h3>
  </header>

  <ul class="membership-actions-card__list">
    @for (action of actions; track action.labelKey) {
      <li>
        <ignt-button
          class="membership-actions-card__action"
          variant="tertiary"
          sentiment="brand"
          size="small"
          [label]="action.labelKey | translate"
          [leadingIcon]="{ name: action.icon, variant: 'solid' }"
          (click)="actionSelected.emit(action.key)"
          data-testid="membership-actions-card-action"
        ></ignt-button>
      </li>
    }
  </ul>
</section>
