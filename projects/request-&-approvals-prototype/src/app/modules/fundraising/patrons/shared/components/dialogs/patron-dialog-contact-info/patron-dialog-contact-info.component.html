<ignt-dialog-header>
  {{ 'fundraising.patronDetails.profile.dialogs.contactInfo.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="patron-dialog-contact-info__sheet-content">
    <form [formGroup]="contactInfoForm" class="patron-dialog-contact-info__sheet-content__group" (ngSubmit)="submit()">
      <app-multi-select
        class="patron-dialog-contact-info__sheet-content__selectors"
        [options]="preferredContactMethodOptions()"
        [selectedOptions]="selectedPreferredContactMethod()"
        [placeholder]="'fundraising.patronDetails.profile.dialogs.contactInfo.fields.preferredContactMethod' | translate"
        [searchPlaceholder]="'common.selectsPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onContactMethodChange($event)"
        data-testid="patron-dialog-contact-info-contact-method-select"
      ></app-multi-select>

      <div class="patron-dialog-contact-info__sheet-content__field">
        <ignt-input-field
          id="email"
          formControlName="email"
          [label]="'fundraising.patronDetails.profile.dialogs.contactInfo.fields.email' | translate"
          [helperText]="'fundraising.patronDetails.profile.dialogs.contactInfo.fields.emailDisclaimer' | translate"
          data-testid="patron-dialog-contact-info-email-input"
        ></ignt-input-field>
      </div>

      <div class="patron-dialog-contact-info__sheet-content__field">
        <ignt-input-field
          id="phone"
          formControlName="phone"
          [label]="'fundraising.patronDetails.profile.dialogs.contactInfo.fields.phone' | translate"
          data-testid="patron-dialog-contact-info-phone-input"
        ></ignt-input-field>
      </div>

      <div class="patron-dialog-contact-info__sheet-content__field">
        <ignt-input-field
          id="country"
          formControlName="country"
          [label]="'fundraising.patronDetails.profile.dialogs.contactInfo.fields.country' | translate"
          data-testid="patron-dialog-contact-info-country-input"
        ></ignt-input-field>
      </div>

      <div class="patron-dialog-contact-info__sheet-content__field">
        <ignt-input-field
          id="address"
          formControlName="address"
          [label]="'fundraising.patronDetails.profile.dialogs.contactInfo.fields.address' | translate"
          data-testid="patron-dialog-contact-info-address-input"
        ></ignt-input-field>
      </div>

      <div class="patron-dialog-contact-info__sheet-content__field">
        <ignt-input-field
          id="city"
          formControlName="city"
          [label]="'fundraising.patronDetails.profile.dialogs.contactInfo.fields.city' | translate"
          data-testid="patron-dialog-contact-info-city-input"
        ></ignt-input-field>
      </div>

      <div class="patron-dialog-contact-info__sheet-content__field">
        <ignt-input-field
          id="state"
          formControlName="state"
          [label]="'fundraising.patronDetails.profile.dialogs.contactInfo.fields.state' | translate"
          data-testid="patron-dialog-contact-info-state-input"
        ></ignt-input-field>
      </div>

      <div class="patron-dialog-contact-info__sheet-content__field">
        <ignt-input-field
          id="postcode"
          formControlName="postcode"
          [label]="'fundraising.patronDetails.profile.dialogs.contactInfo.fields.postcode' | translate"
          data-testid="patron-dialog-contact-info-postcode-input"
        ></ignt-input-field>
      </div>
    </form>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button
    igntButton
    [sentiment]="'tertiary'"
    [variant]="'default'"
    [size]="'large'"
    [fill]="false"
    (click)="dismiss()"
    data-testid="patron-dialog-contact-info-cancel-button"
  >
    {{ 'common.cancel' | translate }}
  </button>
  <button
    igntButton
    [sentiment]="'primary'"
    [variant]="'default'"
    [size]="'large'"
    [fill]="false"
    [disabled]="!canSubmit()"
    (click)="submit()"
    data-testid="patron-dialog-contact-info-save-button"
  >
    {{ 'common.save' | translate }}
  </button>
</ignt-dialog-footer>
