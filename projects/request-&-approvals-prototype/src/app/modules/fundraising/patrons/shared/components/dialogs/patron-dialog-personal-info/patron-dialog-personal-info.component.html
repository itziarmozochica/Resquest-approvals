<ignt-dialog-header>
  {{ 'fundraising.patronDetails.profile.dialogs.personalInfo.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="patron-dialog-personal-info__sheet-content">
    <form [formGroup]="personalInfoForm" class="patron-dialog-personal-info__sheet-content__group" (ngSubmit)="submit()">
      <div class="patron-dialog-personal-info__sheet-content__field">
        <ignt-input-field
          id="firstName"
          formControlName="firstName"
          [label]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.firstName' | translate"
          data-testid="patron-dialog-personal-info-first-name-input"
        ></ignt-input-field>
      </div>

      <div class="patron-dialog-personal-info__sheet-content__field">
        <ignt-input-field
          id="lastName"
          formControlName="lastName"
          [label]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.lastName' | translate"
          data-testid="patron-dialog-personal-info-last-name-input"
        ></ignt-input-field>
      </div>

      <app-multi-select
        class="patron-dialog-personal-info__sheet-content__selectors"
        [options]="genderOptions()"
        [selectedOptions]="selectedGender()"
        [placeholder]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.genderOptional' | translate"
        [searchPlaceholder]="'common.selectsPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onDropdownChange('gender', $event)"
        data-testid="patron-dialog-personal-info-gender-select"
      ></app-multi-select>

      <app-multi-select
        class="patron-dialog-personal-info__sheet-content__selectors"
        [options]="educationalDegreeOptions()"
        [selectedOptions]="selectedEducationalDegree()"
        [placeholder]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.educationalDegreeOptional' | translate"
        [searchPlaceholder]="'common.selectsPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onDropdownChange('educationalDegree', $event)"
        data-testid="patron-dialog-personal-info-educational-degree-select"
      ></app-multi-select>

      <app-multi-select
        class="patron-dialog-personal-info__sheet-content__selectors"
        [options]="educationalLevelOptions()"
        [selectedOptions]="selectedEducationalLevel()"
        [placeholder]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.educationalLevelOptional' | translate"
        [searchPlaceholder]="'common.selectsPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onDropdownChange('educationalLevel', $event)"
        data-testid="patron-dialog-personal-info-educational-level-select"
      ></app-multi-select>

      <app-multi-select
        class="patron-dialog-personal-info__sheet-content__selectors"
        [options]="suffixOptions()"
        [selectedOptions]="selectedSuffix()"
        [placeholder]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.suffixOptional' | translate"
        [searchPlaceholder]="'common.selectsPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onDropdownChange('suffix', $event)"
        data-testid="patron-dialog-personal-info-suffix-select"
      ></app-multi-select>

      <app-multi-select
        class="patron-dialog-personal-info__sheet-content__selectors"
        [options]="prefixOptions()"
        [selectedOptions]="selectedPrefix()"
        [placeholder]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.prefixOptional' | translate"
        [searchPlaceholder]="'common.selectsPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onDropdownChange('prefix', $event)"
        data-testid="patron-dialog-personal-info-prefix-select"
      ></app-multi-select>

      <div class="patron-dialog-personal-info__sheet-content__field">
        <ignt-input-field
          id="birthdate"
          formControlName="birthdate"
          type="date"
          [label]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.birthday' | translate"
          data-testid="patron-dialog-personal-info-birthdate-input"
        ></ignt-input-field>
      </div>

      <app-multi-select
        class="patron-dialog-personal-info__sheet-content__selectors"
        [options]="maritalStatusOptions()"
        [selectedOptions]="selectedMaritalStatus()"
        [placeholder]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.maritalStatusOptional' | translate"
        [searchPlaceholder]="'common.selectsPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onDropdownChange('maritalStatus', $event)"
        data-testid="patron-dialog-personal-info-marital-status-select"
      ></app-multi-select>

      <app-multi-select
        class="patron-dialog-personal-info__sheet-content__selectors"
        [options]="formalAddresseeOptions()"
        [selectedOptions]="selectedFormalAddressee()"
        [placeholder]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.formalAddresseeOptional' | translate"
        [searchPlaceholder]="'common.selectsPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onDropdownChange('formalAddressee', $event)"
        data-testid="patron-dialog-personal-info-formal-addressee-select"
      ></app-multi-select>

      <div class="patron-dialog-personal-info__sheet-content__field">
        <ignt-input-field
          id="informalAddressee"
          formControlName="informalAddressee"
          [label]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.informalAddressee' | translate"
          data-testid="patron-dialog-personal-info-informal-addressee-input"
        ></ignt-input-field>
      </div>

      <div class="patron-dialog-personal-info__sheet-content__field">
        <ignt-input-field
          id="formalSalutation"
          formControlName="formalSalutation"
          [label]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.formalSalutation' | translate"
          data-testid="patron-dialog-personal-info-formal-salutation-input"
        ></ignt-input-field>
      </div>

      <div class="patron-dialog-personal-info__sheet-content__field">
        <ignt-input-field
          id="informalSalutation"
          formControlName="informalSalutation"
          [label]="'fundraising.patronDetails.profile.dialogs.personalInfo.fields.informalSalutation' | translate"
          data-testid="patron-dialog-personal-info-informal-salutation-input"
        ></ignt-input-field>
      </div>
    </form>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button
    igntButton
    [sentiment]="'tertiary'"
    [variant]="'default'"
    [size]="'large'"
    [fill]="false"
    (click)="dismiss()"
    data-testid="patron-dialog-personal-info-cancel-button"
  >
    {{ 'common.cancel' | translate }}
  </button>
  <button
    igntButton
    [sentiment]="'primary'"
    [variant]="'default'"
    [size]="'large'"
    [fill]="false"
    [disabled]="!canSubmit()"
    (click)="submit()"
    data-testid="patron-dialog-personal-info-save-button"
  >
    {{ 'common.save' | translate }}
  </button>
</ignt-dialog-footer>
