<ignt-dialog-header> Configure Smart Tips </ignt-dialog-header>

<ignt-dialog-content>
  <div class="patron-dialog-ai-config">
    <p class="patron-dialog-ai-config__description">
      Smart Tips are based on our understanding of this patron. With these suggestions, you can maximize your benefits.
    </p>
    <div class="patron-dialog-ai-config__toggle-row">
      <span class="patron-dialog-ai-config__toggle-label">I want to receive Smart Tips</span>
      <ignt-toggle id="smart-tips-toggle" [checked]="smartTipsToggle()" (change)="onToggleChange($event)" />
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="tertiary" (click)="dismiss()">Cancel</button>
  <button type="button" igntButton sentiment="primary" (click)="submit()">Accept</button>
</ignt-dialog-footer>
