<ignt-dialog-header>
  {{ 'fundraising.patronDetails.managedBy.dialog.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <form [formGroup]="managedByForm" class="dialog__content" (ngSubmit)="submit()">
    <div class="dialog__content__field">
      <label class="dialog__content__label">
        {{ 'fundraising.patronDetails.managedBy.dialog.ownerLabel' | translate }}
      </label>
      <app-multi-select
        [options]="ownerOptions()"
        [selectedOptions]="selectedOwner()"
        [placeholder]="'fundraising.patronDetails.managedBy.dialog.selectPlaceholder' | translate"
        [searchPlaceholder]="'fundraising.patronDetails.managedBy.dialog.searchPlaceholder' | translate"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        (selected)="onOwnerChange($event)"
        (searchChange)="onSearchChange($event)"
        data-testid="patron-dialog-managedby-owner-select"
      ></app-multi-select>
    </div>
    <ignt-alert
      sentiment="info"
      [showCloseButton]="false"
      [description]="'fundraising.patronDetails.managedBy.dialog.disclaimer' | translateTerminology"
    ></ignt-alert>
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button variant="tertiary" fill [label]="'common.cancel' | translate" (click)="dismiss()" [disabled]="isSubmitting()" />
  <ignt-button
    variant="primary"
    fill
    [label]="'fundraising.patronDetails.managedBy.dialog.saveButton' | translate"
    (click)="submit()"
    [disabled]="managedByForm.invalid || isSubmitting()"
  />
</ignt-dialog-footer>
