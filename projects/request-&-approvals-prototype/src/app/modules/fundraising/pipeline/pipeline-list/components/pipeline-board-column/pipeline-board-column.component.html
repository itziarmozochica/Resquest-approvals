<div class="pipeline-board-column" [attr.data-testid]="'pipeline-board-column-' + stage()">
  <div class="pipeline-board-column__header">
    <div class="pipeline-board-column__info">
      <div class="pipeline-board-column__title">
        <span class="pipeline-board-column__name">{{ 'fundraising.pipeline.stages.' + stage() | translate }}</span>
        <span class="pipeline-board-column__count" data-testid="pipeline-board-column-count">{{ opportunities().length }}</span>
      </div>
      <span class="pipeline-board-column__total" data-testid="pipeline-board-column-total">{{
        totalAmount() | currency: currencyCode() : 'symbol' : '1.0-0'
      }}</span>
    </div>
    <button
      ignt-icon-button
      type="button"
      [icon]="['fal', 'plus']"
      sentiment="secondary"
      [size]="'small'"
      [attr.aria-label]="'fundraising.pipeline.list.addToStage' | translate"
      (click)="addOpportunity.emit()"
      data-testid="pipeline-board-column-add"
    ></button>
  </div>
  <div class="pipeline-board-column__cards" cdkDropList [cdkDropListData]="opportunities()" (cdkDropListDropped)="onDropped($event)">
    @for (opportunity of opportunities(); track opportunity.id) {
      <app-pipeline-opportunity-card cdkDrag [cdkDragData]="opportunity" [opportunity]="opportunity" [currencyCode]="currencyCode()" />
    } @empty {
      <div class="pipeline-board-column__empty" data-testid="pipeline-board-column-empty">
        {{ 'fundraising.pipeline.list.emptyColumn' | translate }}
      </div>
    }
  </div>
</div>
