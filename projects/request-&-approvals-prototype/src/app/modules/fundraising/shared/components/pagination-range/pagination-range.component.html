<div class="pagination-range">
  @if (shouldShow()) {
    <span class="pagination-range__range" data-testid="pagination-range-text">
      {{ 'pagination.range' | translate: { end: endItem(), start: startItem(), total: totalCount() } }}
    </span>
    <div class="pagination-range__controls">
      <button
        type="button"
        ignt-icon-button
        class="pagination-range__button flip-rtl"
        [icon]="['fas', 'chevron-left']"
        variant="sharp"
        sentiment="tertiary"
        size="small"
        [disabled]="isPreviousDisabled()"
        (click)="onPreviousClick()"
        data-testid="pagination-range-prev"
        [attr.aria-label]="'common.previous' | translate"
      ></button>
      <button
        type="button"
        ignt-icon-button
        class="pagination-range__button flip-rtl"
        [icon]="['fas', 'chevron-right']"
        sentiment="tertiary"
        variant="sharp"
        size="small"
        [disabled]="isNextDisabled()"
        (click)="onNextClick()"
        data-testid="pagination-range-next"
        [attr.aria-label]="'common.next' | translate"
      ></button>
    </div>
  }
</div>
