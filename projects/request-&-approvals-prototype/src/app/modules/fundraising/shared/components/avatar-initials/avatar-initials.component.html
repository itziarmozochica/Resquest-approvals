@if (showAvatar()) {
  <img class="avatar-initials__avatar" [src]="avatarUrl()" [alt]="name()" (error)="onImageError()" data-testid="avatar-initials-avatar" />
} @else {
  <div class="avatar-initials__no-avatar" aria-hidden="true" data-testid="avatar-initials-initials">
    {{ initials() }}
  </div>
}
