<div class="fundraising-page-title">
  <div class="fundraising-page-title__content">
    <span class="fundraising-page-title__content__section">
      @if (sectionLink()) {
        <a class="fundraising-page-title__content__section__link" [routerLink]="sectionLink()">{{ section() }}</a>
      } @else {
        {{ section() }}
      }
      @for (item of subsections(); track item.title) {
        <span class="fundraising-page-title__content__section__separator" aria-hidden="true">/</span>
        @if (item.link) {
          <a class="fundraising-page-title__content__section__link" [queryParams]="item.queryParams" [routerLink]="item.link">{{
            item.title
          }}</a>
        } @else {
          <span>{{ item.title }}</span>
        }
      }
    </span>
    <span class="fundraising-page-title__content__title">{{ title() }}</span>
  </div>
  <div class="fundraising-page-title__actions">
    <ng-content></ng-content>
  </div>
</div>
