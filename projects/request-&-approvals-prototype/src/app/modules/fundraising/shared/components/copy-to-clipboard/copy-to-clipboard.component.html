<div class="copy-to-clipboard">
  <span class="copy-to-clipboard__label" data-testid="copy-to-clipboard-label">{{ label() }}</span>
  <button
    ignt-icon-button
    type="button"
    [icon]="['fal', 'copy']"
    sentiment="tertiary"
    [size]="'small'"
    class="copy-to-clipboard__button"
    data-testid="copy-to-clipboard-button"
    [attr.aria-label]="buttonLabelKey() | translate"
    (click)="onCopy()"
  ></button>
  <span class="copy-to-clipboard__copied" role="status">
    @if (showCopiedMessage()) {
      <span data-testid="copy-to-clipboard-copied">{{ 'copiedToClipboard' | translate }}</span>
    }
  </span>
</div>
