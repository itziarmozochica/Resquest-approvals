<div class="main-wrapper">
  <app-fundraising-page-title
    [section]="'menu.guestProfiles' | translateTerminology"
    [title]="'menu.guestProfilesSettings' | translate"
  ></app-fundraising-page-title>

  <div class="fundraising-settings">
    <ignt-tabs [variant]="'default'" [hasExtraLine]="false" [selectedIndex]="activeTabIndex()" (selectedIndexChange)="onTabChange($event)">
      @for (tab of tabs; track tab.id) {
        <ignt-tabs-item [label]="tab.label | translate">
          @if (activeTab() === tab.id && tab.id === 'tags') {
            <div class="fundraising-settings__tags-content">
              <app-manual-tags-list></app-manual-tags-list>
              <app-computed-tags-list></app-computed-tags-list>
            </div>
          } @else if (activeTab() === tab.id && tab.id === 'terminology') {
            <div class="fundraising-settings__tags-content fundraising-settings__tags-content--full">
              <app-terminology-presets-list></app-terminology-presets-list>
            </div>
          }
        </ignt-tabs-item>
      }
    </ignt-tabs>
  </div>
</div>
