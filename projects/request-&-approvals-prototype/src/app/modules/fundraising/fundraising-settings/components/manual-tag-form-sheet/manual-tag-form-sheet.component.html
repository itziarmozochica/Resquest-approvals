<ignt-dialog-header>{{ sheetTitle() }}</ignt-dialog-header>

<ignt-dialog-content>
  <form class="manual-tag-form-sheet" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="manual-tag-form-sheet__fields">
      <div class="manual-tag-form-sheet__field">
        <ignt-input-field
          id="tagName"
          formControlName="name"
          [label]="'fundraising.settings.manualTags.form.tagName' | translate"
          [customFormErrors]="nameFormErrors()"
          data-testid="tag-name-input"
        ></ignt-input-field>
      </div>

      <div class="manual-tag-form-sheet__field">
        <ignt-textarea-field
          id="tagDescription"
          formControlName="description"
          [label]="descriptionLabel()"
          [rows]="3"
          data-testid="tag-description-input"
        ></ignt-textarea-field>
      </div>
    </div>
  </form>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  @if (isEditMode()) {
    <button
      igntButton
      type="button"
      [variant]="'danger'"
      [sentiment]="'tertiary'"
      [size]="'large'"
      [fill]="true"
      (click)="onDelete()"
      data-testid="delete-tag-button"
    >
      {{ 'fundraising.settings.manualTags.form.deleteTag' | translate }}
    </button>
    <button
      igntButton
      type="button"
      [sentiment]="'primary'"
      [size]="'large'"
      [fill]="true"
      (click)="onSubmit()"
      data-testid="save-tag-button"
    >
      {{ 'fundraising.settings.manualTags.form.saveChanges' | translate }}
    </button>
  } @else {
    <button
      igntButton
      type="button"
      [sentiment]="'tertiary'"
      [size]="'large'"
      [fill]="true"
      (click)="onCancel()"
      data-testid="cancel-tag-button"
    >
      {{ 'common.cancel' | translate }}
    </button>
    <button
      igntButton
      type="button"
      [sentiment]="'primary'"
      [size]="'large'"
      [fill]="true"
      (click)="onSubmit()"
      data-testid="create-tag-button"
    >
      {{ 'fundraising.settings.manualTags.form.createTag' | translate }}
    </button>
  }
</ignt-dialog-footer>
