<form [formGroup]="formGroup" class="create-hub-form">
  <div class="lateral-slider-body__wrapper">
    <p class="create-hub-form__instructions">{{ 'assetsHubs.creationSliderInstructions' | translate }}</p>

    <div class="form-group" [class.form-group--error]="formGroup.controls.hubName.invalid && formGroup.controls.hubName.touched">
      <div class="section-info">
        <label class="section-info__title">{{ 'assetsHubs.creationForm.nameSectionTitle' | translate }}</label>
        <p class="section-info__content">{{ 'assetsHubs.creationForm.nameSectionInstructions' | translate }}</p>
      </div>
      <label class="cell field">
        <input
          class="field__input"
          type="text"
          data-testid="create-hub-name-input"
          formControlName="hubName"
          autocomplete="off"
          [readonly]="isSubmitting()"
          [placeholder]="'assetsHubs.creationForm.nameInputPlaceholder' | translate"
        />
        <span class="field__label">{{ 'assetsHubs.creationForm.nameInputTitle' | translate }} *</span>
      </label>
    </div>

    <hr class="create-hub-form__separator" />

    <div class="form-group">
      <div class="section-info">
        <label class="section-info__title">{{ 'assetsHubs.creationForm.venueSectionTitle' | translate }}</label>
        <p class="section-info__content">{{ 'assetsHubs.creationForm.venueSectionInstructions' | translate }}</p>
      </div>
      <ignt-alert [description]="'assetsHubs.creationForm.venueBanner' | translate"></ignt-alert>
      <ignt-typeahead
        id="create-hub-city"
        data-testid="create-hub-city-input"
        [disabled]="isSubmitting()"
        [emptyLabel]="'filters.city' | translate"
        [fieldLabel]="'filters.city' | translate"
        [minSearchLength]="1"
        [options]="cityOptions()"
        [editable]="true"
        [refreshTrigger]="cityTypeaheadRefresh$"
        [selectedOption]="selectedCity() ?? undefined"
        (inputInteraction)="onCitySearch($event)"
        (scrollToEnd)="onCityScrollToEnd()"
        (selected)="onCitySelected($event)"
      ></ignt-typeahead>
      <ignt-typeahead
        id="create-hub-venue"
        data-testid="create-hub-venue-input"
        [disabled]="isSubmitting() || selectedCity() === null"
        [emptyLabel]="'filters.venue' | translate"
        [fieldLabel]="'filters.venue' | translate"
        [minSearchLength]="1"
        [options]="venueOptions()"
        [editable]="true"
        [refreshTrigger]="venueTypeaheadRefresh$"
        [selectedOption]="selectedVenue() ?? undefined"
        (inputInteraction)="onVenueSearch($event)"
        (scrollToEnd)="onVenueScrollToEnd()"
        (selected)="onVenueSelected($event)"
      ></ignt-typeahead>
    </div>
  </div>

  <div class="lateral-slider-body__footer create-hub-form__footer">
    <ignt-button
      data-testid="create-hub-submit"
      variant="primary"
      size="large"
      fill
      [loading]="isSubmitting()"
      [disabled]="formGroup.invalid || isSubmitting()"
      [label]="'assetsHubs.creationForm.submit' | translate"
      (click)="onSave()"
    />
    <ignt-button
      data-testid="create-hub-cancel"
      variant="tertiary"
      size="large"
      fill
      [disabled]="isSubmitting()"
      [label]="'common.discard' | translate"
      (click)="onDiscard()"
    />
  </div>
</form>
