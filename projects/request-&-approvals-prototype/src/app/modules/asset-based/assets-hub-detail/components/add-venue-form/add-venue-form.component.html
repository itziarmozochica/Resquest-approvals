<form [formGroup]="formGroup" class="add-venue-form">
  <div class="lateral-slider-body__wrapper">
    <div class="form-group">
      <div class="section-info">
        <label class="section-info__title">{{ 'assetsHubs.detail.addVenueForm.sectionTitle' | translate }}</label>
        <p class="section-info__content">{{ 'assetsHubs.detail.addVenueForm.description' | translate }}</p>
      </div>
      <ignt-alert [description]="'assetsHubs.creationForm.venueBanner' | translate"></ignt-alert>
      <ignt-typeahead
        id="add-venue-city"
        data-testid="add-venue-city-input"
        [disabled]="isSubmitting() || isCityPreselected()"
        [emptyLabel]="'filters.city' | translate"
        [fieldLabel]="'filters.city' | translate"
        [minSearchLength]="1"
        [options]="cityOptions()"
        [editable]="true"
        [refreshTrigger]="cityTypeaheadRefresh$"
        [selectedOption]="selectedCity() ?? undefined"
        (inputInteraction)="onCitySearch($event)"
        (scrollToEnd)="onCityScrollToEnd()"
        (selected)="onCitySelected($event)"
      ></ignt-typeahead>
      <ignt-typeahead
        id="add-venue-venue"
        data-testid="add-venue-venue-input"
        [disabled]="isSubmitting() || selectedCity() === null"
        [emptyLabel]="'filters.venue' | translate"
        [fieldLabel]="'filters.venue' | translate"
        [minSearchLength]="1"
        [options]="venueOptions()"
        [editable]="true"
        [refreshTrigger]="venueTypeaheadRefresh$"
        [selectedOption]="selectedVenue() ?? undefined"
        (inputInteraction)="onVenueSearch($event)"
        (scrollToEnd)="onVenueScrollToEnd()"
        (selected)="onVenueSelected($event)"
      ></ignt-typeahead>
      <p class="add-venue-form__helper-text">{{ 'assetsHubs.detail.addVenueForm.helperText' | translate }}</p>
    </div>
  </div>

  <div class="lateral-slider-body__footer add-venue-form__footer">
    <ignt-button
      data-testid="add-venue-submit"
      variant="primary"
      size="large"
      fill
      [loading]="isSubmitting()"
      [disabled]="formGroup.invalid || isSubmitting()"
      [label]="'assetsHubs.detail.addVenueForm.submit' | translate"
      (click)="onSave()"
    />
    <ignt-button
      data-testid="add-venue-cancel"
      variant="tertiary"
      size="large"
      fill
      [disabled]="isSubmitting()"
      [label]="'common.discard' | translate"
      (click)="onDiscard()"
    />
  </div>
</form>
