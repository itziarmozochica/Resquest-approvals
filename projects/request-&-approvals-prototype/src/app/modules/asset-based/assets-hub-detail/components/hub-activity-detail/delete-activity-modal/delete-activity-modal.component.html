<ignt-dialog-header data-testid="delete-activity-modal-title">
  {{ 'assetsHubs.detail.activities.deleteConfirmTitle' | translate: { name: data.activityName } }}
</ignt-dialog-header>

<ignt-dialog-content class="delete-activity-modal__body">
  <p class="delete-activity-modal__warning">
    <ignt-icon name="circle-exclamation" variant="light"></ignt-icon>
    {{ 'assetsHubs.detail.activities.deleteConfirmMessage' | translate }}
  </p>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <div class="delete-activity-modal__footer">
    <button type="button" class="delete-activity-modal__link" [igntDialogClose]="undefined">
      {{ 'assetsHubs.detail.activities.deleteConfirmCancel' | translate }}
    </button>
    <button
      igntButton
      type="button"
      variant="danger"
      sentiment="primary"
      size="small"
      [disabled]="isDeleting()"
      [loading]="isDeleting()"
      data-testid="confirm-delete-activity"
      (click)="onConfirmDelete()"
    >
      {{ 'assetsHubs.detail.activities.deleteConfirmAccept' | translate }}
    </button>
  </div>
</ignt-dialog-footer>
