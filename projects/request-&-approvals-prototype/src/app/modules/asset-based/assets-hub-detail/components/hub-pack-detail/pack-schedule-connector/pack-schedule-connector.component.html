<div class="pack-schedule-connector" [class.pack-schedule-connector--branch]="isBranch()" data-testid="pack-schedule-connector">
  <span class="pack-schedule-connector__stem" aria-hidden="true"></span>

  <form class="pack-schedule-connector__body" [formGroup]="formGroup">
    <p class="pack-schedule-connector__label">
      {{ 'assetsHubs.detail.packs.schedule.startsAfterStep' | translate: { step: predecessorLabel() } }}
    </p>

    <div class="pack-schedule-connector__inputs">
      <ignt-input-field
        [id]="'pack-schedule-edge-min-' + successorLocalId()"
        type="number"
        [formControl]="formGroup.controls.minMinutesBefore"
        [label]="'assetsHubs.detail.packs.schedule.minGapLabel' | translate"
        data-testid="pack-schedule-edge-min"
      ></ignt-input-field>
      <ignt-input-field
        [id]="'pack-schedule-edge-max-' + successorLocalId()"
        type="number"
        [formControl]="formGroup.controls.maxMinutesBefore"
        [label]="'assetsHubs.detail.packs.schedule.maxGapLabel' | translate"
        data-testid="pack-schedule-edge-max"
      ></ignt-input-field>
    </div>

    <!-- Always rendered, so `aria-describedby` has a target before the first defect does. -->
    <div [id]="errorId()">
      @for (messageKey of messageKeys(); track messageKey) {
        <p class="pack-schedule-connector__error" data-testid="pack-schedule-edge-error">{{ messageKey | translate }}</p>
      }
    </div>
  </form>

  <span class="pack-schedule-connector__stem pack-schedule-connector__stem--arrow" aria-hidden="true"></span>
</div>
