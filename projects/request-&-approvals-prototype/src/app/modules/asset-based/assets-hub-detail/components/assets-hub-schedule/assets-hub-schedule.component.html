<div class="assets-hub-schedule">
  @if (isLoading()) {
    <div class="assets-hub-schedule__skeleton">
      <ignt-skeleton-base [height]="24" width="240px" [animation]="true"></ignt-skeleton-base>
      <ignt-skeleton-base [height]="320" width="100%" [animation]="true"></ignt-skeleton-base>
    </div>
  } @else if (hasLoadFailed()) {
    <div class="assets-hub-schedule__load-error" data-testid="schedule-load-error">
      <ignt-alert
        sentiment="danger"
        [title]="'assetsHubs.detail.schedule.loadFailedTitle' | translate"
        [description]="'assetsHubs.detail.schedule.loadFailedDescription' | translate"
      ></ignt-alert>
      <ignt-button
        sentiment="brand"
        variant="secondary"
        size="large"
        [label]="'assetsHubs.detail.schedule.retry' | translate"
        data-testid="schedule-retry"
        (click)="reload()"
      ></ignt-button>
    </div>
  } @else {
    <app-schedule-week-editor
      [weekly]="schedule().weekly"
      [canManage]="canManageHub()"
      [isSaving]="isSavingWeekly()"
      (weeklySubmitted)="saveWeekly($event)"
    ></app-schedule-week-editor>

    <app-schedule-special-days
      [schedule]="schedule()"
      [canManage]="canManageHub()"
      [datesFrom]="specialDaysRange.from"
      [datesTo]="specialDaysRange.to"
      [isSaving]="isSavingSpecialDay()"
      (specialDaySubmitted)="saveSpecialDay($event)"
      (specialDayDeleted)="deleteSpecialDay($event)"
    ></app-schedule-special-days>
  }
</div>
