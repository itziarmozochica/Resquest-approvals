<ignt-dialog-header data-testid="unsaved-changes-modal-title">
  {{ data.title | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p data-testid="unsaved-changes-modal-message">
    {{ data.message | translate }}
  </p>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button
    type="button"
    igntButton
    sentiment="secondary"
    [fill]="true"
    data-testid="unsaved-changes-modal-cancel-button"
    [igntDialogClose]="false"
  >
    {{ data.cancel | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    variant="danger"
    [fill]="true"
    data-testid="unsaved-changes-modal-accept-button"
    [igntDialogClose]="true"
  >
    {{ data.confirm | translate }}
  </button>
</ignt-dialog-footer>
