<ignt-dialog-header data-testid="delete-asset-modal-title">
  {{ 'assetsHubs.detail.assets.deleteConfirmTitle' | translate: { name: data.assetName } }}
</ignt-dialog-header>

<ignt-dialog-content class="delete-asset-modal__body">
  <p class="delete-asset-modal__warning">
    <ignt-icon name="circle-exclamation" variant="light"></ignt-icon>
    {{ 'assetsHubs.detail.assets.deleteConfirmMessage' | translate }}
  </p>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <div class="delete-asset-modal__footer">
    <button type="button" class="delete-asset-modal__link" [igntDialogClose]="undefined">
      {{ 'assetsHubs.detail.assets.deleteConfirmCancel' | translate }}
    </button>
    <button
      igntButton
      type="button"
      variant="danger"
      sentiment="primary"
      size="small"
      [disabled]="isDeleting()"
      [loading]="isDeleting()"
      data-testid="confirm-delete-asset"
      (click)="onConfirmDelete()"
    >
      {{ 'assetsHubs.detail.assets.deleteConfirmAccept' | translate }}
    </button>
  </div>
</ignt-dialog-footer>
