<ignt-dialog-header data-testid="pack-schedule-preview-modal-title">{{ data.packName }}</ignt-dialog-header>

<ignt-dialog-content class="pack-schedule-preview-modal__body">
  <app-pack-schedule-preview [preview]="preview"></app-pack-schedule-preview>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <div class="pack-schedule-preview-modal__footer">
    <ignt-button
      [label]="'assetsHubs.detail.packs.preview.close' | translate"
      variant="tertiary"
      size="small"
      [igntDialogClose]="undefined"
      data-testid="pack-schedule-preview-close"
    ></ignt-button>
    @if (data.canEditPack) {
      <ignt-button
        [label]="'assetsHubs.detail.packs.preview.editPack' | translate"
        variant="primary"
        size="small"
        data-testid="pack-schedule-preview-edit"
        (click)="onEditPack()"
      ></ignt-button>
    }
  </div>
</ignt-dialog-footer>
