<ignt-dialog-header data-testid="hub-delete-modal-title">
  {{ 'assetsHubs.detail.deleteHubModal.title' | translate: { name: data.hubName } }}
</ignt-dialog-header>

<ignt-dialog-content class="delete-hub-modal__body">
  <p class="delete-hub-modal__lead">{{ 'assetsHubs.detail.deleteHubModal.allowedLead' | translate }}</p>
  <p class="delete-hub-modal__text">{{ 'assetsHubs.detail.deleteHubModal.allowedBody' | translate }}</p>
  <p class="delete-hub-modal__warning">
    <ignt-icon name="circle-exclamation" variant="light"></ignt-icon>
    {{ 'assetsHubs.detail.deleteHubModal.cannotUndo' | translate }}
  </p>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <div class="delete-hub-modal__footer">
    <button type="button" class="delete-hub-modal__link" [igntDialogClose]="undefined">
      {{ 'assetsHubs.detail.deleteHubModal.stayOnPage' | translate }}
    </button>
    <button
      igntButton
      type="button"
      variant="danger"
      sentiment="primary"
      [disabled]="isDeleting()"
      [loading]="isDeleting()"
      data-testid="confirm-delete-hub"
      (click)="onConfirmDelete()"
    >
      {{ 'assetsHubs.detail.deleteHubModal.confirmDelete' | translate }}
    </button>
  </div>
</ignt-dialog-footer>
