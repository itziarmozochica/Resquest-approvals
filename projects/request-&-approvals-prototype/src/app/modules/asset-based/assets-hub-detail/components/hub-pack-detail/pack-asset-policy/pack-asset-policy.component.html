<div class="pack-asset-policy" [class.pack-asset-policy--row]="layout() === 'row'" data-testid="pack-asset-policy">
  <ignt-radio-group class="pack-asset-policy__group" [formControl]="control()">
    @for (option of options; track option.policy) {
      <ignt-list-item
        class="pack-asset-policy__card"
        [class.pack-asset-policy__card--selected]="selectedPolicy() === option.policy"
        [title]="option.labelKey | translate"
        [description]="option.descriptionKey | translate"
        [selected]="selectedPolicy() === option.policy"
        [leadingIconTemplate]="policyRadio"
        [attr.data-testid]="option.testId"
        (click)="policySelect.emit(option.policy)"
      >
        <ng-template #policyRadio>
          <ignt-radio [value]="option.policy" name="repeatedActivityAssetPolicy"></ignt-radio>
        </ng-template>
      </ignt-list-item>
    }
  </ignt-radio-group>
</div>
