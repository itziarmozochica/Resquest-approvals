<div class="venues-tab__header">
  <p class="hub-tab__description" translate>assetsHubs.detail.venues.description</p>
  @if (canManageHub()) {
    <ignt-button
      variant="primary"
      size="large"
      data-testid="assign-venue-button"
      [label]="'assetsHubs.detail.actions.assignVenue' | translate"
      (click)="assignVenueRequested.emit()"
    ></ignt-button>
  }
</div>

@if (!isLoading() && venues().length === 0) {
  <div class="venues-tab__empty" translate>assetsHubs.detail.venues.empty</div>
} @else {
  <ignt-table
    data-testid="venues-table"
    [data]="venues()"
    [hasServerSideSorting]="true"
    [isLoading]="isLoading()"
    [sorting]="sorting()"
    (sortingChange)="onSortingChange($event)"
  >
    <ignt-table-column
      key="name"
      columnType="primary"
      [header]="'assetsHubs.detail.venues.name' | translate"
      [sortable]="true"
    ></ignt-table-column>

    <ignt-table-column
      key="cityName"
      columnType="secondary"
      [header]="'assetsHubs.detail.venues.city' | translate"
      [sortable]="true"
    ></ignt-table-column>

    <ignt-table-column key="address" columnType="secondary" [header]="'assetsHubs.detail.venues.address' | translate"></ignt-table-column>

    @if (canManageHub()) {
      <ignt-table-column columnType="action" [header]="'assetsHubs.detail.venues.unassign' | translate">
        <ng-template [igntTableColumnTemplateType]="venues()[0]" let-item="item">
          <button
            igntButton
            sentiment="tertiary"
            class="venues-tab__unassign-btn"
            [disabled]="!canUnassignVenue()"
            [title]="'assetsHubs.detail.venues.unassign' | translate"
            [attr.aria-label]="'assetsHubs.detail.venues.unassign' | translate"
            (click)="onUnassignVenue(item)"
          >
            <ignt-icon name="unlink" variant="regular"></ignt-icon>
          </button>
        </ng-template>
      </ignt-table-column>
    }
  </ignt-table>
}
