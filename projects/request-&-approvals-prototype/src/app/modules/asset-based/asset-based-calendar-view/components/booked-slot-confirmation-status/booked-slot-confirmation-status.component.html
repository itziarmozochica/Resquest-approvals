<ignt-tag
  [class]="cssClass()"
  [attr.data-testid]="dataTestId()"
  [attr.title]="hasHiddenFullLabel() ? (translationKey() | translate) : null"
  [sentiment]="sentiment()"
  [variant]="'outline'"
  [startIcon]="icon()"
>
  <!-- Exposing both labels has a screen reader announce "Pending Pending confirmation". -->
  @if (visibleTranslationKey(); as key) {
    <span data-testid="booked-slot-confirmation-status-label" [attr.aria-hidden]="hasHiddenFullLabel() ? 'true' : null">
      {{ key | translate }}
    </span>
  }
  @if (hasHiddenFullLabel()) {
    <span class="visually-hidden">{{ translationKey() | translate }}</span>
  }
</ignt-tag>
