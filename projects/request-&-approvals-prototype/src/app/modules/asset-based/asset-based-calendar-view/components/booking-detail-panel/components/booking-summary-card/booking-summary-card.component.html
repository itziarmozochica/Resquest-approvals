<ignt-wrapper-card [type]="'default'">
  <div class="booking-summary-card" data-testid="booked-slot-details-info-grid">
    <div class="booking-summary-card__row">
      <ignt-icon [name]="channelIconName()" variant="light" class="booking-summary-card__icon"></ignt-icon>
      <span class="booking-summary-card__value">{{ channelLabelKey() | translate }}</span>
    </div>

    <div class="booking-summary-card__row">
      <ignt-icon name="clock" variant="light" class="booking-summary-card__icon"></ignt-icon>
      <span class="booking-summary-card__value booking-summary-card__value--strong">{{ timeRange() }}</span>
      <span class="booking-summary-card__value booking-summary-card__value--muted">· {{ timeDuration() }}</span>
    </div>

    @if (showEmail()) {
      <ignt-divider [margin]="false"></ignt-divider>

      <div class="booking-summary-card__row">
        <ignt-icon name="envelope" variant="light" class="booking-summary-card__icon"></ignt-icon>
        <span class="booking-summary-card__value">{{ email() }}</span>
      </div>
    }
  </div>
</ignt-wrapper-card>
