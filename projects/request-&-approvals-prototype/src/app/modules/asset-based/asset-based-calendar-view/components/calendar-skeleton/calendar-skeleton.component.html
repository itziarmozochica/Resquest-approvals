<span class="visually-hidden">{{ 'common.loading' | translate }}</span>
<div class="calendar-skeleton__grid" aria-hidden="true">
  <div class="calendar-skeleton__header">
    <div class="calendar-skeleton__corner"></div>
    @for (column of columns; track $index) {
      <div class="calendar-skeleton__asset-name" data-testid="calendar-skeleton-asset-name">
        <ignt-skeleton-base class="calendar-skeleton__asset-name-bar" width="100%" [animation]="true" [height]="20"></ignt-skeleton-base>
      </div>
    }
  </div>
  <div class="calendar-skeleton__body">
    <div class="calendar-skeleton__hours">
      @for (hour of hours; track $index) {
        <div class="calendar-skeleton__hour">
          <ignt-skeleton-base [animation]="true" [height]="20" width="2.5rem"></ignt-skeleton-base>
        </div>
      }
    </div>
    @for (column of columns; track $index) {
      <div class="calendar-skeleton__column" data-testid="calendar-skeleton-column">
        @for (block of column.blocks; track $index) {
          <ignt-skeleton-base
            class="calendar-skeleton__block"
            data-testid="calendar-skeleton-block"
            width="100%"
            [animation]="true"
            [height]="block.heightPx"
            [style.inset-block-start.px]="block.offsetPx"
          ></ignt-skeleton-base>
        }
      </div>
    }
  </div>
</div>
