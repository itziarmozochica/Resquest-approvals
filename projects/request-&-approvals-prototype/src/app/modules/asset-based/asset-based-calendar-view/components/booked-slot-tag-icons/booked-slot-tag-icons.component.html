@for (tag of iconTags(); track tag.id) {
  <ignt-icon
    class="booked-slot-tag-icons__icon booked-slot-tag-icons__icon--{{ colorOf(tag.color) }}"
    data-testid="booked-slot-tag-icon"
    igntTooltip
    role="img"
    size="caption"
    [attr.aria-label]="tag.name"
    [name]="tag.icon"
    [tooltipLabel]="tag.name"
    [variant]="iconVariant"
  />
}
