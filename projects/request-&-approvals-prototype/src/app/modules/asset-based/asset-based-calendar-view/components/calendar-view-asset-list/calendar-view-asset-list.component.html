<div class="calendar-view-asset-list" data-testid="calendar-view-asset-list">
  <app-vertical-draggable-list
    [boundarySelector]="boundarySelector()"
    [items]="rows()"
    [itemTemplate]="assetRow"
    [moveDownLabel]="'bookedSlots.calendarViewPanel.moveAssetDown' | translate"
    [moveUpLabel]="'bookedSlots.calendarViewPanel.moveAssetUp' | translate"
    [placeholderHeight]="rowPlaceholderHeight"
    [showItemOrder]="true"
    [showReorderButtons]="true"
    (itemsReordered)="onRowsReordered($event)"
  ></app-vertical-draggable-list>
</div>

<ng-template #assetRow let-row>
  <ignt-list-item
    type="unwrapped"
    [attr.data-testid]="'calendar-view-asset-row-' + row.id"
    [description]="row.capacityLabelKey | translate: row.capacityLabelParams"
    [title]="row.name"
  ></ignt-list-item>
</ng-template>
