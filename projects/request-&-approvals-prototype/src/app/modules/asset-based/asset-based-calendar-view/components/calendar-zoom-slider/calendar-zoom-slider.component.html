<div class="calendar-zoom-slider">
  <div class="calendar-zoom-slider__track" (pointerdown)="onTrackPointerDown($event)" (pointermove)="onTrackPointerMove($event)">
    <div #rail class="calendar-zoom-slider__rail">
      <div
        #thumb
        class="calendar-zoom-slider__thumb"
        role="slider"
        tabindex="0"
        data-testid="calendar-zoom-slider-thumb"
        [attr.aria-label]="label()"
        [attr.aria-valuemax]="stepCount() - 1"
        [attr.aria-valuemin]="0"
        [attr.aria-valuenow]="index()"
        [attr.aria-valuetext]="valueText()"
        [style.inset-inline-start.%]="thumbOffsetPercent()"
        (keydown)="onThumbKeydown($event)"
      ></div>
    </div>
  </div>
</div>
