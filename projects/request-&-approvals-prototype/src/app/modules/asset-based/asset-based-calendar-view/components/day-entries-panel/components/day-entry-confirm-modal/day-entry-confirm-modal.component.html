<ignt-dialog-header data-testid="day-entry-confirm-modal-title">{{ data.titleKey | translate }}</ignt-dialog-header>

<ignt-dialog-content class="day-entry-confirm-modal__body">
  <p class="day-entry-confirm-modal__text">{{ data.messageKey | translate }}</p>
  @if (data.isDestructive) {
    <p class="day-entry-confirm-modal__warning">
      <ignt-icon name="circle-exclamation" variant="light"></ignt-icon>
      {{ 'bookedSlots.dayEntries.confirm.cannotUndo' | translate }}
    </p>
  }
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    variant="tertiary"
    fill
    [igntDialogClose]="undefined"
    [label]="'common.cancel' | translate"
    data-testid="day-entry-confirm-cancel"
  />
  <ignt-button
    variant="primary"
    fill
    [sentiment]="data.isDestructive ? 'danger' : 'brand'"
    [label]="data.acceptLabelKey | translate"
    (click)="onConfirm()"
    data-testid="day-entry-confirm-accept"
  />
</ignt-dialog-footer>
