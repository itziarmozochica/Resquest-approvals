<div class="calendar-date-nav">
  <button
    ignt-icon-button
    type="button"
    class="calendar-date-nav__step"
    sentiment="tertiary"
    size="medium"
    data-testid="calendar-date-nav-previous"
    [attr.aria-label]="(isWeekly() ? 'bookedSlots.calendarToolbar.previousWeek' : 'bookedSlots.calendarToolbar.previousDay') | translate"
    [disabled]="isDisabled()"
    [icon]="previousIcon"
    (click)="previous.emit()"
  ></button>
  <button
    ignt-icon-button
    type="button"
    class="calendar-date-nav__step"
    sentiment="tertiary"
    size="medium"
    data-testid="calendar-date-nav-next"
    [attr.aria-label]="(isWeekly() ? 'bookedSlots.calendarToolbar.nextWeek' : 'bookedSlots.calendarToolbar.nextDay') | translate"
    [disabled]="isDisabled()"
    [icon]="nextIcon"
    (click)="next.emit()"
  ></button>
  <span class="calendar-date-nav__label">
    <ignt-button
      class="calendar-date-nav__date"
      size="large"
      variant="tertiary"
      sentiment="neutral"
      data-testid="calendar-date-nav-label"
      [ariaLabel]="'bookedSlots.calendarToolbar.pickDate' | translate: { date: label() }"
      [disabled]="isDisabled()"
      [label]="label()"
      (click)="onLabelClick()"
    ></ignt-button>
    <ignt-native-date-input
      class="calendar-date-nav__picker"
      aria-hidden="true"
      testId="calendar-date-nav-picker"
      [disabled]="isDisabled()"
      [value]="pickerValue()"
      (valueChange)="onPicked($event)"
    ></ignt-native-date-input>
  </span>
</div>
