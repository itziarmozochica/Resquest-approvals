<ignt-dialog-header data-testid="quick-block-modal-title">
  {{ 'bookedSlots.quickBlock.modalTitle' | translate }}
</ignt-dialog-header>

<ignt-dialog-content class="quick-block-modal__body">
  <p class="quick-block-modal__target" data-testid="quick-block-modal-target">
    <span class="quick-block-modal__asset">{{ data.assetName }}</span>
    <span class="quick-block-modal__window">{{ data.windowLabel }}</span>
  </p>

  <ignt-typeahead
    class="quick-block-modal__reason"
    [fieldLabel]="'bookedSlots.blockTimePanel.reasonLabel' | translate"
    [options]="reasonOptions"
    [selectedOption]="selectedReasonOption()"
    [emptyLabel]="'bookedSlots.blockTimePanel.reasonPlaceholder' | translate"
    [container]="'body'"
    [isInDialog]="true"
    (selected)="onReasonChange($event)"
    data-testid="quick-block-reason-selector"
  ></ignt-typeahead>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <div class="quick-block-modal__footer">
    <ignt-button variant="tertiary" [igntDialogClose]="undefined" [label]="'common.cancel' | translate" data-testid="quick-block-cancel" />
    <ignt-button
      [disabled]="!selectedReasonOption()"
      [label]="'bookedSlots.quickBlock.confirm' | translate"
      (click)="onConfirm()"
      data-testid="quick-block-confirm"
    />
  </div>
</ignt-dialog-footer>
