@for (tag of visibleTags(); track tag.id) {
  <app-tag-chip data-testid="booked-slot-tag-chip" igntTooltip [tag]="tag" [tooltipLabel]="tag.name" />
}

@if (hiddenTags().length > 0) {
  <!-- A bare span has no role, so without one the label is dropped; the names are only on this badge. -->
  <span
    class="booked-slot-tag-chips__overflow"
    data-testid="booked-slot-tag-chip-overflow"
    igntTooltip
    role="img"
    tabindex="0"
    [attr.aria-label]="hiddenNames()"
    [tooltipLabel]="hiddenNames()"
    >+{{ hiddenTags().length }}</span
  >
}
