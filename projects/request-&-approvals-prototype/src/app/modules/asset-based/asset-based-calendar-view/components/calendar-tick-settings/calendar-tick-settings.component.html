@if (triggerVisible()) {
  <div class="calendar-tick-settings" data-testid="calendar-tick-control">
    <button
      ignt-icon-button
      type="button"
      size="small"
      sentiment="tertiary"
      class="calendar-tick-settings__zoom"
      [icon]="['fas', 'minus']"
      [disabled]="!canZoomOut"
      (click)="onZoomOut()"
      [attr.aria-label]="'bookedSlots.tickControl.zoomOutLabel' | translate"
      [title]="'bookedSlots.tickControl.zoomOutLabel' | translate"
      data-testid="calendar-tick-zoom-out"
    ></button>

    <ignt-button-dropdown
      class="calendar-tick-settings__resolution"
      size="small"
      sentiment="tertiary"
      [autoWidth]="true"
      [options]="resolutionOptions"
      (optionClick)="onResolutionSelected($event)"
      [attr.aria-label]="'bookedSlots.tickControl.resolutionLabel' | translate"
      data-testid="calendar-tick-resolution"
    >
      <span class="calendar-tick-settings__resolution-label">{{ currentResolutionLabel }}</span>
    </ignt-button-dropdown>

    <button
      ignt-icon-button
      type="button"
      size="small"
      sentiment="tertiary"
      class="calendar-tick-settings__zoom"
      [icon]="['fas', 'plus']"
      [disabled]="!canZoomIn"
      (click)="onZoomIn()"
      [attr.aria-label]="'bookedSlots.tickControl.zoomInLabel' | translate"
      [title]="'bookedSlots.tickControl.zoomInLabel' | translate"
      data-testid="calendar-tick-zoom-in"
    ></button>
  </div>
}
