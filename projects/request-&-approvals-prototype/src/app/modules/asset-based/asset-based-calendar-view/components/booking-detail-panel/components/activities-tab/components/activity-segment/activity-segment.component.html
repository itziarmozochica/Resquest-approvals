<div class="activity-segment">
  <div class="activity-segment__rail">
    <span class="activity-segment__number" data-testid="activity-segment-number">{{ segment().position }}</span>
    <span class="activity-segment__rail-line"></span>
  </div>

  <div class="activity-segment__content" [class.activity-segment__content--parallel]="segment().isParallel">
    @if (segment().isParallel) {
      <div class="activity-segment__parallel-header" data-testid="activity-segment-parallel-header">
        <ignt-icon name="split" variant="solid" class="activity-segment__parallel-icon"></ignt-icon>
        <span>{{ 'bookedSlots.inParallelStartAt' | translate: { time: segment().startTime } }}</span>
      </div>
    }

    @for (row of segment().rows; track row.key) {
      <app-activity-row [row]="row" (locateAsset)="locateAsset.emit($event)" (moveAsset)="moveAsset.emit($event)"></app-activity-row>
    }
  </div>
</div>
