<ignt-dialog-header data-testid="delete-booked-slot-modal-title">
  {{ 'bookedSlots.deleteBookedSlotModal.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content class="delete-booked-slot-modal__body">
  <p class="delete-booked-slot-modal__text" data-testid="delete-booked-slot-modal-message">
    {{ 'bookedSlots.deleteBookedSlotModal.message' | translate: data }}
  </p>

  <p class="delete-booked-slot-modal__text" data-testid="delete-booked-slot-modal-order-untouched">
    {{ 'bookedSlots.deleteBookedSlotModal.orderUntouched' | translate }}
  </p>

  <p class="delete-booked-slot-modal__warning" data-testid="delete-booked-slot-modal-booked-again">
    <ignt-icon name="circle-exclamation" variant="light"></ignt-icon>
    {{ 'bookedSlots.deleteBookedSlotModal.bookedAgainOnChange' | translate }}
  </p>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    variant="tertiary"
    fill
    data-testid="cancel-delete-booked-slot"
    [igntDialogClose]="undefined"
    [label]="'bookedSlots.deleteBookedSlotModal.cancel' | translate"
  />
  <ignt-button
    variant="primary"
    sentiment="danger"
    fill
    data-testid="confirm-delete-booked-slot"
    [label]="'bookedSlots.deleteBookedSlotModal.confirm' | translate"
    (click)="onConfirm()"
  />
</ignt-dialog-footer>
