<div class="booking-questions-tab">
  @for (question of bookingQuestions(); track $index) {
    <div class="booking-questions-tab__item" data-testid="booking-questions-item">
      <span class="booking-questions-tab__item-label">{{ question.label }}</span>
      @if (question.answers.length > 0) {
        @for (answer of question.answers; track $index) {
          <span class="booking-questions-tab__item-answer" data-testid="booking-questions-answer">{{ answer }}</span>
        }
      } @else {
        <span class="booking-questions-tab__item-empty" data-testid="booking-questions-no-answer">
          {{ 'bookedSlots.noAnswerProvided' | translate }}
        </span>
      }
    </div>
  }
</div>
