@let cardLayout = layout();
<div
  class="locked-slot-card"
  data-testid="locked-slot-card"
  [attr.data-width-tier]="cardLayout.widthTier"
  [attr.data-height-tier]="cardLayout.heightTier"
  [class.locked-slot-card--one-row]="cardLayout.isOneRow"
>
  <div class="locked-slot-card__row">
    @if (cardLayout.hasGlyph) {
      <span class="locked-slot-card__glyph" data-testid="locked-slot-card-glyph">
        <ignt-icon aria-hidden="true" name="lock-keyhole" size="caption" variant="light" />
      </span>
    }
    @if (cardLayout.hasReason) {
      <span class="locked-slot-card__reason" data-testid="locked-slot-card-reason">{{ label() }}</span>
    }
  </div>
  @if (cardLayout.noteLineCount > 0) {
    <p
      class="locked-slot-card__note"
      data-testid="locked-slot-card-note"
      [class.locked-slot-card__note--wrapped]="cardLayout.noteLineCount > 1"
    >
      {{ note() }}
    </p>
  }
</div>
