<ignt-dialog-header data-testid="move-related-booked-slots-modal-title">
  <span class="move-related-booked-slots-modal__heading">
    <span class="move-related-booked-slots-modal__icon" aria-hidden="true">
      <ignt-icon name="arrows-split-up-and-left" variant="light"></ignt-icon>
    </span>
    {{ 'bookedSlots.moveRelatedModal.title' | translate }}
  </span>
</ignt-dialog-header>

<ignt-dialog-content class="move-related-booked-slots-modal__body">
  <p class="move-related-booked-slots-modal__description" data-testid="move-related-booked-slots-modal-description">
    {{ 'bookedSlots.moveRelatedModal.description' | translate: { count: activityCount, delta: data.deltaLabel } }}
  </p>

  <ul class="move-related-booked-slots-modal__list" data-testid="move-related-booked-slots-modal-list">
    @for (slot of data.slots; track $index) {
      <li
        class="move-related-booked-slots-modal__item"
        [class.move-related-booked-slots-modal__item--moving]="slot.isMoving"
        data-testid="move-related-booked-slots-modal-item"
      >
        <span [class]="getBarClass($index)" data-testid="move-related-booked-slots-modal-bar" aria-hidden="true"></span>
        <span class="move-related-booked-slots-modal__label" igntTooltip [tooltipLabel]="slot.label">{{ slot.label }}</span>
        <span class="move-related-booked-slots-modal__times">
          <span class="move-related-booked-slots-modal__previous-time">{{ slot.previousTime }}</span>
          <ignt-icon class="move-related-booked-slots-modal__arrow" name="arrow-right" variant="light" aria-hidden="true"></ignt-icon>
          <span class="move-related-booked-slots-modal__new-time">{{ slot.newTime }}</span>
        </span>
      </li>
    }
  </ul>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <div class="move-related-booked-slots-modal__footer">
    <ignt-button
      class="move-related-booked-slots-modal__action"
      data-testid="move-all-related-booked-slots"
      variant="primary"
      sentiment="brand"
      [label]="'bookedSlots.moveRelatedModal.moveAll' | translate: { count: activityCount }"
      (click)="onMoveAll()"
    ></ignt-button>
    <ignt-button
      class="move-related-booked-slots-modal__action"
      data-testid="move-only-this-booked-slot"
      variant="secondary"
      sentiment="neutral"
      [label]="'bookedSlots.moveRelatedModal.moveOnlyThisOne' | translate"
      (click)="onMoveOnlyThisOne()"
    ></ignt-button>
    <ignt-button
      class="move-related-booked-slots-modal__action"
      data-testid="cancel-move-related-booked-slots"
      variant="tertiary"
      sentiment="neutral"
      [label]="'bookedSlots.moveRelatedModal.cancel' | translate"
      (click)="onCancel()"
    ></ignt-button>
  </div>
</ignt-dialog-footer>
