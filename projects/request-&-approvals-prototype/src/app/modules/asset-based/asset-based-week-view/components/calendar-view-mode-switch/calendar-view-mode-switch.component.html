<div class="view-mode-switch" role="group" [attr.aria-label]="'bookedSlots.weeklyView.mode.label' | translate">
  @for (option of modes; track option) {
    <ignt-button
      class="view-mode-switch__segment"
      size="small"
      sentiment="neutral"
      [contrast]="contrast()"
      [variant]="option === mode() ? 'primary' : 'secondary'"
      [label]="'bookedSlots.weeklyView.mode.' + option | translate"
      [leadingIcon]="iconFor(option)"
      [attr.aria-pressed]="option === mode()"
      [attr.data-testid]="'calendar-view-mode-' + option"
      (click)="select(option)"
    ></ignt-button>
  }
</div>
