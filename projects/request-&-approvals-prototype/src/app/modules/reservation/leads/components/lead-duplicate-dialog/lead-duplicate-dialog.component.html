<ignt-dialog-header>
  {{ 'leads.statusChange.duplicate.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <form id="lead-duplicate-form" class="lead-duplicate-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <p class="lead-duplicate-form__description">{{ 'leads.statusChange.duplicate.description' | translate }}</p>

    <ignt-input-field
      data-testid="lead-duplicate-ref"
      formControlName="duplicateRef"
      [customFormErrors]="duplicateRefErrors"
      [helperText]="'leads.statusChange.duplicate.leadIdHelper' | translate"
      [id]="'duplicateRef'"
      [label]="('leads.statusChange.duplicate.leadId' | translate) + ' *'"
      [placeholder]="'leads.statusChange.duplicate.leadIdPlaceholder' | translate"
      (input)="onDuplicateRefInput()"
    />
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button data-testid="lead-duplicate-cancel-button" variant="secondary" [label]="'common.cancel' | translate" (click)="onCancel()" />
  <ignt-button
    data-testid="lead-duplicate-submit-button"
    [disabled]="isSubmitDisabled()"
    [label]="'leads.statusChange.duplicate.submit' | translate"
    (click)="onSubmit()"
  />
</ignt-dialog-footer>
