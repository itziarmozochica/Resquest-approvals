<ignt-dialog-header>
  {{ 'leads.statusChange.lost.closeTitle' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <form id="lead-lost-form" class="lead-lost-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <p class="lead-lost-form__description">
      {{ 'leads.statusChange.lost.reopenIntro' | translate: { guest: guestLabel } }}
    </p>

    <ignt-typeahead
      container="body"
      data-testid="lead-lost-reason"
      [collapseOnClick]="true"
      [editable]="false"
      [emptyLabel]="'leads.statusChange.lost.reasonPlaceholder' | translate"
      [fieldLabel]="('leads.statusChange.lost.reason' | translate) + ' *'"
      [isInDialog]="true"
      [options]="reasonOptions"
      [selectedOption]="initialReasonOption"
      (selected)="onReasonSelected($event)"
    ></ignt-typeahead>

    <ignt-textarea-field
      data-testid="lead-lost-note"
      formControlName="note"
      [customFormErrors]="noteErrors"
      [helperText]="'leads.statusChange.lost.noteHelper' | translate"
      [id]="'lossNote'"
      [label]="'leads.statusChange.lost.note' | translate"
      [maxlength]="noteMaxLength"
      [placeholder]="'leads.statusChange.lost.notePlaceholder' | translate"
      [rows]="3"
    />
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button data-testid="lead-lost-cancel-button" variant="secondary" [label]="'common.cancel' | translate" (click)="onCancel()" />
  <ignt-button
    data-testid="lead-lost-submit-button"
    sentiment="danger"
    [disabled]="isSubmitDisabled()"
    [label]="'leads.statusChange.lost.closeSubmit' | translate"
    (click)="onSubmit()"
  />
</ignt-dialog-footer>
