<ignt-dialog-header>
  {{ 'leads.detail.activity.create.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <form id="lead-activity-create-form" class="lead-activity-create-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <ignt-typeahead
      data-testid="lead-activity-create-category"
      container="body"
      [isInDialog]="true"
      [collapseOnClick]="true"
      [editable]="false"
      [fieldLabel]="('leads.detail.activity.create.category' | translate) + ' *'"
      [emptyLabel]="'leads.detail.activity.create.categoryPlaceholder' | translate"
      [options]="categoryOptions"
      [selectedOption]="selectedCategoryOption()"
      (selected)="onCategorySelected($event)"
    ></ignt-typeahead>
    <!-- Only the communication kinds have a side that reached out; a note is written by the
         coordinator to themselves. -->
    @if (isDirectionVisible()) {
      <ignt-typeahead
        data-testid="lead-activity-create-direction"
        container="body"
        [isInDialog]="true"
        [collapseOnClick]="true"
        [editable]="false"
        [fieldLabel]="'leads.detail.activity.create.direction' | translate"
        [emptyLabel]="'leads.detail.activity.create.directionPlaceholder' | translate"
        [options]="directionOptions"
        [selectedOption]="selectedDirectionOption()"
        (selected)="onDirectionSelected($event)"
      ></ignt-typeahead>
    }
    <!-- Native date field, the anatomy the lead edit and create dialogs already use: opens the
         browser calendar on click and wears the calendar icon itself. -->
    <div class="lead-activity-create-form__date-field" (click)="onRelatedDateClick($event)">
      <ignt-input-field
        [id]="'leadActivityRelatedDate'"
        data-testid="lead-activity-create-date"
        formControlName="relatedDate"
        type="date"
        [label]="('leads.detail.activity.create.date' | translate) + ' *'"
        [customFormErrors]="relatedDateErrors"
      />
      <ignt-icon class="lead-activity-create-form__date-icon" name="calendar" variant="light" aria-hidden="true" />
    </div>
    <ignt-input-field
      [id]="'leadActivityTitle'"
      data-testid="lead-activity-create-subject"
      formControlName="title"
      [label]="('leads.detail.activity.create.subject' | translate) + ' *'"
      [placeholder]="'leads.detail.activity.create.subjectPlaceholder' | translate"
      [customFormErrors]="titleErrors"
    />
    <ignt-textarea-field
      [id]="'leadActivityContent'"
      data-testid="lead-activity-create-notes"
      formControlName="content"
      [label]="'leads.detail.activity.create.notes' | translate"
      [placeholder]="'leads.detail.activity.create.notesPlaceholder' | translate"
      [customFormErrors]="contentErrors"
      [rows]="4"
    />
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    data-testid="lead-activity-create-cancel-button"
    variant="secondary"
    [label]="'common.cancel' | translate"
    (click)="onCancel()"
  />
  <ignt-button
    data-testid="lead-activity-create-save-button"
    [disabled]="isSubmitDisabled()"
    [label]="'common.create' | translate"
    (click)="onSubmit()"
  />
</ignt-dialog-footer>
