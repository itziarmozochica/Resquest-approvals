@switch (kind()) {
  @case ('dash') {
    —
  }
  @case ('optional') {
    <span class="lead-empty-value lead-empty-value--optional">{{ 'leads.detail.notProvided' | translate }}</span>
  }
  @case ('notProvided') {
    <span class="lead-empty-value lead-empty-value--required">{{ 'leads.detail.notProvided' | translate }}</span>
  }
  @case ('required') {
    <span class="lead-empty-value lead-empty-value--required">{{ 'leads.detail.required' | translate }}</span>
  }
}
