<ignt-dialog-header>
  {{ 'leads.guestEdit.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <form id="lead-guest-edit-form" class="lead-guest-edit-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <ignt-input-field
      [id]="'guestFirstName'"
      data-testid="lead-guest-edit-first-name"
      formControlName="guestFirstName"
      [label]="('leads.guestEdit.guestFirstName' | translate) + ' *'"
      [maxlength]="guestNameMaxLength"
      [customFormErrors]="guestFirstNameErrors"
    />
    <ignt-input-field
      [id]="'guestLastName'"
      data-testid="lead-guest-edit-last-name"
      formControlName="guestLastName"
      [label]="'leads.guestEdit.guestLastName' | translate"
      [maxlength]="guestNameMaxLength"
      [customFormErrors]="guestLastNameErrors"
    />
    <ignt-input-field
      [id]="'guestEmail'"
      data-testid="lead-guest-edit-email"
      formControlName="guestEmail"
      type="email"
      [label]="('leads.guestEdit.guestEmail' | translate) + ' *'"
      [customFormErrors]="guestEmailErrors"
    />
    <!-- Digits and the usual separators only: letters are stripped from the committed value and
         refused by the control's pattern, so a mistyped name cannot end up in the phone column. -->
    <ignt-input-field
      [id]="'guestPhone'"
      data-testid="lead-guest-edit-phone"
      formControlName="guestPhone"
      type="tel"
      [label]="('leads.guestEdit.guestPhone' | translate) + ' *'"
      [placeholder]="'leads.guestEdit.guestPhonePlaceholder' | translate"
      [customFormErrors]="guestPhoneErrors"
      [helperText]="guestPhoneHint"
      (input)="onGuestPhoneInput()"
    />
  </form>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button data-testid="lead-guest-edit-cancel-button" variant="secondary" [label]="'common.cancel' | translate" (click)="onCancel()" />
  <ignt-button
    data-testid="lead-guest-edit-save-button"
    [disabled]="isSubmitDisabled()"
    [label]="'common.save' | translate"
    (click)="onSubmit()"
  />
</ignt-dialog-footer>
