<div class="reservation-locator-cell">
  <span class="reservation-locator-cell__locator" data-testid="reservation-locator-cell-locator">{{ locator() }}</span>
  <button
    type="button"
    ignt-icon-button
    variant="sharp"
    sentiment="tertiary"
    size="small"
    data-testid="reservation-locator-cell-navigate"
    [disabled]="disabled()"
    [icon]="['fal', 'arrow-up-right-from-square']"
    [attr.aria-label]="'leads.detail.goToReservation' | translate"
    [title]="'leads.detail.goToReservation' | translate"
    (click)="onNavigate()"
  ></button>
</div>
