<div class="lead-venue-cell">
  @if (lines(); as location) {
    <span data-testid="lead-venue-cell-primary">{{ location.primary }}</span>
    @if (location.secondary !== null) {
      <span class="lead-venue-cell__secondary" data-testid="lead-venue-cell-secondary">{{ location.secondary }}</span>
    }
  } @else {
    <span data-testid="lead-venue-cell-primary">—</span>
  }
</div>
