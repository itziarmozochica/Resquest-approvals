<div class="leads-bulk-toolbar" role="toolbar" [attr.aria-label]="'leads.bulkAssign.toolbarLabel' | translate">
  <div class="leads-bulk-toolbar__selection">
    <ignt-button
      data-testid="leads-bulk-clear"
      variant="tertiary"
      size="small"
      [label]="'leads.bulkAssign.clearSelection' | translate"
      [leadingIcon]="clearIcon"
      (click)="clearSelection.emit()"
    />

    <span class="leads-bulk-toolbar__count" data-testid="leads-bulk-selected-count" aria-live="polite">
      {{ 'leads.bulkAssign.selectedCount' | translate: { count: selectedCount() } }}
    </span>

    <ignt-button
      data-testid="leads-bulk-select-all"
      variant="secondary"
      size="small"
      [disabled]="areAllSelected()"
      [label]="'leads.bulkAssign.selectAll' | translate: { count: totalLoaded() }"
      (click)="selectAll.emit()"
    />
  </div>

  <div class="leads-bulk-toolbar__actions">
    <ignt-button
      data-testid="leads-bulk-assign"
      size="small"
      [disabled]="!hasSelection()"
      [label]="'leads.bulkAssign.action' | translate"
      [leadingIcon]="assignIcon"
      (click)="assign.emit()"
    />
  </div>
</div>
