<div class="lead-activity-timeline-filters" role="group" [attr.aria-label]="'leads.detail.activity.filters.ariaLabel' | translate">
  @for (option of options(); track option.key) {
    <ignt-pill-button
      [attr.data-testid]="'lead-activity-timeline-filter-' + option.key"
      [checked]="activeKey() === option.key"
      [label]="option.labelKey | translate"
      [value]="option.key"
      (checkedChange)="onPillChecked(option, $event)"
    />
  }
</div>
