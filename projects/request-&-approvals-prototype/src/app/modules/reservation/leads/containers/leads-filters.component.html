<div class="leads-filters" data-testid="leads-filters">
  <div class="leads-filters__field leads-filters__search">
    <ignt-input-field
      data-testid="leads-filters-search"
      type="search"
      [formControl]="searchControl"
      [label]="'leads.filters.search' | translate"
      [placeholder]="'leads.filters.searchPlaceholder' | translate"
      [leadIcon]="['far', 'search']"
      [maxlength]="searchMaxLength"
      [trailIcon]="hasSearchValue() ? ['far', 'times'] : null"
      [trailIconAriaLabel]="'leads.filters.clearSearch' | translate"
      (trailIconClicked)="onSearchClear()"
    />
  </div>

  @if (venueOptions().length > 0) {
    <div class="leads-filters__field">
      <span class="leads-filters__field-label">{{ 'leads.filters.venue' | translate }}</span>
      <app-multi-select
        data-testid="leads-filters-venue"
        [options]="venueOptions()"
        [selectedOptions]="selectedVenueOptions()"
        [displayInPlaceMaximum]="2"
        [placeholder]="'leads.filters.venue' | translate"
        [showAllSelectedOnFeatureToggle]="true"
        [scrollEndEnabled]="venueHasMore()"
        (scrollEnd)="onVenueScrollEnd()"
        (searchChange)="onVenueSearchChange($event)"
        (selected)="onVenuesSelected($event)"
      >
      </app-multi-select>
    </div>
  }

  @if (canFilterByOwner() && ownerOptions().length > 0) {
    <div class="leads-filters__field">
      <span class="leads-filters__field-label">{{ 'leads.filters.owner' | translate }}</span>
      <app-multi-select
        data-testid="leads-filters-owner"
        [options]="ownerOptions()"
        [selectedOptions]="selectedOwnerOptions()"
        [maxSelectedOptions]="1"
        [displayInPlaceMaximum]="1"
        [placeholder]="'leads.filters.owner' | translate"
        [disabled]="unassignedOnly()"
        [scrollEndEnabled]="ownerHasMore()"
        (scrollEnd)="onOwnerScrollEnd()"
        (searchChange)="onOwnerSearchChange($event)"
        (selected)="onOwnerSelected($event)"
      >
      </app-multi-select>
    </div>
  }

  @if (canFilterByOwner()) {
    <div class="leads-filters__toggle">
      <ignt-pill-button
        data-testid="leads-filters-unassigned"
        value="unassigned"
        [label]="'leads.unassigned' | translate"
        [checked]="unassignedOnly()"
        (checkedChange)="unassignedOnlyChange.emit($event)"
      />
    </div>
  }
</div>
