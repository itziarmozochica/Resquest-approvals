<div class="end-customer-form" [formGroup]="form()">
  <ignt-switch
    data-testid="end-customer-switch"
    formControlName="enabled"
    [description]="'reservations.ticketing.ticketDelivery.customerCaption' | translate"
    [label]="'reservations.ticketing.ticketDelivery.customerLabel' | translate"
  />
  @if (isEnabled()) {
    <div class="end-customer-form__fields">
      <ignt-input-field
        data-testid="end-customer-email"
        formControlName="email"
        id="endCustomerEmail"
        type="email"
        [customFormErrors]="[{ type: 'emailValidator', message: 'form.error.invalidEmail' | translate }]"
        [label]="'form.field.email' | translate"
        [placeholder]="'customer@example.com'"
      ></ignt-input-field>
      <ignt-input-field
        data-testid="end-customer-first-name"
        formControlName="firstName"
        id="endCustomerFirstName"
        [label]="'form.field.firstName' | translate"
        [maxlength]="nameFieldMaxLength"
      ></ignt-input-field>
      <ignt-input-field
        data-testid="end-customer-last-name"
        formControlName="lastName"
        id="endCustomerLastName"
        [label]="'form.field.lastName' | translate"
        [maxlength]="nameFieldMaxLength"
      ></ignt-input-field>
    </div>
  }
</div>
