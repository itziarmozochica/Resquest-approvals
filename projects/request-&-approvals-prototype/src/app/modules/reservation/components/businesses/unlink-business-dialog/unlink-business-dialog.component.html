<ignt-dialog-header hideCloseButton data-testid="unlink-business-dialog-title">
  {{ 'businessManagement.unlink.title' | translate: { businessName: data.businessName, partnerName: data.partnerName } }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p class="unlink-business-dialog__message" data-testid="unlink-business-dialog-message">
    {{ 'businessManagement.unlink.message' | translate: { partnerName: data.partnerName } }}
  </p>

  <div class="unlink-business-dialog__form" [formGroup]="form">
    <ignt-radio-group
      class="unlink-business-dialog__categories"
      formControlName="reasonCategory"
      [label]="'businessManagement.unlink.reasonCategoryLabel' | translate"
    >
      @for (option of categoryOptions; track option.value) {
        <ignt-radio
          [dataTestId]="'unlink-business-dialog-category-' + option.value"
          [label]="option.labelKey | translate"
          [value]="option.value"
        >
        </ignt-radio>
      }
    </ignt-radio-group>

    <ignt-textarea-field
      class="unlink-business-dialog__note"
      formControlName="note"
      id="unlink-business-dialog-note"
      [helperText]="'businessManagement.unlink.noteHelper' | translate"
      [label]="(isNoteRequired ? 'businessManagement.unlink.noteLabelRequired' : 'businessManagement.unlink.noteLabel') | translate"
      [maxlength]="noteMaxLength"
      [rows]="3"
    ></ignt-textarea-field>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <ignt-button
    class="unlink-business-dialog__cancel"
    sentiment="neutral"
    variant="tertiary"
    [label]="'common.cancel' | translate"
    (click)="onCancel()"
    data-testid="unlink-business-dialog-cancel"
  ></ignt-button>
  <ignt-button
    sentiment="danger"
    variant="primary"
    [disabled]="isConfirmDisabled"
    [label]="'businessManagement.unlink.confirmButton' | translate"
    (click)="onConfirm()"
    data-testid="unlink-business-dialog-confirm"
  ></ignt-button>
</ignt-dialog-footer>
