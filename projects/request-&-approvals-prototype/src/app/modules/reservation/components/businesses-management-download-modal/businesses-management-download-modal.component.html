<ignt-dialog-header>
  {{ 'businessManagement.download.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p class="businesses-download-modal__description" data-testid="modal-message">
    {{ 'businessManagement.download.downloadOptionsDescription' | translate }}
  </p>
  <div class="businesses-download-modal__options">
    <div class="businesses-download-modal__option-row">
      <span class="businesses-download-modal__option-label">{{
        'businessManagement.download.downloadOnlyEnabledBusinesses' | translate
      }}</span>
      <ignt-toggle
        [checked]="showOnlyEnabledBusinesses"
        data-testid="businesses-download-notes-toggle"
        (change)="onEnabledBusinessesToggle($event)"
      ></ignt-toggle>
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer>
  <button igntButton [fill]="true" data-testid="modal-accept-button" (click)="close(true)">
    {{ 'businessManagement.download.downloadButton' | translate }}
  </button>
</ignt-dialog-footer>
