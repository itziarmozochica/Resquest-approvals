<ignt-tag
  [attr.data-testid]="dataTestId"
  [sentiment]="tagSentiment"
  [variant]="'solid'"
  [startIcon]="icon"
  [ngClass]="{ 'reservation-status-tag--compact': variant === 'compact' }"
>
  <ng-container *ngIf="variant !== 'compact'">
    {{ 'reservations.status.' + status | translate }}
  </ng-container>
</ignt-tag>
