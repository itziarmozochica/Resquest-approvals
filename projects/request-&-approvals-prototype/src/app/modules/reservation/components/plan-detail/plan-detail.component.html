@if (isMobile() === false && !collapsible()) {
  <div class="plan-detail--desktop">
    <div [innerHTML]="description()" data-testid="reservation-plan-description-container"></div>
  </div>
} @else if (showsPanel()) {
  <div class="plan-detail--desktop plan-detail-panel">
    <div class="fold__trigger" (click)="isFolded.set(!isFolded())">
      <span class="fold__trigger__text">{{ 'planDetail.eventDescription' | translate }}</span>
      <button
        class="fold__chevron"
        ignt-icon-button
        type="button"
        size="small"
        sentiment="tertiary"
        variant="sharp"
        data-testid="reservation-plan-description-toggle"
        [class.fold__chevron--folded]="isFolded()"
        [icon]="['fas', 'chevron-down']"
        [attr.aria-expanded]="!isFolded()"
        [attr.aria-controls]="descriptionContentId"
        [attr.aria-label]="'planDetail.eventDescription' | translate"
      ></button>
    </div>
    <div class="fold__content plan-detail-panel__content" [id]="descriptionContentId" [class.fold__content--hidden]="isFolded()">
      <ignt-divider variant="dashed"></ignt-divider>
      <div [innerHTML]="description()" data-testid="reservation-plan-description-container"></div>
    </div>
  </div>
} @else if (isMobile() === true) {
  <div class="plan-detail--mobile">
    <ignt-wrapper-card>
      <div class="fold__trigger" (click)="isFolded.set(!isFolded())">
        <span class="fold__trigger__text">
          <ignt-icon name="info-circle" variant="regular" />
          {{ 'planDetail.eventDescription' | translate }}
        </span>
        <button
          ignt-icon-button
          type="button"
          size="small"
          sentiment="tertiary"
          variant="sharp"
          data-testid="reservation-plan-description-toggle"
          [icon]="['fal', isFolded() ? 'chevron-down' : 'chevron-up']"
          [attr.aria-expanded]="!isFolded()"
          [attr.aria-controls]="descriptionContentId"
          [attr.aria-label]="'planDetail.eventDescription' | translate"
        ></button>
      </div>
      <div class="fold__content" [id]="descriptionContentId" [class.fold__content--hidden]="isFolded()">
        <ignt-divider variant="dashed"></ignt-divider>
        <div [innerHTML]="description()" data-testid="reservation-plan-description-container"></div>
      </div>
    </ignt-wrapper-card>
  </div>
}
