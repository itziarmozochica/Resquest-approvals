<ignt-wrapper-card>
  <div class="reservation-id-card">
    <div class="reservation-id-card__detail">
      <span class="reservation-id-card__detail__title">{{ 'reservation.checkout.reservationId' | translate }}</span>
      <span class="reservation-id-card__detail__value">{{ reservationId() }}</span>
    </div>
    <button igntButton sentiment="secondary" size="small" (click)="onCopyReservationId()">
      {{ (showCopiedMessage() ? 'copiedToClipboard' : 'common.copy') | translate }}
    </button>
  </div>
</ignt-wrapper-card>
