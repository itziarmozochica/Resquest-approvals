<div class="reservations-container reservations-container--space">
  <div>
    <img src="assets/images/shared/big-shoes-torso.svg" alt="{{ 'reservations.emptyBusinesses' | translate }}" />
  </div>
  <p class="reservations-container__description">{{ 'reservations.createBusinessDescription' | translate }}</p>
  <div class="reservations-container">
    <a igntButton *ngIf="canCreateBusiness" routerLink="/reservations/businesses" data-testid="reservations-add-business-button">
      {{ 'reservations.createBusiness' | translate }}
    </a>
    <button igntButton sentiment="tertiary" (click)="onCancelClick()" data-testid="reservations-cancel-button">
      {{ 'reservations.cancel' | translate }}
    </button>
  </div>
</div>
