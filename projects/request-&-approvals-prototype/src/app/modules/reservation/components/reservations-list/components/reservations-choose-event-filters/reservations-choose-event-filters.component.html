<div class="reservations-choose-event-filters">
  <div class="reservations-choose-event-filters__field reservations-choose-event-filters__field--city">
    <ignt-typeahead
      class="app-typeahead-input"
      id="filter-by-city"
      [emptyLabel]="'filters.city' | translate"
      [fieldLabel]="'filters.city' | translate"
      [options]="cityFiltersOptions()"
      [editable]="true"
      (selected)="selectCityFilter($event)"
      [selectAllLabel]="isSelectAllCities() ? ('filters.allCities' | translate) : undefined"
      [selectedOption]="selectedCity()"
    />
  </div>
  <div class="reservations-choose-event-filters__field reservations-choose-event-filters__field--venue">
    <ignt-typeahead
      class="app-typeahead-input"
      id="filter-by-venue"
      [emptyLabel]="'filters.venue' | translate"
      [fieldLabel]="'filters.venue' | translate"
      [options]="venueFiltersOptions()"
      [editable]="true"
      (selected)="selectVenueFilter($event)"
      [selectAllLabel]="isSelectAllVenues() ? ('filters.allVenues' | translate) : undefined"
      [selectedOption]="selectedVenue()"
    />
  </div>
  <div class="reservations-choose-event-filters__field reservations-choose-event-filters__field--plan">
    <ignt-typeahead
      class="app-typeahead-input"
      id="filter-by-event"
      [emptyLabel]="'filters.allEvents' | translate"
      [fieldLabel]="'filters.event' | translate"
      [options]="plansFiltersOptions()"
      [editable]="true"
      (selected)="selectPlanFilter($event)"
      [selectAllLabel]="isSelectAllPlans() ? ('filters.allEvents' | translate) : undefined"
      [selectedOption]="selectedPlan()"
    />
  </div>
</div>
