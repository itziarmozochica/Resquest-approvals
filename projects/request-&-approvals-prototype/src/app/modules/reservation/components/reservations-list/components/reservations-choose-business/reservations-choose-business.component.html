<app-page-title [title]="'menu.makeReservation' | translate" class="new-design"></app-page-title>
<div class="main-wrapper">
  <ignt-wrapper-card [mobileBorderless]="true">
    <ng-container *ngIf="!isLoading; else spinner">
      <ng-container *ngIf="!hasBusinesses(); else businessSelector">
        <app-reservations-choose-business-empty-state />
      </ng-container>
    </ng-container>
  </ignt-wrapper-card>

  <ng-template #businessSelector>
    <app-reservations-choose-business-selector [businesses]="businesses()" />
  </ng-template>

  <ng-template #spinner>
    <div class="plan-description__loading">
      <fa-icon class="loader" [icon]="['fas', 'spinner']" [size]="'3x'"></fa-icon>
    </div>
  </ng-template>
</div>
