<app-reservations-header [showGoBack]="!isLoading()" (goBackCallback)="goBack()" />
<ng-container *ngIf="plans().length !== 0 && !isAutoSelecting()">
  <div class="reservations-choose-event-filters"><app-reservations-choose-event-filters /></div>
</ng-container>

<ng-container *ngIf="!isLoading(); else loadingSpinner">
  <ng-container *ngIf="plans().length === 0; else eventSelector">
    <app-reservations-choose-event-empty-state />
  </ng-container>
</ng-container>

<ng-template #eventSelector>
  <app-reservations-choose-event-selector />
</ng-template>

<ng-template #loadingSpinner>
  <div class="reservations-choose-event__loading" role="status" data-testid="choose-event-loader">
    <ignt-icon class="reservations-choose-event__loading-icon" name="spinner" variant="solid" [spin]="true" aria-hidden="true" />
    <span class="visually-hidden">{{ 'common.loading' | translate }}</span>
  </div>
</ng-template>
