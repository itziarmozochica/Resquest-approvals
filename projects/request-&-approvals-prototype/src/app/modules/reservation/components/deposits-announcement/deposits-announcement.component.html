<div class="announcement">
  <button
    ignt-icon-button
    type="button"
    class="announcement__close"
    size="medium"
    sentiment="tertiary"
    [icon]="['fal', 'times']"
    [attr.aria-label]="i18nPrefix + '.close' | translate"
    (click)="onClose()"
    data-testid="deposits-announcement-close"
  ></button>

  <div class="announcement__content">
    <h2 class="announcement__title">
      <span class="announcement__title-lead">{{ i18nPrefix + '.title.lead' | translate }}</span>
      <span class="announcement__title-highlight">{{ i18nPrefix + '.title.highlight' | translate }}</span>
    </h2>

    <ul class="announcement__benefits">
      @for (benefitKey of benefitKeys; track benefitKey) {
        <li class="announcement__benefit" data-testid="deposits-announcement-benefit">
          <ignt-icon class="announcement__benefit-icon" name="check-circle" variant="solid" aria-hidden="true" />
          <span class="announcement__benefit-text">{{ benefitKey | translate }}</span>
        </li>
      }
    </ul>

    <div class="announcement__ctas">
      <ignt-button
        class="announcement__primary-cta"
        variant="primary"
        sentiment="brand"
        size="large"
        [label]="i18nPrefix + '.primaryCta' | translate"
        (click)="onPrimaryClick()"
        data-testid="deposits-announcement-primary-cta"
      />
      <ignt-button
        class="announcement__learn-more"
        variant="tertiary"
        sentiment="brand"
        size="large"
        [label]="i18nPrefix + '.learnMore' | translate"
        (click)="onLearnMore()"
        data-testid="deposits-announcement-learn-more"
      />
    </div>
  </div>

  <picture class="announcement__visual" aria-hidden="true">
    <source media="(min-width: 1110px)" [srcset]="visual().large" />
    <img class="announcement__visual-image" [src]="visual().medium" alt="" />
  </picture>
</div>
