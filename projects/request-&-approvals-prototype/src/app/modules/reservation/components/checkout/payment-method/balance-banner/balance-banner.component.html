<div class="balance-banner">
  <div class="balance-banner__title">
    {{ 'businessManagement.paymentSettings.balance' | translate }}
  </div>
  <div class="balance-banner__balance">
    <ng-container *ngIf="balance" [ngTemplateOutlet]="formatMoney" [ngTemplateOutletContext]="{ money: balance }"> </ng-container>
    <div data-testid="no-balance" *ngIf="!balance">
      {{ 'businessManagement.paymentSettings.noBalance' | translate }}
    </div>
  </div>
</div>

<ng-template #formatMoney let-money="money">
  <span data-testid="balance">
    {{ money ? (money.amount | currency: money.currency : 'symbol-narrow' : null : locale) : '-' }}
  </span>
</ng-template>
