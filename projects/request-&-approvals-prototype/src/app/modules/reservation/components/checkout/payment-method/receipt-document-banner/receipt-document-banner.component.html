<label class="cell field" data-testid="template-coupon-general-info__description">
  <textarea
    class="field__input field__textarea receipt-document__textarea"
    [(ngModel)]="paymentNote"
    (ngModelChange)="onPaymentNoteChange($event)"
    [placeholder]="titleText | translate"
    maxlength="200"
  ></textarea>
  <span class="field__label">{{ titleText | translate }}</span>
  <span class="field__helper">{{ helperText | translate }}</span>
</label>

<ignt-checkbox
  *ngIf="shouldShowCheckbox()"
  id="moneyConfirmation"
  [checked]="moneyConfirmed"
  (change)="onMoneyConfirmationChange($event)"
  [label]="'boxOffice.receiptDocument.moneyConfirmationCheckbox' | translate"
  dataTestId="money-confirmation-checkbox"
>
</ignt-checkbox>

<ignt-alert
  class="transfer-warning"
  *ngIf="shouldShowDisclaimer()"
  [description]="'boxOffice.receiptDocument.feverTransferWarning' | translate"
  data-testid="transfer-warning"
  sentiment="warning"
/>
