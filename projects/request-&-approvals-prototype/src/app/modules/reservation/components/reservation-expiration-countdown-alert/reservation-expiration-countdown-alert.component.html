<ignt-alert sentiment="warning" [attr.data-testid]="testId()">
  <ng-template #igntAlertContent>
    @if (deadline(); as formatted) {
      <p class="reservation-expiration-countdown-alert__deadline">
        <strong>{{ deadlineLabelKey() | translate }}</strong>
        {{ formatted.dateTime }} ({{ formatted.timezone }}).
      </p>

      @if (timeLeft(); as duration) {
        <p class="reservation-expiration-countdown-alert__time-left">
          <strong>{{ 'reservation.checkout.paymentSelector.timeLeftShortLabel' | translate }}</strong>
          {{ duration }}
        </p>
      }

      @if (canEditDeadlines()) {
        <div class="reservation-expiration-countdown-alert__actions">
          <ignt-button
            size="small"
            variant="tertiary"
            [attr.data-testid]="testId() + '__edit-deadlines'"
            [label]="editDeadlinesLabelKey() | translate"
            [leadingIcon]="{ name: 'edit', variant: 'regular' }"
            (click)="editDeadlines.emit()"
          />
        </div>
      }
    }
  </ng-template>
</ignt-alert>
