<div class="reservation-download-modal">
  <header class="reservation-download-modal__header">
    <div class="reservation-download-modal__header-bar">
      <span class="reservation-download-modal__header-spacer" aria-hidden="true"></span>
      <h2 class="reservation-download-modal__title" data-testid="modal-title">
        {{ 'reservations.download.title' | translate }}
      </h2>
      <button
        type="button"
        class="reservation-download-modal__close"
        data-testid="modal-close-button"
        [attr.aria-label]="'common.close' | translate"
        (click)="close(false)"
      >
        <ignt-icon name="times" variant="solid" size="sm" aria-hidden="true"></ignt-icon>
      </button>
    </div>
  </header>

  <div class="reservation-download-modal__body">
    <p class="reservation-download-modal__description" data-testid="modal-message">
      {{ 'reservations.download.downloadOptionsDescription' | translate }}
    </p>
    <div class="reservation-download-modal__options">
      <div class="reservation-download-modal__option-row">
        <span class="reservation-download-modal__option-label">{{ 'reservations.download.includeReservationNotes' | translate }}</span>
        <ignt-toggle
          [checked]="shouldIncludeStaffNotes"
          data-testid="reservations-download-notes-toggle"
          (change)="onStaffNotesToggle($event)"
        ></ignt-toggle>
      </div>
      <div class="reservation-download-modal__option-row">
        <span class="reservation-download-modal__option-label">{{ 'reservations.download.includeBookingAnswers' | translate }}</span>
        <ignt-toggle
          [checked]="shouldIncludeBookingAnswers"
          data-testid="reservations-download-answers-toggle"
          (change)="onBookingAnswersToggle($event)"
        ></ignt-toggle>
      </div>
    </div>
  </div>

  <footer class="reservation-download-modal__footer">
    <button igntButton sentiment="secondary" [fill]="true" data-testid="modal-cancel-button" (click)="close(false)">
      {{ 'common.cancel' | translate }}
    </button>
    <button igntButton [fill]="true" data-testid="modal-accept-button" (click)="close(true)">
      {{ 'reservations.download.downloadButton' | translate }}
    </button>
  </footer>
</div>
