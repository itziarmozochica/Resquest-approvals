<app-reservations-header [showGoBack]="false" />
@if (plans().length !== 0) {
  <app-reservations-choose-event-filters />
}

@if (!isLoading()) {
  @if (plans().length === 0) {
    <app-reservations-choose-event-empty-state />
  } @else {
    <app-reservations-choose-event-selector />
  }
} @else {
  <div class="main-wrapper">
    <ignt-wrapper-card [elevation]="3">
      <div class="plan-description__loading">
        <fa-icon class="loader" [icon]="['fas', 'spinner']" [size]="'3x'"></fa-icon>
      </div>
    </ignt-wrapper-card>
  </div>
}
