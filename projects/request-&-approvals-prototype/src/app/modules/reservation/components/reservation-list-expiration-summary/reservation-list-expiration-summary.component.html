<div class="reservation-list-expiration-summary" [attr.data-testid]="testId()">
  @if (deadline(); as d) {
    <span class="reservation-list-expiration-summary__line">
      {{ 'reservation.checkout.paymentSelector.descriptionDeadlineLabel' | translate }} {{ d.date }} {{ d.time }}
    </span>
  }
  @if (timeLeft(); as duration) {
    <span class="reservation-list-expiration-summary__line">
      {{ 'reservation.checkout.paymentSelector.timeLeftRemainingFormatted' | translate: { duration } }}
    </span>
  }
</div>
