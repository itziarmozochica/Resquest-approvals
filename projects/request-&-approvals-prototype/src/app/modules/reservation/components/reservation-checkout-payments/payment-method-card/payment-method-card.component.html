<p class="card__title">
  {{ 'reservation.checkout.paymentSelector.card.title' | translate }}
</p>
<p class="card__stripe-input-label">
  {{ 'reservation.checkout.paymentSelector.card.carData' | translate }}
</p>
<app-card-stripe-input
  class="content__stripe-input"
  [currency]="cart?.total?.currency"
  (cardAdded)="stripeCardAdded($event)"
  data-testid="stripe-input"
>
</app-card-stripe-input>

<div class="card__error-message" *ngIf="errors().length > 0">
  <div *ngFor="let error of errors()" class="card__error-message-item">
    <ignt-alert sentiment="danger" [description]="error | translate"></ignt-alert>
  </div>
</div>
