<div class="deposit-terms-checkbox-container" [class.deposit-terms-checkbox-container--error]="showError">
  <ignt-checkbox
    class="deposit-terms-checkbox"
    [class.deposit-terms-checkbox--error]="showError"
    id="agreeTerms"
    [checked]="agreeToTerms"
    [disabled]="disabled"
    (change)="onTermsChange($event)"
    dataTestId="deposit-terms-checkbox"
  >
    <span class="deposit-terms-checkbox__text">
      {{ 'reservation.checkout.agreeToTermsPre' | translate }}
      <a
        [href]="normalizedUrl"
        class="deposit-terms-checkbox__link"
        target="_blank"
        rel="noopener noreferrer"
        (click)="onLinkClick($event)"
        >{{ 'reservation.checkout.agreeToTermsLink' | translate }}</a
      >
      {{ 'reservation.checkout.agreeToTermsPost' | translate }}.
    </span>
  </ignt-checkbox>
  <div *ngIf="showError" class="deposit-terms-checkbox__error" data-testid="deposit-terms-error-message">
    <img src="assets/images/icons/fa-icon-circle-exclamation.svg" alt="" aria-hidden="true" class="deposit-terms-checkbox__error-icon" />
    <span class="deposit-terms-checkbox__error-text">{{ 'form.error.mandatoryField' | translate }}</span>
  </div>
</div>
