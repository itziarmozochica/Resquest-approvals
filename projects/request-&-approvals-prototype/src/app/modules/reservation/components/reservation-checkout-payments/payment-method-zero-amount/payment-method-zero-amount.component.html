<div class="zero-amount">
  <div class="zero-amount__title">
    {{
      'reservation.checkout.paymentSelector.zeroAmount.title'
        | translate: { amount: (cart().total?.amount | currency: cart().total?.currency : 'symbol-narrow') }
    }}
  </div>
  <div class="zero-amount__buttons" *ngIf="!isTablet()">
    <ng-container *ngTemplateOutlet="buttonsTemplate"> </ng-container>
  </div>
</div>

<bottom-slider *ngIf="isTablet()" [buttonsTemplate]="buttonsTemplate"> </bottom-slider>

<ng-template #buttonsTemplate>
  <button igntButton sentiment="secondary" (click)="goBack()" [fill]="true" [disabled]="isPersisting()">
    {{ (isBuyNewReservationFlow() ? 'reservation.checkout.paymentSelector.back' : 'common.cancel') | translate }}
  </button>
  <button
    igntButton
    sentiment="primary"
    class="zero-amount__send-button"
    (click)="onConfirmClick()"
    [fill]="true"
    [disabled]="isPersisting()"
    [loading]="isPersisting()"
  >
    {{ 'reservation.checkout.paymentSelector.zeroAmount.confirm' | translate }}
  </button>
</ng-template>
