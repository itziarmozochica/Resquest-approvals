<div class="mark-as-paid">
  <div class="mark-as-paid__title">
    {{ 'reservation.checkout.paymentSelector.markAsPaid.title' | translate }}
  </div>
  <reservation-payment-method
    [paymentMethods]="paymentTypes()"
    [cart]="cart"
    (paymentTypeChange)="onPaymentMethodSelected($event)"
    (cardAdded)="onCardAdded($event)"
    (receiptDocumentChange)="onReceiptDocumentChange($event)"
    (moneyConfirmationChange)="onMoneyConfirmationChange($event)"
  >
  </reservation-payment-method>
</div>
