<ignt-dialog-header data-testid="reschedule-reservation-tickets-dialog__title">
  {{ 'reservations.modify.rescheduleTicketsDialogTitle' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="reschedule-reservation-tickets-dialog">
    <ul class="reschedule-reservation-tickets-dialog__list" data-testid="reschedule-reservation-tickets-dialog__list">
      @for (line of lines; track line.title) {
        <li class="reschedule-reservation-tickets-dialog__row" data-testid="reschedule-reservation-tickets-dialog__row">
          <span class="reschedule-reservation-tickets-dialog__row__title">{{ line.title }}</span>
          <span class="reschedule-reservation-tickets-dialog__row__quantity">
            {{ lineQuantityKey(line.quantity) | translate: { count: line.quantity } }}
          </span>
        </li>
      }
    </ul>
  </div>
</ignt-dialog-content>
