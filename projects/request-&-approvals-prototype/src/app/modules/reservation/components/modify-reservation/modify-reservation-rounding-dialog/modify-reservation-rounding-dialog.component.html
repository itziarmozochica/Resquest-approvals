<ignt-dialog-header hideCloseButton data-testid="modify-reservation-rounding-dialog__title">
  {{ 'cart.adjustment.modalRounding.priceDifferenceTitle' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="modify-reservation-rounding-dialog">
    <p>{{ 'cart.adjustment.modalRounding.roundingExplanation' | translate }}</p>
    <p>{{ 'cart.adjustment.modalRounding.chargedPriceNote' | translate }}</p>
    <p>{{ 'cart.adjustment.modalRounding.exactTotalTip' | translate }}</p>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button igntButton sentiment="primary" data-testid="modify-reservation-rounding-dialog__dismiss" (click)="dismiss()">
    {{ 'cart.adjustment.modalRounding.acceptButton' | translate }}
  </button>
</ignt-dialog-footer>
