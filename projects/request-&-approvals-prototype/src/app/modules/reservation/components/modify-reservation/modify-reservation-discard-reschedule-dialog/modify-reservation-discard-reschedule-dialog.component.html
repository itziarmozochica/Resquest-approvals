<ignt-dialog-header hideCloseButton data-testid="modify-reservation-discard-reschedule-dialog__title">
  {{ 'reservations.modify.discardRescheduleDialog.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p data-testid="modify-reservation-discard-reschedule-dialog__message">
    {{ 'reservations.modify.discardRescheduleDialog.message' | translate }}
  </p>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button
    type="button"
    igntButton
    sentiment="secondary"
    data-testid="modify-reservation-discard-reschedule-dialog__keep-editing"
    (click)="keepEditing()"
  >
    {{ 'reservations.modify.discardRescheduleDialog.keepEditing' | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    variant="danger"
    data-testid="modify-reservation-discard-reschedule-dialog__discard"
    (click)="discardChanges()"
  >
    {{ 'reservations.modify.discardRescheduleDialog.discardChanges' | translate }}
  </button>
</ignt-dialog-footer>
