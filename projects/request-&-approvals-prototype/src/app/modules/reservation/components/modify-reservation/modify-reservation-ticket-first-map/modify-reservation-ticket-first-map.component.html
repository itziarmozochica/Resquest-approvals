<div class="modify-reservation-ticket-first-map" data-testid="modify-reservation-ticket-first-map">
  @if (loading()) {
    <div class="modify-reservation-ticket-first-map__loading" data-testid="modify-reservation-ticket-first-map-loading"></div>
  } @else if (seatingMapUrl() !== null) {
    <seating-selector
      [seatingMapUrl]="seatingMapUrl()!"
      [state]="seatingMapState()"
      [locale]="locale"
      [manageAsFreeSeatingMap]="false"
      [showTopBar]="true"
      (selectSeats)="onSelectSeats($event)"
      (sessionExpired)="onSessionExpired()"
    ></seating-selector>
  }
</div>
