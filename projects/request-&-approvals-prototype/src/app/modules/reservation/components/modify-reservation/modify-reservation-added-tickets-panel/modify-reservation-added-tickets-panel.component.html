<ignt-expansion-panel
  [isCollapsed]="false"
  variant="borderless"
  class="modify-reservation-added-tickets-panel"
  [attr.data-testid]="panelTestId()"
>
  <div expansion-panel-title class="modify-reservation-added-tickets-panel__title">
    <span>{{ 'reservations.modify.ticketsAdded' | translate: { count: count() } }}</span>
  </div>
  <div class="modify-reservation-added-tickets-panel__body">
    @for (line of lines(); track trackLine($index, line)) {
      <div class="modify-reservation-added-tickets-panel__line" data-testid="modify-reservation-added-ticket-line">
        <div class="modify-reservation-added-tickets-panel__line__content">
          <span class="modify-reservation-added-tickets-panel__line__title" data-testid="modify-reservation-added-ticket-title">
            {{ line.quantity }}× {{ line.title }}
          </span>
          @if (!line.isShopProduct) {
            <span class="modify-reservation-added-tickets-panel__line__date" data-testid="modify-reservation-added-ticket-date">
              {{ line.startDate | momentDate: 'd MMM EE HH:mm' : line.timezone : locale() }}
            </span>
          }
        </div>
        <button
          ignt-icon-button
          variant="danger"
          sentiment="tertiary"
          size="small"
          [icon]="['fal', 'trash-alt']"
          [attr.aria-label]="'reservations.modify.removeTicketType' | translate"
          data-testid="modify-reservation-added-ticket-remove"
          (click)="onRemove(line)"
        ></button>
      </div>
    }
  </div>
</ignt-expansion-panel>
