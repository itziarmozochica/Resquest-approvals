<ignt-dialog-header hideCloseButton data-testid="modify-reservation-discard-add-tickets-dialog__title">
  {{ 'reservations.modify.discardAddTicketsDialog.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  {{ 'reservations.modify.discardAddTicketsDialog.message' | translate }}
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <button
    igntButton
    sentiment="primary"
    size="large"
    data-testid="modify-reservation-discard-add-tickets-dialog__dismiss"
    (click)="dismiss()"
  >
    {{ 'reservations.modify.discardAddTicketsDialog.dismiss' | translate }}
  </button>
  <button
    igntButton
    sentiment="secondary"
    variant="danger"
    size="large"
    data-testid="modify-reservation-discard-add-tickets-dialog__confirm"
    (click)="discard()"
  >
    {{ 'reservations.modify.discardAddTicketsDialog.confirm' | translate }}
  </button>
</ignt-dialog-footer>
