<div class="modify-reservation-free-map" data-testid="modify-reservation-free-map">
  @if (loading()) {
    <div class="modify-reservation-free-map__loading" data-testid="modify-reservation-free-map-loading"></div>
  } @else if (seatingMapUrl() !== null) {
    <seating-selector
      [seatingMapUrl]="seatingMapUrl()!"
      [state]="seatingMapState()"
      [locale]="locale"
      [manageAsFreeSeatingMap]="true"
      [showTopBar]="true"
      (updateSeatsInCart)="onUpdateSeatsInCart($event)"
    ></seating-selector>
  }
</div>
