<app-modal-content [title]="'reservation.deposit.modal.title' | translate">
  <ng-container>
    <div class="modal-body modal__content deposit-info-modal__body">
      <div class="messages">
        <div class="messages__row">
          <div class="deposit-info-list">
            <div class="deposit-info-list__item" *ngFor="let item of listItems">· {{ item | translate }}</div>
          </div>
        </div>
      </div>
      <div class="modal__actions">
        <button igntButton [fill]="true" data-testid="deposit-info-modal-accept-button" (click)="activeModal.close()">
          {{ 'reservation.deposit.modal.gotIt' | translate }}
        </button>
      </div>
    </div>
  </ng-container>
</app-modal-content>
