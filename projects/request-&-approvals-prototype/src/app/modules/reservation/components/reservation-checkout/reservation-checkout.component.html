<app-page-title
  [section]="'menu.overview' | translate"
  [sectionLink]="'/reservations/list'"
  [subsection]="reservation()?.locator ?? ''"
  [title]="'menu.reservationPayment' | translate"
  class="new-design"
  [backInHistory]="false"
/>
<div class="main-wrapper">
  <div class="reservation-checkout">
    <app-reservation-checkout-details />
    <app-reservation-checkout-payment-selector />
  </div>
</div>

<ng-template #checkoutErrorBody>
  @if (checkoutError(); as error) {
    <span class="reservation-checkout__error">
      <span>{{ error.before }}</span>
      @if (error.link; as link) {
        <a rel="noopener noreferrer" target="_blank" [href]="link.href">{{ link.label }}</a>
      }
      <span>{{ error.after }}</span>
    </span>
  }
</ng-template>
