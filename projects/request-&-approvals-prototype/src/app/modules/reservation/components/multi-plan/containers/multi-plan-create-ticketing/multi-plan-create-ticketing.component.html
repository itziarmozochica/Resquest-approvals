<div class="multi-plan-create-ticketing">
  <app-reservations-header [title]="'reservations.multiPlan.title' | translate" [showGoBack]="false" />

  <div class="multi-plan-create-ticketing__layout">
    <div class="multi-plan-create-ticketing__main">
      @if (selections().length > 0) {
        <app-multi-plan-plan-switcher
          [currentPlanId]="currentPlanId()"
          [selections]="selections()"
          (addPlan)="onAddPlan()"
          (switchPlan)="onSwitchPlan($event)"
        />
      }

      @for (key of [ticketingKey()]; track key) {
        @if (key !== '-') {
          <app-reservation-ticketing [isHiddenInput]="shouldShowHiddenSessions()" />
        }
      }
    </div>
  </div>
</div>
