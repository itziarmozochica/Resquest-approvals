<div class="multi-plan-create">
  <app-reservations-header [showGoBack]="false" [title]="'reservations.multiPlan.title' | translate" />

  @if (plans().length !== 0) {
    <app-reservations-choose-event-filters />
  }

  @if (isLoading()) {
    <div class="main-wrapper">
      <ignt-wrapper-card [elevation]="3">
        <div class="multi-plan-create__loading" data-testid="multi-plan-create-loading">
          <ignt-icon class="loader" name="spinner" variant="solid" size="h1" [spin]="true" aria-hidden="true" />
        </div>
      </ignt-wrapper-card>
    </div>
  } @else if (hasError()) {
    <div class="main-wrapper">
      <ignt-wrapper-card [elevation]="3">
        <div class="multi-plan-create__error" data-testid="multi-plan-create-error">
          <ignt-alert
            data-testid="multi-plan-create-error-alert"
            sentiment="danger"
            [actionLabel]="'common.retry' | translate"
            [description]="'reservations.multiPlan.loadPlansError.description' | translate"
            [title]="'reservations.multiPlan.loadPlansError.title' | translate"
            (actionClicked)="loadPlans()"
          />
        </div>
      </ignt-wrapper-card>
    </div>
  } @else if (plans().length === 0) {
    <app-reservations-choose-event-empty-state />
  } @else {
    <app-reservations-choose-event-selector
      [emitSelectionOnly]="true"
      (planSelected)="selectPlanForTicketing($event.plan, $event.placeId)"
    />
  }
</div>
