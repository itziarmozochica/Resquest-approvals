<div class="multi-plan-plan-switcher">
  <div class="multi-plan-plan-switcher__row">
    <ignt-tabs
      class="multi-plan-plan-switcher__tabs"
      data-testid="multi-plan-plan-tabs"
      [hasExtraLine]="true"
      [selectedIndex]="selectedTabIndex()"
      (selectedIndexChange)="onSelectedTabIndexChanged($event)"
    >
      @for (selection of selections(); track selection.plan.id) {
        <ignt-tabs-item [label]="planTabLabel(selection)">
          <!-- Tab panels are unused; plan content lives in the ticketing area below. -->
        </ignt-tabs-item>
      }
    </ignt-tabs>
    <ignt-button
      class="multi-plan-plan-switcher__add"
      data-testid="multi-plan-add-plan"
      [label]="'reservations.multiPlan.addAnotherPlan' | translate"
      variant="secondary"
      size="small"
      (click)="onAddPlan()"
    />
  </div>
</div>
