<ignt-dialog-header hideCloseButton data-testid="authenticated-mfa-enrollment-modal-title">
  {{ 'mfa.enrollment.title' | translate }}
</ignt-dialog-header>

<button
  type="button"
  class="authenticated-mfa-enrollment-modal__close"
  ignt-icon-button
  variant="sharp"
  sentiment="tertiary"
  [icon]="['fas', 'times']"
  [attr.aria-label]="'common.close' | translate"
  data-testid="authenticated-mfa-enrollment-modal-close"
  (click)="enrollment.requestClose()"
></button>

<ignt-dialog-content>
  <app-authenticated-mfa-enrollment #enrollment (cancelled)="onDismiss()" (completed)="onCompleted()" (enrolled)="onEnrolled()" />
</ignt-dialog-content>
