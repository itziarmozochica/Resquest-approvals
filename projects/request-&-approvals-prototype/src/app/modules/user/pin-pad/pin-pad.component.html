<div class="pin-pad" data-testid="pin-pad">
  <div class="pin-pad__dots-loading-container">
    <div class="pin-pad__dots" [class.pin-pad__dots--loading]="isLoading()">
      @for (i of getDotsArray(); track $index) {
        <span
          class="pin-pad__dot"
          [class.pin-pad__dot--filled]="!isLoading() && $index < pin.length"
          [class.pin-pad__dot--loading]="isLoading()"
          [class.pin-pad__dot--loading-second]="isLoading() && i === 1"
          [class.pin-pad__dot--loading-third]="isLoading() && i === 2"
          [class.pin-pad__dot--loading-fourth]="isLoading() && i === 3"
        ></span>
      }
    </div>
  </div>

  <div class="pin-pad__error" data-testid="pin-pad-error">
    @if (errorMessage()) {
      <ignt-icon name="exclamation-circle" variant="solid" size="caption" class="pin-pad__error-icon"></ignt-icon>
      <span class="pin-pad__error-message">{{ errorMessage() }}</span>
    }
  </div>

  <div class="pin-pad__keypad">
    @for (digit of digits; track digit) {
      <button
        type="button"
        [class]="'pin-pad__key pin-pad__key--digit-' + digit"
        [class.pin-pad__key--pressed]="pressedKey() === digit"
        [attr.data-testid]="'pin-digit-' + digit"
        [disabled]="isLoading()"
        (pointerdown)="onKeyPointerDown($event, digit)"
        (pointerup)="onKeyPointerEnd()"
        (pointercancel)="onKeyPointerEnd()"
        (pointerleave)="onKeyPointerEnd()"
        (click)="onKeyClick($event, digit)"
      >
        {{ digit }}
      </button>
    }
    <button
      type="button"
      class="pin-pad__key pin-pad__key--backspace"
      data-testid="pin-backspace"
      [class.pin-pad__key--pressed]="pressedKey() === backspaceKey"
      [disabled]="isLoading()"
      (pointerdown)="onKeyPointerDown($event, backspaceKey)"
      (pointerup)="onKeyPointerEnd()"
      (pointercancel)="onKeyPointerEnd()"
      (pointerleave)="onKeyPointerEnd()"
      (click)="onKeyClick($event, backspaceKey)"
    >
      <ignt-icon name="backspace" variant="light" size="h3"></ignt-icon>
    </button>
  </div>
</div>
