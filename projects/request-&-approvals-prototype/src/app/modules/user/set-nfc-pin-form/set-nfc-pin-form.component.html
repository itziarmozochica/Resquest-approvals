<div class="login-full-viewport-height">
  <app-login-form-container [title]="'nfcPin.' + method() + '.title' | translate" backLink="/login">
    <p class="external-container__subtitle" data-testid="set-nfc-pin-explanation">
      {{ 'nfcPin.' + method() + '.explanation' | translate }}
    </p>

    <app-digit-input
      class="set-nfc-pin__digit-input"
      [digitLength]="pinLength"
      [showToggleVisibility]="true"
      (valueChange)="onPinChange($event)"
    ></app-digit-input>

    @if (errorMessage()) {
      <div class="external-container__error" data-testid="set-nfc-pin-error">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <ignt-button
      variant="primary"
      fill
      data-testid="set-nfc-pin-submit"
      [disabled]="pin().length !== pinLength || isSubmitting()"
      [label]="'nfcPin.submit' | translate"
      (click)="submit()"
    ></ignt-button>
  </app-login-form-container>
</div>
