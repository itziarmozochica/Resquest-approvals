<div class="login-full-viewport-height mfa-screen">
  <app-login-form-container class="login-form-container" [title]="'mfa.recovery.title' | translate" [hideBackButtons]="false" [logo]="null">
    @if (error(); as errorMessage) {
      <ignt-alert
        class="external-container__banner"
        [description]="errorMessage | translate"
        sentiment="danger"
        data-testid="mfa-recovery-error"
      />
    }

    <div class="mfa-recovery">
      <form [formGroup]="recoveryForm" (ngSubmit)="submitRecoveryCode()" class="mfa-recovery__form">
        <p class="mfa-recovery__description" translate>mfa.recovery.description</p>

        <div class="mfa-recovery__input-container">
          <ignt-input-field
            formControlName="recoveryCode"
            [label]="'mfa.recovery.inputLabel' | translate"
            [placeholder]="'mfa.recovery.inputPlaceholder' | translate"
            [customFormErrors]="[
              { type: 'required', message: ('mfa.recovery.error.required' | translate) },
              { type: 'pattern', message: ('mfa.recovery.error.invalidFormat' | translate) },
            ]"
            [id]="'mfa-recovery-code-input'"
            (input)="onCodeInput($event)"
          />
        </div>

        <button
          type="submit"
          igntButton
          size="large"
          sentiment="primary"
          [fill]="true"
          [loading]="isLoading()"
          [disabled]="recoveryForm.invalid || isLoading()"
          data-testid="mfa-recovery-submit-button"
          translate
        >
          mfa.recovery.submit
        </button>
      </form>
    </div>

    <button
      type="button"
      class="mfa-recovery__link"
      [attr.aria-label]="'mfa.recovery.backToVerification' | translate"
      data-testid="mfa-recovery-back-button"
      (click)="onBackClick()"
    >
      {{ 'mfa.recovery.backToVerification' | translate }}
    </button>
  </app-login-form-container>
</div>
<app-footer [class.no-pointer-events]="true"></app-footer>
