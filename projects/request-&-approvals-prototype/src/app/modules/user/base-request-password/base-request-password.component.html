<div class="login-full-viewport-height">
  <app-login-form-container
    class="login-form-container"
    [title]="title | translate"
    [logo]="(config$ | async)?.brand?.feverzoneLogoHeader || null"
    backLink="/"
  >
    <p class="external-container__subtitle" translate>{{ explanation }}</p>
    <form [formGroup]="requestForm" (ngSubmit)="requestPassword()" data-testid="request-password-form">
      <div class="external-container__error" *ngIf="error.status" data-testid="external-container-error">
        <fa-icon class="external-container__error-icon" [icon]="['fal', 'exclamation-triangle']"></fa-icon>
        <span translate>{{ errorRequest }}</span>
      </div>
      <div class="external-container__form-group">
        <label for="id_username" class="external-container__form-label">
          <fa-icon [icon]="['fal', 'user-circle']"></fa-icon>
        </label>
        <input
          id="id_username"
          type="text"
          class="external-container__form-input"
          placeholder="{{ 'login.userName' | translate }}"
          autofocus
          formControlName="username"
          data-testid="request-password-input"
        />
      </div>
      <button class="button button--large button--primary button--fill" type="submit" [disabled]="!requestForm.valid" translate>
        common.confirm
      </button>
    </form>
  </app-login-form-container>
  <app-footer class="no-pointer-events"></app-footer>
</div>
