<div class="external-container" [class.external-container--modal]="componentAsModal">
  <ng-container *ngIf="!hideBackButtons && hasValidBackLink">
    <a *ngIf="!isExternalLink" [routerLink]="backLink" class="external-container__back">
      <fa-icon class="external-container__back-icon" [icon]="['fal', 'angle-left']"></fa-icon>
      {{ 'common.back' | translate }}
    </a>
    <a *ngIf="isExternalLink" [href]="backLink" class="external-container__back">
      <fa-icon class="external-container__back-icon" [icon]="['fal', 'angle-left']"></fa-icon>
      &nbsp;{{ 'common.back' | translate }}
    </a>
  </ng-container>
  <div class="external-container__form" data-testid="login-form">
    <div *ngIf="logo" class="external-container__form-logo">
      <img [src]="logo" />
    </div>
    @if (showTitle) {
      <div class="external-container__form-title">{{ title }}</div>
    }
    <ng-content></ng-content>
  </div>
</div>
