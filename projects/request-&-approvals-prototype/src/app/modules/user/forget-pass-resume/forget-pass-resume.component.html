<div class="login-full-viewport-height">
  <app-login-form-container
    class="login-form-container"
    [title]="'forgotPasswordResume.checkYourInbox' | translate"
    backLink="/request-password"
  >
    <p
      class="external-container__subtitle"
      [innerHTML]="'forgotPasswordResume.explanation' | translate"
      data-testid="forget-password-resume"
    ></p>
    <a class="external-container__link" routerLink="/" translate>forgotPasswordResume.backToSignIn</a>
  </app-login-form-container>
  <app-footer class="no-pointer-events"></app-footer>
</div>
