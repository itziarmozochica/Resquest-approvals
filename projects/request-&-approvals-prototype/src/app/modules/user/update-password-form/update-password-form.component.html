<div class="login-full-viewport-height">
  <app-login-form-container [title]="title" backLink="/" *ngIf="!showWaitForEmailMessage">
    <div *ngIf="error" class="external-container__error" data-testid="external-container-error">
      <fa-icon [icon]="['fal', 'exclamation-triangle']" class="external-container__error-icon"></fa-icon>
      <span translate>createPassword.invalidPassword</span>
    </div>
    <p class="external-container__subtitle mb-0" translate>passwordPattern.explanation</p>
    <ul>
      <li translate>passwordPattern.minCharacter</li>
      <li translate>passwordPattern.uppercaseLetters</li>
      <li translate>passwordPattern.digits</li>
      <li translate>passwordPattern.specialCharacter</li>
      <li *ngIf="method === 'reset'" translate>passwordPattern.notUsedBefore</li>
    </ul>
    <form (ngSubmit)="submit()" [formGroup]="form" data-testid="update-password-form">
      <div class="external-container__form-group">
        <label class="external-container__form-label">
          <fa-icon [icon]="['fal', 'lock-alt']"></fa-icon>
        </label>
        <input
          [ngClass]="'external-container__form-input' + getControlClass(form.get('password'))"
          [placeholder]="'createPassword.newPassword' | translate"
          [type]="showPassword ? 'text' : 'password'"
          autofocus
          class="external-container__form-input"
          data-testid="update-password-form-new-value"
          formControlName="password"
        />
        <fa-icon
          (click)="changePasswordVisibility()"
          [icon]="['fal', showPassword ? 'eye' : 'eye-slash']"
          class="external-container__form-show-password"
          data-testid="show-password"
        ></fa-icon>
        <app-validation-error-messages [control]="form.get('password')"></app-validation-error-messages>
      </div>
      <div class="external-container__form-group">
        <label class="external-container__form-label">
          <fa-icon [icon]="['fal', 'lock-alt']"></fa-icon>
        </label>
        <input
          [ngClass]="'external-container__form-input' + getControlClass(form.get('confirmPassword'))"
          [placeholder]="'createPassword.confirmPassword' | translate"
          [type]="showConfirmPassword ? 'text' : 'password'"
          class="external-container__form-input"
          data-testid="update-password-form-confirm-value"
          formControlName="confirmPassword"
        />
        <fa-icon
          (click)="changeConfirmPasswordVisibility()"
          [icon]="['fal', showConfirmPassword ? 'eye' : 'eye-slash']"
          class="external-container__form-show-password"
        ></fa-icon>
        <app-validation-error-messages [control]="form.get('confirmPassword')"></app-validation-error-messages>
      </div>
      <button
        [disabled]="form.invalid || !token"
        class="button button--large button--primary button--fill"
        data-testid="update-password-button"
        translate
        type="submit"
      >
        createPassword.setNewPassword
      </button>
    </form>
    <div class="external-container__terms">
      <span [innerHTML]="'createPassword.terms' | translate: { termsURL, privacyURL }"></span>
    </div>
  </app-login-form-container>
  <div class="wait-for-email-message external-container" *ngIf="showWaitForEmailMessage">
    <div class="external-container__form">
      <fa-icon [icon]="['fas', 'envelope-open-text']"></fa-icon>
      <p class="external-container__form-title mb-0" translate>passwordConfigured.title</p>
      <p translate>passwordConfigured.subtitle</p>
    </div>
  </div>
  <app-footer class="no-pointer-events"></app-footer>
</div>
