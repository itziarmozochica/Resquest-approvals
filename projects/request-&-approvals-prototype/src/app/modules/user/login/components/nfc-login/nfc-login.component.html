@if (forceShowPinPad()) {
  <div class="pin-pad-wrapper">
    <div class="pin-pad-wrapper__header">
      <button type="button" class="pin-pad-wrapper__back" (click)="onBackToLogin()" data-testid="pin-pad-back">
        <ignt-icon name="angle-left" variant="light" size="base"></ignt-icon>
      </button>
      <h2 class="pin-pad-wrapper__title" translate>login.enterPin</h2>
    </div>
    <p class="pin-pad-wrapper__subtitle" translate>login.pinSubtitle</p>
    <app-pin-pad
      #pinPadRef
      [errorMessage]="nfcLoginError ? (nfcLoginError | translate) : null"
      [isLoading]="isLoadingNfcLogin()"
      (pinChange)="onPinChange($event)"
      (pinComplete)="onPinComplete($event)"
    ></app-pin-pad>
  </div>
}
