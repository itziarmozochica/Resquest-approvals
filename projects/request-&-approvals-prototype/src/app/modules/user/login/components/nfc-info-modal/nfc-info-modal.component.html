<div class="nfc-info-modal-wrapper" [class.nfc-info-modal-wrapper--mobile-pos]="isMobilePos">
  <div class="nfc-info-modal-header">
    <h2 class="nfc-info-modal-header__title">{{ 'login.nfc.howCanIIdentifyMyselfWithCard' | translate }}</h2>
  </div>
  <div class="nfc-info-modal">
    <p class="nfc-info-modal__instructions" data-testid="nfc-info-modal-instructions">{{ instructionsKey | translate }}</p>
    <div class="nfc-info-modal__animation">
      <app-nfc-success-animation [device]="isMobilePos ? 'mobilePos' : 'dualScreen'"></app-nfc-success-animation>
    </div>
    <div class="nfc-info-modal__actions">
      <ignt-button
        variant="primary"
        fill
        [label]="(isMobilePos ? 'common.cancel' : 'common.ok') | translate"
        (click)="close()"
        data-testid="nfc-info-modal-ok-button"
      />
    </div>
  </div>
</div>
