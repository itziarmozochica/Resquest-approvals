<div class="no-organization-message">
  <ignt-wrapper-card elevation="1">
    <fa-icon [icon]="['fal', 'exclamation-circle']" class="no-organization-message__icon--error"></fa-icon>
    @if (belongsToMarketplace()) {
      <h3 class="no-organization-message__title">{{ 'noOrganizationMessage.marketplaceOrganization.title' | translate }}</h3>
      <p class="no-organization-message__content">{{ 'noOrganizationMessage.marketplaceOrganization.subtitle' | translate }}</p>
    } @else {
      <h3 class="no-organization-message__title">{{ 'noOrganizationMessage.title' | translate }}</h3>
      <p class="no-organization-message__content">{{ 'noOrganizationMessage.subtitle' | translate }}</p>
    }
    <ignt-button
      variant="tertiary"
      (click)="logout()"
      class="no-organization-message__button"
      [label]="'noOrganizationMessage.cta' | translate"
    />
  </ignt-wrapper-card>
</div>
