  <div class="qr-download-body__footer">
    @if (hasBatches()) {
      <p class="qr-download-body__text" data-testid="ticket-batches-text">{{ 'downloadTicket.batchesText' | translate }}</p>
      <ul class="qr-download-body__batches" data-testid="ticket-batches">
        @for (batch of batches(); track batch.url) {
          <li>
            <a
              class="button button--fill button--large button--primary"
              [href]="batch.url"
              (click)="trackBatchOpen(batch)"
              data-testid="ticket-batch-link"
            >
              {{ batch.label }}
            </a>
          </li>
        }
      </ul>
    } @else {
      <div class="qr-download-body__instructions" data-testid="open-instructions">
        <ol>
          <li [innerHTML]="'downloadTicket.openInstructions.firstStep' | translate"></li>
          <li [innerHTML]="'downloadTicket.openInstructions.secondStep' | translate"></li>
        </ol>
      </div>
      <button
        class="button button--fill button--large button--primary"
        type="button"
        (click)="openTickets()"
        [disabled]="isLoading()"
        data-testid="open-tickets"
      >
        @if (isLoading()) {
          {{ 'downloadTicket.loading' | translate }}
        } @else if (hasOpenedTickets()) {
          {{ 'downloadTicket.openAgain' | translate }}
        } @else {
          {{ 'downloadTicket.download' | translate }}
        }
      </button>
      @if (hasOpenedTickets() && !isLoading()) {
        <p class="qr-download-body__text" data-testid="tickets-opened-text">{{ 'downloadTicket.openedText' | translate }}</p>
      }
    }
  </div>
</div>
