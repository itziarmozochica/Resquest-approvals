<section class="invitations-page" [attr.aria-label]="'menu.invitations' | translate">
  <app-event-selection-band data-testid="invitations-selectors" [summary]="plan?.name || ('invitations.searchFilters' | translate)">
    <app-search-bar
      [disabled]="true"
      [screen]="screen.invitations"
      [searchOnChange]="true"
      [showVenue]="true"
      (searchEmitter)="loadNewSearch($event)"
    ></app-search-bar>
  </app-event-selection-band>

  <app-invitations-page-title />

  <div class="box-office-content__content-card invitations-page__confirmation">
    <invitation-confirmation-detail [invitations]="invitations" [plan]="plan" [hasSeatsSelected]="hasSeatsSelected">
    </invitation-confirmation-detail>
    <div class="invitations-page__confirmation-buttons">
      <ng-container [ngTemplateOutlet]="buttonsConfirmationTemplate" />
    </div>
  </div>
</section>

<div class="only-in-mobile">
  <bottom-slider [buttonsTemplate]="buttonsConfirmationTemplate"> </bottom-slider>
</div>

<ng-template #buttonsConfirmationTemplate>
  <div class="confirmation-buttons">
    <ignt-button
      [label]="'invitations.confirmation.goHome' | translate"
      variant="secondary"
      [fill]="isMobile()"
      data-testid="invitation-go-home-button"
      (click)="clickOnGoHome()"
    />
    <ignt-button
      [label]="'invitations.confirmation.newInvitations' | translate"
      [fill]="isMobile()"
      data-testid="create-new-invitations-button"
      (click)="clickOnCreateInvitations()"
    />
  </div>
</ng-template>
