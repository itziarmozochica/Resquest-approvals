<div class="delivery-status-dialog">
  <h2 class="delivery-status-dialog__title">{{ titleKey() | translate }}</h2>
  <div class="delivery-status-dialog__separator"></div>
  <div class="delivery-status-dialog__icon">
    <fa-icon [icon]="config().icon" [size]="config().size" [class.loader]="config().isLoading" />
  </div>
  <p class="delivery-status-dialog__message">{{ messageKey() | translate }}</p>
  <button
    igntButton
    [fill]="true"
    class="delivery-status-dialog__button"
    data-testid="delivery-status-dialog-close-button"
    (click)="close()"
  >
    {{ 'common.ok' | translate }}
  </button>
</div>
