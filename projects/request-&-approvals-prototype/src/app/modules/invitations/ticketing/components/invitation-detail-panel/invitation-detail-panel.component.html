<ignt-dialog-header>{{ titleKey | translate }} · {{ data.guestName }}</ignt-dialog-header>

<ignt-dialog-content>
  @if (isSeatsPanel) {
    <app-order-seat-list-panel [seats]="data.seats" (closePanel)="close()" />
  } @else {
    <app-order-ticket-breakdown-panel [loadState]="loadState()" [tickets]="tickets()" (retryLoad)="loadTickets()" (closePanel)="close()" />
  }
</ignt-dialog-content>
