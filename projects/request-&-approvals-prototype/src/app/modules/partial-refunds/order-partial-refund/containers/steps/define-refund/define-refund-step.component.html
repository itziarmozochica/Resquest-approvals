<div class="define-refund-step" data-testid="order-partial-refund-define-refund-step">
  <app-partial-refund-definition-form
    class="define-refund-step__form"
    [isSurchargeIncluded]="store.includeSurcharge()"
    [mode]="store.mode()"
    [preview]="store.preview()"
    [previewedAmount]="store.previewedAmount()"
    [previewedRate]="store.previewedRate()"
    [reason]="store.reason()"
    [value]="store.value()"
    (isSurchargeIncludedChange)="onIncludeSurchargeChange($event)"
    (modeChange)="store.setMode($event)"
    (reasonChange)="store.setReason($event)"
    (valueChange)="onValueChange($event)"
  />

  <app-refund-summary-panel
    class="define-refund-step__summary"
    [includeSurcharge]="store.previewedIncludeSurcharge()"
    [preview]="store.preview()"
    [rate]="store.previewedRate()"
    [skippedNoteKey]="'orders.partialRefund.defineRefund.skipped'"
  />
</div>
