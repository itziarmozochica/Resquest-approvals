<ol class="refund-step-track" data-testid="refund-step-track">
  @for (step of steps(); track step.id) {
    <li
      class="refund-step-track__step"
      [class.refund-step-track__step--current]="step.isCurrent"
      [class.refund-step-track__step--done]="step.isDone"
      [attr.aria-current]="step.isCurrent ? 'step' : null"
      [attr.data-testid]="'refund-step-track-' + step.id"
    >
      <span class="refund-step-track__dot" aria-hidden="true"></span>
      <span class="refund-step-track__label">
        {{ 'orders.bulkPartialRefunds.steps.' + step.id + '.label' | translate }}
      </span>
      @if (!step.isLast) {
        <span class="refund-step-track__connector" aria-hidden="true"></span>
      }
    </li>
  }
</ol>
