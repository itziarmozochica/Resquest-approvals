<section class="event-settings-page" [attr.aria-label]="'menu.eventSettings' | translate">
  <app-event-selection-band
    data-testid="event-settings-selectors"
    [summary]="selectedPlan()?.title || ('eventSettings.searchFilters' | translate)"
  >
    <app-search-bar
      data-testid="event-settings-search-bar"
      [mandatoryFilters]="[SearchBarFilter.plan]"
      [screen]="screen.contentPlan"
      [searchOnChange]="true"
      [showVenue]="true"
      (searchEmitter)="loadNewSearch($event)"
    ></app-search-bar>
  </app-event-selection-band>

  <div class="event-settings-page__title">
    <span class="event-settings-page__section">{{ 'menu.events' | translate }}</span>
    <h1 class="event-settings-page__heading" data-testid="page-title">{{ 'menu.eventSettings' | translate }}</h1>
  </div>

  @if (selectedPlan(); as plan) {
    <div class="event-settings-page__form" data-testid="settings-form">
      <app-plan-settings-edit [planId]="plan.id" [mode]="'edit'"></app-plan-settings-edit>
    </div>
  } @else {
    <div class="event-settings-page__state" data-testid="content-empty">
      <ignt-icon aria-hidden="true" name="sensor-alert" size="h1" variant="light" />
      <span class="event-settings-page__state-title">{{ 'eventSettings.noEventSelectedTitle' | translate }}</span>
      <span>{{ 'eventSettings.noEventSelectedDescription' | translate }}</span>
    </div>
  }
</section>
