<div class="event-redirect-section">
  <div class="event-redirect-section__content">
    <div class="event-redirect-section__content-container">
      <div class="event-redirect-section__toggle-container">
        <div class="event-redirect-section__toggle-info">
          <span class="font-h6 event-redirect-section__field-title">
            {{ 'eventSettings.redirectEvent.title' | translate }}
            @if (isSuperuserOnlyField(config?.redirectToId, !isRedirectInteractionDisabled)) {
              <app-fever-only-marker />
            }
            <span
              class="event-redirect-section__tooltip-icon"
              igntTooltip
              tooltipPlacement="top"
              [tooltipLabel]="'eventSettings.redirectEvent.tooltip' | translate"
            >
              <ignt-icon name="info-circle" variant="solid" size="sm"></ignt-icon>
            </span>
          </span>
          <div class="font-small-regular" [innerHTML]="'eventSettings.redirectEvent.description' | translate"></div>
        </div>
        <ignt-toggle
          [checked]="redirectEnabled"
          [disabled]="isRedirectInteractionDisabled"
          (change)="onRedirectEnabledChange($event)"
          data-testid="event-redirect-toggle"
        />
      </div>
      <div class="event-redirect-section__redirect-container" *ngIf="redirectEnabled">
        <div class="event-redirect-section__city-filter" *ngIf="cityOptions.length > 1">
          <ignt-typeahead
            id="cityFilter"
            [selectAllLabel]="'filters.allCities' | translate"
            [fieldLabel]="'common.city' | translate"
            [inputType]="selectOptionTypeaheadInput.city"
            [options]="cityOptions"
            [selectedOption]="selectedCity()"
            [disabled]="isRedirectInteractionDisabled"
            (selected)="selectCity($event)"
            (change)="$event.stopPropagation()"
            data-testid="city-filter-typeahead"
          >
          </ignt-typeahead>
        </div>
        <div class="event-redirect-section__plan-filter">
          <ignt-typeahead
            [fieldLabel]="'common.event' | translate"
            [inputType]="selectOptionTypeaheadInput.plan"
            [options]="planOptions()"
            [selectedOption]="selectedPlan()"
            [disabled]="isRedirectInteractionDisabled"
            (selected)="selectPlan($event)"
            (change)="$event.stopPropagation()"
            data-testid="event-typeahead"
          >
          </ignt-typeahead>
        </div>
      </div>
      <ignt-alert
        *ngIf="redirectEnabled && selectedPlan()"
        sentiment="warning"
        [description]="'eventSettings.redirectEvent.warningMessage' | translate: { eventName: selectedPlan()?.title }"
      ></ignt-alert>
    </div>
  </div>
</div>
