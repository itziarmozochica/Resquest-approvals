<ng-select
  class="waiting-room-form__select"
  [class.waiting-room-form__select--error]="isNgSelectShowingValidationError()"
  [clearable]="clearable()"
  [formControl]="control()"
  [items]="items()"
  [searchable]="searchable()"
  bindValue="id"
  bindLabel="title"
  [placeholder]="placeholder()"
  (blur)="onBlur()"
></ng-select>
@if (isControlRequiredError()) {
  <ignt-field-error [formControlValue]="control()" errorName="required">
    {{ 'common.requiredField' | translate }}
  </ignt-field-error>
}
