<div class="waiting-room-section">
  <div class="waiting-room-section__content">
    <ignt-wrapper-card>
      <div>
        <div class="waiting-room-section__header">
          <h4 class="font-h4">{{ i18n.title | translate }}</h4>
          <p class="font-small-regular waiting-room-section__description">{{ i18n.description | translate }}</p>
        </div>
        <div class="waiting-room-section__form" [formGroup]="waitingRoomForm()">
          <div class="waiting-room-section__field">
            <h6 class="waiting-room-section__field-title font-h6">{{ i18n.channel | translate }}</h6>
            <p class="font-small-regular waiting-room-section__field-description">{{ i18n.channelHelper | translate }}</p>
            <app-waiting-room-field-select
              [control]="waitingRoomForm().controls[formField.CHANNEL_ID]"
              [items]="channelOptions()"
              [placeholder]="i18n.channel | translate"
            />
          </div>
          @if (hasChannelSelected()) {
            <div class="waiting-room-section__toggle-container">
              <ignt-toggle
                [checked]="isToggleOn()"
                [disabled]="isToggleDisabled() || !canEditPlan()"
                (change)="onToggleChange($event)"
                data-testid="waiting-room-toggle"
              />
            </div>
          }
          @if (showLoader() && hasChannelSelected()) {
            <div class="waiting-room-section__loader" data-testid="waiting-room-loader">
              <ignt-icon name="spinner" variant="solid" size="h1" [spin]="true"></ignt-icon>
            </div>
          } @else if (hasChannelSelected() && isToggleOn()) {
            <app-waiting-room-form
              [form]="waitingRoomForm()"
              [planType]="planType()"
              [planMaxOutflow]="planMaxOutflow()"
              data-testid="waiting-room-form"
            />
          }
        </div>
      </div>
    </ignt-wrapper-card>
  </div>
</div>
