<form [formGroup]="form()" class="ticket-settings-form">
  @if (delayedTicketReleaseVisible()) {
    <app-delayed-ticket-release-section
      id="delayed-ticket-release-section"
      data-testid="delayed-ticket-release-section"
      [formGroup]="form().controls.delayedTicketRelease"
      [planId]="planId()"
      [planName]="planName()"
      [rule]="ticketDeliveryRule()"
      [fallbackTimezone]="fallbackTimezone()"
      [fallbackFirstActiveTimeSlot]="fallbackFirstActiveTimeSlot()"
      [canEditPlan]="canEditPlan()"
      [onFormDirtyChange]="onFormDirtyChange()"
    />
  }

  @if (resaleConfig()) {
    <app-resale-section
      id="resale-section"
      data-testid="resale-section"
      [canEditPlan]="canEditPlan()"
      [config]="resaleConfig()"
      [resaleFormControl]="form().controls.resellingProvider"
      [invitationResellingFormControl]="form().controls.allowInvitationReselling"
      [onFormDirtyChange]="onFormDirtyChange()"
    />
  }
</form>
