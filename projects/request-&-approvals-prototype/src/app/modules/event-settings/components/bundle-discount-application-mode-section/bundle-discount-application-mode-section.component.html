<div class="bundle-discount-application-mode-section">
  <ignt-wrapper-card>
    <div>
      <div class="bundle-discount-application-mode-section__header">
        <h4 class="font-h6 bundle-discount-application-mode-section__title">
          {{ 'eventSettings.bundleDiscountApplicationMode.title' | translate }}
          <app-fever-only-marker />
        </h4>
        <p class="font-small-regular">{{ 'eventSettings.bundleDiscountApplicationMode.description' | translate }}</p>
      </div>
      <div class="bundle-discount-application-mode-section__toggle-container">
        <ignt-toggle
          [checked]="value()"
          [disabled]="isDisabled()"
          (change)="onToggleChange($event)"
          data-testid="bundle-discount-application-mode-toggle"
        />
        <span class="font-small-regular">{{ 'eventSettings.bundleDiscountApplicationMode.toggleLabel' | translate }}</span>
      </div>
    </div>
  </ignt-wrapper-card>
</div>
