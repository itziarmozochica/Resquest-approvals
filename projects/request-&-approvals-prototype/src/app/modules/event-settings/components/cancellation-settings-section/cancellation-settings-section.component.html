@if (withCard()) {
  <ignt-wrapper-card>
    <ng-container [ngTemplateOutlet]="sectionContent" />
  </ignt-wrapper-card>
} @else {
  <ng-container [ngTemplateOutlet]="sectionContent" />
}

<ng-template #sectionContent>
  <div class="cancellation-settings-section" data-testid="cancellation-settings-section">
    <div class="cancellation-settings-section__header">
      <h4 class="cancellation-settings-section__title">{{ 'eventSettings.cancellations.title' | translate }}</h4>
      <p class="cancellation-settings-section__description">{{ 'eventSettings.cancellations.description' | translate }}</p>
    </div>

    <ignt-switch
      [checked]="enabled()"
      [disabled]="!canEditToggle()"
      [label]="'eventSettings.cancellations.toggleLabel' | translate"
      (checkedChange)="onToggleChange($event)"
      data-testid="cancellation-settings-toggle"
    />

    @if (enabled()) {
      <div class="cancellation-settings-section__hours">
        <ignt-input-field
          type="number"
          [formControl]="hoursInputControl"
          [helperText]="'eventSettings.cancellations.hoursCutoffHelper' | translate"
          [hideErrorLabels]="true"
          [label]="'eventSettings.cancellations.hoursLabel' | translate"
          [minValue]="hoursMin"
          (input)="onHoursInput()"
          data-testid="cancellation-settings-hours-input"
        />
        @if (hoursErrorMessageKey(); as errorMessageKey) {
          <ignt-field-error [showError]="true" data-testid="cancellation-settings-hours-error">
            {{ errorMessageKey | translate }}
          </ignt-field-error>
        }
      </div>
    }
  </div>
</ng-template>
