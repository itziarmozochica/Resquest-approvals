<form [formGroup]="form()" class="main-settings-form">
  <div class="form-group__fields form-group__fields--one">
    @if (generalConfig()) {
      <app-general-settings-section
        formControlName="generalSettingsSection"
        id="general-settings-section"
        data-testid="general-settings-section"
        [config]="generalConfig()"
      ></app-general-settings-section>
    }
    @if (validationConfig()) {
      <app-validation-section
        formControlName="validationSection"
        id="validation-section"
        data-testid="validation-section"
        [config]="validationConfig()"
      ></app-validation-section>
    }
    @if (contractConfig()) {
      <app-contract-section
        formControlName="contractSection"
        id="contract-section"
        data-testid="contract-section"
        [config]="contractConfig()"
        [planType]="planType()"
        [mainPlanId]="mainPlanId()"
      ></app-contract-section>
    }
    @if (pricesConfig()) {
      <app-prices-section
        formControlName="pricesSection"
        id="prices-section"
        [config]="pricesConfig()"
        data-testid="prices-section"
      ></app-prices-section>
    }
  </div>
</form>
