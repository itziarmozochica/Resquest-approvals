<div class="post-purchase-section">
  <div class="post-purchase-section__content">
    <ignt-wrapper-card>
      <div>
        <div class="post-purchase-section__header">
          <h4 class="font-h4">{{ 'eventSettings.postPurchase.title' | translate }}</h4>
        </div>
        <div class="post-purchase-section__radio-container">
          <h6 class="post-purchase-section__radio-title font-h6">
            {{ 'eventSettings.postPurchase.subtitle' | translate }}
          </h6>
          <p class="font-small-regular post-purchase-section__radio-description">
            {{ 'eventSettings.postPurchase.description' | translate }}
          </p>
          <ignt-radio-group [formControl]="radioGroupControl" data-testid="post-purchase-radio-group">
            <ignt-radio
              label="{{ 'eventSettings.postPurchase.onlyValidated' | translate }}"
              [value]="requestGeneralReview.OnlyValidated"
              [disabled]="radioGroupControl.disabled && radioGroupControl.value !== requestGeneralReview.OnlyValidated"
              data-testid="post-purchase-radio-only-validated"
            ></ignt-radio>
            <ignt-radio
              label="{{ 'eventSettings.postPurchase.yes' | translate }}"
              [value]="requestGeneralReview.Yes"
              [disabled]="radioGroupControl.disabled && radioGroupControl.value !== requestGeneralReview.Yes"
              data-testid="post-purchase-radio-yes"
            ></ignt-radio>
            <ignt-radio
              label="{{ 'eventSettings.postPurchase.no' | translate }}"
              [value]="requestGeneralReview.No"
              [disabled]="radioGroupControl.disabled && radioGroupControl.value !== requestGeneralReview.No"
              data-testid="post-purchase-radio-no"
            ></ignt-radio>
          </ignt-radio-group>
        </div>
      </div>
    </ignt-wrapper-card>
  </div>
</div>
