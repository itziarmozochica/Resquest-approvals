<div class="disallow-indexing-section">
  <div class="disallow-indexing-section__content">
    <div>
      <div class="disallow-indexing-section__header">
        <h4 class="font-h6 disallow-indexing-section__title">
          {{ 'eventSettings.indexing.disallowTitle' | translate }}
        </h4>
        <p class="font-small-regular">{{ 'eventSettings.indexing.disallowDescription' | translate }}</p>
      </div>
      <div class="disallow-indexing-section__toggle-container">
        <ignt-toggle
          [checked]="value"
          [disabled]="isDisabled"
          (change)="onDisallowIndexingChange($event)"
          data-testid="disallow-indexing-toggle"
        />
      </div>
    </div>
  </div>
</div>
