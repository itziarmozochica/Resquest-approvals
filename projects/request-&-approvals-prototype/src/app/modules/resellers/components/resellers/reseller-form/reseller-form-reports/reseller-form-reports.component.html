<p class="font-h3">
  {{ reportSectionTitle | translate: { name: organizationUser?.name } }}
</p>
<ignt-alert
  *ngIf="outage"
  class="my-4 d-block"
  sentiment="warning"
  [description]="'outage.message' | translate"
  data-testid="outage-banner"
></ignt-alert>

<div *ngIf="organizationUser; else wholeNetworkReport">
  <app-member-dashboard
    [resellerId]="resellerId"
    [partnerId]="concessionGranterId"
    [organizationUserId]="organizationUser.id"
  ></app-member-dashboard>
</div>

<ng-template #wholeNetworkReport>
  <app-organization-dashboard [groupName]="resellerOverviewGroupName" [resellerId]="resellerId"></app-organization-dashboard>
  <app-organization-dashboard [groupName]="resellerDashboardGroupName" [resellerId]="resellerId"></app-organization-dashboard>
</ng-template>
