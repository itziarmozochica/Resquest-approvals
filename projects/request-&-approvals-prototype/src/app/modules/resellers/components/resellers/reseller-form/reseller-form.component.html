<app-go-back (goBackEvent)="goBack()" [navigate]="false"> </app-go-back>

<div class="main-wrapper">
  <ignt-wrapper-card [elevation]="1">
    <app-reseller-form-type-selector *ngIf="!resellerFormConcession.concessionTypeSet"></app-reseller-form-type-selector>
    <ng-container *ngIf="resellerFormConcession.concessionTypeSet">
      <h3 class="reseller-name">
        {{ resellerFormConcession.concession?.name }}
        <ignt-tag
          *ngIf="resellerFormConcession.concession?.type"
          [sentiment]="sentimentTag[resellerFormConcession.concession?.type]"
          [variant]="'outline'"
        >
          {{ 'resellers.resellerType.' + resellerFormConcession.concession?.type | translate }}
        </ignt-tag>
      </h3>
      <ul class="tab-list">
        <li
          *ngFor="let tab of tabs"
          [routerLink]="tab.id"
          [queryParams]="currentParams | async"
          routerLinkActive="tab-list__item--selected"
          class="tab-list__item"
          [attr.data-tabid]="tab.id"
          data-testid="tabs-option"
          (click)="tab.click && tab.click()"
          translate
        >
          {{ tab.label }}
        </li>
      </ul>
      <div class="tab-content">
        <router-outlet></router-outlet>
      </div>
    </ng-container>
  </ignt-wrapper-card>
</div>
