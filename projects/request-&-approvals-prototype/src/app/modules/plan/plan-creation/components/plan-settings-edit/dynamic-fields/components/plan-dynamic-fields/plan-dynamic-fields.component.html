<div class="plan-dynamic-fields">
  <app-dynamic-fields-form
    [fields]="fields()"
    [form]="form()"
    [isEventTimezoneUnavailable]="isEventTimezoneUnavailable()"
  ></app-dynamic-fields-form>
</div>
<app-actions-bar
  [continueButtonDisabled]="!isEditable() || isSaving()"
  [continueButtonLoading]="isSaving()"
  [continueButtonTranslationKey]="mode() === 'edit' ? 'common.saveSettings' : continueTranslationKey()"
  [saveDraftDisabled]="!isEditable() || isSaving()"
  [showBackButton]="false"
  [showSaveDraftButton]="mode() === 'creation'"
  continueButtonTestId="plan-dynamic-fields-continue"
  saveDraftTestId="plan-dynamic-fields-save-draft"
  (continue)="save(mode() === 'creation')"
  (saveDraft)="save(false)"
></app-actions-bar>
