<ignt-dialog-header>{{ 'planReview.launchModal.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <section class="plan-launch-modal" data-testid="plan-launch-modal">
    <p class="plan-launch-modal__description">
      {{ 'planReview.launchModal.description' | translate }}
    </p>
    <h4 class="plan-launch-modal__label">
      {{ 'planReview.launchModal.label' | translate }}
    </h4>
    <app-launch-picker [launches]="launches" [selectedLaunchId]="selectedLaunchId()" (launchSelected)="onLaunchSelected($event)" />
  </section>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    data-testid="plan-launch-modal-cancel"
    variant="secondary"
    [label]="'planReview.launchModal.cancel' | translate"
    (click)="cancel()"
  />
  <ignt-button
    data-testid="plan-launch-modal-confirm"
    variant="primary"
    [label]="'planReview.launchModal.confirm' | translate"
    (click)="confirm()"
  />
</ignt-dialog-footer>
