<div class="plan-error">
  <fa-icon [icon]="['fas', 'exclamation-circle']"></fa-icon>
  @if (message) {
    <p>{{ message }}</p>
  } @else {
    <p translate>planSettings.errors.loadFailed</p>
  }
  @if (showRetryButton) {
    <button igntButton type="button" sentiment="secondary" (click)="retry.emit()">
      {{ retryButtonLabel | translate }}
    </button>
  }
</div>
