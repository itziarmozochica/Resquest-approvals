<section class="plan-review-submit-panel" [attr.data-testid]="translationKeys().testId">
  <h3 class="plan-review-submit-panel__title">
    {{ translationKeys().title | translate }}
  </h3>
  <ul class="plan-review-submit-panel__list">
    @for (bullet of translationKeys().bullets; track bullet) {
      <li>{{ bullet | translate }}</li>
    }
  </ul>
  <div class="plan-review-submit-panel__actions">
    @if (variant() === 'both') {
      <button igntButton sentiment="secondary" (click)="onSubmitClick()" [disabled]="loading()" data-testid="submit-for-review-button">
        {{ 'planReview.actions.submitForReview' | translate }}
      </button>
      <button igntButton sentiment="primary" (click)="onSetReadyClick()" [disabled]="loading()" data-testid="set-plan-as-ready-button">
        {{ 'planReview.actions.changeToReady' | translate }}
      </button>
    } @else {
      @if (variant() === 'setReady') {
        <button igntButton sentiment="primary" (click)="onSetReadyClick()" [disabled]="loading()" data-testid="set-plan-as-ready-button">
          {{ 'planReview.actions.changeToReady' | translate }}
        </button>
      }
      @if (variant() === 'submit') {
        <button igntButton sentiment="primary" (click)="onSubmitClick()" [disabled]="loading()" data-testid="submit-for-review-button">
          {{ 'planReview.actions.submitForReview' | translate }}
        </button>
      }
    }
  </div>
</section>
