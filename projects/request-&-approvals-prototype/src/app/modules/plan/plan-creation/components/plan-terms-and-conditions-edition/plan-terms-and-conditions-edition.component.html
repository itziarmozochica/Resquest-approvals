<div class="plan-terms-and-conditions-edition">
  <div class="plan-terms-and-conditions-edition__body">
    <div class="plan-terms-and-conditions-edition__label">
      {{ 'planEdition.termsAndConditionsEdition.descriptionLabel' | translate }}
    </div>
    <ignt-rich-text-editor
      data-testid="plan-terms-and-conditions-editor"
      [formControl]="control"
      [features]="planContentFeatures"
      [blockElement]="'div'"
      [readonly]="isEditorReadOnly()"
      [imageUpload]="uploadImage"
    ></ignt-rich-text-editor>
  </div>
  <div class="plan-terms-and-conditions-edition__info">
    <ignt-icon class="plan-terms-and-conditions-edition__info-icon" name="info-circle" variant="regular" aria-hidden="true"></ignt-icon>
    <span>{{ 'planEdition.termsAndConditionsEdition.descriptionInfo' | translate }}</span>
  </div>
</div>
