<div class="plan-review-rejected-banner" data-testid="plan-review-rejected-banner">
  <ignt-icon class="plan-review-rejected-banner__icon" name="triangle-exclamation" variant="solid" aria-hidden="true"></ignt-icon>
  <div class="plan-review-rejected-banner__content">
    @let rejectionComments = comments();
    <p class="plan-review-rejected-banner__title">
      {{ 'planReview.banner.rejected.title' | translate }}
    </p>
    <p class="plan-review-rejected-banner__text">
      {{ 'planReview.banner.rejected.message' | translate }}
    </p>
    @if (rejectionComments?.length) {
      <ul class="plan-review-rejected-banner__comments">
        @for (comment of rejectionComments; track comment.id) {
          <li>{{ comment.comment }}</li>
        }
      </ul>
    }
  </div>
</div>
