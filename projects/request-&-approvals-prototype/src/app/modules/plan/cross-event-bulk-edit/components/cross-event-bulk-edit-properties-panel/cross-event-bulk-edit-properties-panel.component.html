<ignt-dialog-header data-testid="cross-event-bulk-edit-properties-title">
  {{ 'listPlan.crossEventBulkEdit.properties.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="cross-event-bulk-edit-properties-panel" data-testid="cross-event-bulk-edit-properties-panel">
    <app-bulk-edit-properties-step
      [hiddenProperties]="hiddenProperties"
      [isSuperuser]="false"
      [propertyOptions]="propertyOptions"
      [restrictedProperties]="restrictedProperties()"
      [selectedProperties]="selectedProperties()"
      (selectionChange)="onPropertiesChange($event)"
    />
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <div class="cross-event-bulk-edit-properties-panel__footer">
    <ignt-button
      data-testid="cross-event-bulk-edit-properties-continue"
      fill
      size="large"
      variant="primary"
      [disabled]="isContinueUnavailable()"
      [label]="'common.continue' | translate"
      (click)="onContinue()"
    />
    <div class="cross-event-bulk-edit-properties-panel__back">
      <ignt-button
        data-testid="cross-event-bulk-edit-properties-go-back"
        size="large"
        variant="tertiary"
        [label]="'listPlan.crossEventBulkEdit.properties.goBack' | translate"
        (click)="onGoBack()"
      />
    </div>
    <app-cross-event-bulk-edit-applies-to
      [eventCount]="selectedPlanCount()"
      [testId]="'cross-event-bulk-edit-properties-applies-to'"
      [ticketTypeCount]="selectedTicketTypeCount()"
    />
  </div>
</ignt-dialog-footer>
