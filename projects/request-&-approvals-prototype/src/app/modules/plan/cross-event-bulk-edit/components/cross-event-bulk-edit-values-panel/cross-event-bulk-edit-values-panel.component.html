<ignt-dialog-header data-testid="cross-event-bulk-edit-values-title">
  {{ 'listPlan.crossEventBulkEdit.properties.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="cross-event-bulk-edit-values-panel" data-testid="cross-event-bulk-edit-values-panel">
    @if (loadFailed()) {
      <ignt-alert
        data-testid="cross-event-bulk-edit-values-error"
        sentiment="danger"
        [description]="'listPlan.crossEventBulkEdit.values.error' | translate"
      />
    }

    <app-bulk-edit-values-step />
  </div>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <div class="cross-event-bulk-edit-values-panel__footer">
    <ignt-button
      data-testid="cross-event-bulk-edit-values-continue"
      fill
      size="large"
      variant="primary"
      [disabled]="isContinueUnavailable()"
      [label]="'common.continue' | translate"
      (click)="onContinue()"
    />
    <div class="cross-event-bulk-edit-values-panel__back">
      <ignt-button
        data-testid="cross-event-bulk-edit-values-go-back"
        size="large"
        variant="tertiary"
        [disabled]="isSubmitting()"
        [label]="'listPlan.crossEventBulkEdit.properties.goBack' | translate"
        (click)="onGoBack()"
      />
    </div>
    <app-cross-event-bulk-edit-applies-to
      [eventCount]="selectedPlanCount()"
      [testId]="'cross-event-bulk-edit-values-applies-to'"
      [ticketTypeCount]="selectedTicketTypeCount()"
    />
  </div>
</ignt-dialog-footer>
