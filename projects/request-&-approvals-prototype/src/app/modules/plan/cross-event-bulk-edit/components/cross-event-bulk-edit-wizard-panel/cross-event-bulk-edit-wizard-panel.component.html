<div class="cross-event-bulk-edit-wizard-panel" data-testid="cross-event-bulk-edit-wizard-panel">
  @switch (panelStep()) {
    @case (steps.ticketTypes) {
      <app-cross-event-bulk-edit-ticket-type-panel />
    }
    @case (steps.properties) {
      <app-cross-event-bulk-edit-properties-panel />
    }
    @case (steps.values) {
      <app-cross-event-bulk-edit-values-panel />
    }
  }
</div>
