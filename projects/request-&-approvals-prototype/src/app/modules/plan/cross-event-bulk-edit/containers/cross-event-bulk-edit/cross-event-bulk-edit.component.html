<div class="cross-event-bulk-edit" data-testid="cross-event-bulk-edit">
  <div class="cross-event-bulk-edit__content cross-event-bulk-edit__body">
    <header class="cross-event-bulk-edit__header">
      <h1 class="cross-event-bulk-edit__title" data-testid="cross-event-bulk-edit-title">
        {{ 'listPlan.crossEventBulkEdit.title' | translate }}
      </h1>
      <ignt-button
        data-testid="cross-event-bulk-edit-exit"
        size="small"
        variant="secondary"
        [label]="'listPlan.crossEventBulkEdit.exit' | translate"
        (click)="onLeave()"
      />
    </header>

    <app-cross-event-bulk-edit-event-list />
  </div>

  <footer class="cross-event-bulk-edit__footer">
    <div class="cross-event-bulk-edit__content cross-event-bulk-edit__footer-bar">
      <p data-testid="cross-event-bulk-edit-selected-count">
        @if (selectedPlanCount() === 1) {
          {{ 'listPlan.crossEventBulkEdit.selectedCountOne' | translate: { count: selectedPlanCount() } }}
        } @else {
          {{ 'listPlan.crossEventBulkEdit.selectedCount' | translate: { count: selectedPlanCount() } }}
        }
      </p>
      <div class="cross-event-bulk-edit__actions">
        <ignt-button
          data-testid="cross-event-bulk-edit-cancel"
          size="large"
          variant="secondary"
          [label]="'common.cancel' | translate"
          (click)="onLeave()"
        />
        <ignt-button
          data-testid="cross-event-bulk-edit-continue"
          size="large"
          variant="primary"
          [disabled]="isContinueUnavailable()"
          [label]="'listPlan.crossEventBulkEdit.confirm' | translate"
          (click)="onContinue()"
        />
      </div>
    </div>
  </footer>
</div>
