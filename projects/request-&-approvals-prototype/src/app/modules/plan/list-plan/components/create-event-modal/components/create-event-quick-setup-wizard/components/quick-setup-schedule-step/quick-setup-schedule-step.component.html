<div class="quick-setup-schedule-step" data-testid="create-event-quick-setup-schedule-step">
  <div class="quick-setup-schedule-step__layout">
    <div class="quick-setup-schedule-step__schedules-panel" data-testid="create-event-quick-setup-schedules-panel">
      <form class="quick-setup-schedule-step__form" [formGroup]="form">
        <div class="quick-setup-schedule-step__section-heading">
          <h3 class="quick-setup-schedule-step__section-title" data-testid="create-event-quick-setup-schedules-heading">
            {{ 'createEvent.quickSetupWizard.step3.schedulesTitle' | translate }}
          </h3>
          <p class="quick-setup-schedule-step__section-helper">
            {{ 'createEvent.quickSetupWizard.step3.schedulesHelper' | translate }}
          </p>
        </div>

        <div class="quick-setup-schedule-step__schedules" formArrayName="schedules">
          @for (scheduleControl of schedules.controls; track scheduleControl; let index = $index) {
            <app-quick-setup-schedule-card
              #scheduleCardRef
              [formControlName]="index"
              [availableSessionTypeIds]="availableSessionTypeIds()"
              [canDeleteSchedule]="canDeleteSchedule()"
              [canEditScheduleName]="editingScheduleIndex() === null || editingScheduleIndex() === index"
              [capacityTemplateId]="capacityTemplateId()"
              [isPricesByTier]="isPricesByTier()"
              [isScheduleNameEditLocked]="isScheduleNameEditLocked()"
              [locale]="calendarLocale()"
              [sessionTypeOptions]="sessionTypeOptions()"
              [testIdSuffix]="index"
              [tierOptions]="tierOptions()"
              [timezone]="timezone()"
              (calendarScrollToMonth)="onCalendarScrollToMonth($event)"
              (editingScheduleIndexChange)="onEditingScheduleIndexChange($event ? index : null)"
              (removeSchedule)="removeSchedule(index)"
            />
          }
        </div>

        <ignt-button
          class="quick-setup-schedule-step__add-schedule"
          data-testid="create-event-quick-setup-add-schedule-button"
          [disabled]="!canAddSchedule() || isScheduleNameEditLocked()"
          [label]="'createEvent.quickSetupWizard.step3.addSchedule' | translate"
          size="large"
          variant="secondary"
          [leadingIcon]="{ name: 'plus', variant: 'regular' }"
          (click)="addSchedule()"
        />

        <ignt-alert
          class="quick-setup-schedule-step__info-banner"
          data-testid="create-event-quick-setup-schedule-info-banner"
          [description]="'createEvent.quickSetupWizard.step3.infoBanner' | translate"
        />
      </form>
    </div>

    <aside
      class="quick-setup-schedule-step__calendar-panel"
      [attr.aria-label]="'createEvent.quickSetupWizard.step3.calendarView.title' | translate"
    >
      <app-quick-setup-schedule-calendar-view
        [calendarSchedules]="calendarSchedules()"
        [locale]="calendarLocale()"
        [scrollToMonthRequest]="calendarScrollToMonthRequest()"
        [selectedScheduleIndex]="calendarSelectedScheduleIndex()"
        [timezone]="timezone()"
        (scheduleSelected)="onCalendarScheduleSelected($event)"
      />
    </aside>
  </div>
</div>
