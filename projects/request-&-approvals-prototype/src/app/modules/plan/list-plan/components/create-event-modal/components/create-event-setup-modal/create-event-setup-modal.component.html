<ignt-dialog-header data-testid="create-event-setup-title">
  {{ 'menu.createNewEvent' | translate }}
</ignt-dialog-header>

<ng-template #cardContent let-option="option">
  <div class="create-event-setup-modal__card-body">
    <span class="create-event-setup-modal__card-icon-wrap" aria-hidden="true">
      <ignt-icon class="create-event-setup-modal__card-icon" [name]="option.icon" [variant]="iconVariant" size="h3" />
    </span>

    <span class="create-event-setup-modal__card-title">{{ option.titleKey | translate }}</span>
    <span class="create-event-setup-modal__card-description">{{ option.descriptionKey | translate }}</span>
  </div>

  <span class="create-event-setup-modal__card-action" aria-hidden="true">
    <ignt-icon name="chevron-right" variant="light" size="caption" />
  </span>
</ng-template>

<ignt-dialog-content>
  <div class="create-event-setup-modal" [attr.data-event-type]="eventType">
    <div class="create-event-setup-modal__cards" [class.create-event-setup-modal__cards--two-options]="options.length === 2">
      @for (option of options; track option.id) {
        @if (option.actionable) {
          <button
            type="button"
            igntButton
            sentiment="tertiary"
            class="create-event-setup-modal__card create-event-setup-modal__card--actionable"
            [attr.data-testid]="'create-event-setup-' + option.id"
            [fill]="true"
            (click)="onOptionSelect(option)"
          >
            <ng-container *ngTemplateOutlet="cardContent; context: { option }" />
          </button>
        } @else {
          <div class="create-event-setup-modal__card" [attr.data-testid]="'create-event-setup-' + option.id">
            <ng-container *ngTemplateOutlet="cardContent; context: { option }" />
          </div>
        }
      }
    </div>
  </div>
</ignt-dialog-content>
