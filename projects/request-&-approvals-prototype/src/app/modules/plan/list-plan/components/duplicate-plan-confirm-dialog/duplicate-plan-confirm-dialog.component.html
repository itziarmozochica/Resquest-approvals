<ignt-dialog-header>{{ data.title }}</ignt-dialog-header>

<ignt-dialog-content>
  <p class="duplicate-plan-confirm-dialog__text">
    <span class="duplicate-plan-confirm-dialog__question">{{ data.question }}</span>
  </p>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="tertiary" data-testid="duplicate-plan-confirm-cancel-button" (click)="cancel()">
    {{ data.cancelButtonLabel }}
  </button>
  <button type="button" igntButton sentiment="primary" data-testid="duplicate-plan-confirm-accept-button" (click)="accept()">
    {{ data.acceptButtonLabel }}
  </button>
</ignt-dialog-footer>
