<section class="quick-setup-schedule-month-calendar" [attr.id]="monthId()" [attr.data-testid]="monthId()">
  <h4 class="quick-setup-schedule-month-calendar__title">{{ title() }}</h4>

  <div class="quick-setup-schedule-month-calendar__weekdays" role="row">
    @for (weekday of weekdayLabels(); track $index) {
      <span class="quick-setup-schedule-month-calendar__weekday" role="columnheader">{{ weekday }}</span>
    }
  </div>

  <div class="quick-setup-schedule-month-calendar__grid" role="grid">
    @for (week of weeks(); track trackWeek(week, $index)) {
      <div class="quick-setup-schedule-month-calendar__row" role="row">
        @for (cell of week; track trackCell(cell, $index)) {
          <span class="quick-setup-schedule-month-calendar__cell" role="gridcell">
            @if (cell) {
              <span
                class="quick-setup-schedule-month-calendar__day"
                [attr.data-color-key]="cell.mark ? colorKey(cell.mark) : null"
                [class.quick-setup-schedule-month-calendar__day--active]="cell.mark?.kind === 'active'"
                [class.quick-setup-schedule-month-calendar__day--active-selected]="cell.mark?.isActiveSelected"
                [class.quick-setup-schedule-month-calendar__day--excluded]="cell.mark?.kind === 'excluded'"
                [class.quick-setup-schedule-month-calendar__day--today]="isToday(cell.ymd)"
              >
                <span
                  class="quick-setup-schedule-month-calendar__day-number"
                  [class.quick-setup-schedule-month-calendar__day-number--struck]="cell.mark?.kind === 'excluded'"
                >
                  {{ cell.dayNumber }}
                </span>
                @if (cell.mark?.isException) {
                  <span class="quick-setup-schedule-month-calendar__day-dot" aria-hidden="true"></span>
                }
              </span>
            }
          </span>
        }
      </div>
    }
  </div>
</section>
