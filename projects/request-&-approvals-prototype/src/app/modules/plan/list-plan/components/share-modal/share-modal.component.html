<div class="modal__content">
  <div class="modal__title" data-testid="modal-title">{{ 'listPlan.trackingLink.shareModal.title' | translate }}</div>
  <div class="sm-social-icons">
    <!--    <button class="sm-social-icons__item" (click)="shareFacebookClick()">-->
    <!--      <fa-icon [icon]="icons.faFacebookF"></fa-icon>-->
    <!--    </button>-->
    <!--    <button class="sm-social-icons__item" (click)="shareFacebookMessengerClick()">-->
    <!--      <fa-icon [icon]="icons.faFacebookMessenger"></fa-icon>-->
    <!--    </button>-->
    <button class="sm-social-icons__item" (click)="shareTwitterClick()">
      <fa-icon [icon]="icons.faTwitter"></fa-icon>
    </button>
    <a class="sm-social-icons__item" (click)="shareWhatsappClick()" [href]="builtLinks?.whatsapp">
      <fa-icon [icon]="icons.faWhatsapp"></fa-icon>
    </a>
    <a class="sm-social-icons__item" (click)="shareMailClick()" [href]="builtLinks?.mail">
      <fa-icon [icon]="icons.falEnvelope"></fa-icon>
    </a>
  </div>
  <fieldset class="modal__fieldset">
    <input class="modal__input" data-testid="modal-input" type="text" [value]="builtLinks?.clipboard" />
    <button class="modal__copy-link" ngxClipboard [cbContent]="builtLinks?.clipboard" (click)="copyLink()">
      <fa-icon [icon]="icons.falCopy"></fa-icon>
    </button>
    <p class="modal__copy-success-msg" *ngIf="displayCopiedMessage">
      {{ 'listPlan.trackingLink.shareModal.copiedMessage' | translate }}
    </p>
    <button igntButton [fill]="true" class="modal__button" data-testid="modal-accept-button" (click)="close()">
      {{ 'common.close' | translate }}
    </button>
  </fieldset>
</div>
