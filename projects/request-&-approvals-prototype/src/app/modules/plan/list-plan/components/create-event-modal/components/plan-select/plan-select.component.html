<div class="plan-select">
  <label class="plan-select__label">
    <span class="plan-select__label-text">{{ labelKey() | translate }}*</span>
    <span class="plan-select__helper-text">{{ helperKey() | translate }}</span>
  </label>
  <div class="plan-select__select-wrapper">
    <ignt-typeahead
      [fieldLabel]="fieldLabelKey() | translate"
      [clean]="cleanTrigger$"
      [options]="planOptions()"
      [selectedOption]="selectedPlanOption()"
      [inputType]="selectOptionTypeaheadInput.plan"
      [minSearchLength]="1"
      [refreshTrigger]="refreshTrigger$"
      (selected)="onPlanTypeaheadSelected($event)"
      data-testid="create-event-plan-typeahead"
      (inputInteraction)="onPlanSearch($event)"
      (scrollToEnd)="onPlanScrollToEnd()"
    ></ignt-typeahead>
  </div>
</div>
