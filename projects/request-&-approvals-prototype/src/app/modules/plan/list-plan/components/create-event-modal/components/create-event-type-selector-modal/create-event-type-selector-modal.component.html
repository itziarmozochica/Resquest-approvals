<ignt-dialog-header data-testid="create-event-type-selector-title">
  {{ 'menu.createNewEvent' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="create-event-type-selector-modal">
    <p class="create-event-type-selector-modal__subtitle">
      {{ 'createEvent.typeSelector.subtitle' | translate }}
    </p>

    <div class="create-event-type-selector-modal__list">
      @for (typeConfig of types; track typeConfig.type) {
        <button
          type="button"
          igntButton
          sentiment="tertiary"
          class="create-event-type-selector-modal__option"
          [attr.data-testid]="typeTestId(typeConfig.type)"
          [fill]="true"
          (click)="onSelectType(typeConfig.type)"
        >
          <span class="create-event-type-selector-modal__option-icon-wrap" aria-hidden="true">
            <ignt-icon
              class="create-event-type-selector-modal__option-icon"
              [name]="typeConfig.icon"
              [variant]="iconVariant(typeConfig)"
              size="h2"
            />
          </span>

          <span class="create-event-type-selector-modal__option-content">
            <span class="create-event-type-selector-modal__option-title">{{ typeLabelKey(typeConfig.type) | translate }}</span>
            <span class="create-event-type-selector-modal__option-description">
              {{ typeDescriptionKey(typeConfig.type) | translate }}
            </span>
          </span>

          <ignt-icon
            class="create-event-type-selector-modal__option-chevron"
            name="chevron-right"
            variant="light"
            size="h5"
            aria-hidden="true"
          />
        </button>
      }
    </div>
  </div>
</ignt-dialog-content>
