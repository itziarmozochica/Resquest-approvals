<div class="quick-setup-schedule-calendar-view" data-testid="quick-setup-schedule-calendar-view">
  <div class="quick-setup-schedule-calendar-view__toolbar">
    <div class="quick-setup-schedule-calendar-view__header">
      <h3 class="quick-setup-schedule-calendar-view__title">
        {{ 'createEvent.quickSetupWizard.step3.calendarView.title' | translate }}
      </h3>
      <ignt-button
        class="quick-setup-schedule-calendar-view__today-button"
        data-testid="quick-setup-schedule-calendar-today"
        size="small"
        variant="tertiary"
        [disabled]="!viewModel().todayMonth"
        [label]="'createEvent.quickSetupWizard.step3.calendarView.today' | translate"
        (click)="scrollToToday()"
      />
    </div>

    @if (viewModel().schedulePills.length > 0) {
      <div
        class="quick-setup-schedule-calendar-view__pills"
        role="group"
        data-testid="quick-setup-schedule-calendar-pills"
        [attr.aria-label]="'createEvent.quickSetupWizard.step3.calendarView.schedulesGroupLabel' | translate"
      >
        @for (pill of viewModel().schedulePills; track pill.id) {
          <div
            role="button"
            tabindex="0"
            class="quick-setup-schedule-calendar-view__pill"
            data-testid="quick-setup-schedule-calendar-pill"
            [attr.aria-pressed]="selectedScheduleIndex() === pill.scheduleIndex"
            [attr.data-color-key]="pill.colorKey"
            [class.quick-setup-schedule-calendar-view__pill--selected]="selectedScheduleIndex() === pill.scheduleIndex"
            (click)="selectSchedule(pill.scheduleIndex)"
            (keydown.enter)="selectSchedule(pill.scheduleIndex)"
            (keydown.space)="onPillSpaceKey($event, pill.scheduleIndex)"
          >
            {{ pill.name }}
          </div>
        }
      </div>
    }
  </div>

  <div #monthsScrollContainer class="quick-setup-schedule-calendar-view__months" data-testid="quick-setup-schedule-calendar-months">
    @for (monthDays of viewModel().months; track monthDays.month) {
      <app-quick-setup-schedule-month-calendar [dayCells]="monthDays.dayCells" [locale]="locale()" [month]="monthDays.month" />
    }
  </div>
</div>
