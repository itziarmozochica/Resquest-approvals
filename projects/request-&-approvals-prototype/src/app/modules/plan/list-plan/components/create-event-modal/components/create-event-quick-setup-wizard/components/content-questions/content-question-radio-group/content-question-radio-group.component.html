<ignt-radio-group
  class="content-question-radio-group__options"
  [formControl]="optionControl()"
  [attr.aria-labelledby]="fieldId() + '-label'"
  [attr.data-testid]="fieldId() + '-options'"
>
  @for (optionKey of optionKeys(); track optionKey) {
    <ignt-radio
      [dataTestId]="fieldId() + '-option-' + optionKey"
      [label]="optionTranslationKey(optionKey) | translate"
      [value]="optionKey"
    />
  }
</ignt-radio-group>
