<ignt-dialog-header data-testid="create-event-duplicate-title">
  {{ 'createEvent.setupModal.duplicateEvent.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="create-event-duplicate-modal" [attr.data-event-type]="eventType">
    <app-plan-select
      [fieldLabelKey]="'createEvent.duplicateModal.planFieldLabel'"
      [helperKey]="'createEvent.duplicateModal.planHelper'"
      [labelKey]="'createEvent.duplicateModal.planLabel'"
      [planKind]="planKind"
      (selectedPlanChange)="onPlanSelected($event)"
      data-testid="create-event-duplicate-plan-select"
    />
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button
    type="button"
    igntButton
    sentiment="secondary"
    data-testid="create-event-duplicate-back-button"
    [disabled]="isConfirmPending() || isDuplicating()"
    (click)="onBack()"
  >
    {{ 'createEvent.duplicateModal.back' | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    data-testid="create-event-duplicate-confirm-button"
    [disabled]="isConfirmDisabled()"
    (click)="onConfirm()"
  >
    @if (isDuplicating()) {
      <ignt-icon name="spinner" variant="solid" [spin]="true" aria-hidden="true" />
    }
    {{ 'createEvent.duplicateModal.confirm' | translate }}
  </button>
</ignt-dialog-footer>
