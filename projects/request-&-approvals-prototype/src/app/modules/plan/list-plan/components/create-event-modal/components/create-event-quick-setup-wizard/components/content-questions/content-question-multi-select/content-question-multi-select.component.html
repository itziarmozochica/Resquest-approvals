<app-multi-select
  class="content-question-multi-select__select"
  [displayInPlaceMaximum]="1"
  [options]="selectOptions()"
  [placeholder]="selectPlaceholderTranslationKey | translate"
  [selectedOptions]="selectedOptions()"
  [selectedSummaryText]="selectedSummaryText()"
  [attr.aria-labelledby]="fieldId() + '-label'"
  [attr.data-testid]="fieldId() + '-select'"
  (selected)="onOptionsSelected($event)"
/>

@if (selectedOptions().length > 0) {
  <div class="content-question-multi-select__chips" [attr.data-testid]="fieldId() + '-chips'">
    @for (option of selectedOptions(); track option.id) {
      <button
        type="button"
        igntButton
        sentiment="tertiary"
        size="small"
        class="content-question-multi-select__chip"
        [attr.data-testid]="fieldId() + '-chip-' + option.id"
        [attr.aria-label]="'common.remove' | translate"
        (click)="removeOption(optionId(option))"
      >
        <span class="content-question-multi-select__chip-label">{{ optionTranslationKey(optionId(option)) | translate }}</span>
        <ignt-icon class="content-question-multi-select__chip-icon" name="xmark" variant="regular" aria-hidden="true" />
      </button>
    }
  </div>
}

@if (extraMode() !== 'hidden') {
  <app-content-question-extra [control]="extraControl()" [fieldId]="fieldId()" [mode]="extraMode()" />
}
