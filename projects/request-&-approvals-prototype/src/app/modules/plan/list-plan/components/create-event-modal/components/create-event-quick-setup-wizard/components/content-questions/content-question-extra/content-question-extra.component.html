@if (isMultiline()) {
  <ignt-textarea-field
    class="content-question-extra__textarea"
    [formControl]="control()"
    [id]="fieldId() + '-extra'"
    [label]="''"
    [rows]="3"
    [placeholder]="openTextPlaceholderTranslationKey | translate"
    [attr.aria-labelledby]="fieldId() + '-label'"
    [attr.data-testid]="fieldId() + '-extra'"
  />
} @else {
  <ignt-input-field
    class="content-question-extra__input"
    [id]="fieldId() + '-extra'"
    [formControl]="control()"
    [label]="''"
    [hideErrorLabels]="true"
    [placeholder]="specifyPlaceholderTranslationKey | translate"
    [attr.data-testid]="fieldId() + '-extra'"
    [type]="inputType()"
  />
}
