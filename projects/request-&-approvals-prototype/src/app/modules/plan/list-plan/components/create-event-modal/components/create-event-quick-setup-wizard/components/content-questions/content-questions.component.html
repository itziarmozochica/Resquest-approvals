<div class="content-questions" data-testid="create-event-quick-setup-content-questions">
  <div class="content-questions__panel">
    <div class="content-questions__layout" data-testid="create-event-quick-setup-content-questions-layout">
      @for (column of layoutColumns(); track $index) {
        @if (column.length > 0) {
          <div class="content-questions__column" data-testid="create-event-quick-setup-content-questions-column">
            @for (field of column; track field.question.key) {
              <app-content-question-field
                class="content-questions__field"
                [control]="field.control"
                [descriptionEditorFeatures]="descriptionEditorFeatures()"
                [descriptionImageUpload]="descriptionImageUpload()"
                [hasError]="field.hasError"
                [isRequired]="field.isRequired"
                [question]="field.question"
              />
            }
          </div>
        }
      }
    </div>
  </div>
</div>
