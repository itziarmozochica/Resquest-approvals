<section
  class="quick-setup-day-exceptions quick-setup-schedule-step__section quick-setup-schedule-step__section--day-exceptions"
  data-testid="create-event-quick-setup-day-exceptions"
>
  <div class="quick-setup-day-exceptions__header">
    <ignt-button
      class="quick-setup-day-exceptions__toggle"
      data-testid="create-event-quick-setup-day-exceptions-toggle"
      [attr.aria-expanded]="!isCollapsed()"
      [label]="'createEvent.quickSetupWizard.step3.singleDayExceptionsTitle' | translate"
      size="medium"
      variant="tertiary"
      [trailingIcon]="{
        name: isCollapsed() ? 'chevron-up' : 'chevron-down',
        variant: 'solid',
      }"
      (click)="toggleCollapsed()"
    />
    <p class="quick-setup-day-exceptions__helper">
      {{ 'createEvent.quickSetupWizard.step3.singleDayExceptionsHelper' | translate }}
    </p>
  </div>

  @if (!isCollapsed()) {
    <div class="quick-setup-day-exceptions__list">
      @for (exceptionControl of exceptionsForm.controls; track exceptionControl.value.key; let exceptionIndex = $index) {
        <app-quick-setup-day-exception-card
          [calendarGridParams]="calendarGridParams()"
          [canShowCalendarGrid]="canShowCalendarGrid()"
          [dateRanges]="dateRanges()"
          [exceptionIndex]="exceptionIndex"
          [excludedDates]="excludedDates()"
          [formControl]="exceptionControl"
          [isAssigningTiers]="isAssigningTiers()"
          [isRecurrentDates]="isRecurrentDates()"
          [normalTierId]="normalTierId()"
          [productOptions]="productOptions()"
          [scheduleFormValue]="scheduleFormValue()"
          [showValidationErrors]="showValidationErrors()"
          [tierOptions]="tierOptions()"
          [timeLabels]="calendarTimeLabels()"
          [timezone]="timezone()"
          (remove)="removeException(exceptionIndex)"
        />
      }
    </div>

    <ignt-button
      class="quick-setup-day-exceptions__add-link"
      data-testid="create-event-quick-setup-add-day-exception-button"
      [label]="'createEvent.quickSetupWizard.step3.addException' | translate"
      size="small"
      variant="tertiary"
      [leadingIcon]="{ name: 'plus', variant: 'regular' }"
      (click)="addException()"
    />
  }
</section>
