<div class="venue-select">
  @if (!hideLabel()) {
    <label class="venue-select__label">
      <span class="venue-select__label-text">
        {{ 'createEvent.venue' | translate }}
        @if (required()) {
          *
        }
      </span>
    </label>
  }
  <div class="venue-select__select-wrapper">
    <ignt-typeahead
      [allowCreateNew]="canCreateVenue()"
      [createNewLabel]="'createEvent.createVenue' | translate"
      createNewMode="below-field"
      [fieldLabel]="fieldLabelKey() | translate"
      [emptyLabel]="emptyLabelKey() ? (emptyLabelKey() | translate) : ''"
      [clean]="cleanTrigger$"
      [options]="venueOptions()"
      [selectedOption]="selectedVenueOption()"
      [inputType]="selectOptionTypeaheadInput.venue"
      [minSearchLength]="1"
      [refreshTrigger]="refreshTrigger$"
      data-testid="create-event-venue-typeahead"
      (createNewInitiated)="onCreateVenue()"
      (selected)="onVenueTypeaheadSelected($event)"
      (inputInteraction)="onVenueSearch($event)"
      (scrollToEnd)="onVenueScrollToEnd()"
    ></ignt-typeahead>
  </div>
</div>
