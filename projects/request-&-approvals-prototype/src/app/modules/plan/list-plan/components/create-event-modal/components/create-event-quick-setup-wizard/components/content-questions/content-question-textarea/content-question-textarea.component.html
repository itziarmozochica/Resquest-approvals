<ignt-textarea-field
  class="content-question-textarea__field"
  [class.content-question-textarea__field--structured]="isStructured()"
  [formControl]="textControl()"
  [id]="fieldId()"
  [label]="''"
  [rows]="4"
  [placeholder]="placeholderTranslationKey() | translate"
  [attr.aria-labelledby]="fieldId() + '-label'"
  [attr.data-testid]="fieldId() + '-textarea'"
/>
