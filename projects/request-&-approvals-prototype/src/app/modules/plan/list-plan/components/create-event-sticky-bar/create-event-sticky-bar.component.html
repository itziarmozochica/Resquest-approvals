@if (isVisible()) {
  <div
    class="create-event-sticky-bar"
    [class.create-event-sticky-bar--hidden]="isHiddenByScroll()"
    [attr.aria-hidden]="isHiddenFromAssistiveTech()"
    [attr.inert]="isInert() ? '' : null"
    data-testid="sticky-create-event"
  >
    <ignt-button
      variant="primary"
      sentiment="brand"
      [label]="'menu.createNewEvent' | translate"
      (click)="handleCreateNewEvent()"
    ></ignt-button>
  </div>
}
