@if (contentQuestionsEnabled()) {
  <section class="quick-setup-category-selector__section">
    <div class="quick-setup-category-selector__section-heading">
      <h3 class="quick-setup-category-selector__section-title">
        {{ 'createEvent.quickSetupWizard.step1.categorySectionTitle' | translate }}
      </h3>
      <p class="quick-setup-category-selector__section-helper">
        {{ 'createEvent.quickSetupWizard.step1.categorySectionHelper' | translate }}
      </p>
    </div>
    <div class="quick-setup-category-selector__fields-row">
      <div class="quick-setup-category-selector__select-wrapper">
        <ignt-typeahead
          [editable]="false"
          [emptyLabel]="'createEvent.quickSetupWizard.step1.contentQuestions.verticalPlaceholder' | translate"
          [fieldLabel]="'createEvent.quickSetupWizard.step1.contentQuestions.verticalLabel' | translate"
          [options]="verticalOptions()"
          [selectAllLabel]="'createEvent.quickSetupWizard.step1.contentQuestions.verticalAllOption' | translate"
          [selectedOption]="selectedVerticalOption()"
          data-testid="create-event-quick-setup-vertical-typeahead"
          (selected)="onVerticalSelect($event)"
        />
      </div>
      <div class="quick-setup-category-selector__select-wrapper">
        <ignt-typeahead
          [editable]="false"
          [emptyLabel]="'createEvent.quickSetupWizard.step1.categoryPlaceholder' | translate"
          [fieldLabel]="'createEvent.quickSetupWizard.step1.categoryTitle' | translate"
          [options]="categoryOptions()"
          [selectedOption]="selectedCategoryOption()"
          data-testid="create-event-quick-setup-category-typeahead"
          (selected)="onCategorySelect($event)"
        />
      </div>
    </div>
  </section>
} @else {
  <section class="quick-setup-category-selector__section">
    <div class="quick-setup-category-selector__section-heading">
      <h3 class="quick-setup-category-selector__section-title">
        {{ 'createEvent.quickSetupWizard.step1.categoryTitle' | translate }}
      </h3>
    </div>
    <div class="quick-setup-category-selector__select-wrapper">
      <ignt-typeahead
        [editable]="false"
        [emptyLabel]="'createEvent.quickSetupWizard.step1.categoryPlaceholder' | translate"
        [fieldLabel]="'createEvent.quickSetupWizard.step1.categoryLabel' | translate"
        [options]="categoryOptions()"
        [selectedOption]="selectedCategoryOption()"
        data-testid="create-event-quick-setup-category-typeahead"
        (selected)="onCategorySelect($event)"
      />
    </div>
  </section>
}
