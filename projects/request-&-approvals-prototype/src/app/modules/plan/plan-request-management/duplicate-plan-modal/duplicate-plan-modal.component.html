<div class="modal-body modal__content">
  <div class="modal__title" data-testid="modal-title">
    {{ 'planRequest.duplicateEvent.selectDuplicate' | translate }}
  </div>
  <div *ngIf="loading" data-testid="plan-duplicate-spinner" class="loading-image-spinner">
    <fa-icon class="loader" [icon]="['fas', 'spinner']" [size]="'4x'"></fa-icon>
  </div>
  <ng-container *ngIf="!loading">
    <div class="filters-block filters-block--city" data-testid="search-city-filter" [hidden]="citiesDropdownOptions.length === 1">
      <app-typeahead
        [disabled]="disabled || (citiesDropdownOptions && citiesDropdownOptions.length === 0)"
        [selectAllLabel]="
          !mandatoryFilters.includes(filtersEnum.city) && citiesDropdownOptions && citiesDropdownOptions?.length > 1
            ? ('filters.allCities' | translate)
            : undefined
        "
        [emptyLabel]="'common.city' | translate"
        [selectedOption]="selectedCity"
        [inputType]="selectOptionTypeaheadInput.city"
        [options]="citiesDropdownOptions"
        [preloadedOption]="initialCityOption"
        [clean]="cleanCitySubject"
        (selected)="selectCity($event)"
        (userInteraction)="checkSelectedCity($event)"
      >
      </app-typeahead>
    </div>
    <div class="filters-block filters-block--venue" data-testid="search-venue-filter">
      <app-typeahead
        [disabled]="isFilterDisabled(filtersEnum.place)"
        [selectAllLabel]="
          !mandatoryFilters.includes(filtersEnum.place) && placesDropdownOptions && placesDropdownOptions?.length > 1
            ? ('filters.allVenues' | translate)
            : undefined
        "
        [emptyLabel]="'common.venue' | translate"
        [options]="placesDropdownOptions"
        [inputType]="selectOptionTypeaheadInput.venue"
        [preloadedOption]="initialPlaceOption"
        [selectedOption]="selectedPlace"
        (selected)="selectPlace($event)"
        [clean]="cleanPlaceSubject"
        (userInteraction)="checkSelectedPlace($event)"
      >
      </app-typeahead>
    </div>
    <div class="filters-block filters-block--plan" data-testid="search-plan-filter">
      <app-typeahead
        [disabled]="isFilterDisabled(filtersEnum.plan)"
        [emptyLabel]="'filters.searchOrTypeEvent' | translate"
        [inactiveLabel]="'common.inactive' | translate"
        [selectedOption]="selectedPlan"
        [options]="planDropdownOptions"
        [inputType]="selectOptionTypeaheadInput.plan"
        [preloadedOption]="initialPlanOption"
        [clean]="cleanPlanSubject"
        (selected)="selectPlan($event)"
        (userInteraction)="checkSelectedPlan($event)"
      >
      </app-typeahead>
    </div>
    <div class="modal__actions">
      <button class="modal__button modal__button--cancel" data-testid="modal-cancel-button" (click)="close(false)">
        {{ 'common.cancel' | translate }}
      </button>
      <button class="modal__button" data-testid="modal-accept-button" [disabled]="!selectedPlan" (click)="duplicate()">
        {{ 'planRequest.duplicate' | translate }}
      </button>
    </div>
  </ng-container>
</div>
