<app-modal-content [title]="'generateSimplifiedBillsStatementModal.title' | translate" iconId="file-pdf">
  <div class="modal-body">
    <span translate>generateSimplifiedBillsStatementModal.description</span>
    <app-date-selector-extended class="modal-body__date-selector" (state)="onDateRangeUpdated($event)"></app-date-selector-extended>
  </div>
  <div class="modal-footer">
    <button
      *ngIf="!generating"
      class="modal-footer__button"
      type="submit"
      (click)="onGenerateAndDownloadClicked()"
      [disabled]="!isDateRangeSelected()"
    >
      <span translate>generateSimplifiedBillsStatementModal.generateAndDownload</span>
    </button>
    <div class="modal-footer__spinner" *ngIf="generating"></div>
  </div>
</app-modal-content>
