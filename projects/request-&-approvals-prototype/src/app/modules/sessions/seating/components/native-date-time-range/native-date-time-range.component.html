<div class="native-date-time-range">
  <div class="native-date-time-range__date-selector">
    <label class="field date-input">
      <input
        #dateInput
        class="field__input"
        type="date"
        data-testid="date-selector"
        placeholder=" "
        [value]="dateValue"
        [disabled]="disabled"
        (change)="onDateChange($event)"
      />
      <span class="field__label">{{ 'common.date' | translate }}</span>
      <ignt-icon
        class="field__icon field__icon--trail"
        name="calendar"
        variant="light"
        aria-hidden="true"
        (click)="!disabled && dateInputElement.nativeElement.showPicker()"
      />
    </label>
  </div>
  @if (showTimePicker) {
    <div class="native-date-time-range__time-selector">
      <label class="field">
        <select
          class="field__select"
          data-testid="time-selector"
          [disabled]="dateTimeOptions.length === 0"
          (change)="onTimeValueChange($event)"
        >
          @for (option of dateTimeOptions; track option.id) {
            <option [value]="option.id" [selected]="option.id === selectedTimeValue">{{ option.title }}</option>
          }
        </select>
        <span class="field__label">{{ 'orders.bulkReschedule.dateSelector.timeSlotLabel' | translate }}</span>
        <ignt-icon class="field__icon field__icon--trail" name="chevron-down" variant="solid" aria-hidden="true" />
      </label>
    </div>
  }
</div>
