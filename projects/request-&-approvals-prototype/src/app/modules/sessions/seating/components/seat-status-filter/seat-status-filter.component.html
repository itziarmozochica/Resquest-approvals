<button
  class="seat-status-filter__btn"
  [class.seat-status-filter__btn--active]="isFilterActive()"
  type="button"
  cdkOverlayOrigin
  #filterTrigger="cdkOverlayOrigin"
  (click)="toggleDropdown()"
>
  <fa-icon [icon]="isFilterActive() ? ['fas', 'filter'] : ['far', 'filter']"></fa-icon>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="filterTrigger"
  [cdkConnectedOverlayOpen]="isDropdownOpen()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  cdkConnectedOverlayPanelClass="side-panel-overlay"
  (backdropClick)="toggleDropdown()"
>
  <div class="seat-status-filter__dropdown">
    <button class="seat-status-filter__option" type="button" (click)="onStatusFilterSelect(null)">
      <span class="seat-status-filter__clear-label">{{ 'sessions.seatingMap.seatListPanel.clearFilter' | translate }}</span>
    </button>
    @for (option of availableStatuses(); track option.status) {
      <button class="seat-status-filter__option" type="button" (click)="onStatusFilterSelect(option.status)">
        <span class="seat-status-filter__status-badge seat-status-filter__status-badge--{{ option.status }}">
          {{ option.label }}
        </span>
      </button>
    }
  </div>
</ng-template>
