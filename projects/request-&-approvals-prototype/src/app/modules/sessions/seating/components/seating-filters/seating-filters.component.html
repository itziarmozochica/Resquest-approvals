<div class="seating-filters">
  <div class="seating-filters__section">
    <span class="seating-filters__section-title">{{ 'sessions.seating.viewBy' | translate }}</span>
    <div class="seating-filters__view-by-options">
      <label class="seating-filters__view-by-option">
        <input
          type="radio"
          name="viewBy"
          [value]="viewBySection"
          [checked]="pendingViewBy() === viewBySection"
          (change)="onViewByChange(viewBySection)"
        />
        {{ 'sessions.seating.viewBySection' | translate }}
      </label>
      <label class="seating-filters__view-by-option">
        <input
          type="radio"
          name="viewBy"
          [value]="viewByCategory"
          [checked]="pendingViewBy() === viewByCategory"
          (change)="onViewByChange(viewByCategory)"
        />
        {{ 'sessions.seating.viewByCategory' | translate }}
      </label>
    </div>
  </div>

  @if (categoryOptions().length > 0) {
    <div class="seating-filters__section">
      <span class="seating-filters__section-title">{{ 'sessions.seating.filterCategories' | translate }}</span>
      <div class="seating-filters__search">
        <fa-icon class="seating-filters__search-icon" [icon]="['far', 'search']"></fa-icon>
        <input
          class="seating-filters__search-input"
          type="text"
          [placeholder]="'sessions.seating.filterCategoriesPlaceholder' | translate"
          [value]="categorySearchText()"
          (input)="onSearchTextChange($any($event.target).value)"
        />
      </div>
      <ul class="seating-filters__category-list">
        <li class="seating-filters__category-item seating-filters__category-item--all">
          <label class="seating-filters__category-option">
            <input type="checkbox" [checked]="isAllChecked()" (change)="onAllToggle()" />
            {{ 'common.all' | translate }}
          </label>
        </li>
        @for (option of filteredCategoryOptions(); track option.id) {
          <li class="seating-filters__category-item">
            <label class="seating-filters__category-option">
              <input type="checkbox" [checked]="isCategoryChecked(option)" (change)="onCategoryToggle(option)" />
              {{ option.title }}
            </label>
          </li>
        }
      </ul>
    </div>
  }

  <div class="seating-filters__footer">
    <button class="seating-filters__apply-button" [disabled]="!hasChanges()" (click)="onApply()">
      {{ 'sessions.seating.applyFilters' | translate }}
    </button>
  </div>
</div>
