@if (isMapLoading()) {
  <div class="seating-map-canvas__loading">
    <span class="spinner-border spinner-border-sm" role="status"></span>
  </div>
}
<div
  #mapContainer
  class="seating-map-canvas__map-container"
  [attr.id]="'seating-event-manager-container-' + tab()"
  [class.seating-map-canvas__map-container--hidden]="isMapLoading()"
></div>
