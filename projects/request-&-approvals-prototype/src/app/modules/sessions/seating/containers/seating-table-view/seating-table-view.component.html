<ng-template #seatsPanelTitleTemplate>
  @if (panelContext()?.timeSlotDate; as date) {
    <div>{{ date | momentDate: 'EEEE, d MMMM y - h:mm a' : panelContext()!.timeZone }}</div>
  }
  @for (line of panelContext()?.headerLines ?? []; track line) {
    <div>{{ line }}</div>
  }
</ng-template>

<ng-template #seatsPanelContentTemplate>
  @if (panelContext(); as ctx) {
    <app-seat-list-panel [seats]="ctx.seats" [planId]="ctx.planId" (closePanel)="onClosePanel()"></app-seat-list-panel>
  }
</ng-template>

<app-search-result-view
  [currentState]="searchResultStatus()"
  [displayContentWhileLoading]="false"
  [noFiltersIcon]="['far', 'calendar-alt']"
  [noFiltersMessage]="'sessions.seatingMap.noTimeslotSelected' | translate"
  [noResultIcon]="['far', 'calendar-alt']"
  [noResultMessage]="'sessions.seatingMap.noSeatingForTimeslot' | translate"
>
  <app-seating-report-table
    [rows]="rows()"
    [timeSlotDateTime]="timeSlotDateTime()"
    [timeZone]="timeZone()"
    [totalMetrics]="totalMetrics()"
    (seatIconClick)="onSeatIconClick($event)"
  ></app-seating-report-table>
</app-search-result-view>
