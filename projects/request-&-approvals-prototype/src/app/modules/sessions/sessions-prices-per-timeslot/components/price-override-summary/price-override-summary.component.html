<div class="timeslot-description" data-testid="override-summary-title">
  <span class="timeslot-description__title">{{ title }}</span>
</div>
<ng-container
  *ngTemplateOutlet="
    detailLine;
    context: {
      text: (group ?? ('sessions.pricesPerTimeslot.editForm.summary.unrestricted' | translate)) + ' / ' + sessionType,
      icon: ['fal', 'ticket'],
      dataTestId: 'override-summary-group-and-session-type',
    }
  "
></ng-container>
<ng-container
  *ngTemplateOutlet="detailLine; context: { text: channel, icon: ['fal', 'store'], dataTestId: 'override-summary-channel' }"
></ng-container>
<ng-container
  *ngTemplateOutlet="
    detailLine;
    context: {
      text: ('sessions.pricesPerTimeslot.editForm.summary.priceList' | translate: { priceListName: priceList ?? '-' }),
      icon: ['fal', 'tag'],
      dataTestId: 'override-summary-price-list',
    }
  "
></ng-container>

<div class="divider"></div>

<ng-template #detailLine let-icon="icon" let-text="text" let-dataTestId="dataTestId">
  <div class="detail-line" [attr.data-testid]="dataTestId">
    <fa-icon [icon]="icon"></fa-icon>
    <span>{{ text }}</span>
  </div>
</ng-template>
