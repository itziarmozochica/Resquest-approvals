<div class="quota-assignation-tooltip">
  <ul class="quota-assignation-tooltip__list">
    <li *ngFor="let name of ruleFields.slice(0, MAX_ITEMS)" class="quota-assignation-tooltip__item">
      {{ name }}
    </li>
  </ul>
  <div *ngIf="ruleFields.length > MAX_ITEMS" class="quota-assignation-tooltip__more">
    +{{ ruleFields.length - MAX_ITEMS }} {{ 'sessions.quotaManagement.table.assignationTooltip.more' | translate }}
  </div>
</div>
