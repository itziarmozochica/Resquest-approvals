<div class="quota-actions-menu">
  <button
    class="quota-actions-menu__button"
    type="button"
    [attr.aria-label]="'sessions.quotaManagement.aria.quotaActionMenu' | translate"
    [disabled]="disabled"
    [attr.tabindex]="disabled ? -1 : 0"
    (click)="toggleDropdown($event)"
  >
    <ignt-icon name="ellipsis-v" variant="solid" size="sm"></ignt-icon>
  </button>

  <div class="quota-actions-menu__dropdown" *ngIf="opened()">
    <button *ngFor="let option of options" class="quota-actions-menu__option" type="button" (click)="onOptionClick(option.action, $event)">
      <ignt-icon class="quota-actions-menu__option-icon" [name]="option.iconName" [variant]="option.iconVariant" size="sm"></ignt-icon>
      <span class="quota-actions-menu__option-label">{{ option.labelKey | translate }}</span>
    </button>
  </div>
</div>
