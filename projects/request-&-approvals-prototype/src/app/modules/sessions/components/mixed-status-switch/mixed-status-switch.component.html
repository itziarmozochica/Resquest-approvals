<div class="form-group form-switch-group">
  <div class="form-switch-group__header">
    <fa-icon class="form-icon" [icon]="isMixed && !enableBulkEdition ? ['fal', 'minus'] : icon"></fa-icon>

    <label [for]="fieldName" class="form-label" translate>
      {{ 'sessions.sessionsPerTimeslot.edition.field.' + fieldName }}
    </label>
    <div [attr.data-testid]="'mixed-status-form-value-' + fieldName" class="form-value">
      <span *ngIf="isMixed && !enableBulkEdition; else notMixed" class="mixed-status-text">
        <span class="mixed-status-text--bold">{{ mixedLabel | translate }}</span>
        <ng-container *ngTemplateOutlet="mixedStatusInfoIcon; context: { $implicit: fieldName }"></ng-container>
      </span>
      <ng-template #notMixed>
        <span [class.form-value--checked]="!control.value" translate>{{ uncheckedLabel }}</span> /
        <span [class.form-value--checked]="control.value" translate>{{ checkedLabel }}</span>
      </ng-template>
    </div>
  </div>
  <div *ngIf="!isMixed || enableBulkEdition; else mixedStatusSwitchPlaceHolder" class="form-check form-switch form-switch-lg">
    <input
      type="checkbox"
      class="form-check-input"
      [formControl]="control"
      [attr.data-testid]="'mixed-switch-' + fieldName"
      [checked]="control.value"
      [id]="'custom-capacity-switch-' + fieldName"
    />
    <label class="form-check-label" [for]="'custom-capacity-switch-' + fieldName"></label>
  </div>
</div>

<ng-template #mixedStatusSwitchPlaceHolder>
  <div class="custom-switch__placeholder">
    <fa-icon [icon]="['fal', 'minus']"></fa-icon>
  </div>
</ng-template>

<ng-template #mixedStatusInfoIcon let-fieldName>
  <span
    igntTooltip
    [tooltipLabel]="
      (fieldName === 'status'
        ? 'sessions.sessionsPerTimeslot.mixedSalesStatusTooltip'
        : 'sessions.sessionsPerTimeslot.mixedVisibilityStatusTooltip'
      ) | translate
    "
    tooltipPlacement="bottom"
  >
    <fa-icon [icon]="['fas', 'info-circle']"></fa-icon>
  </span>
</ng-template>
