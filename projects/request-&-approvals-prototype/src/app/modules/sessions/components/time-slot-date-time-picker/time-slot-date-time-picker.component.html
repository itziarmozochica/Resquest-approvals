<form class="form-group time-slot-date-time-picker" [formGroup]="formGroup">
  <label class="field time-slot-date-time-picker__field">
    <input
      #datepickerInput
      name="time-slot-date-time-picker-date"
      class="field__input field-input--date time-slot-date-time-picker__input"
      type="date"
      formControlName="date"
      data-testid="date-selector-datepicker"
    />
    <span class="field__label">{{ 'sessions.quotaManagement.datePickerLabel' | translate }}</span>
    <fa-icon
      class="field__icon field__icon--trail"
      [icon]="['fal', 'calendar']"
      [fixedWidth]="true"
      (click)="datepickerInput?.showPicker()"
    ></fa-icon>
  </label>
  <label class="field time-slot-date-time-picker__field">
    <select
      name="time-slot-date-time-picker-time"
      class="field__input time-slot-date-time-picker__input time-slot-date-time-picker__select"
      formControlName="timeSlotId"
    >
      <option disabled hidden [selected]="!formGroup.value.timeSlotId" value="-1">--:--</option>
      <option *ngFor="let timeSlot of timeSlots; trackBy: trackById" [value]="timeSlot.id">
        {{ timeSlot.startsAt | momentDate: 'HH:mm' : timeZone }}
      </option>
    </select>
    <span class="field__label">{{ 'sessions.quotaManagement.timePickerLabel' | translate }}</span>
    <fa-icon
      class="field__icon field__icon--trail field time-slot-date-time-picker__time-icon"
      [icon]="['fal', 'clock']"
      [fixedWidth]="true"
    ></fa-icon>
  </label>
</form>
