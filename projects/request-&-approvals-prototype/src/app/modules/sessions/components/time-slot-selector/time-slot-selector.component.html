<div class="time-slot-selector">
  <app-date-range-time
    [dateTimeList]="dateTimeList()"
    [queryDate]="queryDate()"
    [selectedDateTime]="selectedDateTime()"
    [timezone]="timeZone()"
    [disabled]="disabled()"
    [showTimePicker]="true"
    [initialDateShown]="true"
    (selectDateEmitter)="onDateSelected($event)"
    (selectDateTimeEmitter)="onDateTimeSelected($event)"
  >
  </app-date-range-time>
</div>
