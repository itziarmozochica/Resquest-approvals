<ignt-alert
  data-testid="re-sort-priorities-banner"
  class="re-sort-priorities-banner"
  sentiment="accent"
  [description]="'sessions.pricing.orderListsBanner.message' | translate"
>
  <ng-template #igntAlertActions>
    <button
      class="button button--small button--secondary"
      data-testid="cancel-re-sort-priorities-button"
      [disabled]="isCancelPriorityButtonDisabled"
      (click)="onCancelPriorityChanges()"
    >
      {{ 'sessions.pricing.orderListsBanner.cancelButton' | translate }}
    </button>
    <button
      class="button button--small button--secondary"
      data-testid="save-re-sort-priorities-button"
      [disabled]="isSavePriorityButtonDisabled"
      (click)="onSavePriority()"
    >
      {{ 'sessions.pricing.orderListsBanner.saveButton' | translate }}
    </button>
  </ng-template>
</ignt-alert>
