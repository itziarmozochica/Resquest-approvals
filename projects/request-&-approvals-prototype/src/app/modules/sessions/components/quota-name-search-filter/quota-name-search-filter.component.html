<div class="quota-name-search-filter">
  <label class="quota-name-search-filter__field">
    <ignt-input-field
      data-testid="quota-name-filter"
      [formControl]="searchControl"
      [disabled]="isDisabled()"
      [label]="''"
      [placeholder]="'sessions.quotaManagement.searchQuotaNames' | translate"
      [placeholderAsEmptyValue]="true"
    />
    <ignt-icon class="quota-name-search-filter__icon" name="search" variant="regular" size="sm"></ignt-icon>
  </label>
</div>
