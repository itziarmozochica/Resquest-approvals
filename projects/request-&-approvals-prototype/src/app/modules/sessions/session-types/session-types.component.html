<div class="session-types">
  <div class="session-types__header header">
    {{ 'sessions.sessionTypes.sessionTypeSettings.header' | translate }}
  </div>

  <app-paginated-table-container
    (searchResults)="setSessionTypeList($event)"
    [checkHasMandatoryFilters]="checkHasMandatoryFilters"
    [errorMessage]="'sessions.sessionTypes.sessionTypeSettings.error' | translate"
    [filters]="searchQuery"
    [noFiltersIcon]="['far', 'sort-alt']"
    [noFiltersMessage]="'sessions.sessionTypes.sessionTypeSettings.noFilterSelected' | translate"
    [noResultIcon]="['far', 'receipt']"
    [noResultMessage]="'sessions.sessionTypes.sessionTypeSettings.noResults' | translate"
    [requestPage]="requestPage"
    data-testid="session-types-paginated-table"
  >
    <div class="session-types-table">
      <app-session-types-table (editSessionType)="clickOnEditSessionType($event)" [sessionTypeList]="sessionTypeList">
      </app-session-types-table>
    </div>

    <app-lateral-slider
      (closeSlider)="closeSessionTypeEditForm()"
      [contentTemplate]="editSessionTypeFormTemplate"
      [showDetails]="!!selectedSessionType"
      [title]="'sessions.sessionTypes.edition.title'"
    >
    </app-lateral-slider>
  </app-paginated-table-container>

  <ng-template #editSessionTypeFormTemplate>
    <app-session-type
      (formChanges)="formChange($event)"
      *ngIf="selectedSessionType && formMetadata"
      [sessionType]="selectedSessionType"
      [originalSessionTypeChannels]="selectedSessionType.sessionTypeChannels"
      [saving]="sessionTypeEditFormSaving"
      [isTicketTypeEditionLimited]="formMetadata.isTicketTypeEditionLimited"
      [productTaxRates]="formMetadata.productTaxRates"
      [partnerId]="selectedPartnerId"
      [planId]="searchQuery?.planId ?? 0"
    ></app-session-type>
  </ng-template>
</div>
