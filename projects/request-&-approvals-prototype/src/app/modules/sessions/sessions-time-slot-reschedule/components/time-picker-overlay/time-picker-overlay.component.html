<div class="time-picker-overlay">
  <div class="time-picker-overlay__column">
    <button
      type="button"
      class="time-picker-overlay__arrow"
      (click)="scrollHourUp()"
      [attr.data-testid]="testId() ? testId() + '-hour-up' : null"
    >
      <fa-icon [icon]="['fal', 'chevron-up']"></fa-icon>
    </button>
    <div class="time-picker-overlay__items" #hourScrollContainer>
      @for (hour of hours; track hour) {
        <button
          type="button"
          class="time-picker-overlay__item"
          [class.time-picker-overlay__item--disabled]="isHourDisabled(hour)"
          [class.time-picker-overlay__item--selected]="hour === hourSignal()"
          (click)="selectHour(hour)"
          [attr.data-testid]="testId() ? testId() + '-hour-' + hour : null"
        >
          {{ hour.toString().padStart(2, '0') }}
        </button>
      }
    </div>
    <button
      type="button"
      class="time-picker-overlay__arrow"
      (click)="scrollHourDown()"
      [attr.data-testid]="testId() ? testId() + '-hour-down' : null"
    >
      <fa-icon [icon]="['fal', 'chevron-down']"></fa-icon>
    </button>
  </div>

  <div class="time-picker-overlay__column">
    <button
      type="button"
      class="time-picker-overlay__arrow"
      (click)="scrollMinuteUp()"
      [attr.data-testid]="testId() ? testId() + '-minute-up' : null"
    >
      <fa-icon [icon]="['fal', 'chevron-up']"></fa-icon>
    </button>
    <div class="time-picker-overlay__items" #minuteScrollContainer>
      @for (minute of minutes; track minute) {
        <button
          type="button"
          class="time-picker-overlay__item"
          [class.time-picker-overlay__item--disabled]="isMinuteDisabled(minute)"
          [class.time-picker-overlay__item--selected]="minute === minuteSignal()"
          (click)="selectMinute(minute)"
          [attr.data-testid]="testId() ? testId() + '-minute-' + minute : null"
        >
          {{ minute.toString().padStart(2, '0') }}
        </button>
      }
    </div>
    <button
      type="button"
      class="time-picker-overlay__arrow"
      (click)="scrollMinuteDown()"
      [attr.data-testid]="testId() ? testId() + '-minute-down' : null"
    >
      <fa-icon [icon]="['fal', 'chevron-down']"></fa-icon>
    </button>
  </div>
</div>
