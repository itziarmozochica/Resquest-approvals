<div class="date-time-picker">
  @if (mode() === 'datetime') {
    <label
      class="date-time-picker__label"
      [class.date-time-picker__label--disabled]="disabled()"
      [class.date-time-picker__label--error]="errorType() === 'date-and-time'"
      (click)="onDateClick($event)"
    >
      <input
        #dateInput
        type="date"
        class="date-time-picker__input--hidden"
        [disabled]="disabled()"
        [value]="dateSignal()"
        [min]="minDate()"
        [max]="maxDate()"
        (change)="onDateChange($event)"
        [attr.data-testid]="testId() ? testId() + '-date' : null"
      />
      <span class="date-time-picker__display">{{ formattedDate() }}</span>
      <fa-icon class="date-time-picker__icon" [icon]="['fal', 'calendar-day']"></fa-icon>
    </label>
    <div class="date-time-picker__separator"></div>
  }

  <div
    #timePickerTrigger
    class="date-time-picker__label"
    [class.date-time-picker__label--disabled]="disabled()"
    [class.date-time-picker__label--error]="errorType() !== 'none'"
    [class.date-time-picker__label--time-only]="mode() === 'time' || errorType() === 'time-only'"
    [attr.data-testid]="testId() ? testId() + '-time' : null"
    (click)="onTimeClick()"
  >
    <span class="date-time-picker__display">{{ formattedTime() }}</span>
    <fa-icon class="date-time-picker__icon" [icon]="['fal', 'clock']"></fa-icon>
  </div>
</div>

@if (isOverlayOpen() && overlayPosition()) {
  <div #timeOverlay class="date-time-picker__overlay" [style.top.px]="overlayPosition()!.top" [style.left.px]="overlayPosition()!.left">
    <app-time-picker-overlay
      [hour]="hourSignal()"
      [maxHour]="maxHour()"
      [maxMinute]="maxMinute()"
      [minHour]="minHour()"
      [minMinute]="minMinute()"
      [minute]="minuteSignal()"
      [testId]="testId()"
      (hourChange)="onHourChange($event)"
      (minuteChange)="onMinuteChange($event)"
    />
  </div>
}
