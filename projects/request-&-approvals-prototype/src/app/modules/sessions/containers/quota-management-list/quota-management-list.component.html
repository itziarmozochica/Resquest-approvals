<app-search-result-view
  data-testid="quota-management-list-results"
  [displayContentWhileLoading]="false"
  [noResultMessage]="'sessions.pricing.priceListsOverview.noResults' | translate"
  [noResultIcon]="['far', 'receipt']"
  [noFiltersMessage]="'sessions.pricing.priceListsOverview.noFilterSelected' | translate"
  [noFiltersIcon]="['far', 'sort-alt']"
  [errorMessage]="'sessions.pricing.priceListsOverview.errorMessage' | translate"
  [currentState]="searchResultStatus()"
>
  <app-quota-management-list-table
    data-testid="quota-management-list-table"
    [timeSlot]="timeSlot"
    [capacitySummary]="capacitySummary$ | async"
    [quotaNameFilter]="quotaNameFilter"
    (addQuota)="onAddQuota($event)"
    (addTimeslotQuota)="onAddTimeslotQuota($event)"
    (clearFilter)="onClearFilter()"
    (quotaAction)="onQuotaAction($event)"
    (liveEditorSaveQuotasAdjustments)="onLiveEditorSaveQuotasAdjustments($event)"
  >
  </app-quota-management-list-table>
</app-search-result-view>
