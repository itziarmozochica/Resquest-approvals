<section class="sessions-page" [attr.aria-label]="'menu.sessions' | translate">
  <app-event-selection-band data-testid="sessions-selectors" [summary]="selectedPlanTitle() || ('sessions.searchFilters' | translate)">
    <app-search-bar
      data-testid="sessions-search-bar"
      [mandatoryFilters]="[SearchBarFilter.plan]"
      [preselectActiveCity]="false"
      [preselectActivePlan]="false"
      [screen]="screen.sessions"
      [searchOnChange]="true"
      [showVenue]="true"
      (searchEmitter)="loadNewSearch($event)"
    ></app-search-bar>
  </app-event-selection-band>

  <div class="sessions-page__title">
    <span class="sessions-page__section">{{ 'menu.events' | translate }}</span>
    <h1 class="sessions-page__heading" data-testid="page-title">{{ 'menu.sessions' | translate }}</h1>
  </div>

  @if (isTabsVisible()) {
    <ignt-tabs
      class="sessions-page__tabs"
      data-testid="sessions-tabs"
      [hasExtraLine]="false"
      [selectedIndex]="selectedTabIndex()"
      (selectedIndexChange)="onTabIndexChange($event)"
    >
      @for (tab of tabs(); track tab.id) {
        <ignt-tabs-item data-testid="tabs-option" [attr.data-tabid]="tab.id" [label]="tab.label | translate"></ignt-tabs-item>
      }
    </ignt-tabs>
  }
  <div class="sessions-page__content">
    <router-outlet></router-outlet>
  </div>

  <div class="help-topic" appHideWrapperOnHelpTopicClose *ngIf="getHelpTopicByTab as help">
    <app-help-topic-banner
      [message]="help.message | translate"
      [ctaLabel]="help.ctaLabel | translate"
      [ctaLink]="help.ctaLink | translate"
    ></app-help-topic-banner>
  </div>
</section>
