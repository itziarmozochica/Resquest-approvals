<div *ngIf="isDropdownVisible" class="seating-dropdown-container" data-testid="seating-dropdown-container">
  <ignt-button-dropdown
    [sentiment]="'secondary'"
    [variant]="'default'"
    [size]="'small'"
    [align]="'right'"
    [autoWidth]="true"
    [fill]="isMobile()"
    [options]="dropdownOptions"
    [loading]="
      loadingSeating[seatsIOEventManagerModalMode.manageChannels] ||
      loadingSeating[seatsIOEventManagerModalMode.manageForSaleConfig] ||
      loadingSeating[seatsIOEventManagerModalMode.manageCategories] ||
      loadingSeating[seatsIOEventManagerModalMode.manageObjectStatuses]
    "
    (optionClick)="onDropdownOptionClick($event)"
    data-testid="manage-seating-dropdown"
  >
    {{ 'seatingManagement.manageSeating' | translate }}
  </ignt-button-dropdown>
</div>
