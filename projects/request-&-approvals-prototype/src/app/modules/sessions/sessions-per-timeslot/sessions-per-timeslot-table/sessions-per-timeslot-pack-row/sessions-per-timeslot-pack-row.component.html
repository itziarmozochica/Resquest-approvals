<td class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__label">
  <span class="session-per-timeslot-row-label__pack">
    <span class="session-per-timeslot-row-label__pack--suffix">
      <ng-container *ngIf="packSessionLabel; else soldIndividually">
        {{ 'sessions.sessionsPerTimeslot.soldAsPartOf' | translate }} {{ packSessionLabel }}
      </ng-container>
      <ng-template #soldIndividually> {{ 'sessions.sessionsPerTimeslot.soldIndividually' | translate }} </ng-template>
    </span>
  </span>
</td>

<td class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__status"></td>
<td class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__visibility"></td>
<td *ngIf="isPricesColumnVisible" class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__price"></td>

<td
  data-testid="session-per-timeslot-row-sold-column"
  [class.sessions-per-timeslot-table__body-cell--highlighted]="isSoldExpanded"
  [class.sessions-per-timeslot-table__body-cell--collapsed]="!isSoldExpanded"
  class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__sold"
>
  <div data-testid="session-per-timeslot-row-sold-value" class="session-per-timeslot-base-row-sold">
    {{ soldTickets - reservedUnpaidTickets }}
  </div>
</td>

<td
  data-testid="session-per-timeslot-row-reserved-column"
  [class.sessions-per-timeslot-table__body-cell--highlighted]="isSoldExpanded"
  [class.sessions-per-timeslot-table__body-cell--collapsed]="!isSoldExpanded"
  class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__sold"
>
  <div data-testid="session-per-timeslot-row-reserved-value" class="session-per-timeslot-base-row-sold">
    {{ reservedUnpaidTickets }}
  </div>
</td>

<td
  data-testid="session-per-timeslot-row-issued-column"
  [class.sessions-per-timeslot-table__body-cell--collapsed]="isSoldExpanded"
  class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__sold"
>
  <div data-testid="session-per-timeslot-row-issued-value" class="session-per-timeslot-base-row-sold">
    {{ soldTickets }}
  </div>
</td>
<td class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__available"></td>
<td class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__max-qty"></td>
<td class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__occupancy"></td>
@if (canEditSession()) {
  <td class="sessions-per-timeslot-table__body-cell session-per-timeslot-base-row__edit"></td>
}
