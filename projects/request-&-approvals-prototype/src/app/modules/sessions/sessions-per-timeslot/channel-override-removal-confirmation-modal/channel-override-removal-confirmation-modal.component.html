<ignt-dialog-header>{{ title }}</ignt-dialog-header>

<ignt-dialog-content>{{ message }}</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button type="button" igntButton sentiment="tertiary" (click)="onCancel()" data-testid="channel-override-removal-confirmation-cancel">
    {{ cancelLabel }}
  </button>
  <button type="button" igntButton variant="danger" (click)="onConfirm()" data-testid="channel-override-removal-confirmation-confirm">
    {{ confirmLabel }}
  </button>
</ignt-dialog-footer>
