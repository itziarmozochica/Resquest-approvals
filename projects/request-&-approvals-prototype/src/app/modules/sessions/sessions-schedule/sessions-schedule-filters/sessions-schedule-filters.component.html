<form [formGroup]="formGroup" class="sessions-schedule-filters">
  <div class="sessions-schedule-filters__date-range-container">
    <app-date-range-form-group
      [startDateLabel]="'filters.startsAtFrom' | translate"
      [endDateLabel]="'filters.startsAtTo' | translate"
      (formGroupCreated)="onDateRangeFormCreated($event)"
      [displayTimePicker]="true"
      class="sessions-schedule-filters__date-range"
      data-testid="sessions-schedule-filters-date-range"
    ></app-date-range-form-group>
  </div>
</form>
