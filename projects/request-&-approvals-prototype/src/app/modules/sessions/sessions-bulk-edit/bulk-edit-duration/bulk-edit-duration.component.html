<div class="bulk-edit-duration">
  <h5 class="bulk-edit-duration__title">{{ 'sessions.bulkEdit.durationTitle' | translate }}</h5>
  <p class="bulk-edit-duration__description">{{ 'sessions.bulkEdit.durationDescription' | translate }}</p>
</div>

<div class="bulk-edit-duration__form" [formGroup]="durationForm">
  <div class="bulk-edit-duration__inputs">
    <div class="bulk-edit-duration__input bulk-edit-duration__input--primary">
      <ignt-input-field
        id="bulk-edit-duration-minutes"
        data-testid="bulk-edit-duration-minutes-input"
        formControlName="minutes"
        [label]="'sessions.bulkEdit.deltaUnit.minutes' | translate"
        type="number"
        [customFormErrors]="[
          { type: 'min', message: 'form.error.minValue' | translate: { value: MIN_VALUE } },
          { type: 'integer', message: 'sessions.bulkEdit.durationIntegerError' | translate },
        ]"
      ></ignt-input-field>
    </div>
    <div class="bulk-edit-duration__secondary">
      @if (!hoursActive) {
        <button
          igntButton
          type="button"
          size="small"
          sentiment="tertiary"
          [leadingIcon]="['fal', 'plus']"
          data-testid="bulk-edit-duration-hours-toggle"
          (click)="activateField('hours')"
        >
          {{ 'sessions.bulkEdit.deltaUnit.hours' | translate }}
        </button>
      } @else {
        <div class="bulk-edit-duration__input bulk-edit-duration__input--secondary" #hoursInputField>
          <ignt-input-field
            id="bulk-edit-duration-hours"
            data-testid="bulk-edit-duration-hours-input"
            formControlName="hours"
            [label]="'sessions.bulkEdit.deltaUnit.hours' | translate"
            type="number"
            [customFormErrors]="[
              { type: 'min', message: 'form.error.minValue' | translate: { value: MIN_VALUE } },
              { type: 'integer', message: 'sessions.bulkEdit.durationIntegerError' | translate },
            ]"
          ></ignt-input-field>
        </div>
      }
      @if (!daysActive) {
        <button
          igntButton
          type="button"
          size="small"
          sentiment="tertiary"
          [leadingIcon]="['fal', 'plus']"
          data-testid="bulk-edit-duration-days-toggle"
          (click)="activateField('days')"
        >
          {{ 'sessions.bulkEdit.deltaUnit.days' | translate }}
        </button>
      } @else {
        <div class="bulk-edit-duration__input bulk-edit-duration__input--secondary" #daysInputField>
          <ignt-input-field
            id="bulk-edit-duration-days"
            data-testid="bulk-edit-duration-days-input"
            formControlName="days"
            [label]="'sessions.bulkEdit.deltaUnit.days' | translate"
            type="number"
            [customFormErrors]="[
              { type: 'min', message: 'form.error.minValue' | translate: { value: MIN_VALUE } },
              { type: 'integer', message: 'sessions.bulkEdit.durationIntegerError' | translate },
            ]"
          ></ignt-input-field>
        </div>
      }
    </div>
  </div>
</div>
