<div class="bulk-edit-status-visibility">
  <p class="bulk-edit-status-visibility__title">{{ 'sessions.bulkEdit.setNewValues' | translate }}</p>
</div>

<form class="bulk-edit-status-visibility__form" [formGroup]="statusAndVisibilityForm">
  <label class="bulk-edit-status-visibility__checkbox">
    <input data-testid="bulk-edit-status-enable-switch-sales-status" type="checkbox" [formControl]="enableSalesStatus" />
    <span>{{ 'sessions.bulkEdit.salesStatus' | translate }}</span>
  </label>
  <ng-container
    *ngIf="statusAndVisibilityForm.controls.salesStatus as control"
    [ngTemplateOutlet]="switchTemplate"
    [ngTemplateOutletContext]="{
      $implicit: control,
      label: 'sessions.sessionsPerTimeslot.edition.field.status' | translate,
      activeLabel: 'sessions.sessionsPerTimeslot.status.purchasable' | translate,
      inactiveLabel: 'sessions.sessionsPerTimeslot.forcedSaleClosure' | translate,
      iconTemplate: statusIconTemplate,
      id: 'sales-status',
    }"
  ></ng-container>
  <label class="bulk-edit-status-visibility__checkbox">
    <input data-testid="bulk-edit-status-enable-switch-visibility" type="checkbox" [formControl]="enableVisibility" />
    <span>{{ 'sessions.bulkEdit.visibility' | translate }}</span>
  </label>
  <ng-container
    *ngIf="statusAndVisibilityForm.controls.visibility as control"
    [ngTemplateOutlet]="switchTemplate"
    [ngTemplateOutletContext]="{
      $implicit: control,
      label: 'sessions.sessionsPerTimeslot.edition.field.visibility' | translate,
      activeLabel: 'sessions.sessionsPerTimeslot.visibility.visible' | translate,
      inactiveLabel: 'sessions.sessionsPerTimeslot.visibility.hidden' | translate,
      iconTemplate: visibilityIconTemplate,
      id: 'visibility',
    }"
  ></ng-container>
</form>

<ng-template #visibilityIconTemplate>
  <fa-icon
    class="horizontal-switch__icon"
    [icon]="statusAndVisibilityForm.controls.visibility?.value ? ['fal', 'eye'] : ['fal', 'eye-slash']"
  >
  </fa-icon>
</ng-template>

<ng-template #statusIconTemplate>
  <app-on-off-badge [isOn]="statusAndVisibilityForm.controls.salesStatus?.value"> </app-on-off-badge>
</ng-template>

<ng-template
  #switchTemplate
  let-control
  let-activeLabel="activeLabel"
  let-inactiveLabel="inactiveLabel"
  let-label="label"
  let-id="id"
  let-iconTemplate="iconTemplate"
>
  <div class="horizontal-switch">
    <ng-container *ngTemplateOutlet="iconTemplate"></ng-container>
    <div class="horizontal-switch__legend">
      <label class="horizontal-switch__label">{{ label }}</label>
      <div class="horizontal-switch__status">
        <span [class.horizontal-switch-value--checked]="!control.value">
          {{ inactiveLabel }}
        </span>
        /
        <span [class.horizontal-switch-value--checked]="control.value">
          {{ activeLabel }}
        </span>
      </div>
    </div>

    <div class="form-check form-switch form-switch-lg">
      <input
        [id]="'status-switch-' + id"
        class="form-check-input"
        [attr.data-testid]="'bulk-edit-status-switch-' + id"
        [formControl]="control"
        type="checkbox"
      />
      <label class="form-check-label" [for]="'status-switch-' + id"></label>
    </div>
  </div>
</ng-template>
