<div class="bulk-edit-capacity">
  <h5 class="bulk-edit-capacity__title">{{ 'sessions.bulkEdit.capacityTitle' | translate }}</h5>
  <p class="bulk-edit-capacity__description">{{ 'sessions.bulkEdit.capacityDescription' | translate }}</p>
</div>

<div class="bulk-edit-capacity__form">
  <div class="bulk-edit-capacity__input">
    <ignt-input-field
      [id]="'bulk-edit-capacity'"
      [formControl]="capacityControl"
      [label]="'sessions.bulkEdit.capacity' | translate"
      [type]="'number'"
      [customFormErrors]="[
        { type: 'required', message: 'form.error.mandatoryField' | translate },
        { type: 'min', message: 'form.error.minValue' | translate: { value: MIN_VALUE } },
        { type: 'max', message: 'form.error.maxValue' | translate: { value: MAX_VALUE } },
      ]"
      (focusout)="onFocusOutCapacity()"
    ></ignt-input-field>
  </div>
</div>
