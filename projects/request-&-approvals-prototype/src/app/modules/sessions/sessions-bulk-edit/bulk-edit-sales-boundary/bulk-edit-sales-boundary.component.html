<div class="bulk-edit-sales-boundary wrapper-card wrapper-card--elevation-1" [attr.data-id]="boundaryId()" [formGroup]="form">
  <div class="bulk-edit-sales-boundary__shared" [attr.data-id]="boundaryId()">
    <div class="bulk-edit-sales-boundary__radio-row bulk-edit-sales-boundary__radio-row--stacked">
      <ignt-radio
        [id]="boundaryId() + '-relative'"
        [dataTestId]="'bulk-edit-' + boundaryId() + '-date-relative'"
        [name]="boundaryId()"
        [value]="dateSelectionKind.relative"
        [checked]="dateSelection.value === dateSelectionKind.relative"
        [label]="'sessions.bulkEdit.salesWindowRelative' | translate"
        (change)="onDateSelectionChange($event)"
      ></ignt-radio>
      <div class="bulk-edit-sales-boundary__relative-row" formGroupName="relativeDate">
        <div class="bulk-edit-sales-boundary__relative-row-input">
          <ignt-input-field
            [id]="boundaryId() + '-delta'"
            [attr.data-testid]="'bulk-edit-' + boundaryId() + '-delta'"
            [formControl]="form.controls.relativeDate.controls.delta"
            [disabled]="dateSelection.value !== dateSelectionKind.relative"
            [label]="'sessions.bulkEdit.salesWindowDeltaPlaceholder' | translate"
            [type]="'number'"
            [customFormErrors]="[
              { type: 'required', message: 'form.error.mandatoryField' | translate },
              { type: 'min', message: 'form.error.minValue' | translate: { value: minValue } },
              { type: 'max', message: 'form.error.maxValue' | translate: { value: maxValue } },
            ]"
            (focusout)="onFocusOutDelta()"
          ></ignt-input-field>
        </div>
        <ignt-typeahead
          class="bulk-edit-sales-boundary__relative-row-delta-unit"
          [attr.data-testid]="'bulk-edit-' + boundaryId() + '-delta-unit'"
          [disabled]="dateSelection.value !== dateSelectionKind.relative"
          [editable]="false"
          [fieldLabel]="'sessions.bulkEdit.salesWindowDeltaUnitPlaceholder' | translate"
          [options]="deltaUnitSelectOptions()"
          [selectedOption]="selectedDeltaUnit()"
          (selected)="onDeltaUnitSelected($event)"
        ></ignt-typeahead>
        <ignt-typeahead
          class="bulk-edit-sales-boundary__relative-row-delta-reference"
          [attr.data-testid]="'bulk-edit-' + boundaryId() + '-delta-reference'"
          [disabled]="dateSelection.value !== dateSelectionKind.relative"
          [editable]="false"
          [fieldLabel]="'sessions.bulkEdit.salesWindowDeltaReferencePlaceholder' | translate"
          [options]="referenceSelectOptions()"
          [selectedOption]="selectedReference()"
          (selected)="onReferenceSelected($event)"
        ></ignt-typeahead>
      </div>
    </div>
    <div class="bulk-edit-sales-boundary__radio-row bulk-edit-sales-boundary__radio-row--stacked">
      <ignt-radio
        [id]="boundaryId() + '-absolute'"
        [dataTestId]="'bulk-edit-' + boundaryId() + '-date-absolute'"
        [name]="boundaryId()"
        [value]="dateSelectionKind.absolute"
        [checked]="dateSelection.value === dateSelectionKind.absolute"
        [label]="'sessions.bulkEdit.salesWindowAbsolute' | translate"
        (change)="onDateSelectionChange($event)"
      ></ignt-radio>
      <app-date-time-form-control
        [formControl]="form.controls.absoluteDate"
        class="bulk-edit-sales-boundary__absolute-date-form"
        [dateLabel]="'sessions.bulkEdit.date' | translate"
        [timeLabel]="'sessions.bulkEdit.time' | translate"
        [timezone]="timezone()"
        [required]="dateSelection.value === dateSelectionKind.absolute"
        [humanizedInput]="false"
      ></app-date-time-form-control>
    </div>
  </div>
</div>
