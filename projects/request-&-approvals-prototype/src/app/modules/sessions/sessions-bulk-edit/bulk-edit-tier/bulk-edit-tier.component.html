<div class="bulk-edit-tier">
  <h5 class="bulk-edit-tier__title">{{ 'sessions.bulkEdit.setNewValue' | translate }}</h5>
  <p class="bulk-edit-tier__description">{{ 'sessions.bulkEdit.selectTierDescription' | translate }}</p>

  <div class="bulk-edit-tier__form">
    <app-time-slot-tier-selector
      [formControl]="tierControl"
      [options]="tiers"
      [placeholder]="'sessions.bulkEdit.selectOption' | translate"
      data-testid="bulk-edit-tier-selector"
    />
  </div>
</div>
