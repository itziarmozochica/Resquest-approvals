<header class="bulk-edit-confirmation-modal-header">
  <h5 class="bulk-edit-confirmation-modal-header__title">{{ 'sessions.bulkEdit.confirmationModal.title' | translate }}</h5>
  <button class="bulk-edit-confirmation-modal-header__close icon-button icon-button--small" (click)="confirm.emit(false)">
    <fa-icon [icon]="['fal', 'times']"></fa-icon>
  </button>
</header>

<section class="bulk-edit-confirmation-modal-body">
  <p [innerHTML]="'sessions.bulkEdit.confirmationModal.messageCanTakeAWhile' | translate"></p>
  <p [innerHTML]="'sessions.bulkEdit.confirmationModal.messageCannotBeUndone' | translate"></p>
</section>

<footer class="bulk-edit-confirmation-modal-footer">
  <button igntButton (click)="confirm.emit(false)" data-testid="bulk-edit-form-modal-cancel" sentiment="tertiary">
    {{ 'buttons.cancel' | translate }}
  </button>
  <button igntButton data-testid="bulk-edit-form-modal-confirm" sentiment="primary" (click)="confirm.emit(true)">
    {{ 'buttons.confirm' | translate }}
  </button>
</footer>
