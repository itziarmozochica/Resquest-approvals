<div class="tabs">
  <span
    *ngFor="let tab of tabs; trackBy: trackByIdFn"
    class="tabs__option"
    [class.tabs__option--selected]="tab?.id === selectedTab?.id"
    (click)="tabClicked.emit(tab)"
    [attr.data-tabid]="tab?.id"
    data-testid="tabs-option"
  >
    <fa-icon class="tabs__icon" *ngIf="tab?.icon" [icon]="tab.icon"></fa-icon>
    {{ tab.label | translate }}
  </span>
</div>
<div class="tab-content">
  <ng-content></ng-content>
</div>
