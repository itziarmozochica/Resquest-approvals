@if (partner(); as partner) {
  <div class="menu-actions">
    <button class="menu-actions__button" id="icon_login" type="button" [igntMenuTriggerFor]="accountMenu">
      <span class="menu-actions__user">
        <span class="menu-actions__user-name" data-testid="logo-user-name">{{ userName() }}</span>
        @if (onsiteSetupName(); as onsiteSetupName) {
          <span class="menu-actions__user-organization" data-testid="logo-onsite-setup-name">{{ onsiteSetupName }}</span>
        } @else {
          <span class="menu-actions__user-organization" data-testid="logo-partner-name">{{ partner.name }}</span>
        }
      </span>
      <fa-icon class="menu-actions__icon" [icon]="['fal', 'user-circle']" [fixedWidth]="true"></fa-icon>
    </button>
    <ng-template #accountMenu>
      <div class="menu-actions-dropdown" data-testid="menu-actions-dropdown">
        <app-user-info
          class="menu-actions-dropdown-item menu-actions-dropdown-item--header"
          [partner]="partner"
          [userName]="userName()"
        ></app-user-info>
        <ignt-menu (menuItemSelected)="onActionClick($event)">
          @for (action of globalMenuItems(); track action.id) {
            <ignt-menu-item [attr.data-testid]="'menu-' + action.id" [label]="action.label" [value]="action.id">
              @if (action.igntIcon; as icon) {
                <ignt-icon aria-hidden="true" [name]="icon.name" [variant]="icon.variant" />
              }
            </ignt-menu-item>
          }
        </ignt-menu>
      </div>
    </ng-template>
  </div>
}
