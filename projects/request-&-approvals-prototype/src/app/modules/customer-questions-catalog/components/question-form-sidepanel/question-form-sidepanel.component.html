<ignt-dialog-header>{{ headerTitle }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="question-form">
    <app-question-base-fields
      #base
      [question]="question"
      [type]="type"
      [editable]="questionEditable"
      [typeSelectable]="questionCreate"
      [availableTypes]="availableTypes"
    />
    @if (mpqInfo) {
      <app-main-plan-question-fields [info]="mpqInfo" [type]="base.selectedType()" [choices]="base.choices()" [editable]="mpqEditable" />
    }
    <app-question-additional-settings #additional [question]="question" [type]="base.selectedType()" [editable]="questionEditable" />
  </div>
</ignt-dialog-content>

<ignt-dialog-footer>
  @if (canSubmit) {
    <ignt-button
      htmlType="button"
      data-testid="submit-question"
      [label]="confirmLabelKey | translate"
      [loading]="saving()"
      [disabled]="(questionEditable && (!base.valid() || !additional.valid())) || saving()"
      (click)="onSubmit(base.value(), additional.value(), mpqFields()?.value() ?? null)"
    />
  }
</ignt-dialog-footer>
