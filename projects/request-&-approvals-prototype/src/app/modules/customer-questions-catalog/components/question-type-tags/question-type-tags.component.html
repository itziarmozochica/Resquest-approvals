<div class="question-type-tags">
  <ignt-pill-button
    class="question-type-tags__pill"
    [class.question-type-tags__pill--readonly]="!checkable()"
    [label]="labelKey() | translate"
    [value]="type()"
    [icon]="{ name: icon(), variant: 'light' }"
    [checked]="checked()"
    (checkedChange)="checkedChange.emit($event)"
  />
</div>
