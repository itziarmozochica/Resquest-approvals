<ignt-dialog-header>{{ 'common.filter.label' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <div class="filter-panel">
    <section class="filter-panel__section">
      <h3 class="filter-panel__title">{{ 'customerQuestionsCatalog.filters.type' | translate }}</h3>
      <div class="filter-panel__pills">
        @for (type of typeOptions; track type) {
          <app-question-type-tags [type]="type" [checkable]="true" [checked]="draftType() === type" (checkedChange)="selectType(type)" />
        }
      </div>
    </section>

    <section class="filter-panel__section">
      <h3 class="filter-panel__title">{{ 'customerQuestionsCatalog.filters.catalog' | translate }}</h3>
      <div class="filter-panel__pills">
        <ignt-pill-button
          [label]="'customerQuestionsCatalog.catalog.fever' | translate"
          [value]="catalogCategory.SHARED"
          [checked]="draftCatalogCategories().includes(catalogCategory.SHARED)"
          (checkedChange)="toggleCatalogCategory(catalogCategory.SHARED)"
        />
        <ignt-pill-button
          [label]="partnerName"
          [value]="catalogCategory.PARTNER_OWNED"
          [checked]="draftCatalogCategories().includes(catalogCategory.PARTNER_OWNED)"
          (checkedChange)="toggleCatalogCategory(catalogCategory.PARTNER_OWNED)"
        />
      </div>
    </section>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    [label]="'common.filter.clear' | translate"
    variant="secondary"
    data-testid="clear-filters"
    (click)="clearFilters()"
  ></ignt-button>
  <ignt-button
    [label]="'common.filter.apply' | translate"
    variant="primary"
    data-testid="apply-filters"
    (click)="applyFilters()"
  ></ignt-button>
</ignt-dialog-footer>
