<div class="question-choice-card">
  <div class="question-choice-card__header">
    <span class="question-choice-card__title"> {{ 'customerQuestionsCatalog.sidepanel.choice' | translate }} {{ choice().number }} </span>
  </div>
  <div class="question-choice-card__fields">
    <ignt-input-field
      label="{{ 'customerQuestionsCatalog.sidepanel.choiceTitle' | translate }}"
      [formControl]="choice().labelControl"
      [readonly]="true"
    />
    @if (choice().hasAdditionalQuestion) {
      <ignt-input-field
        label="{{ 'customerQuestionsCatalog.sidepanel.additionalQuestion' | translate }}"
        [formControl]="choice().additionalControl"
        [readonly]="true"
      />
    }
  </div>
</div>
