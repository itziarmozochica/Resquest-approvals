@let mpq = mpqView();

<div class="main-plan-question-fields" data-testid="mpq-section">
  @if (showOptional()) {
    <div class="main-plan-question-fields__toggle-field" data-testid="mpq-optional">
      <label class="main-plan-question-fields__label">{{ 'mainPlanQuestions.fields.optional' | translate }}</label>
      <ignt-toggle [checked]="mpq.optional" [disabled]="!editable()" (change)="onMpqOptionalChange($event)" />
    </div>
  }

  @switch (mpq.defaultValuesMode) {
    @case ('toggle') {
      <div class="main-plan-question-fields__toggle-field" data-testid="mpq-default-value-toggle">
        <label class="main-plan-question-fields__label">{{ 'mainPlanQuestions.fields.defaultValue' | translate }}</label>
        <ignt-toggle [checked]="mpq.defaultValueChecked" [disabled]="!editable()" (change)="onMpqDefaultValueCheckedChange($event)" />
      </div>
    }
    @case ('single') {
      <ignt-typeahead
        fieldLabel="{{ 'mainPlanQuestions.fields.defaultValue' | translate }}"
        [options]="mpq.defaultValueOptions"
        [selectedOption]="mpq.selectedDefaultValue"
        [disabled]="!editable()"
        (selected)="onMpqDefaultValueSelected($event)"
      />
    }
    @case ('multi') {
      <div class="main-plan-question-fields__field">
        <label class="main-plan-question-fields__label">{{ 'mainPlanQuestions.fields.defaultValues' | translate }}</label>
        <app-multi-select
          [options]="mpq.defaultValueOptions"
          [selectedOptions]="mpq.selectedDefaultValues"
          [displayInPlaceMaximum]="5"
          [disabled]="!editable()"
          (selected)="onMpqDefaultValuesSelected($event)"
        />
      </div>
    }
    @default {
      <ignt-input-field
        label="{{ 'mainPlanQuestions.fields.defaultValue' | translate }}"
        [formControl]="mpqDefaultValueControl"
        [readonly]="!editable()"
      />
    }
  }

  @if (showAutoAnswerFrom()) {
    <ignt-typeahead
      data-testid="mpq-auto-answer-from"
      fieldLabel="{{ 'mainPlanQuestions.fields.autoAnswerFrom' | translate }}"
      [options]="mpq.autoAnswerFromOptions"
      [selectedOption]="mpq.selectedAutoAnswerFrom"
      [disabled]="!editable()"
      (selected)="onMpqAutoAnswerFromSelected($event)"
    />
  }

  @if (showAnswersAttachedToCodes()) {
    <div class="main-plan-question-fields__toggle-field" data-testid="mpq-answers-attached">
      <label class="main-plan-question-fields__label">{{ 'mainPlanQuestions.fields.answersAttachedToCodes' | translate }}</label>
      <ignt-toggle [checked]="mpq.answersAttachedToCodes" [disabled]="!editable()" (change)="onMpqAnswersAttachedChange($event)" />
    </div>
  }

  <ignt-typeahead
    fieldLabel="{{ 'mainPlanQuestions.fields.sessionType' | translate }}"
    selectAllLabel="{{ 'mainPlanQuestions.fields.allSessionTypes' | translate }}"
    [options]="mpq.sessionTypeOptions"
    [selectedOption]="mpq.selectedSessionType"
    [disabled]="!editable()"
    (selected)="onMpqSessionTypeSelected($event)"
  />

  <app-multi-select
    placeholder="{{ 'mainPlanQuestions.fields.allChannels' | translate }}"
    [options]="mpq.channelOptions"
    [selectedOptions]="mpq.selectedChannels"
    [isSelectAllVisible]="true"
    [displayInPlaceMaximum]="5"
    [disabled]="!editable()"
    (selected)="onMpqChannelsSelected($event)"
  />
</div>
