<div class="intents-filters">
  <div class="intents-filters__name">
    <label class="intents-filters__label" for="whitelabel-name-filter">
      {{ 'listWhitelabels.intents.filters.name' | translate }}
    </label>
    <ignt-input-field
      id="whitelabel-name-filter"
      [label]="'listWhitelabels.intents.filters.name' | translate"
      [formControl]="nameSearchControl"
      [placeholder]="'listWhitelabels.intents.filters.namePlaceholder' | translate"
      data-testid="whitelabel-name-filter"
    />
  </div>
  <div class="intents-filters__state">
    <label class="intents-filters__label" for="whitelabel-state-filter">
      {{ 'listWhitelabels.intents.filters.state' | translate }}
    </label>
    <select
      id="whitelabel-state-filter"
      class="intents-filters__select"
      [value]="stateFilterValue()"
      (change)="onStateFilterChange($event)"
      data-testid="whitelabel-state-filter"
    >
      @for (opt of stateFilterOptions; track opt.value) {
        <option [value]="opt.value">{{ opt.labelKey | translate }}</option>
      }
    </select>
  </div>
</div>
