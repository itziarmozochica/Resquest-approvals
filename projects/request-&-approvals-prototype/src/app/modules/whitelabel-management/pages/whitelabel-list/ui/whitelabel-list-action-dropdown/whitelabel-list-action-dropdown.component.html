<ignt-button-dropdown
  class="whitelabel-list-action-dropdown"
  [options]="options()"
  [size]="'small'"
  [sentiment]="'tertiary'"
  [variant]="'default'"
  [borderless]="true"
  [align]="'right'"
  [autoWidth]="true"
  [loading]="loading()"
  [disabled]="loading()"
  [leadingIcon]="['fas', 'ellipsis-v']"
  [trailingIconClosed]="$any(null)"
  [trailingIconOpened]="$any(null)"
  [attr.aria-label]="ariaLabel() | translate"
  (openedChange)="onOpenedChange($event)"
  (optionClick)="onOptionClick($event)"
  data-testid="whitelabel-list-row-actions-dropdown"
  [hoverEffect]="true"
>
</ignt-button-dropdown>
