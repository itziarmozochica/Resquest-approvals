<div class="no-whitelabel">
  <span class="no-whitelabel__text">{{ 'listWhitelabels.errors.404' | translate }}</span>
  <div class="no-whitelabel__actions">
    <button
      *permissionBased="'can_manage_whitelabels'"
      class="button button--large button--primary cell cell--hug-md"
      type="button"
      (click)="openGeneralSettings.emit()"
      data-testid="no-whitelabel-general-settings-button"
    >
      {{ 'listWhitelabels.generalSettings.label' | translate }}
    </button>
    <button
      *permissionBased="'can_create_whitelabel'"
      class="button button--large button--primary cell cell--hug-md"
      type="button"
      (click)="createWhitelabel.emit()"
      data-testid="no-whitelabel-create-button"
    >
      {{ 'listWhitelabels.intents.createIntent' | translate }}
    </button>
  </div>
</div>
