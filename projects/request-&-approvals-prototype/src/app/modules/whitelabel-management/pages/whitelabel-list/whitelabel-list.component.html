<app-page-title [title]="'menu.whitelabel' | translate" class="new-design"></app-page-title>

<div class="intents-container">
  <div class="intents-list wrapper-card wrapper-card--elevation-100 wrapper-card--custom-mobile">
    <div class="intents-list__main">
      @if (noWhitelabels()) {
        <app-no-whitelabel (createWhitelabel)="handleCreateWhitelabel()" (openGeneralSettings)="handleOpenGeneralSettings()" />
      } @else {
        <app-whitelabel-list-content
          [whitelabels]="paginatedWhitelabels()"
          [currentPage]="currentPage()"
          [totalPages]="totalPages()"
          [totalFilteredCount]="totalFilteredCount()"
          [pageSize]="pageSize"
          [hasNoResultsAfterFilter]="hasNoResultsAfterFilter()"
          [noResultsBecauseAllArchived]="noResultsBecauseAllArchived()"
          [nameQuery]="nameQuery()"
          [stateFilter]="stateFilter()"
          (createWhitelabel)="handleCreateWhitelabel()"
          (openGeneralSettings)="handleOpenGeneralSettings()"
          (action)="handleAction($event.whitelabel, $event.action)"
          (nameFilterChange)="handleNameFilterChange($event)"
          (stateFilterChange)="handleStateFilterChange($event)"
          (pageChange)="handlePageChange($event)"
        />
      }
    </div>
  </div>
</div>
