<tr class="intents-table__row" data-testid="intents-table__row" [class.intents-table__row--failed]="row().state === IntentState.FAILED">
  <td class="intents-table__body-cell intents-table__intent-name" [attr.data-testid]="'intents-table-name-' + row().id">
    <div>{{ row().name }}</div>
  </td>
  <td class="intents-table__body-cell intents-table__intent-host" [attr.data-testid]="'intents-table-host-' + row().id">
    <div>{{ row().host || '-' }}</div>
  </td>
  <td class="intents-table__body-cell intents-table__intent-channel" [attr.data-testid]="'intents-table-channel-' + row().id">
    <div>{{ row().channel_id || '-' }}</div>
  </td>
  <td class="intents-table__body-cell intents-table__intent-state-tag" [attr.data-testid]="'intents-table-state-' + row().id">
    @if (row().state !== IntentState.IN_PROGRESS) {
      <div>
        <ignt-tag [sentiment]="IntentStateTagSentiment[row().state]" [variant]="'outline'">
          {{ row().state }}
        </ignt-tag>
      </div>
    } @else {
      <div class="intents-table__progress-bar">
        <app-progress-bar [percentage]="row().progress_percentage ?? 0"></app-progress-bar>
      </div>
    }
  </td>
  <td class="intents-table__body-cell intents-table__actions" (click)="$event.stopPropagation()">
    @if (showActions()) {
      <app-whitelabel-list-action-dropdown
        [id]="row().id"
        [options]="rowActions()"
        [ariaLabel]="'listWhitelabels.intents.actions.ariaLabel'"
        (optionClick)="onOptionClick($event)"
      />
    }
  </td>
</tr>
