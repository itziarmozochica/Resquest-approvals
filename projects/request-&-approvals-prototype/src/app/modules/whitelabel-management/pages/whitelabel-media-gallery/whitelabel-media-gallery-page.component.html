<app-go-back
  [goBackTitle]="'whitelabelMediaGallery.backToEditor' | translate"
  [urlGoBack]="'/whitelabels/editor/' + whitelabel.id"
></app-go-back>
<app-page-title [title]="'whitelabelMediaGallery.title' | translate" class="new-design"></app-page-title>

<div class="whitelabel-media-gallery-page">
  <div class="whitelabel-media-gallery-page__container">
    <div class="wrapper-card wrapper-card--elevation-100 wrapper-card--custom-mobile whitelabel-media-gallery-page__card">
      <ignt-tabs
        class="whitelabel-media-gallery-page__tabs"
        [variant]="'default'"
        [hasExtraLine]="false"
        [selectedIndex]="activeTabIndex()"
        (selectedIndexChange)="onTabChange($event)"
      >
        <ignt-tabs-item [label]="'whitelabelMediaGallery.tabs.media' | translate">
          <app-whitelabel-media-gallery [whitelabelId]="whitelabel.id" [canManageWhitelabels]="canManageWhitelabels" [inert]="isReadOnly" />
        </ignt-tabs-item>
        <ignt-tabs-item [label]="'whitelabelMediaGallery.tabs.fonts' | translate">
          <app-whitelabel-fonts
            [whitelabelId]="whitelabel.id"
            [canManageWhitelabels]="canManageWhitelabels"
            [styleContext]="styleContext"
            [inert]="isReadOnly"
          />
        </ignt-tabs-item>
      </ignt-tabs>
    </div>
  </div>
</div>
