<ignt-dialog-header data-testid="google-maps-domain-details-title">
  {{ i18n + '.details.title' | translate: { hostname: data.host } }}
</ignt-dialog-header>

<ignt-dialog-content>
  <h3 class="google-maps-domain-details__patterns-title" data-testid="google-maps-domain-details-patterns-title">
    {{ i18n + '.details.patternsTitle' | translate }}
  </h3>

  <ul class="google-maps-domain-details__list">
    @for (pattern of data.patternsPresent; track pattern) {
      <li class="google-maps-domain-details__item" [attr.data-testid]="'google-maps-domain-details-pattern-' + pattern">{{ pattern }}</li>
    } @empty {
      <li class="google-maps-domain-details__note" data-testid="google-maps-domain-details-empty">
        {{ i18n + '.details.empty' | translate }}
      </li>
    }
  </ul>
</ignt-dialog-content>

<ignt-dialog-footer hideCancelButton>
  <ignt-button
    fill
    igntDialogClose
    variant="secondary"
    data-testid="google-maps-domain-details-close"
    [label]="i18n + '.details.close' | translate"
  />
</ignt-dialog-footer>
