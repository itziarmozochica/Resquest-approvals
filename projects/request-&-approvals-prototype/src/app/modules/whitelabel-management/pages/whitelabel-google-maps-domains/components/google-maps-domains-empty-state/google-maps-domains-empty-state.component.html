<section class="google-maps-domains-empty-state" [attr.data-testid]="'google-maps-domains-empty-' + variant()">
  <strong data-testid="google-maps-domains-empty-title">{{ i18n + '.empty.' + variant() + '.title' | translate }}</strong>

  <p class="google-maps-domains-empty-state__message" data-testid="google-maps-domains-empty-message">
    {{ i18n + '.empty.' + variant() + '.message' | translate }}
  </p>

  @if (hasUpdatePageLink()) {
    <a class="google-maps-domains-empty-state__action" data-testid="google-maps-domains-empty-action" [routerLink]="updatePagePath()">
      {{ i18n + '.empty.noHosts.action' | translate }}
    </a>
  }
</section>
