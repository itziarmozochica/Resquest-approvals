<div class="general-settings-content">
  <div class="wrapper-card wrapper-card--elevation-100 wrapper-card--custom-mobile">
    <div class="general-settings-content__section-label">{{ 'menu.whitelabelConfig' | translate }}</div>
    <div class="general-settings-content__buttons">
      <ignt-button [label]="'listWhitelabels.generalSettings.addNewConfig' | translate" (click)="addNewConfig.emit()" />
      <ignt-button [label]="'listWhitelabels.generalSettings.addConfigRelation' | translate" (click)="addConfigRelation.emit()" />
      <ignt-button [label]="'listWhitelabels.generalSettings.editDefaultConfig' | translate" (click)="editDefaultConfig.emit()" />
      <ignt-button [label]="'listWhitelabels.generalSettings.mediaMigrationTool' | translate" (click)="openMediaMigration.emit()" />
    </div>
  </div>
  <div class="wrapper-card wrapper-card--elevation-100 wrapper-card--custom-mobile">
    <div class="general-settings-content__section-label">{{ 'menu.whitelabelStyles' | translate }}</div>
    <div class="general-settings-content__buttons">
      <ignt-button [label]="'listWhitelabels.generalSettings.addNewStyle' | translate" (click)="addNewStyle.emit()" />
      <ignt-button [label]="'listWhitelabels.generalSettings.addStyleRelation' | translate" (click)="addStyleRelation.emit()" />
    </div>
  </div>
  <div class="wrapper-card wrapper-card--elevation-100 wrapper-card--custom-mobile">
    <div class="general-settings-content__section-label">{{ 'whitelabelManagement.cacheFlush.label' | translate }}</div>
    <div class="general-settings-content__buttons">
      <ignt-button
        data-testid="wl-general-settings-flush-all-caches"
        [label]="'whitelabelManagement.cacheFlush.flushAll' | translate"
        [loading]="isFlushingCaches()"
        (click)="flushAllCaches.emit()"
      />
    </div>
  </div>
</div>
