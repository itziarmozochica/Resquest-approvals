<div class="whitelabel-integrations-summary-strip">
  <div class="whitelabel-integrations-summary-strip__items">
    <div class="whitelabel-integrations-summary-strip__item">
      <div class="whitelabel-integrations-summary-strip__label">Channel</div>
      <div class="whitelabel-integrations-summary-strip__value">{{ channelId() }}</div>
    </div>
    <div class="whitelabel-integrations-summary-strip__item">
      <div class="whitelabel-integrations-summary-strip__label">Schema</div>
      <div class="whitelabel-integrations-summary-strip__value">{{ schema() }}</div>
    </div>
    <div class="whitelabel-integrations-summary-strip__item">
      <div class="whitelabel-integrations-summary-strip__label">Host</div>
      <div class="whitelabel-integrations-summary-strip__value">{{ host() }}</div>
    </div>
    <div class="whitelabel-integrations-summary-strip__item">
      <div class="whitelabel-integrations-summary-strip__label">Languages</div>
      <div class="whitelabel-integrations-summary-strip__value">{{ languages().join(', ') }}</div>
    </div>
  </div>
</div>
