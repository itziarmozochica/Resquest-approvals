<ignt-dialog-header>
  {{ modalTitleKey() | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="whitelabel-integrations-create-application-service-modal">
    <div class="whitelabel-integrations-create-application-service-modal__body">
      <app-whitelabel-integrations-create-application-service-form
        [modalData]="createApplicationServiceModalData"
        (cancelClick)="onFormCancel()"
        (submitSuccess)="onFormSubmitSuccess($event)"
      />
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button igntButton sentiment="secondary" type="button" (click)="onCancel()">
    {{ 'whitelabelManagement.integrations.createModal.cancel' | translate }}
  </button>
  <button igntButton sentiment="primary" type="button" [disabled]="submitting()" (click)="onSubmit()">
    {{
      (isEditMode ? 'whitelabelManagement.integrations.editModal.save' : 'whitelabelManagement.integrations.createModal.create') | translate
    }}
  </button>
</ignt-dialog-footer>
