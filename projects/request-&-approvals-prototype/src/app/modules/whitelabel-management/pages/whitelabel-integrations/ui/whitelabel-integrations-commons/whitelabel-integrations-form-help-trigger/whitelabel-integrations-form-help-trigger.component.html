<button
  type="button"
  class="whitelabel-integrations-form-help-trigger__btn"
  cdkOverlayOrigin
  #helpOrigin="cdkOverlayOrigin"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="ariaLabelKey() | translate"
  (click)="toggle($event)"
>
  <ignt-icon name="info-circle" variant="regular" size="base" [fixedWidth]="true" />
</button>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayOrigin]="helpOrigin"
  [cdkConnectedOverlayPositions]="overlayPositions"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  cdkConnectedOverlayPanelClass="whitelabel-integrations-form-help-trigger__overlay"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div class="whitelabel-integrations-form-help-trigger__panel" (click)="$event.stopPropagation()">
    @if (secondTranslateKey(); as key2) {
      <p class="whitelabel-integrations-form-help-trigger__text whitelabel-integrations-form-help-trigger__text--lead">
        {{ translateKey() | translate }}
      </p>
      <p class="whitelabel-integrations-form-help-trigger__text mb-0">{{ key2 | translate }}</p>
    } @else {
      <p class="whitelabel-integrations-form-help-trigger__text mb-0">{{ translateKey() | translate }}</p>
    }
  </div>
</ng-template>
