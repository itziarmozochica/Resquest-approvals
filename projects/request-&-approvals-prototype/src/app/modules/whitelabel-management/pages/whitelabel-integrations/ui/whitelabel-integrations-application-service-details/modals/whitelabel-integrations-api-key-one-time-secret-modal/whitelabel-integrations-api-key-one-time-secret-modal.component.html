<ignt-dialog-header>
  {{ 'whitelabelManagement.integrations.apiKeys.oneTimeModal.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="whitelabel-integrations-api-key-one-time-secret-modal">
    <div class="whitelabel-integrations-api-key-one-time-secret-modal__icon-wrap" aria-hidden="true">
      <ignt-icon class="whitelabel-integrations-api-key-one-time-secret-modal__icon" name="triangle-exclamation" variant="solid" />
    </div>
    <p class="whitelabel-integrations-api-key-one-time-secret-modal__lead text-muted text-center mb-0">
      {{ 'whitelabelManagement.integrations.apiKeys.oneTimeModal.body' | translate }}
    </p>
    <div
      class="whitelabel-integrations-api-key-one-time-secret-modal__secret-box"
      role="group"
      [attr.aria-label]="'whitelabelManagement.integrations.apiKeys.oneTimeModal.secretLabel' | translate"
    >
      <code class="whitelabel-integrations-api-key-one-time-secret-modal__secret">{{ secretKey }}</code>
    </div>
    <p class="whitelabel-integrations-api-key-one-time-secret-modal__urgent text-center text-danger fw-semibold mb-0">
      {{ 'whitelabelManagement.integrations.apiKeys.oneTimeModal.copyUrgent' | translate }}
    </p>
    <div class="whitelabel-integrations-api-key-one-time-secret-modal__actions">
      <button igntButton sentiment="secondary" type="button" (click)="onCopy()">
        <span class="whitelabel-integrations-api-key-one-time-secret-modal__copy-inner">
          <ignt-icon name="copy" variant="regular" size="base" aria-hidden="true" />
          @if (copyDone()) {
            <span>{{ 'whitelabelManagement.integrations.apiKeys.oneTimeModal.copied' | translate }}</span>
          } @else {
            <span>{{ 'whitelabelManagement.integrations.apiKeys.oneTimeModal.copy' | translate }}</span>
          }
        </span>
      </button>
    </div>
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button igntButton sentiment="primary" type="button" (click)="onDismiss()">
    {{ 'whitelabelManagement.integrations.apiKeys.oneTimeModal.confirm' | translate }}
  </button>
</ignt-dialog-footer>
