<ignt-dialog-header hideCloseButton>
  {{ dialogData.title }}
</ignt-dialog-header>

<ignt-dialog-content>
  <app-whitelabel-integrations-delete-api-key-confirm-form
    [acceptLabel]="dialogData.acceptLabel"
    [cancelLabel]="dialogData.cancelLabel"
    [isConfirming]="isConfirming()"
    [message]="dialogData.message"
    (acceptRequested)="onAcceptRequested()"
    (cancelRequested)="onCancelRequested()"
  />
</ignt-dialog-content>
