<section class="whitelabel-integrations-no-application-service-tile">
  <div class="whitelabel-integrations-no-application-service-tile__card">
    <div class="whitelabel-integrations-no-application-service-tile__visual" aria-hidden="true">
      <img
        class="whitelabel-integrations-no-application-service-tile__img"
        ngSrc="/assets/images/whitelabel-integrations/integrations-empty-state-illustration.png"
        width="200"
        height="200"
        priority
        alt=""
      />
    </div>
    <h2 class="whitelabel-integrations-no-application-service-tile__title">
      {{ 'whitelabelManagement.integrations.emptyServicesTitle' | translate }}
    </h2>
    <p class="whitelabel-integrations-no-application-service-tile__text">
      {{ 'whitelabelManagement.integrations.emptyServicesBody' | translate }}
    </p>
    @if (!isReadOnly()) {
      <div class="whitelabel-integrations-no-application-service-tile__actions">
        <button
          igntButton
          sentiment="primary"
          type="button"
          data-testid="wl-integrations-create-service"
          (click)="onCreateApplicationServiceClick()"
        >
          {{ 'whitelabelManagement.integrations.createApplicationService' | translate }}
        </button>
        <button
          igntButton
          sentiment="secondary"
          type="button"
          data-testid="wl-integrations-assign-service"
          (click)="onAssignExistingApplicationServiceClick()"
        >
          {{ 'whitelabelManagement.integrations.assignExistingApplicationService' | translate }}
        </button>
      </div>
    }
  </div>
</section>
