<ignt-dialog-header>
  {{ 'whitelabelManagement.integrations.assignModal.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <app-whitelabel-integrations-assign-existing-application-service-form
    [assignRowErrorKey]="assignRowErrorKey()"
    [assignableServices]="assignableServices()"
    [assigningServiceId]="assigningServiceId()"
    [loadFailed]="loadFailed()"
    [loadingList]="loadingList()"
    (assignRequested)="onAssignRequested($event)"
  />
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button igntButton sentiment="secondary" type="button" (click)="onCancel()">
    {{ 'whitelabelManagement.integrations.assignModal.cancel' | translate }}
  </button>
</ignt-dialog-footer>
