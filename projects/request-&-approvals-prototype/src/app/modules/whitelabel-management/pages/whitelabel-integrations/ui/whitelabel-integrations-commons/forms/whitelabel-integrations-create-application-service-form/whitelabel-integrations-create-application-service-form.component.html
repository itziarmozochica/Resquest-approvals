<div class="whitelabel-integrations-create-application-service-form">
  <p class="whitelabel-integrations-create-application-service-form__intro text-muted">
    {{ modalIntroKey() | translate }}
  </p>
  <hr class="whitelabel-integrations-create-application-service-form__section-separator" />
  @if (submitError()) {
    <div class="alert alert-danger whitelabel-integrations-create-application-service-form__submit-error" role="alert">
      {{ submitError()! | translate }}
    </div>
  }
  @if (showMainServiceForm()) {
    <app-whitelabel-integrations-create-application-service-main-form [form]="apiKeyForm" />
    @if (showOauthSection()) {
      <div class="whitelabel-integrations-create-application-service-form__oauth">
        <app-whitelabel-integrations-oauth-strategy-form
          [form]="oauthForm"
          [hideCredentialFields]="oauthHideClientSecrets()"
          variant="default"
        />
      </div>
    }
  } @else {
    <app-whitelabel-integrations-rotate-credentials-form [form]="rotateCredentialsForm" />
  }
</div>
