<ignt-dialog-header>
  {{ 'whitelabelManagement.integrations.apiKeys.createModal.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <app-whitelabel-integrations-create-integration-key-form
    [modalData]="createIntegrationKeyModalData"
    (cancelClick)="onFormCancel()"
    (submitSuccess)="onFormSubmitSuccess($event)"
  />
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <button igntButton sentiment="secondary" type="button" (click)="onCancel()">
    {{ 'whitelabelManagement.integrations.createModal.cancel' | translate }}
  </button>
  <button igntButton sentiment="primary" type="button" [disabled]="submitting()" (click)="onSubmit()">
    {{ 'whitelabelManagement.integrations.apiKeys.createModal.submit' | translate }}
  </button>
</ignt-dialog-footer>
