<div class="whitelabel-integrations-application-service-details">
  <div class="whitelabel-integrations-application-service-details__container">
    <app-whitelabel-integrations-summary-strip
      [channelId]="summary().channelId"
      [host]="summary().host"
      [languages]="summary().languages"
      [schema]="summary().schema"
    />
    <app-whitelabel-integrations-service-settings-tile
      [applicationService]="service()"
      [isReadOnly]="isReadOnly()"
      (editServiceSettings)="editServiceSettings.emit()"
      (enableOAuth)="enableOAuth.emit()"
      (rotateOauthCredentials)="rotateOauthCredentials.emit()"
    />
    <app-whitelabel-integrations-integration-keys-tile
      [isReadOnly]="isReadOnly()"
      [clearDeletingKeyToken]="clearDeletingIntegrationKeyToken()"
      [defaultKeyValidationStrategy]="service().keyValidationStrategy === 'signed' ? 'signed' : 'raw'"
      [integrationServiceId]="service().id"
      [listIntegrationServiceKeysPage]="listIntegrationServiceKeysPage()"
      [refreshToken]="integrationKeysRefreshToken()"
      (addIntegrationKey)="addIntegrationKey.emit()"
      (deleteIntegrationKey)="deleteIntegrationKey.emit($event)"
    />
    <app-whitelabel-integrations-webhook-subscriptions-tile
      [isReadOnly]="isReadOnly()"
      [clearEditingSubscriptionToken]="clearEditingWebhookSubscriptionToken()"
      [integrationServiceId]="service().id"
      [listWebhookSubscriptionsForApplicationService]="listWebhookSubscriptionsForApplicationService()"
      [refreshToken]="webhookSubscriptionsRefreshToken()"
      [topics]="webhookTopics()"
      (createWebhookSubscription)="createWebhookSubscription.emit()"
      (editWebhookSubscription)="editWebhookSubscription.emit($event)"
    />
    <app-whitelabel-integrations-webhook-deliveries-tile
      [integrationServiceId]="service().id"
      [listWebhookOutbox]="listWebhookOutbox()"
      [topics]="webhookTopics()"
    />
  </div>
</div>
