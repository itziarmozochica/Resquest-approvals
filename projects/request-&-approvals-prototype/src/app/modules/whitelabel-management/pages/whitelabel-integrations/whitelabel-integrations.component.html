@if (page.summary(); as s) {
  <div class="whitelabel-integrations">
    @if (page.selectedApplicationService(); as svc) {
      <app-go-back [goBackTitle]="integrationsListHeading(s)" [navigate]="false" [urlGoBack]="''" (goBackEvent)="asdGoBackOnClick()" />
      <app-page-title [title]="svc.name | uppercase" class="new-design"></app-page-title>
    } @else {
      <app-go-back [goBackTitle]="'menu.whitelabel' | translate" [urlGoBack]="'/whitelabels'"></app-go-back>
      <app-page-title [title]="integrationsListHeading(s)" class="new-design"></app-page-title>
    }
    <div class="whitelabel-integrations__container">
      @if (page.selectedApplicationService(); as svc) {
        <app-whitelabel-integrations-application-service-details
          [isReadOnly]="isReadOnly"
          [clearDeletingIntegrationKeyToken]="page.clearDeletingIntegrationKeyNonce()"
          [clearEditingWebhookSubscriptionToken]="page.clearEditingWebhookSubscriptionNonce()"
          [integrationKeysRefreshToken]="page.integrationKeysRefreshNonce()"
          [listIntegrationServiceKeysPage]="listIntegrationServiceKeysPageFn"
          [listWebhookOutbox]="listWebhookOutboxFn"
          [listWebhookSubscriptionsForApplicationService]="listWebhookSubscriptionsForApplicationServiceFn"
          [service]="svc"
          [summary]="s"
          [webhookSubscriptionsRefreshToken]="page.webhookSubscriptionsRefreshNonce()"
          [webhookTopics]="page.webhookTopics()"
          (addIntegrationKey)="integrationKeyAddOnClick()"
          (createWebhookSubscription)="webhookSubscriptionCreateOnClick()"
          (deleteIntegrationKey)="integrationKeyDeleteOnClick($event)"
          (editServiceSettings)="serviceSettingsEditOnClick()"
          (editWebhookSubscription)="webhookSubscriptionEditOnClick($event)"
          (enableOAuth)="serviceSettingsEnableOAuthOnClick()"
          (rotateOauthCredentials)="serviceSettingsRotateOauthOnClick()"
        />
      } @else {
        <app-whitelabel-integrations-select-application-service
          [isReadOnly]="isReadOnly"
          [applicationServices]="page.applicationServices()"
          [hasApplicationServices]="page.hasApplicationServices()"
          [isApplicationIdMissing]="page.isApplicationIdMissing()"
          [isApplicationServicesEmpty]="page.isApplicationServicesEmpty()"
          [summary]="s"
          [unassigningServiceId]="page.unassigningApplicationServiceId()"
          (assignExistingApplicationService)="selectAssignExistingOnClick()"
          (createApplicationService)="selectCreateApplicationServiceOnClick()"
          (openApplicationService)="selectOpenApplicationServiceOnClick($event)"
          (unassignApplicationService)="selectUnassignApplicationServiceOnClick($event)"
        />
      }
    </div>
  </div>
}
