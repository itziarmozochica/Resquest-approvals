<p class="whitelabel-integrations-delete-api-key-confirm-form__message">
  {{ message() }}
</p>
<div class="whitelabel-integrations-delete-api-key-confirm-form__actions">
  <button type="button" igntButton sentiment="secondary" [disabled]="isConfirming()" (click)="onCancel()">
    {{ cancelLabel() }}
  </button>
  <button type="button" igntButton sentiment="primary" variant="danger" [loading]="isConfirming()" (click)="onAccept()">
    {{ acceptLabel() }}
  </button>
</div>
