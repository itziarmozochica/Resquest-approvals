<div class="synthetic-checks-filters">
  <!--
    Focus is what tells the box apart from the page: while it has focus the user is typing and a
    term pushed in is not allowed to overwrite them, and losing it emits whatever they left behind
    without waiting out the debounce, so no other control can act on a filter the page has not
    been told about yet.
  -->
  <div class="synthetic-checks-filters__search" (focusin)="onSearchFieldFocusIn()" (focusout)="onSearchFieldFocusOut()">
    <!--
      No `label`: the floating label is what made the field taller than the dropdown beside it, and
      the placeholder already says what the box is for. `label` is a required input, so it is passed
      empty rather than dropped, and `placeholderAsEmptyValue` is what keeps the placeholder on screen
      at rest — without a label the field fades it out until focus, leaving an unlabelled empty box.
      The label itself moves off-screen rather than away,
      because a placeholder is not a reliable accessible name — it is not exposed as one by every
      screen reader, and it stops being read at all the moment someone types.
    -->
    <label class="visually-hidden" [for]="searchFieldId">{{ i18n + '.searchLabel' | translate }}</label>
    <ignt-input-field
      class="synthetic-checks-filters__search-field"
      data-testid="synthetic-checks-search"
      label=""
      [formControl]="searchControl"
      [id]="searchFieldId"
      [leadIcon]="searchLeadIcon"
      [maxlength]="searchMaxLength"
      [placeholder]="i18n + '.searchPlaceholder' | translate"
      [placeholderAsEmptyValue]="true"
      [type]="searchInputType"
    />
  </div>

  <div class="synthetic-checks-filters__types">
    <!-- Names itself: the row shows no label since the pills it replaces lost their "Type" header. -->
    <ng-select
      class="synthetic-checks-filters__type-select"
      [ariaLabel]="i18n + '.typeLabel' | translate"
      [clearable]="false"
      [formControl]="typeControl"
      [items]="typeOptions"
      [searchable]="false"
    >
      <ng-template let-item="item" ng-label-tmp>{{ labelKeyFor(item) | translate }}</ng-template>
      <ng-template let-item="item" ng-option-tmp>{{ labelKeyFor(item) | translate }}</ng-template>
    </ng-select>
  </div>
</div>
