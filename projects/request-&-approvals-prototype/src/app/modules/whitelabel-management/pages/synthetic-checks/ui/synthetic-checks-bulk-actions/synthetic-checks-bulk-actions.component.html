<div
  class="synthetic-checks-bulk-actions"
  role="region"
  [attr.aria-label]="'whitelabelManagement.syntheticChecks.bulk.regionLabel' | translate"
>
  <span class="synthetic-checks-bulk-actions__count font-small-bold" data-testid="synthetic-checks-bulk-count" aria-live="polite">
    {{ 'whitelabelManagement.syntheticChecks.bulk.selected' | translate: { count: selectedCount() } }}
  </span>

  <div class="synthetic-checks-bulk-actions__buttons">
    <ignt-button
      variant="secondary"
      sentiment="neutral"
      size="small"
      data-testid="synthetic-checks-bulk-pause"
      [disabled]="busy()"
      [label]="'whitelabelManagement.syntheticChecks.bulk.pause' | translate"
      (click)="pauseClick.emit()"
    ></ignt-button>
    <ignt-button
      variant="secondary"
      sentiment="neutral"
      size="small"
      data-testid="synthetic-checks-bulk-resume"
      [disabled]="busy() || !resumable()"
      [label]="'whitelabelManagement.syntheticChecks.bulk.resume' | translate"
      (click)="resumeClick.emit()"
    ></ignt-button>
    <ignt-button
      variant="secondary"
      sentiment="danger"
      size="small"
      data-testid="synthetic-checks-bulk-delete"
      [disabled]="busy()"
      [label]="'whitelabelManagement.syntheticChecks.bulk.delete' | translate"
      (click)="deleteClick.emit()"
    ></ignt-button>
    <ignt-button
      variant="tertiary"
      sentiment="neutral"
      size="small"
      data-testid="synthetic-checks-bulk-clear"
      [disabled]="busy()"
      [label]="'whitelabelManagement.syntheticChecks.bulk.clear' | translate"
      (click)="clearClick.emit()"
    ></ignt-button>
  </div>
</div>
