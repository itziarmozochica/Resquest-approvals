@if (clickable()) {
  <button
    type="button"
    class="synthetic-checks-stat-card synthetic-checks-stat-card--clickable"
    [class.synthetic-checks-stat-card--selected]="selected()"
    (click)="onClick()"
  >
    <span class="synthetic-checks-stat-card__label">{{ label() }}</span>
    <span class="synthetic-checks-stat-card__value" [class.synthetic-checks-stat-card__value--danger]="highlighted()">
      {{ value() }}
    </span>
  </button>
} @else {
  <ignt-wrapper-card class="synthetic-checks-stat-card">
    <span class="synthetic-checks-stat-card__label">{{ label() }}</span>
    <span class="synthetic-checks-stat-card__value" [class.synthetic-checks-stat-card__value--danger]="highlighted()">
      {{ value() }}
    </span>
  </ignt-wrapper-card>
}
