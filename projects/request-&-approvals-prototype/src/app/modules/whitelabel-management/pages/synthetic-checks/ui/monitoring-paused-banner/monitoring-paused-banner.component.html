@if (change(); as change) {
  <ignt-alert
    data-testid="monitoring-paused-banner"
    sentiment="warning"
    [description]="
      'whitelabelManagement.syntheticChecks.monitoringPausedBanner.pausedSince'
        | translate: { actorEmail: change.actorEmail, occurredAt: change.occurredAt | date: 'medium' }
    "
  />
} @else {
  <ignt-alert
    data-testid="monitoring-paused-banner"
    sentiment="warning"
    [description]="'whitelabelManagement.syntheticChecks.monitoringPausedBanner.paused' | translate"
  />
}
