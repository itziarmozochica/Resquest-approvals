<span class="synthetic-service-status-badge">
  <span
    class="synthetic-service-status-badge__dot"
    [class.synthetic-service-status-badge__dot--online]="status() === 'online'"
    [class.synthetic-service-status-badge__dot--offline]="status() === 'offline'"
    [class.synthetic-service-status-badge__dot--checking]="status() === 'checking'"
  ></span>
  <span class="synthetic-service-status-badge__status">
    {{ statusLabelKey() | translate }}
  </span>
</span>
