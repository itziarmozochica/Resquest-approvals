<ignt-dialog-header data-testid="type-selector-modal-title">
  {{ i18n + '.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <div class="check-type-selector-modal">
    <div class="check-type-selector-modal__cards">
      <button
        type="button"
        class="check-type-selector-modal__card check-type-selector-modal__card--uptime"
        [class.check-type-selector-modal__card--highlighted]="highlightedType() === 'uptime'"
        data-testid="type-card-uptime"
        (click)="onSelectUptime()"
      >
        <ignt-icon class="check-type-selector-modal__card-icon" name="heart" [variant]="checkTypeIconVariant" size="h3"></ignt-icon>
        <span class="check-type-selector-modal__card-label">{{ checkTypesI18n + '.uptime' | translate }}</span>
        <span class="check-type-selector-modal__card-description">{{ checkTypesI18n + '.uptimeDescription' | translate }}</span>
      </button>

      <button
        type="button"
        class="check-type-selector-modal__card check-type-selector-modal__card--transactional"
        [class.check-type-selector-modal__card--highlighted]="highlightedType() === 'transactional'"
        data-testid="type-card-transaction"
        (click)="onSelectTransactional()"
      >
        <ignt-icon class="check-type-selector-modal__card-icon" name="repeat" [variant]="checkTypeIconVariant" size="h3"></ignt-icon>
        <span class="check-type-selector-modal__card-label">{{ checkTypesI18n + '.transaction' | translate }}</span>
        <span class="check-type-selector-modal__card-description">{{ checkTypesI18n + '.transactionDescription' | translate }}</span>
      </button>
    </div>
  </div>
</ignt-dialog-content>
