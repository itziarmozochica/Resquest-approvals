<ignt-dialog-header data-testid="modal-title">
  {{ 'whitelabelManagement.syntheticChecks.bulkDeleteConfirm.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p data-testid="modal-message">
    {{ 'whitelabelManagement.syntheticChecks.bulkDeleteConfirm.message' | translate: { count: data.count } }}
  </p>

  @if (data.planBoundCount > 0) {
    <ignt-alert
      class="bulk-delete-confirm-dialog__plan-bound"
      data-testid="bulk-delete-plan-bound-warning"
      sentiment="warning"
      [description]="'whitelabelManagement.syntheticChecks.bulkDeleteConfirm.planBoundWarning' | translate: { count: data.planBoundCount }"
    ></ignt-alert>
  }
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    variant="secondary"
    sentiment="neutral"
    size="large"
    data-testid="modal-cancel-button"
    [label]="'whitelabelManagement.syntheticChecks.shared.cancel' | translate"
    (click)="onCancel()"
  ></ignt-button>
  <ignt-button
    variant="primary"
    sentiment="danger"
    size="large"
    data-testid="modal-accept-button"
    [label]="'whitelabelManagement.syntheticChecks.bulkDeleteConfirm.confirm' | translate"
    (click)="onConfirm()"
  ></ignt-button>
</ignt-dialog-footer>
