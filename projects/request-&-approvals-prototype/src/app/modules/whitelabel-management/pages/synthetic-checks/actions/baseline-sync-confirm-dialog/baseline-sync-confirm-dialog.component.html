<ignt-dialog-header data-testid="modal-title">
  {{ 'whitelabelManagement.syntheticChecks.baselineSyncConfirm.title' | translate }}
</ignt-dialog-header>

<ignt-dialog-content>
  <p data-testid="modal-message">
    {{ 'whitelabelManagement.syntheticChecks.baselineSyncConfirm.message' | translate }}
  </p>

  <div class="baseline-sync-confirm-dialog__full-reset">
    <ignt-checkbox
      dataTestId="baseline-sync-full-reset-checkbox"
      [checked]="fullReset()"
      [label]="'whitelabelManagement.syntheticChecks.baselineSyncConfirm.fullResetLabel' | translate"
      (change)="onFullResetChange($event)"
    ></ignt-checkbox>

    @if (fullReset()) {
      <p class="baseline-sync-confirm-dialog__warning" data-testid="baseline-sync-full-reset-warning">
        {{ 'whitelabelManagement.syntheticChecks.baselineSyncConfirm.fullResetWarning' | translate }}
      </p>
    }
  </div>
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    variant="secondary"
    sentiment="neutral"
    size="large"
    data-testid="modal-cancel-button"
    [label]="'whitelabelManagement.syntheticChecks.shared.cancel' | translate"
    (click)="onCancel()"
  ></ignt-button>
  <ignt-button
    variant="primary"
    size="large"
    data-testid="modal-accept-button"
    [sentiment]="fullReset() ? 'danger' : 'brand'"
    [label]="'whitelabelManagement.syntheticChecks.baselineSyncConfirm.confirm' | translate"
    (click)="onConfirm()"
  ></ignt-button>
</ignt-dialog-footer>
