<div class="synthetic-checks-actions">
  @if (showMonitoringSettings()) {
    <ignt-button
      data-testid="monitoring-settings-button"
      variant="tertiary"
      [label]="'whitelabelManagement.syntheticChecks.header.monitoringSettings' | translate"
      [disabled]="locked()"
      (click)="monitoringSettingsClick.emit()"
    />
  }
  <ignt-button
    data-testid="create-baseline-button"
    variant="tertiary"
    [label]="'whitelabelManagement.syntheticChecks.header.createBaseline' | translate"
    [disabled]="loading() || baselineSyncing() || locked()"
    [loading]="baselineSyncing()"
    (click)="createBaselineClick.emit()"
  />
  <ignt-button
    data-testid="create-check-button"
    variant="secondary"
    [label]="'whitelabelManagement.syntheticChecks.header.addCheck' | translate"
    [disabled]="loading() || locked()"
    [loading]="loading()"
    (click)="createClick.emit()"
  />
</div>
