<div class="static-html-code-editor">
  <div class="static-html-code-editor__toolbar">
    <span class="static-html-code-editor__stats" data-testid="static-html-document-stats">
      {{ statsKey() | translate: { lines: documentLines(), size: documentSize() } }}
    </span>

    <div class="static-html-code-editor__actions">
      <ignt-button
        sentiment="neutral"
        size="small"
        variant="secondary"
        data-testid="static-html-format"
        [disabled]="!canFormat()"
        [label]="'staticHtml.editor.format' | translate"
        [loading]="isFormatting()"
        (click)="format()"
      />
      <ignt-button
        sentiment="neutral"
        size="small"
        variant="secondary"
        data-testid="static-html-find"
        [disabled]="!isReady()"
        [label]="'staticHtml.editor.find' | translate"
        (click)="find()"
      />
    </div>
  </div>

  @if (hasFormatError()) {
    <ignt-alert sentiment="warning" data-testid="static-html-format-error" [description]="'staticHtml.editor.formatError' | translate" />
  }

  <div #editor class="static-html-code-editor__surface" data-testid="static-html-code-editor"></div>
</div>
