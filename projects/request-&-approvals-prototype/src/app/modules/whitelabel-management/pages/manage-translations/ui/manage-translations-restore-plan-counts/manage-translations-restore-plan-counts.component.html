<ul class="manage-translations-restore-plan-counts" data-testid="manage-translations-relation-restore-counts">
  @for (count of counts(); track count.labelKey) {
    <li class="manage-translations-restore-plan-counts__count" data-testid="manage-translations-relation-restore-count">
      <strong class="manage-translations-restore-plan-counts__value">{{ count.count }}</strong>
      <span class="manage-translations-restore-plan-counts__label">{{ count.labelKey | translate: { count: count.count } }}</span>
    </li>
  }
</ul>
