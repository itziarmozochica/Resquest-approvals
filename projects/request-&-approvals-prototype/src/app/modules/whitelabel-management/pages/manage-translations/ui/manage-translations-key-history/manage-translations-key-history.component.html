<div class="manage-translations-key-history" data-testid="manage-translations-key-history">
  <div class="manage-translations-key-history__scope">
    <ignt-typeahead
      [fieldLabel]="'manageTranslations.history.keyHistory.scope' | translate"
      [options]="scopeOptions()"
      [selectedOption]="selectedScopeOption()"
      [editable]="false"
      (selected)="onScopeSelected($event)"
      data-testid="manage-translations-key-history-scope"
    ></ignt-typeahead>
  </div>

  <app-audit-item-history
    class="manage-translations-key-history__list"
    [context]="context()"
    [revision]="revision()"
  ></app-audit-item-history>
</div>
