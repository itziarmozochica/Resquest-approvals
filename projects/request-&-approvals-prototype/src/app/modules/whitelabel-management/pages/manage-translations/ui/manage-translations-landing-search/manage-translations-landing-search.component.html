<div class="landing-search" role="search">
  <ignt-input-field
    class="landing-search__field"
    [label]="'manageTranslations.landing.search.label' | translate"
    [placeholder]="'manageTranslations.landing.search.placeholder' | translate"
    [formControl]="searchControl"
    [maxlength]="maxLength"
    data-testid="manage-translations-landing-search"
  />
  <div class="landing-search__meta" aria-live="polite">
    @if (!isCountHidden()) {
      <span data-testid="manage-translations-landing-result-count">
        {{ countKey() | translate: { count: resultCount(), total: subprojectCount() } }}
      </span>
    }
    @if (hasSearch()) {
      <ignt-button
        variant="tertiary"
        size="small"
        [label]="'manageTranslations.landing.search.clear' | translate"
        data-testid="manage-translations-landing-clear-search"
        (click)="onClear()"
      />
    }
  </div>
</div>
