<ignt-dialog-header>{{ 'manageTranslations.manageLanguages.title' | translate }}</ignt-dialog-header>

<ignt-dialog-content>
  <app-manage-translations-manage-languages-panel #panel [relationId]="relationId" />
</ignt-dialog-content>

<ignt-dialog-footer [hideCancelButton]="true">
  <ignt-button
    data-testid="manage-languages-close"
    [disabled]="panel.busy()"
    [label]="'manageTranslations.manageLanguages.close' | translate"
    (click)="onClose()"
  />
</ignt-dialog-footer>
