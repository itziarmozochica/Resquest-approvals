<div class="manage-languages-panel">
  @if (addLaterHint(); as hint) {
    <p class="manage-languages-panel__add-later-hint" data-testid="manage-languages-add-later-hint">{{ hint }}</p>
  }

  <app-language-selection
    [addError]="addError()"
    [addInProgress]="addInProgress()"
    [languages]="currentLanguages()"
    [removeError]="removeError()"
    [removingCode]="removingTag()"
    (languageAdded)="onLanguageAdded($event)"
    (languageRemoved)="onRemove($event)"
  />
</div>
