<div class="manage-translations-editor-header" data-testid="manage-translations-editor-header">
  <div class="manage-translations-editor-header__group">
    <div class="manage-translations-editor-header__field">
      <ignt-typeahead
        [fieldLabel]="'manageTranslations.editor.header.project' | translate"
        [options]="projectOptions()"
        [selectedOption]="selectedProjectOption()"
        [editable]="true"
        (selected)="onProjectOptionSelected($event)"
        data-testid="manage-translations-editor-project-select"
      ></ignt-typeahead>
    </div>

    <div class="manage-translations-editor-header__field">
      <ignt-typeahead
        [fieldLabel]="'manageTranslations.editor.header.language' | translate"
        [options]="languageOptions()"
        [selectedOption]="selectedLanguageOption()"
        [editable]="false"
        (selected)="onLanguageOptionSelected($event)"
        data-testid="manage-translations-editor-language-select"
      ></ignt-typeahead>
    </div>
  </div>

  @if (canManageTranslations()) {
    <div class="manage-translations-editor-header__actions">
      <ignt-button
        variant="secondary"
        [label]="'manageTranslations.history.open' | translate"
        data-testid="manage-translations-editor-open-history"
        (click)="onOpenHistory()"
      />
      <ignt-button
        variant="primary"
        [label]="'manageTranslations.editor.header.addKey' | translate"
        [leadingIcon]="addKeyIcon"
        (click)="onAddKey()"
        data-testid="manage-translations-editor-add-key"
      />
    </div>
  }
</div>
