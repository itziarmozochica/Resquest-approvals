<div class="manage-translations-content">
  @if (error()) {
    <div class="manage-translations-content__error" role="alert" data-testid="manage-translations-error">
      <p class="manage-translations-content__error-message">{{ errorMessageKey(error()!) | translate }}</p>
      @if (errorDetail()) {
        <p class="manage-translations-content__error-detail" data-testid="manage-translations-error-detail">
          <span class="manage-translations-content__error-detail-label">{{ 'manageTranslations.error.detailLabel' | translate }}</span>
          {{ errorDetail() }}
        </p>
      }
    </div>
  }
  <app-manage-translations-landing
    [canManageTranslations]="canManageStructure()"
    [deletingRelationIds]="deletingRelationIds()"
    [isContextsDialogAvailable]="isContextsDialogAvailable()"
    [reloadKey]="hierarchy()"
    (addSubproject)="onAddSubproject()"
    (deleteSubproject)="onDeleteSubproject($event)"
    (manageContexts)="onManageContexts($event)"
    (manageLanguages)="onManageLanguages($event)"
    (openHistory)="onOpenHistory($event)"
    (restoreToMoment)="onRestoreToMoment($event)"
    (selectLocale)="onSelectLocale($event)"
  />
</div>
