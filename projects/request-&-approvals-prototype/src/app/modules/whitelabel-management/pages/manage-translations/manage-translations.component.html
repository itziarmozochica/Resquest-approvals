@if (editorContext()) {
  <app-go-back [goBackTitle]="'manageTranslations.landingTitle' | translate" [urlGoBack]="'/whitelabels/translations'"></app-go-back>
} @else if (canManageWhitelabels) {
  <app-go-back
    [goBackTitle]="'listWhitelabels.generalSettings.label' | translate"
    [urlGoBack]="'/whitelabels/general-settings'"
  ></app-go-back>
}
<app-page-title
  [title]="(editorContext() ? 'listWhitelabels.generalSettings.manageTranslations' : 'manageTranslations.landingTitle') | translate"
  class="new-design"
></app-page-title>

<div class="manage-translations-container">
  @if (editorContext(); as ctx) {
    @if (hierarchy(); as view) {
      <app-manage-translations-editor
        [hierarchy]="view"
        [editorContext]="ctx"
        [canManageTranslations]="canManageTranslations"
        [activeRow]="activeRow()"
        [keys]="keys()"
        [keysLoading]="keysLoading()"
        [keysError]="keysError()"
        [selectedKey]="selectedKey()"
        [selectedKeyId]="selectedKeyId()"
        [keyDetailsSaveError]="keyDetailsSaveError()"
        [keyDetailsSaving]="keyDetailsSaving()"
        [keyPathConflictError]="keyPathConflictError()"
        [keyPathConflictSubmittedValue]="keyPathConflictSubmittedValue()"
        [saving]="saving()"
        [saveError]="saveError()"
        [clearing]="clearing()"
        [clearError]="clearError()"
        [otherTranslationsRows]="otherTranslationsRows()"
        [otherTranslationsLoading]="otherTranslationsLoading()"
        [otherTranslationsFetchErrors]="otherTranslationsFetchErrors()"
        [cellLastModified]="cellLastModified()"
        [keyHistoryContext]="keyHistoryContext()"
        [keyHistoryAllProjects]="keyHistoryAllProjects()"
        [keyHistoryRevision]="keyHistoryRevision()"
        [query]="keysQuery()"
        [text]="keysText()"
        [selectedStatuses]="keysStatuses()"
        [currentPage]="keysPageNumber()"
        [totalPages]="keysTotalPages()"
        [hasPrev]="keysHasPrev()"
        [hasNext]="keysHasNext()"
        (projectChange)="onProjectChange($event)"
        (languageChange)="onLanguageChange($event)"
        (queryChange)="onKeysQueryChange($event)"
        (textChange)="onKeysTextChange($event)"
        (statusesChange)="onKeysStatusesChange($event)"
        (pageChange)="onKeysPageChange($event)"
        (rowSelected)="onRowSelected($event)"
        (keyPathConflictCleared)="onClearKeyPathConflict()"
        (save)="onSave($event)"
        (clear)="onClear()"
        (saveKeyDetails)="onSaveKeyDetails($event)"
        (deleteKey)="onDeleteKey()"
        (addKey)="onAddKey()"
        (openHistory)="onOpenEditorHistory(ctx.relationId)"
        (keyHistoryAllProjectsChange)="onKeyHistoryAllProjectsChange($event)"
      ></app-manage-translations-editor>
    }
  } @else {
    <app-manage-translations-content
      [hierarchy]="hierarchy()"
      [canManageTranslations]="canManageTranslations"
      [error]="error()"
      [errorDetail]="errorDetail()"
      [deletingRelationIds]="deletingRelationIds()"
      (addSubproject)="onAddSubproject()"
      (deleteSubproject)="onDeleteSubproject($event)"
      (manageLanguages)="onManageLanguages($event)"
      (openHistory)="onOpenHistory($event)"
      (restoreToMoment)="onRestoreToMoment($event)"
      (selectLocale)="onSelectLocale($event)"
    ></app-manage-translations-content>
  }
</div>
