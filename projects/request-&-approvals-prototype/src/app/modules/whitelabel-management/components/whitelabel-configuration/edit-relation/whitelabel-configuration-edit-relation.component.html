<app-go-back
  [goBackTitle]="(whitelabel ? (whitelabel.name | uppercase) + ' ' : '') + ('menu.whitelabelConfig' | translate)"
  [urlGoBack]="whitelabel?.id ? '/whitelabels/configurations/' + whitelabel!.id : '/whitelabels'"
></app-go-back>
<app-page-title
  [title]="('whitelabelManagement.editWhitelabelRelation' | translate) + ' - ' + (whitelabelConfig?.config_name ?? '')"
  class="new-design"
></app-page-title>

<div class="whitelabel-configuration">
  <div class="whitelabel-configuration__container">
    <div class="whitelabel-configuration__form">
      <form [formGroup]="form">
        <div class="whitelabel-configuration__form-item">
          <div class="whitelabel-configuration__title-label">Path regex</div>
          <input class="whitelabel-configuration__title-input" type="pathRegex" formControlName="pathRegex" placeholder="Path Regex" />
          <div *ngIf="form.get('pathRegex')?.hasError('required') && form.get('pathRegex')?.touched" class="error">
            Path regex is required
          </div>
          <div *ngIf="form.get('pathRegex')?.hasError('invalidRegex') && form.get('pathRegex')?.touched" class="error">
            Invalid regular expression
          </div>
        </div>

        <div class="whitelabel-configuration__form-item">
          <div class="whitelabel-configuration__title-label">Path Regex name</div>
          <input class="whitelabel-configuration__title-input" type="text" formControlName="pathRegexName" placeholder="Regex Name" />
          <div *ngIf="form.get('pathRegexName')?.invalid && form.get('pathRegexName')?.touched" class="error">Regex Name is required</div>
        </div>

        <div class="whitelabel-configuration__form-item">
          <div class="whitelabel-configuration__title-label">Path Regex Description</div>
          <input
            class="whitelabel-configuration__title-input"
            type="text"
            formControlName="pathRegexDescription"
            placeholder="Regex Description"
          />
          <div *ngIf="form.get('pathRegexDescription')?.invalid && form.get('pathRegexDescription')?.touched" class="error">
            Regex Description is required
          </div>
        </div>

        <div class="whitelabel-configuration__form-item">
          <div class="whitelabel-configuration__title-label">Order</div>
          <input class="whitelabel-configuration__title-input" type="text" formControlName="order" placeholder="Order" />
          <div *ngIf="form.get('order')?.invalid && form.get('order')?.touched" class="error">order is required</div>

          <div class="whitelabel-configuration__title-info">
            <ignt-icon class="whitelabel-configuration__title-icon" name="info-circle" variant="regular"></ignt-icon>
            <span> Order to apply the config. Example: default, config1, config2 </span>
          </div>
        </div>

        <div class="whitelabel-configuration__footer">
          <button igntButton [disabled]="form.invalid" (click)="onSave()">
            {{ 'whitelabelConfiguration.save' | translate }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
