<app-go-back
  [goBackTitle]="'listWhitelabels.generalSettings.label' | translate"
  [urlGoBack]="'/whitelabels/general-settings'"
></app-go-back>
<app-page-title [title]="'whitelabelManagement.createNewWhitelabelConfig' | translate" class="new-design"></app-page-title>

<div class="whitelabel-configuration">
  <div class="whitelabel-configuration__container">
    <div class="whitelabel-configuration__form">
      <form [formGroup]="form">
        <div class="whitelabel-configuration__form-item">
          <div class="whitelabel-configuration__title-label">Whitelabels</div>
          <select class="whitelabel-configuration__title-input" formControlName="multitenant_whitelabel_id">
            <ng-container *ngIf="whiteLabels as whitelabelsResponse">
              <option value="" selected disabled hidden>Choose whitelabel</option>
              <option *ngFor="let whitelabel of whitelabelsResponse" [value]="whitelabel.id">{{ whitelabel.name }}</option>
            </ng-container>
          </select>

          <div class="whitelabel-configuration__title-info">
            <ignt-icon aria-hidden="true" class="whitelabel-configuration__title-icon" name="info-circle" variant="regular" />
            <span>Important: One of the whitelabel that will be associated to this configuration in a next step</span>
          </div>
          <div *ngIf="form.get('multitenant_whitelabel_id')?.invalid && form.get('multitenant_whitelabel_id')?.touched" class="error">
            Whitelabel is required
          </div>
        </div>

        <div class="whitelabel-configuration__form-item">
          <div class="whitelabel-configuration__title-label">Config name</div>
          <input class="whitelabel-configuration__title-input" type="text" formControlName="name" placeholder="Name" />
          <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="error">Name is required</div>
        </div>

        <div class="whitelabel-configuration__footer">
          <ignt-button
            htmlType="submit"
            [disabled]="form.invalid"
            [label]="'whitelabelConfiguration.save' | translate"
            (click)="onSave()"
          />
        </div>
      </form>
    </div>
  </div>
</div>
