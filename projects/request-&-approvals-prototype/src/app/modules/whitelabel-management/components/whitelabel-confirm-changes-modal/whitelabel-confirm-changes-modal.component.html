<div class="whitelabel-configuration-confirm-modal">
  <div class="whitelabel-configuration-confirm-modal__header">
    <h2 class="whitelabel-configuration-confirm-modal__title">{{ 'whitelabelConfiguration.verifyChanges' | translate }}</h2>
  </div>

  <div class="whitelabel-configuration-confirm-modal__content">
    <inline-diff #diffContainer [oldText]="data.oldContent" [newText]="data.newContent" [lineContextSize]="2" />
  </div>

  <div class="whitelabel-configuration-confirm-modal__actions">
    <button igntButton sentiment="tertiary" (click)="onCancel()">
      {{ 'common.cancel' | translate }}
    </button>
    <button igntButton (click)="onConfirm()" [disabled]="noChangesDetected()">
      {{ 'whitelabelConfiguration.save' | translate }}
    </button>
  </div>
</div>
