<app-go-back [goBackTitle]="'menu.whitelabel' | translate" [urlGoBack]="'/whitelabels'"></app-go-back>
<app-page-title
  [title]="(whitelabel ? (whitelabel.name | uppercase) + ' ' : '') + ('menu.whitelabelStyles' | translate)"
  class="new-design"
></app-page-title>

<div class="whitelabel-styles">
  <div class="whitelabel-styles__container">
    <div class="whitelabel-styles__info whitelabel-styles__info-items">
      <div class="whitelabel-styles__info-item">
        <div class="whitelabel-styles__label">Channel</div>
        <div class="whitelabel-styles__value">{{ whitelabel?.channelId }}</div>
      </div>
      <div class="whitelabel-styles__info-item">
        <div class="whitelabel-styles__label">Schema</div>
        <div class="whitelabel-styles__value">{{ whitelabel?.schema }}</div>
      </div>

      <div class="whitelabel-styles__info-item">
        <div class="whitelabel-styles__label">Host</div>
        <div class="whitelabel-styles__value">
          <div>{{ whitelabel?.host }}</div>
        </div>
      </div>

      <div class="whitelabel-styles__info-item">
        <div class="whitelabel-styles__label">Languages</div>
        <div class="whitelabel-styles__value">
          <ng-container *ngFor="let language of whitelabel?.languages">
            <span>{{ language }}</span>
          </ng-container>
        </div>
      </div>
    </div>

    <div class="whitelabel-styles__info" *ngIf="styles && styles.length > 0; else noStyles">
      <table class="whitelabel-styles__table">
        <thead class="whitelabel-styles__table-header">
          <tr>
            <th class="whitelabel-styles__table-cell">Order</th>
            <th class="whitelabel-styles__table-cell">Styles Name</th>
            <th class="whitelabel-styles__table-cell">Relation Name</th>
            <th class="whitelabel-styles__table-cell whitelabel-styles__table-cell--actions"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let style of styles">
            <td class="whitelabel-styles__table-cell">{{ style.order }}</td>
            <td class="whitelabel-styles__table-cell">{{ style.style_name }}</td>
            <td class="whitelabel-styles__table-cell">{{ style.path_regex_name }}</td>
            <td class="whitelabel-styles__table-cell whitelabel-styles__table-cell--actions">
              <div class="whitelabel-styles__actions">
                <ignt-button
                  data-testid="wl-styles-edit-styles"
                  [label]="
                    (isReadOnly ? 'whitelabelManagement.viewWhitelabelStyles' : 'whitelabelManagement.editWhitelabelStyles') | translate
                  "
                  (click)="editStyles(style.style_id)"
                />
                @if (!isReadOnly) {
                  <ignt-button
                    data-testid="wl-styles-update-relation"
                    [label]="'whitelabelManagement.editWhitelabelRelation' | translate"
                    (click)="editRelationStyles(style.id)"
                  />
                  <ignt-button
                    data-testid="wl-styles-delete-relation"
                    [label]="'whitelabelManagement.deleteWhitelabelRelation' | translate"
                    (click)="deleteRelationStyles(style.id)"
                  />
                }
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <ng-template #noStyles>
      <div class="whitelabel-styles__info">No styles added yet</div>
    </ng-template>
    @if (!isReadOnly) {
      <div class="whitelabel-styles__info">
        <div class="whitelabel-styles__create-buttons">
          <ignt-button
            data-testid="wl-styles-create-styles-and-relation"
            [label]="'whitelabelManagement.createNewWhitelabelStylesAndRelation' | translate"
            (click)="addStyles()"
          />
          <ignt-button
            data-testid="wl-styles-create-relation"
            [label]="'whitelabelManagement.createNewWhitelabelRelation' | translate"
            (click)="addNewRelationStyles()"
          />
        </div>
      </div>
    }
  </div>
</div>
