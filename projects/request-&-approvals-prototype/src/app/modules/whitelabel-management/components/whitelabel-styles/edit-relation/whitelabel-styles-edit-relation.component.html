<app-go-back
  [goBackTitle]="(whitelabel ? (whitelabel.name | uppercase) + ' ' : '') + ('menu.whitelabelStyles' | translate)"
  [urlGoBack]="whitelabel?.id ? '/whitelabels/styles/' + whitelabel!.id : '/whitelabels'"
></app-go-back>
<app-page-title
  [title]="
    ('whitelabelManagement.editWhitelabelRelation' | translate) + (stylesRelation?.style_name ? ' - ' + stylesRelation.style_name : '')
  "
  class="new-design"
></app-page-title>

<div class="whitelabel-styles" *ngIf="stylesRelation">
  <div class="whitelabel-styles__container">
    <div class="whitelabel-styles__form">
      <form [formGroup]="form">
        <div class="whitelabel-styles__form-item">
          <div class="whitelabel-styles__title-label">Path regex</div>
          <input class="whitelabel-styles__title-input" type="text" formControlName="pathRegex" placeholder="Path Regex" />
          <div *ngIf="form.get('pathRegex')?.hasError('required') && form.get('pathRegex')?.touched" class="error">
            Path regex is required
          </div>
          <div *ngIf="form.get('pathRegex')?.hasError('invalidRegex') && form.get('pathRegex')?.touched" class="error">
            Invalid regular expression
          </div>
        </div>

        <div class="whitelabel-styles__form-item">
          <div class="whitelabel-styles__title-label">Path Regex name</div>
          <input class="whitelabel-styles__title-input" type="text" formControlName="pathRegexName" placeholder="Regex Name" />
          <div *ngIf="form.get('pathRegexName')?.invalid && form.get('pathRegexName')?.touched" class="error">Regex Name is required</div>
        </div>

        <div class="whitelabel-styles__form-item">
          <div class="whitelabel-styles__title-label">Path Regex Description</div>
          <input
            class="whitelabel-styles__title-input"
            type="text"
            formControlName="pathRegexDescription"
            placeholder="Regex Description"
          />
          <div *ngIf="form.get('pathRegexDescription')?.invalid && form.get('pathRegexDescription')?.touched" class="error">
            Regex Description is required
          </div>
        </div>

        <div class="whitelabel-styles__form-item">
          <div class="whitelabel-styles__title-label">Order</div>
          <input class="whitelabel-styles__title-input" type="text" formControlName="order" placeholder="Order" />
          <div *ngIf="form.get('order')?.invalid && form.get('order')?.touched" class="error">Order is required</div>

          <div class="whitelabel-styles__title-info">
            <ignt-icon class="whitelabel-styles__title-icon" name="info-circle" variant="regular"></ignt-icon>
            <span>Order to apply the styles. Example: default, styles1, styles2</span>
          </div>
        </div>

        <div class="whitelabel-styles__footer">
          <button igntButton [disabled]="form.invalid" (click)="onSave()">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
