<app-go-back
  [goBackTitle]="'listWhitelabels.generalSettings.label' | translate"
  [urlGoBack]="'/whitelabels/general-settings'"
></app-go-back>
<app-page-title [title]="'Create new Styles'" class="new-design"></app-page-title>

<div class="whitelabel-styles">
  <div class="whitelabel-styles__container">
    <div class="whitelabel-styles__form">
      <form [formGroup]="form">
        <div class="whitelabel-styles__form-item">
          <div class="whitelabel-styles__title-label">Whitelabels</div>
          <select class="whitelabel-styles__title-input" formControlName="multitenant_whitelabel_id">
            <ng-container *ngIf="whiteLabels as whitelabelsResponse">
              <option value="" selected disabled hidden>Choose whitelabel</option>
              <option *ngFor="let whitelabel of whitelabelsResponse" [value]="whitelabel.id">{{ whitelabel.name }}</option>
            </ng-container>
          </select>

          <div class="whitelabel-styles__title-info">
            <ignt-icon class="whitelabel-styles__title-icon" name="info-circle" variant="regular"></ignt-icon>
            <span>Important: One of the whitelabel that will be associated to this styles in a next step</span>
          </div>
          <div *ngIf="form.get('multitenant_whitelabel_id')?.invalid && form.get('multitenant_whitelabel_id')?.touched" class="error">
            Whitelabel is required
          </div>
        </div>

        <div class="whitelabel-styles__form-item">
          <div class="whitelabel-styles__title-label">Styles name</div>
          <input class="whitelabel-styles__title-input" type="text" formControlName="name" placeholder="Name" />
          <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="error">Name is required</div>
        </div>

        <div class="whitelabel-styles__footer">
          <button igntButton [disabled]="form.invalid" (click)="onSave()">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
