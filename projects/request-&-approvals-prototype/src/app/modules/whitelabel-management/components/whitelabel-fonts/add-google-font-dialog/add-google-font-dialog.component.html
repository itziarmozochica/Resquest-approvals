<ignt-dialog-header>{{ 'whitelabelFontsAddGoogle.title' | translate }}</ignt-dialog-header>
<ignt-dialog-content>
  <div class="add-google-font">
    <div class="add-google-font__field">
      <label class="add-google-font__label" for="add-google-font-url">
        {{ 'whitelabelFontsAddGoogle.urlLabel' | translate }}
      </label>
      <input
        id="add-google-font-url"
        type="url"
        class="add-google-font__input"
        [formControl]="urlControl"
        autocomplete="off"
        placeholder="https://fonts.googleapis.com/css2?family=..."
        data-testid="add-google-font-url"
      />
      <p class="add-google-font__hint">{{ 'whitelabelFontsAddGoogle.hint' | translate }}</p>
      @if (errorKey(); as key) {
        @if (urlControl.dirty || urlControl.touched) {
          <p class="add-google-font__error" role="alert" data-testid="add-google-font-error">
            {{ key | translate }}
          </p>
        }
      }
    </div>
  </div>
</ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <button type="button" igntButton sentiment="secondary" [disabled]="submitting()" (click)="onCancel()">
    {{ 'common.cancel' | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    [loading]="submitting()"
    [disabled]="!canSubmit()"
    (click)="onSubmit()"
    data-testid="add-google-font-submit"
  >
    {{ 'whitelabelFontsAddGoogle.submit' | translate }}
  </button>
</ignt-dialog-footer>
