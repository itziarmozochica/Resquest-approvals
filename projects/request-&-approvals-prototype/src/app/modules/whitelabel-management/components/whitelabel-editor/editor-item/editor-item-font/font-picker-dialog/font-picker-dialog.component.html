<ignt-dialog-header>{{ 'whitelabelFonts.pickerDialog.title' | translate }}</ignt-dialog-header>
<ignt-dialog-content>
  <app-whitelabel-fonts
    [whitelabelId]="data.whitelabelId"
    [canManageWhitelabels]="canManageWhitelabels"
    [selectable]="true"
    [styleContext]="styleContext"
    (fontSelected)="onFontSelected($event)"
  />
</ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <button type="button" igntButton sentiment="secondary" (click)="onCancel()">
    {{ 'common.cancel' | translate }}
  </button>
</ignt-dialog-footer>
