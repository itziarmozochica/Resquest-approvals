<aside class="whitelabel-editor-preview" [attr.aria-label]="'whitelabelEditor.previewAriaLabel' | translate">
  <div class="whitelabel-editor-preview__frame">
    <div class="whitelabel-editor-preview__chrome" aria-hidden="true">
      <div class="whitelabel-editor-preview__tab-row">
        <div class="whitelabel-editor-preview__window-controls">
          <span class="whitelabel-editor-preview__window-dot whitelabel-editor-preview__window-dot--close"></span>
          <span class="whitelabel-editor-preview__window-dot whitelabel-editor-preview__window-dot--minimize"></span>
          <span class="whitelabel-editor-preview__window-dot whitelabel-editor-preview__window-dot--maximize"></span>
        </div>
        <div class="whitelabel-editor-preview__tab whitelabel-editor-preview__tab--active">
          <span class="whitelabel-editor-preview__tab-favicon"></span>
          <span class="whitelabel-editor-preview__tab-title">{{ 'whitelabelEditor.previewMock.tabTitle' | translate }}</span>
          <ignt-icon class="whitelabel-editor-preview__tab-close" name="times" variant="light" size="sm" />
        </div>
        <span class="whitelabel-editor-preview__new-tab">
          <ignt-icon name="plus" variant="light" size="sm" />
        </span>
        <span class="whitelabel-editor-preview__tab-spacer"></span>
      </div>
      <div class="whitelabel-editor-preview__toolbar">
        <div class="whitelabel-editor-preview__nav">
          <ignt-icon class="whitelabel-editor-preview__nav-icon" name="arrow-left" variant="light" size="sm" />
          <ignt-icon
            class="whitelabel-editor-preview__nav-icon whitelabel-editor-preview__nav-icon--disabled"
            name="arrow-right"
            variant="light"
            size="sm"
          />
          <ignt-icon class="whitelabel-editor-preview__nav-icon" name="home" variant="light" size="sm" />
        </div>
        <div class="whitelabel-editor-preview__address-bar">
          <ignt-icon class="whitelabel-editor-preview__address-lock" name="lock-alt" variant="light" size="sm" />
          <span class="whitelabel-editor-preview__url">{{ 'whitelabelEditor.previewMock.url' | translate }}</span>
          <ignt-icon class="whitelabel-editor-preview__address-star" name="star" variant="light" size="sm" />
        </div>
        <ignt-icon class="whitelabel-editor-preview__menu" name="ellipsis-v" variant="light" size="sm" />
      </div>
    </div>

    <div class="whitelabel-editor-preview__viewport">
      <div class="whitelabel-editor-preview__page">
        <main class="whitelabel-editor-preview__page-main whitelabel-editor-preview__page-main--placeholder">
          <p class="whitelabel-editor-preview__placeholder-title">{{ 'whitelabelEditor.previewPlaceholder' | translate }}</p>
          <p class="whitelabel-editor-preview__placeholder-hint">{{ 'whitelabelEditor.previewPlaceholderHint' | translate }}</p>
        </main>
      </div>
    </div>
  </div>
</aside>
