<div class="editor-select">
  <label class="editor-select__label" [attr.for]="inputId()">{{ label() }}</label>

  <ng-select
    class="editor-select__control"
    bindLabel="searchText"
    [attr.data-testid]="testId()"
    [clearable]="false"
    [compareWith]="sameOption"
    [groupBy]="groupBy()"
    [items]="items()"
    [labelForId]="inputId()"
    [ngModel]="selectedOption()"
    [placeholder]="placeholder()"
    [searchable]="searchable()"
    (ngModelChange)="onChange($event)"
  >
    <ng-template ng-label-tmp let-item="item">
      <span class="editor-select__current">{{ item.label }}</span>
    </ng-template>
    <ng-template ng-optgroup-tmp let-item="item">
      <span class="editor-select__group">{{ item.group }}</span>
    </ng-template>
    <ng-template ng-option-tmp let-item="item">
      <span class="editor-select__option">
        <span class="editor-select__option-label">{{ item.label }}</span>
        @if (item.detail) {
          <span class="editor-select__option-detail">{{ item.detail }}</span>
        }
      </span>
    </ng-template>
  </ng-select>
</div>
