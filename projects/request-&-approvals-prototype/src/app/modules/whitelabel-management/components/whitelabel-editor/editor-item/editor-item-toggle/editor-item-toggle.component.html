<div class="editor-item editor-item--toggle">
  @if (isStructuredValue()) {
    <span class="editor-item__label" [id]="labelId()">{{ 'whitelabelEditor.items.' + item().key | translate }}</span>
    <p class="editor-item__hint" data-testid="editor-item-toggle-structured">{{ 'whitelabelEditor.toggleItem.structured' | translate }}</p>
  } @else {
    <div class="editor-item-toggle__control">
      <ignt-toggle data-testid="editor-item-toggle" [id]="inputId()" [checked]="switchValue()" (change)="onToggled($event)" />
      <label class="editor-item__label" [attr.for]="inputId()" [id]="labelId()">
        {{ 'whitelabelEditor.items.' + item().key | translate }}
      </label>
    </div>
    @if (item().key | editorItemHint; as hint) {
      <p class="editor-item__hint">{{ hint }}</p>
    }
  }

  @if (hasEdits()) {
    <div class="editor-item__footer">
      <span class="editor-item__status editor-item__status--pending" data-testid="editor-item-toggle-unsaved">
        {{ 'whitelabelEditor.unsavedChanges' | translate }}
      </span>
      <ignt-button
        variant="tertiary"
        sentiment="neutral"
        size="small"
        data-testid="editor-item-toggle-discard"
        [label]="'common.undo' | translate"
        (click)="discardEdits()"
      />
    </div>
  }
</div>
