<input #fileInput type="file" class="d-none" [attr.accept]="accept()" (change)="onFileChange($event)" />
@if (label()) {
  <ignt-button
    class="editor-item__upload-btn"
    variant="secondary"
    size="small"
    [fill]="block()"
    [label]="label()"
    [leadingIcon]="uploadIcon"
    (click)="fileInput.click()"
  />
} @else {
  <button
    type="button"
    ignt-icon-button
    [icon]="['fal', 'upload']"
    sentiment="secondary"
    size="medium"
    [attr.title]="'common.upload' | translate"
    [attr.aria-label]="'common.upload' | translate"
    (click)="fileInput.click()"
  ></button>
}
