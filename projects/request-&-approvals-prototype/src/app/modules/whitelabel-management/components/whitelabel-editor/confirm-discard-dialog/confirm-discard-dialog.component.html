<ignt-dialog-header hideCloseButton>{{ title }}</ignt-dialog-header>
<ignt-dialog-content>{{ message }}</ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <button type="button" igntButton sentiment="secondary" [igntDialogClose]="false">
    {{ cancelButtonLabel }}
  </button>
  <button type="button" igntButton sentiment="primary" variant="danger" [igntDialogClose]="true">
    {{ acceptButtonLabel }}
  </button>
</ignt-dialog-footer>
