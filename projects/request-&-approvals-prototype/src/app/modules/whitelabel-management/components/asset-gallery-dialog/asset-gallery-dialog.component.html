<ignt-dialog-header>{{ 'assetGalleryDialog.title.' + data.itemType | translate }}</ignt-dialog-header>
<ignt-dialog-content>
  <app-whitelabel-media-gallery
    [whitelabelId]="data.whitelabelId"
    [canManageWhitelabels]="canManageWhitelabels"
    [selectable]="true"
    [itemType]="data.itemType"
    (assetSelected)="onAssetSelected($event)"
  />
</ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <button type="button" igntButton sentiment="secondary" (click)="onCancel()">
    {{ 'common.cancel' | translate }}
  </button>
  <button
    type="button"
    igntButton
    sentiment="primary"
    [disabled]="!selected()"
    (click)="onConfirm()"
    data-testid="asset-gallery-dialog-select"
  >
    {{ 'assetGalleryDialog.select' | translate }}
  </button>
</ignt-dialog-footer>
