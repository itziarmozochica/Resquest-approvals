<main class="reschedule-modal" data-testid="who-pays-reschedule-modal">
  <div class="reschedule-modal__title" data-testid="modal-title">
    {{ 'reschedule.modal.title' | translate }}
  </div>
  <form class="reschedule-modal__wrapper form" [formGroup]="formGroup">
    <label class="form__label" [innerHTML]="'reschedule.modal.description' | translate"> </label>
    <ignt-radio-group formControlName="rescheduleFlow" class="reseller-form__radio-group">
      <ignt-list-item
        *ngFor="let rescheduleFlow of rescheduleFlows"
        [title]="'reschedule.modal.options.' + rescheduleFlow.value + '.title' | translate"
        [description]="'reschedule.modal.options.' + rescheduleFlow.value + '.description' | translate"
        (click)="selectRescheduleFlow(rescheduleFlow.value)"
        [selected]="formGroup.controls['rescheduleFlow'].value === rescheduleFlow.value"
        class="reschedule-form__radio-item"
        [attr.data-testid]="'reschedule-option-' + rescheduleFlow.value"
        [attr.data-test-id]="'reschedule-option-' + rescheduleFlow.value"
        [leadingIconTemplate]="icon"
      >
        <ng-template #icon>
          <div [class]="'reschedule-form__type-icon reschedule-form__type-icon--' + rescheduleFlow.value">
            <ignt-radio [value]="rescheduleFlow.value" name="groupRadio" class="reschedule-radio"></ignt-radio>
          </div>
        </ng-template>
      </ignt-list-item>
    </ignt-radio-group>
  </form>
  <div class="action-footer">
    <button igntButton sentiment="tertiary" (click)="onCancel()" data-testid="who-pays-cancel">
      {{ 'common.cancel' | translate }}
    </button>
    <button igntButton (click)="onSubmit()" [disabled]="!formGroup.valid" data-testid="who-pays-confirm">
      {{ 'common.confirm' | translate }}
    </button>
  </div>
</main>
