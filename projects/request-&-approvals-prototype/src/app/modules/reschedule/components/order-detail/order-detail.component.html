<cart-detail
  [cart]="fusedSessionsCart"
  [rescheduledSessionDate]="rescheduledSessionDate"
  [collapsable]="true"
  [isCollapsed]="false"
  [showClearAll]="false"
  [showDiscount]="false"
  [showPaymentDetails]="true"
  [showSeatingInModal]="true"
  [showSessionDate]="true"
  [title]="'reschedule.order.detail.title'"
  scope="order-reschedule"
  class="reschedule-order-cart"
  [orderId]="order?.id"
  [orderCancellationRecords]="order?.userCancellationRecords ?? null"
></cart-detail>
