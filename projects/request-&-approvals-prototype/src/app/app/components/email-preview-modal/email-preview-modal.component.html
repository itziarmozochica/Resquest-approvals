<div class="email-preview-modal">
  <div class="email-preview-modal__header">
    <h2 class="email-preview-modal__title">
      {{ data.i18n.title | translate }}
    </h2>
  </div>
  <div class="email-preview-modal__separator"></div>
  <div class="email-preview-modal__content">
    @if (isLoading()) {
      <ignt-skeleton [animation]="true" type="paragraph"></ignt-skeleton>
    } @else if (errorMessageKey()) {
      <div class="email-preview-modal__error">
        <p>{{ errorMessageKey()! | translate }}</p>
      </div>
    } @else if (emailPreviewHtml()) {
      <iframe
        #emailIframe
        class="email-preview-modal__iframe"
        [srcdoc]="emailPreviewHtml()"
        [title]="data.i18n.title | translate"
        sandbox="allow-same-origin"
        data-testid="email-preview-iframe"
        (load)="onIframeLoad()"
      ></iframe>
    }
  </div>
  <div class="email-preview-modal__actions" [class.email-preview-modal__actions--single-dismiss]="data.hideConfirmButton === true">
    <button igntButton sentiment="secondary" data-testid="email-preview-keep-editing-button" (click)="onKeepEditing()">
      {{ data.i18n.keepEditingButton | translate }}
    </button>
    @if (data.hideConfirmButton !== true) {
      <button igntButton sentiment="primary" [disabled]="isLoading()" data-testid="email-preview-confirm-button" (click)="onConfirm()">
        {{ confirmButtonText() | translate }}
      </button>
    }
  </div>
</div>
