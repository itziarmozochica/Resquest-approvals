<div class="search-results">
  <ng-container *ngIf="currentState !== stateEnum.noFiltersSelected; else noFiltersTemplate ?? noFilterSelected">
    <ng-container *ngIf="currentState === stateEnum.noResults" [ngTemplateOutlet]="noResultsTemplate ?? noResults"></ng-container>
    <ng-container
      *ngIf="currentState === stateEnum.withResults || currentState === stateEnum.loading"
      [ngTemplateOutlet]="withResults"
    ></ng-container>
    <ng-container *ngIf="currentState === stateEnum.error" [ngTemplateOutlet]="errorTemplate ?? error"></ng-container>
  </ng-container>
</div>

<ng-template #withResults>
  <ng-content></ng-content>
  <ng-container *ngIf="currentState === stateEnum.loading" [ngTemplateOutlet]="loading"></ng-container>
</ng-template>

<ng-template #noResults>
  <ng-container *ngIf="displayContentWithNoResults" [ngTemplateOutlet]="withResults"></ng-container>
  <div data-testid="search-results-no-results" class="search-results__no-results">
    <fa-icon *ngIf="noResultIcon" class="state-icon" [icon]="noResultIcon"></fa-icon>
    <div>{{ noResultMessage }}</div>
  </div>
</ng-template>

<ng-template #loading>
  <div data-testid="search-results-loading" class="spinner">
    <fa-icon class="loader" [icon]="['fas', 'spinner']" [size]="'3x'"></fa-icon>
  </div>
</ng-template>

<ng-template #noFilterSelected>
  <div data-testid="search-results-no-filters-selected" class="search-results__no-filters-selected">
    <fa-icon *ngIf="noFiltersIcon" class="state-icon" [icon]="noFiltersIcon"></fa-icon>
    <div>{{ noFiltersMessage }}</div>
  </div>
</ng-template>

<ng-template #error>
  <div data-testid="search-results-error" class="search-results__error">
    <ignt-alert sentiment="danger" [description]="errorMessage" />
  </div>
</ng-template>
