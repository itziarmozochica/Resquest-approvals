<ignt-dialog-header data-testid="print-retry-dialog-title" hideCloseButton>{{ data.title }}</ignt-dialog-header>
<ignt-dialog-content>
  <p class="print-retry-dialog__message" data-testid="print-retry-dialog-message" [innerHTML]="data.message"></p>
</ignt-dialog-content>
<ignt-dialog-footer hideCancelButton>
  <ignt-button variant="tertiary" data-testid="print-retry-dialog-cancel" [igntDialogClose]="false" [label]="data.cancelLabel" />
  <ignt-button variant="primary" data-testid="print-retry-dialog-retry" [igntDialogClose]="true" [label]="data.retryLabel" />
</ignt-dialog-footer>
