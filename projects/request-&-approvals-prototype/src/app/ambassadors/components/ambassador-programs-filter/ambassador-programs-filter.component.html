<div class="ambassador-programs-filter">
  <div class="ambassador-programs-filter__title" data-testid="page-title">
    {{ 'ambassadorOverview.programs.ambassadorPrograms' | translate }}
  </div>
  <div class="ambassador-programs-filter__fields">
    <ignt-typeahead
      class="ambassador-programs-filter__field"
      data-testid="ambassador-programs-filter__partner"
      [emptyLabel]="'common.partners' | translate"
      [fieldLabel]="'common.partners' | translate"
      [options]="partnerOptions"
      [editable]="true"
      (selected)="selectAmbassadorProgram($event)"
      [selectedOption]="selectedPartner"
    />
    <ignt-typeahead
      *ngIf="channelOptions.length > 1"
      class="ambassador-programs-filter__field"
      data-testid="ambassador-programs-filter__channel"
      [fieldLabel]="'ambassadorOverview.programs.ambassadorPrograms' | translate"
      [emptyLabel]="'ambassadorOverview.programs.ambassadorPrograms' | translate"
      [options]="channelOptions"
      (selected)="selectChannel($event)"
      [selectedOption]="selectedChannel"
    >
    </ignt-typeahead>
  </div>
</div>
