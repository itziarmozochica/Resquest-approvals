<div class="ambassador-programs-search-filter">
  <div class="ambassador-programs-search-filter__title" data-testid="page-title">
    {{ 'ambassadorOverview.programs.ambassadorPrograms' | translate }}
  </div>
  <div class="ambassador-programs-search-filter__fields">
    <ignt-input-field
      class="ambassador-programs-search-filter__field"
      data-testid="ambassador-programs-search-filter__search"
      [label]="'ambassadorOverview.programs.search.label' | translate"
      [placeholder]="'ambassadorOverview.programs.search.placeholder' | translate"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchTermChange($event)"
      type="text"
    />
  </div>
</div>
