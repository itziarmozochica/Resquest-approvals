<div class="ambassador-program-redeemed">
  <header class="ambassador-program-redeemed__page-header">
    <button
      class="ambassador-program-redeemed__back-button"
      (click)="goToEventHome()"
      data-testid="ambassador-program-redeemed__back-button"
    >
      {{ 'ambassadorProgram.redeemed.backTo' | translate }} {{ program.title }}
    </button>
    <h1 class="ambassador-program-redeemed__page-title" data-testid="ambassador-program-redeemed__info-reward-title">
      {{ redeemedReward.rewardTitle }}
    </h1>
  </header>

  <div class="ambassador-program-redeemed__info-content">
    <img
      [src]="program.image"
      class="ambassador-program-redeemed__info-image"
      data-testid="ambassador-program-redeemed__program-image"
      [alt]="program.title"
    />
    <div class="ambassador-program-redeemed__info-details">
      <h2 class="ambassador-program-redeemed__info-title">{{ 'ambassadorProgram.redeemed.title' | translate }}</h2>
      <p class="ambassador-program-redeemed__info-subtitle">
        {{ 'ambassadorProgram.redeemed.subtitle' | translate }}
      </p>
    </div>
  </div>

  <div class="ambassador-program-redeemed__content">
    <ignt-alert
      [description]="('ambassadorProgram.redeemed.emailSent.description' | translate) + ' (' + (userEmail$ | async) + ')'"
    ></ignt-alert>

    <div class="ambassador-program-redeemed__content-section">
      <div class="ambassador-program-redeemed__section">
        <ignt-info-card
          [icon]="['fal', 'badge-percent']"
          [title]="'ambassadorProgram.redeemed.redemptionCode.title' | translate"
          [description]="'ambassadorProgram.redeemed.redemptionCode.description' | translate"
          [copyText]="redemptionCode"
          [copyButtonText]="'copy' | translate"
          [copyButtonTextSuccess]="'copiedToClipboard' | translate"
          variant="copy-clip"
          data-testid="ambassador-program-redeemed__reward-code"
        >
        </ignt-info-card>
      </div>

      <div class="ambassador-program-redeemed__section">
        <ignt-info-card
          [icon]="['far', 'info-circle']"
          [title]="'ambassadorProgram.redeemed.howToUse.title' | translate"
          [description]="'ambassadorProgram.redeemed.howToUse.description' | translate"
          [linkText]="'ambassadorProgram.redeemed.howToUse.seeHow' | translate"
          [linkUrl]="redeemedReward.redeemInstructionsLink"
          variant="link"
        >
        </ignt-info-card>
      </div>

      <div class="ambassador-program-redeemed__section">
        <ignt-info-card
          [icon]="['fal', 'user-headset']"
          [title]="'ambassadorProgram.redeemed.contactSupport.title' | translate"
          [description]="'ambassadorProgram.redeemed.contactSupport.description' | translate"
          [linkText]="'ambassadorOverview.programs.contactSupport' | translate"
          [linkUrl]="'mailto:' + program.contactSupportEmail"
          variant="link"
        >
        </ignt-info-card>
      </div>
    </div>
  </div>
</div>
