              stroke-dashoffset: 330.663px;
            }

            #Fill-5 {
              stroke-dasharray: 162.165px;
              stroke-dashoffset: 162.165px;
            }

            @keyframes draw {
              100% {
                stroke-dashoffset: 0;
              }
            }

            @keyframes fillopacity {
              0%,
              70% {
                fill-opacity: 0;
                stroke-width: 0.5%;
              }

              100% {
                fill-opacity: 1;
                stroke-width: 0;
              }
            }
          </style>
