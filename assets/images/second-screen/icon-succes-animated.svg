<svg
  width="165"
  height="165"
  viewBox="0 0 165 165"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <style>
      .circle-check {
        transform-origin: center;
        animation: zoomIn 500ms linear;
      }

      .circle-shadow {
        transform-origin: center;
        opacity: 0;
        animation: shadow 500ms linear 300ms forwards;
      }

      .sparkles {
        transform-origin: center;
        opacity: 0;
        animation: sparkles 500ms linear 300ms forwards;
      }

      @keyframes zoomIn {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        70% {
          transform: scale(1.1);
        }
        80% {
          transform: scale(0.9);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes shadow {
        0% {
          opacity: 0.5;
          transform: scale(0.5);
        }
        50% {
          opacity: 1;
          transform: scale(0.9);
        }
        90% {
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes sparkles {
        0% {
          opacity: 0.5;
          transform: scale(0.5) rotate(0deg);
        }
        50% {
          opacity: 1;
          transform: scale(0.9) rotate(-15deg);
        }
        90%,
        100% {
          opacity: 0;
          transform: scale(1) rotate(-25deg);
        }
      }
    </style>
  </defs>
